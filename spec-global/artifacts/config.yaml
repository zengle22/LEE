# LEE Artifact Management System Configuration
# 版本: v2.1

# 产出物类型定义
artifact_types:
  CONTRACT:
    description: "契约类产出物 - 需求、API、测试等正式文档"
    categories:
      - frozen_prd
      - api_contract
      - test_plan
      - design_doc

  DOCUMENT:
    description: "文档类产出物 - 说明、记录、总结等"
    categories:
      - readme
      - usage_guide
      - investigation_report
      - handover_doc

  CODE_REF:
    description: "代码引用类 - 通过 git SHA 引用代码"
    categories:
      - implementation
      - config
      - script

  PATCH:
    description: "补丁类 - git patch 文件"
    categories:
      - feature_patch
      - bugfix_patch
      - refactor_patch

  TEST:
    description: "测试类产出物"
    categories:
      - test_report
      - test_case
      - coverage_report

  HANDOVER:
    description: "移交类产出物 - 部门间或阶段间移交"
    categories:
      - to_qa
      - to_backend
      - to_frontend
      - to_devops

  LOG:
    description: "日志类产出物"
    categories:
      - execution_log
      - error_log
      - debug_log

  INTERMEDIATE:
    description: "中间产物 - 临时文件、草稿等"
    categories:
      - draft
      - temp
      - scratch

# 产出物状态
status_values:
  - DRAFT      # 草稿状态，可编辑
  - ACTIVE     # 活跃状态，正在使用
  - FROZEN     # 冻结状态，不可变
  - ARCHIVED   # 归档状态，长期存储
  - DEPRECATED # 废弃状态

# 部门定义 (用于 active/ 目录组织)
departments:
  - pm          # 产品管理
  - backend     # 后端开发
  - frontend    # 前端开发
  - qa          # 测试
  - devops      # 运维
  - data        # 数据
  - design      # 设计

# 保留策略
retention_policy:
  draft:
    max_age_days: 7
    auto_cleanup: true
  active:
    max_age_days: 90
    auto_cleanup: false
  frozen:
    max_age_days: null  # 永久保留
    auto_cleanup: false
  archived:
    max_age_days: 365
    auto_cleanup: false

# 路径配置
paths:
  artifacts_root: ".artifacts"
  active_dir: "active"
  frozen_dir: "frozen"
  archive_dir: "archive"
  logs_dir: "logs"
  cache_dir: "cache"
  sequence_file: ".artifacts/.sequence"

# 引用保护配置
reference_protection:
  enabled: true
  scan_depth: 10  # 扫描最近 N 个 run 的 manifest

# Adopt 模式配置
adopt_modes:
  copy_mode:
    description: "复制文件内容到 .artifacts/"
    default_for_types:
      - DOCUMENT
      - TEST
      - HANDOVER
      - LOG
      - INTERMEDIATE
  reference_mode:
    description: "仅保存 git 引用 (SHA + path)"
    default_for_types:
      - CODE_REF
      - PATCH
