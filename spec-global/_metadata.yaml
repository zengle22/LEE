# ============================================
# 控制流支持声明
# ============================================
#
# **重要**: Spec-Global 的 workflow.yaml 中某些高级控制流特性
# 在 v3.1 适配初期可能不完全支持。以下是明确的"支持子集"声明。
#
control_flow_support:
  # ✅ 完全支持
  fully_supported:
    - simple_sequential          # 简单串行执行
    - dependencies.requires       # 前置依赖 (单依赖)
    - human_gate                 # 人类门禁 (blocking/non-blocking)
    - conditional_human_gate    # Agent 驱动的条件门禁
    - output_contract            # 输出契约验证
    - output_validation          # 输出产物验证

  # 🟡 部分支持 (有语义损失风险)
  partially_supported:
    - parallel_with              # 并行执行 (v3.1 初期只支持简单并行)
    - for_each                   # 循环执行 (v3.1 初期不支持)
    - triggered_by               # 触发式执行 (v3.1 初期不支持)
    - subworkflow                # 子工作流 (v3.1 通过 spawn 支持)
    - on_success/on_failure       # 成功/失败分支 (v3.1 简化为状态转换)

  # ❌ 暂不支持 (会被 WARN/FAIL FAST)
  not_supported_yet:
    - complex_parallel_groups    # 复杂并行组
    - dynamic_conditional_branches  # 动态条件分支
    - retry_with_backoff         # 带退避的重试 (v3.1 只有简单重试)
    - compensation_transactions  # 补偿事务

  # ⚠️ 语义转换警告
  conversion_warnings:
    - parallel: "v3.1 初期会将 parallel_with 简化为串行执行，语义可能损失"
    - for_each: "v3.1 初期不支持 for_each，需要由 Agent 展开后手动执行"
    - remediation: "v3.1 将 remediation 机制转为状态机循环，可能需要人工介入"

# ============================================
# Contract 验证失败语义
# ============================================
#
# **重要**: 明确 Contract 验证失败时的状态语义
#
contract_validation_semantics:
  validation_failure:
    # 策略 A (推荐): 验证失败 = BLOCKED 状态
    strategy_a:
      name: "blocked_until_fix"
      description: "验证失败时，workflow 进入 BLOCKED 状态，等待修复"
      state_transition: "RUNNING → BLOCKED"
      human_intervention: "required"
      allowed_actions:
        - 修复后重试 (retry_step)
        - 人工标记为完成 (force_complete_with_warning)
        - 人工终止 (terminate)
      implementation_notes: |
        在 StateMachine.complete_step 中检测 contract 验证失败：
        1. 更新 workflow_status = BLOCKED
        2. 在 data.validation_errors 中记录失败原因
        3. 在 data.pending_fix 中记录需要修复的 step_id
        4. 禁止自动执行下一步

    # 策略 B: 验证失败 = FAILED 状态
    strategy_b:
      name: "fail_fast"
      description: "验证失败时，workflow 直接进入 FAILED 状态"
      state_transition: "RUNNING → FAILED"
      human_intervention: "required"
      allowed_actions:
        - 修复后重新运行 (retry_workflow)
        - 分析失败原因 (investigate)
      implementation_notes: |
        在 StateMachine.complete_step 中检测 contract 验证失败：
        1. 更新 workflow_status = FAILED
        2. 在 data.validation_errors 中记录失败原因
        3. 禁止任何继续操作

  # 默认策略
  default_strategy: "blocked_until_fix"

  # 验证模式说明
  validation_modes:
    strict: |
      validation_mode: strict 意味着：
      - 所有 required 字段必须存在
      - 类型必须精确匹配
      - 额外字段不允许
      - 验证失败时执行 strategy_a

    warn: |
      validation_mode: warn 意味着：
      - 只记录警告，不阻塞执行
      - 用于非关键产物的验证

    skip: |
      validation_mode: skip 意味着：
      - 完全跳过验证
      - 仅用于测试或开发阶段

# ============================================
# Gate 多实例处理规范
# ============================================
#
# **重要**: 明确多个 workflow 同时有 pending gate 时的处理方式
#
gate_multi_instance_rules:
  # 规则 1: Gate 是 per-workflow 的
  rule_1_per_workflow:
    description: "每个 workflow 同一时间只能有一个 pending_gate"
    enforcement: "strict"
    violation_handling: "FAIL_FAST"
    violation_message: |
      Workflow {workflow_id} 已有 pending_gate {existing_gate_id}，
      不能同时处理多个 gate。

  # 规则 2: Gate 识别需要完整上下文
  rule_2_full_context:
    description: "Gate UI / Gate Agent 需要显示完整上下文"
    required_fields:
      - workflow_id
      - workflow_level          # project / department / task
      - workflow_name
      - gate_id
      - gate_type              # approval / review / decision
      - gate_purpose
      - required_roles
      - checklist
      - inputs_to_review
    optional_fields:
      - parent_workflow_id     # 对于 L2/L3，显示 L1 父流程
      - phase_number           # 对于 Phase，显示 Phase 编号
      - step_name              # 当前所在步骤名称

  # 规则 3: Gate 审批权限验证
  rule_3_permission_check:
    description: "只有 required_roles 中的角色才能审批 gate"
    enforcement: "strict"
    permission_mapping:
      tech_lead: [gate.dev.h0_project_init_review, gate.dev.h1_plan_review, gate.dev.h2_integration_review]
      product_owner: [gate.dev.h1_plan_review, gate.dev.h3_acceptance_review]
      dev_role: [gate.dev.*]  # 任何 dev 角色可以审批 dev 部门的非关键 gate

  # 规则 4: Gate 超时处理
  rule_4_timeout_handling:
    description: "Gate 超时后的处理策略"
    timeout_actions:
      escalate: "升级到更高层级的审批者"
      auto_approve: "条件满足时自动通过（危险，慎用）"
      fail: "标记为 FAILED，终止 workflow"
    default_action: "escalate"

# ============================================
# 迁移优先级
# ============================================
#
# **建议的迁移顺序**（基于评审意见中的"先做黄金路径"）
#
migration_phases:
  # Phase 0: 准备
  - phase: "准备和规划"
    workflows:
      - workflow.dev.development_pipeline
      - workflow.dev.phase_openspec_flow
    priority: P0
    success_criteria:
      - WorkflowLoader 能正确解析这两个 workflow
      - TemplateManager 能正确注册
      - 能创建 WorkflowInstance

  # Phase 1: 黄金路径 (单个 L2 + 一个 L3)
  - phase: "黄金路径验证"
    description: |
      用一个完整的 L2 (development_pipeline) + 一个 L3 (phase_openspec_flow)
      走通端到端流程，验证所有映射关系
    workflows:
      - workflow.dev.development_pipeline (L2)
      - workflow.dev.phase_openspec_flow (L3)
    test_scenario: |
      1. L2 spawn L3 (phase_openspec_flow)
      2. L3 执行到 gate 停止
      3. 审批 gate
      4. L3 继续
      5. L3 完成，L2 继续
      6. L2 执行到下一个 gate
    priority: P0
    success_criteria:
      - L2 → L3 嵌套执行正常
      - Gate 审批流程正常
      - Contract 验证正常
      - Agent 调用正常
      - EventBus 事件记录正常

  # Phase 2: 扩展到所有 Dev 部门 workflows
  - phase: "Dev 部门全量"
    workflows:
      - workflow.dev.development_pipeline
      - workflow.dev.phase_openspec_flow
      - workflow.dev.dev_retest
    priority: P1

  # Phase 3: 跨部门 workflows
  - phase: "跨部门集成"
    workflows:
      - workflow.cross.product_pipeline
      - workflow.prd.product_pipeline
      - workflow.qa.testing_pipeline
    priority: P1

  # Phase 4: 全量迁移
  - phase: "全量迁移"
    description: "迁移所有 134 个 spec 文件"
    priority: P2

