# Spec-Global 元数据注册表
#
# **目的**: 记录所有 Spec-Global 规范到 v3.1 Orchestrator 的映射关系
# **版本**: 1.1
# **适配目标**: LEE Orchestrator v3.1
# **更新日期**: 2026-01-28
#
# **使用说明**:
# - workflow_registry: 注册所有 workflow.yaml 到 v3.1 的映射
# - agent_registry: 注册所有 agent.yaml 到 v3.1 Agent 系统的映射
# - contract_registry: 注册所有 contract 到 v3.1 Validator 系统的映射
# - level_registry: 定义每个 workflow 的默认层级
#
# **注意**: 本文件由 WorkflowLoader 在加载时自动读取，确保映射关系正确
#
# **目录层级约定**（L1/L2/L3 与物理目录的映射）:
# - 物理目录结构 = Scope / 参与边界
# - metadata.owner = 组织责任人
#
# | 层级 | v3.1 level | 物理目录位置 | workflow_id 命名 |
# |------|-----------|-------------|-----------------|
# | L1   | project   | cross/workflows/project/            | workflow.cross.*  |
# | L2   | department| departments/{dept}/workflows/      | workflow.{dept}.* |
# | L3(跨部门) | task | cross/workflows/task/              | workflow.cross.task.* |
# | L3(部门内) | task  | departments/{dept}/workflows/子目录/ | workflow.{dept}.task.* |
#
# **Cross 二级目录结构**（防止 L1/L3 混淆）:
# cross 表示"跨部门"，不是"L1 专用"。在 cross/workflows 下按 level 再分一层：
# - cross/workflows/project/ → L1：项目级 / 产品级主流程
# - cross/workflows/task/ → L3：跨部门任务型 workflow
# - cross/workflows/lib/ → 可选：可复用子流程 / fragment
#
# **几条简单记忆规则**:
# 1. 凡是 L1（project 级）→ 一律放 cross/workflows/project/
# 2. 凡是跨部门但不是大项目主链路、而是一类"可被调用的任务" → 放 cross/workflows/task/
# 3. 某个部门自己的小任务 → 放 departments/{dept}/workflows/ 下的子目录

version: "1.0"
orchestrator_version: "3.1"
compatible_since: "3.1"

# ============================================
# Workflow 注册表
# ============================================
workflow_registry:
  # ============================================
  # 跨部门工作流 (L1 - Project 级)
  # ============================================
  - id: workflow.cross.product_pipeline
    path: cross/workflows/project/product-pipeline/v1/workflow.yaml
    level: project
    description: "产品决策流水线 - Stage 2 产品设计"
    stages_count: 4
    steps_count: ~15
    human_gates_count: 4
    v3_1_compatible: true
    notes: |
      包含 4 个子阶段：
      - value_definition (价值定义)
      - problem_definition (问题定义)
      - solution_design (方案设计)
      - delivery_planning (交付规划)

  # ============================================
  # Dev 部门工作流 (L2 - Department 级)
  # ============================================
  - id: workflow.dev.development_pipeline
    path: departments/dev/workflows/development-pipeline/v1/workflow.yaml
    level: department
    description: "研发部门 - 研发流水线 (Stage 3)"
    version: "1.2"
    stages_count: 7
    steps_count: ~20
    human_gates_count: 4
    v3_1_compatible: true
    notes: |
      L2 级工作流，包含：
      - s3_0: 项目初始化 (Tech Lead 创建 project.yaml)
      - s3_1: 研发规划
      - s3_2: 研发调度执行
      - s3_3: 集成
      - s3_4: E2E 测试 + 安全扫描
      - s3_5: 交付门禁
      - s3_6: 复盘与知识沉淀

      每个执行步骤都有对应的 agent 引用：
      - agent.dev.tech_lead
      - agent.dev.development_planner
      - agent.dev.qa_engineer
      - agent.dev.test_automation_engineer
      - agent.dev.secops
      - ...

  - id: workflow.dev.phase_openspec_flow
    path: departments/dev/workflows/phase-openspec-flow/v1/workflow.yaml
    level: task
    description: "Phase 内 OpenSpec 子流程 (L3)"
    version: "1.7"
    steps_count: 13
    human_gates_count: 3
    v3_1_compatible: true
    notes: |
      L3 级工作流（最小执行单元），包含 13 个强制步骤：
      - p1: OpenSpec 初始化
      - p2: 需求校准
      - p3: 测试契约生成 (QA Engineer - 硬边界)
      - p4: OpenSpec 变更提案
      - p5: 代码实现
      - p6: 单元测试 (SDET - 硬边界)
      - p7: Code Review (条件人类门禁)
      - p8: Phase 复盘
      - p9: 知识沉淀
      - p10: OpenSpec 归档
      - p11: Phase 验收 (强制门禁)
      - p12: 知识合并到项目级
      - p13: Phase 交接

      特殊机制：
      - enforcement: 防跳过/防绕过
      - remediation: 整改循环 (max 5 次)
      - conditional_human_gate: Agent 驱动的条件门禁

  - id: workflow.dev.dev_retest
    path: departments/dev/workflows/dev-retest/v1/workflow.yaml
    level: task
    description: "Dev 部门 - 代码修复流程"
    v3_1_compatible: true

  - id: workflow.dev.bug_fix
    path: departments/dev/workflows/bug-fix/v1/workflow.yaml
    level: task
    description: "Dev 部门 - Bug 修复工作流"
    version: "1.0"
    v3_1_compatible: true

  # ============================================
  # QA 部门工作流 (L2 - Department 级)
  # ============================================
  - id: workflow.qa.testing_pipeline
    path: departments/qa/workflows/testing-pipeline/v1/workflow.yaml
    level: department
    description: "QA 部门 - 测试流水线"
    v3_1_compatible: true

  - id: workflow.qa.test_main_pipeline
    path: departments/qa/workflows/test-main-pipeline/v2/workflow.yaml
    level: department
    description: "QA 部门 - 主测试流程"
    version: "2.0"
    v3_1_compatible: true

  - id: workflow.qa.test_case_design_pipeline
    path: departments/qa/workflows/test-case-design-pipeline/v1/workflow.yaml
    level: department
    description: "QA 部门 - 测试用例设计流水线（从需求到E2E脚本）"
    version: "1.0"
    stages_count: 7
    steps_count: ~25
    human_gates_count: 2
    v3_1_compatible: true
    notes: |
      L2 级工作流，完整的测试用例设计流程：
      - s1: 输入验证（PRD/架构/UI契约）
      - s2: 需求对齐（三方一致性验证）
      - s3: 功能点校准（PRD↔架构↔UI映射）
      - s4: 分支覆盖设计（决策点分析）
      - s5: 专项测试设计（性能/安全/可访问性）
      - s6: 用例评审（人类门禁）
      - s7: Playwright脚本生成（E2E自动化）

      相关 Agents:
      - agent.qa.requirement_alignment_agent
      - agent.qa.feature_calibration_agent
      - agent.qa.branch_coverage_agent
      - agent.qa.specialized_test_agent
      - agent.qa.playwright_script_generator

  # ============================================
  # UI 部门工作流 (L2 - Department 级)
  # ============================================
  - id: workflow.ui.ui_design_pipeline
    path: departments/ui/workflows/ui-design-pipeline/v1/workflow.yaml
    level: department
    description: "UI 部门 - UI 设计流水线"
    v3_1_compatible: true

  # ============================================
  # PRD 部门工作流 (L2 - Department 级)
  # ============================================
  - id: workflow.prd.product_pipeline
    path: departments/prd/workflows/product-pipeline/v1/workflow.yaml
    level: department
    description: "PRD 部门 - 产品流水线"
    v3_1_compatible: true

  - id: workflow.prd.product_to_dev_pipeline
    path: departments/prd/workflows/product-to-dev-pipeline/v1/workflow.yaml
    level: department
    description: "PRD 部门 - 产品交付流水线（产出研发冻结包，作为 Dev 部门流水线输入）"
    v3_1_compatible: true
    notes: |
      L2 级工作流 - PRD 部门的专业流程：
      - 输出：研发冻结包 (Development Freeze Package)
      - 该输出可作为 L2 Dev 部门流水线的输入
      - 两个 L2 流水线的串联由独立的 L1 流水线负责编排

  # ============================================
  # DevOps 部门工作流 (L2 - Department 级)
  # ============================================
  - id: workflow.devops.deployment
    path: departments/devops/workflows/devops-deployment/v1/workflow.yaml
    level: department
    description: "DevOps 部门 - 部署工作流（基础设施与 CI/CD）"
    version: "1.0"
    stages_count: 6
    steps_count: ~10
    human_gates_count: 4
    v3_1_compatible: true
    notes: |
      L2 级工作流，包含 6 个阶段：
      - p1_architecture: 环境与发布架构设计 (architect agent)
      - p2_infra_code: 基础设施与 CI/CD 实现 (implementation agent)
      - p3_env_config: 人类注入环境配置与凭证 (Human Gate)
      - p4_deploy_dev_test: 部署到 dev/test (shell runner)
      - p5_verification: 环境与发布包验收 (verification agent + Human Gate)
      - p6_release_freeze: 版本冻结 (verification agent + Human Gate)

      核心原则：
      - AI 只负责生成方案和代码
      - 真实凭证由人类注入
      - 生产环境必须经过 Human Gate 审批
      - 每个变更都有回滚方案

# ============================================
# Agent 注册表
# ============================================
agent_registry:
  # ============================================
  # 决策层 Agents
  # ============================================
  - id: agent.dev.tech_lead
    path: departments/dev/agents/tech-lead/v1/agent.yaml
    level: department
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 架构决策
      - ADR 机制
      - 项目配置初始化
      - Agent 编排
    output_contract: contracts/adr-output/v1/schema.json

  - id: agent.dev.delivery_gate
    path: departments/dev/agents/delivery-gate/v1/agent.yaml
    level: department
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 交付门禁判定
      - 质量汇总
    input_contract: contracts/delivery-gate-input/v1/schema.json
    output_contract: contracts/delivery-gate-output/v1/schema.json

  # ============================================
  # 架构专家层 Agents
  # ============================================
  - id: agent.dev.frontend_architect
    path: departments/dev/agents/frontend-architect/v1/agent.yaml
    level: department
    execution_model: llm
    v3_1_executor: LLMExecutor
    invoked_by: tech_lead
    capabilities:
      - 前端架构设计
      - 技术选型

  - id: agent.dev.backend_architect
    path: departments/dev/agents/backend-architect/v1/agent.yaml
    level: department
    execution_model: llm
    v3_1_executor: LLMExecutor
    invoked_by: tech_lead
    capabilities:
      - 后端架构设计
      - 技术选型

  - id: agent.dev.architecture_contract_generator
    path: departments/dev/agents/architecture-contract-generator/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 从 PRD 自动生成技术架构契约
      - 技术栈推导和选型
      - 组件架构设计
      - 数据模型设计
      - API 接口设计
      - 部署架构规划
    input_contracts:
      - contracts/frozen-detailed-prd-contract/v1/schema.json
    output_contract: contracts/frozen-technical-architecture-contract/v1/schema.json

  - id: agent.dev.backend_architect
    path: departments/dev/agents/backend-architect/v1/agent.yaml
    level: department
    execution_model: llm
    v3_1_executor: LLMExecutor
    invoked_by: tech_lead
    capabilities:
      - 后端架构设计
      - 技术选型

  # ============================================
  # 实现层 Agents
  # ============================================
  - id: agent.dev.go_backend_engineer
    path: departments/dev/agents/go-backend-engineer/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 后端服务实现
      - Go 代码编写

  - id: agent.dev.uniapp_frontend_engineer
    path: departments/dev/agents/uniapp-frontend-engineer/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 前端页面实现
      - UniApp 开发

  - id: agent.dev.database_engineer
    path: departments/dev/agents/database-engineer/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - Schema 设计
      - Migration Contract
    output_contract: contracts/migration-contract/v1/schema.json

  - id: agent.dev.ai_engineer
    path: departments/dev/agents/ai-engineer/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - LLM 集成
      - Prompt/Routing/Eval 三类契约
    output_contract: contracts/ai-engineering-output/v1/schema.json

  # ============================================
  # 测试层 Agents (硬边界)
  # ============================================
  - id: agent.dev.qa_engineer
    path: departments/dev/agents/qa-engineer/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    hard_boundary: "只负责测试设计，不写测试代码"
    capabilities:
      - 测试用例设计
      - E2E 测试计划
    input_contract: contracts/qa-input/v1/schema.json
    output_contract: contracts/test-case-contract/v1/schema.json

  - id: agent.dev.test_automation_engineer
    path: departments/dev/agents/test-automation-engineer/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    hard_boundary: "只负责测试代码实现，用例设计来自 QA Contract"
    capabilities:
      - 测试代码实现
      - 测试稳定性治理
    input_contract: contracts/test-case-contract/v1/schema.json

  # ============================================
  # 运维与安全层 Agents
  # ============================================
  - id: agent.dev.devops_engineer
    path: departments/dev/agents/devops-engineer/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - CI/CD
      - 测试环境
      - Migration 执行

  - id: agent.dev.secops
    path: departments/dev/agents/secops/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 安全扫描
      - 阻断策略
    input_contract: contracts/security-check-input/v1/schema.json
    output_contract: contracts/security-report-output/v1/schema.json

  # ============================================
  # 质量审查层 Agents
  # ============================================
  - id: agent.dev.ui_implementation_reviewer
    path: departments/dev/agents/ui-implementation-reviewer/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 设计还原度审查
      - 跨端适配审查
      - 可访问性审查
    input_contract: contracts/ui-review-input/v1/schema.json
    output_contract: contracts/ui-review-output/v1/schema.json

  - id: agent.dev.code_reviewer
    path: departments/dev/agents/code-reviewer/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 代码质量审查
      - 安全检查
      - 性能审查

  # ============================================
  # DevOps 部门 Agents
  # ============================================
  - id: agent.devops.architect
    path: departments/devops/agents/devops-architect.agent.yaml
    level: department
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 环境拓扑设计
      - 发布策略设计
      - 基础设施架构声明
    constraints:
      forbidden_actions:
        - generate_real_secrets
        - execute_commands
    output_contract: contracts/devops-architect-output/v1/schema.yaml

  - id: agent.devops.implementation
    path: departments/devops/agents/devops-implementation.agent.yaml
    level: department
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - IaC 代码生成
      - CI/CD pipeline 定义
      - 部署脚本生成
      - 发布包生成
    supported_tools:
      iac:
        - docker-compose
        - kubernetes
        - helm
        - terraform
      cicd:
        - github_actions
        - gitlab_ci
        - jenkins
    output_contract: contracts/devops-implementation-output/v1/schema.yaml

  - id: agent.devops.verification
    path: departments/devops/agents/devops-verification.agent.yaml
    level: department
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 部署验证
      - 发布清单生成
      - 版本冻结
      - 审计跟踪生成
    validation_checks:
      deployment_checks:
        - services_running
        - environment_configured
        - database_accessible
      release_checks:
        - artifacts_complete
        - rollback_ready
        - audit_trail_complete
    output_contract: contracts/devops-verification-output/v1/schema.yaml

  # ============================================
  # QA 部门 Agents
  # ============================================
  - id: agent.qa.requirement_alignment_agent
    path: departments/qa/agents/requirement-alignment-agent/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - PRD/架构/UI 三方一致性验证
      - 需求冲突检测
      - 术语一致性检查
      - 差距分析
      - 需求对齐报告生成
    input_contracts:
      - contracts/frozen-detailed-prd-contract/v1/schema.json
      - contracts/frozen-technical-architecture-contract/v1/schema.json
      - contracts/frozen-ui-prototype-contract/v1/schema.json
    output_contract: contracts/test-case-design-contract/v1/schema.json

  - id: agent.qa.feature_calibration_agent
    path: departments/qa/agents/feature-calibration-agent/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 功能点提取（从 PRD）
      - 组件和接口提取（从架构）
      - 页面和交互提取（从 UI 契约）
      - PRD↔架构↔UI 映射关系建立
      - 覆盖矩阵生成
      - 差距识别
    input_contracts:
      - contracts/frozen-detailed-prd-contract/v1/schema.json
      - contracts/frozen-technical-architecture-contract/v1/schema.json
      - contracts/frozen-ui-prototype-contract/v1/schema.json
      - contracts/ui-page-contract/v1/schema.json
    output_contract: contracts/feature-calibration-report/v1/schema.json

  - id: agent.qa.branch_coverage_agent
    path: departments/qa/agents/branch-coverage-agent/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 决策点识别与分析
      - 分支路径分析
      - 分支测试用例设计
      - 分支覆盖矩阵生成
      - 覆盖率计算
      - 覆盖缺口识别
    input_contracts:
      - contracts/test-case-contract/v1/schema.json
    output_contract: contracts/branch-coverage-report/v1/schema.json

  - id: agent.qa.specialized_test_agent
    path: departments/qa/agents/specialized-test-agent/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 性能测试用例设计（负载/压力/延迟/可扩展性）
      - 安全测试用例设计（认证/授权/OWASP Top 10）
      - 可访问性测试用例设计（WCAG 2.1/2.2）
    input_contracts:
      - contracts/frozen-technical-architecture-contract/v1/schema.json
      - contracts/test-case-contract/v1/schema.json
      - contracts/ui-page-contract/v1/schema.json
    output_contract: contracts/specialized-test-contract/v1/schema.json

  - id: agent.qa.playwright_script_generator
    path: departments/qa/agents/playwright-script-generator/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - E2E 脚本生成
      - Page Object 模型设计
      - 测试配置文件生成
      - 测试数据文件生成
      - 断言和错误处理
    input_contracts:
      - contracts/test-case-contract/v1/schema.json
    output_contract: contracts/playwright-script-output/v1/schema.json

  # ============================================
  # UI 部门 Agents
  # ============================================
  - id: agent.ui.contract_generator
    path: departments/ui/agents/ui-contract-generator/v1/agent.yaml
    level: task
    execution_model: llm
    v3_1_executor: LLMExecutor
    capabilities:
      - 从 Figma 设计稿生成 UI 契约
      - 从文字描述生成 UI 契约
      - 生成 page contract
      - 生成 component contract
      - 提取设计令牌
      - 关联 API 契约
      - 定义埋点事件
      - 设置可访问性配置
    input_contracts:
      - contracts/frozen-ui-prototype-contract/v1/schema.json
    output_contract: contracts/ui-page-contract/v1/schema.json

# ============================================
# Contract 注册表
# ============================================
contract_registry:
