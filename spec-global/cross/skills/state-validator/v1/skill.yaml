# State Validator Skill Specification v1.0
# 状态验证技能规范

kind: skill
version: 1.0

# ============================================
# 基础标识
# ============================================
id: skill.ui.state_validator
name: State Validator
description: >
  验证 UI 契约中的状态定义是否完整，检查必需状态是否存在。
owner: ui-ai
tags: [ui, state, validator]

# ============================================
# 接口定义
# ============================================
interface:
  inputs:
    type: object
    required: [states]
    properties:
      states:
        type: array
        description: "状态列表"
        items:
          type: object
          properties:
            name:
              type: string
            components:
              type: array
      required_states:
        type: array
        description: "必需状态列表"
        items:
          type: string
        default: ["default", "loading", "empty", "error"]

  outputs:
    type: object
    required: [valid, missing_states, present_states]
    properties:
      valid:
        type: boolean
        description: "是否通过验证"
      missing_states:
        type: array
        description: "缺失的必需状态"
        items:
          type: string
      present_states:
        type: array
        description: "已定义的状态"
        items:
          type: string
      coverage:
        type: number
        description: "状态覆盖率百分比"

# ============================================
# 运行时配置
# ============================================
runtime:
  type: tool_wrapper
  tool: validator.state_check
  timeout_ms: 1000
  retries: 0

# ============================================
# 约束声明
# ============================================
constraints:
  deterministic: true
  side_effects: none
  pii: forbidden

# ============================================
# 测试钩子
# ============================================
tests:
  smoke:
    - name: validate_complete_states
      input:
        states:
          - { name: "default" }
          - { name: "loading" }
          - { name: "empty" }
          - { name: "error" }
      assert:
        - path: "$.valid"
          op: "=="
          value: true
        - path: "$.missing_states.length"
          op: "=="
          value: 0
    - name: detect_missing_states
      input:
        states:
          - { name: "default" }
          - { name: "loading" }
      assert:
        - path: "$.valid"
          op: "=="
          value: false
        - path: "$.missing_states"
          op: "contains"
          value: "empty"
