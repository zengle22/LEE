# Generate Execution Report Skill v1.0
# 生成执行报告技能 - 将 AI 执行日志转换为人类可读的 Markdown 报告
#
# 封装 orchestrator trace 命令能力

kind: skill
version: "1.0"

# ============================================
# 基础信息
# ============================================
metadata:
  id: skill.common.generate_execution_report
  name: Generate Execution Report
  version: "1.0.0"
  description: |
    将 AI 执行日志 (trace) 转换为人类可读的 Markdown 报告。

    功能:
    - 从 .workflow/traces/ 读取执行日志
    - 生成结构化的 Markdown 报告
    - 包含执行摘要、时间线、错误信息
    - 支持输出到指定文件或控制台

    底层命令:
    - `python -m orchestrator trace <project-dir> --format markdown`

  author: agent-spec-maintainer
  created_at: "2026-01-11"
  tags:
    - reporting
    - execution-log
    - markdown
    - human-readable
    - audit

# ============================================
# 技能能力
# ============================================
capabilities:
  - name: "执行日志解析"
    description: "解析 .workflow/traces/ 目录下的执行日志"

  - name: "Markdown 报告生成"
    description: "生成人类可读的 Markdown 格式报告"

  - name: "错误高亮"
    description: "在报告中高亮显示失败的步骤和错误信息"

  - name: "执行摘要"
    description: "生成执行统计摘要 (总耗时、步骤数、成功率等)"

# ============================================
# 使用方式
# ============================================
usage:
  # 方式一: 通过 orchestrator 命令
  cli_command:
    command: "python -m orchestrator trace <project-dir> --format markdown"
    options:
      - name: "--format"
        values: ["markdown", "yaml"]
        default: "markdown"
        description: "输出格式"
      - name: "--output"
        type: "file_path"
        description: "输出文件路径 (可选，默认生成到 traces/ 目录)"
      - name: "--limit"
        type: "integer"
        description: "限制显示的 span 数量"

    examples:
      - description: "生成 Phase 7 执行报告"
        command: "python -m orchestrator trace ./project/AI跑步教练/dev/phase7 --format markdown"

      - description: "生成报告并输出到指定文件"
        command: "python -m orchestrator trace ./project/AI跑步教练/dev/phase7 --format markdown --output ./reports/phase7-execution.md"

  # 方式二: 在 Agent 中调用
  agent_invocation:
    description: |
      在 Agent prompt 中使用 Bash 工具调用 orchestrator trace 命令

    example: |
      # 在验收前生成执行报告
      python -m orchestrator trace <phase-dir> --format markdown

      # 然后读取生成的报告用于验收
      cat <phase-dir>/.workflow/traces/report_*.md

# ============================================
# 输出格式
# ============================================
output_format:
  type: markdown

  sections:
    - name: "Header"
      content: |
        # Execution Trace Report
        **Run ID**: {run_id}
        **Generated At**: {timestamp}

    - name: "Summary"
      content: |
        ## Summary
        | Metric | Value |
        |--------|-------|
        | Total Spans | {span_count} |
        | Total Duration | {total_duration} |
        | Errors | {error_count} |

    - name: "By Type"
      content: |
        ### By Type
        - orchestrator: {orchestrator_count}
        - gate: {gate_count}
        - agent: {agent_count}

    - name: "By Status"
      content: |
        ### By Status
        - success: {success_count}
        - failed: {failed_count}
        - running: {running_count}

    - name: "Timeline"
      content: |
        ## Timeline
        {timeline_entries}

      entry_format:
        success: "- ✅ **{span_name}** ({type}) - {duration}"
        failed: "- ❌ **{span_name}** ({type}) - {duration}\n  - Error: {error}"
        running: "- ⏳ **{span_name}** ({type}) - running"

# ============================================
# 数据源
# ============================================
data_source:
  primary:
    path: ".workflow/traces/traces.jsonl"
    format: "jsonl"
    description: "主要执行日志文件"

  fallback:
    path: ".workflow/events.jsonl"
    format: "jsonl"
    description: "备用事件日志"

  state:
    path: ".workflow/state.yaml"
    format: "yaml"
    description: "工作流状态 (用于补充信息)"

# ============================================
# 集成配置
# ============================================
integration:
  # 在 Phase Acceptance Gate 中使用
  phase_acceptance_gate:
    usage: |
      在验收步骤开始前，自动生成执行报告:

      1. 调用: python -m orchestrator trace <phase-dir> --format markdown
      2. 读取生成的报告
      3. 在验收报告中引用执行日志摘要

    injection_point: "before_acceptance_check"

  # 在交接步骤中使用
  handover:
    usage: |
      在交接文档中附加执行报告链接:

      execution_report: .workflow/traces/report_{run_id}.md

# ============================================
# 相关技能
# ============================================
related_skills:
  - skill.common.generate_acceptance_report
  - skill.common.generate_handover_document

# ============================================
# 版本历史
# ============================================
version_history:
  - version: "1.0.0"
    date: "2026-01-11"
    changes:
      - "初始版本"
      - "封装 orchestrator trace 命令"
      - "支持 Markdown 格式输出"
