# Icon SVG Generator Skill v1.0
# SVG 图标生成技能
#
# 提供 SVG 代码生成能力，基于设计 Token 规范

kind: skill
version: "1.0"

# ============================================
# 基础信息
# ============================================
metadata:
  id: skill.design.icon_svg_generator
  name: Icon SVG Generator
  description: |
    SVG 图标代码生成技能。根据 Icon Design Token 规范，
    生成符合标准的 SVG 代码，支持 outline/filled/duotone 变体。
  author: agent-spec-maintainer
  created_at: "2026-01-11"
  tags:
    - svg
    - icon
    - design
    - code-generation

# ============================================
# 依赖
# ============================================
dependencies:
  contracts:
    - ref: contracts/icon-design-token/v1/icon-token.yaml
      usage: "设计规范来源"

# ============================================
# 能力定义
# ============================================
capabilities:
  - name: generate_svg
    description: "生成 SVG 图标代码"
    input:
      - icon_name: string
      - description: string
      - variant: outline | filled | duotone
      - size: 24 | 48 | 96 | 1024
      - colors: object
    output:
      - svg_code: string
      - metadata: object

  - name: optimize_svg
    description: "优化 SVG 代码"
    input:
      - svg_code: string
    output:
      - optimized_svg: string
      - savings: number  # 字节减少百分比

  - name: convert_variant
    description: "转换图标变体"
    input:
      - svg_outline: string
      - target_variant: filled | duotone
    output:
      - svg_converted: string

# ============================================
# SVG 生成规范
# ============================================
generation_rules:
  # 基础 SVG 结构
  svg_template: |
    <svg xmlns="http://www.w3.org/2000/svg"
         width="{width}"
         height="{height}"
         viewBox="0 0 {viewBox_size} {viewBox_size}"
         fill="none"
         role="img"
         aria-label="{icon_name}">
      {content}
    </svg>

  # 尺寸映射
  size_mapping:
    24:
      stroke_width: 2
      corner_small: 1
      corner_medium: 2
      corner_large: 4
      safe_area: 2
    48:
      stroke_width: 4
      corner_small: 2
      corner_medium: 4
      corner_large: 8
      safe_area: 4
    96:
      stroke_width: 8
      corner_small: 4
      corner_medium: 8
      corner_large: 16
      safe_area: 8
    1024:
      stroke_width: 85
      corner_small: 43
      corner_medium: 85
      corner_large: 171
      safe_area: 85

  # Outline 样式属性
  outline_attrs: |
    stroke="{color}"
    stroke-width="{stroke_width}"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"

  # Filled 样式属性
  filled_attrs: |
    fill="{color}"
    stroke="none"

  # Duotone 样式属性
  duotone_attrs:
    primary: |
      fill="{primary_color}"
    secondary: |
      fill="{secondary_color}"
      opacity="0.3"

# ============================================
# 常用图标模板库
# ============================================
icon_templates:
  # 导航类
  home:
    description: "房屋/首页图标"
    paths:
      outline: |
        <path d="M3 12l9-9 9 9" {stroke_attrs}/>
        <path d="M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10" {stroke_attrs}/>
      filled: |
        <path d="M12 2L2 12h3v9a1 1 0 001 1h5v-6h2v6h5a1 1 0 001-1v-9h3L12 2z" {fill_attrs}/>

  running:
    description: "跑步者图标"
    paths:
      outline: |
        <circle cx="14" cy="4" r="2" {stroke_attrs}/>
        <path d="M8 8l4 1-2 4 5 3-2 4" {stroke_attrs}/>
        <path d="M6 14l2-2m6 4l3-2" {stroke_attrs}/>
      filled: |
        <circle cx="14" cy="4" r="2.5" {fill_attrs}/>
        <path d="M7.5 7.5l5 1.5-2 4 5 3-2.5 5h-2l2-4-4-2.5 2-4-4-1.5v-2z" {fill_attrs}/>

  goal:
    description: "目标/靶心图标"
    paths:
      outline: |
        <circle cx="12" cy="12" r="10" {stroke_attrs}/>
        <circle cx="12" cy="12" r="6" {stroke_attrs}/>
        <circle cx="12" cy="12" r="2" {stroke_attrs}/>
      filled: |
        <circle cx="12" cy="12" r="10" fill="none" stroke="{color}" stroke-width="2"/>
        <circle cx="12" cy="12" r="6" fill="none" stroke="{color}" stroke-width="2"/>
        <circle cx="12" cy="12" r="3" {fill_attrs}/>

  plan:
    description: "计划/日历图标"
    paths:
      outline: |
        <rect x="3" y="4" width="18" height="18" rx="2" {stroke_attrs}/>
        <path d="M16 2v4M8 2v4M3 10h18" {stroke_attrs}/>
        <path d="M8 14h2v2H8zM14 14h2v2h-2z" {stroke_attrs}/>
      filled: |
        <path d="M16 2v2H8V2H6v2H4a2 2 0 00-2 2v14a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2zm4 8H4v10h16V10zm-10 4v2H8v-2h2zm6 0v2h-2v-2h2z" {fill_attrs}/>

  trophy:
    description: "奖杯图标"
    paths:
      outline: |
        <path d="M6 9H3a1 1 0 01-1-1V5a1 1 0 011-1h3" {stroke_attrs}/>
        <path d="M18 9h3a1 1 0 001-1V5a1 1 0 00-1-1h-3" {stroke_attrs}/>
        <path d="M6 4h12v6a6 6 0 11-12 0V4z" {stroke_attrs}/>
        <path d="M9 21h6M12 17v4" {stroke_attrs}/>
      filled: |
        <path d="M20 4h-3V3a1 1 0 00-1-1H8a1 1 0 00-1 1v1H4a2 2 0 00-2 2v2a2 2 0 002 2h1.3A7 7 0 0012 17.9V20H9a1 1 0 100 2h6a1 1 0 100-2h-3v-2.1A7 7 0 0018.7 10H20a2 2 0 002-2V6a2 2 0 00-2-2zM4 8V6h3v2.5c0 .17.01.34.02.5H4zm16 0h-3.02c.01-.16.02-.33.02-.5V6h3v2z" {fill_attrs}/>

  profile:
    description: "用户/个人图标"
    paths:
      outline: |
        <circle cx="12" cy="8" r="4" {stroke_attrs}/>
        <path d="M20 21c0-4.418-3.582-8-8-8s-8 3.582-8 8" {stroke_attrs}/>
      filled: |
        <circle cx="12" cy="8" r="5" {fill_attrs}/>
        <path d="M12 14c-5.523 0-10 4.477-10 10h20c0-5.523-4.477-10-10-10z" {fill_attrs}/>

  chat:
    description: "对话/聊天图标"
    paths:
      outline: |
        <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" {stroke_attrs}/>
      filled: |
        <path d="M12 2C6.477 2 2 6.145 2 11.5c0 2.062.703 3.961 1.875 5.5L2 21l4.5-1.875A10.33 10.33 0 0012 21c5.523 0 10-4.145 10-9.5S17.523 2 12 2z" {fill_attrs}/>

  check:
    description: "勾选/完成图标"
    paths:
      outline: |
        <path d="M5 12l5 5L20 7" {stroke_attrs}/>
      filled: |
        <circle cx="12" cy="12" r="10" {fill_attrs}/>
        <path d="M8 12l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  add:
    description: "添加/加号图标"
    paths:
      outline: |
        <path d="M12 5v14M5 12h14" {stroke_attrs}/>
      filled: |
        <circle cx="12" cy="12" r="10" {fill_attrs}/>
        <path d="M12 7v10M7 12h10" stroke="white" stroke-width="2" stroke-linecap="round"/>

# ============================================
# 优化规则
# ============================================
optimization:
  rules:
    - name: "合并重复属性"
      description: "将公共属性提升到父元素"

    - name: "简化路径"
      description: "使用 SVGO 或等效工具优化路径"

    - name: "移除不必要属性"
      description: "删除默认值属性"

    - name: "数值精度"
      description: "路径坐标最多 2 位小数"

  tools:
    - name: svgo
      config:
        plugins:
          - removeViewBox: false
          - removeDimensions: false
          - removeUselessStrokeAndFill: true
          - convertColors: true
          - cleanupNumericValues:
              floatPrecision: 2

# ============================================
# 测试用例
# ============================================
tests:
  - name: generate_home_outline
    input:
      icon_name: home
      variant: outline
      size: 24
    expected:
      contains:
        - '<svg'
        - 'viewBox="0 0 24 24"'
        - 'stroke-width="2"'
        - 'stroke-linecap="round"'

  - name: generate_home_filled
    input:
      icon_name: home
      variant: filled
      size: 24
    expected:
      contains:
        - '<svg'
        - 'fill='
        - '</svg>'
      not_contains:
        - 'stroke-width'
