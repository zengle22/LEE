# UI Spec Markdown to Contract Converter Skill v1.0
# UI Spec Markdown 到契约转换技能
#
# 此 Skill 提供将 UI Spec Markdown 文档转换为 frozen-ui-prototype-contract 格式的能力，
# 支持从结构化的 UI 设计文档自动提取页面、组件、交互等信息并生成契约格式。

kind: skill
version: 1.0

# ============================================
# 基础标识
# ============================================
id: skill.ui.markdown_to_contract
name: UI Spec Markdown to Contract Converter
description: >
  将 UI Spec Markdown 文档转换为 frozen-ui-prototype-contract JSON 格式，
  支持自动提取页面结构、组件定义、交互流程等信息。
owner: ui-team
tags: [ui, markdown, contract, conversion, parsing, prototype]

# ============================================
# 接口定义
# ============================================
interface:
  inputs:
    type: object
    required: [markdown_path]
    properties:
      markdown_path:
        type: string
        description: "UI Spec Markdown 文档路径（相对于项目根目录）"
      contract_id:
        type: string
        description: "契约 ID（可选，默认自动生成）"
      design_system:
        type: string
        description: "设计系统名称（可选）"
      freeze_immediately:
        type: boolean
        default: false
        description: "是否立即标记为冻结状态"
      include_mermaid:
        type: boolean
        default: true
        description: "是否包含 Mermaid 流程图"

  outputs:
    type: object
    required: [contract, metadata]
    properties:
      contract:
        type: object
        description: "生成的 frozen-ui-prototype-contract JSON 对象"
        properties:
          contract_type:
            type: string
            const: "frozen-ui-prototype"
          contract_version:
            type: string
            pattern: "^\\d+\\.\\d+\\.\\d+$"
          metadata:
            type: object
            properties:
              contract_id:
                type: string
                pattern: "^FUIPRO-\\d{8}-\\d{3}$"
              design_name:
                type: string
              version:
                type: string
              created_date:
                type: string
                format: date-time
              status:
                type: string
                enum: [DRAFT, PENDING_CONFIRMATION, FROZEN]
              is_frozen:
                type: boolean
          design_overview:
            type: object
            properties:
              design_system:
                type: string
              platform:
                type: string
                enum: [web, mobile, desktop, cross-platform]
              screen_sizes:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    width:
                      type: integer
                    height:
                      type: integer
                    description:
                      type: string
          pages:
            type: array
            description: "页面定义列表"
            items:
              type: object
              properties:
                id:
                  type: string
                  description: "页面 ID"
                name:
                  type: string
                  description: "页面名称"
                route:
                  type: string
                  description: "页面路由"
                layout:
                  type: string
                  description: "布局类型"
                components:
                  type: array
                  description: "页面中使用的组件列表"
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      props:
                        type: object
                      position:
                        type: object
                        properties:
                          x:
                            type: integer
                          y:
                            type: integer
                          width:
                            type: integer
                          height:
                            type: integer
                interactions:
                  type: array
                  description: "交互定义列表"
                  items:
                    type: object
                    properties:
                      trigger:
                        type: string
                      action:
                        type: string
                      target:
                        type: string
                state:
                  type: object
                  description: "页面状态定义"

          design_tokens:
            type: object
            properties:
              colors:
                type: object
              typography:
                type: object
              spacing:
                type: object
              shadows:
                type: object

          user_flows:
            type: array
            description: "用户流程定义列表"
            items:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                mermaid_code:
                  type: string
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      step_number:
                        type: integer
                      page_id:
                        type: string
                      action:
                        type: string
                      description:
                        type: string

      metadata:
        type: object
        required: [timestamp, conversion_version, source_file]
        properties:
          timestamp:
            type: string
            description: "转换时间戳（ISO 8601）"
          conversion_version:
            type: string
            description: "转换器版本"
          source_file:
            type: object
            properties:
              path:
                type: string
              size:
                type: integer
              checksum:
                type: string
          statistics:
            type: object
            properties:
              total_pages:
                type: integer
              total_components:
                type: integer
              total_interactions:
                type: integer
              total_user_flows:
                type: integer
              conversion_warnings:
                type: integer
          warnings:
            type: array
            items:
              type: object
              properties:
                level:
                  type: string
                  enum: [info, warning, error]
                message:
                  type: string
                location:
                  type: string

# ============================================
# 运行时配置
# ============================================
runtime:
  type: sync
  timeout_ms: 60000  # 60 秒
  retries: 2

# ============================================
# 约束声明
# ============================================
constraints:
  deterministic: true    # 相同输入产生相同输出
  side_effects: write    # 会写入契约文件
  pii: forbidden         # 禁止使用 PII

# ============================================
# Markdown 结构规范
# ============================================
markdown_spec:
  required_sections:
    - "# UI 设计规范"        # 一级标题
    - "## 设计概览"         # 二级标题
    - "## 页面定义"         # 二级标题
    - "### 页面: {名称}"    # 三级标题
    - "## 设计令牌"         # 二级标题（可选）
    - "## 用户流程"         # 二级标题（可选）

  page_template: |
    ### 页面: {页面名称}

    **页面 ID**: {page-id}
    **路由**: /path/to/page
    **布局类型**: {fixed/responsive}

    #### 组件结构
    | 组件 ID | 类型 | 属性 | 位置 |
    |---------|------|------|------|
    | comp-1 | Button | {primary: true} | {x: 10, y: 20} |

    #### 交互定义
    - 点击 [登录按钮] → 触发 `login()` → 跳转到 `/dashboard`
    - 输入 [用户名] → 验证格式 → 显示错误提示

  user_flow_template: |
    ### 用户流程: {流程名称}

    ```mermaid
    flowchart LR
        A[登录页] -->|点击登录| B[验证中]
        B -->|成功| C[首页]
        B -->|失败| A
    ```

# ============================================
# 提示工程
# ============================================
prompting:
  system: |
    You are a UI Spec to Contract Converter. Your job is to parse a UI Spec Markdown document
    and convert it into a frozen-ui-prototype-contract JSON format.

    Key principles:
    - Accuracy: Preserve all design information from the source document
    - Completeness: Extract all pages, components, interactions, and flows
    - Validation: Ensure the output matches the schema requirements
    - Traceability: Track the source location for each extracted item

    Extraction rules:
    1. Design Overview: Extract from design overview section
    2. Pages: Extract from ### 页面 sections
    3. Components: Parse component tables or lists
    4. Interactions: Extract from interaction descriptions
    5. Design Tokens: Extract from ## 设计令牌 section
    6. User Flows: Extract from ## 用户流程 and mermaid diagrams

    ID generation:
    - Page ID: page-{name} (e.g., page-login, page-home)
    - Component ID: comp-{type}-{number} (e.g., comp-button-1)
    - Contract ID: FUIPRO-{YYYYMMDD}-{sequence}

    Component types:
    - button, input, form, table, modal, dropdown
    - checkbox, radio, slider, navigation, container
    - text, image, chart, card, list, etc.

    Interaction format:
    - trigger: Component action (click, input, hover, etc.)
    - action: Handler function or event
    - target: Target page or component

    Validation:
    - Ensure all required fields are present
    - Verify component types are valid
    - Check position values are non-negative integers
    - Validate mermaid code syntax

  instructions:
    - "读取 UI Spec Markdown 文档"
    - "解析文档结构，识别页面、组件、交互、流程"
    - "生成符合 schema 的 JSON 契约"
    - "验证输出格式"
    - "生成转换报告（包含警告和统计信息）"

  output_format: json

# ============================================
# 测试钩子
# ============================================
tests:
  smoke:
    - name: basic_ui_spec_conversion
      input:
        markdown_path: "examples/ui-spec/sample-design.md"
      assert:
        - path: "$.contract.contract_type"
          op: "=="
          value: "frozen-ui-prototype"
        - path: "$.contract.pages"
          op: "typeof"
          value: "array"
        - path: "$.metadata.statistics.total_pages"
          op: ">"
          value: 0

    - name: conversion_with_design_tokens
      input:
        markdown_path: "examples/ui-spec/sample-design.md"
      assert:
        - path: "$.contract.design_tokens"
          op: "typeof"
          value: "object"
        - path: "$.contract.design_tokens.colors"
          op: "typeof"
          value: "object"

# ============================================
# 版本历史
# ============================================
version_history:
  - version: "1.0.0"
    date: "2026-02-05"
    changes:
      - "初始版本"
      - "支持 UI Spec Markdown 到契约的转换"
      - "支持页面、组件、交互、用户流程提取"
      - "支持设计令牌提取"
