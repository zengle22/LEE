# UI Gate Check Skill Specification v1.0
# UI Gate 检查技能规范

kind: skill
version: 1.0

# ============================================
# 基础标识
# ============================================
id: skill.gate.ui_gate
name: UI Gate Check
description: >
  执行 UI Gate 检查，验证设计阶段的交付物是否符合进入研发的标准。
owner: ui-ai
tags: [gate, ui, check]

# ============================================
# 接口定义
# ============================================
interface:
  inputs:
    type: object
    required: [ui_map_path]
    properties:
      ui_map_path:
        type: string
        description: "ui.map.yaml 文件路径"
      verbose:
        type: boolean
        description: "是否输出详细信息"
        default: false

  outputs:
    type: object
    required: [result, checks, summary]
    properties:
      result:
        type: string
        description: "检查结果"
        enum: [pass, fail]
      checks:
        type: array
        description: "各检查项结果"
        items:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            severity:
              type: string
              enum: [blocker, major, minor]
            status:
              type: string
              enum: [pass, fail, skip]
            message:
              type: string
            details:
              type: array
              items:
                type: string
      summary:
        type: object
        description: "统计信息"
        properties:
          blocker:
            type: integer
          major:
            type: integer
          minor:
            type: integer
          total_checks:
            type: integer
          passed_checks:
            type: integer

# ============================================
# 运行时配置
# ============================================
runtime:
  type: shell
  tool: npx ui-gate check
  timeout_ms: 60000
  retries: 0

# ============================================
# 约束声明
# ============================================
constraints:
  deterministic: true
  side_effects: reads
  pii: forbidden

# ============================================
# 测试钩子
# ============================================
tests:
  smoke:
    - name: ui_gate_pass
      input:
        ui_map_path: "test/fixtures/complete_ui_map.yaml"
      assert:
        - path: "$.result"
          op: "=="
          value: "pass"
        - path: "$.summary.blocker"
          op: "=="
          value: 0
    - name: ui_gate_fail
      input:
        ui_map_path: "test/fixtures/incomplete_ui_map.yaml"
      assert:
        - path: "$.result"
          op: "=="
          value: "fail"
        - path: "$.summary.blocker"
          op: ">="
          value: 1
