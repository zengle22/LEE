# Icon Design Token v1.0
# 图标设计规范 - 设计 Token 定义
#
# 定义图标生成的标准规范，确保一致性和规模化生产

kind: design-token
version: "1.0"
domain: ui/icons

# ============================================
# 元数据
# ============================================
metadata:
  name: Icon Design Token
  description: |
    定义图标的标准化设计规范，包括画板、网格、线宽、圆角、颜色等 token。
    所有图标必须严格遵循此规范，确保视觉一致性。
  created_at: "2026-01-11"
  updated_at: "2026-01-11"
  author: icon-generator-agent

# ============================================
# 画板规范
# ============================================
artboard:
  # 标准尺寸（单位: px）
  sizes:
    small:
      size: 24
      usage: "TabBar 图标、列表图标"
      grid: 1
      safe_area: 2  # 安全区域内边距

    medium:
      size: 48
      usage: "功能按钮、卡片图标"
      grid: 2
      safe_area: 4

    large:
      size: 96
      usage: "空状态图标、引导图标"
      grid: 4
      safe_area: 8

    export:
      size: 1024
      usage: "源文件导出、App Icon"
      grid: 32
      safe_area: 64

  # 导出格式
  export_formats:
    - format: svg
      usage: "可编辑源文件"
      required: true
    - format: png
      scales: [1, 2, 3]
      usage: "位图导出"
      required: true

# ============================================
# 网格规范
# ============================================
grid:
  # 基础网格单位
  base_unit: 1  # 24px 画板的基础单位

  # 关键线
  keylines:
    - name: circle
      description: "圆形图标边界"
      diameter_ratio: 0.833  # 20/24
    - name: square
      description: "方形图标边界"
      side_ratio: 0.75  # 18/24
    - name: horizontal_rectangle
      description: "水平矩形边界"
      width_ratio: 0.917  # 22/24
      height_ratio: 0.667  # 16/24
    - name: vertical_rectangle
      description: "垂直矩形边界"
      width_ratio: 0.667  # 16/24
      height_ratio: 0.917  # 22/24

  # 对齐规则
  alignment:
    snap_to_grid: true
    pixel_perfect: true
    center_optically: true  # 光学居中而非数学居中

# ============================================
# 线宽规范
# ============================================
stroke:
  # 线宽定义
  weights:
    outline:
      weight: 2
      usage: "描边图标 (Outline style)"
      scale_24: 2
      scale_48: 4
      scale_96: 8

    filled:
      weight: 0
      usage: "填充图标 (Filled style)"
      note: "使用填充而非描边"

  # 线帽和连接
  cap: round       # round | square | butt
  join: round      # round | miter | bevel
  miter_limit: 4

  # 描边规则
  rules:
    - "线宽必须一致，不可渐变"
    - "复杂形状使用 outline 扩展为路径"
    - "端点必须使用圆角"

# ============================================
# 圆角规范
# ============================================
corner:
  # 圆角半径（24px 画板基准）
  radii:
    sharp: 0        # 直角
    small: 1        # 小圆角
    medium: 2       # 中等圆角
    large: 4        # 大圆角
    full: 12        # 完全圆角（半圆）

  # 使用规则
  rules:
    - "内外圆角差值等于线宽"
    - "同一图标使用统一圆角风格"
    - "默认使用 medium (2px)"

# ============================================
# 颜色规范
# ============================================
color:
  # 品牌色 Token（来自 UI Spec）
  brand:
    primary:
      value: "#FF6B00"
      name: "活力橙"
      usage: "激活状态、主要操作"

    secondary:
      value: "#1A73E8"
      name: "信任蓝"
      usage: "AI 相关、专业功能"

  # 功能色 Token
  semantic:
    success:
      value: "#34A853"
      usage: "成功、完成状态"

    warning:
      value: "#FBBC05"
      usage: "警告、注意"

    error:
      value: "#EA4335"
      usage: "错误、危险"

    info:
      value: "#4285F4"
      usage: "信息提示"

  # 中性色 Token
  neutral:
    default:
      value: "#5F6368"
      usage: "默认状态图标"

    inactive:
      value: "#9AA0A6"
      usage: "禁用、未激活状态"

    background:
      value: "#FFFFFF"
      usage: "图标背景（如需要）"

  # 状态颜色映射
  states:
    default: "@neutral.default"      # 默认
    active: "@brand.primary"         # 激活
    inactive: "@neutral.inactive"    # 未激活
    hover: "@brand.primary"          # 悬停
    pressed: "@brand.primary"        # 按下
    disabled: "@neutral.inactive"    # 禁用

# ============================================
# 图标样式
# ============================================
styles:
  # 支持的图标样式
  variants:
    outline:
      description: "描边风格，线条清晰"
      stroke_weight: 2
      fill: none
      usage: "默认状态"

    filled:
      description: "填充风格，视觉饱满"
      stroke_weight: 0
      fill: solid
      usage: "激活状态"

    duotone:
      description: "双色调，层次丰富"
      stroke_weight: 2
      fill: partial
      opacity_secondary: 0.3
      usage: "特殊强调"

  # 状态变体
  state_mapping:
    default: outline
    active: filled
    hover: filled

# ============================================
# 禁止事项
# ============================================
forbidden:
  - id: F001
    name: "禁止渐变"
    description: "不使用颜色渐变，保持扁平"
    violation_example: "linear-gradient fill"

  - id: F002
    name: "禁止阴影"
    description: "不使用投影效果"
    violation_example: "drop-shadow filter"

  - id: F003
    name: "禁止细碎细节"
    description: "避免小于 1px 的细节"
    violation_example: "0.5px stroke"

  - id: F004
    name: "禁止文字"
    description: "图标不包含文字标签"
    violation_example: "embedded text"

  - id: F005
    name: "禁止非对齐"
    description: "所有元素必须对齐网格"
    violation_example: "0.5px offset"

  - id: F006
    name: "禁止多色混用"
    description: "单图标最多 2 种颜色"
    violation_example: "3+ colors in one icon"

  - id: F007
    name: "禁止超出安全区"
    description: "内容不得超出 safe area"
    violation_example: "content touching edge"

# ============================================
# QA 验证规则
# ============================================
validation:
  # 自动检查规则
  rules:
    - id: V001
      name: "线宽一致性"
      check: "all_stroke_widths_equal"
      severity: error

    - id: V002
      name: "颜色合规"
      check: "colors_in_token_palette"
      severity: error

    - id: V003
      name: "安全区域"
      check: "content_within_safe_area"
      severity: error

    - id: V004
      name: "网格对齐"
      check: "coordinates_on_grid"
      severity: warning

    - id: V005
      name: "尺寸正确"
      check: "viewport_matches_spec"
      severity: error

    - id: V006
      name: "无渐变"
      check: "no_gradient_fills"
      severity: error

    - id: V007
      name: "无阴影"
      check: "no_shadow_effects"
      severity: error

    - id: V008
      name: "路径优化"
      check: "paths_optimized"
      severity: warning

# ============================================
# 导出规范
# ============================================
export:
  # 目录结构
  directory_structure:
    source: "icons/source/{name}.svg"
    png_1x: "icons/png/{name}_24.png"
    png_2x: "icons/png/{name}_48.png"
    png_3x: "icons/png/{name}_72.png"
    png_1024: "icons/png/{name}_1024.png"
    android: "icons/export/android/drawable-{density}/{name}.png"
    ios: "icons/export/ios/{name}.imageset/{name}@{scale}x.png"
    web: "icons/export/web/{name}.svg"

  # 命名规则
  naming:
    pattern: "{category}_{name}_{variant}"
    examples:
      - "nav_home_outline"
      - "nav_home_filled"
      - "action_add_outline"
      - "status_success_filled"

    categories:
      - nav        # 导航类
      - action     # 操作类
      - status     # 状态类
      - object     # 对象类
      - media      # 媒体类
      - file       # 文件类
      - social     # 社交类
      - running    # 跑步专属

  # 清单文件
  manifest:
    enabled: true
    file: "icons/icon-manifest.yaml"
    content:
      - name
      - category
      - variants
      - sizes
      - colors
      - created_at
      - updated_at
