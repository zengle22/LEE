# UX Review Contract
# UX 审查输入输出契约定义

id: ux-review-contract
version: "1.0.0"

metadata:
  name: UX Review Contract
  name_zh: UX 审查契约
  description: |
    定义 UX Review Agent 的输入输出格式。
    确保审查结果可验证、可追踪、可工程化。

# ===========================================
# 输入契约
# ===========================================
input_schema:
  type: object
  required:
    - review_target
    - context
  properties:
    review_target:
      type: object
      description: 审查目标
      required:
        - type
        - content
      properties:
        type:
          type: string
          enum:
            - page_spec       # 页面规范 (*.page.yaml)
            - component_spec  # 组件规范 (*.component.yaml)
            - ui_prototype    # UI 原型 (Figma/截图)
            - interaction_flow # 交互流程
          description: 审查目标类型

        content:
          oneOf:
            - type: string
              description: 文件路径或 URL
            - type: object
              description: 内联的规范内容

        related_files:
          type: array
          items:
            type: string
          description: 相关文件列表

    context:
      type: object
      description: 审查上下文
      required:
        - product_type
        - target_users
      properties:
        product_type:
          type: string
          description: 产品类型
          examples:
            - "fitness app"
            - "SaaS dashboard"
            - "e-commerce"

        target_users:
          type: string
          description: 目标用户群体
          examples:
            - "严肃跑者"
            - "企业管理员"
            - "普通消费者"

        platform:
          type: string
          enum: [mobile, web, miniprogram, desktop]
          default: mobile

        design_system:
          type: object
          description: 项目设计系统 (可选)
          properties:
            tokens_file:
              type: string
            ui_spec_file:
              type: string

    focus_areas:
      type: array
      description: 重点审查领域 (可选，默认全部)
      items:
        type: string
        enum:
          - usability         # 可用性
          - information_architecture  # 信息架构
          - interaction_consistency   # 交互一致性
          - accessibility     # 可访问性
          - state_completeness # 状态完整性
      default:
        - usability
        - information_architecture
        - interaction_consistency
        - accessibility
        - state_completeness

# ===========================================
# 输出契约
# ===========================================
output_schema:
  type: object
  required:
    - summary
    - issues
    - recommendations
  properties:
    summary:
      type: object
      description: 审查摘要
      required:
        - total_issues
        - by_severity
        - pass_gate
      properties:
        total_issues:
          type: integer
          description: 问题总数

        by_severity:
          type: object
          properties:
            blocker:
              type: integer
              description: 阻断级问题
            major:
              type: integer
              description: 严重问题
            minor:
              type: integer
              description: 轻微问题
            enhancement:
              type: integer
              description: 优化建议

        pass_gate:
          type: boolean
          description: 是否通过门禁 (blocker=0 && major<=3)

        overall_score:
          type: number
          minimum: 0
          maximum: 100
          description: 综合评分 (可选)

    issues:
      type: array
      description: 问题清单
      items:
        type: object
        required:
          - id
          - severity
          - category
          - description
          - principle
          - recommendation
        properties:
          id:
            type: string
            pattern: "^UX-[0-9]{3}$"
            description: 问题编号

          severity:
            type: string
            enum: [blocker, major, minor, enhancement]
            description: 严重级别

          category:
            type: string
            enum:
              - usability
              - information_architecture
              - interaction_consistency
              - accessibility
              - state_completeness
            description: 问题分类

          description:
            type: string
            description: 问题描述

          location:
            type: string
            description: 问题位置 (页面/组件/元素)

          principle:
            type: object
            description: 违反的设计原则
            required:
              - name
              - source
            properties:
              name:
                type: string
                description: 原则名称
                examples:
                  - "可见性 (Visibility of System Status)"
                  - "一致性与标准 (Consistency)"
                  - "对比度 (WCAG 1.4.3)"
              source:
                type: string
                description: 原则来源
                examples:
                  - "Nielsen Heuristics #1"
                  - "WCAG 2.1 AA"
                  - "iOS HIG"

          recommendation:
            type: string
            description: 修复建议 (必须可执行)

          impact:
            type: string
            description: 影响范围

          evidence:
            type: object
            description: 证据 (可选)
            properties:
              screenshot:
                type: string
                description: 截图路径
              code_snippet:
                type: string
                description: 相关代码

    recommendations:
      type: object
      description: 整体建议
      properties:
        must_fix:
          type: array
          items:
            type: string
          description: 必须修复 (Blocker + Major)

        should_fix:
          type: array
          items:
            type: string
          description: 建议修复 (Minor)

        nice_to_have:
          type: array
          items:
            type: string
          description: 可以优化 (Enhancement)

        next_steps:
          type: array
          items:
            type: string
          description: 后续步骤建议

    metadata:
      type: object
      description: 元数据
      properties:
        reviewed_at:
          type: string
          format: date-time
        reviewed_by:
          type: string
          default: "agent.design.ux_reviewer"
        skill_version:
          type: string
          description: ui-ux-pro-max-skill 版本
        review_duration_ms:
          type: integer

# ===========================================
# 门禁规则
# ===========================================
gate_rules:
  pass_criteria:
    blocker: 0           # Blocker 必须为 0
    major: 3             # Major 最多 3 个
    minor: null          # Minor 不限制
    enhancement: null    # Enhancement 不限制

  blocking_categories:
    - accessibility      # 可访问性问题始终 blocking

# ===========================================
# 示例
# ===========================================
examples:
  - name: 跑步 App 首页审查
    input:
      review_target:
        type: page_spec
        content: "ui/pages/home.page.yaml"
        related_files:
          - "ui/components/training-card.component.yaml"
          - "ui/components/body-status.component.yaml"
      context:
        product_type: "AI 跑步教练"
        target_users: "严肃跑者"
        platform: miniprogram
        design_system:
          tokens_file: "ui/tokens/tokens.json"
          ui_spec_file: "ui-specs/跑步AI教练_ui_spec.md"
      focus_areas:
        - usability
        - state_completeness

    output:
      summary:
        total_issues: 4
        by_severity:
          blocker: 0
          major: 1
          minor: 2
          enhancement: 1
        pass_gate: true

      issues:
        - id: "UX-001"
          severity: major
          category: state_completeness
          description: "训练卡片缺少 error 状态定义"
          location: "home.page.yaml > training_card"
          principle:
            name: "状态完整性"
            source: "UI Contract Standard"
          recommendation: "添加 error 状态，显示重试按钮和错误提示"
          impact: "用户在网络错误时无法获得反馈"

        - id: "UX-002"
          severity: minor
          category: usability
          description: "身体状态输入入口不够明显"
          location: "home.page.yaml > body_status_entry"
          principle:
            name: "可发现性 (Visibility)"
            source: "Nielsen Heuristics #1"
          recommendation: "增加视觉引导或默认展开输入区域"

      recommendations:
        must_fix:
          - "补充训练卡片的 error 状态"
        should_fix:
          - "优化身体状态入口可见性"
        next_steps:
          - "修复 Major 问题后重新审查"
          - "进入实现阶段"
