# Demo: 登录-手机号输入页面 - Page Contract

id: page.login_phone
route: /login/phone
title: 登录 - 输入手机号
roles: [guest]
figma: https://figma.com/design/demo/login-phone

# v1.1: 用户流关联
flow_binding:
  flow_ref: flow.user_login
  step_id: step_1_phone
  is_entry_page: true
  is_completion_page: false

# v1.1: 前置条件
preconditions:
  - id: not_logged_in
    condition: "user.isLoggedIn == false"
    not_met_action: redirect
    guide_to: page.dashboard
    message_key: already_logged_in

# 页面状态
states:
  - name: default
    components:
      - ref: component.header
        id: header
        props:
          title: 登录
          showBack: true
      - ref: component.input_phone
        id: phone_input
        required: true
        props:
          placeholder: 请输入手机号
          maxLength: 11
      - ref: component.button_primary
        id: get_code_button
        required: true
        props:
          label: 获取验证码

  - name: loading
    pattern: spinner
    messageKey: sending_code

  - name: empty
    messageKey: null  # 此页面无空状态

  - name: error
    errorCodes: [INVALID_PHONE, CODE_SEND_FAILED, RATE_LIMIT]
    messageKey: phone_page_error

# v1.1: 禁用规则
disabled_rules:
  - target: get_code_button
    condition: "form.phone.isValid == false"
    message_key: please_enter_valid_phone
    tooltip: true

  - target: get_code_button
    condition: "state.countdown > 0"
    message_key: wait_n_seconds
    tooltip: true

# 交互定义
interactions:
  - id: send_code
    trigger: click(get_code_button)
    api:
      method: POST
      endpoint: /api/auth/send-code
      contractRef: api.auth_send_code
    success:
      toastKey: code_sent
      updateState: codeSent=true
      navigation:
        to: page.login_verify
    failure:
      showInlineError: true
      toastKey: code_send_failed

  - id: go_back
    trigger: click(header.back)
    navigation:
      to: page.home

# 校验规则
validation:
  - field: phone
    rules:
      - type: required
        messageKey: phone_required
      - type: pattern
        value: "^1[3-9]\\d{9}$"
        messageKey: invalid_phone_format

# v1.1: 恢复路径
recovery_paths:
  - error_state: INVALID_PHONE
    recovery_action: show_error
    message_key: invalid_phone_format
    cta_key: null

  - error_state: CODE_SEND_FAILED
    recovery_action: retry
    message_key: code_send_failed
    cta_key: retry
    max_retries: 3

  - error_state: RATE_LIMIT
    recovery_action: show_error
    message_key: rate_limit_wait
    cta_key: null

# 埋点
tracking:
  exposure: [login_phone_view]
  actions:
    - event: login_get_code_click
      trigger: click(get_code_button)

# 可访问性
a11y:
  required: true
  focusOrder: [phone_input, get_code_button]
  landmarks:
    - role: main
      label: 登录表单
