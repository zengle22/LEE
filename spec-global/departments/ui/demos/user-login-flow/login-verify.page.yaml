# Demo: 登录-验证码输入页面 - Page Contract

id: page.login_verify
route: /login/verify
title: 登录 - 输入验证码
roles: [guest]
figma: https://figma.com/design/demo/login-verify

# v1.1: 用户流关联
flow_binding:
  flow_ref: flow.user_login
  step_id: step_2_verify
  is_entry_page: false
  is_completion_page: true

# v1.1: 前置条件
preconditions:
  - id: code_sent
    condition: "state.codeSent == true"
    not_met_action: redirect
    guide_to: page.login_phone
    message_key: please_get_code_first

  - id: not_logged_in
    condition: "user.isLoggedIn == false"
    not_met_action: redirect
    guide_to: page.dashboard
    message_key: already_logged_in

# 页面状态
states:
  - name: default
    components:
      - ref: component.header
        id: header
        props:
          title: 输入验证码
          showBack: true
      - ref: component.text
        id: phone_hint
        props:
          content: "验证码已发送至 {masked_phone}"
      - ref: component.input_code
        id: code_input
        required: true
        props:
          placeholder: 请输入6位验证码
          maxLength: 6
          autoFocus: true
      - ref: component.link
        id: resend_link
        props:
          label: 重新获取
      - ref: component.button_primary
        id: login_submit_button
        required: true
        props:
          label: 登录

  - name: loading
    pattern: spinner
    messageKey: verifying_code

  - name: empty
    messageKey: null  # 此页面无空状态

  - name: error
    errorCodes: [CODE_WRONG, CODE_EXPIRED, ACCOUNT_LOCKED, NETWORK_ERROR]
    messageKey: verify_page_error

# v1.1: 显隐规则
visibility_rules:
  - target: resend_link
    condition: "state.countdown == 0"
    hidden_reason: "倒计时未结束时隐藏重发链接"

# v1.1: 禁用规则
disabled_rules:
  - target: login_submit_button
    condition: "form.code.length != 6"
    message_key: please_enter_6_digit_code
    tooltip: true

  - target: resend_link
    condition: "state.countdown > 0"
    message_key: wait_n_seconds
    tooltip: true

# 交互定义
interactions:
  - id: submit_login
    trigger: click(login_submit_button)
    api:
      method: POST
      endpoint: /api/auth/login
      contractRef: api.auth_login
    success:
      toastKey: login_success
      redirect: page.dashboard
    failure:
      showInlineError: true

  - id: resend_code
    trigger: click(resend_link)
    api:
      method: POST
      endpoint: /api/auth/send-code
      contractRef: api.auth_send_code
    success:
      toastKey: code_resent
      updateState: countdown=60
    failure:
      showInlineError: true

  - id: go_back
    trigger: click(header.back)
    navigation:
      to: page.login_phone

# 校验规则
validation:
  - field: code
    rules:
      - type: required
        messageKey: code_required
      - type: pattern
        value: "^\\d{6}$"
        messageKey: invalid_code_format

# v1.1: 恢复路径
recovery_paths:
  - error_state: CODE_WRONG
    recovery_action: show_error
    message_key: wrong_code_retry
    cta_key: null

  - error_state: CODE_EXPIRED
    recovery_action: back_to_previous
    target: page.login_phone
    message_key: code_expired_resend
    cta_key: resend_code

  - error_state: ACCOUNT_LOCKED
    recovery_action: contact_support
    message_key: account_locked_contact
    cta_key: contact_support

  - error_state: NETWORK_ERROR
    recovery_action: retry
    message_key: network_error
    cta_key: retry
    max_retries: 3

# 埋点
tracking:
  exposure: [login_verify_view]
  actions:
    - event: login_submit_click
      trigger: click(login_submit_button)
    - event: login_resend_click
      trigger: click(resend_link)

# 可访问性
a11y:
  required: true
  focusOrder: [code_input, login_submit_button]
  landmarks:
    - role: main
      label: 验证码输入表单
