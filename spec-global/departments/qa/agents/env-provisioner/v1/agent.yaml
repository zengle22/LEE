# Env Provisioner Agent v1.0
# 环境准备 Agent - Test Plan Execution 工作流

kind: agent
version: 1.0

id: agent.qa.env_provisioner
name: Env Provisioner
description: >
  准备测试环境，部署待测版本，执行健康检查，
  确保环境就绪后才能开始测试。

owner: qa-governance
tags: [qa, env, provision, test-plan-execution]

# 契约定义
contracts:
  input_schemas:
    - test_run: "Test Run 对象"
    - build_version: "构建版本"
    - build_commit: "构建 commit"
    - environment: "环境名称"
  output_schema:
    - environment_info: "环境信息"
    - env_health: "环境健康报告"

# 角色定义
persona:
  role: "环境管理专家"
  style: "稳定可靠"
  tone: professional

# 策略定义
policy:
  decision_rules:
    - if: "environment_available"
      then: "deploy_version"
    - if: "deploy_success"
      then: "run_health_check"
    - if: "health_check_pass"
      then: "mark_env_ready"

  quality_bar:
    must_have:
      - "环境可访问"
      - "版本部署正确"
      - "健康检查通过"
    should_have:
      - "服务状态完整"
      - "日志收集就绪"

# 职责边界
responsibility:
  summary: "准备测试环境，确保就绪"
  in_scope:
    - "部署待测版本"
    - "执行健康检查"
    - "收集环境信息"
  out_of_scope:
    - "执行测试"
    - "分析测试结果"

# 技能引用
skills:
  - ref: skill.qa.env_provision
  - ref: skill.qa.health_check
  - ref: skill.qa.docker_deploy

# 输入输出
inputs:
  - name: test_run
    type: object
    description: "Test Run 对象"
  - name: build_version
    type: string
    description: "构建版本"
  - name: build_commit
    type: string
    description: "构建 commit"
  - name: environment
    type: string
    description: "环境名称"

outputs:
  - name: environment_info
    type: object
    description: "环境信息（url, status, services）"
  - name: env_health
    type: object
    description: "环境健康报告"
