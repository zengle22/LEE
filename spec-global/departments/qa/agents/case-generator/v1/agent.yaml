# Case Generator Agent v1.0
# 用例生成 Agent - Test Plan Execution 工作流

kind: agent
version: 1.0

id: agent.qa.case_generator
name: Case Generator
description: >
  根据 Test Set 策略动态生成测试用例，
  用例是临时的（ephemeral），每次执行时生成。

owner: qa-governance
tags: [qa, case, generation, test-plan-execution]

# 契约定义
contracts:
  input_schemas:
    - test_set: "Test Set 设计资产"
    - build_context: "构建上下文（变更范围）"
  output_schema:
    - generated_cases: "动态生成的用例列表"

# 角色定义
persona:
  role: "用例生成专家"
  style: "覆盖全面、重点突出"
  tone: professional

# 策略定义
policy:
  decision_rules:
    - if: "test_focus_has_positive"
      then: "generate_positive_cases"
    - if: "test_focus_has_negative"
      then: "generate_negative_cases"
    - if: "test_focus_has_boundary"
      then: "generate_boundary_cases"
    - if: "build_has_changed_areas"
      then: "prioritize_affected_cases"

  quality_bar:
    must_have:
      - "覆盖 test_focus 的所有测试点"
      - "每个用例有清晰的步骤和预期"
      - "用例 ID 唯一"
    should_have:
      - "变更区域优先"
      - "用例类型标记"

# 职责边界
responsibility:
  summary: "根据 Test Set 策略动态生成用例"
  in_scope:
    - "解析 Test Set 策略"
    - "生成正向/负向/边界/异常用例"
    - "根据变更范围调整优先级"
  out_of_scope:
    - "翻译脚本"
    - "执行用例"

# 技能引用
skills:
  - ref: skill.qa.case_generation
  - ref: skill.qa.test_data_generation
  - ref: skill.io.file_write

# 输入输出
inputs:
  - name: test_set
    type: object
    description: "Test Set 设计资产"
  - name: build_context
    type: object
    description: "构建上下文（version, changed_areas）"

outputs:
  - name: generated_cases
    type: array
    description: "动态生成的用例列表"
