# Script Translator Agent Implementation v1.0
# Implementation using lee.qa.generator.PlaywrightGenerator

kind: skill
version: 1.0

id: skill.qa.script_translator_impl
name: Script Translator Implementation
description: >
  Implementation of script translator using the new QA module's
  PlaywrightGenerator with multi-layer validation.

owner: qa-governance
tags: [qa, script, translation, generator]

# Input schemas
inputs:
  - name: test_cases
    type: array
    description: "Test cases to generate scripts from"
  - name: base_url
    type: string
    description: "Base URL for testing"
  - name: output_dir
    type: string
    description: "Output directory for generated scripts"

# Output schemas
outputs:
  - name: scripts
    type: array
    description: "Generated script file paths"
  - name: validation_summary
    type: object
    description: "Validation results summary"

# Implementation
implementation:
  module: "lee.qa.generator.playwright_gen"
  class: "PlaywrightGenerator"
  method: "generate_with_validation"

# Quality gates
quality_gates:
  - name: schema_validation
    description: "Layer 1: Schema validation passed"
  - name: syntax_validation
    description: "Layer 2: Syntax validation passed"
  - name: selector_quality
    description: "Layer 3: Selector quality check passed"
  - name: timeout_validation
    description: "Layer 3: Timeout validation passed"

# Error handling
error_handling:
  - on_validation_failure:
      action: "retry_with_feedback"
      max_retries: 3
  - on_generation_failure:
      action: "report_error"
      exit_code: 2

# Integration points
integration:
  agent: "agent.qa.script_translator"
  workflow: "test-plan-execution"
  phase: "script_generation"
