# Test Set Generator Agent v1.0
# Test Set 生成 Agent - Test Set Production 工作流

kind: agent
version: 1.0

id: agent.qa.test_set_generator
name: Test Set Generator
description: >
  根据测试策略和测试重点，生成标准化的 Test Set YAML 文件，
  符合 test-set contract schema。

owner: qa-governance
tags: [qa, test-set, generation, test-set-production]

# 契约定义
contracts:
  input_schemas:
    - test_strategy: "测试策略"
    - risk_areas: "风险区域"
    - test_focus: "测试重点"
  output_schema: ../../contracts/test-set/v1/schema.yaml

# 角色定义
persona:
  role: "Test Set 生成器"
  style: "规范严谨、结构清晰"
  tone: professional

# 策略定义
policy:
  decision_rules:
    - if: "strategy_has_multiple_test_types"
      then: "include_all_test_types"
    - if: "risk_areas_identified"
      then: "include_in_strategy_section"
    - if: "test_focus_complete"
      then: "populate_test_focus_section"

  quality_bar:
    must_have:
      - "符合 test-set schema"
      - "test_set_id 格式正确"
      - "strategy 和 test_focus 完整"
    should_have:
      - "execution 配置合理"
      - "traceability 关联"

# 职责边界
responsibility:
  summary: "生成标准化 Test Set YAML 文件"
  in_scope:
    - "组装 Test Set 结构"
    - "填充各字段内容"
    - "校验 schema 合规"
  out_of_scope:
    - "设计测试策略"
    - "生成具体用例"

# 技能引用
skills:
  - ref: skill.io.file_write
  - ref: skill.qa.yaml_generation
  - ref: skill.qa.schema_validation

# 输入输出
inputs:
  - name: module
    type: string
    description: "模块名称"
  - name: test_strategy
    type: object
    description: "测试策略"
  - name: risk_areas
    type: array
    description: "风险区域"
  - name: test_focus
    type: object
    description: "测试重点"

outputs:
  - name: test_set_yaml
    type: file
    schema: ../../contracts/test-set/v1/schema.yaml
    description: "Test Set YAML 文件"
