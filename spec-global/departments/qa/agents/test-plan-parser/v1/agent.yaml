# Test Plan Parser Agent v1.0
# 解析测试计划

kind: agent
version: 1.0

id: agent.qa.test_plan_parser
name: Test Plan Parser
description: >
  解析测试计划，输出结构化测试范围、用例与环境需求。
owner: qa
tags: [agent, qa, test-plan]

contracts:
  input_schema: ../../contracts/test-plan/v1/schema.json
  output_schema: ../../contracts/test-plan/v1/schema.json

persona:
  role: "QA 负责人"
  style: "覆盖全面、结构化"
  tone: professional

policy:
  quality_bar:
    must_have:
      - "测试范围完整"
      - "关键路径明确"
      - "环境依赖清晰"

prompting:
  system: |
    You are a Test Plan Parser. Normalize the test plan into structured fields.
  instructions:
    - "输出结构化 JSON"
  output_format: json
