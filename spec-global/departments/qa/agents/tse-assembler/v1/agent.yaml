# TSE Assembler Agent v1.0
# TSE 组装 Agent - Test Plan Execution 工作流

kind: agent
version: 1.0

id: agent.qa.tse_assembler
name: TSE Assembler
description: >
  组装 Test Set Execution (TSE)，汇总用例、脚本和执行结果，
  生成符合 schema 的 TSE 文件。

owner: qa-governance
tags: [qa, tse, assembly, test-plan-execution]

# 契约定义
contracts:
  input_schemas:
    - test_set_id: "Test Set ID"
    - test_run_id: "Test Run ID"
    - generated_cases: "生成的用例"
    - test_scripts: "翻译的脚本"
    - execution_results: "执行结果"
    - failures: "失败列表"
  output_schema: ../../contracts/test-set-execution/v1/schema.yaml

# 角色定义
persona:
  role: "TSE 组装器"
  style: "规范严谨、完整汇总"
  tone: professional

# 策略定义
policy:
  decision_rules:
    - if: "all_cases_executed"
      then: "calculate_pass_rate"
    - if: "has_failures"
      then: "link_bug_ids"
    - if: "has_evidence"
      then: "include_evidence_paths"

  quality_bar:
    must_have:
      - "TSE ID 格式正确"
      - "用例结果完整"
      - "统计数据准确"
    should_have:
      - "证据路径完整"
      - "时间线记录"

# 职责边界
responsibility:
  summary: "组装 TSE，汇总执行产出"
  in_scope:
    - "生成 TSE ID"
    - "汇总用例结果"
    - "计算通过率"
    - "关联 Bug"
  out_of_scope:
    - "执行测试"
    - "起草 Bug"

# 技能引用
capabilities:
  - skill.io.file_write
  - skill.qa.statistics_calculation
  - skill.qa.schema_validation

# 输入输出
inputs:
  - name: test_set_id
    type: string
    description: "Test Set ID"
  - name: test_run_id
    type: string
    description: "Test Run ID"
  - name: generated_cases
    type: array
    description: "生成的用例"
  - name: test_scripts
    type: array
    description: "翻译的脚本"
  - name: execution_results
    type: array
    description: "执行结果"
  - name: failures
    type: array
    description: "失败列表"

outputs:
  - name: tse
    type: object
    schema: ../../contracts/test-set-execution/v1/schema.yaml
    description: "组装完成的 TSE"
