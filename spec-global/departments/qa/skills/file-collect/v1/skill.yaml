# File Collect Skill v1.0
# 收集多个文件内容

kind: skill
version: 1.0

id: skill.file.collect
name: File Collect
description: >
  根据文件路径模式收集多个文件的内容。
  用于 L2 Phase 5 收集所有 L3 产生的 Bug 草稿。

owner: qa-governance
tags: [io, qa, file, collect]

interface:
  inputs:
    type: object
    required: [pattern]
    properties:
      pattern:
        type: string
        description: "文件路径模式（支持 glob）"
        example: "qa/bugs/*.yaml"
      base_dir:
        type: string
        description: "基准目录（可选，默认当前目录）"
      recursive:
        type: boolean
        default: false
        description: "是否递归搜索子目录"
      file_type:
        type: string
        enum: [yaml, json, text, auto]
        default: auto
        description: "文件类型，auto 自动检测"
      max_files:
        type: integer
        default: 100
        description: "最大收集文件数"

  outputs:
    type: object
    required: [files, count, contents]
    properties:
      files:
        type: array
        items:
          type: string
        description: "匹配的文件路径列表"
      count:
        type: integer
        description: "找到的文件数量"
      contents:
        type: array
        description: "文件内容列表（解析后）"
        items:
          type: object
          properties:
            path:
              type: string
            content:
              type: object
            error:
              type: string
      skipped:
        type: array
        items:
          type: string
        description: "跳过的文件（超过 max_files 或解析失败）"

runtime:
  type: cli
  command: "lee"
  args_template: >
    file-collect
    --pattern {{ inputs.pattern }}
    --base-dir {{ inputs.base_dir | default('.') }}
    --recursive {{ inputs.recursive }}
    --file-type {{ inputs.file_type }}
    --max-files {{ inputs.max_files }}
  timeout_ms: 10000

exit_codes:
  0: "收集成功"
  1: "收集失败（部分失败也可能返回 0，检查 skipped）"
  2: "参数错误"

constraints:
  deterministic: true
  side_effects: none
  pii: forbidden

examples:
  - input:
      pattern: "qa/bugs/*.yaml"
    output:
      files: ["qa/bugs/bug-001.yaml", "qa/bugs/bug-002.yaml"]
      count: 2
      contents:
        - path: "qa/bugs/bug-001.yaml"
          content:
            bug_id: "BG-2026-001"
            title: "登录超时"
        - path: "qa/bugs/bug-002.yaml"
          content:
            bug_id: "BG-2026-002"
            title: "支付失败"

  - input:
      pattern: "qa/test-runs/*/tse-*/results.yaml"
      recursive: true
    output:
      files: ["qa/test-runs/TR-001/tse-auth/results.yaml"]
      count: 1
      contents:
        - path: "qa/test-runs/TR-001/tse-auth/results.yaml"
          content:
            total_cases: 30
            passed_cases: 28
