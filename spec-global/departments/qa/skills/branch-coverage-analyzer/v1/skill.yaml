# Branch Coverage Analyzer Skill v1.0
# 分支覆盖分析技能 - 分析决策点并设计分支测试用例

kind: skill
version: 1.0

# ============================================
# 基础标识 (必填)
# ============================================
id: skill.qa.branch_coverage_analyzer
name: Branch Coverage Analyzer
description: >
  分析用户流程中的决策点，识别所有可能的分支路径，
  设计完整的分支测试用例，计算分支覆盖率，识别覆盖缺口。
owner: testing-team
tags: [testing, qa, branch-coverage, analysis, test-design]

# ============================================
# 接口定义 (必填) - 使用 JSON Schema 语法
# ============================================
interface:
  inputs:
    type: object
    required: [user_flows, feature_mapping]
    properties:
      user_flows:
        type: array
        description: "用户流程列表，包含所有决策点"
        items:
          type: object
          properties:
            flow_id:
              type: string
            name:
              type: string
            steps:
              type: array
              items:
                type: object
                properties:
                  step_number:
                    type: integer
                  description:
                    type: string
                  decision_point:
                    type: object
                    description: "如果此步骤是决策点，则包含决策信息"

      feature_mapping:
        type: array
        description: "功能点映射矩阵"
        items:
          type: object
          properties:
            feature_id:
              type: string
            feature_name:
              type: string
            priority:
              type: string
              enum: [P0, P1, P2]

      ui_interactions:
        type: array
        description: "UI 交互流程（可选）"
        items:
          type: object

      coverage_targets:
        type: object
        description: "覆盖率目标（可选）"
        properties:
          p0_target:
            type: number
            default: 100
            description: "P0 功能目标覆盖率"
          p1_target:
            type: number
            default: 95
            description: "P1 功能目标覆盖率"
          p2_target:
            type: number
            default: 90
            description: "P2 功能目标覆盖率"

  outputs:
    type: object
    required: [decision_points, coverage_report, test_cases]
    properties:
      decision_points:
        type: array
        description: "识别出的所有决策点"
        items:
          type: object
          required: [decision_point_id, type, description, branches]
          properties:
            decision_point_id:
              type: string
              pattern: "^DP-\\d{4}$"
            type:
              type: string
              enum: [conditional, loop, switch, exception, state_machine, complex_condition]
            description:
              type: string
            feature_id:
              type: string
            priority:
              type: string
              enum: [P0, P1, P2]
            branches:
              type: array
              items:
                type: object
                properties:
                  branch_id:
                    type: string
                  description:
                    type: string
                  path_condition:
                    type: string

      test_cases:
        type: array
        description: "分支测试用例"
        items:
          type: object
          required: [test_case_id, title, covered_branches, steps]
          properties:
            test_case_id:
              type: string
              pattern: "^BTC-\\d{4}$"
            title:
              type: string
            covered_branches:
              type: array
              items:
                type: string
            steps:
              type: array
            priority:
              type: string
              enum: [P0, P1, P2]

      coverage_matrix:
        type: array
        description: "分支覆盖矩阵"
        items:
          type: object
          properties:
            decision_point_id:
              type: string
            total_branches:
              type: integer
            covered_branches:
              type: integer
            coverage_percentage:
              type: number
            test_cases:
              type: array
              items:
                type: string

      coverage_report:
        type: object
        required: [total_decision_points, total_branches, covered_branches, coverage_percentage]
        properties:
          total_decision_points:
            type: integer
          total_branches:
            type: integer
          covered_branches:
            type: integer
          uncovered_branches:
            type: integer
          coverage_percentage:
            type: number
            minimum: 0
            maximum: 100
          coverage_by_priority:
            type: object
          coverage_by_type:
            type: object

      gaps:
        type: array
        description: "覆盖缺口列表"
        items:
          type: object
          properties:
            gap_id:
              type: string
            branch_id:
              type: string
            decision_point_id:
              type: string
            risk_level:
              type: string
              enum: [critical, high, medium, low]
            recommendation:
              type: string

      recommendations:
        type: array
        description: "优化建议"
        items:
          type: object

# ============================================
# 运行时配置 (必填)
# ============================================
runtime:
  type: analysis
  timeout_ms: 300000  # 5 分钟
  retries: 1

# ============================================
# 约束声明 (必填)
# ============================================
constraints:
  deterministic: true
  side_effects: none
  pii: forbidden

# ============================================
# 能力定义
# ============================================
capabilities:
  decision_point_identification:
    description: "识别各种类型的决策点"
    supported_types:
      - conditional: "if/else、三元运算符、逻辑判断"
      - loop: "for、while、do-while 循环"
      - switch: "switch/case、路由分发"
      - exception: "try/catch、错误处理"
      - state_machine: "状态转换、生命周期"
      - complex_condition: "多条件组合、嵌套判断"

  branch_analysis:
    description: "分析所有可能的分支路径"
    techniques:
      - path_enumeration: "枚举所有可能路径"
      - decision_table: "使用决策表处理复杂条件"
      - boundary_analysis: "边界值分析"
      - mc_dc: "修正条件/判定覆盖（可选）"

  coverage_calculation:
    description: "计算分支覆盖率"
    metrics:
      - total_branches: "总分支数"
      - covered_branches: "已覆盖分支数"
      - coverage_percentage: "覆盖率百分比"
      - by_priority: "按优先级统计"
      - by_type: "按决策点类型统计"

  gap_analysis:
    description: "识别覆盖缺口"
    analysis_points:
      - uncovered_branches: "未覆盖分支"
      - risk_assessment: "风险评估"
      - prioritization: "优先级排序"
      - recommendations: "优化建议"

# ============================================
# 测试钩子 (必填)
# ============================================
tests:
  smoke:
    - name: analyze_conditional_branches
      input:
        user_flows:
          - flow_id: "UF001"
            name: "Login Flow"
            steps:
              - step_number: 1
                description: "Enter credentials"
              - step_number: 2
                description: "Validate credentials"
                decision_point:
                  type: "conditional"
                  condition: "Are credentials valid?"
                  branches:
                    - id: "true"
                      description: "Valid - redirect to dashboard"
                    - id: "false"
                      description: "Invalid - show error"
        feature_mapping:
          - feature_id: "F001"
            feature_name: "User Authentication"
            priority: "P0"
      assert:
        - path: "$.decision_points.length"
          op: "=="
          value: 1
        - path: "$.decision_points[0].type"
          op: "=="
          value: "conditional"
        - path: "$.decision_points[0].branches.length"
          op: "=="
          value: 2
        - path: "$.coverage_report.total_branches"
          op: "=="
          value: 2
        - path: "$.coverage_report.covered_branches"
          op: "=="
          value: 2
        - path: "$.coverage_report.coverage_percentage"
          op: "=="
          value: 100
        - path: "$.test_cases.length"
          op: ">="
          value: 2

    - name: analyze_loop_branches
      input:
        user_flows:
          - flow_id: "UF002"
            name: "Cart Processing"
            steps:
              - step_number: 1
                description: "Process cart items"
                decision_point:
                  type: "loop"
                  condition: "Iterate over cart items"
                  branches:
                    - id: "zero"
                      description: "Empty cart (0 iterations)"
                    - id: "one"
                      description: "Single item (1 iteration)"
                    - id: "multiple"
                      description: "Multiple items (>1 iterations)"
        feature_mapping:
          - feature_id: "F002"
            feature_name: "Shopping Cart"
            priority: "P1"
      assert:
        - path: "$.decision_points.length"
          op: "=="
          value: 1
        - path: "$.decision_points[0].type"
          op: "=="
          value: "loop"
        - path: "$.decision_points[0].branches.length"
          op: "=="
          value: 3
        - path: "$.coverage_report.total_branches"
          op: "=="
          value: 3
        - path: "$.test_cases.length"
          op: ">="
          value: 3

    - name: identify_coverage_gaps
      input:
        user_flows:
          - flow_id: "UF003"
            name: "Payment Processing"
            steps:
              - step_number: 1
                description: "Select payment method"
                decision_point:
                  type: "switch"
                  condition: "Payment method"
                  branches:
                    - id: "credit_card"
                      description: "Credit card payment"
                    - id: "paypal"
                      description: "PayPal payment"
                    - id: "bank_transfer"
                      description: "Bank transfer"
        feature_mapping:
          - feature_id: "F003"
            feature_name: "Payment"
            priority: "P0"
        # Intentionally missing test cases for some branches
      assert:
        - path: "$.gaps"
          op: "exists"
        - path: "$.coverage_report.uncovered_branches"
          op: ">="
          value: 0
        - path: "$.recommendations"
          op: "exists"
