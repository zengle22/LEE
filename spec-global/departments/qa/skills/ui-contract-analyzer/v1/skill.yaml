# UI Contract Analyzer Skill v1.0
# UI 契约分析技能 - 分析 UI 页面契约，提取测试相关信息
#
# 此 Skill 提供基于 UI 契约的分析能力，从页面契约和组件契约中提取
# 页面信息、组件信息、交互流程和状态转换，用于辅助测试用例设计。

kind: skill
version: 1.0

# ============================================
# 基础标识 (必填)
# ============================================
id: skill.qa.ui_contract_analyzer
name: UI Contract Analyzer
description: >
  分析 UI 页面契约，提取页面信息、组件列表、交互流程和状态转换，
  为测试用例设计提供结构化的输入数据。
owner: qa-team
tags: [testing, ui-contract, analysis, test-design, contract-testing]

# ============================================
# 接口定义 (必填) - 使用 JSON Schema 语法
# ============================================
interface:
  inputs:
    type: object
    required: [ui_page_contract_path]
    properties:
      ui_page_contract_path:
        type: string
        description: "UI 页面契约文件路径（YAML/JSON），相对于项目根目录"
      ui_component_contract_path:
        type: string
        description: "UI 组件契约文件路径（YAML/JSON），相对于项目根目录（可选）"
      focus_pages:
        type: array
        items:
          type: string
        description: "需要重点关注的页面名称列表（可选，未指定则分析所有页面）"
      analysis_depth:
        type: string
        enum: [basic, detailed, full]
        default: detailed
        description: "分析深度：basic（基础信息）、detailed（包含交互）、full（完整分析）"
      include_variants:
        type: boolean
        default: true
        description: "是否包含组件变体和状态信息"

  outputs:
    type: object
    required: [pages, components, interactions, states, analysis_metadata]
    properties:
      pages:
        type: array
        description: "页面列表"
        items:
          type: object
          required: [name, path, route, components]
          properties:
            name:
              type: string
              description: "页面名称"
            path:
              type: string
              description: "页面文件路径"
            route:
              type: string
              description: "页面路由路径"
            title:
              type: string
              description: "页面标题"
            description:
              type: string
              description: "页面描述"
            components:
              type: array
              description: "页面中使用的组件列表"
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: "组件名称"
                  type:
                    type: string
                    description: "组件类型（button/form/input等）"
                  selector:
                    type: string
                    description: "组件选择器（用于测试定位）"
                  required:
                    type: boolean
                    description: "是否为必需组件"
            layout:
              type: string
              description: "页面布局类型（fixed/responsive）"
            accessibility:
              type: object
              description: "可访问性信息"
              properties:
                aria_labels:
                  type: boolean
                  description: "是否包含 ARIA 标签"
                keyboard_nav:
                  type: boolean
                  description: "是否支持键盘导航"
                screen_reader:
                  type: boolean
                  description: "是否支持屏幕阅读器"

      components:
        type: array
        description: "组件详细信息列表"
        items:
          type: object
          required: [name, type, properties]
          properties:
            name:
              type: string
              description: "组件名称"
            type:
              type: string
              description: "组件类型"
              enum: [button, input, form, table, modal, dropdown, checkbox, radio, slider, navigation, container, chart, text, image, other]
            properties:
              type: object
              description: "组件属性字典"
              additionalProperties: true
            events:
              type: array
              description: "组件支持的事件列表"
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: "事件名称（click/change/submit等）"
                  handler:
                    type: string
                    description: "事件处理函数"
            variants:
              type: array
              description: "组件变体列表"
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: "变体名称"
                  properties:
                    type: object
                    description: "变体特定属性"
            validation:
              type: object
              description: "验证规则"
              properties:
                required:
                  type: boolean
                  description: "是否必填"
                pattern:
                  type: string
                  description: "验证正则表达式"
                min_length:
                  type: integer
                  description: "最小长度"
                max_length:
                  type: integer
                  description: "最大长度"
                custom_rules:
                  type: array
                  items:
                    type: string
                  description: "自定义验证规则列表"

      interactions:
        type: array
        description: "交互流程列表"
        items:
          type: object
          required: [type, trigger, expected_behavior]
          properties:
            id:
              type: string
              description: "交互 ID"
            name:
              type: string
              description: "交互名称"
            type:
              type: string
              description: "交互类型"
              enum: [navigation, form_submission, data_entry, selection, modal, drag_drop, scroll, resize, other]
            trigger:
              type: object
              description: "触发条件"
              properties:
                element:
                  type: string
                  description: "触发元素"
                action:
                  type: string
                  description: "触发动作（click/input/hover等）"
                condition:
                  type: string
                  description: "触发条件描述"
            expected_behavior:
              type: object
              description: "预期行为"
              properties:
                result:
                  type: string
                  description: "预期结果"
                target_page:
                  type: string
                  description: "目标页面"
                state_change:
                  type: string
                  description: "状态变更"
                feedback:
                  type: string
                  description: "用户反馈（成功/错误消息等）"
            preconditions:
              type: array
              items:
                type: string
              description: "前置条件列表"
            postconditions:
              type: array
              items:
                type: string
              description: "后置条件列表"

      states:
        type: array
        description: "状态转换列表"
        items:
          type: object
          required: [name, type]
          properties:
            name:
              type: string
              description: "状态名称"
            type:
              type: string
              description: "状态类型"
              enum: [page_state, component_state, application_state, user_state]
            description:
              type: string
              description: "状态描述"
            conditions:
              type: object
              description: "状态条件"
              additionalProperties: true
            transitions:
              type: array
              description: "状态转换列表"
              items:
                type: object
                properties:
                  from:
                    type: string
                    description: "源状态"
                  to:
                    type: string
                    description: "目标状态"
                  trigger:
                    type: string
                    description: "触发事件"
                  action:
                    type: string
                    description: "转换动作"
            initial:
              type: boolean
              description: "是否为初始状态"
            terminal:
              type: boolean
              description: "是否为终止状态"

      analysis_metadata:
        type: object
        description: "分析元数据"
        required: [timestamp, analysis_version, source_files]
        properties:
          timestamp:
            type: string
            description: "分析时间戳（ISO 8601）"
          analysis_version:
            type: string
            description: "分析器版本"
          source_files:
            type: array
            description: "分析的源文件列表"
            items:
              type: object
              properties:
                path:
                  type: string
                  description: "文件路径"
                size:
                  type: integer
                  description: "文件大小（字节）"
                checksum:
                  type: string
                  description: "文件校验和（MD5）"
          statistics:
            type: object
            description: "统计信息"
            properties:
              total_pages:
                type: integer
                description: "总页面数"
              total_components:
                type: integer
                description: "总组件数"
              total_interactions:
                type: integer
                description: "总交互数"
              total_states:
                type: integer
                description: "总状态数"
              focused_pages:
                type: integer
                description: "重点关注的页面数"
          warnings:
            type: array
            description: "分析警告列表"
            items:
              type: object
              properties:
                level:
                  type: string
                  enum: [info, warning, error]
                  description: "警告级别"
                message:
                  type: string
                  description: "警告消息"
                location:
                  type: string
                  description: "警告位置"

# ============================================
# 运行时配置 (必填)
# ============================================
runtime:
  type: sync
  timeout_ms: 30000  # 30 秒
  retries: 1

# ============================================
# 约束声明 (必填)
# ============================================
constraints:
  deterministic: true    # 分析结果是确定性的
  side_effects: none     # 无副作用，仅读取和分析
  pii: forbidden         # 禁止使用 PII

# ============================================
# 测试钩子 (必填)
# ============================================
tests:
  smoke:
    - name: basic_contract_analysis
      input:
        ui_page_contract_path: "examples/ui-contract/pages.yaml"
      assert:
        - path: "$.pages"
          op: "typeof"
          value: "array"
        - path: "$.analysis_metadata.statistics.total_pages"
          op: ">"
          value: 0

    - name: analysis_with_focus_pages
      input:
        ui_page_contract_path: "examples/ui-contract/pages.yaml"
        focus_pages: ["HomePage", "LoginPage"]
      assert:
        - path: "$.analysis_metadata.statistics.focused_pages"
          op: "=="
          value: 2
        - path: "$.pages.length"
          op: "=="
          value: 2
