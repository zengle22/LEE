# Playwright Code Generator Skill v1.0
# Playwright 测试代码生成技能 - 基于测试用例和 UI 契约生成 Playwright 测试代码
#
# 此 Skill 提供基于测试用例和 UI 契约自动生成 Playwright 测试代码的能力，
# 支持生成测试规范文件、页面对象模型、配置文件和测试数据文件。

kind: skill
version: 1.0

# ============================================
# 基础标识 (必填)
# ============================================
id: skill.qa.playwright_code_generator
name: Playwright Code Generator
description: >
  基于测试用例和 UI 契约自动生成 Playwright 测试代码，
  支持生成测试规范文件、页面对象模型、配置文件和测试数据文件，
  采用 TypeScript 语言和 Page Object 模式，优先使用 data-testid 选择器，
  包含完整的断言和错误处理，失败时自动截图和记录 trace。
owner: testing-team
tags: [testing, qa, playwright, code-generation, automation, page-object, typescript]

# ============================================
# 接口定义 (必填) - 使用 JSON Schema 语法
# ============================================
interface:
  inputs:
    type: object
    required: [test_cases, ui_contracts]
    properties:
      test_cases:
        type: array
        description: "测试用例列表"
        items:
          type: object
          required: [test_case_id, title, steps]
          properties:
            test_case_id:
              type: string
              pattern: "^TC-\\w+$"
              description: "测试用例 ID，如 TC-LOGIN-001"
            title:
              type: string
              description: "测试用例标题"
            description:
              type: string
              description: "测试用例描述"
            priority:
              type: string
              enum: [P0, P1, P2]
              default: P1
              description: "优先级"
            tags:
              type: array
              items:
                type: string
              description: "标签，如 [smoke, regression]"
            preconditions:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum: [data_setup, state_setup, config_setup]
                  description:
                    type: string
                  action:
                    type: string
              description: "前置条件"
            steps:
              type: array
              description: "测试步骤"
              items:
                type: object
                required: [step_number, action]
                properties:
                  step_number:
                    type: integer
                  description:
                    type: string
                  action:
                    type: string
                    description: "操作描述，如 '输入用户名'"
                  element_id:
                    type: string
                    description: "元素 ID，对应 UI 契约中的 component_id"
                  expected_result:
                    type: string
                  screenshot_before:
                    type: boolean
                    default: false
                  screenshot_after:
                    type: boolean
                    default: false
            expected_results:
              type: array
              description: "期望结果"
              items:
                type: object
                properties:
                  assertion:
                    type: string
                  type:
                    type: string
                    enum: [visibility, text, value, attribute, state, count]
                  element_id:
                    type: string
                  expected_value:
                    type: string
            postconditions:
              type: array
              items:
                type: object
              description: "后置条件"
            test_data:
              type: object
              description: "测试数据"

      ui_contracts:
        type: array
        description: "UI 契约列表"
        items:
          type: object
          required: [component_id, component_name, selectors]
          properties:
            component_id:
              type: string
              description: "组件 ID，如 login-form-username"
            component_name:
              type: string
              description: "组件名称"
            page:
              type: string
              description: "所属页面"
            selectors:
              type: object
              required: [data_testid]
              properties:
                data_testid:
                  type: string
                  description: "data-testid 选择器（优先使用）"
                css:
                  type: string
                  description: "CSS 选择器（备用）"
                xpath:
                  type: string
                  description: "XPath 选择器（最后备用）"
                aria_label:
                  type: string
                  description: "ARIA label 选择器（无障碍优先）"
                role:
                  type: string
                  description: "ARIA role 选择器"
                text:
                  type: string
                  description: "文本内容选择器"
            type:
              type: string
              enum: [input, button, link, text, image, dropdown, checkbox, radio, table, dialog, menu, list, card]
              description: "组件类型"
            attributes:
              type: object
              description: "组件属性"
              properties:
                placeholder:
                  type: string
                value:
                  type: string
                href:
                  type: string
                required:
                  type: boolean
                disabled:
                  type: boolean
                visible:
                  type: boolean
            interactions:
              type: array
              description: "支持的交互"
              items:
                type: string
                enum: [click, type, select, check, hover, focus, scroll, drag, upload]

      output_format:
        type: string
        enum: [typescript, javascript]
        default: typescript
        description: "输出格式"

      target_browser:
        type: string
        enum: [chromium, firefox, webkit, all]
        default: chromium
        description: "目标浏览器"

      project_name:
        type: string
        description: "项目名称"

      base_url:
        type: string
        description: "基础 URL"

      config_options:
        type: object
        description: "配置选项"
        properties:
          timeout:
            type: integer
            default: 30000
            description: "默认超时时间（毫秒）"
          retries:
            type: integer
            default: 0
            description: "失败重试次数"
          screenshot_on_failure:
            type: boolean
            default: true
            description: "失败时截图"
          trace_on_failure:
            type: boolean
            default: true
            description: "失败时记录 trace"
          video:
            type: boolean
            default: false
            description: "录制视频"
          headless:
            type: boolean
            default: true
            description: "无头模式"

      page_object_pattern:
        type: object
        description: "页面对象模式配置"
        properties:
          generate:
            type: boolean
            default: true
            description: "是否生成页面对象"
          base_class:
            type: string
            default: "BasePage"
            description: "基类名称"
          actions_class:
            type: string
            default: "Actions"
            description: "操作类名称"
          assertions_class:
            type: string
            default: "Assertions"
            description: "断言类名称"

      test_data_format:
        type: string
        enum: [json, yaml, csv, typescript]
        default: json
        description: "测试数据文件格式"

  outputs:
    type: object
    required: [test_specs, page_objects, config, test_data]
    properties:
      test_specs:
        type: array
        description: "生成的测试规范文件列表"
        items:
          type: object
          required: [file_path, content, test_case_ids]
          properties:
            file_path:
              type: string
              description: "文件路径"
            content:
              type: string
              description: "文件内容"
            test_case_ids:
              type: array
              items:
                type: string
              description: "包含的测试用例 ID 列表"
            language:
              type: string
              enum: [typescript, javascript]
            framework:
              type: string
              enum: [playwright]

      page_objects:
        type: array
        description: "生成的页面对象列表"
        items:
          type: object
          required: [file_path, class_name, page_name, selectors]
          properties:
            file_path:
              type: string
              description: "文件路径"
            class_name:
              type: string
              description: "类名"
            page_name:
              type: string
              description: "页面名称"
            selectors:
              type: object
              description: "选择器定义"
              additionalProperties:
                type: string
            methods:
              type: array
              description: "方法列表"
              items:
                type: object
                properties:
                  name:
                    type: string
                  parameters:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                  return_type:
                    type: string
                  description:
                    type: string
            actions:
              type: array
              description: "操作方法"
              items:
                type: object
            assertions:
              type: array
              description: "断言方法"
              items:
                type: object

      config:
        type: object
        description: "配置文件内容"
        required: [playwright_config, tsconfig]
        properties:
          playwright_config:
            type: object
            description: "Playwright 配置文件内容"
            properties:
              file_path:
                type: string
              content:
                type: string
          tsconfig:
            type: object
            description: "TypeScript 配置文件内容"
            properties:
              file_path:
                type: string
              content:
                type: string
          package_json:
            type: object
            description: "package.json 依赖配置"
            properties:
              dependencies:
                type: object
              dev_dependencies:
                type: object
          env_config:
            type: object
            description: "环境配置文件"
            properties:
              file_path:
                type: string
              content:
                type: string

      test_data:
        type: object
        description: "测试数据文件内容"
        required: [files]
        properties:
          files:
            type: array
            description: "测试数据文件列表"
            items:
              type: object
              properties:
                file_path:
                  type: string
                format:
                  type: string
                  enum: [json, yaml, csv, typescript]
                content:
                  type: string
                data_sets:
                  type: array
                  description: "数据集"
                  items:
                    type: object

      helpers:
        type: array
        description: "生成的辅助工具类"
        items:
          type: object
          properties:
            file_path:
              type: string
            class_name:
              type: string
            description:
              type: string
            content:
              type: string

      report:
        type: object
        description: "生成报告"
        required: [total_files, languages, frameworks]
        properties:
          total_files:
            type: integer
            description: "生成的文件总数"
          test_specs_count:
            type: integer
            description: "测试规范文件数"
          page_objects_count:
            type: integer
            description: "页面对象文件数"
          config_files_count:
            type: integer
            description: "配置文件数"
          test_data_files_count:
            type: integer
            description: "测试数据文件数"
          languages:
            type: array
            items:
              type: string
          frameworks:
            type: array
            items:
              type: string
          coverage:
            type: object
            description: "测试用例覆盖率"
            properties:
              total_test_cases:
                type: integer
              generated_test_cases:
                type: integer
              coverage_percentage:
                type: number
              skipped_test_cases:
                type: array
                items:
                  type: object
                  properties:
                    test_case_id:
                      type: string
                    reason:
                      type: string
          warnings:
            type: array
            description: "警告信息"
            items:
              type: object
              properties:
                level:
                  type: string
                  enum: [warning, error, info]
                message:
                  type: string
                test_case_id:
                  type: string
                component_id:
                  type: string

# ============================================
# 运行时配置 (必填)
# ============================================
runtime:
  type: sync
  timeout_ms: 120000  # 2 分钟
  retries: 1

# ============================================
# 约束声明 (必填)
# ============================================
constraints:
  deterministic: true
  side_effects: writes
  pii: forbidden

# ============================================
# 代码生成规范
# ============================================
code_generation_standards:
  language:
    name: typescript
    version: "5.x"
    strict_mode: true

  framework:
    name: playwright
    version: ">=1.40.0"

  design_pattern:
    name: page_object_model
    description: "页面对象模式，分离页面元素定位和测试逻辑"

  selector_strategy:
    priority:
      - priority: 1
        type: data_testid
        description: "data-testid 属性选择器（最稳定）"
        example: 'page.getByTestId("submit-button")'
      - priority: 2
        type: aria_label
        description: "ARIA label 选择器（无障碍友好）"
        example: 'page.getByLabel("Username")'
      - priority: 3
        type: role
        description: "ARIA role 选择器"
        example: 'page.getByRole("button", { name: "Submit" })'
      - priority: 4
        type: text
        description: "文本内容选择器"
        example: 'page.getByText("Login")'
      - priority: 5
        type: css
        description: "CSS 选择器（备用）"
        example: 'page.locator(".login-form button")'
      - priority: 6
        type: xpath
        description: "XPath 选择器（最后备用）"
        example: 'page.locator("//button[@type="submit"]")'

  assertions:
    style: "explicit"
    framework: "expect"
    examples:
      - description: "元素可见性断言"
        code: 'await expect(page.getByTestId("success-message")).toBeVisible();'
      - description: "文本内容断言"
        code: 'await expect(page.getByTestId("title")).toHaveText("Welcome");'
      - description: "元素数量断言"
        code: 'await expect(page.getByTestId("item")).toHaveCount(3);'
      - description: "属性值断言"
        code: 'await expect(page.getByTestId("input")).toHaveAttribute("value", "test");'
      - description: "元素状态断言"
        code: 'await expect(page.getByTestId("button")).toBeEnabled();'

  error_handling:
    timeout_handling:
      default_timeout: 30000
      retry_on_timeout: true
      custom_timeout:
        description: "支持为特定操作设置自定义超时"
        example: |
          await page.getByTestId("slow-button").click({ timeout: 60000 });

    retry_logic:
      max_retries: 2
      description: "失败时自动重试"
      implementation: "使用 Playwright 内置 retry 机制"

    screenshot_on_failure:
      enabled: true
      capture: "full_page"
      path: "screenshots"

    trace_on_failure:
      enabled: true
      mode: "retain-on-failure"
      path: "traces"

    reporting:
      detail: "detailed"
      include_stack_trace: true
      include_error_message: true

  test_structure:
    file_naming:
      pattern: "{test_case_id}.spec.{ext}"
      example: "TC-LOGIN-001.spec.ts"

    test_organization:
      by_feature: true
      by_page: true
      by_priority: false

    test_blocks:
      - name: "beforeAll"
        description: "所有测试前执行一次"
        usage: "设置测试数据、启动服务"
      - name: "beforeEach"
        description: "每个测试前执行"
        usage: "导航到页面、重置状态"
      - name: "test"
        description: "测试用例主体"
        usage: "执行测试步骤和断言"
      - name: "afterEach"
        description: "每个测试后执行"
        usage: "清理测试数据、捕获失败信息"
      - name: "afterAll"
        description: "所有测试后执行一次"
        usage: "关闭连接、清理资源"

    best_practices:
      - description: "使用描述性测试名称"
        good: 'test("should display error message with invalid credentials"'
        bad: 'test("login test"'

      - description: "保持测试简短和专注"
        recommendation: "每个测试只验证一个功能点"

      - description: "使用页面对象模式"
        recommendation: "避免在测试中直接使用选择器"

      - description: "避免硬编码等待"
        recommendation: "使用自动等待和显式断言"

      - description: "使用测试数据驱动"
        recommendation: "将测试数据分离到独立文件"

# ============================================
# 页面对象模板
# ============================================
page_object_template:
  base_page:
    class_name: "BasePage"
    description: "所有页面对象的基类"
    methods:
      - name: "waitForLoadState"
        description: "等待页面加载完成"
      - name: "screenshot"
        description: "截图"
      - name: "waitForSelector"
        description: "等待元素出现"

  page_object_structure: |
    import { Page, Locator, expect } from '@playwright/test';
    import { BasePage } from './BasePage';

    export class {PageName}Page extends BasePage {
      readonly page: Page;
      readonly {ComponentId}: Locator;

      constructor(page: Page) {
        super(page);
        this.page = page;
        this.{ComponentId} = page.getByTestId('{data_testid}');
      }

      async {actionMethod}({parameters}): Promise<{returnType}> {
        await this.{ComponentId}.{action}();
        return {returnValue};
      }

      async {assertionMethod}(): Promise<void> {
        await expect(this.{ComponentId}).{assertion}();
      }
    }

  actions_class: |
    export class Actions {
      constructor(private pageObject: {PageName}Page) {}

      async {actionName}({parameters}): Promise<void> {
        // Action implementation
      }
    }

  assertions_class: |
    export class Assertions {
      constructor(private pageObject: {PageName}Page) {}

      async {assertionName}(): Promise<void> {
        // Assertion implementation
      }
    }

# ============================================
# 测试规范模板
# ============================================
test_spec_template: |
  import { test, expect } from '@playwright/test';
  import { {PageName}Page } from '../page-objects/{PageName}Page';

  test.describe('{TestSuiteName}', () => {
    let {PageName}Page: {PageName}Page;

    test.beforeEach(async ({ page }) => {
      {PageName}Page = new {PageName}Page(page);
      await page.goto('{BaseURL}');
    });

    test('{TestCaseId}: {TestTitle}', async ({ page }) => {
      // Arrange
      const testData = {TestData};

      // Act
      await {PageName}Page.{actionMethod}(testData);

      // Assert
      await expect({PageName}Page.{element}).{assertion}();
    });
  });

# ============================================
# 配置文件模板
# ============================================
config_templates:
  playwright_config: |
    import { defineConfig, devices } from '@playwright/test';

    export default defineConfig({
      testDir: './test-cases/e2e',
      fullyParallel: true,
      forbidOnly: !!process.env.CI,
      retries: process.env.CI ? 2 : 0,
      workers: process.env.CI ? 1 : undefined,
      reporter: [
        ['html', { outputFolder: 'test-results/html-report' }],
        ['json', { outputFile: 'test-results/results.json' }],
        ['junit', { outputFile: 'test-results/junit-results.xml' }]
      ],
      use: {
        baseURL: process.env.BASE_URL || 'http://localhost:3000',
        trace: 'retain-on-failure',
        screenshot: 'only-on-failure',
        video: 'retain-on-failure',
        headless: true,
      },
      projects: [
        {
          name: 'chromium',
          use: { ...devices['Desktop Chrome'] },
        },
        {
          name: 'firefox',
          use: { ...devices['Desktop Firefox'] },
        },
        {
          name: 'webkit',
          use: { ...devices['Desktop Safari'] },
        },
      ],
    });

  tsconfig: |
    {
      "compilerOptions": {
        "target": "ESNext",
        "module": "commonjs",
        "lib": ["ESNext", "DOM"],
        "strict": true,
        "esModuleInterop": true,
        "skipLibCheck": true,
        "forceConsistentCasingInFileNames": true,
        "moduleResolution": "node",
        "resolveJsonModule": true,
        "outDir": "./dist",
        "rootDir": "./",
        "types": ["node", "@playwright/test"]
      },
      "include": ["**/*.ts"],
      "exclude": ["node_modules", "dist", "test-results"]
    }

  package_json: |
    {
      "name": "{project-name}-e2e-tests",
      "version": "1.0.0",
      "description": "E2E tests using Playwright",
      "scripts": {
        "test": "playwright test",
        "test:headed": "playwright test --headed",
        "test:debug": "playwright test --debug",
        "test:chromium": "playwright test --project=chromium",
        "test:firefox": "playwright test --project=firefox",
        "test:webkit": "playwright test --project=webkit",
        "report": "playwright show-report",
        "install-browsers": "playwright install --with-deps"
      },
      "devDependencies": {
        "@playwright/test": "^1.40.0",
        "@types/node": "^20.0.0",
        "typescript": "^5.0.0"
      }
    }

  env_config: |
    # Environment Configuration
    BASE_URL=https://staging.example.com
    TEST_USER_EMAIL=test@example.com
    TEST_USER_PASSWORD=TestPassword123
    API_URL=https://api.staging.example.com

# ============================================
# 测试钩子 (必填)
# ============================================
tests:
  smoke:
    - name: generate_simple_login_test
      input:
        test_cases:
          - test_case_id: "TC-LOGIN-001"
            title: "成功登录"
            priority: "P0"
            tags: ["smoke", "auth"]
            steps:
              - step_number: 1
                description: "打开登录页面"
                action: "导航到登录页面"
              - step_number: 2
                description: "输入用户名"
                action: "输入用户名"
                element_id: "login-username"
              - step_number: 3
                description: "输入密码"
                action: "输入密码"
                element_id: "login-password"
              - step_number: 4
                description: "点击登录按钮"
                action: "点击"
                element_id: "login-submit"
              - step_number: 5
                description: "验证登录成功"
                action: "验证"
                element_id: "dashboard-header"
            expected_results:
              - assertion: "仪表盘标题可见"
                type: "visibility"
                element_id: "dashboard-header"
        ui_contracts:
          - component_id: "login-username"
            component_name: "登录用户名输入框"
            page: "login"
            selectors:
              data_testid: "login-username"
              aria_label: "Username"
            type: "input"
          - component_id: "login-password"
            component_name: "登录密码输入框"
            page: "login"
            selectors:
              data_testid: "login-password"
              aria_label: "Password"
            type: "input"
          - component_id: "login-submit"
            component_name: "登录提交按钮"
            page: "login"
            selectors:
              data_testid: "login-submit"
              aria_label: "Sign in"
            type: "button"
          - component_id: "dashboard-header"
            component_name: "仪表盘标题"
            page: "dashboard"
            selectors:
              data_testid: "dashboard-header"
            type: "text"
        output_format: "typescript"
        target_browser: "chromium"
        project_name: "my-app"
        base_url: "https://example.com"
      assert:
        - path: "$.test_specs.length"
          op: "=="
          value: 1
        - path: "$.test_specs[0].test_case_ids[0]"
          op: "=="
          value: "TC-LOGIN-001"
        - path: "$.test_specs[0].language"
          op: "=="
          value: "typescript"
        - path: "$.page_objects.length"
          op: ">="
          value: 1
        - path: "$.config.playwright_config"
          op: "exists"
