# ========== 分析信息 ==========
analysis:
  needs_debug: true

  root_cause: |
    ## 根本原因

    UniApp在H5编译模式下，将Vue组件编译为自定义Web Components：
    - `<button>` → `<uni-button>`
    - `<view>` → `<uni-view>`
    - `<text>` → `<uni-text>`

    Playwright E2E测试使用标准HTML选择器 `button:has-text("...")`，
    但实际DOM中渲染的是 `<uni-button>` 自定义元素，导致选择器失配。

    **影响范围：**
    - 所有使用 `button` 选择器的E2E测试（12个测试用例）
    - 潜在影响：所有使用标准HTML标签选择器的测试

  fix_plan: |
    ## 修复方案

    **方案1：创建UniApp选择器辅助函数（推荐）**

    ```typescript
    // tests/helpers/selectors.ts
    export const uniButton = (text: string) => `uni-button:has-text("${text}")`
    export const uniView = (className: string) => `uni-view.${className}`
    ```

    **方案2：使用更通用的选择器**

    使用 `:has-text()` 伪类而不依赖标签名：
    ```typescript
    page.locator(':has-text("开发测试登录")')
    ```

    **推荐使用方案1**，原因：
    - 明确的语义，易于维护
    - 类型安全（可添加TypeScript类型）
    - 可扩展性好（统一管理所有UniApp元素选择器）

  risk_area:
    - "e2e-tests"
    - "playwright-selectors"
    - "uniapp-h5-rendering"

  confidence: high

