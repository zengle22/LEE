# Bug Contract Schema v1.0
# Bug 生命周期契约标准

kind: contract_schema
version: 1.0

schema:
  type: object
  required:
    - bug_id
    - title
    - severity
    - category
    - status
    - detected_in
    - routing

  properties:
    # ========== 基础标识 ==========
    bug_id:
      type: string
      pattern: "^BUG-[0-9]{4}-[0-9]{4}$"
      description: "Bug 唯一标识，格式：BUG-YYYY-NNNN"
      example: "BUG-2026-0031"

    title:
      type: string
      minLength: 10
      maxLength: 200
      description: "Bug 标题，简洁描述问题"
      example: "登录后首页接口返回 500"

    severity:
      type: string
      enum: [P0, P1, P2, P3]
      description: |
        优先级定义：
        - P0: 阻塞核心流程，必须立即修复
        - P1: 影响主要功能，本轮必须修复
        - P2: 影响次要功能，可延后修复
        - P3: 体验瑕疵，可择机修复

    category:
      type: string
      enum:
        - functional      # 功能缺陷
        - performance     # 性能问题
        - security        # 安全漏洞
        - data            # 数据问题
        - requirement     # 需求争议
        - flaky           # 不稳定测试
        - env             # 环境问题
      description: "Bug 类别，用于路由和优先级判定"

    status:
      type: string
      enum:
        - new
        - triaged
        - routed
        - debugged
        - fixing
        - fixed
        - verifying
        - verified
        - closed
        - blocked_human
        - blocked_pm
        - blocked_env
        - blocked_dependency
      description: "Bug 当前状态，遵循状态机流转"

    # ========== 检测信息 ==========
    detected_in:
      type: object
      required: [round_id, version, env]
      properties:
        round_id:
          type: string
          description: "发现 Bug 的测试轮次"
          example: "TSTR-0003"

        version:
          type: string
          description: "测试版本号"
          example: "v0.8.3-rc1"

        env:
          type: string
          enum: [dev, test, staging, prod]
          description: "发现环境"

        test_suite:
          type: string
          description: "发现的测试套件"
          example: "e2e-chrome"

        test_case_id:
          type: string
          description: "失败的测试用例 ID"

    # ========== 证据 ==========
    evidence:
      type: object
      required: [trace_id]
      properties:
        trace_id:
          type: string
          description: "分布式追踪 ID"

        request_id:
          type: string
          description: "请求 ID"

        client_request_id:
          type: string
          description: "客户端请求 ID"

        screenshots:
          type: array
          items:
            type: string
          description: "截图文件路径列表"

        videos:
          type: array
          items:
            type: string
          description: "录屏文件路径列表"

        logs_hint:
          type: array
          items:
            type: string
          description: "日志关键词或服务名"
          example: ["api-gateway", "home-service"]

        reproduction_steps:
          type: string
          description: "复现步骤（Markdown 格式）"

        environment_details:
          type: object
          description: "环境详情（浏览器、OS、网络等）"

    # ========== 路由信息 ==========
    routing:
      type: object
      required: [owner_team, owner_agent]
      properties:
        owner_team:
          type: string
          enum: [frontend, backend, platform, product, qa]
          description: "负责团队"

        owner_agent:
          type: string
          description: "负责 Agent ID"

        pm_agent:
          type: string
          description: "产品 Agent ID"

        qa_agent:
          type: string
          description: "测试 Agent ID"

    # ========== 分析信息 ==========
    analysis:
      type: object
      properties:
        needs_debug:
          type: boolean
          description: "是否需要 Debug Agent 诊断"
          default: false

        root_cause:
          type: string
          description: "根本原因分析（由 Debug Agent 填写）"

        fix_plan:
          type: string
          description: "修复计划（由 Debug Agent 建议）"

        risk_area:
          type: array
          items:
            type: string
          description: "影响范围/风险区域"
          example: ["auth", "home_api", "cache"]

        confidence:
          type: string
          enum: [low, medium, high]
          description: "诊断置信度"

    # ========== 决策信息 ==========
    decision:
      type: object
      properties:
        needs_human:
          type: boolean
          description: "是否需要人类介入"
          default: false

        human_reason:
          type: string
          enum:
            - security
            - data_loss
            - payment
            - legal
            - major_scope_change
            - ambiguity
          description: "需要人类介入的原因"

        human_approver:
          type: string
          description: "人类审批者"

        human_decision:
          type: string
          description: "人类决策内容"

        pm_resolution:
          type: string
          enum: [by_design, change_required, clarified]
          description: "产品经理解决方案"

        resolution:
          type: string
          enum: [fixed, by_design, wont_fix, cannot_reproduce, duplicate]
          description: "最终解决方案"

        business_impact:
          type: string
          description: "业务影响描述"

        scope_change:
          type: string
          enum: [none, minor, major]
          description: "修复是否导致范围变更"

    # ========== 修复信息 ==========
    fix:
      type: object
      properties:
        fix_commit:
          type: string
          description: "修复的 Git commit hash"

        fix_version:
          type: string
          description: "修复版本号"

        change_summary:
          type: string
          description: "修复内容摘要"

        changed_files:
          type: array
          items:
            type: string
          description: "修改的文件列表"

        risk_assessment:
          type: string
          description: "修复风险评估"

    # ========== 验证信息 ==========
    verification:
      type: object
      properties:
        required:
          type: boolean
          description: "是否需要验证"
          default: true

        verified_by:
          type: string
          description: "验证者 Agent ID（不能等于 owner_agent）"

        verified_in_round:
          type: string
          description: "验证的测试轮次"

        regression_case_ids:
          type: array
          items:
            type: string
          description: "回归测试用例 ID 列表"

        verification_result:
          type: string
          enum: [passed, failed]
          description: "验证结果"

        verification_note:
          type: string
          description: "验证备注"

    # ========== 依赖信息 ==========
    dependency:
      type: object
      properties:
        blocking_bugs:
          type: array
          items:
            type: string
          description: "阻塞本 Bug 的其他 Bug ID 列表"

        blocked_bugs:
          type: array
          items:
            type: string
          description: "被本 Bug 阻塞的其他 Bug ID 列表"

    # ========== 基础设施修复 ==========
    infra_fix_details:
      type: string
      description: "基础设施修复详情（环境/不稳定问题）"

    # ========== 元数据 ==========
    created_at:
      type: string
      format: date-time
      description: "创建时间"

    created_by:
      type: string
      description: "创建者"

    updated_at:
      type: string
      format: date-time
      description: "最后更新时间"

    closed_at:
      type: string
      format: date-time
      description: "关闭时间"

    closed_by:
      type: string
      description: "关闭者"

# ========== 验证规则 ==========
validation_rules:
  - rule: "no_self_certification"
    description: "防止自证闭环"
    check: "verification.verified_by != routing.owner_agent"
    error_message: "验证者不能是 Bug 负责人"

  - rule: "fix_commit_required_for_fixed"
    description: "修复状态必须有 commit"
    check: "IF status == fixed THEN fix.fix_commit IS NOT NULL"
    error_message: "status=fixed 时必须填写 fix.fix_commit"

  - rule: "pm_resolution_required_for_blocked_pm"
    description: "产品阻塞必须有决策"
    check: "IF status == blocked_pm AND transition_to != blocked_pm THEN decision.pm_resolution IS NOT NULL"
    error_message: "从 blocked_pm 流转必须有 pm_resolution"

  - rule: "human_approver_required_for_human_gate"
    description: "人类门禁必须记录审批者"
    check: "IF status == blocked_human AND transition_to != blocked_human THEN decision.human_approver IS NOT NULL"
    error_message: "从 blocked_human 流转必须记录 human_approver"

  - rule: "resolution_required_for_closed"
    description: "关闭必须有结论"
    check: "IF status == closed THEN decision.resolution IS NOT NULL"
    error_message: "status=closed 时必须填写 decision.resolution"

  - rule: "verified_by_required_for_verified"
    description: "验证状态必须记录验证者"
    check: "IF status == verified THEN verification.verified_by IS NOT NULL"
    error_message: "status=verified 时必须填写 verification.verified_by"

# ========== 权限规则 ==========
permission_rules:
  - role: qa_agent
    can_write_status: [new, triaged, verifying, verified, closed]
    cannot_write_fields:
      - fix.*
      - analysis.root_cause
      - decision.pm_resolution
      - decision.human_decision

  - role: debug_agent
    can_write_fields:
      - analysis.root_cause
      - analysis.fix_plan
      - analysis.risk_area
      - analysis.confidence
    cannot_write_status: true

  - role: dev_agent
    can_write_status: [fixing, fixed]
    can_write_fields:
      - fix.*
      - analysis.root_cause (supplement only)
    cannot_write_fields:
      - verification.*
      - decision.*
    cannot_write_status: [verified, closed]

  - role: pm_agent
    can_write_status: [blocked_pm -> routed, blocked_pm -> closed]
    can_write_fields:
      - decision.pm_resolution
      - decision.business_impact
      - decision.scope_change
    cannot_write_fields:
      - fix.*
      - verification.*

  - role: human_approver
    can_write_status: [blocked_human -> routed, blocked_human -> closed]
    can_write_fields:
      - decision.human_decision
      - decision.human_approver
      - decision.resolution (for wont_fix/by_design only)
    cannot_write_fields:
      - fix.*
      - verification.*

  - role: platform_agent
    can_write_status: [blocked_env -> routed, blocked_env -> closed]
    can_write_fields:
      - infra_fix_details
    cannot_write_fields:
      - application level fields

# ========== 示例 ==========
examples:
  - name: "功能缺陷示例"
    data:
      bug_id: "BUG-2026-0031"
      title: "登录后首页接口返回 500"
      severity: P0
      category: functional
      status: fixed
      detected_in:
        round_id: "TSTR-0003"
        version: "v0.8.3-rc1"
        env: test
      evidence:
        trace_id: "abc123"
        request_id: "req-456"
        screenshots: ["screenshots/bug-31-1.png"]
        logs_hint: ["api-gateway", "home-service"]
      routing:
        owner_team: backend
        owner_agent: backend-dev-agent
        qa_agent: qa-agent
      analysis:
        root_cause: "缓存失效导致数据库查询超时"
        fix_plan: "增加缓存预热逻辑"
        risk_area: ["cache", "home_api"]
        confidence: high
      fix:
        fix_commit: "a1b2c3d"
        fix_version: "v0.8.3-rc2"
        change_summary: "增加缓存预热和降级逻辑"

  - name: "需求争议示例"
    data:
      bug_id: "BUG-2026-0032"
      title: "用户期望点击返回按钮直接退出，而非返回上一页"
      severity: P2
      category: requirement
      status: closed
      detected_in:
        round_id: "TSTR-0003"
        version: "v0.8.3-rc1"
        env: test
      routing:
        owner_team: product
        pm_agent: pm-agent
      decision:
        needs_human: false
        pm_resolution: by_design
        business_impact: "按照原设计，返回按钮应返回上一页"
        resolution: by_design
