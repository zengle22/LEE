# Test Suite Contract Schema v1.0
# 测试套件契约标准

kind: contract_schema
version: 1.0

schema:
  type: object
  required:
    - suite_id
    - name
    - type
    - test_cases
    - execution_strategy

  properties:
    # ========== 基础标识 ==========
    suite_id:
      type: string
      pattern: "^SUITE-[A-Z0-9]+-[0-9]{3}$"
      description: "测试套件唯一标识"
      examples:
        - "SUITE-SMOKE-001"
        - "SUITE-E2E-001"
        - "SUITE-REGRESSION-001"

    name:
      type: string
      description: "套件名称"
      examples:
        - "冒烟测试套件"
        - "E2E Chrome浏览器测试"
        - "回归测试套件"

    description:
      type: string
      description: "套件描述和目标"

    type:
      type: string
      enum:
        - smoke           # 冒烟测试
        - sanity          # 快速验证
        - regression      # 回归测试
        - full_regression # 全量回归
        - e2e             # 端到端
        - api             # API测试
        - performance     # 性能测试
        - security        # 安全测试
        - integration     # 集成测试
      description: "套件类型"

    # ========== 测试用例清单 ==========
    test_cases:
      type: array
      minItems: 1
      items:
        type: object
        required: [case_id, enabled]
        properties:
          case_id:
            type: string
            description: "用例ID"

          enabled:
            type: boolean
            description: "是否启用"
            default: true

          order:
            type: integer
            description: "执行顺序（可选，默认按case_id排序）"

          dependencies:
            type: array
            items:
              type: string
            description: "依赖的其他用例ID"

          run_condition:
            type: string
            description: "运行条件表达式"
            examples:
              - "env == 'test'"
              - "feature_flag.new_ui == true"

    # ========== 执行策略 ==========
    execution_strategy:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum:
            - sequential      # 顺序执行
            - parallel        # 并行执行
            - smart_parallel  # 智能并行（无依赖的并行）
          description: "执行模式"

        max_parallel:
          type: integer
          minimum: 1
          maximum: 20
          description: "最大并行数（仅parallel模式）"

        retry_on_failure:
          type: boolean
          description: "失败时是否重试"
          default: false

        max_retries:
          type: integer
          minimum: 0
          maximum: 3
          description: "最大重试次数"

        fail_fast:
          type: boolean
          description: "遇到失败立即停止"
          default: false

        timeout_seconds:
          type: number
          description: "套件总超时时间（秒）"

    # ========== 环境要求 ==========
    environment:
      type: object
      properties:
        required_services:
          type: array
          items:
            type: string
          description: "依赖的服务"
          examples:
            - "frontend"
            - "backend"
            - "database"

        required_env_vars:
          type: array
          items:
            type: string
          description: "必需的环境变量"

        browser:
          type: string
          enum: [chromium, firefox, webkit, wechat]
          description: "浏览器类型（仅E2E测试）"

        platform:
          type: string
          enum: [web, mobile, desktop]
          description: "测试平台"

    # ========== 数据准备 ==========
    setup:
      type: object
      properties:
        before_suite:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                description: "准备动作"
              script:
                type: string
                description: "脚本路径"

        after_suite:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                description: "清理动作"
              script:
                type: string
                description: "脚本路径"

        test_data:
          type: object
          description: "测试数据准备"
          properties:
            source:
              type: string
              description: "数据源"
            script:
              type: string
              description: "数据准备脚本"

    # ========== 覆盖范围 ==========
    coverage:
      type: object
      properties:
        target_modules:
          type: array
          items:
            type: string
          description: "目标功能模块"
          examples:
            - "login"
            - "runner-profile"
            - "plan-generation"

        requirement_coverage:
          type: array
          items:
            type: string
          description: "覆盖的需求ID列表"

        risk_areas:
          type: array
          items:
            type: string
          description: "覆盖的风险区域"

    # ========== 执行历史 ==========
    execution_history:
      type: array
      items:
        type: object
        properties:
          round_id:
            type: string
            description: "测试轮次ID"

          executed_at:
            type: string
            format: date-time
            description: "执行时间"

          total_cases:
            type: integer
            description: "总用例数"

          passed:
            type: integer
            description: "通过数"

          failed:
            type: integer
            description: "失败数"

          skipped:
            type: integer
            description: "跳过数"

          pass_rate:
            type: number
            description: "通过率（%）"

          duration_seconds:
            type: number
            description: "执行耗时"

          report_path:
            type: string
            description: "测试报告路径"

    # ========== 元数据 ==========
    owner:
      type: string
      description: "负责人"

    created_at:
      type: string
      format: date-time
      description: "创建时间"

    updated_at:
      type: string
      format: date-time
      description: "最后更新时间"

    status:
      type: string
      enum: [active, deprecated, archived]
      description: "套件状态"

# ========== 验证规则 ==========
validation_rules:
  - rule: "smoke_must_be_p0_p1"
    description: "冒烟测试套件只能包含P0/P1用例"
    check: "IF type == 'smoke' THEN ALL test_cases HAVE priority IN [P0, P1]"
    error_message: "冒烟测试套件只能包含P0/P1优先级用例"

  - rule: "regression_must_be_automated"
    description: "回归测试套件必须自动化"
    check: "IF type IN ['regression', 'full_regression'] THEN ALL test_cases HAVE automation.automated == true"
    error_message: "回归测试套件的所有用例必须自动化"

  - rule: "parallel_needs_max_parallel"
    description: "并行模式必须指定max_parallel"
    check: "IF execution_strategy.mode == 'parallel' THEN execution_strategy.max_parallel IS NOT NULL"
    error_message: "并行执行模式必须指定max_parallel参数"

# ========== 示例 ==========
examples:
  - name: "冒烟测试套件"
    data:
      suite_id: "SUITE-SMOKE-001"
      name: "AI Marathon Coach 冒烟测试套件"
      description: "快速验证核心功能可用性，作为测试准入门禁"
      type: smoke

      test_cases:
        - case_id: "F-BASE-001"
          enabled: true
          order: 1

        - case_id: "F-BASE-002"
          enabled: true
          order: 2

        - case_id: "F-P1-001"
          enabled: true
          order: 3

        - case_id: "F-P1-002"
          enabled: true
          order: 4

        - case_id: "F-P1-004"
          enabled: true
          order: 5

      execution_strategy:
        mode: sequential
        retry_on_failure: false
        fail_fast: true
        timeout_seconds: 600

      environment:
        required_services:
          - "frontend"
          - "backend"
        browser: chromium
        platform: web

      setup:
        before_suite:
          - action: "启动前后端服务"
            script: "scripts/start-services.sh"

        after_suite:
          - action: "清理测试数据"
            script: "scripts/cleanup.sh"

      coverage:
        target_modules:
          - "login"
          - "runner-profile"
          - "plan-intro"
        requirement_coverage:
          - "REQ-2026-001"
          - "REQ-2026-005"

      owner: "qa-team"
      status: active

  - name: "E2E完整测试套件"
    data:
      suite_id: "SUITE-E2E-001"
      name: "E2E Chrome浏览器完整测试"
      description: "覆盖所有用户路径的端到端测试"
      type: e2e

      test_cases:
        - case_id: "F-BASE-002"
          enabled: true
        - case_id: "F-P1-001"
          enabled: true
        - case_id: "F-P1-002"
          enabled: true
        - case_id: "F-P1-003"
          enabled: true
        - case_id: "F-P1-004"
          enabled: true
        - case_id: "F-P1-005"
          enabled: true
        - case_id: "F-P2-001"
          enabled: true
        - case_id: "F-P2-002"
          enabled: true
        - case_id: "F-P2-003"
          enabled: true
        - case_id: "Path-1"
          enabled: true
        - case_id: "Path-2"
          enabled: true
        - case_id: "Path-3"
          enabled: true

      execution_strategy:
        mode: parallel
        max_parallel: 3
        retry_on_failure: true
        max_retries: 1
        fail_fast: false
        timeout_seconds: 3600

      environment:
        required_services:
          - "frontend"
          - "backend"
        required_env_vars:
          - "BASE_URL"
          - "BACKEND_URL"
        browser: chromium
        platform: web

      coverage:
        target_modules:
          - "login"
          - "runner-profile"
          - "plan-intro"
          - "race-goal"
          - "plan-generation"

      owner: "qa-team"
      status: active

  - name: "回归测试套件 - Bug相关"
    data:
      suite_id: "SUITE-REGRESSION-001"
      name: "Bug修复回归测试"
      description: "验证已修复Bug不复发"
      type: regression

      test_cases:
        - case_id: "F-BASE-002"
          enabled: true
          dependencies: []

        - case_id: "F-P1-004"
          enabled: true
          dependencies: ["F-BASE-002"]

        - case_id: "F-P2-003"
          enabled: true
          dependencies: ["F-P1-004"]

        - case_id: "Path-1"
          enabled: true
          dependencies: []

      execution_strategy:
        mode: smart_parallel
        max_parallel: 2
        retry_on_failure: false
        fail_fast: false
        timeout_seconds: 1800

      environment:
        required_services:
          - "frontend"
          - "backend"
        browser: chromium

      coverage:
        risk_areas:
          - "e2e-test-selectors"
          - "uniapp-h5-rendering"

      owner: "qa-team"
      status: active
