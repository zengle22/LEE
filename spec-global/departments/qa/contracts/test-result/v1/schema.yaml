# Test Result Contract Schema v1.0
# 测试执行结果契约标准

kind: contract_schema
version: 1.0

schema:
  type: object
  required:
    - source
    - executed_at
    - results

  properties:
    # ========== 执行来源 ==========
    source:
      type: string
      enum:
        - manual          # 人工执行
        - claude_code     # Claude Code 执行
        - runner          # 自动化 Runner
        - hybrid          # 混合来源
      description: "测试执行来源"

    executor:
      type: string
      description: "执行者标识（人名或 Agent ID）"
      example: "claude-code-agent"

    executed_at:
      type: string
      format: date-time
      description: "执行时间"

    execution_duration_seconds:
      type: number
      description: "总执行耗时（秒）"

    # ========== 测试环境 ==========
    environment:
      type: object
      properties:
        env_type:
          type: string
          enum: [dev, test, staging, prod]
          description: "环境类型"

        target_version:
          type: string
          description: "测试目标版本"
          example: "v1.0.0-rc1"

        browser:
          type: string
          description: "浏览器（如适用）"
          example: "chrome-120"

        os:
          type: string
          description: "操作系统（如适用）"
          example: "windows-11"

        base_url:
          type: string
          description: "测试基础 URL"

    # ========== 执行结果列表 ==========
    results:
      type: array
      description: "单条测试用例的执行结果"
      items:
        type: object
        required:
          - case_id
          - status

        properties:
          # ========== 基础信息 ==========
          case_id:
            type: string
            description: "关联的测试用例 ID"
            example: "F-BASE-002"

          status:
            type: string
            enum:
              - pass           # 通过
              - fail           # 失败
              - blocked        # 阻塞
              - skipped        # 跳过
            description: "执行结果状态"

          # ========== 执行信息 ==========
          executed_at:
            type: string
            format: date-time
            description: "该用例的执行时间"

          duration_seconds:
            type: number
            description: "执行耗时（秒）"

          retry_count:
            type: integer
            description: "重试次数"
            default: 0

          # ========== 失败信息 ==========
          failure_info:
            type: object
            description: "失败详情（仅当 status=fail 时必填）"
            properties:
              error_message:
                type: string
                description: "错误消息"

              error_type:
                type: string
                enum:
                  - assertion_failed
                  - timeout
                  - network_error
                  - element_not_found
                  - unexpected_exception
                description: "错误类型"

              failed_step:
                type: integer
                description: "失败的步骤序号"

              expected:
                type: string
                description: "预期结果"

              actual:
                type: string
                description: "实际结果"

              stack_trace:
                type: string
                description: "堆栈跟踪（如适用）"

          # ========== 证据信息 ==========
          evidence:
            type: object
            description: "测试证据"
            properties:
              # 分布式追踪
              trace_id:
                type: string
                description: "分布式追踪 ID"

              request_id:
                type: string
                description: "请求 ID"

              # 截图/录屏
              screenshots:
                type: array
                items:
                  type: string
                description: "截图文件路径列表"
                example: ["evidence/f-base-002-1.png", "evidence/f-base-002-2.png"]

              videos:
                type: array
                items:
                  type: string
                description: "录屏文件路径列表"

              # 日志
              logs_hint:
                type: array
                items:
                  type: string
                description: "日志关键词或服务名"
                example: ["api-gateway", "runner-profile-service"]

              log_files:
                type: array
                items:
                  type: string
                description: "日志文件路径列表"

              # 网络请求
              network_requests:
                type: array
                items:
                  type: object
                  properties:
                    url: string
                    method: string
                    status_code: integer
                    response_time_ms: integer

              # API 响应
              api_response:
                type: object
                description: "API 响应内容"

              # 备注
              note:
                type: string
                description: "人工备注或说明"

          # ========== 阻塞信息 ==========
          blocked_info:
            type: object
            description: "阻塞详情（仅当 status=blocked 时必填）"
            properties:
              blocker_type:
                type: string
                enum:
                  - environment
                  - dependency
                  - data
                  - configuration
                description: "阻塞类型"

              blocker_id:
                type: string
                description: "关联的阻塞 ID（如 Bug ID）"

              reason:
                type: string
                description: "阻塞原因"

          # ========== 跳过信息 ==========
          skipped_info:
            type: object
            description: "跳过详情（仅当 status=skipped 时必填）"
            properties:
              reason:
                type: string
                enum:
                  - not_applicable
                  - feature_disabled
                  - environment_limitation
                  - dependency_blocked
                description: "跳过原因"

              note:
                type: string
                description: "补充说明"

    # ========== 执行摘要 ==========
    summary:
      type: object
      description: "执行结果摘要（可选，由系统自动计算）"
      properties:
        total_cases:
          type: integer
          description: "总用例数"

        total_executed:
          type: integer
          description: "已执行用例数"

        passed:
          type: integer
          description: "通过数"

        failed:
          type: integer
          description: "失败数"

        blocked:
          type: integer
          description: "阻塞数"

        skipped:
          type: integer
          description: "跳过数"

        pass_rate:
          type: number
          description: "通过率（%）"

        # 按优先级统计
        by_priority:
          type: object
          properties:
            p0:
              type: object
              properties:
                total: integer
                passed: integer
                failed: integer
                pass_rate: number
            p1:
              type: object
              properties:
                total: integer
                passed: integer
                failed: integer
                pass_rate: number

        # 按套件统计
        by_suite:
          type: object
          properties:
            smoke:
              type: object
              properties:
                total: integer
                passed: integer
                failed: integer
                pass_rate: number

    # ========== 元数据 ==========
    metadata:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          description: "标签"

        notes:
          type: string
          description: "备注"

        attachments:
          type: array
          items:
            type: string
          description: "附件文件路径列表"

# ========== 验证规则 ==========
validation_rules:
  - rule: "failure_info_required_for_fail_status"
    description: "失败状态必须填写失败信息"
    check: "IF status == fail THEN failure_info IS NOT NULL"
    error_message: "status=fail 时必须填写 failure_info"

  - rule: "evidence_required_for_p0_p1_failures"
    description: "P0/P1 失败必须有证据"
    check: "IF status == fail AND case_priority IN [P0, P1] THEN evidence IS NOT NULL"
    error_message: "P0/P1 失败必须提供证据"

  - rule: "trace_id_required_for_p0_failures"
    description: "P0 失败必须有 trace_id"
    check: "IF status == fail AND case_priority == P0 THEN evidence.trace_id IS NOT NULL"
    error_message: "P0 失败必须提供 trace_id"

  - rule: "blocked_info_required_for_blocked_status"
    description: "阻塞状态必须填写阻塞信息"
    check: "IF status == blocked THEN blocked_info IS NOT NULL"
    error_message: "status=blocked 时必须填写 blocked_info"

  - rule: "skipped_info_required_for_skipped_status"
    description: "跳过状态必须填写跳过信息"
    check: "IF status == skipped THEN skipped_info IS NOT NULL"
    error_message: "status=skipped 时必须填写 skipped_info"

  - rule: "pass_rate_calculation"
    description: "通过率计算正确"
    check: "summary.pass_rate == (summary.passed / summary.total_executed * 100)"
    error_message: "通过率计算错误"

# ========== 示例 ==========
examples:
  - name: "Claude Code 执行结果示例"
    description: "通过 Claude Code 执行测试后的结果文件"
    data:
      source: claude_code
      executor: "claude-code-agent"
      executed_at: "2026-02-05T10:30:00Z"
      execution_duration_seconds: 300
      environment:
        env_type: test
        target_version: "v1.0.0-rc1"
        base_url: "http://localhost:3000"

      results:
        # 通过用例
        - case_id: "F-BASE-002"
          status: pass
          executed_at: "2026-02-05T10:31:00Z"
          duration_seconds: 5
          evidence:
            screenshots: ["evidence/f-base-002-pass.png"]
            note: "正常登录成功"

        # 失败用例 - P1
        - case_id: "F-P1-001"
          status: fail
          executed_at: "2026-02-05T10:32:00Z"
          duration_seconds: 15
          failure_info:
            error_message: "保存后数据未刷新，页面仍显示旧数据"
            error_type: assertion_failed
            failed_step: 3
            expected: "页面显示新保存的数据"
            actual: "页面仍显示旧数据"
          evidence:
            trace_id: "trace-abc-123"
            screenshots:
              - "evidence/f-p1-001-fail-1.png"
              - "evidence/f-p1-001-fail-2.png"
            logs_hint: ["api-runner-profile", "profile-service"]
            note: "API 返回 200，但前端未更新"

        # 阻塞用例
        - case_id: "F-P2-003"
          status: blocked
          blocked_info:
            blocker_type: dependency
            blocker_id: "BUG-2026-0001"
            reason: "依赖的上游 Bug 未修复"

        # 跳过用例
        - case_id: "F-P3-010"
          status: skipped
          skipped_info:
            reason: feature_disabled
            note: "该功能在当前版本未启用"

      summary:
        total_cases: 4
        total_executed: 2
        passed: 1
        failed: 1
        blocked: 1
        skipped: 1
        pass_rate: 50

  - name: "人工执行结果示例"
    description: "测试人员手工执行后的结果文件"
    data:
      source: manual
      executor: "test-engineer-john"
      executed_at: "2026-02-05T14:00:00Z"
      environment:
        env_type: test
        target_version: "v1.0.0-rc1"

      results:
        - case_id: "F-BASE-002"
          status: pass
          evidence:
            note: "手工验证登录流程正常"

        - case_id: "F-P1-001"
          status: fail
          failure_info:
            error_message: "保存后数据显示异常"
            error_type: assertion_failed
          evidence:
            screenshots: ["manual/f-p1-001.jpg"]
            note: "手工验证发现数据不一致"

  - name: "Runner 执行结果示例（未来）"
    description: "自动化 Runner 执行后的结果文件"
    data:
      source: runner
      executor: "e2e-runner-agent"
      executed_at: "2026-02-05T16:00:00Z"
      execution_duration_seconds: 600
      environment:
        env_type: test
        target_version: "v1.0.0-rc1"
        browser: "chrome-120"

      results:
        - case_id: "F-BASE-002"
          status: pass
          duration_seconds: 3
          evidence:
            trace_id: "trace-auto-001"
            screenshots: ["runner/f-base-002.png"]

        - case_id: "F-P1-001"
          status: fail
          duration_seconds: 10
          failure_info:
            error_message: "AssertionError: Expected data to be updated"
            error_type: assertion_failed
            failed_step: 3
            stack_trace: "Error: Expected 'new-data' but got 'old-data'\n    at TestCase.verify (tests/e2e/p1.spec.ts:45:12)"
          evidence:
            trace_id: "trace-auto-002"
            screenshots: ["runner/f-p1-001-fail.png"]
            log_files: ["runner/logs/p1-001.log"]
