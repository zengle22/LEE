# Test Directory Structure Contract v1.0
# 定义标准的测试目录结构

kind: contract
version: "1.0"

# ============================================
# 基础标识
# ============================================
id: contract.test.directory_structure
name: Test Directory Structure Contract
description: |
  定义测试流程的标准目录结构。
  所有测试产物必须按此结构存放。
  与研发的 phase-directory-contract 配套使用。
owner: test-governance
tags: [contract, directory, testing, structure]

# ============================================
# 标准目录结构
# ============================================
structure:
  # 测试根目录 (相对于项目根目录)
  test_root: "testing/"

  # 与研发目录的关系
  relationship:
    upstream: "dev/"
    description: "testing/ 接收 dev/ 的提测产物"

  directories:
    # ========== 核心文件 ==========
    - path: "release-manifest.yaml"
      type: file
      required: true
      description: "提测包清单，由研发提交"
      source: development
      contract: "../release-manifest/v1/schema.json"

    - path: "workflow.yaml"
      type: file
      required: true
      description: "测试工作流实例"
      format: workflow-instance
      created_by: orchestrator

    # ========== Orchestrator 状态 (系统管理) ==========
    - path: ".workflow/"
      type: directory
      required: true
      managed_by: orchestrator
      description: "Orchestrator 运行状态，禁止手动编辑"
      contents:
        - "state.yaml"         # 运行状态
        - "events.jsonl"       # 事件日志
        - "approvals/"         # 审批记录
        - "manifests/"         # 产物清单

    # ========== 测试用例目录 ==========
    - path: "test-cases/"
      type: directory
      required: true
      description: "测试用例存放目录"

    - path: "test-cases/smoke/"
      type: directory
      required: true
      description: "冒烟测试用例 (10-30条)"
      file_pattern: "TC-SMOKE-*.yaml"

    - path: "test-cases/system/"
      type: directory
      required: true
      description: "系统测试用例"
      structure:
        - "{module}/"          # 按模块组织
        - "TC-{MODULE}-*.yaml" # 用例文件

    - path: "test-cases/regression/"
      type: directory
      required: true
      description: "回归测试用例"
      file_pattern: "REG-*.yaml"

    # ========== 缺陷管理 ==========
    - path: "bugs/"
      type: directory
      required: true
      description: "Bug 契约文件目录"
      file_pattern: "BUG-YYYY-NNNN.yaml"
      contract: "../bug-contract/v1/schema.json"

    - path: "evidence/"
      type: directory
      required: true
      description: "Bug 证据目录"
      structure:
        - "BUG-YYYY-NNNN/"
        - "BUG-YYYY-NNNN/screenshots/"
        - "BUG-YYYY-NNNN/logs/"
        - "BUG-YYYY-NNNN/videos/"

    # ========== 输出目录 ==========
    - path: "output/"
      type: directory
      required: true
      description: "测试产出物目录"

    - path: "output/submission-review.yaml"
      type: file
      workflow_step: t1_1_manifest_review
      description: "提测包审核结果"

    - path: "output/env-status.yaml"
      type: file
      workflow_step: t2_1_env_setup
      description: "测试环境状态"

    - path: "output/smoke-test-result.yaml"
      type: file
      workflow_step: t3_1_smoke_execution
      contract: "../smoke-test-result/v1/schema.json"
      description: "冒烟测试结果"

    - path: "output/system-test-result.yaml"
      type: file
      workflow_step: t4_1_system_execution
      contract: "../system-test-result/v1/schema.json"
      description: "系统测试结果"

    - path: "output/regression-result.yaml"
      type: file
      workflow_step: t5_3_regression_test
      contract: "../regression-result/v1/schema.json"
      description: "回归测试结果"

    - path: "output/test-report.yaml"
      type: file
      workflow_step: t6_1_generate_report
      contract: "../test-report/v1/schema.json"
      description: "最终测试报告"

    - path: "output/exit-gate-result.yaml"
      type: file
      workflow_step: t6_2_exit_gate
      description: "出测门禁结果"

    - path: "output/release-frozen/{version}/"
      type: directory
      workflow_step: t7_1_archive
      freeze: true
      description: "归档的测试产物"

    # ========== 门禁报告 ==========
    - path: "gate-reports/"
      type: directory
      required: false
      description: "门禁检查报告"
      contents:
        - "submission-gate-{id}.json"
        - "smoke-gate-{id}.json"
        - "exit-gate-{id}.json"

# ============================================
# 目录与工作流步骤映射
# ============================================
step_mapping:
  t1_1_manifest_review: "output/submission-review.yaml"
  t2_1_env_setup: "output/env-status.yaml"
  t3_1_smoke_execution: "output/smoke-test-result.yaml"
  t4_1_system_execution: "output/system-test-result.yaml"
  t4_2_bug_triage: "bugs/"
  t5_3_regression_test: "output/regression-result.yaml"
  t6_1_generate_report: "output/test-report.yaml"
  t6_2_exit_gate: "output/exit-gate-result.yaml"
  t7_1_archive: "output/release-frozen/{version}/"

# ============================================
# 项目配置建议 (project.yaml)
# ============================================
project_yaml_template: |
  # 在项目的 project.yaml 中添加以下配置

  path_aliases:
    # 研发目录
    "@dev": "./dev"

    # 测试目录
    "@test": "./testing"
    "@test-cases": "./testing/test-cases"
    "@bugs": "./testing/bugs"
    "@test-output": "./testing/output"

# ============================================
# 验证规则
# ============================================
validation:
  on_init:
    - check: required_directories_exist
      directories: [".workflow", "test-cases", "bugs", "evidence", "output"]

  on_submission:
    - check: release_manifest_exists
      file: "release-manifest.yaml"
    - check: smoke_cases_exist
      directory: "test-cases/smoke/"
      min_count: 10

  on_complete:
    - check: test_report_exists
      file: "output/test-report.yaml"
    - check: exit_gate_result_exists
      file: "output/exit-gate-result.yaml"
    - check: all_bugs_resolved_or_documented
      directory: "bugs/"
