# DevOps 配置模板 - 最小化版本
# 仅包含必需配置项，适合快速开始

version: "1.0"

# 项目信息
project:
  name: "项目名称"
  version: "v1.0.0"
  environment: "test"

# Git 仓库
git:
  backend:
    url: "git@github.com:org/repo.git"
    branch: "main"
    deploy_key: "~/.ssh/deploy_key"

# 服务器
server:
  primary:
    host: "192.168.1.100"
    port: 22
    user: "deploy"
    auth:
      method: "key"
      key_path: "~/.ssh/id_ed25519"
    work_dir: "/home/deploy/app"

# 数据库
database:
  primary:
    type: "postgres"
    host: "localhost"
    port: 5432
    name: "app_test"
    user: "app_user"
    password_ref: "env:DATABASE_PASSWORD"

# 环境变量
environment:
  base:
    NODE_ENV: "test"
    LOG_LEVEL: "debug"
  app:
    APP_PORT: "8080"
  auth:
    JWT_SECRET_REF: "env:JWT_SECRET"

# 部署
deploy:
  mode: "docker_compose"
  docker_compose:
    file: "docker-compose.test.yml"
    project_name: "app-test"

# 健康检查
health_check:
  services:
    - name: "backend"
      type: "http"
      url: "http://localhost:8080/health"
      expected_status: [200]
      critical: true
