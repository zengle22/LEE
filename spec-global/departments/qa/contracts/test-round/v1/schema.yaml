# Test Round Contract Schema v1.0
# 测试轮次记录契约标准

kind: contract_schema
version: 1.0

schema:
  type: object
  required:
    - round_id
    - round_number
    - target_version
    - start_time
    - status
    - suites_executed
    - summary

  properties:
    # ========== 基础标识 ==========
    round_id:
      type: string
      pattern: "^TSTR-[0-9]{4}$"
      description: "轮次唯一标识"
      example: "TSTR-0003"

    round_number:
      type: integer
      minimum: 1
      description: "轮次序号（从 1 开始）"

    target_version:
      type: string
      description: "测试目标版本"
      example: "v0.8.3-rc1"

    start_time:
      type: string
      format: date-time
      description: "轮次开始时间"

    end_time:
      type: string
      format: date-time
      description: "轮次结束时间"

    duration_hours:
      type: number
      description: "轮次耗时（小时）"

    status:
      type: string
      enum:
        - in_progress
        - completed
        - blocked
        - aborted
      description: "轮次状态"

    # ========== 环境信息 ==========
    environment:
      type: object
      required: [env_type, deployed_version]
      properties:
        env_type:
          type: string
          enum: [dev, test, staging, prod]
          description: "环境类型"

        deployed_version:
          type: string
          description: "实际部署的版本号"

        deployment_time:
          type: string
          format: date-time
          description: "部署时间"

        health_check_result:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: "健康检查结果"

        endpoints:
          type: object
          description: "环境端点"
          properties:
            frontend_url: string
            backend_url: string
            api_base: string

    # ========== 测试套件执行 ==========
    suites_executed:
      type: array
      items:
        type: object
        required: [suite_name, status, pass_rate]
        properties:
          suite_name:
            type: string
            enum: [smoke, api, e2e_chrome, e2e_wechat, performance, security, regression]
            description: "测试套件名称"

          status:
            type: string
            enum: [passed, failed, skipped, blocked]
            description: "套件执行状态"

          total_cases:
            type: integer
            description: "总用例数"

          passed:
            type: integer
            description: "通过数"

          failed:
            type: integer
            description: "失败数"

          skipped:
            type: integer
            description: "跳过数"

          pass_rate:
            type: number
            minimum: 0
            maximum: 100
            description: "通过率（%）"

          duration_seconds:
            type: number
            description: "执行耗时（秒）"

          report_path:
            type: string
            description: "测试报告路径"

          evidence_path:
            type: string
            description: "测试证据路径"

    # ========== Bug 汇总 ==========
    summary:
      type: object
      required: [new_bugs, total_open_bugs, bug_breakdown]
      properties:
        new_bugs:
          type: integer
          description: "本轮新发现的 Bug 数量"

        total_open_bugs:
          type: integer
          description: "本轮结束时未关闭的 Bug 总数"

        bugs_fixed_this_round:
          type: integer
          description: "本轮修复的 Bug 数量"

        bugs_verified_this_round:
          type: integer
          description: "本轮验证的 Bug 数量"

        bugs_closed_this_round:
          type: integer
          description: "本轮关闭的 Bug 数量"

        bug_breakdown:
          type: object
          description: "Bug 按严重程度分类统计"
          properties:
            p0_open: integer
            p0_new: integer
            p1_open: integer
            p1_new: integer
            p2_open: integer
            p2_new: integer
            p3_open: integer
            p3_new: integer

        bug_ids:
          type: array
          items:
            type: string
          description: "本轮相关的 Bug ID 列表"

    # ========== 轮次目标 ==========
    round_goal:
      type: object
      description: "本轮测试目标"
      properties:
        objective:
          type: string
          description: "本轮目标描述"
          examples:
            - "首次完整功能验证"
            - "修复上轮 P0/P1 Bug 验证"
            - "出测前最后一轮全量回归"

        target_pass_rate:
          type: number
          description: "目标通过率（%）"

        target_bug_reduction:
          type: object
          description: "目标 Bug 减少数"
          properties:
            p0_target: integer
            p1_target: integer

        achieved:
          type: boolean
          description: "目标是否达成"

    # ========== 回归策略 ==========
    regression_strategy:
      type: object
      description: "本轮回归测试策略"
      properties:
        scope:
          type: string
          enum: [smoke_only, risk_based, full_regression]
          description: "回归范围"

        changed_areas:
          type: array
          items:
            type: string
          description: "变更区域列表"

        bug_related_cases:
          type: integer
          description: "Bug 相关回归用例数"

        historical_hotspot_coverage:
          type: number
          description: "历史热点覆盖率（%）"

    # ========== 轮次结论 ==========
    conclusion:
      type: object
      required: [decision, rationale]
      properties:
        decision:
          type: string
          enum: [next_round, release_candidate, blocked, aborted]
          description: "轮次结论"

        rationale:
          type: string
          description: "决策理由"

        exit_criteria_met:
          type: boolean
          description: "是否满足出测标准"

        exit_criteria_evaluation:
          type: object
          description: "出测标准评估详情"
          properties:
            mandatory_criteria_met: boolean
            threshold_criteria_met: boolean
            risk_acceptance_signed: boolean
            details: string

        blockers:
          type: array
          items:
            type: object
            properties:
              blocker_id: string
              description: string
              bug_id: string
          description: "阻塞项列表"

        next_round_focus:
          type: string
          description: "下一轮关注重点"

    # ========== 人类审批 ==========
    approvals:
      type: array
      items:
        type: object
        required: [approver_role, approved, approved_at]
        properties:
          approver_role:
            type: string
            enum: [qa_lead, pm, tech_lead, product_owner]
            description: "审批人角色"

          approver_name:
            type: string
            description: "审批人姓名"

          approved:
            type: boolean
            description: "是否批准"

          approved_at:
            type: string
            format: date-time
            description: "审批时间"

          comment:
            type: string
            description: "审批意见"

    # ========== 产物清单 ==========
    artifacts:
      type: object
      description: "本轮产出的测试产物"
      properties:
        reports:
          type: array
          items:
            type: string
          description: "测试报告文件列表"

        evidence:
          type: array
          items:
            type: string
          description: "测试证据文件列表"

        bugs:
          type: array
          items:
            type: string
          description: "Bug 契约文件列表"

        frozen:
          type: boolean
          description: "产物是否已冻结"

    # ========== 性能指标 ==========
    metrics:
      type: object
      description: "本轮性能指标"
      properties:
        total_test_time_seconds:
          type: number
          description: "总测试时间（秒）"

        average_case_execution_time:
          type: number
          description: "平均用例执行时间（秒）"

        bug_detection_rate:
          type: number
          description: "Bug 检出率（bugs/100 cases）"

        fix_verification_time_hours:
          type: number
          description: "修复验证平均时长（小时）"

    # ========== 元数据 ==========
    created_by:
      type: string
      description: "创建者（Agent ID）"

    coordinator_agent:
      type: string
      description: "协调 Agent ID"

    notes:
      type: string
      description: "备注信息"

# ========== 验证规则 ==========
validation_rules:
  - rule: "end_time_after_start_time"
    check: "end_time > start_time"
    error_message: "结束时间必须晚于开始时间"

  - rule: "pass_rate_calculation"
    check: "FOR EACH suite: suite.pass_rate == (suite.passed / suite.total_cases * 100)"
    error_message: "通过率计算错误"

  - rule: "status_completed_requires_conclusion"
    check: "IF status == completed THEN conclusion IS NOT NULL"
    error_message: "完成状态必须有结论"

  - rule: "release_candidate_requires_approvals"
    check: "IF conclusion.decision == release_candidate THEN approvals.length >= 3"
    error_message: "出测候选必须有至少 3 个审批"

# ========== 示例 ==========
examples:
  - name: "第三轮测试 - 部分 Bug 修复验证"
    data:
      round_id: "TSTR-0003"
      round_number: 3
      target_version: "v0.8.3-rc1"
      start_time: "2026-01-15T08:00:00Z"
      end_time: "2026-01-15T20:00:00Z"
      duration_hours: 12
      status: completed
      environment:
        env_type: test
        deployed_version: "v0.8.3-rc1"
        health_check_result: healthy
      suites_executed:
        - suite_name: smoke
          status: passed
          total_cases: 30
          passed: 30
          failed: 0
          pass_rate: 100
          duration_seconds: 180
        - suite_name: e2e_chrome
          status: failed
          total_cases: 50
          passed: 45
          failed: 5
          pass_rate: 90
          duration_seconds: 3600
      summary:
        new_bugs: 5
        total_open_bugs: 12
        bugs_fixed_this_round: 8
        bugs_verified_this_round: 7
        bugs_closed_this_round: 6
        bug_breakdown:
          p0_open: 0
          p0_new: 0
          p1_open: 3
          p1_new: 1
          p2_open: 9
          p2_new: 4
      conclusion:
        decision: next_round
        rationale: "仍有 3 个 P1 Bug 未修复，需要继续下一轮"
        exit_criteria_met: false
        blockers:
          - blocker_id: "BLK-001"
            description: "P1 Bug 影响支付流程"
            bug_id: "BUG-2026-0031"
