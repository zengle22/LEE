# QA Regression Gate v1.0
# 回归测试审批门禁

kind: gate
version: 1.0

id: gate.qa.regression_gate
name: QA Regression Gate
description: >
  QA 负责人确认回归测试结果与 Bug 草稿列表。
owner: qa-governance
tags: [gate, qa, regression]

input_contract:
  ref: ../../contracts/test-result/v1/schema.json
  description: "测试结果报告"

rules:
  - id: test_report_present
    name: 测试报告存在
    description: 必须提供测试报告
    condition: "summary != null"
    severity: blocker
    on_fail:
      verdict: FAIL
      message: "缺少测试报告"
      action: reject

verdicts:
  PASS:
    conditions:
      - "test_report_present"
    actions:
      - continue_to_next_stage
    message: "测试报告齐备，允许提交 Bug 列表"
  FAIL:
    conditions:
      - "!test_report_present"
    actions:
      - request_changes
    message: "测试报告缺失，需补充"
