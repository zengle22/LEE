# Exit Gate Specification v1.0
# 出测门禁规范

kind: gate
version: 1.0

# ============================================
# 基础标识
# ============================================
id: gate.test.exit_gate
name: Exit Gate
description: >
  出测门禁，验证测试结果是否满足出测标准。
  这是测试流程的最终门禁，决定版本是否可以交付。
  只有满足所有出测标准的版本才能通过此门禁。
owner: test-governance
tags: [gate, testing, exit, release, quality]

# ============================================
# 触发条件
# ============================================
trigger:
  when:
    - exit_gate_requested
    - test_report_final_ready
  context:
    requires:
      - test_report: "output/test-report-{manifest_id}.yaml"
      - bug_directory: "bugs/"
      - smoke_result: "output/smoke-test-result.yaml"
      - system_result: "output/system-test-result.yaml"
      - regression_result: "output/regression-result.yaml"

# ============================================
# 检查规则
# ============================================
checks:
  # ========== BLOCKER 级检查 (不可协商) ==========

  # ---------- P0 缺陷检查 ----------
  - id: p0_zero
    name: P0 缺陷为零
    description: 不允许存在任何未关闭的 P0 缺陷
    severity: blocker
    rule: |
      count(bugs where severity == "P0" and status not in ["closed", "rejected"]) == 0
    message: "存在未关闭的 P0 缺陷"
    fix: "修复所有 P0 缺陷后重新申请出测"
    non_negotiable: true

  # ---------- 冒烟测试检查 ----------
  - id: smoke_100
    name: 冒烟测试 100% 通过
    description: 冒烟测试必须全部通过
    severity: blocker
    rule: |
      smoke_result.summary.pass_rate == 100
    message: "冒烟测试未 100% 通过"
    fix: "修复冒烟失败用例"
    non_negotiable: true

  # ---------- 核心链路检查 ----------
  - id: core_path_100
    name: 核心链路 100% 通过
    description: 核心链路测试必须全部通过
    severity: blocker
    rule: |
      system_result.modules
        .filter(m => m.is_core_path == true)
        .every(m => m.pass_rate == 100)
    message: "核心链路测试未 100% 通过"
    fix: "修复核心链路失败用例"
    non_negotiable: true

  # ========== MAJOR 级检查 (可条件通过) ==========

  # ---------- P1 缺陷检查 ----------
  - id: p1_max_3
    name: P1 缺陷 ≤ 3
    description: P1 缺陷数量不超过 3 个
    severity: major
    rule: |
      count(bugs where severity == "P1" and status not in ["closed", "rejected"]) <= 3
    message: "P1 缺陷数量超过 3 个"
    fix: "修复 P1 缺陷或提供规避方案"
    conditional_pass:
      conditions:
        - "所有 P1 缺陷都有已确认的规避方案"
        - "风险已由 PM 书面确认接受"
      requires:
        - field: "open_bugs[].workaround"
          not_empty: true
        - field: "risks[].accepted_by"
          not_empty: true

  # ---------- 回归通过率检查 ----------
  - id: regression_95
    name: 回归通过率 ≥ 95%
    description: 回归测试通过率必须达到 95%
    severity: major
    rule: |
      regression_result.summary.pass_rate >= 95
    message: "回归测试通过率低于 95%"
    fix: "修复回归失败用例或分析回归原因"
    conditional_pass:
      conditions:
        - "失败用例均为已知问题且有规避方案"
        - "回归失败不影响核心功能"
      requires:
        - field: "regression_result.regressions[].acknowledged"
          all_true: true

  # ========== MINOR 级检查 (仅警告) ==========

  # ---------- P2/P3 缺陷检查 ----------
  - id: p2_documented
    name: P2 缺陷已记录
    description: P2 缺陷应当记录并有处理计划
    severity: minor
    rule: |
      bugs.filter(b => b.severity == "P2" && b.status not in ["closed", "rejected"])
        .every(b => b.decision.resolution != null || b.eta_fix != null)
    message: "存在未规划的 P2 缺陷"
    fix: "为 P2 缺陷制定处理计划"

  # ---------- 风险记录检查 ----------
  - id: risks_documented
    name: 风险已文档化
    description: 所有已知风险应当记录缓解措施
    severity: minor
    rule: |
      test_report.risks.every(r => r.mitigation != null)
    message: "存在未记录缓解措施的风险"
    fix: "为所有风险记录缓解措施"

  # ---------- Bug 回归用例检查 ----------
  - id: p0_p1_regression_cases
    name: P0/P1 Bug 已补回归用例
    description: 所有已修复的 P0/P1 缺陷应有回归用例
    severity: minor
    rule: |
      bugs.filter(b =>
        b.severity in ["P0", "P1"] &&
        b.status == "closed" &&
        b.decision.resolution == "fixed"
      ).every(b => b.regression.regression_case_id != null)
    message: "存在未补回归用例的 P0/P1 修复"
    fix: "为已修复的 P0/P1 缺陷补充回归用例"

# ============================================
# 通过条件
# ============================================
pass_criteria:
  blocker: 0        # blocker 必须为 0
  major: 0          # major 为 0 时 PASS
                    # major 存在但满足条件时 CONDITIONAL_PASS
  minor: null       # minor 仅警告，不影响放行

# ============================================
# 判定逻辑
# ============================================
verdict_logic: |
  def determine_verdict(checks_result):
      blockers = checks_result.filter(c => c.severity == "blocker" && c.result == "fail")
      majors = checks_result.filter(c => c.severity == "major" && c.result == "fail")

      # Any blocker fails -> FAIL
      if blockers.length > 0:
          return {
              "verdict": "FAIL",
              "reason": "Blocker criteria not met",
              "blockers": blockers
          }

      # No majors fail -> PASS
      if majors.length == 0:
          return {
              "verdict": "PASS",
              "reason": "All criteria met"
          }

      # Majors fail but all have conditional pass met -> CONDITIONAL_PASS
      if majors.every(m => m.conditional_pass_met == true):
          return {
              "verdict": "CONDITIONAL_PASS",
              "reason": "Major issues with accepted risk",
              "conditions": majors.map(m => m.conditional_details)
          }

      # Majors fail without conditions met -> FAIL
      return {
          "verdict": "FAIL",
          "reason": "Major criteria not met",
          "blockers": majors
      }

# ============================================
# 人工确认项
# ============================================
manual_checklist:
  - id: qa_lead_signoff
    name: QA Lead 签字确认
    description: QA 负责人确认测试完成且质量达标
    required: true
    assignee: qa-lead

  - id: pm_signoff
    name: PM 签字确认
    description: 产品经理确认功能符合需求
    required: true
    assignee: product-manager

  - id: tech_lead_signoff
    name: Tech Lead 签字确认
    description: 技术负责人确认技术质量达标
    required: true
    assignee: tech-lead

  - id: risk_acceptance
    name: 风险接受确认
    description: 如有条件通过，需确认风险接受
    required: conditional  # 仅当 CONDITIONAL_PASS 时需要
    assignee: product-owner

# ============================================
# 输出产物
# ============================================
outputs:
  - type: report
    format: json
    path: "output/gate-reports/exit-gate-{manifest_id}.json"
  - type: summary
    format: markdown
    path: "output/gate-reports/exit-gate-{manifest_id}.md"
  - type: release_notes
    format: markdown
    path: "output/releases/{version}/RELEASE_NOTES.md"
    condition: "verdict in [PASS, CONDITIONAL_PASS]"

# ============================================
# 后续动作
# ============================================
actions:
  on_pass:
    - log: "Exit Gate 通过 (PASS)，版本可交付"
    - generate:
        template: release_notes
        output: "output/releases/{version}/RELEASE_NOTES.md"
    - notify:
        channel: release
        message: "版本 {version} 通过出测门禁，可以进入发布流程"
    - trigger:
        workflow: release_pipeline
        with:
          version: $version
          manifest_id: $manifest_id

  on_conditional_pass:
    - log: "Exit Gate 条件通过 (CONDITIONAL_PASS)，需确认风险"
    - generate:
        template: conditional_release_notes
        output: "output/releases/{version}/RELEASE_NOTES.md"
    - require:
        manual_check: risk_acceptance
    - notify:
        channel: release
        message: "版本 {version} 条件通过出测，需风险确认: {conditions_summary}"

  on_fail:
    - log: "Exit Gate 未通过 (FAIL)，不允许发布"
    - notify:
        channel: testing
        message: "版本 {version} 出测门禁未通过: {failed_checks_summary}"
    - notify:
        channel: development
        message: "版本 {version} 需要修复以下问题后重新申请出测: {action_items}"
    - block:
        action: prevent_release
        reason: "Exit Gate FAIL"
