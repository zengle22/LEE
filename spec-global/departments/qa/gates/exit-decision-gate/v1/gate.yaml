# Exit Decision Gate v1.0
# 出测决策门禁 - 人类最终决策

kind: gate_rules
version: 1.0

gate_id: gate.qa.exit_decision_gate
name: Exit Decision Gate
description: >
  L2 Phase 7 出测评估后的人类最终决策门禁。
  决定本次测试是否通过、有条件通过或不通过。

owner: qa-governance
tags: [gate, qa, exit-decision, l2]

# ============================================
# 出测标准
# ============================================
exit_criteria:
  pass:
    - criterion_id: EX_P001
      name: "P0/P1 用例全部通过"
      description: "所有 P0 和 P1 优先级用例必须通过"
      check: "p0_pass_rate == 100 AND p1_pass_rate >= 95"
      severity: blocker

    - criterion_id: EX_P002
      name: "无 P0/P1 Bug"
      description: "不能有 P0 或 P1 级别的 Bug"
      check: "NO bugs WHERE priority IN [P0, P1]"
      severity: blocker

    - criterion_id: EX_P003
      name: "核心功能覆盖完整"
      description: "所有核心功能必须有测试覆盖"
      check: "core_feature_coverage == 100"
      severity: blocker

    - criterion_id: EX_P004
      name: "整体通过率达标"
      description: "整体用例通过率 >= 90%"
      check: "overall_pass_rate >= 90"
      severity: major

  conditional_pass:
    - criterion_id: EX_C001
      name: "非阻塞 Bug"
      description: "所有 Bug 均为非阻塞级别（P2/P3）"
      check: "ALL bugs WHERE priority NOT IN [P0, P1]"
      severity: major

    - criterion_id: EX_C002
      name: "核心功能通过"
      description: "核心功能相关用例全部通过"
      check: "core_feature_pass_rate == 100"
      severity: major

    - criterion_id: EX_C003
      name: "整体通过率可接受"
      description: "整体用例通过率 >= 85%"
      check: "overall_pass_rate >= 85"
      severity: major

  fail:
    - criterion_id: EX_F001
      name: "存在 P0 Bug"
      description: "存在 P0 级别 Bug"
      check: "EXISTS bugs WHERE priority == P0"
      severity: blocker

    - criterion_id: EX_F002
      name: "核心功能失败"
      description: "核心功能相关用例存在失败"
      check: "core_feature_pass_rate < 100"
      severity: blocker

    - criterion_id: EX_F003
      name: "整体通过率过低"
      description: "整体用例通过率 < 80%"
      check: "overall_pass_rate < 80"
      severity: major

# ============================================
# 决策选项
# ============================================
decision_options:
  - option: pass
    label: "通过"
    description: "满足出测条件，可以发布"
    trigger: exit_pass
    conditions:
      - "ALL(exit_criteria.pass) == MET"
      - "blocking_bugs == 0"
    action:
      - mark_test_run_passed
      - generate_release_report
      - notify_stakeholders

  - option: conditional_pass
    label: "有条件通过"
    description: "基本满足条件，但有少量非阻塞问题"
    trigger: exit_conditional_pass
    conditions:
      - "ALL(exit_criteria.pass.blocker) == MET"
      - "blocking_bugs == 0"
      - "SOME minor_issues EXISTS"
    action:
      - mark_test_run_conditional_passed
      - generate_conditions_list
      - require_signoff: [qa_lead, pm]
      - notify_stakeholders

  - option: fail
    label: "不通过"
    description: "不满足出测条件，需要下一轮测试"
    trigger: exit_fail
    conditions:
      - "ANY(exit_criteria.fail.blocker) == MET"
      - "OR blocking_bugs > 0"
    action:
      - mark_test_run_failed
      - generate_blocking_report
      - schedule_next_round
      - notify_stakeholders

# ============================================
# 有条件通过的附加条件
# ============================================
conditional_pass_requirements:
  documentation:
    - "已知问题列表（Known Issues）"
    - "风险缓解计划"
    - "后续修复计划"

  signoff:
    required_roles:
      - role: qa_lead
        responsibility: "质量风险确认"
      - role: pm
        responsibility: "发布决策确认"

  conditions_template:
    - condition_id: CP001
      description: "修复已知 Bug 后回归测试"
      due_date: "+7 days"
      assignee: dev_team

    - condition_id: CP002
      description: "补充测试用例覆盖薄弱环节"
      due_date: "+14 days"
      assignee: qa_team

    - condition_id: CP003
      description: "监控生产环境指标"
      due_date: "ongoing"
      assignee: ops_team

# ============================================
# 审核交付物
# ============================================
required_artifacts:
  - artifact: test-report.yaml
    description: 测试报告
    schema: ../../contracts/test-report/v1/schema.yaml

  - artifact: test-report.md
    description: 测试报告 Markdown（人类可读）

  - artifact: exit-evaluation.yaml
    description: 出测评估
    content:
      - decision: pass/conditional_pass/fail
      - summary: 决策摘要
      - pass_rate: 通过率
      - blocking_bugs: 阻塞 Bug 列表
      - conditions: 附加条件（如有）

# ============================================
# 签字要求
# ============================================
signoff_requirements:
  pass:
    required_approvers:
      - role: qa_lead
        responsibility: "质量确认"

  conditional_pass:
    required_approvers:
      - role: qa_lead
        responsibility: "质量风险确认"
      - role: pm
        responsibility: "发布决策确认"

  fail:
    required_approvers:
      - role: qa_lead
        responsibility: "确认不通过原因"
      - role: tech_lead
        responsibility: "确认修复计划"

# ============================================
# 通知配置
# ============================================
notifications:
  pass:
    channels:
      - email: ["stakeholders"]
      - slack: "#releases"
    template: "测试通过，准备发布"

  conditional_pass:
    channels:
      - email: ["stakeholders"]
      - slack: "#releases"
    template: "有条件通过，注意已知问题"

  fail:
    channels:
      - email: ["stakeholders"]
      - slack: "#releases"
      - jira: "BUG_PROJECT"
    template: "测试未通过，安排下一轮"

# ============================================
# 门禁判定逻辑
# ============================================
gate_verdict:
  PASS:
    condition: >
      ALL(exit_criteria.pass.blocker) == MET
      AND blocking_bugs == 0
      AND reviewer_decision == pass
    action: approve_exit
    next_state: EXIT_APPROVED

  CONDITIONAL_PASS:
    condition: >
      ALL(exit_criteria.pass.blocker) == MET
      AND blocking_bugs == 0
      AND reviewer_decision == conditional_pass
      AND signoff_complete == true
    action: conditional_approve_exit
    next_state: EXIT_CONDITIONAL

  FAIL:
    condition: >
      ANY(exit_criteria.fail.blocker) == MET
      OR blocking_bugs > 0
      OR reviewer_decision == fail
    action: reject_exit
    next_state: EXIT_REJECTED
