# Design Input Gate Rules v1.0
# 设计输入门禁规则 - 测试用例设计前的质量标准

kind: gate_rules
version: 1.0

# ============================================
# 基础信息
# ============================================
gate_id: gate.qa.design_input_gate
name: Design Input Gate
description: >
  验证测试用例设计输入是否满足最低标准，确保：
  - 需求文档已冻结且完整
  - 技术架构已确定
  - UI 原型已定稿
  - 功能点具备可测性

owner: test-governance
tags: [gate, design-input, quality-bar, pre-test]

# ============================================
# 强制标准（0 容忍，不可豁免）
# ============================================
mandatory_criteria:
  - criterion_id: C001
    name: "PRD 已冻结"
    description: "产品需求文档必须已冻结"
    rule: "prd.is_frozen == true"
    severity: blocker
    exemption: false
    rationale: "未冻结的需求会导致测试设计反复修改"
    error_message: "PRD 未冻结，请完成需求评审和冻结流程后重新提交"

  - criterion_id: C002
    name: "技术架构已冻结"
    description: "技术架构设计必须已冻结"
    rule: "tech_arch.is_frozen == true"
    severity: blocker
    exemption: false
    rationale: "未冻结的架构会影响测试环境搭建和接口设计"
    error_message: "技术架构未冻结，请完成架构评审和冻结流程后重新提交"

  - criterion_id: C003
    name: "UI 原型已冻结"
    description: "UI 原型设计必须已冻结"
    rule: "ui_prototype.is_frozen == true"
    severity: blocker
    exemption: false
    rationale: "未冻结的 UI 会导致测试用例和测试数据失效"
    error_message: "UI 原型未冻结，请完成设计评审和冻结流程后重新提交"

  - criterion_id: C004
    name: "PRD 包含至少 1 个功能点"
    description: "PRD 必须包含至少 1 个明确的功能点"
    rule: "COUNT(prd.features) >= 1"
    severity: blocker
    exemption: false
    rationale: "没有功能点无法进行测试设计"
    error_message: "PRD 功能点数量为 0，无法设计测试用例"

  - criterion_id: C005
    name: "每个功能点都有验收标准"
    description: "PRD 中的每个功能点必须有明确的验收标准"
    rule: "ALL(prd.features) HAVE acceptance_criteria"
    severity: blocker
    exemption: false
    rationale: "没有验收标准无法验证测试通过条件"
    error_message: "存在缺少验收标准的功能点，请补充验收标准"
    validation:
      required_fields: [given, when, then]
      min_criteria_per_feature: 1

# ============================================
# 阈值标准（数据驱动，可警告但允许继续）
# ============================================
threshold_criteria:
  - criterion_id: T001
    name: "PRD 功能点数量"
    description: "PRD 功能点数量应达到合理阈值"
    rule: "COUNT(prd.features) >= feature_threshold"
    default_threshold: 3
    severity: warning
    exemption_condition: "小型迭代或增量功能"
    failure_action: warn_but_continue
    rationale: "功能点过少可能意味着需求颗粒度过粗"

  - criterion_id: T002
    name: "架构组件数量"
    description: "技术架构应包含足够的组件细节"
    rule: "COUNT(tech_arch.components) >= component_threshold"
    default_threshold: 2
    severity: warning
    exemption_condition: "单体简单应用"
    failure_action: warn_but_continue
    rationale: "组件信息不足会影响集成测试设计"

  - criterion_id: T003
    name: "UI 核心路径数量"
    description: "UI 原型应定义核心用户路径"
    rule: "COUNT(ui_prototype.core_paths) >= path_threshold"
    default_threshold: 1
    severity: warning
    exemption_condition: "后台管理类系统"
    failure_action: warn_but_continue
    rationale: "缺少核心路径会影响场景测试设计"

# ============================================
# 质量增强标准（推荐但非强制）
# ============================================
quality_enhancement_criteria:
  - criterion_id: Q001
    name: "API 文档已提供"
    description: "API 接口文档应已提供"
    rule: "api_docs EXISTS AND api_docs.is_complete == true"
    severity: info
    value: "支持接口测试设计"

  - criterion_id: Q002
    name: "数据模型已定义"
    description: "数据模型应已明确定义"
    rule: "data_model EXISTS AND data_model.is_complete == true"
    severity: info
    value: "支持数据测试设计"

  - criterion_id: Q003
    name: "非功能性需求已定义"
    description: "性能、安全性等非功能性需求应已定义"
    rule: "non_functional_requirements EXISTS"
    severity: info
    value: "支持非功能性测试设计"

  - criterion_id: Q004
    name: "用户角色已定义"
    description: "系统用户角色和权限应已定义"
    rule: "user_roles EXISTS AND COUNT(user_roles) >= 1"
    severity: info
    value: "支持权限测试设计"

# ============================================
# 文档完整性验证
# ============================================
document_completeness_validation:
  - validation_id: D001
    name: "PRD 文档结构完整"
    description: "PRD 应包含必要的章节"
    required_sections:
      - "背景与目标"
      - "功能列表"
      - "验收标准"
      - "边界条件"
    severity: major

  - validation_id: D002
    name: "架构文档结构完整"
    description: "架构文档应包含必要的章节"
    required_sections:
      - "系统架构图"
      - "组件列表"
      - "技术栈"
      - "部署架构"
    severity: major

  - validation_id: D003
    name: "UI 原型结构完整"
    description: "UI 原型应包含必要的页面"
    required_sections:
      - "核心页面"
      - "交互流程"
      - "状态定义"
    severity: major

# ============================================
# 可测性验证
# ============================================
testability_validation:
  - validation_id: TE001
    name: "验收标准可量化"
    description: "验收标准应包含可量化的指标"
    rule: "ALL(prd.features[].acceptance_criteria) HAVE measurable_criteria"
    severity: major
    rationale: "不可量化的标准无法验证"

  - validation_id: TE002
    name: "功能点有前置条件"
    description: "功能点应明确前置条件"
    rule: "ALL(prd.features) HAVE preconditions"
    severity: info
    rationale: "前置条件有助于设计测试场景"

  - validation_id: TE003
    name: "功能点有后置条件"
    description: "功能点应明确后置条件"
    rule: "ALL(prd.features) HAVE postconditions"
    severity: info
    rationale: "后置条件有助于验证测试结果"

# ============================================
# 必需产物验证
# ============================================
required_artifacts:
  - artifact: "prd.yaml"
    description: "产品需求文档"
    validation:
      - schema_valid
      - is_frozen
      - has_min_features
      - all_features_have_acceptance_criteria
    source: "product-team"

  - artifact: "tech-arch.yaml"
    description: "技术架构文档"
    validation:
      - schema_valid
      - is_frozen
      - has_components
    source: "architecture-team"

  - artifact: "ui-prototype.yaml"
    description: "UI 原型文档"
    validation:
      - schema_valid
      - is_frozen
      - has_core_paths
    source: "design-team"

  optional_artifacts:
    - artifact: "api-docs.yaml"
      description: "API 接口文档"
      value: "接口测试设计"

    - artifact: "data-model.yaml"
      description: "数据模型文档"
      value: "数据测试设计"

    - artifact: "user-roles.yaml"
      description: "用户角色和权限文档"
      value: "权限测试设计"

# ============================================
# 门禁判定逻辑
# ============================================
gate_verdict:
  PASS:
    condition: >
      ALL(mandatory_criteria) == MET
      AND document_completeness_validation == VALID
      AND testability_validation.validations TE001 == VALID
    action: allow_test_design
    next_state: TEST_DESIGN
    message: "设计输入验证通过，可以开始测试用例设计"

  WARNING:
    condition: >
      ALL(mandatory_criteria) == MET
      AND ANY(threshold_criteria) == BELOW_THRESHOLD
    action: warn_but_proceed
    next_state: TEST_DESIGN
    required_acknowledgement: qa_lead
    message: "设计输入基本满足要求，但存在以下警告，请确认后继续"
    warnings: "COLLECT(threshold_criteria WHERE below_threshold)"

  FAIL:
    condition: >
      ANY(mandatory_criteria) == NOT_MET
      OR document_completeness_validation == INVALID
      OR testability_validation.TE001 == INVALID
    action: reject_and_return
    next_state: INPUT_PREPARATION
    message: "设计输入不满足要求，请完成以下整改后重新提交"
    blocking_issues: "COLLECT(mandatory_criteria WHERE not_met)"

  BLOCKED:
    condition: >
      prd.is_frozen == false
      OR tech_arch.is_frozen == false
      OR ui_prototype.is_frozen == false
    action: block_require_freeze
    next_state: REQUIREMENT_FREEZE
    message: "关键文档未冻结，请完成冻结流程后重新提交"
    required_actions:
      - "冻结 PRD (prd.yaml)"
      - "冻结技术架构 (tech-arch.yaml)"
      - "冻结 UI 原型 (ui-prototype.yaml)"

# ============================================
# 阈值配置（可根据项目定制）
# ============================================
thresholds:
  default:
    feature_threshold: 3
    component_threshold: 2
    path_threshold: 1

  small_iteration:
    feature_threshold: 1
    component_threshold: 1
    path_threshold: 0
    applies_when: "增量功能或小型修复"

  major_release:
    feature_threshold: 5
    component_threshold: 3
    path_threshold: 2
    applies_when: "主要版本发布"

# ============================================
# 失败处理策略
# ============================================
failure_handling:
  frozen_document_missing:
    action: reject
    severity: blocker
    message: "文档未冻结，无法进行测试设计"
    required_step: "完成文档冻结流程"
    escalation: "qa_lead -> pm -> tech_lead"

  insufficient_features:
    action: warn
    severity: warning
    message: "功能点数量可能不足"
    recommendation: "确认需求颗粒度是否合理"
    can_proceed: true

  insufficient_components:
    action: warn
    severity: warning
    message: "架构组件信息可能不足"
    recommendation: "补充架构细节或确认适用性"
    can_proceed: true

  missing_acceptance_criteria:
    action: reject
    severity: blocker
    message: "功能点缺少验收标准"
    required_step: "为所有功能点补充验收标准"
    escalation: "qa_lead -> product_owner"

# ============================================
# 豁免管理
# ============================================
exemption_policy:
  allowed_exemptions:
    - criterion: T001 (功能点阈值)
      max_exemptions: 1
      requires_approval: qa_lead
      requires_documentation: true
      condition: "小型迭代或增量功能"

    - criterion: T003 (UI 核心路径阈值)
      max_exemptions: 1
      requires_approval: qa_lead
      condition: "后台管理类系统"

  forbidden_exemptions:
    - criterion: C001 (PRD 冻结)
    - criterion: C002 (架构冻结)
    - criterion: C003 (UI 冻结)
    - criterion: C004 (功能点数量 >= 1)
    - criterion: C005 (验收标准)

# ============================================
# 签字要求
# ============================================
signoff_requirements:
  design_input_signoff:
    required_approvers:
      - role: product_owner
        responsibility: "需求冻结确认"
      - role: tech_lead
        responsibility: "架构冻结确认"
      - role: design_lead
        responsibility: "UI 冻结确认"

    optional_approvers:
      - role: qa_lead
        responsibility: "可测试性确认"

    approval_sla: 48h

    inputs_to_review:
      - "prd.yaml"
      - "tech-arch.yaml"
      - "ui-prototype.yaml"
      - "acceptance_criteria/"

    approval_criteria:
      - "所有文档已冻结"
      - "功能点具备可测性"
      - "验收标准明确可量化"

# ============================================
# 可观测性
# ============================================
metrics:
  - design_input_pass_rate
  - design_input_cycle_time
  - frozen_document_rate
  - acceptance_criteria_coverage
  - testability_score

dashboards:
  - design_input_quality_trend
  - gate_blocking_issues_distribution
  - testability_validation_results

# ============================================
# 工作流集成
# ============================================
workflow_integration:
  trigger_point: "测试用例设计开始前"
  auto_validate: true
  auto_notify:
    - qa_lead
    - product_owner
    - tech_lead
    - design_lead

  gate_artifacts:
    - "design-input-validation-report.yaml"
    - "design-input-checklist.md"

  next_steps_on_pass:
    - step: "创建测试套件结构"
      owner: "test-designer"
      template: "test-suite-template.yaml"
    - step: "设计测试用例"
      owner: "test-designer"
      tool: "test-case-designer"

  next_steps_on_fail:
    - step: "整改阻塞问题"
      owner: "responsible_team"
      timeline: "3-5 working days"
    - step: "重新提交验证"
      owner: "qa_lead"
      auto_trigger: true

# ============================================
# 元数据
# ============================================
metadata:
  version: 1.0
  created: "2026-02-04"
  author: "QA Governance Team"
  changelog:
    - version: "1.0"
      date: "2026-02-04"
      changes:
        - "初始版本：建立设计输入门禁规则"
        - "定义强制标准和阈值标准"
        - "建立文档完整性验证"
        - "建立可测性验证"
        - "定义失败处理策略"

  related_gates:
    - gate: "gate.test.smoke_gate"
      relationship: "后置门禁"
    - gate: "gate.test.exit_gate_v2"
      relationship: "下游门禁"

  references:
    - "测试设计方法论"
    - "需求管理规范"
    - "架构设计规范"
    - "UI/UX 设计规范"
