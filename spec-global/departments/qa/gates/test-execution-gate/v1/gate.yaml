  created: "2026-02-05"
  level: L3
  category: orchestration
  dependencies:
    - departments/qa/contracts/test-result/v1/schema.yaml
    - departments/qa/contracts/test-round/v1/schema.yaml

  changelog:
    - version: "1.0.0"
      date: "2026-02-05"
