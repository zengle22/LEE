# Workflow Integration: Testing ←→ Development Retest
# 工作流衔接配置：测试流程 ←→ 开发返修流程

integration_id: "workflow.integration.test_dev_retest"
version: "1.0"

# ============================================
# 衔接概述
# ============================================
description: |
  定义测试流程（Testing Pipeline）和开发返修流程（Dev Retest）之间的双向衔接规则。

  流程方向：
  Testing → Dev Retest: 测试失败，打回研发
  Dev Retest → Testing: 修复完成，再次提测

# ============================================
# 场景 1: 测试 → 开发返修（打回）
# ============================================
test_to_dev_retest:
  trigger_conditions:
    - event: "test.smoke_failed"
      source: "workflow.test.testing_pipeline"
      step: "t3_2_smoke_decision"

    - event: "test.gate_failed"
      source: "workflow.test.testing_pipeline"
      any_of: ["t3_2_smoke_decision", "t4_3_e2e_decision", "t5_2_system_decision"]

  data_handoff:
    from_testing:
      required:
        - file: "output/rejection-notice.yaml"
          target: "dev-retest/inputs/rejection-notice.yaml"

        - file: "bugs/*.contract.yaml"
          target: "dev-retest/inputs/bugs/"

        - file: "output/test-report.yaml"
          target: "dev-retest/inputs/test-report.yaml"

      optional:
        - file: "output/smoke-test-result.yaml"
          target: "dev-retest/inputs/smoke-test-result.yaml"

  notification:
    channels: ["slack", "email"]
    recipients: ["development-team", "tech-lead"]
    template: |
      🚫 测试拒绝 - 需要返修

      版本: {{ version }}
      轮次: {{ test_round }}
      失败原因: {{ rejection_reason }}
      Bug 数量: {{ bugs_count }}

      请启动开发返修流程：
      cd project/{{ project_name }}/dev-retest
      python -m orchestrator init . --workflow dev-retest/v1/workflow.yaml

      详细信息：
      - 拒绝通知: {{ rejection_notice_path }}
      - Bug 清单: {{ bugs_path }}

  orchestrator_action:
    # 测试流程状态更新
    update_test_workflow:
      status: "PAUSED"
      reason: "waiting_for_dev_fix"

    # 自动初始化开发返修流程（可选）
    auto_init_dev_retest:
      enabled: false  # 默认不自动初始化，等待人工确认
      workflow: "ai-spec/specs/org/development/workflows/dev-retest/v1/workflow.yaml"
      inputs:
        - rejection_notice: "$test.outputs.rejection_notice"
        - bugs: "$test.outputs.bugs"
        - test_report: "$test.outputs.test_report"

# ============================================
# 场景 2: 开发返修 → 测试（再提测）
# ============================================
dev_retest_to_test:
  trigger_conditions:
    - event: "dev.retest_ready"
      source: "workflow.dev.retest"
      step: "r5_3_handoff_to_testing"

  data_handoff:
    from_dev_retest:
      required:
        - file: "retest-release-manifest.yaml"
          target: "testing/release-manifest.yaml"
          validate_schema: true

        - file: "output/dev-selfcheck.yaml"
          target: "testing/inputs/dev-selfcheck.yaml"

        - files: "output/fix-commits.yaml"
          target: "testing/inputs/fix-commits.yaml"

      metadata:
        - field: "retest_round"
          increment: true

        - field: "previous_test_round_id"
          copy_from: "$test.run_id"

  validation:
    # 验证返修提测包
    validate_retest_manifest:
      checks:
        - rule: "manifest_type == 'retest'"
          error: "返修提测包类型必须为 retest"

        - rule: "retest_round <= 3"
          error: "超过最大返修次数（3次）"

        - rule: "all_p0_bugs_fixed"
          error: "所有 P0 Bug 必须修复"

        - rule: "selfcheck.overall_status == 'PASSED'"
          error: "开发自检必须通过"

        - rule: "scope_declaration.only_bug_fixes == true"
          error: "返修提测包只能包含 Bug 修复"

  notification:
    channels: ["slack", "email"]
    recipients: ["test-team", "qa-lead"]
    template: |
      ✅ 返修提测包已准备好

      版本: {{ version }}
      返修轮次: {{ retest_round }}
      修复 Bug: {{ bugs_fixed_count }}
      自检状态: {{ selfcheck_status }}

      建议测试策略：
      {{ test_strategy }}

      请接收并开始新的测试轮次：
      cd project/{{ project_name }}/testing
      python -m orchestrator status .

  orchestrator_action:
    # 更新开发返修流程状态
    update_dev_retest_workflow:
      status: "COMPLETED"
      handoff_confirmed: true

    # 自动触发新的测试轮次
    trigger_new_test_round:
      workflow: "ai-spec/specs/org/testing/workflows/testing-pipeline/v1/workflow.yaml"
      mode: "retest"

      inputs:
        - release_manifest: "$dev_retest.outputs.retest_manifest"
        - previous_round_id: "$test.run_id"
        - retest_round: "$dev_retest.retest_round"

      test_strategy:
        # 根据返修包建议选择测试范围
        follow_manifest_recommendation: true

        # 最小必须测试
        minimum_tests:
          - "smoke_test_full"
          - "regression_tests_for_fixed_bugs"

        # 可选测试（根据风险）
        optional_tests:
          - "affected_module_tests"
          - "integration_tests"

        # 条件测试
        conditional:
          - if: "retest_round == 1"
            then: ["smoke_test", "regression_test"]

          - if: "retest_round >= 2"
            then: ["smoke_test", "regression_test", "e2e_test"]

          - if: "high_risk_areas_present"
            then: ["full_system_test"]

# ============================================
# 状态同步
# ============================================
state_synchronization:
  # 测试流程追踪返修进度
  test_workflow_tracking:
    monitor:
      - workflow_id: "workflow.dev.retest"
        events: ["started", "failed", "completed"]

    on_dev_retest_started:
      update: "test.status = 'waiting_for_fix'"

    on_dev_retest_failed:
      action: "notify_test_team"
      message: "返修流程失败，可能需要调整测试策略"

    on_dev_retest_completed:
      action: "prepare_for_new_round"
      create: "new_test_round_record"

  # 返修流程追踪测试进度
  dev_retest_tracking:
    monitor:
      - workflow_id: "workflow.test.testing_pipeline"
        events: ["round_completed", "bugs_found"]

    on_test_round_completed:
      if: "test_passed"
      then:
        update: "dev_retest.status = 'success'"
        notify: "development_team"

    on_new_bugs_found:
      if: "retest_round < 3"
      then:
        action: "trigger_next_retest_iteration"
      else:
        action: "escalate_to_human"

# ============================================
# 循环控制（防止无限循环）
# ============================================
loop_prevention:
  max_test_dev_cycles: 3

  cycle_tracking:
    state_file: ".workflow/test-dev-cycles.yaml"
    fields:
      - current_cycle
      - total_bugs_fixed
      - total_bugs_found
      - cycle_history

  escalation_rules:
    - if: "cycle >= 3"
      then:
        action: "pause_and_escalate"
        notify: ["tech-lead", "product-manager", "qa-lead"]
        require: "human_review_and_approval"

    - if: "same_bugs_reappear"
      then:
        action: "immediate_escalation"
        reason: "质量问题严重，修复无效"

    - if: "new_bugs_count > fixed_bugs_count"
      then:
        action: "warning"
        message: "修复引入了更多问题，建议人工review"

# ============================================
# 数据契约
# ============================================
contracts:
  rejection_notice:
    schema: "testing/contracts/rejection-notice/v1/schema.yaml"
    required_for: "test_to_dev_retest"

  retest_manifest:
    schema: "development/contracts/retest-manifest/v1/schema.json"
    required_for: "dev_retest_to_test"

  bug_contract:
    schema: "testing/contracts/bug-contract/v1/schema.yaml"
    required_for: "both_directions"

# ============================================
# 元数据
# ============================================
metadata:
  created_by: "workflow-integration-architect"
  created_at: "2026-01-15"
  version: "1.0"

  related_workflows:
    - "workflow.test.testing_pipeline (v1.0)"
    - "workflow.dev.retest (v1.0)"
