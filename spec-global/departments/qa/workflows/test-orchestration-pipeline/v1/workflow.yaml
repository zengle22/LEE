# Test Orchestration Pipeline v1.0
# L3 - 测试执行编排与结果收敛工作流（无 Runner 版）

kind: workflow
version: 1.0

# ============================================
# 基础标识
# ============================================
id: workflow.test.orchestration_pipeline_v1
name: Test Orchestration Pipeline (Result Aggregation)
description: >
  L3 级别测试编排与结果收敛工作流，不依赖自动化测试执行器：
  - 消费测试用例清单（test-cases.yaml）
  - 接收测试执行结果（人工/Claude Code/未来 Runner）
  - 自动将失败用例转换为 Bug 契约
  - 生成结构化测试报告和轮次结论
  - 作为测试流程的"骨架"，为后续自动化预留接口

owner: test-governance
tags: [workflow, L3, orchestration, result-aggregation, bug-generation, gate-controlled]

# ============================================
# 核心概念
# ============================================
concepts:
  test_result_convergence:
    description: "测试结果收敛：将分散的执行结果汇总成统一结论"
    attributes:
      - result_source: "结果来源（manual/claude_code/runner）"
      - case_status: "用例状态（pass/fail/blocked）"
      - evidence_binding: "证据绑定（截图/日志/trace）"

  bug_auto_generation:
    description: "失败用例自动生成 Bug 契约"
    attributes:
      - bug_id: "自动生成的 Bug ID"
      - source_case: "关联的测试用例"
      - severity_mapping: "用例优先级到 Bug 严重程度的映射"
      - evidence_propagation: "证据从用例传递到 Bug"

  test_round_authority:
    description: "测试轮次权威状态，作为 Orchestrator/Gate 的唯一事实来源"
    attributes:
      - round_id: "轮次唯一标识"
      - conclusion: "轮次结论（pass/fail/conditional_pass）"
      - gate_verdict: "门禁判定结果"

# ============================================
# 契约定义
# ============================================
contracts:
  inputs:
    - test_execution_bundle:
        path: "test-execution-bundle.yaml"
        schema: ../../contracts/test-execution-bundle/v1/schema.yaml
        description: "测试执行输入包，包含用例清单和配置"

    - test_results:
        path: "test-results.yaml"
        schema: ../../contracts/test-result/v1/schema.yaml
        description: "测试执行结果，可由人工/Claude Code/Runner 填写"

  outputs:
    - test_round_record:
        path: "test-round.yaml"
        schema: ../../contracts/test-round/v1/schema.yaml
        description: "本轮测试权威状态文件"

    - bug_bundle:
        path: "bugs/"
        description: "Bug 契约文件目录"
        structure: |
          bugs/
          ├── BUG-2026-0001.contract.yaml
          ├── BUG-2026-0002.contract.yaml
          └── ...

    - test_report:
        path: "test-report.md"
        description: "人类可读测试报告（Markdown 格式）"

    - test_report_json:
        path: "test-report.json"
        description: "机器可读测试报告（JSON 格式）"

# ============================================
# 状态机定义
# ============================================
state_machine:
  states:
    - INIT: "初始化"
    - LOAD_CASES: "加载测试用例"
    - COLLECT_RESULTS: "收集执行结果"
    - VALIDATE_RESULTS: "验证结果完整性"
    - BUG_GENERATION: "生成 Bug 契约"
    - REPORT_GENERATION: "生成测试报告"
    - GATE_EVALUATION: "门禁判定"
    - COMPLETED: "完成"
    - FAILED: "失败"

  transitions:
    INIT:
      - to: LOAD_CASES
        trigger: "workflow_started"

    LOAD_CASES:
      - to: COLLECT_RESULTS
        trigger: "cases_loaded"
      - to: FAILED
        trigger: "cases_invalid"

    COLLECT_RESULTS:
      - to: VALIDATE_RESULTS
        trigger: "results_submitted"
      - to: FAILED
        trigger: "results_timeout"

    VALIDATE_RESULTS:
      - to: BUG_GENERATION
        trigger: "results_valid"
      - to: COLLECT_RESULTS
        trigger: "results_incomplete"
        note: "缺少部分用例结果，退回重新收集"

    BUG_GENERATION:
      - to: REPORT_GENERATION
        trigger: "bugs_created"
      - to: REPORT_GENERATION
        trigger: "no_failures"

    REPORT_GENERATION:
      - to: GATE_EVALUATION
        trigger: "report_generated"

    GATE_EVALUATION:
      - to: COMPLETED
        trigger: "gate_passed"
      - to: COMPLETED
        trigger: "gate_conditional_pass"
      - to: FAILED
        trigger: "gate_failed"

# ============================================
# 主流程步骤定义
# ============================================
stages:
  # ========== Stage 1: 加载测试用例 ==========
  - id: s1_load_cases
    name: "加载测试用例"
    description: "从 test-execution-bundle 加载测试用例清单"
    steps:
      - id: s1_1_load_bundle
        name: "加载执行包"
        run: agent.test.result_aggregator
        inputs:
          - bundle_path: "$inputs.test_execution_bundle"
        outputs:
          - path: "runtime/cases-loaded.yaml"
        gate:
          ref: gate.test.bundle_validation
          on_fail:
            action: fail_and_report

      - id: s1_2_case_inventory
        name: "用例清单盘点"
        run: agent.test.result_aggregator
        outputs:
          - path: "runtime/case-inventory.yaml"
          - summary:
              total_cases: "$CASES.count"
              by_suite: "$CASES.group_by(suite)"
              by_priority: "$CASES.group_by(priority)"

  # ========== Stage 2: 收集执行结果 ==========
  - id: s2_collect_results
    name: "收集执行结果"
    description: "接收并解析测试执行结果（支持多种来源）"
    steps:
      - id: s2_1_receive_results
        name: "接收执行结果"
        run: agent.test.result_aggregator
        inputs:
          - results_path: "$inputs.test_results"
        outputs:
          - path: "runtime/results-received.yaml"
        timeout: 72h
        note: "等待人工或自动化工具提交结果"

      - id: s2_2_parse_results
        name: "解析执行结果"
        run: agent.test.result_aggregator
        inputs:
          - raw_results: "$runtime/results-received.yaml"
          - case_inventory: "$runtime/case-inventory.yaml"
        outputs:
          - path: "runtime/results-parsed.yaml"
          - summary:
              total_executed: "$RESULTS.count"
              passed: "$RESULTS.where(status=pass).count"
              failed: "$RESULTS.where(status=fail).count"
              blocked: "$RESULTS.where(status=blocked).count"

      - id: s2_3_bind_evidence
        name: "绑定测试证据"
        run: agent.test.result_aggregator
        inputs:
          - results: "$runtime/results-parsed.yaml"
        outputs:
          - path: "runtime/results-with-evidence.yaml"
        note: "关联截图、日志、trace_id 等证据"

  # ========== Stage 3: 验证结果完整性 ==========
  - id: s3_validate_results
    name: "验证结果完整性"
    description: "确保所有用例都有执行结果"
    steps:
      - id: s3_1_completeness_check
        name: "完整性检查"
        run: agent.test.result_aggregator
        inputs:
          - case_inventory: "$runtime/case-inventory.yaml"
          - results: "$runtime/results-with-evidence.yaml"
        outputs:
          - path: "runtime/completeness-report.yaml"
        decision_logic: |
          missing_cases = cases - results
          IF missing_cases.count > 0:
            IF missing_cases.all(priority IN [P2, P3]):
              status = WARNING (允许 P2/P3 缺失)
              missing_reason = "P2/P3 用例未执行"
            ELSE:
              status = INCOMPLETE
              missing_reason = "P0/P1 用例缺失结果"
              RETURN_TO s2_collect_results
          ELSE:
            status = VALID

      - id: s3_2_evidence_validation
        name: "证据验证"
        run: agent.test.result_aggregator
        inputs:
          - results: "$runtime/results-with-evidence.yaml"
        outputs:
          - path: "runtime/evidence-validation.yaml"
        validation_rules:
          - rule: "失败用例必须有证据"
            check: "ALL(results WHERE status=fail) HAVE evidence NOT EMPTY"
            severity: warning
          - rule: "P0 失败必须有 trace_id"
            check: "ALL(results WHERE status=fail AND case_priority=P0) HAVE evidence.trace_id NOT NULL"
            severity: blocker

  # ========== Stage 4: Bug 契约生成 ==========
  - id: s4_bug_generation
    name: "Bug 契约生成"
    description: "将失败用例自动转换为 Bug 契约"
    condition: "$runtime/results-parsed.yaml.failed_count > 0"
    steps:
      - id: s4_1_group_failures
        name: "失败用例分组"
        run: agent.test.result_aggregator
        inputs:
          - results: "$runtime/results-with-evidence.yaml"
        outputs:
          - path: "runtime/failure-groups.yaml"
        grouping_strategy:
          - "按错误消息相似度分组（可能的同一 Bug）"
          - "按功能模块分组"
          - "优先保留 P0/P1，合并 P2/P3"

      - id: s4_2_generate_bugs
        name: "生成 Bug 契约"
        run: agent.test.bug_generator
        inputs:
          - failure_groups: "$runtime/failure-groups.yaml"
          - round_id: "$ROUND_ID"
          - version: "$inputs.test_execution_bundle.target_version"
        outputs:
          - path: "bugs/"
        generation_rules:
          - rule: "一对一映射"
            description: "每个独立失败用例生成一个 Bug"
            when: "failure_group.size == 1"

          - rule: "多对一映射"
            description: "相似失败合并为一个 Bug"
            when: "failure_group.size > 1 AND similar_error"
            output: "一个 Bug，关联多个用例"

          - rule: "优先级映射"
            description: "用例优先级映射到 Bug 严重程度"
            mapping:
              P0_case -> P0_bug
              P1_case -> P1_bug
              P2_case -> P2_bug
              P3_case -> P3_bug

          - rule: "类别推断"
            description: "根据用例类型推断 Bug 类别"
            mapping:
              functional_test -> functional_bug
              performance_test -> performance_bug
              security_test -> security_bug

      - id: s4_3_bug_inventory
        name: "Bug 清单"
        run: agent.test.result_aggregator
        inputs:
          - bugs: "bugs/"
        outputs:
          - path: "runtime/bug-inventory.yaml"
        summary:
          new_bugs: "$BUGS.count"
          by_severity:
            p0: "$BUGS.where(severity=P0).count"
            p1: "$BUGS.where(severity=P1).count"
            p2: "$BUGS.where(severity=P2).count"
            p3: "$BUGS.where(severity=P3).count"

  # ========== Stage 5: 生成测试报告 ==========
  - id: s5_report_generation
    name: "生成测试报告"
    description: "生成机器和人类可读的测试报告"
    steps:
      - id: s5_1_calculate_metrics
        name: "计算测试指标"
        run: agent.test.result_aggregator
        inputs:
          - case_inventory: "$runtime/case-inventory.yaml"
          - results: "$runtime/results-with-evidence.yaml"
          - bug_inventory: "$runtime/bug-inventory.yaml"
        outputs:
          - path: "runtime/metrics.yaml"
        metrics:
          - pass_rate: "passed / total_executed * 100"
          - p0_pass_rate: "P0_passed / P0_total * 100"
          - p1_pass_rate: "P1_passed / P1_total * 100"
          - smoke_pass_rate: "smoke_passed / smoke_total * 100"
          - new_bug_count: "$bug_inventory.new_bugs"
          - p0_bug_count: "$bug_inventory.by_severity.p0"
          - p1_bug_count: "$bug_inventory.by_severity.p1"

      - id: s5_2_generate_json_report
        name: "生成 JSON 报告"
        run: agent.test.result_aggregator
        inputs:
          - metrics: "$runtime/metrics.yaml"
          - results: "$runtime/results-with-evidence.yaml"
          - bug_inventory: "$runtime/bug-inventory.yaml"
        outputs:
          - path: "test-report.json"
        format: json
        schema: ../../contracts/test-report/v1/schema.json

      - id: s5_3_generate_markdown_report
        name: "生成 Markdown 报告"
        run: agent.test.result_aggregator
        inputs:
          - json_report: "test-report.json"
        outputs:
          - path: "test-report.md"
        format: markdown
        sections:
          - "执行概要"
          - "用例执行统计"
          - "失败用例详情"
          - "Bug 清单"
          - "测试覆盖度"
          - "风险评估"
          - "改进建议"

  # ========== Stage 6: 门禁判定 ==========
  - id: s6_gate_evaluation
    name: "门禁判定"
    description: "根据测试结果和门禁规则，判定本轮结论"
    steps:
      - id: s6_1_evaluate_exit_criteria
        name: "评估出测标准"
        run: agent.test.result_aggregator
        inputs:
          - metrics: "$runtime/metrics.yaml"
          - bug_inventory: "$runtime/bug-inventory.yaml"
        outputs:
          - path: "runtime/gate-evaluation.yaml"
        gate:
          ref: gate.test.test_execution_gate
          on_fail:
            action: record_failure_and_continue

      - id: s6_2_determine_conclusion
        name: "确定轮次结论"
        run: agent.test.result_aggregator
        type: decision
        decision_logic: |
          # P0 Bug 清零检查
          IF p0_bug_count > 0:
            conclusion = FAIL
            rationale = "存在 P0 Bug，必须修复"
            next_action = fix_and_retest

          # 冒烟 100% 检查
          ELIF smoke_pass_rate < 100:
            conclusion = FAIL
            rationale = "冒烟测试未 100% 通过"
            next_action = fix_and_retest

          # P1 阈值检查
          ELIF p1_bug_count > p1_threshold:
            conclusion = FAIL
            rationale = "P1 Bug 数量超过阈值 ($p1_bug_count > $p1_threshold)"
            next_action = fix_and_retest

          # 通过率检查
          ELIF overall_pass_rate < pass_rate_threshold:
            conclusion = CONDITIONAL_PASS
            rationale = "整体通过率未达标，但无阻塞性问题"
            conditions:
              - "遗留 Bug 已有规避方案"
              - "风险评估完成"
            next_action = human_decision_required

          # 所有条件满足
          ELSE:
            conclusion = PASS
            rationale = "满足出测标准"
            next_action = proceed_to_release

        outputs:
          - path: "runtime/conclusion.yaml"

      - id: s6_3_create_round_record
        name: "创建轮次记录"
        run: agent.test.result_aggregator
        inputs:
          - conclusion: "$runtime/conclusion.yaml"
          - metrics: "$runtime/metrics.yaml"
          - gate_evaluation: "$runtime/gate-evaluation.yaml"
        outputs:
          - path: "test-round.yaml"
        note: "这是本轮测试的权威状态文件"

# ============================================
# 门禁规则
# ============================================
gates:
  bundle_validation:
    ref: ../../gates/bundle-validation-gate/v1/gate.yaml

  test_execution_gate:
    ref: ../../gates/test-execution-gate/v1/gate.yaml

# ============================================
# 人类介入
# ============================================
human_in_the_loop:
  conditional_pass_review:
    stage: s6_gate_evaluation
    step: s6_2_determine_conclusion
    condition: "conclusion == CONDITIONAL_PASS"
    timeout: 24h
    required_approvers:
      - role: qa_lead
      - role: pm
    approval_criteria:
      - "风险评估已完成"
      - "遗留 Bug 有规避方案"
      - "回滚计划已准备"
    inputs_to_review:
      - "test-report.md"
      - "bugs/ (所有 open 状态)"
    on_approve:
      conclusion: PASS
    on_reject:
      conclusion: FAIL
      next_action: fix_and_retest

# ============================================
# 输入/输出示例
# ============================================
examples:
  input:
    test-execution-bundle.yaml:
      target_version: "v1.0.0"
      test_cases:
        - case_id: "F-BASE-002"
          title: "开发测试登录"
          suite: smoke
          priority: P0
        - case_id: "F-P1-001"
          title: "跑者画像保存"
          suite: e2e_chrome
          priority: P1

    test-results.yaml:
      source: "claude_code"
      executed_at: "2026-02-05T10:00:00Z"
      results:
        - case_id: "F-BASE-002"
          status: pass
          duration_seconds: 5
        - case_id: "F-P1-001"
          status: fail
          evidence:
            screenshots: ["evidence/p1-001-fail.png"]
            logs_hint: ["api-runner-profile"]
            note: "保存后数据未刷新"

  output:
    test-round.yaml:
      round_id: "TSTR-0001"
      status: completed
      conclusion:
        decision: fail
        rationale: "存在 1 个 P1 Bug"
        exit_criteria_met: false
      summary:
        new_bugs: 1
        bug_breakdown:
          p1_open: 1

    bugs/BUG-2026-0001.contract.yaml:
      bug_id: "BUG-2026-0001"
      title: "跑者画像保存后数据未刷新"
      severity: P1
      category: functional
      status: new
      detected_in:
        round_id: "TSTR-0001"
        version: "v1.0.0"

# ============================================
# 可观测性
# ============================================
observability:
  metrics:
    - workflow_execution_time
    - cases_processed
    - bugs_generated
    - pass_rate
    - gate_evaluation_result

  dashboards:
    - test_orchestration_progress
    - bug_generation_summary

# ============================================
# 元数据
# ============================================
metadata:
  version: 1.0
  created: "2026-02-05"
  level: L3
  category: orchestration
  dependencies:
    - workflow.test.bug_sub (for bug lifecycle)

  changelog:
    - version: "1.0.0"
      date: "2026-02-05"
      changes:
        - "初始版本：测试编排与结果收敛工作流"
        - "支持人工/Claude Code/Runner 多种结果来源"
        - "自动将失败用例转换为 Bug 契约"
        - "生成结构化测试报告"
        - "门禁判定与轮次结论"
