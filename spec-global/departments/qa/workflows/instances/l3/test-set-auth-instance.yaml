# L3 Workflow Instance Example
# Test Set Execution - Auth Module
# 实际运行时由 Orchestrator 根据模板生成

kind: l3_workflow_instance
version: "1.0"

# ============================================
# 基础标识
# ============================================
id: instance.qa.test_set_auth_20260224
template_id: template.qa.test_set_l3
name: Test Set Execution - Auth Module
description: "执行认证模块 Test Set 的完整测试流程"

owner: qa-governance
tags: [workflow, L3, test-set, execution, qa]

# ============================================
# 运行时上下文
# ============================================
context:
  test_run_id: "TR-2026-0224-abc123"
  test_set_id: "ts_auth"
  test_set_name: "用户认证测试"
  build_version: "v1.2.3"
  build_commit: "a1b2c3d4"
  environment: "test"

  # Test Set 定义（从 qa/test-sets/ts_auth.yaml 加载）
  test_set_definition:
    test_set_id: "ts_auth"
    module: "用户认证"
    description: "测试用户登录、注册、登出功能"
    strategy:
      focus:
        - "登录功能"
        - "注册功能"
        - "登出功能"
        - "Token 管理"
      priority: "P0"
    test_focus:
      positive:
        - "正常登录"
        - "正常注册"
        - "正常登出"
      negative:
        - "密码错误"
        - "用户不存在"
        - "Token 过期"
      boundary:
        - "用户名长度边界"
        - "密码强度边界"
    execution:
      depends_on: []  # 无依赖
      estimated_duration: "30min"
      automation_ready: true

  # 环境检查结果（从 L2 Phase 3 传递）
  env_check_result:
    all_passed: true
    checks:
      - type: command_exists
        command: "playwright"
        passed: true
      - type: service_reachable
        endpoint: "test.local:443"
        passed: true

  # 依赖的 Test Set 执行结果（当前无依赖）
  dependency_results: {}

# ============================================
# 步骤定义（7步）
# ============================================
steps:
  # ========== Step 1: 用例生成 ==========
  - id: case_generation
    name: "用例生成"
    kind: agent
    agent_id: agent.qa.case_generator
    status: pending
    depends_on: []

    inputs:
      test_set: "{{ context.test_set_definition }}"
      build_context:
        version: "{{ context.build_version }}"
        changed_areas: ["auth", "user"]

    expected_outputs:
      cases_path: "qa/test-runs/{{ context.test_run_id }}/tse-ts_auth/cases.yaml"
      cases_count: 15

  # ========== Step 2: 脚本翻译 ==========
  - id: script_translation
    name: "脚本翻译"
    kind: agent
    agent_id: agent.qa.script_translator
    status: pending
    depends_on: [case_generation]

    inputs:
      generated_cases: "$steps.case_generation.outputs"
      environment:
        base_url: "https://test.local"
        api_url: "https://api.test.local"
      test_set: "{{ context.test_set_definition }}"

    expected_outputs:
      scripts_dir: "qa/test-runs/{{ context.test_run_id }}/tse-ts_auth/scripts/"
      scripts_count: 15

  # ========== Step 3: 脚本执行（执行者角色）==========
  - id: script_execution
    name: "脚本执行"
    kind: skill
    skill_id: skill.runner.test_e2e
    status: pending
    depends_on: [script_translation]

    # 角色约束：执行者
    role_constraints:
      role: executor
      allowed_actions:
        - call_test_runner
        - collect_evidence
        - report_runner_output
      forbidden_actions:
        - judge_pass_fail
        - fabricate_errors
        - mock_execution

    inputs:
      test_scripts: "$steps.script_translation.outputs"
      environment:
        base_url: "https://test.local"
      runner_config:
        command_template: "test_runner run --case {{ case.case_id }} --env {{ context.environment }}"
        evidence_dir: "qa/test-runs/{{ context.test_run_id }}/tse-ts_auth/evidence/"
        capture:
          logs: true
          screenshots: true
          video: false
          network_trace: true

    expected_outputs:
      runner_output_path: "qa/test-runs/{{ context.test_run_id }}/tse-ts_auth/runner-output.json"
      evidence_dir: "qa/test-runs/{{ context.test_run_id }}/tse-ts_auth/evidence/"
      runtime_errors: []

  # ========== Step 4: AI 行为合规检查 ==========
  - id: behavior_compliance
    name: "AI 行为合规检查"
    kind: skill
    skill_id: skill.qa.behavior_compliance_checker
    status: pending
    depends_on: [script_execution]

    inputs:
      runner_output: "$steps.script_execution.outputs.runner_output"
      evidence_dir: "$steps.script_execution.outputs.evidence_dir"
      confirmed_env_errors: "{{ context.env_check_result.failures }}"

    gate:
      type: auto_check
      on_pass: proceed
      on_fail: mark_invalid_run

    expected_outputs:
      compliance_result_path: "qa/test-runs/{{ context.test_run_id }}/tse-ts_auth/behavior-compliance.yaml"

  # ========== Step 5: 结果判定（判断者角色）==========
  - id: result_judgment
    name: "结果判定"
    kind: agent
    agent_id: agent.qa.result_judge
    status: pending
    depends_on: [behavior_compliance]

    # 角色约束：判断者
    role_constraints:
      role: judge
      allowed_actions:
        - read_evidence
        - judge_pass_fail
        - write_results
      forbidden_actions:
        - call_test_runner
        - modify_evidence
        - fabricate_evidence

    inputs:
      runner_output: "$steps.script_execution.outputs.runner_output"
      evidence_dir: "$steps.script_execution.outputs.evidence_dir"
      expected_results: "$steps.case_generation.outputs"

    expected_outputs:
      results_path: "qa/test-runs/{{ context.test_run_id }}/tse-ts_auth/results.yaml"
      pass_count: 13
      fail_count: 2
      failures:
        - case_id: "TC_AUTH_001"
          reason: "Assertion failed: expected 200, got 500"
          evidence_ref: "evidence/TC_AUTH_001.log"
        - case_id: "TC_AUTH_005"
          reason: "Timeout: API response exceeded 30s"
          evidence_ref: "evidence/TC_AUTH_005.log"

  # ========== Step 6: TSE 组装 ==========
  - id: tse_assembly
    name: "TSE 组装"
    kind: agent
    agent_id: agent.qa.tse_assembler
    status: pending
    depends_on: [result_judgment]

    inputs:
      test_set_id: "{{ context.test_set_id }}"
      test_run_id: "{{ context.test_run_id }}"
      generated_cases: "$steps.case_generation.outputs"
      test_scripts: "$steps.script_translation.outputs"
      execution_results: "$steps.result_judgment.outputs.results"

    expected_outputs:
      tse_path: "qa/test-runs/{{ context.test_run_id }}/tse-ts_auth/tse.yaml"

  # ========== Step 7: Bug 起草 ==========
  - id: bug_drafting
    name: "Bug 起草"
    kind: agent
    agent_id: agent.qa.bug_drafter
    status: pending
    depends_on: [tse_assembly]

    condition: "fail_count > 0"

    inputs:
      failures: "$steps.result_judgment.outputs.failures"
      tse: "$steps.tse_assembly.outputs"

    expected_outputs:
      bug_drafts:
        - "qa/bugs/bug_ts_auth_TC_AUTH_001.yaml"
        - "qa/bugs/bug_ts_auth_TC_AUTH_005.yaml"

# ============================================
# 输出契约
# ============================================
output:
  test_set_id: "ts_auth"
  status: "completed"  # completed, failed, skipped, invalid_run
  tse_path: "qa/test-runs/TR-2026-0224-abc123/tse-ts_auth/tse.yaml"
  results_summary:
    total_cases: 15
    passed_cases: 13
    failed_cases: 2
    pass_rate: 86.7
  bug_drafts:
    - "qa/bugs/bug_ts_auth_TC_AUTH_001.yaml"
    - "qa/bugs/bug_ts_auth_TC_AUTH_005.yaml"

# ============================================
# 状态机
# ============================================
state_machine:
  current_state: pending
  states:
    - pending
    - in_progress
    - completed
    - failed
    - skipped
    - invalid_run

# ============================================
# 元数据
# ============================================
metadata:
  created_at: "2026-02-24T10:00:00Z"
  started_at: null
  completed_at: null
  parent_l2_id: "instance.qa.test_plan_execution_20260224"
  parent_phase_id: "test_set_execution"
