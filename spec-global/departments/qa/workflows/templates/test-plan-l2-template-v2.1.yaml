kind: l2_workflow_template
version: "2.1"
id: template.qa.test_plan_l2
name: Test Plan Execution L2 Template
description: |
  L2 template for Test Plan execution with 9 phases.

  This template defines the structure for QA department-level test execution workflows.
  Phase 4 (Test Set Execution) spawns L3 instances for each Test Set.

  Workflow Flow:
  - Phase 1-3: L2 direct execution (Test Run init, Env provision, Env check)
  - Phase 4: Spawn L3 instances for each Test Set (串行，按依赖关系执行)
  - Phase 5: L3 Output Validation (新增)
  - Phase 6-9: L2 aggregation after all L3s complete (Bug summary, Report, Exit eval, Retrospective)

  Version 2.1 Changes:
  - Added Phase 5: l3_output_validation
  - Enhanced env_check with gate definition (blocking L3 on fail)
  - Added test_set_dependencies format: dag
  - Added execution_mode configuration
  - Added observability metrics and tracing

# Phase definitions - structural elements that cannot be omitted
phases:
  - id: test_run_init
    name: "Test Run Initialization"
    description: "Create Test Run object and bind to Test Plan"
    default_complexity: S  # Direct execution
    depends_on: []

  - id: env_provision
    name: "Environment Provision"
    description: "Deploy test environment and build version"
    default_complexity: S  # Direct execution
    depends_on: ["test_run_init"]

  - id: env_check
    name: "Environment Check"
    description: |
      Orchestrator executes tool availability check.
      Must pass before spawning L3 instances.
    default_complexity: S  # Orchestrator skill, direct execution
    depends_on: ["env_provision"]
    gate:
      type: auto_check
      on_pass: proceed_to_l3_spawning
      on_fail: block_l3_spawning
    outputs:
      - env_check_result  # pass | fail | degraded

  - id: test_set_execution
    name: "Test Set Execution"
    description: |
      Spawn L3 instances for each Test Set.
      - Current: 串行执行，按模块依赖关系
      - Future: 可扩展为并行执行无依赖的 Test Sets
      Pre-conditions: env_check.status == completed AND env_check_result == pass
    default_complexity: L  # Always spawns L3s
    depends_on: ["env_check"]
    pre_conditions:
      - "env_check.status == 'completed'"
      - "env_check_result == 'pass'"
    spawns_l3: true
    l3_template_id: template.qa.test_set_l3
    execution_mode: inherit  # Inherit from L2 or specify

  - id: l3_output_validation
    name: "L3 Output Validation"
    description: |
      Validate L3 outputs for schema compliance and data integrity.
      Checks: required fields, status enumeration, evidence linkage.
    default_complexity: S
    depends_on: ["test_set_execution"]
    validation_rules:
      - id: require_expected_fields
        description: "All L3 outputs must have required fields"
        severity: error
        fail_on_violation: true
      - id: status_enum_check
        description: "Status must be one of: completed, failed, skipped, invalid_run"
        severity: error
        fail_on_violation: true
      - id: evidence_link_consistency
        description: "completed/failed status must have valid evidence linkage"
        severity: error
        fail_on_violation: true
      - id: invalid_run_reporting
        description: "Invalid runs must have invalid_run_reason"
        severity: warning
        fail_on_violation: false
    on_failure:
      action: mark_l2_invalid_run
      report_all_invalid_runs: true
      allow_partial_summary: true  # Allow other phases to continue

  - id: bug_summary
    name: "Bug Summary"
    description: "Collect, deduplicate, and merge all L3 Bug drafts"
    default_complexity: S  # Direct execution
    depends_on: ["l3_output_validation"]

  - id: test_report
    name: "Test Report"
    description: |
      Generate test report including:
      - Execution summary (pass/fail rates)
      - Test case count
      - Feature coverage
      - Bug list
      - Risk assessment
      - Invalid run breakdown
    default_complexity: S  # Direct execution
    depends_on: ["bug_summary"]

  - id: exit_evaluation
    name: "Exit Evaluation"
    description: "Evaluate exit conditions (pass/conditional pass/fail)"
    default_complexity: S  # Direct execution
    depends_on: ["test_report"]

  - id: retrospective
    name: "Retrospective"
    description: "Retrospective summary and lessons learned"
    default_complexity: S  # Direct execution
    depends_on: ["exit_evaluation"]

# Execution strategy by complexity
execution_strategies:
  S:
    description: "Direct execution - run phase steps inline in L2"
    spawns_l3: false
  L:
    description: "Spawn L3 - create L3 instance(s) for Test Set execution"
    spawns_l3: true
    l3_template_id: template.qa.test_set_l3

# Test Set dependency configuration
test_set_dependencies:
  description: |
    Test Sets can have dependencies on each other based on module relationships.
    Example: frontend checkout depends on backend payment service.
    If dependency fails, dependent Test Set is skipped.
  format: dag  # Directed Acyclic Graph
  execution_mode: serial  # Serial execution by default

  # Example configuration (to be overridden in instance)
  # test_sets:
  #   - id: ts_auth
  #     depends_on: []
  #   - id: ts_payment
  #     depends_on: [ts_auth]
  #   - id: ts_checkout
  #     depends_on: [ts_payment]

# Parallel execution configuration (future extension)
parallel_execution:
  enabled: false  # Currently serial, set to true for future parallel support
  allow_parallel_test_sets: true  # Allow Test Sets without dependencies to run in parallel

# L2 to L3 data contract
l3_input_schema:
  description: "Input data passed to each Test Set L3 instance"
  required_fields:
    - test_run_id
    - test_set_id
    - test_set_definition
    - build_version
    - build_commit
    - environment
    - env_check_result
    - execution_mode  # enforce | warn
  optional_fields:
    - dependency_results  # Results from dependent Test Sets

# L3 to L2 data contract
l3_output_schema:
  description: "Output data returned from each Test Set L3 instance"
  required_fields:
    - test_set_id
    - status  # completed, failed, skipped, invalid_run
    - tse_path  # Path to TSE file
    - results_summary
      - total_cases
      - passed_cases
      - failed_cases
      - pass_rate
    - bug_drafts  # List of bug draft file paths
  optional_fields:
    - skip_reason
    - failure_reason
    - invalid_run_reason  # Required if status == invalid_run
    - compliance_result_path

# Invalid run status for L2
l2_invalid_run_reasons:
  description: "Reasons why L2 workflow itself is marked as invalid_run"
  reasons:
    - id: l3_output_schema_error
      description: "L3 output missing required fields"
    - id: l3_output_integrity_error
      description: "L3 output evidence linkage invalid"
    - id: critical_l3_invalid_run
      description: "Critical L3 marked as invalid_run"
    - id: env_check_blocked
      description: "env_check failed and blocked all L3s"

# L2 Execution mode
execution_mode:
  description: "Controls L3 behavior_compliance enforcement level"
  default: enforce
  inherit_from_env: true
  modes:
    enforce:
      description: "All L3s use enforce mode"
    warn:
      description: "All L3s use warn mode (testing only)"
  prod_enforce: true  # Production always enforces

# Observability configuration
observability:
  description: "Metrics and tracing for L2 workflow"
  metrics:
    - name: l2_execution_duration
      type: histogram
      description: "L2 workflow execution duration in seconds"
      labels:
        - test_plan_id
        - status
      buckets: [60, 300, 600, 1800, 3600, 7200]

    - name: l3_instances_total
      type: counter
      description: "Total L3 instances spawned"
      labels:
        - l2_workflow_id
        - status

    - name: l2_invalid_run_total
      type: counter
      description: "Total L2 invalid runs"
      labels:
        - invalid_run_reason
        - test_plan_id

    - name: test_set_execution_duration
      type: histogram
      description: "Time spent in test_set_execution phase"
      labels:
        - test_plan_id
      buckets: [60, 300, 600, 1800, 3600]

  tracing:
    description: "Distributed tracing spans for L2 workflow"
    spans:
      - name: l2_execution
        description: "Full L2 workflow execution"
        start_phase: test_run_init
        end_phase: retrospective

      - name: l3_spawning
        description: "L3 instance spawning and execution"
        start_phase: test_set_execution
        end_phase: l3_output_validation

# Instance schema (for validation)
instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
    - context
    - phases
  context_fields:
    - test_plan_id
    - test_plan_path
    - build_version
    - build_commit
    - environment
    - execution_mode
    - target_test_sets  # Optional: specific Test Sets to execute
  phase_fields:
    - id
    - complexity
    - status
    - l3_instance_ids
    - depends_on
  phase_optional_fields:
    - parallel_allowed
    - test_set_configs  # For test_set_execution phase

# Anti-Mock Constitution (inherited from v2)
constitution:
  id: anti_mock_constitution_v2
  name: "测试执行反 Mock 条款"
  version: "2.0"
  description: |
    在 L2/L3 工作流中：
    - L2 不允许跳过环境检查直接进入 L3
    - L3 不允许"假装"执行步骤
    - L3 不允许"模拟网络响应"
    - 所有通过/失败判定必须来自真实执行证据
    - 没有 evidence_bundle = 无效结果

  principles:
    - id: no_skip_env_check
      name: "禁止跳过环境检查"
      rule: "L2 必须完成 env_check 阶段才能调度 L3"

    - id: evidence_required
      name: "证据强制"
      rule: "L3 所有结果必须有 evidence_bundle，否则 status=invalid_run"

    - id: l3_output_validation
      name: "L3 输出验证"
      rule: "L2 汇总时验证 L3 输出完整性"
