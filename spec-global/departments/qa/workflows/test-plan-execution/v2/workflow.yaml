# Test Plan Execution Workflow v2.0
# L2 - Test Plan 执行工作流
# v2.0 重构：拆分为 L2 + L3 架构

kind: l2_workflow_instance
version: 2.0

# ============================================
# 基础标识
# ============================================
id: workflow.qa.test_plan_execution_v2
template_id: template.qa.test_plan_l2
name: Test Plan Execution
description: |
  L2 级别 Test Plan 执行工作流，协调测试批次执行：

  Phase 1-3: L2 直接执行
  - 初始化 Test Run
  - 准备测试环境
  - 环境探测（Orchestrator 执行）

  Phase 4: 调度 L3 实例
  - 为每个 Test Set 创建 L3 实例
  - 按模块依赖关系串行执行
  - 未来可扩展为并行

  Phase 5-8: L2 汇总
  - Bug 汇总（去重、合并）
  - 生成测试报告
  - 出测评估
  - 复盘总结

  v2.0 改进：
  - L2/L3 架构拆分
  - L3 处理单个 Test Set 完整流程
  - L2 负责编排和汇总

owner: qa-governance
tags: [workflow, L2, test-plan, test-run, execution, qa]

# ============================================
# 运行时上下文
# ============================================
context:
  test_plan_id: ""  # 待填充：Test Plan ID
  test_plan_path: ""  # 待填充：Test Plan 文件路径
  build_version: ""  # 待填充：构建版本号
  build_commit: ""  # 待填充：构建 commit hash
  environment: "test"  # 测试环境名称
  target_test_sets: []  # 可选：指定要执行的 Test Set ID 列表

# ============================================
# 阶段定义（8个 Phase）
# ============================================
phases:
  # ========== Phase 1: Test Run 初始化 ==========
  - id: test_run_init
    name: "Test Run 初始化"
    description: "创建 Test Run 对象，关联 Test Plan"
    complexity: S  # 直接执行
    status: pending
    depends_on: []

    steps:
      - id: p1_s1_load_test_plan
        name: "加载 Test Plan"
        kind: skill
        skill_id: skill.file.read
        inputs:
          - path: "{{ context.test_plan_path }}"
        outputs:
          - var: test_plan

      - id: p1_s2_create_test_run
        name: "创建 Test Run"
        kind: agent
        agent_id: agent.qa.test_run_initializer
        inputs:
          - test_plan: "$outputs.p1_s1_load_test_plan"
          - build_version: "{{ context.build_version }}"
          - build_commit: "{{ context.build_commit }}"
          - environment: "{{ context.environment }}"
        outputs:
          - path: "qa/test-runs/{{ runtime.test_run_id }}/test-run.yaml"
            schema: ../../contracts/test-run/v1/schema.yaml
          - var: test_run
        verifiers:
          - type: schema
            schema_path: ../../contracts/test-run/v1/schema.yaml

    phase_outputs:
      - test_run_id
      - test_run_path
      - test_plan

  # ========== Phase 2: 环境准备 ==========
  - id: env_provision
    name: "环境准备"
    description: "准备测试环境，部署待测版本"
    complexity: S  # 直接执行
    status: pending
    depends_on: ["test_run_init"]

    steps:
      - id: p2_s1_provision_env
        name: "部署测试环境"
        kind: agent
        agent_id: agent.qa.env_provisioner
        inputs:
          - test_run: "$phases.test_run_init.test_run"
          - build_version: "{{ context.build_version }}"
          - build_commit: "{{ context.build_commit }}"
          - environment: "{{ context.environment }}"
        outputs:
          - var: environment_info
          - path: "qa/test-runs/{{ runtime.test_run_id }}/env-health.yaml"
            schema: ../../contracts/devops-config/v1/template.yaml

      - id: p2_s2_health_check
        name: "环境健康检查"
        kind: gate
        type: auto_check
        check: "environment_info.status == 'healthy'"
        on_pass:
          trigger: env_provisioned
        on_fail:
          trigger: env_provision_failed
          action: fail_phase

    phase_outputs:
      - environment_info
      - env_health_path

  # ========== Phase 3: 环境探测 ==========
  - id: env_check
    name: "环境探测"
    description: |
      由 Orchestrator 执行环境/工具检查，不由 AI 自述。
      这是唯一允许产生 tool_missing / network_error 的步骤。
    complexity: S  # 直接执行
    status: pending
    depends_on: ["env_provision"]

    steps:
      - id: p3_s1_check_tools
        name: "检查测试工具"
        kind: skill
        skill_id: skill.env.check_tools
        description: |
          Orchestrator 直接执行，AI 无法干预。
          检查项：playwright, curl, nc 等测试工具是否存在。
        inputs:
          - checks:
              - type: command_exists
                commands: ["playwright", "npx", "node"]
              - type: service_reachable
                endpoints:
                  - url: "{{ context.environment }}.test.local"
                    port: 443
              - type: directory_writable
                paths:
                  - "qa/test-runs/{{ runtime.test_run_id }}/evidence/"
        outputs:
          - path: "qa/test-runs/{{ runtime.test_run_id }}/env-check.json"
          - var: env_check_result

      - id: p3_s2_validate_env_check
        name: "验证环境检查结果"
        kind: gate
        type: auto_check
        check: "env_check_result.all_passed == true"
        on_pass:
          trigger: env_check_passed
        on_fail:
          trigger: env_check_failed
          action: fail_phase
          message: |
            环境检查失败：{{ env_check_result.failures | join(', ') }}
            这是 Orchestrator 确认的真实缺失，不是 AI 自述。

    phase_outputs:
      - env_check_result
      - env_check_path
      - confirmed_env_errors  # Orchestrator 确认的环境问题（唯一合法来源）

  # ========== Phase 4: Test Set 执行（L3 调度）==========
  - id: test_set_execution
    name: "Test Set 执行"
    description: |
      为每个 Test Set 创建 L3 实例并执行。

      执行策略：
      - 当前：串行执行，按模块依赖关系
      - 未来：可扩展为并行执行无依赖的 Test Sets

      依赖规则：
      - B 依赖 A：A 失败 → B 跳过
      - 无依赖：正常执行
    complexity: L  # 总是生成 L3
    status: pending
    depends_on: ["env_check"]
    spawns_l3: true
    l3_template_id: template.qa.test_set_l3

    # Test Set 配置（从 Test Plan 加载）
    test_sets: []  # 待填充：从 test_plan.test_sets 加载

    steps:
      - id: p4_s1_load_test_sets
        name: "加载 Test Set 定义"
        kind: skill
        skill_id: skill.file.read
        description: |
          加载所有 Test Set 定义，构建依赖关系图。
        inputs:
          - test_sets_dir: "qa/test-sets/"
          - target_test_sets: "{{ context.target_test_sets }}"
          - test_plan: "$phases.test_run_init.test_plan"
        outputs:
          - var: test_set_configs  # 包含 id, name, depends_on
          - var: dependency_graph  # Test Set 依赖关系图

      - id: p4_s2_create_l3_instances
        name: "创建 L3 实例"
        kind: orchestrator
        description: |
          为每个 Test Set 创建 L3 实例。
          按依赖关系排序后创建。
        inputs:
          - test_run_id: "$phases.test_run_init.test_run_id"
          - test_set_configs: "$outputs.p4_s1_load_test_sets"
          - build_version: "{{ context.build_version }}"
          - build_commit: "{{ context.build_commit }}"
          - environment: "{{ context.environment }}"
          - env_check_result: "$phases.env_check.env_check_result"
          - l3_template_id: "template.qa.test_set_l3"
        outputs:
          - var: l3_instance_ids  # List of created L3 instance IDs
          - var: l3_execution_order  # Execution order based on dependencies

      - id: p4_s3_execute_l3s
        name: "执行 L3 实例"
        kind: orchestrator
        description: |
          串行执行 L3 实例，按依赖关系顺序。
          如果某个 L3 失败，跳过依赖它的 L3。
        inputs:
          - l3_instance_ids: "$outputs.p4_s2_create_l3_instances"
          - execution_order: "$outputs.p4_s2_create_l3_instances"
        outputs:
          - var: l3_results  # Key-value map of test_set_id -> result
          - var: l3_outputs  # All L3 output data

      - id: p4_s4_validate_l3_completion
        name: "验证 L3 完成状态"
        kind: gate
        type: auto_check
        check: |
          all(l3_results.*.status in ['completed', 'skipped']) or
          any(l3_results.*.status == 'failed')
        on_pass:
          trigger: l3_execution_completed
        on_fail:
          trigger: l3_execution_failed
          action: fail_phase

    phase_outputs:
      - l3_instance_ids
      - l3_results  # test_set_id -> {status, tse_path, results_summary, bug_drafts}
      - l3_outputs  # Full L3 output data

  # ========== Phase 5: Bug 汇总 ==========
  - id: bug_summary
    name: "Bug 汇总"
    description: |
      收集所有 L3 产生的 Bug 草稿，进行：
      - 去重（相同症状、相同位置的 Bug 合并）
      - 优先级排序
      - 关联 Test Set
      - 准备人工审核
    complexity: S  # 直接执行
    status: pending
    depends_on: ["test_set_execution"]

    steps:
      - id: p5_s1_collect_bugs
        name: "收集 Bug 草稿"
        kind: skill
        skill_id: skill.file.collect
        description: |
          收集所有 L3 产出的 Bug 草稿文件。
        inputs:
          - l3_outputs: "$phases.test_set_execution.l3_outputs"
          - bug_paths_pattern: "qa/bugs/*.yaml"
        outputs:
          - var: bug_drafts  # List of bug draft data

      - id: p5_s2_deduplicate_bugs
        name: "Bug 去重"
        kind: agent
        agent_id: agent.qa.bug_summarizer
        description: |
          去重和合并 Bug：
          - 相同症状 + 相同位置 → 合并为一个 Bug
          - 记录关联的 Test Sets 和用例
          - 评估综合优先级
        inputs:
          - bug_drafts: "$outputs.p5_s1_collect_bugs"
          - l3_results: "$phases.test_set_execution.l3_results"
        outputs:
          - var: deduplicated_bugs
          - var: bug_groups  # 原始 Bug -> 合并后 Bug 的映射

      - id: p5_s3_review_bugs
        name: "Bug 审核门禁"
        kind: gate
        type: human_review
        prompt: "请审核汇总后的 Bug 列表，确认后将正式创建"
        artifacts:
          - "qa/test-runs/{{ runtime.test_run_id }}/bug-summary.yaml"
        on_approve:
          trigger: bugs_confirmed
        on_reject:
          trigger: bugs_rejected
          action: retry_step

    phase_outputs:
      - bug_summary_path
      - confirmed_bugs  # List of confirmed bug data

  # ========== Phase 6: 测试报告 ==========
  - id: test_report
    name: "测试报告"
    description: |
      生成测试报告，包含：
      - 执行汇总（通过率、失败率）
      - 执行用例数
      - 覆盖功能点
      - Bug 列表
      - 风险评估
    complexity: S  # 直接执行
    status: pending
    depends_on: ["bug_summary"]

    steps:
      - id: p6_s1_generate_report
        name: "生成测试报告"
        kind: agent
        agent_id: agent.qa.report_generator
        inputs:
          - test_run: "$phases.test_run_init.test_run"
          - l3_results: "$phases.test_set_execution.l3_results"
          - confirmed_bugs: "$phases.bug_summary.confirmed_bugs"
          - test_plan: "$phases.test_run_init.test_plan"
        outputs:
          - path: "qa/test-runs/{{ runtime.test_run_id }}/test-report.yaml"
            schema: ../../contracts/test-report/v1/schema.yaml
          - path: "qa/test-runs/{{ runtime.test_run_id }}/test-report.md"
          - var: test_report

    phase_outputs:
      - test_report_path
      - test_report_data

  # ========== Phase 7: 出测评估 ==========
  - id: exit_evaluation
    name: "出测评估"
    description: |
      评估是否满足出测条件：
      - 通过率是否达标
      - 阻塞 Bug 是否存在
      - 风险是否可控
    complexity: S  # 直接执行
    status: pending
    depends_on: ["test_report"]

    steps:
      - id: p7_s1_evaluate_exit
        name: "评估出测条件"
        kind: agent
        agent_id: agent.qa.exit_evaluator
        inputs:
          - test_run: "$phases.test_run_init.test_run"
          - test_report: "$phases.test_report.test_report_data"
          - confirmed_bugs: "$phases.bug_summary.confirmed_bugs"
          - test_plan: "$phases.test_run_init.test_plan"
        outputs:
          - path: "qa/test-runs/{{ runtime.test_run_id }}/exit-evaluation.yaml"
          - var: exit_decision

      - id: p7_s2_human_decision
        name: "人工最终决策"
        kind: gate
        type: human_decision
        prompt: "请确认出测评估结果"
        context:
          decision: "$outputs.p7_s1_evaluate_exit.exit_decision.decision"
          summary: "$outputs.p7_s1_evaluate_exit.exit_decision.summary"
          blocking_reasons: "$outputs.p7_s1_evaluate_exit.exit_decision.blocking_reasons"
        artifacts:
          - "qa/test-runs/{{ runtime.test_run_id }}/test-report.md"
          - "qa/test-runs/{{ runtime.test_run_id }}/exit-evaluation.yaml"
        options:
          - label: "通过"
            trigger: exit_pass
          - label: "有条件通过"
            trigger: exit_conditional_pass
          - label: "不通过，需要下一轮"
            trigger: exit_fail

    phase_outputs:
      - exit_decision
      - exit_evaluation_path

  # ========== Phase 8: 复盘总结 ==========
  - id: retrospective
    name: "复盘总结"
    description: |
      复盘总结：
      - 执行过程中的问题
      - 改进建议
      - 经验教训
    complexity: S  # 直接执行
    status: pending
    depends_on: ["exit_evaluation"]

    steps:
      - id: p8_s1_generate_retrospective
        name: "生成复盘总结"
        kind: agent
        agent_id: agent.qa.retrospective_generator
        inputs:
          - test_run_id: "$phases.test_run_init.test_run_id"
          - l3_results: "$phases.test_set_execution.l3_results"
          - exit_decision: "$phases.exit_evaluation.exit_decision"
          - confirmed_bugs: "$phases.bug_summary.confirmed_bugs"
          - env_issues: "$phases.env_check.confirmed_env_errors"
        outputs:
          - path: "qa/test-runs/{{ runtime.test_run_id }}/retrospective.md"
          - var: retrospective

      - id: p8_s2_update_test_run_final
        name: "更新 Test Run 最终状态"
        kind: skill
        skill_id: skill.file.update
        inputs:
          - test_run_path: "$phases.test_run_init.test_run_path"
          - exit_decision: "$phases.exit_evaluation.exit_decision"
          - retrospective_path: "$outputs.p8_s1_generate_retrospective"
        outputs:
          - var: final_test_run

    phase_outputs:
      - retrospective_path
      - final_test_run

# ============================================
# 运行时变量
# ============================================
runtime:
  test_run_id:
    type: string
    description: "生成的 Test Run ID"
    generator: "TR-{{ now() | date('%Y-%m-%d') }}-{{ random_suffix() }}"

# ============================================
# 状态机定义
# ============================================
state_machine:
  states:
    - INIT: "初始化"
    - TEST_RUN_INIT: "Test Run 初始化"
    - ENV_PROVISION: "环境准备"
    - ENV_CHECK: "环境探测"
    - L3_SCHEDULING: "L3 调度中"
    - L3_EXECUTING: "L3 执行中"
    - BUG_SUMMARY: "Bug 汇总"
    - TEST_REPORT: "测试报告"
    - EXIT_EVALUATION: "出测评估"
    - RETROSPECTIVE: "复盘总结"
    - COMPLETED: "完成"
    - FAILED: "失败"

  transitions:
    INIT:
      - to: TEST_RUN_INIT
        trigger: workflow_started

    TEST_RUN_INIT:
      - to: ENV_PROVISION
        trigger: test_run_created
      - to: FAILED
        trigger: test_plan_not_found

    ENV_PROVISION:
      - to: ENV_CHECK
        trigger: env_provisioned
      - to: FAILED
        trigger: env_provision_failed

    ENV_CHECK:
      - to: L3_SCHEDULING
        trigger: env_check_passed
      - to: FAILED
        trigger: env_check_failed

    L3_SCHEDULING:
      - to: L3_EXECUTING
        trigger: l3_instances_created

    L3_EXECUTING:
      - to: BUG_SUMMARY
        trigger: l3_execution_completed
      - to: FAILED
        trigger: l3_execution_failed

    BUG_SUMMARY:
      - to: TEST_REPORT
        trigger: bugs_confirmed

    TEST_REPORT:
      - to: EXIT_EVALUATION
        trigger: report_generated

    EXIT_EVALUATION:
      - to: RETROSPECTIVE
        trigger: exit_decision_made

    RETROSPECTIVE:
      - to: COMPLETED
        trigger: retrospective_completed

# ============================================
# 产出目录结构
# ============================================
output_structure: |
  qa/
  ├── test-runs/
  │   └── {test_run_id}/
  │       ├── test-run.yaml                 # Test Run 记录
  │       ├── env-health.yaml               # 环境健康检查
  │       ├── env-check.json                # Orchestrator 环境探测结果
  │       ├── bug-summary.yaml              # Bug 汇总（新增）
  │       ├── test-report.yaml              # 测试报告（新增）
  │       ├── test-report.md                # 测试报告 Markdown
  │       ├── exit-evaluation.yaml          # 出测评估
  │       ├── retrospective.md              # 复盘总结（新增）
  │       ├── tse-{test_set_id}/
  │       │   ├── cases.yaml                # 生成的用例
  │       │   ├── scripts/                  # 翻译的脚本
  │       │   ├── runner-output.json        # test_runner CLI 原始输出
  │       │   ├── behavior-compliance.yaml  # AI 行为合规检查结果
  │       │   ├── results.yaml              # 执行结果
  │       │   ├── evidence/                 # 执行证据
  │       │   │   ├── *.log                 # 执行日志
  │       │   │   ├── *.png                 # 截图
  │       │   │   └── network-trace.json    # 网络追踪
  │       │   └── tse.yaml                  # TSE 汇总
  │       └── ...
  └── bugs/
      ├── BUG-2026-XXXX.yaml
      └── ...
