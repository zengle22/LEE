# Test Plan Execution Workflow v1.0
# L3 - 执行 Test Plan 工作流

kind: workflow
version: 1.0

# ============================================
# 基础标识
# ============================================
id: workflow.qa.test_plan_execution_v1
name: Test Plan Execution
description: >
  L3 级别 Test Plan 执行工作流，执行完整的测试批次：
  - 初始化 Test Run，绑定构建和环境
  - 准备测试环境，部署待测版本
  - 根据 Test Set 策略动态生成用例
  - 翻译用例为可执行脚本
  - 执行测试脚本，收集结果
  - 组装 TSE，起草 Bug
  - 出测评估

owner: qa-governance
tags: [workflow, L3, test-plan, test-run, execution, qa]

# ============================================
# 参数定义
# ============================================
params:
  test_plan_id:
    type: string
    required: true
    description: "Test Plan ID"

  build_version:
    type: string
    required: true
    description: "构建版本号"

  build_commit:
    type: string
    required: true
    description: "构建 commit hash"

  environment:
    type: string
    required: false
    default: "test"
    description: "测试环境名称"

# ============================================
# 契约定义
# ============================================
contracts:
  inputs:
    - test_plan:
        path: "qa/test-plans/{{ params.test_plan_id }}.yaml"
        schema: ../../contracts/test-plan-v2/v1/schema.yaml
        description: "Test Plan 定义"

    - test_sets:
        path: "qa/test-sets/"
        description: "Test Set 设计资产目录"

  outputs:
    - test_run:
        path: "qa/test-runs/{{ runtime.test_run_id }}/test-run.yaml"
        schema: ../../contracts/test-run/v1/schema.yaml
        description: "Test Run 记录"

    - tse_bundle:
        path: "qa/test-runs/{{ runtime.test_run_id }}/"
        description: "Test Set Execution 文件目录"

    - bugs:
        path: "qa/bugs/"
        description: "Bug 文件目录"

# ============================================
# 运行时变量
# ============================================
runtime:
  test_run_id:
    type: string
    description: "生成的 Test Run ID"
    generator: "TR-{{ now | date: '%Y-%m-%d' }}-{{ random_suffix }}"

  current_test_set:
    type: string
    description: "当前执行的 Test Set ID"

# ============================================
# 状态机定义
# ============================================
state_machine:
  states:
    - INIT: "初始化"
    - TEST_RUN_INIT: "Test Run 初始化"
    - ENV_PROVISION: "测试环境准备"
    - CASE_GENERATION: "用例生成"
    - SCRIPT_TRANSLATION: "脚本翻译"
    - SCRIPT_EXECUTION: "脚本执行"
    - TSE_ASSEMBLY: "TSE 组装"
    - BUG_DRAFTING: "Bug 起草"
    - EXIT_EVALUATION: "出测评估"
    - COMPLETED: "完成"
    - FAILED: "失败"

  transitions:
    INIT:
      - to: TEST_RUN_INIT
        trigger: "workflow_started"

    TEST_RUN_INIT:
      - to: ENV_PROVISION
        trigger: "test_run_created"
      - to: FAILED
        trigger: "test_plan_not_found"

    ENV_PROVISION:
      - to: CASE_GENERATION
        trigger: "env_ready"
      - to: FAILED
        trigger: "env_provision_failed"

    CASE_GENERATION:
      - to: SCRIPT_TRANSLATION
        trigger: "cases_generated"
      - to: CASE_GENERATION
        trigger: "cases_rejected"
        note: "用例被拒绝，重新生成"

    SCRIPT_TRANSLATION:
      - to: SCRIPT_EXECUTION
        trigger: "scripts_ready"
      - to: FAILED
        trigger: "translation_failed"

    SCRIPT_EXECUTION:
      - to: TSE_ASSEMBLY
        trigger: "execution_completed"
      - to: FAILED
        trigger: "execution_failed"

    TSE_ASSEMBLY:
      - to: BUG_DRAFTING
        trigger: "tse_assembled"
        condition: "has_failures"
      - to: EXIT_EVALUATION
        trigger: "tse_assembled"
        condition: "no_failures"

    BUG_DRAFTING:
      - to: EXIT_EVALUATION
        trigger: "bugs_confirmed"
      - to: BUG_DRAFTING
        trigger: "bugs_rejected"

    EXIT_EVALUATION:
      - to: COMPLETED
        trigger: "exit_pass"
      - to: COMPLETED
        trigger: "exit_conditional_pass"
      - to: COMPLETED
        trigger: "exit_fail"
        note: "即使不通过也完成，记录结论"

# ============================================
# 阶段定义
# ============================================
stages:
  # ========== Stage 1: Test Run 初始化 ==========
  - id: s1_test_run_init
    name: "Test Run 初始化"
    description: "创建 Test Run 对象，关联 Test Plan"
    state: TEST_RUN_INIT

    steps:
      - id: s1_1_load_test_plan
        name: "加载 Test Plan"
        run: skill.file.read
        inputs:
          - path: "qa/test-plans/{{ params.test_plan_id }}.yaml"
        outputs:
          - var: "test_plan"

      - id: s1_2_create_test_run
        name: "创建 Test Run"
        run: agent.qa.test_run_initializer
        inputs:
          - test_plan: "$outputs.s1_1_load_test_plan"
          - build_version: "{{ params.build_version }}"
          - build_commit: "{{ params.build_commit }}"
          - environment: "{{ params.environment }}"
        outputs:
          - path: "qa/test-runs/{{ runtime.test_run_id }}/test-run.yaml"
            schema: ../../contracts/test-run/v1/schema.yaml
          - var: "test_run"
            trigger: test_run_created

  # ========== Stage 2: 测试环境准备 ==========
  - id: s2_env_provision
    name: "测试环境准备"
    description: "准备测试环境，部署待测版本"
    state: ENV_PROVISION

    steps:
      - id: s2_1_provision_env
        name: "部署测试环境"
        run: agent.qa.env_provisioner
        inputs:
          - test_run: "$outputs.s1_2_create_test_run.test_run"
          - build_version: "{{ params.build_version }}"
          - build_commit: "{{ params.build_commit }}"
          - environment: "{{ params.environment }}"
        outputs:
          - var: "environment_info"
          - path: "qa/test-runs/{{ runtime.test_run_id }}/env-health.yaml"

      - id: s2_2_health_check
        name: "环境健康检查"
        gate:
          type: auto_check
          check: "environment_info.status == 'healthy'"
          on_pass:
            trigger: env_ready
          on_fail:
            trigger: env_provision_failed
            action: fail_workflow
            message: "测试环境不健康，无法继续"

  # ========== Stage 3: 用例生成 ==========
  - id: s3_case_generation
    name: "用例生成"
    description: "根据 Test Set 策略动态生成测试用例"
    state: CASE_GENERATION
    loop:
      over: "$outputs.s1_1_load_test_plan.test_sets"
      as: "current_test_set"

    steps:
      - id: s3_1_load_test_set
        name: "加载 Test Set"
        run: skill.file.read
        inputs:
          - path: "qa/test-sets/{{ current_test_set.test_set_id }}.yaml"
        outputs:
          - var: "test_set_def"

      - id: s3_2_generate_cases
        name: "生成用例"
        run: agent.qa.case_generator
        inputs:
          - test_set: "$outputs.s3_1_load_test_set"
          - build_context:
              version: "{{ params.build_version }}"
              changed_areas: "$outputs.s1_2_create_test_run.test_run.build.changed_areas"
        outputs:
          - path: "qa/test-runs/{{ runtime.test_run_id }}/tse-{{ current_test_set.test_set_id | slugify }}/cases.yaml"
          - var: "generated_cases"

      - id: s3_3_review_cases
        name: "人工审核用例"
        gate:
          type: human_review
          prompt: "请审核生成的测试用例"
          artifacts:
            - "qa/test-runs/{{ runtime.test_run_id }}/tse-{{ current_test_set.test_set_id | slugify }}/cases.yaml"
          on_approve:
            trigger: cases_generated
          on_reject:
            trigger: cases_rejected
            action: retry_step
            retry_step: s3_2_generate_cases

  # ========== Stage 4: 脚本翻译 ==========
  - id: s4_script_translation
    name: "脚本翻译"
    description: "将用例翻译成可执行脚本"
    state: SCRIPT_TRANSLATION
    loop:
      over: "$outputs.s1_1_load_test_plan.test_sets"
      as: "current_test_set"

    steps:
      - id: s4_1_translate_scripts
        name: "翻译脚本"
        run: agent.qa.script_translator
        inputs:
          - generated_cases: "$loop_outputs.s3_2_generate_cases[current_test_set.test_set_id]"
          - environment: "$outputs.s2_1_provision_env.environment_info"
          - test_set: "$loop_outputs.s3_1_load_test_set[current_test_set.test_set_id]"
        outputs:
          - path: "qa/test-runs/{{ runtime.test_run_id }}/tse-{{ current_test_set.test_set_id | slugify }}/scripts/"
          - var: "test_scripts"

      - id: s4_2_validate_scripts
        name: "脚本语法校验"
        gate:
          type: script_validation
          scripts_dir: "qa/test-runs/{{ runtime.test_run_id }}/tse-{{ current_test_set.test_set_id | slugify }}/scripts/"
          on_pass:
            trigger: scripts_ready
          on_fail:
            trigger: translation_failed

  # ========== Stage 5: 脚本执行 ==========
  - id: s5_script_execution
    name: "脚本执行"
    description: "执行测试脚本，收集结果"
    state: SCRIPT_EXECUTION
    loop:
      over: "$outputs.s1_1_load_test_plan.test_sets"
      as: "current_test_set"

    steps:
      - id: s5_1_execute_scripts
        name: "执行脚本"
        run: agent.qa.script_executor
        inputs:
          - test_scripts: "$loop_outputs.s4_1_translate_scripts[current_test_set.test_set_id]"
          - environment: "$outputs.s2_1_provision_env.environment_info"
        outputs:
          - path: "qa/test-runs/{{ runtime.test_run_id }}/tse-{{ current_test_set.test_set_id | slugify }}/results.yaml"
          - path: "qa/test-runs/{{ runtime.test_run_id }}/tse-{{ current_test_set.test_set_id | slugify }}/evidence/"
          - var: "execution_results"
          - var: "failures"
          trigger: execution_completed

  # ========== Stage 6: TSE 组装 ==========
  - id: s6_tse_assembly
    name: "TSE 组装"
    description: "组装 Test Set Execution，汇总用例+脚本+结果"
    state: TSE_ASSEMBLY
    loop:
      over: "$outputs.s1_1_load_test_plan.test_sets"
      as: "current_test_set"

    steps:
      - id: s6_1_assemble_tse
        name: "组装 TSE"
        run: agent.qa.tse_assembler
        inputs:
          - test_set_id: "{{ current_test_set.test_set_id }}"
          - test_run_id: "{{ runtime.test_run_id }}"
          - generated_cases: "$loop_outputs.s3_2_generate_cases[current_test_set.test_set_id]"
          - test_scripts: "$loop_outputs.s4_1_translate_scripts[current_test_set.test_set_id]"
          - execution_results: "$loop_outputs.s5_1_execute_scripts[current_test_set.test_set_id].execution_results"
          - failures: "$loop_outputs.s5_1_execute_scripts[current_test_set.test_set_id].failures"
        outputs:
          - path: "qa/test-runs/{{ runtime.test_run_id }}/tse-{{ current_test_set.test_set_id | slugify }}/tse.yaml"
            schema: ../../contracts/test-set-execution/v1/schema.yaml
          - var: "tse"
          trigger: tse_assembled

  # ========== Stage 7: Bug 起草 ==========
  - id: s7_bug_drafting
    name: "Bug 起草"
    description: "对失败用例起草 Bug"
    state: BUG_DRAFTING
    condition: "any(loop_outputs.s5_1_execute_scripts.*.failures)"

    steps:
      - id: s7_1_draft_bugs
        name: "起草 Bug"
        run: agent.qa.bug_drafter
        inputs:
          - failures: "$all_failures"
          - tse_list: "$loop_outputs.s6_1_assemble_tse"
        outputs:
          - path: "qa/bugs/"
            description: "Bug 文件目录"
          - var: "draft_bugs"

      - id: s7_2_review_bugs
        name: "人工确认 Bug"
        gate:
          type: human_review
          prompt: "请审核 Bug 草稿，确认后将正式创建"
          artifacts:
            - "qa/bugs/"
          on_approve:
            trigger: bugs_confirmed
          on_reject:
            trigger: bugs_rejected
            action: retry_step
            retry_step: s7_1_draft_bugs

  # ========== Stage 8: 出测评估 ==========
  - id: s8_exit_evaluation
    name: "出测评估"
    description: "检查是否满足出测条件"
    state: EXIT_EVALUATION

    steps:
      - id: s8_1_update_test_run
        name: "更新 Test Run 汇总"
        run: agent.qa.test_run_updater
        inputs:
          - test_run_path: "qa/test-runs/{{ runtime.test_run_id }}/test-run.yaml"
          - tse_list: "$loop_outputs.s6_1_assemble_tse"
          - bugs: "$outputs.s7_1_draft_bugs.draft_bugs"
        outputs:
          - path: "qa/test-runs/{{ runtime.test_run_id }}/test-run.yaml"
          - var: "updated_test_run"

      - id: s8_2_evaluate_exit
        name: "评估出测条件"
        run: agent.qa.exit_evaluator
        inputs:
          - test_run: "$outputs.s8_1_update_test_run.updated_test_run"
          - test_plan: "$outputs.s1_1_load_test_plan"
          - all_tse: "$loop_outputs.s6_1_assemble_tse"
          - all_bugs: "$outputs.s7_1_draft_bugs.draft_bugs"
        outputs:
          - var: "exit_decision"
          - var: "blocking_reasons"
          - path: "qa/test-runs/{{ runtime.test_run_id }}/exit-evaluation.yaml"

      - id: s8_3_human_decision
        name: "人工最终决策"
        gate:
          type: human_decision
          prompt: "请确认出测评估结果"
          context:
            decision: "$outputs.s8_2_evaluate_exit.exit_decision"
            blocking_reasons: "$outputs.s8_2_evaluate_exit.blocking_reasons"
          artifacts:
            - "qa/test-runs/{{ runtime.test_run_id }}/test-run.yaml"
            - "qa/test-runs/{{ runtime.test_run_id }}/exit-evaluation.yaml"
          options:
            - label: "通过"
              trigger: exit_pass
            - label: "有条件通过"
              trigger: exit_conditional_pass
            - label: "不通过，需要下一轮"
              trigger: exit_fail

# ============================================
# 门禁配置
# ============================================
gates:
  env_health_check:
    type: auto
    timeout: 10m

  human_review_cases:
    type: human
    timeout: 24h
    required_approvers:
      - role: qa

  human_review_bugs:
    type: human
    timeout: 24h
    required_approvers:
      - role: qa

  human_exit_decision:
    type: human
    timeout: 48h
    required_approvers:
      - role: qa_lead
      - role: pm

# ============================================
# 产出目录结构
# ============================================
output_structure: |
  qa/
  ├── test-runs/
  │   └── {test_run_id}/
  │       ├── test-run.yaml           # Test Run 记录
  │       ├── env-health.yaml         # 环境健康检查
  │       ├── exit-evaluation.yaml    # 出测评估
  │       ├── tse-{test_set_id}/
  │       │   ├── cases.yaml          # 生成的用例
  │       │   ├── scripts/            # 翻译的脚本
  │       │   ├── results.yaml        # 执行结果
  │       │   ├── evidence/           # 执行证据
  │       │   └── tse.yaml            # TSE 汇总
  │       └── ...
  └── bugs/
      ├── BUG-2026-0031.yaml
      └── ...
