# Test Set Production Workflow v1.0
# L3 - 生产 Test Set 设计资产工作流

kind: workflow
version: 1.0

# ============================================
# 基础标识
# ============================================
id: workflow.qa.test_set_production_v1
name: Test Set Production
description: >
  L3 级别 Test Set 生产工作流，将模块需求转化为 Test Set 设计资产：
  - 分析需求文档，提取可测试特性
  - 设计测试策略和风险区域
  - 生成标准化 Test Set YAML
  - 审评完整性和可执行性

owner: qa-governance
tags: [workflow, L3, test-set, design-asset, qa]

# ============================================
# 角色地图（Role Map）
# ============================================
# 参见 core/constitution.yaml → execution_taxonomy
roles:
  agents:
    - agent.qa.requirement_analyzer    # LLM：分析需求文档
    - agent.qa.test_strategist         # LLM：设计测试策略
    - agent.qa.test_set_generator      # LLM：生成 Test Set
    - agent.qa.test_set_reviewer       # LLM：审评 Test Set
  skills:
    - skill.file.read                  # 程序：加载需求/技术文档
  gates:
    - gate.qa.analysis_review          # 人类：审核分析结果
    - gate.qa.strategy_review          # 人类：审核测试策略
    - gate.qa.test_set_approval        # 人类：最终批准 Test Set

# ============================================
# 参数定义
# ============================================
params:
  module:
    type: string
    required: true
    description: "模块名称"

  requirement_doc:
    type: string
    required: true
    description: "需求文档路径"

  tech_design:
    type: string
    required: false
    description: "技术设计文档路径（可选）"

# ============================================
# 契约定义
# ============================================
contracts:
  inputs:
    - requirement_doc:
        path: "{{ params.requirement_doc }}"
        description: "需求文档（PRD / User Story）"

    - tech_design:
        path: "{{ params.tech_design }}"
        optional: true
        description: "技术设计文档"

  outputs:
    - test_set:
        path: "qa/test-sets/ts-{{ params.module | slugify }}.yaml"
        schema: ../../contracts/test-set/v1/schema.yaml
        description: "生成的 Test Set 设计资产"

    - analysis_report:
        path: "qa/test-sets/ts-{{ params.module | slugify }}/analysis.md"
        description: "需求分析报告"

    - strategy_draft:
        path: "qa/test-sets/ts-{{ params.module | slugify }}/strategy-draft.yaml"
        description: "测试策略草稿"

# ============================================
# 状态机定义
# ============================================
state_machine:
  states:
    - INIT: "初始化"
    - REQUIREMENT_ANALYSIS: "需求分析"
    - STRATEGY_DESIGN: "测试策略设计"
    - TEST_SET_GENERATION: "Test Set 生成"
    - TEST_SET_REVIEW: "Test Set 审评"
    - COMPLETED: "完成"
    - FAILED: "失败"

  transitions:
    INIT:
      - to: REQUIREMENT_ANALYSIS
        trigger: "workflow_started"

    REQUIREMENT_ANALYSIS:
      - to: STRATEGY_DESIGN
        trigger: "analysis_approved"
      - to: REQUIREMENT_ANALYSIS
        trigger: "analysis_rejected"
        note: "分析被拒绝，重新分析"
      - to: FAILED
        trigger: "doc_invalid"

    STRATEGY_DESIGN:
      - to: TEST_SET_GENERATION
        trigger: "strategy_approved"
      - to: STRATEGY_DESIGN
        trigger: "strategy_rejected"
        note: "策略被拒绝，重新设计"

    TEST_SET_GENERATION:
      - to: TEST_SET_REVIEW
        trigger: "test_set_generated"
      - to: FAILED
        trigger: "generation_failed"

    TEST_SET_REVIEW:
      - to: COMPLETED
        trigger: "test_set_approved"
      - to: TEST_SET_GENERATION
        trigger: "test_set_rejected"
        note: "Test Set 被拒绝，重新生成"

# ============================================
# 阶段定义
# ============================================
stages:
  # ========== Stage 1: 需求分析 ==========
  - id: s1_requirement_analysis
    name: "需求分析"
    description: "理解模块功能边界和测试重点"
    state: REQUIREMENT_ANALYSIS

    steps:
      - id: s1_1_load_docs
        name: "加载需求文档"
        run: skill.file.read
        inputs:
          - path: "{{ params.requirement_doc }}"
        outputs:
          - path: "runtime/requirement_content.md"

      - id: s1_2_load_tech_design
        name: "加载技术设计（可选）"
        run: skill.file.read
        condition: "params.tech_design != null"
        inputs:
          - path: "{{ params.tech_design }}"
        outputs:
          - path: "runtime/tech_design_content.md"

      - id: s1_3_analyze_requirements
        name: "分析需求文档"
        run: agent.qa.requirement_analyzer
        inputs:
          - requirement_content: "$outputs.s1_1_load_docs"
          - tech_design_content: "$outputs.s1_2_load_tech_design"
        outputs:
          - path: "runtime/module_boundary.yaml"
            description: "模块边界定义"
          - path: "runtime/testable_features.yaml"
            description: "可测试特性列表"
          - path: "qa/test-sets/ts-{{ params.module | slugify }}/analysis.md"
            description: "分析报告"

      - id: s1_4_review_analysis
        name: "人工审核分析结果"
        gate:
          type: human_review
          prompt: "请审核需求分析结果，确认模块边界和可测试特性"
          artifacts:
            - "runtime/module_boundary.yaml"
            - "runtime/testable_features.yaml"
            - "qa/test-sets/ts-{{ params.module | slugify }}/analysis.md"
          on_approve:
            trigger: analysis_approved
          on_reject:
            trigger: analysis_rejected
            action: retry_step
            retry_step: s1_3_analyze_requirements

  # ========== Stage 2: 测试策略设计 ==========
  - id: s2_strategy_design
    name: "测试策略设计"
    description: "确定测试策略、重点和风险区域"
    state: STRATEGY_DESIGN

    steps:
      - id: s2_1_design_strategy
        name: "设计测试策略"
        run: agent.qa.test_strategist
        inputs:
          - module_boundary: "$outputs.s1_3_analyze_requirements.module_boundary"
          - testable_features: "$outputs.s1_3_analyze_requirements.testable_features"
        outputs:
          - path: "runtime/test_strategy.yaml"
            description: "测试策略"
          - path: "runtime/risk_areas.yaml"
            description: "风险区域"
          - path: "runtime/test_focus.yaml"
            description: "测试重点"
          - path: "qa/test-sets/ts-{{ params.module | slugify }}/strategy-draft.yaml"
            description: "策略草稿"

      - id: s2_2_review_strategy
        name: "人工审核测试策略"
        gate:
          type: human_review
          prompt: "请审核测试策略，确认测试重点和风险区域"
          artifacts:
            - "qa/test-sets/ts-{{ params.module | slugify }}/strategy-draft.yaml"
          on_approve:
            trigger: strategy_approved
          on_reject:
            trigger: strategy_rejected
            action: retry_step
            retry_step: s2_1_design_strategy

  # ========== Stage 3: Test Set 生成 ==========
  - id: s3_test_set_generation
    name: "Test Set 生成"
    description: "生成标准化 Test Set YAML"
    state: TEST_SET_GENERATION

    steps:
      - id: s3_1_generate_test_set
        name: "生成 Test Set"
        run: agent.qa.test_set_generator
        inputs:
          - module: "{{ params.module }}"
          - test_strategy: "$outputs.s2_1_design_strategy.test_strategy"
          - risk_areas: "$outputs.s2_1_design_strategy.risk_areas"
          - test_focus: "$outputs.s2_1_design_strategy.test_focus"
        outputs:
          - path: "qa/test-sets/ts-{{ params.module | slugify }}.yaml"
            schema: ../../contracts/test-set/v1/schema.yaml
            description: "Test Set 设计资产"

      - id: s3_2_validate_schema
        name: "Schema 校验"
        gate:
          type: schema_validation
          schema: ../../contracts/test-set/v1/schema.yaml
          artifact: "qa/test-sets/ts-{{ params.module | slugify }}.yaml"
          on_pass:
            trigger: test_set_generated
          on_fail:
            trigger: generation_failed

  # ========== Stage 4: Test Set 审评 ==========
  - id: s4_test_set_review
    name: "Test Set 审评"
    description: "审评 Test Set 完整性和可执行性"
    state: TEST_SET_REVIEW

    steps:
      - id: s4_1_review_test_set
        name: "审评 Test Set"
        run: agent.qa.test_set_reviewer
        inputs:
          - test_set: "$outputs.s3_1_generate_test_set"
          - requirement_content: "$outputs.s1_1_load_docs"
        outputs:
          - path: "runtime/review_result.yaml"
            description: "审评结果"

      - id: s4_2_human_approval
        name: "人工最终批准"
        gate:
          type: human_approval
          prompt: "请最终确认 Test Set，批准后将正式生效"
          artifacts:
            - "qa/test-sets/ts-{{ params.module | slugify }}.yaml"
            - "runtime/review_result.yaml"
          on_approve:
            trigger: test_set_approved
          on_reject:
            trigger: test_set_rejected
            action: retry_step
            retry_step: s3_1_generate_test_set

# ============================================
# 门禁配置
# ============================================
gates:
  human_review_analysis:
    type: human
    timeout: 24h
    required_approvers:
      - role: qa_lead

  human_review_strategy:
    type: human
    timeout: 24h
    required_approvers:
      - role: qa_lead

  human_approval_final:
    type: human
    timeout: 48h
    required_approvers:
      - role: qa_lead
      - role: pm

# ============================================
# 产出目录结构
# ============================================
output_structure: |
  qa/
  └── test-sets/
      ├── ts-{module}.yaml              # Test Set 设计资产
      └── ts-{module}/
          ├── analysis.md               # 需求分析报告
          └── strategy-draft.yaml       # 测试策略草稿
