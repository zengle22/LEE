# Test Case Design Pipeline v1.0
# 测试用例设计工作流 - 从需求到E2E脚本的完整流程

kind: workflow
version: 1.0

# ============================================
# 基础标识
# ============================================
id: workflow.qa.test_case_design_pipeline
name: Test Case Design Pipeline
description: >
  测试用例设计工作流，从需求对齐到E2E脚本生成的完整流程：
  - 需求对齐：验证PRD、架构文档、UI契约之间的一致性
  - 功能点校准：建立PRD功能点与架构组件、UI页面的映射关系
  - 分支覆盖用例设计：基于用户流程和决策点设计分支测试用例
  - 专项测试用例设计：设计性能、安全、可访问性测试用例
  - 用例评审：人类介入评审测试用例
  - E2E Playwright脚本撰写：基于UI契约和测试用例生成Playwright脚本

owner: qa-design
tags: [workflow, qa, test-design, branch-coverage, e2e, playwright]

# ============================================
# 核心概念
# ============================================
concepts:
  requirement_alignment:
    description: "需求对齐，验证PRD、架构、UI三方一致性"
    attributes:
      - prd_consistency: "PRD需求完整性"
      - architecture_coverage: "架构设计覆盖度"
      - ui_contract_match: "UI契约匹配度"

  feature_calibration:
    description: "功能点校准，建立需求到实现的映射"
    attributes:
      - feature_to_component: "功能点到架构组件映射"
      - feature_to_page: "功能点到UI页面映射"
      - coverage_gaps: "覆盖缺口识别"

  branch_coverage:
    description: "分支覆盖，基于决策点的测试用例设计"
    attributes:
      - decision_points: "决策点识别"
      - user_flows: "用户流程路径"
      - branch_cases: "分支用例集合"

  test_case_review:
    description: "用例评审，人类介入的质量把关"
    attributes:
      - review_criteria: "评审标准"
      - approval_chain: "批准链条"
      - feedback_loop: "反馈循环"

# ============================================
# 契约定义
# ============================================
contracts:
  inputs:
    # PRD契约
    - prd:
        path: "../../../prd/contracts/frozen-detailed-prd-contract/v1/schema.json"
        description: "产品需求文档（冻结版）"
        required: true

    # 技术架构契约
    - technical_architecture:
        path: "../../../dev/contracts/frozen-technical-architecture-contract/v1/schema.json"
        description: "技术架构文档（冻结版）"
        required: true

    # UI原型契约
    - ui_prototype:
        path: "../../../ui/contracts/frozen-ui-prototype-contract/v1/schema.json"
        description: "UI原型设计（冻结版）"
        required: true

    # UI页面契约
    - ui_page:
        path: "../../../ui/contracts/ui-page-contract/v1/schema.yaml"
        description: "UI页面契约"
        required: true

  outputs:
    # 测试用例设计契约
    - test_case_design:
        path: "../../contracts/test-case-design-contract/v1/schema.yaml"
        description: "测试用例设计文档"
        structure: |
          test-case-design/
          ├── requirement-alignment.yaml
          ├── feature-calibration.yaml
          ├── branch-coverage.yaml
          └── specialized-tests.yaml

    # 测试用例契约（最终）
    - test_cases:
        path: "../../contracts/test-case/v1/schema.yaml"
        description: "最终测试用例集合"
        structure: |
          test-cases/
          ├── functional/
          │   ├── smoke/
          │   ├── core-flow/
          │   └── branch-coverage/
          ├── performance/
          ├── security/
          └── accessibility/

    # E2E脚本契约
    - e2e_scripts:
        path: "../../contracts/e2e-script-contract/v1/schema.yaml"
        description: "E2E Playwright脚本契约"
        structure: |
          e2e-scripts/
          ├── playwright/
          │   ├── specs/
          │   ├── helpers/
          │   └── config/
          └── test-data/

# ============================================
# 主流程状态机
# ============================================
state_machine:
  states:
    - INIT: "初始化"
    - INPUT_VALIDATION: "输入验证"
    - REQUIREMENT_ALIGNMENT: "需求对齐"
    - FEATURE_CALIBRATION: "功能点校准"
    - BRANCH_COVERAGE_DESIGN: "分支覆盖设计"
    - SPECIALIZED_TEST_DESIGN: "专项测试设计"
    - TEST_CASE_REVIEW: "用例评审（人类介入）"
    - REVIEW_REVISION: "评审修订"
    - PLAYWRIGHT_GENERATION: "Playwright脚本生成"
    - COMPLETED: "完成"
    - BLOCKED: "阻塞"

  transitions:
    INIT:
      - to: INPUT_VALIDATION
        trigger: "workflow_started"

    INPUT_VALIDATION:
      - to: REQUIREMENT_ALIGNMENT
        trigger: "input_gate_pass"
      - to: BLOCKED
        trigger: "input_gate_fail"
        note: "输入契约不完整或冲突"

    REQUIREMENT_ALIGNMENT:
      - to: FEATURE_CALIBRATION
        trigger: "alignment_completed"
      - to: BLOCKED
        trigger: "alignment_failed"
        note: "需求一致性检查失败，无法继续"

    FEATURE_CALIBRATION:
      - to: BRANCH_COVERAGE_DESIGN
        trigger: "calibration_completed"
      - to: BLOCKED
        trigger: "calibration_failed"
        note: "功能点映射失败"

    BRANCH_COVERAGE_DESIGN:
      - to: SPECIALIZED_TEST_DESIGN
        trigger: "branch_cases_generated"

    SPECIALIZED_TEST_DESIGN:
      - to: TEST_CASE_REVIEW
        trigger: "specialized_cases_generated"

    TEST_CASE_REVIEW:
      - to: PLAYWRIGHT_GENERATION
        trigger: "review_approved"
        note: "人类评审通过"
      - to: REVIEW_REVISION
        trigger: "review_rejected"
        note: "人类评审拒绝，需要修订"

    REVIEW_REVISION:
      - to: TEST_CASE_REVIEW
        trigger: "revision_completed"
        note: "修订完成，重新提交评审"
      - to: BLOCKED
        trigger: "revision_timeout"
        note: "修订超时"

    PLAYWRIGHT_GENERATION:
      - to: COMPLETED
        trigger: "scripts_generated"

    COMPLETED: []
    BLOCKED: []

# ============================================
# 流程步骤定义
# ============================================
stages:
  # ========== Stage 1: 输入验证 ==========
  - id: s1_input_validation
    name: "输入验证"
    description: "验证所有输入契约的完整性和一致性"
    steps:
      - id: s1_1_validate_inputs
        name: "验证输入契约"
        run: agent.qa.requirement_alignment_agent
        inputs:
          - prd: "$inputs.prd"
          - technical_architecture: "$inputs.technical_architecture"
          - ui_prototype: "$inputs.ui_prototype"
          - ui_page: "$inputs.ui_page"
        outputs:
          - path: "validation/input-validation-report.yaml"
        gate:
          ref: gate.qa.design_input_gate
          on_fail:
            action: block_and_report
            state: BLOCKED

  # ========== Stage 2: 需求对齐 ==========
  - id: s2_requirement_alignment
    name: "需求对齐"
    description: "验证PRD、架构文档、UI契约之间的一致性"
    steps:
      - id: s2_1_validate_consistency
        name: "验证三方一致性"
        run: agent.qa.requirement_alignment_agent
        inputs:
          - prd: "$inputs.prd"
          - technical_architecture: "$inputs.technical_architecture"
          - ui_prototype: "$inputs.ui_prototype"
          - ui_page: "$inputs.ui_page"
        outputs:
          - path: "test-case-design/requirement-alignment.yaml"
            include:
              - consistency_matrix: "三方一致性矩阵"
              - gaps_identified: "识别的缺口"
              - recommendations: "修复建议"

      - id: s2_2_resolve_conflicts
        name: "解决冲突"
        type: conditional
        condition: "consistency_matrix.conflicts > 0"
        run: agent.qa.requirement_alignment_agent
        inputs:
          - conflicts: "$s2_1_validate_consistency.consistency_matrix.conflicts"
        outputs:
          - path: "test-case-design/conflict-resolution.yaml"
        on_failure:
          action: escalate_to_human

  # ========== Stage 3: 功能点校准 ==========
  - id: s3_feature_calibration
    name: "功能点校准"
    description: "建立PRD功能点与架构组件、UI页面的映射关系"
    steps:
      - id: s3_1_extract_features
        name: "提取功能点"
        run: agent.qa.feature_calibration_agent
        inputs:
          - prd: "$inputs.prd"
        outputs:
          - path: "test-case-design/feature-list.yaml"

      - id: s3_2_map_to_components
        name: "映射到架构组件"
        run: agent.qa.feature_calibration_agent
        inputs:
          - features: "$s3_1_extract_features.feature_list"
          - technical_architecture: "$inputs.technical_architecture"
        outputs:
          - path: "test-case-design/feature-to-component-mapping.yaml"

      - id: s3_3_map_to_pages
        name: "映射到UI页面"
        run: agent.qa.feature_calibration_agent
        skill: skill.qa.ui_contract_analyzer
        inputs:
          - features: "$s3_1_extract_features.feature_list"
          - ui_page: "$inputs.ui_page"
        outputs:
          - path: "test-case-design/feature-to-page-mapping.yaml"

      - id: s3_4_generate_calibration_report
        name: "生成校准报告"
        run: agent.qa.feature_calibration_agent
        inputs:
          - feature_list: "$s3_1_extract_features.feature_list"
          - component_mapping: "$s3_2_map_to_components.mapping"
          - page_mapping: "$s3_3_map_to_pages.mapping"
        outputs:
          - path: "test-case-design/feature-calibration.yaml"
          include:
            - coverage_matrix: "覆盖矩阵"
            - uncovered_features: "未覆盖功能点"
            - orphan_components: "孤立组件（无功能点对应）"
            - orphan_pages: "孤立页面（无功能点对应）"

  # ========== Stage 4: 分支覆盖用例设计 ==========
  - id: s4_branch_coverage
    name: "分支覆盖用例设计"
    description: "基于用户流程和决策点设计分支测试用例"
    steps:
      - id: s4_1_identify_user_flows
        name: "识别用户流程"
        run: agent.qa.branch_coverage_agent
        inputs:
          - prd: "$inputs.prd"
          - feature_calibration: "$s3_4_generate_calibration_report.calibration_report"
        outputs:
          - path: "test-case-design/user-flows.yaml"

      - id: s4_2_identify_decision_points
        name: "识别决策点"
        run: agent.qa.branch_coverage_agent
        skill: skill.qa.branch_coverage_analyzer
        inputs:
          - user_flows: "$s4_1_identify_user_flows.flows"
          - ui_page: "$inputs.ui_page"
        outputs:
          - path: "test-case-design/decision-points.yaml"
          include:
            - decision_tree: "决策树"
            - branch_paths: "分支路径"
            - edge_cases: "边界情况"

      - id: s4_3_design_branch_cases
        name: "设计分支用例"
        run: agent.qa.branch_coverage_agent
        inputs:
          - decision_points: "$s4_2_identify_decision_points.points"
          - branch_paths: "$s4_2_identify_decision_points.paths"
        outputs:
          - path: "test-cases/functional/branch-coverage/"
          format: yaml
          structure: |
            branch-coverage/
            ├── flow-{flow_id}/
            │   ├── main-path.yaml
            │   ├── branch-{branch_id}.yaml
            │   └── edge-cases.yaml

  # ========== Stage 5: 专项测试用例设计 ==========
  - id: s5_specialized_tests
    name: "专项测试用例设计"
    description: "设计性能、安全、可访问性测试用例"
    steps:
      - id: s5_1_performance_tests
        name: "性能测试用例"
        run: agent.qa.specialized_test_agent
        inputs:
          - technical_architecture: "$inputs.technical_architecture"
          - feature_calibration: "$s3_4_generate_calibration_report.calibration_report"
          - prd: "$inputs.prd"
        outputs:
          - path: "test-cases/performance/"
          include:
            - load_tests: "负载测试"
            - stress_tests: "压力测试"
            - latency_tests: "延迟测试"
            - scalability_tests: "扩展性测试"

      - id: s5_2_security_tests
        name: "安全测试用例"
        run: agent.qa.specialized_test_agent
        inputs:
          - technical_architecture: "$inputs.technical_architecture"
          - feature_calibration: "$s3_4_generate_calibration_report.calibration_report"
        outputs:
          - path: "test-cases/security/"
          include:
            - authentication: "认证测试"
            - authorization: "授权测试"
            - injection_attacks: "注入攻击测试"
            - data_protection: "数据保护测试"
            - owasp_top10: "OWASP Top 10测试"

      - id: s5_3_accessibility_tests
        name: "可访问性测试用例"
        run: agent.qa.specialized_test_agent
        inputs:
          - ui_page: "$inputs.ui_page"
          - ui_prototype: "$inputs.ui_prototype"
        outputs:
          - path: "test-cases/accessibility/"
          include:
            - wcag_compliance: "WCAG合规性测试"
            - screen_reader: "屏幕阅读器测试"
            - keyboard_navigation: "键盘导航测试"
            - color_contrast: "颜色对比度测试"
            - alt_text: "替代文本测试"

      - id: s5_4_assemble_specialized_report
        name: "汇总专项测试报告"
        run: agent.qa.specialized_test_agent
        inputs:
          - performance_tests: "$s5_1_performance_tests.cases"
          - security_tests: "$s5_2_security_tests.cases"
          - accessibility_tests: "$s5_3_accessibility_tests.cases"
        outputs:
          - path: "test-case-design/specialized-tests.yaml"

  # ========== Stage 6: 用例评审（人类介入）==========
  - id: s6_test_case_review
    name: "用例评审"
    description: "人类介入评审测试用例，确保质量和覆盖度"
    type: human_in_the_loop
    steps:
      - id: s6_1_prepare_review_package
        name: "准备评审包"
        run: agent.qa.feature_calibration_agent
        inputs:
          - requirement_alignment: "$s2_1_validate_consistency.alignment_report"
          - feature_calibration: "$s3_4_generate_calibration_report.calibration_report"
          - branch_coverage: "$s4_3_design_branch_cases.cases"
          - specialized_tests: "$s5_4_assemble_specialized_report.report"
        outputs:
          - path: "review/test-case-review-package.yaml"
          include:
            - summary: "评审摘要"
            - test_case_inventory: "用例清单"
            - coverage_metrics: "覆盖指标"
            - risk_assessment: "风险评估"

      - id: s6_2_human_review
        name: "人类评审"
        type: human_decision
        human_gate: test_case_review_gate
        required_approvers:
          - role: qa_lead
            required: true
          - role: tech_lead
            required: false
          - role: pm
            required: false
        inputs_to_review:
          - "review/test-case-review-package.yaml"
          - "test-cases/"
          - "test-case-design/"
        review_criteria:
          - coverage_completeness: "覆盖度完整性 >= 90%"
          - case_quality: "用例质量评分 >= 8/10"
          - traceability: "需求可追溯性 100%"
          - risk_mitigation: "高风险点覆盖 100%"
        on_approve:
          action: proceed_to_generation
          outputs:
            - path: "review/test-case-review-approval.yaml"
        on_reject:
          action: request_revision
          outputs:
            - path: "review/test-case-review-feedback.yaml"
            include:
              - feedback_items: "反馈项列表"
              - required_changes: "必需修改"
              - revision_deadline: "修订截止时间"

      - id: s6_3_incorporate_feedback
        name: "融入反馈"
        type: conditional
        condition: "review_status == 'rejected'"
        run: agent.qa.feature_calibration_agent
        inputs:
          - feedback: "$s6_2_human_review.feedback"
          - current_cases: "$s6_1_prepare_review_package.cases"
        outputs:
          - path: "test-cases/revised/"
        gate:
          ref: gate.qa.test_case_review_gate

  # ========== Stage 7: E2E Playwright脚本生成 ==========
  - id: s7_playwright_generation
    name: "E2E Playwright脚本生成"
    description: "基于UI契约和测试用例生成Playwright脚本"
    steps:
      - id: s7_1_generate_playwright_specs
        name: "生成Playwright测试规范"
        run: agent.qa.playwright_script_generator
        skill: skill.qa.playwright_code_generator
        inputs:
          - test_cases: "$s6_1_prepare_review_package.approved_cases"
          - ui_page: "$inputs.ui_page"
          - ui_prototype: "$inputs.ui_prototype"
        outputs:
          - path: "e2e-scripts/playwright/specs/"
          format: typescript
          structure: |
            specs/
            ├── smoke/
            │   ├── core-flow.spec.ts
            │   └── authentication.spec.ts
            ├── functional/
            │   ├── feature-{feature-id}.spec.ts
            │   └── branch-coverage/
            │       └── flow-{flow-id}.spec.ts
            └── specialized/
                ├── performance.spec.ts
                ├── security.spec.ts
                └── accessibility.spec.ts

      - id: s7_2_generate_helpers
        name: "生成辅助函数"
        run: agent.qa.playwright_script_generator
        skill: skill.qa.playwright_code_generator
        inputs:
          - ui_page: "$inputs.ui_page"
          - common_patterns: "extracted_from_test_cases"
        outputs:
          - path: "e2e-scripts/playwright/helpers/"
          structure: |
            helpers/
            ├── page-objects.ts
            ├── api-helpers.ts
            ├── test-data-helpers.ts
            └── assertion-helpers.ts

      - id: s7_3_generate_config
        name: "生成配置文件"
        run: agent.qa.playwright_script_generator
        inputs:
          - test_environments: "$inputs.technical_architecture.environments"
        outputs:
          - path: "e2e-scripts/playwright/config/"
          structure: |
            config/
            ├── playwright.config.ts
            ├── environments.ts
            └── test-config.ts

      - id: s7_4_generate_test_data
        name: "生成测试数据"
        run: agent.qa.playwright_script_generator
        inputs:
          - test_cases: "$s6_1_prepare_review_package.approved_cases"
          - data_requirements: "extracted_from_cases"
        outputs:
          - path: "e2e-scripts/test-data/"
          structure: |
            test-data/
            ├── users.json
            ├── scenarios.json
            └── edge-cases.json

      - id: s7_5_validate_scripts
        name: "验证脚本质量"
        run: agent.qa.playwright_script_generator
        inputs:
          - specs: "$s7_1_generate_playwright_specs.specs"
          - helpers: "$s7_2_generate_helpers.helpers"
          - config: "$s7_3_generate_config.config"
        outputs:
          - path: "e2e-scripts/validation-report.yaml"
          include:
            - syntax_check: "语法检查"
            - best_practices: "最佳实践检查"
            - maintainability_index: "可维护性指数"
            - coverage_estimation: "覆盖度估算"

      - id: s7_6_generate_documentation
        name: "生成文档"
        run: agent.qa.playwright_script_generator
        inputs:
          - all_scripts: "e2e-scripts/"
        outputs:
          - path: "e2e-scripts/README.md"
          include:
            - setup_instructions: "设置说明"
            - execution_guide: "执行指南"
            - troubleshooting: "故障排除"
            - script_inventory: "脚本清单"

  # ========== Stage 8: 产物归档 ==========
  - id: s8_artifact_freeze
    name: "产物归档"
    description: "冻结所有产物，准备交付"
    steps:
      - id: s8_1_create_delivery_package
        name: "创建交付包"
        run: agent.qa.feature_calibration_agent
        inputs:
          - test_case_design: "test-case-design/"
          - test_cases: "test-cases/"
          - e2e_scripts: "e2e-scripts/"
          - review_artifacts: "review/"
        outputs:
          - path: "delivery/test-case-design-package/"
          structure: |
            test-case-design-package/
            ├── README.md
            ├── test-case-design/
            ├── test-cases/
            ├── e2e-scripts/
            ├── review/
            └── delivery-manifest.yaml

      - id: s8_2_generate_metrics
        name: "生成指标报告"
        run: agent.qa.feature_calibration_agent
        inputs:
          - all_artifacts: "delivery/test-case-design-package/"
        outputs:
          - path: "delivery/metrics.yaml"
          include:
            - total_test_cases: "总用例数"
            - coverage_percentage: "覆盖百分比"
            - branch_coverage_count: "分支用例数"
            - automated_count: "可自动化用例数"
            - automation_rate: "自动化率"
            - estimated_execution_time: "预计执行时间"

# ============================================
# 门禁规则
# ============================================
gates:
  design_input_gate:
    ref: ../../gates/design-input-gate/v1/gate.yaml

  test_case_review_gate:
    ref: ../../gates/test-case-review-gate/v1/gate.yaml

# ============================================
# 人类介入定义
# ============================================
human_in_the_loop:
  test_case_review:
    stage: s6_test_case_review
    step: s6_2_human_review
    type: approval
    timeout: 72h
    escalation:
      - after: 24h
        notify: qa_lead
      - after: 48h
        notify: [qa_lead, tech_lead, pm]
    approval_criteria:
      - coverage_completeness:
          threshold: 90
          metric: "feature_coverage_percentage"
          description: "功能覆盖度必须达到90%以上"
      - case_quality:
          threshold: 8
          metric: "average_case_quality_score"
          scale: 1-10
          description: "用例质量平均分必须达到8分以上"
      - traceability:
          threshold: 100
          metric: "requirement_traceability_percentage"
          description: "需求可追溯性必须达到100%"
    approval_chain:
      - role: qa_lead
        required: true
        approval_type: required
      - role: tech_lead
        required: false
        approval_type: optional
      - role: pm
        required: false
        approval_type: optional
    feedback_format:
      feedback_items:
        - category: "问题类别（coverage/quality/traceability/other）"
        - severity: "严重程度（critical/major/minor）"
        - description: "问题描述"
        - affected_cases: "受影响的用例ID列表"
        - suggested_fix: "建议修复方案"
      required_changes:
        - case_id: "用例ID"
        - change_type: "变更类型（add/modify/delete）"
        - description: "变更描述"
      revision_deadline: "修订截止时间（ISO 8601格式）"

# ============================================
# 错误处理
# ============================================
error_handling:
  input_validation_failed:
    - action: "block_and_report"
      state: BLOCKED
      notify: [qa_lead, pm]
      message: "输入契约验证失败，无法开始测试用例设计"

  requirement_alignment_failed:
    - action: "escalate_and_block"
      state: BLOCKED
      notify: [qa_lead, tech_lead, pm]
      message: "需求对齐失败，PRD/架构/UI存在无法解决的冲突"
      create_incident: true

  feature_calibration_failed:
    - action: "escalate_and_block"
      state: BLOCKED
      notify: [qa_lead, tech_lead]
      message: "功能点校准失败，无法建立有效的映射关系"

  branch_coverage_generation_failed:
    - action: "retry_with_fallback"
      max_retries: 3
      fallback_strategy: "use_basic_coverage"
      notify: qa_lead

  specialized_test_generation_failed:
    - action: "partial_delivery"
      note: "专项测试用例生成失败，但核心功能用例已完成"
      notify: qa_lead
      continue_with: functional_tests_only

  playwright_generation_failed:
    - action: "retry_with_manual_flag"
      max_retries: 2
      flag_as: "requires_manual_completion"
      notify: qa_lead

  review_timeout:
    - action: "escalate"
      notify: [qa_lead, tech_lead, pm]
      message: "测试用例评审超时，需要人工介入"

  revision_timeout:
    - action: "escalate_to_governance"
      state: BLOCKED
      notify: [qa_lead, tech_lead, pm, governance]
      message: "测试用例修订超时，需要治理层决策"

# ============================================
# 质量指标
# ============================================
quality_metrics:
  coverage:
    - requirement_coverage:
        target: ">= 90%"
        description: "需求覆盖度"
    - feature_coverage:
        target: ">= 95%"
        description: "功能点覆盖度"
    - ui_page_coverage:
        target: "100%"
        description: "UI页面覆盖度"

  quality:
    - case_quality_score:
        target: ">= 8/10"
        description: "用例质量评分"
    - traceability:
        target: "100%"
        description: "需求可追溯性"
    - clarity:
        target: ">= 90%"
        description: "用例清晰度"

  automation:
    - automation_rate:
        target: ">= 70%"
        description: "可自动化率"
    - playwright_coverage:
        target: ">= 60%"
        description: "Playwright脚本覆盖度"

# ============================================
# 可观测性
# ============================================
observability:
  metrics:
    - workflow_duration: "工作流总时长"
    - stage_duration: "各阶段时长"
    - review_cycle_time: "评审周期时长"
    - revision_count: "修订次数"
    - approval_rate: "一次通过率"
    - coverage_achievement: "覆盖度达成情况"

  dashboards:
    - test_case_design_progress
    - quality_trends
    - review_efficiency

  alerts:
    - workflow_stalled:
        condition: "stage_duration > 48h"
        notify: qa_lead
    - coverage_below_threshold:
        condition: "coverage < 80%"
        notify: qa_lead
    - review_overdue:
        condition: "review_pending > 72h"
        notify: [qa_lead, tech_lead]

# ============================================
# 依赖项
# ============================================
dependencies:
  external:
    - prd_frozen: "PRD必须已冻结"
    - architecture_frozen: "技术架构必须已冻结"
    - ui_prototype_frozen: "UI原型必须已冻结"
    - ui_page_contract_available: "UI页面契约必须可用"

  internal:
    - design_input_gate_defined: "输入门禁必须已定义"
    - test_case_review_gate_defined: "评审门禁必须已定义"
    - agents_available: "所有必需的Agent必须可用"
    - skills_available: "所有必需的Skill必须可用"

# ============================================
# 版本控制
# ============================================
metadata:
  version: 1.0
  created: "2026-02-04"
  author: qa-design-team
  changelog:
    - version: "1.0"
      date: "2026-02-04"
      changes:
        - "初始版本：创建测试用例设计工作流"
        - "支持需求对齐、功能点校准、分支覆盖、专项测试、评审、Playwright生成"
