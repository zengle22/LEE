# Regression Testing L3 Workflow v1.0
# QA 回归测试工作流（L3）

kind: workflow
version: "1.0"

id: workflow.qa.regression
name: QA Regression Workflow (L3)
description: >
  执行回归测试并生成 Bug 草稿：
  部署测试环境 → 解析测试计划 → 生成脚本 → 执行回归 → 结果分析 → Bug 草稿 → QA Gate。
owner: qa
tags: [workflow, qa, regression, l3]

contracts:
  inputs:
    - test_plan:
        path: ../../contracts/test-plan/v1/schema.json
        description: 测试计划输入
  outputs:
    - test_result:
        path: ../../contracts/test-result/v1/schema.json
        description: 测试结果汇总
    - bug_draft:
        path: ../../contracts/bug-draft/v1/schema.json
        description: Bug 草稿列表

stages:
  - id: s1_prepare
    name: "准备阶段"
    steps:
      - id: s1_1_deploy_test_env
        name: "部署测试环境"
        type: skill
        run: skill.devops.deploy_test_env
        inputs:
          - env: "{{params.env}}"
          - version: "{{params.version}}"
        outputs:
          - path: "output/test-env-status.json"

      - id: s1_2_parse_test_plan
        name: "解析测试计划"
        type: agent
        run: agent.qa.test_plan_parser
        dependencies:
          requires: [s1_1_deploy_test_env]
        inputs:
          - test_plan: "{{params.spec}}"
        outputs:
          - path: "output/parsed-test-plan.json"
            contract: ../../contracts/test-plan/v1/schema.json

  - id: s2_generate
    name: "生成阶段"
    steps:
      - id: s2_1_generate_scripts
        name: "生成测试脚本"
        type: agent
        run: agent.qa.test_script_generator
        dependencies:
          requires: [s1_2_parse_test_plan]
        inputs:
          - parsed_plan: "output/parsed-test-plan.json"
        outputs:
          - path: "output/test-scripts/"

  - id: s3_execute
    name: "执行阶段"
    steps:
      - id: s3_1_run_tests
        name: "执行回归测试"
        type: skill
        run: skill.qa.run_tests
        dependencies:
          requires: [s2_1_generate_scripts]
        inputs:
          - scripts_dir: "output/test-scripts/"
        outputs:
          - path: "output/raw-test-results.json"

      - id: s3_2_collect_results
        name: "收集结果"
        type: skill
        run: skill.qa.collect_results
        dependencies:
          requires: [s3_1_run_tests]
        inputs:
          - raw_results: "output/raw-test-results.json"
        outputs:
          - path: "output/test-report.json"
            contract: ../../contracts/test-result/v1/schema.json
          - path: "output/logs/"
          - path: "output/screenshots/"

  - id: s4_analyze
    name: "分析阶段"
    steps:
      - id: s4_1_analyze_failures
        name: "归类失败用例"
        type: agent
        run: agent.qa.failure_analyzer
        dependencies:
          requires: [s3_2_collect_results]
        inputs:
          - test_report: "output/test-report.json"
          - logs: "output/logs/"
        outputs:
          - path: "output/failure-analysis.json"

      - id: s4_2_draft_bugs
        name: "生成 Bug 草稿"
        type: agent
        run: agent.qa.bug_drafter
        dependencies:
          requires: [s4_1_analyze_failures]
        inputs:
          - failure_analysis: "output/failure-analysis.json"
        outputs:
          - path: "output/bug-drafts.json"
            contract: ../../contracts/bug-draft/v1/schema.json

  - id: s5_gate
    name: "审批阶段"
    steps:
      - id: s5_1_qa_gate
        name: "QA 认可"
        type: human_gate
        dependencies:
          requires: [s4_2_draft_bugs]
        gate:
          ref: ../../gates/qa-regression-gate/v1/gate.yaml

