# LEE DevOps 资源标签与 Inventory 规范
# Resource Tags and Inventory Specification

kind: specification
id: spec.devops.resource-tags
name: DevOps 资源标签规范
version: "1.0.0"
department: devops

description: >
  定义 LEE 体系中的资源标签规范，用于统一管理 Ansible inventory、
  云资源标签、环境隔离等。所有 DevOps 相关的资源命名和分组必须遵循此规范。

# ============================================
# 环境标签 (Environment Tags)
# ============================================
env_tags:
  dev:
    description: 开发环境，仅供开发调试使用。
    auto_deploy: true
    require_human_gate: false

  test:
    description: 测试环境，仅供 QA / 自动化测试使用。
    auto_deploy: true
    require_human_gate: false

  staging:
    description: 预发布环境，模拟生产环境，少量真实流量。
    auto_deploy: false
    require_human_gate: true

  prod:
    description: 生产环境，真实用户流量。
    auto_deploy: false
    require_human_gate: true

# ============================================
# 角色标签 (Role Tags)
# ============================================
role_tags:
  api:
    description: 应用 API 层服务。
    typical_ports: [8080, 8000, 3000]

  web:
    description: 前端 / 网关 / 静态资源。
    typical_ports: [80, 443]

  db:
    description: 关系型数据库服务。
    typical_ports: [5432, 3306]

  cache:
    description: 缓存服务（如 Redis）。
    typical_ports: [6379]

  mq:
    description: 消息队列服务。
    typical_ports: [5672, 9092]

  job:
    description: 异步任务、定时任务服务。
    typical_ports: []

  monitor:
    description: 监控服务（如 Prometheus、Grafana）。
    typical_ports: [9090, 3000]

  log:
    description: 日志服务（如 ELK）。
    typical_ports: [9200, 5601]

# ============================================
# 区域标签 (Zone Tags)
# ============================================
zone_tags:
  cn-north-1:
    description: 中国北区 1，可按云厂商映射。
    cloud_mapping:
      aliyun: cn-beijing
      aws: cn-north-1
      tencent: ap-beijing

  cn-south-1:
    description: 中国南区 1。
    cloud_mapping:
      aliyun: cn-shenzhen
      aws: cn-south-1
      tencent: ap-guangzhou

  cn-east-1:
    description: 中国东区 1。
    cloud_mapping:
      aliyun: cn-shanghai
      aws: cn-east-1
      tencent: ap-shanghai

  jp-east-1:
    description: 日本东区 1。
    cloud_mapping:
      aliyun: ap-northeast-1
      aws: ap-northeast-1
      tencent: ap-tokyo

  # 根据实际需要扩展

# ============================================
# 使用规则 (Usage Rules)
# ============================================
usage_rules:
  - id: one_server_multi_role
    text: >
      小规模阶段允许一台服务器承担多个 role（如 api + job），
      但必须在 inventory 和文档中清晰标注。
    severity: info

  - id: env_isolation
    text: >
      不同 env 不共享机器。dev/test/staging/prod 至少在逻辑上隔离
      （不同 IP 或不同安全组）。
    severity: required

  - id: inventory_as_source_of_truth
    text: >
      Ansible inventory 是服务器分配的唯一真实来源。
      所有部署脚本必须通过 inventory 引用服务器，不得硬编码 IP。
    severity: required

  - id: tag_consistency
    text: >
      云资源标签必须与 inventory 标签保持一致。
      如 inventory 中标记 env=dev，云服务器也必须打上 env=dev 标签。
    severity: required

  - id: no_cross_env_access
    text: >
      禁止跨环境访问。dev 环境的服务不得访问 prod 环境的数据库或 API。
    severity: critical

# ============================================
# Inventory 目录结构规范
# ============================================
inventory_structure:
  description: >
    推荐的 Ansible inventory 目录结构，适用于项目级别。

  template: |
    project/<project_name>/devops/ansible/inventory/
    ├── dev/
    │   ├── hosts.ini        # 主机列表
    │   └── group_vars.yml   # 环境变量
    ├── test/
    │   ├── hosts.ini
    │   └── group_vars.yml
    ├── staging/
    │   ├── hosts.ini
    │   └── group_vars.yml
    └── prod/
        ├── hosts.ini
        └── group_vars.yml

  hosts_ini_example: |
    # inventory/dev/hosts.ini
    [dev-api]
    dev-api-1 ansible_host=10.0.0.10 env=dev role=api zone=cn-south-1

    [dev-db]
    dev-db-1 ansible_host=10.0.0.11 env=dev role=db zone=cn-south-1

    [dev-cache]
    dev-redis-1 ansible_host=10.0.0.12 env=dev role=cache zone=cn-south-1

    [dev:children]
    dev-api
    dev-db
    dev-cache

  group_vars_example: |
    # inventory/dev/group_vars.yml
    env: dev
    zone: cn-south-1

    app_config:
      domain: dev.api.example.local
      log_level: debug

    db_config:
      host: dev-db-1
      port: 5432
      name: app_dev
      user: dev_user
      # password 不在这里写，用 vault 或本地注入

# ============================================
# 配置文件关系说明
# ============================================
config_relationship:
  description: >
    env-config 与 inventory 的职责划分。

  env_config:
    path: "devops/env/env-config.*.yaml"
    purpose: "应用级配置（容器内）"
    content:
      - 运行时环境变量（API_PORT 等）
      - 应用配置（日志级别、功能开关等）
    consumer: "docker-compose / 应用"

  inventory:
    path: "devops/ansible/inventory/*"
    purpose: "主机级配置（容器外）"
    content:
      - 服务器 IP 和分组
      - 主机变量
      - 环境标签
    consumer: "Ansible"

  rule: >
    env-config.*.yaml = 应用级配置（容器内）
    ansible inventory = 主机级配置（容器外）
    两者不重复，各司其职。

# ============================================
# 版本历史
# ============================================
changelog:
  - version: "1.0.0"
    date: "2026-01-30"
    changes:
      - "初始版本：定义环境、角色、区域标签"
      - "定义使用规则和 inventory 结构规范"
      - "明确 env-config 与 inventory 的关系"
