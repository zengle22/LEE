# DevOps 资源绑定声明 v1.2
# 部署只能通过这些 inventory 触达机器

kind: resource_binding
version: "1.2"
workflow_ref: workflow.devops.deployment
contract_ref: contract.devops.execution

# ============================================
# Inventory 绑定
# ============================================
inventories:
  dev:
    path: ./dev
    description: "开发环境 inventory"
    auto_deploy: true
    require_human_gate: false

  test:
    path: ./test
    description: "测试环境 inventory"
    auto_deploy: true
    require_human_gate: false

  staging:
    path: ./staging  # 本 demo 未包含
    description: "预发布环境 inventory"
    auto_deploy: false
    require_human_gate: true

  prod:
    path: ./prod  # 本 demo 未包含
    description: "生产环境 inventory"
    auto_deploy: false
    require_human_gate: true
    required_approvers:
      - devops_lead
      - tech_lead
      - product_owner

# ============================================
# 约束规则（来自 contract v1.1.0）
# ============================================
constraints:
  ai_must_not:
    - code: NO_RESOURCE_PROVISIONING
      description: "禁止创建/删除云资源"
      enforced: true

    - code: NO_PROD_ACCOUNT_MUTATION
      description: "禁止在生产环境创建/删除账号"
      enforced: true

  ai_must:
    - code: MUST_USE_INVENTORY
      description: "必须通过 inventory 引用服务器"
      enforced: true

    - code: MUST_LOG_COMMANDS
      description: "所有命令必须记录审计日志"
      enforced: true

# ============================================
# 硬件资源管理
# ============================================
hardware_resources:
  managed_by: human
  description: >
    硬件级资源（云服务器、磁盘、带宽等）由人类规划与创建，
    DevOps 与 Agent 仅可在既有资源上进行部署与配置。

  allowed_operations:
    - deploy_to_existing_server
    - configure_existing_server
    - rollback_deployment

  forbidden_operations:
    - create_cloud_vm
    - delete_cloud_vm
    - modify_server_spec
    - create_load_balancer

# ============================================
# IaC 工具策略
# ============================================
iac_tools:
  current:
    - ansible
  future:
    - terraform
  note: >
    Terraform 引入需单独立项审批，
    初期仅在 dev/test 试点。

# ============================================
# 标签规范引用
# ============================================
tags_spec_ref: spec-global/departments/devops/resource-tags.yaml

required_tags:
  - env     # dev, test, staging, prod
  - role    # api, web, db, cache, mq, job
  - zone    # cn-north-1, cn-south-1, etc.

# ============================================
# 元数据
# ============================================
metadata:
  created_at: "2026-01-30T00:00:00Z"
  created_by: "demo"
  project: "running-coach"
