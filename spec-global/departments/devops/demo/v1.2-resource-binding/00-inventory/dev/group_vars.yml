# Running Coach - Dev Environment Variables
# 开发环境变量配置

# ============================================
# 环境标识
# ============================================
env: dev
zone: cn-south-1
project: running-coach

# ============================================
# 应用配置
# ============================================
app_config:
  name: running-coach
  version: "1.0.0"
  domain: dev.api.running-coach.local
  log_level: debug
  debug_mode: true

# ============================================
# 数据库配置
# ============================================
db_config:
  host: dev-db-1
  port: 5432
  name: running_coach_dev
  user: dev_user
  # password 不在这里写，通过 vault 或环境变量注入
  # password: ${DB_PASSWORD}
  max_connections: 20
  ssl_mode: disable

# ============================================
# Redis 配置
# ============================================
redis_config:
  host: dev-redis-1
  port: 6379
  db: 0
  # password: ${REDIS_PASSWORD}

# ============================================
# API 配置
# ============================================
api_config:
  port: 8080
  workers: 2
  timeout: 30
  cors_origins:
    - "http://localhost:3000"
    - "http://dev.running-coach.local"

# ============================================
# 部署配置
# ============================================
deploy_config:
  docker_registry: registry.example.com
  image_tag: "1.0.0-dev"
  replicas: 1
  health_check_interval: 30s

# ============================================
# 监控配置
# ============================================
monitoring:
  enabled: true
  prometheus_port: 9090
  log_retention_days: 7
