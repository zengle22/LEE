# Running Coach - Ansible 部署 Playbook
# Phase 2 输出 by agent.devops.implementation
#
# v1.2 特性：通过 inventory 绑定服务器

---
- name: Deploy Running Coach Application
  hosts: "{{ env }}"  # 动态选择环境组
  become: yes
  vars_files:
    - "../../00-inventory/{{ env }}/group_vars.yml"

  vars:
    app_name: running-coach
    docker_compose_path: /opt/running-coach
    env_config_path: "../../03-env-config/env-config.{{ env }}.yaml"

  pre_tasks:
    - name: 显示部署信息
      debug:
        msg: |
          ========================================
          部署信息:
            环境: {{ env }}
            主机: {{ inventory_hostname }}
            IP: {{ ansible_host }}
            角色: {{ role }}
            区域: {{ zone }}
          ========================================

    - name: 验证 inventory 约束
      assert:
        that:
          - env is defined
          - role is defined
          - zone is defined
        fail_msg: "缺少必要的 inventory 标签 (env/role/zone)"
        success_msg: "✓ inventory 标签验证通过"

  tasks:
    # ============================================
    # API 服务部署
    # ============================================
    - name: 部署 API 服务
      when: role == 'api'
      block:
        - name: 创建应用目录
          file:
            path: "{{ docker_compose_path }}"
            state: directory
            mode: '0755'

        - name: 复制 docker-compose.yml
          copy:
            src: ../../docker-compose.yml
            dest: "{{ docker_compose_path }}/docker-compose.yml"

        - name: 加载环境配置
          include_vars:
            file: "{{ env_config_path }}"
            name: env_config

        - name: 停止现有服务
          shell: docker-compose down || true
          args:
            chdir: "{{ docker_compose_path }}"

        - name: 启动服务
          shell: docker-compose up -d
          args:
            chdir: "{{ docker_compose_path }}"

        - name: 等待服务启动
          wait_for:
            port: 8080
            delay: 10
            timeout: 120

        - name: 健康检查
          uri:
            url: "http://localhost:8080/health"
            status_code: 200
          register: health_check
          retries: 5
          delay: 10

        - name: 输出健康检查结果
          debug:
            msg: "✓ API 服务健康检查通过"
          when: health_check.status == 200

    # ============================================
    # 数据库服务检查
    # ============================================
    - name: 检查数据库服务
      when: role == 'db'
      block:
        - name: 检查 PostgreSQL 运行状态
          shell: docker ps | grep postgres || echo "未运行"
          register: db_status

        - name: 输出数据库状态
          debug:
            msg: "数据库状态: {{ db_status.stdout }}"

    # ============================================
    # 缓存服务检查
    # ============================================
    - name: 检查缓存服务
      when: role == 'cache'
      block:
        - name: 检查 Redis 运行状态
          shell: docker ps | grep redis || echo "未运行"
          register: redis_status

        - name: 输出缓存状态
          debug:
            msg: "缓存状态: {{ redis_status.stdout }}"

  post_tasks:
    - name: 部署完成通知
      debug:
        msg: |
          ========================================
          ✓ {{ inventory_hostname }} 部署完成
          ========================================
