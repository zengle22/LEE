# Test 环境配置文件
#
# **重要**: 此文件包含真实配置，由人类填写
# AI 不会生成真实的密钥或凭证
#
# 使用方法：
# 1. 复制此文件为 env-config.test.yaml
# 2. 填写真实配置值
# 3. 使用 lee run devops inject-config 命令注入到环境

kind: environment_config
id: env.test
name: Test Environment
version: "1.0"
environment: test

description: >
  这是测试环境的配置文件。
  Test 环境用于 QA 测试和集成验证。

# ============================================
# 基础配置
# ============================================
basic_config:
  app_name: "my-app"
  app_version: "0.1.0"
  app_env: "test"
  app_debug: "false"
  app_log_level: "info"

# ============================================
# Docker 配置
# ============================================
docker_config:
  docker_registry: "docker.io/myorg"
  app_image: "${DOCKER_REGISTRY}/${app_name}:${app_version}"

  # 端口配置
  app_port: 8000
  db_port_expose: 5432
  redis_port_expose: 6379
  nginx_http_port: 80
  nginx_https_port: 443

  # 网络配置
  network_subnet: "172.21.0.0/16"

# ============================================
# 数据库配置（敏感信息）
# ============================================
database_config:
  db_host: "db"
  db_port: 5432
  db_name: "${DB_NAME}"  # 人类填写：测试数据库名称
  db_user: "${DB_USER}"  # 人类填写：测试数据库用户
  db_password: "${DB_PASSWORD}"  # 人类填写：测试数据库密码（敏感）

  postgres_version: "15-alpine"

  # 备份配置
  backup_enabled: true
  backup_schedule: "0 3 * * *"  # 每天凌晨 3 点
  backup_retention_days: 14

  # 测试数据
  test_data_enabled: true
  test_data_seed_script: "./scripts/seed-test-data.sql"

# ============================================
# Redis 配置（敏感信息）
# ============================================
redis_config:
  redis_host: "redis"
  redis_port: 6379
  redis_password: "${REDIS_PASSWORD}"  # 人类填写：测试环境 Redis 密码（敏感）

  redis_version: "7-alpine"

  # 持久化配置
  persist_enabled: true
  persist_policy: "everysec"

# ============================================
# 外部服务配置（敏感信息）
# ============================================
external_services:
  # API 密钥（测试环境）
  api_key: "${API_KEY}"  # 人类填写：测试环境 API 密钥
  secret_key: "${SECRET_KEY}"  # 人类填写：测试环境应用密钥

  # 第三方服务示例
  smtp_host: "${SMTP_HOST}"
  smtp_port: 587
  smtp_user: "${SMTP_USER}"
  smtp_password: "${SMTP_PASSWORD}"

  # 云服务配置（测试环境）
  aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
  aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  aws_region: "us-east-1"

  # 测试服务 Mock
  mock_external_apis: true
  mock_payment_gateway: true

# ============================================
# 应用配置
# ============================================
application_config:
  # 功能开关
  features:
    feature_a: true
    feature_b: true
    feature_c: true

  # 限流配置
  rate_limiting:
    enabled: true
    requests_per_minute: 10000

  # CORS 配置
  cors:
    allowed_origins:
      - "https://test.example.com"
      - "https://test-admin.example.com"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "PATCH"
    allowed_headers:
      - "Content-Type"
      - "Authorization"
      - "X-Request-ID"

  # 测试模式
  test_mode: true
  enable_test_endpoints: true

# ============================================
# 监控与日志配置
# ============================================
monitoring_config:
  # 日志级别
  log_level: "info"

  # 日志输出
  log_output:
    - "console"
    - "file"
    - "syslog"

  # 监控端点
  metrics_enabled: true
  metrics_port: 9090
  health_check_enabled: true
  health_check_path: "/health"

  # APM 集成
  apm_enabled: true
  apm_service_name: "${app_name}-test"
  apm_server_url: "${APM_SERVER_URL}"

# ============================================
# 资源限制（Test 环境中等）
# ============================================
resource_limits:
  app:
    memory: "1G"
    cpus: "1.0"

  db:
    memory: "2G"
    cpus: "1.0"

  redis:
    memory: "512M"
    cpus: "0.5"

  nginx:
    memory: "256M"
    cpus: "0.5"

# ============================================
# 部署配置
# ============================================
deployment_config:
  # 部署策略
  strategy: "rolling"
  replicas: 2

  # 健康检查
  health_check:
    enabled: true
    interval: 20
    timeout: 10
    retries: 3

  # 启动超时
  startup_timeout: 180

  # 部署前检查
  pre_deployment_checks:
    - check: "数据库迁移脚本已准备"
      command: "ls scripts/migrate-*.sql"
    - check: "测试数据种子脚本已准备"
      command: "ls scripts/seed-test-data.sql"
    - check: "回滚脚本已准备"
      command: "ls deploy/rollback-test.sh"

# ============================================
# 测试配置
# ============================================
testing_config:
  # 自动化测试
  automated_tests_enabled: true
  test_suites:
    - "unit"
    - "integration"
    - "e2e"

  # 测试执行
  test_command: "pytest tests/"
  test_timeout: 600

  # 测试报告
  test_report_enabled: true
  test_report_path: "./reports/test-report.html"

  # 测试覆盖率
  coverage_threshold: 80
  coverage_report_path: "./reports/coverage.xml"

# ============================================
# 安全配置
# ============================================
security_config:
  # HTTPS（Test 环境启用）
  https_enabled: true
  ssl_cert_path: "./nginx/ssl/test.crt"
  ssl_key_path: "./nginx/ssl/test.key"

  # 基本认证（如需要）
  basic_auth_enabled: true
  basic_auth_user: "${BASIC_AUTH_USER}"
  basic_auth_password: "${BASIC_AUTH_PASSWORD}"

  # 安全头
  security_headers_enabled: true

# ============================================
# 审计配置
# ============================================
audit_config:
  # 审计日志
  audit_enabled: true
  audit_log_path: "./logs/audit.log"

  # 操作记录
  log_all_commands: true
  log_all_api_calls: true

  # 审计事件
  audit_events:
    - "deployment"
    - "config_change"
    - "access_denied"
    - "data_modification"

# ============================================
# 回滚配置
# ============================================
rollback_config:
  # 回滚版本
  previous_version: "0.0.9"

  # 回滚脚本
  rollback_script: "./deploy/rollback-test.sh"

  # 回滚时间估算
  estimated_rollback_time: "10 minutes"

  # 回滚触发条件
  rollback_triggers:
    - condition: "测试失败率 > 50%"
      action: "auto_rollback"
    - condition: "关键功能不可用"
      action: "manual_rollback"
    - condition: "性能严重下降"
      action: "manual_rollback"

# ============================================
# 配置验证
# ============================================
validation:
  # 必填字段检查
  required_fields:
    - db_name
    - db_user
    - db_password
    - redis_password
    - secret_key
    - smtp_password

  # 敏感字段检查
  sensitive_fields:
    - db_password
    - redis_password
    - api_key
    - secret_key
    - smtp_password
    - aws_secret_access_key
    - basic_auth_password

# ============================================
# 配置元数据
# ============================================
metadata:
  created_at: "2026-01-29T00:00:00Z"
  created_by: "human"
  updated_at: "2026-01-29T00:00:00Z"
  updated_by: "human"
  version: "1.0"

  # 配置来源
  source: "human_filled"
  # AI 生成占位符，人类填写真实值

# ============================================
# 配置说明
# ============================================
# 填写说明：
# 1. 所有 ${VAR_NAME} 格式的占位符需要替换为真实值
# 2. 测试环境的凭证应该与生产环境隔离
# 3. 测试数据应该定期清理和重置
# 4. 启用 Mock 服务以避免依赖外部系统
#
# 安全建议：
# - 使用独立的测试环境凭证
# - 定期轮换测试环境密钥
# - 限制测试环境的网络访问
# - 启用详细的审计日志
# - 定期检查测试数据是否包含敏感信息
