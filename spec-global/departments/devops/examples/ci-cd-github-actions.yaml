# GitHub Actions CI/CD Pipeline 示例
#
# **重要**: 此文件由 AI 生成，人类可以修改
# 这是一个完整的 CI/CD 流水线示例，包含构建、测试、部署
#
# 使用方法：
# 1. 将此文件复制到项目的 .github/workflows/ 目录
# 2. 根据实际项目调整配置
# 3. 配置 GitHub Secrets（敏感信息）

name: DevOps CI/CD Pipeline

# ============================================
# 触发条件
# ============================================
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:  # 允许手动触发

# ============================================
# 环境变量
# ============================================
env:
  DOCKER_REGISTRY: docker.io
  APP_NAME: my-app
  NODE_VERSION: '18.x'

# ============================================
# Jobs 定义
# ============================================
jobs:
  # ============================================
  # Job 1: 代码质量检查
  # ============================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 获取完整历史记录

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Check code formatting
        run: npm run format:check

  # ============================================
  # Job 2: 单元测试
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage is below 80%"
            exit 1
          fi

  # ============================================
  # Job 3: 构建镜像
  # ============================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.APP_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.APP_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.APP_NAME }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ============================================
  # Job 4: 安全扫描
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image_tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  # ============================================
  # Job 5: 集成测试
  # ============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: test-results/

  # ============================================
  # Job 6: 部署到 Dev 环境
  # ============================================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [build, security-scan, integration-tests]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: dev
      url: http://dev.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to dev environment
        run: |
          echo "Deploying to dev environment..."
          # 这里添加实际的部署逻辑
          # 例如：kubectl apply -f k8s/dev/
          # 或者：ssh dev-server "cd /app && docker-compose up -d"

      - name: Health check
        run: |
          sleep 10
          curl -f http://dev.example.com/health || exit 1

      - name: Run smoke tests
        run: npm run test:smoke -- --base-url=http://dev.example.com

      - name: Notify deployment success
        run: |
          echo "Dev deployment successful!"
          # 这里添加通知逻辑（Slack、Email 等）

  # ============================================
  # Job 7: 部署到 Test 环境
  # ============================================
  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: [build, security-scan, integration-tests]
    if: github.ref == 'refs/heads/main'
    environment:
      name: test
      url: http://test.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to test environment
        run: |
          echo "Deploying to test environment..."
          # 这里添加实际的部署逻辑

      - name: Health check
        run: |
          sleep 10
          curl -f http://test.example.com/health || exit 1

      - name: Run E2E tests
        run: npm run test:e2e -- --base-url=http://test.example.com

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: e2e-test-results/

      - name: Notify deployment success
        run: |
          echo "Test deployment successful!"
          # 这里添加通知逻辑

  # ============================================
  # Job 8: 人工审批（Staging/Prod 前置）
  # ============================================
  approval-gate:
    name: Approval Gate
    runs-on: ubuntu-latest
    needs: deploy-test
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging-approval

    steps:
      - name: Await approval
        run: |
          echo "Waiting for approval to deploy to staging..."
          echo "This is a manual gate that requires human approval"

  # ============================================
  # Job 9: 部署到 Staging 环境
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: approval-gate
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging environment..."
          # 这里添加实际的部署逻辑

      - name: Health check
        run: |
          sleep 10
          curl -f https://staging.example.com/health || exit 1

      - name: Run smoke tests
        run: npm run test:smoke -- --base-url=https://staging.example.com

      - name: Create release bundle
        run: |
          echo "Creating release bundle..."
          # 这里生成发布包

      - name: Upload release artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-bundle-${{ github.sha }}
          path: |
            release/
            docker-compose.yml
            env/

      - name: Notify deployment success
        run: |
          echo "Staging deployment successful!"
          # 这里添加通知逻辑

  # ============================================
  # Job 10: 性能测试（Staging）
  # ============================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run performance tests
        run: |
          echo "Running performance tests..."
          # 这里添加性能测试逻辑（例如使用 k6）

      - name: Upload performance report
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: performance-report.html

  # ============================================
  # Job 11: 生产环境审批
  # ============================================
  production-approval:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: [deploy-staging, performance-tests]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production-approval

    steps:
      - name: Create release checklist
        run: |
          echo "Creating release checklist..."
          cat > release-checklist.md << EOF
          # Release Checklist

          - [ ] All tests passed
          - [ ] Security scan passed
          - [ ] Performance tests passed
          - [ ] Rollback plan ready
          - [ ] Stakeholders notified
          - [ ] Maintenance window scheduled
          EOF

      - name: Upload release checklist
        uses: actions/upload-artifact@v3
        with:
          name: release-checklist
          path: release-checklist.md

      - name: Await approval
        run: |
          echo "Waiting for approval to deploy to production..."
          echo "This is a manual gate that requires human approval"

# ============================================
# 配置说明
# ============================================
# GitHub Secrets 配置：
# - DOCKER_USERNAME: Docker 镜像仓库用户名
# - DOCKER_PASSWORD: Docker 镜像仓库密码
# - SSH_KEY: 部署服务器的 SSH 密钥（如需要）
# - SLACK_WEBHOOK: Slack 通知 Webhook（如需要）
# - AWS_ACCESS_KEY_ID: AWS 访问密钥（如需要）
# - AWS_SECRET_ACCESS_KEY: AWS 密钥（如需要）
#
# 环境配置：
# - dev: 开发环境，自动部署
# - test: 测试环境，自动部署
# - staging-approval: Staging 环境前置审批
# - staging: 预发布环境，审批后部署
# - production-approval: 生产环境审批
#
# 安全建议：
# - 使用 GitHub Secrets 存储敏感信息
# - 定期更新依赖和镜像
# - 启用安全扫描和漏洞检测
# - 使用环境隔离和权限控制
# - 定期审计 CI/CD 流水线
