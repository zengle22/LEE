# DevOps Human Gate Checklist
# DevOps 人工门控检查清单

kind: checklist
id: checklist.devops.human_gate
name: DevOps 人工门控检查清单
version: "1.0.0"
department: devops

description: >
  这是 DevOps 工作流中 Human Gate 的标准检查清单。

  适用阶段：
  - p1_architecture (架构设计完成后)
  - p3_env_config (配置注入完成后)
  - p5_verification (环境验收完成后)
  - p6_release_freeze (版本冻结最终审批)

# ============================================
# 检查项定义
# ============================================
items:
  - id: hg_env_scope
    category: "环境范围"
    text: "已确认本次变更涉及的环境范围（dev/test/staging/prod）"
    type: "confirmation"
    required: true
    applicable_phases:
      - p3_env_config
      - p5_verification
      - p6_release_freeze

  - id: hg_credentials
    category: "凭证安全"
    text: "已检查并正确填写所有凭证占位符（未硬编码密钥）"
    type: "validation"
    required: true
    applicable_phases:
      - p3_env_config

  - id: hg_rollback
    category: "回滚方案"
    text: "已阅读并确认回滚方案可行"
    type: "confirmation"
    required: true
    applicable_phases:
      - p1_architecture
      - p5_verification
      - p6_release_freeze

  - id: hg_cost
    category: "成本评估"
    text: "已评估云资源成本（如涉及）"
    type: "confirmation"
    required: false
    applicable_phases:
      - p1_architecture
      - p6_release_freeze

  - id: hg_risk
    category: "风险评估"
    text: "已评估本次变更的风险等级"
    type: "assessment"
    required: true
    applicable_phases:
      - p1_architecture
      - p5_verification
      - p6_release_freeze

  - id: hg_architecture_review
    category: "架构评审"
    text: "架构设计已通过技术评审"
    type: "confirmation"
    required: true
    applicable_phases:
      - p1_architecture

  - id: hg_security_review
    category: "安全评审"
    text: "已通过安全评审（无硬编码密钥、权限配置正确）"
    type: "validation"
    required: true
    applicable_phases:
      - p5_verification
      - p6_release_freeze

  - id: hg_deployment_success
    category: "部署验证"
    text: "所有关键服务已成功部署并正常运行"
    type: "validation"
    required: true
    applicable_phases:
      - p5_verification

  - id: hg_release_complete
    category: "发布完整性"
    text: "发布包包含所有必需文件和文档"
    type: "validation"
    required: true
    applicable_phases:
      - p5_verification
      - p6_release_freeze

  - id: hg_audit_trail
    category: "审计跟踪"
    text: "审计跟踪记录完整，所有变更可追溯"
    type: "validation"
    required: true
    applicable_phases:
      - p6_release_freeze

  - id: hg_prod_approval
    category: "生产审批"
    text: "生产环境发布已获得最终审批"
    type: "confirmation"
    required: true
    applicable_phases:
      - p6_release_freeze
    condition: "environment == 'prod'"

# ============================================
# 风险等级定义
# ============================================
risk_levels:
  low:
    description: "低风险：常规部署，变更范围小"
    examples:
      - "dev/test 环境部署"
      - "bugfix 修复"
      - "配置微调"

  medium:
    description: "中等风险：涉及多个服务或 staging 环境"
    examples:
      - "staging 环境部署"
      - "多服务联动变更"
      - "数据库 schema 变更"

  high:
    description: "高风险：生产环境部署或重大架构变更"
    examples:
      - "生产环境部署"
      - "基础设施架构变更"
      - "数据库迁移"
      - "安全相关变更"

  critical:
    description: "严重风险：可能影响整个系统"
    examples:
      - "核心基础设施变更"
      - "数据迁移或删除"
      - "安全漏洞修复"

# ============================================
# 审批角色定义
# ============================================
approval_roles:
  devops_lead:
    name: "DevOps 负责人"
    responsibilities:
      - "审核架构设计"
      - "确认部署方案"
      - "评估风险"
      - "批准 dev/test/staging 部署"

  tech_lead:
    name: "技术负责人"
    responsibilities:
      - "审核技术方案"
      - "评估架构影响"
      - "批准 staging 部署"
      - "共同批准 prod 部署"

  product_owner:
    name: "产品负责人"
    responsibilities:
      - "确认业务影响"
      - "评估发布时机"
      - "最终批准 prod 部署"

  qa_lead:
    name: "测试负责人"
    responsibilities:
      - "确认测试覆盖"
      - "验证环境质量"
      - "批准部署到测试环境"

# ============================================
# 检查清单使用规范
# ============================================
usage_guidelines:
  general:
    - "所有 required: true 的检查项必须通过"
    - "检查项结果应记录在审批文档中"
    - "未通过的检查项必须说明原因和处理方案"

  phase_specific:
    p1_architecture:
      required_items:
        - hg_env_scope
        - hg_rollback
        - hg_risk
        - hg_architecture_review
      approval_roles: [devops_lead, tech_lead]

    p3_env_config:
      required_items:
        - hg_env_scope
        - hg_credentials
      approval_roles: [devops_lead]

    p5_verification:
      required_items:
        - hg_env_scope
        - hg_rollback
        - hg_risk
        - hg_security_review
        - hg_deployment_success
        - hg_release_complete
      approval_roles: [devops_lead, qa_lead]

    p6_release_freeze:
      required_items:
        - hg_env_scope
        - hg_rollback
        - hg_risk
        - hg_security_review
        - hg_release_complete
        - hg_audit_trail
        - hg_prod_approval  # 如果涉及生产环境
      approval_roles: [devops_lead, tech_lead, product_owner]

# ============================================
# 版本历史
# ============================================
changelog:
  - version: "1.0.0"
    date: "2026-01-29"
    changes:
      - "初始版本：定义 DevOps Human Gate 检查清单"
