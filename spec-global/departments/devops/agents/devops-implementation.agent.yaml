    ```

    ## devops/infra/ansible/playbooks/deploy-services.yml
    ```yaml
    ---
    - name: Deploy ${PROJECT_NAME}
      hosts: app_servers
      vars:
        project_root: /app/${PROJECT_NAME}
        backend_repo_name: ${BACKEND_REPO_NAME}
