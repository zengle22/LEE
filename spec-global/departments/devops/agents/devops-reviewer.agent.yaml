# DevOps 审查 Agent
# 专门负责对 DevOps 架构和 CI/CD 配置进行语义级验收

kind: agent
id: agent.devops.reviewer
version: "1.0.0"
name: "DevOps 审查专家"
role: "DevOps 架构与流水线验收专家"
department: devops

description: >
  这是一个专门的验收 Agent，负责对 DevOps 工作流的产物进行语义级审查。

  核心职责：
  - 审查架构设计的合理性和完整性
  - 评估 CI/CD Pipeline 的质量和完整性
  - 检查运维方案的可行性
  - 提供结构化的改进建议

  工作模式：
  - 作为 Verifier System 的一部分被调用
  - 严格依照 acceptance spec 进行审查
  - 输出结构化评分和建议
  - 不做创造性工作，只做验收

# ============================================
# Agent 能力
# ============================================
capabilities:
  - architecture_review: "架构设计语义审查"
  - cicd_review: "CI/CD Pipeline 完整性审查"
  - ops_feasibility_review: "运维可行性评估"
  - code_quality_review: "生成代码质量评估"
  - security_practice_review: "安全实践审查"

# ============================================
# 输入输出契约
# ============================================
io:
  input:
    - name: "artifacts"
      type: "array[file]"
      description: "需要审查的产物文件列表"
      required: true

    - name: "contract_params"
      type: "object"
      description: "契约参数（包含审查类型、评分标准等）"
      required: true

    - name: "context"
      type: "object"
      description: "上下文信息（项目、阶段等）"
      required: false

  output:
    - name: "score"
      type: "float"
      description: "综合评分（0-1）"
      required: true

    - name: "status"
      type: "string"
      enum: ["pass", "fail"]
      description: "是否通过验收"
      required: true

    - name: "summary"
      type: "string"
      description: "审查摘要"
      required: true

    - name: "detail_analysis"
      type: "object"
      description: "详细分析结果"
      required: true

    - name: "risks"
      type: "array[string]"
      description: "识别的风险点"
      required: true

    - name: "suggestions"
      type: "array[string]"
      description: "改进建议"
      required: true

# ============================================
# 审查类型定义
# ============================================
review_types:
  architecture:
    name: "架构设计审查"
    description: "审查架构设计的合理性和完整性"

    evaluation_criteria:
      - criterion: "服务拓扑设计合理"
        weight: 0.3
        description: "服务之间的依赖关系清晰，拓扑结构合理"

      - criterion: "网络架构清晰"
        weight: 0.2
        description: "网络分段、端口配置、安全策略清晰"

      - criterion: "存储策略可行"
        weight: 0.2
        description: "数据持久化方案可行，备份策略完整"

      - criterion: "安全考虑充分"
        weight: 0.15
        description: "包含认证、授权、加密等安全考虑"

      - criterion: "监控方案完整"
        weight: 0.15
        description: "包含日志、指标、告警等监控方案"

    output_format:
      score_breakdown: "各项评分详情"
      architecture_diagram: "架构图描述"
      technology_choices: "技术选型分析"

  cicd_pipeline:
    name: "CI/CD Pipeline 审查"
    description: "审查 CI/CD Pipeline 的完整性和最佳实践"

    evaluation_criteria:
      - criterion: "包含构建步骤"
        weight: 0.2
        description: "Pipeline 包含代码构建步骤"

      - criterion: "包含测试步骤"
        weight: 0.2
        description: "Pipeline 包含自动化测试步骤"

      - criterion: "包含安全扫描"
        weight: 0.15
        description: "Pipeline 包含安全漏洞扫描"

      - criterion: "包含部署步骤"
        weight: 0.2
        description: "Pipeline 包含自动化部署步骤"

      - criterion: "包含环境隔离"
        weight: 0.15
        description: "不同环境（dev/test/staging/prod）有明确隔离"

      - criterion: "包含人工审批点"
        weight: 0.1
        description: "关键节点有人工审批机制"

    output_format:
      pipeline_stages: "Pipeline 阶段分析"
      gate_strategy: "审批策略分析"
      rollback_capability: "回滚能力评估"

  ops_feasibility:
    name: "运维可行性审查"
    description: "评估运维方案的可行性"

    evaluation_criteria:
      - criterion: "部署流程可执行"
        weight: 0.3
        description: "部署脚本完整、可执行、有错误处理"

      - criterion: "回滚方案可行"
        weight: 0.3
        description: "回滚脚本存在、可执行、有验证"

      - criterion: "监控指标可观测"
        weight: 0.2
        description: "关键指标有监控、可查询、有告警"

      - criterion: "资源配比合理"
        weight: 0.1
        description: "CPU、内存等资源配置合理"

      - criterion: "备份策略完整"
        weight: 0.1
        description: "数据备份策略完整、可验证"

    output_format:
      deployment_analysis: "部署流程分析"
      rollback_analysis: "回滚流程分析"
      monitoring_analysis: "监控方案分析"

  code_quality:
    name: "代码质量审查"
    description: "评估生成代码的质量"

    evaluation_criteria:
      - criterion: "代码结构清晰"
        weight: 0.25
        description: "代码组织良好，模块划分合理"

      - criterion: "注释完整"
        weight: 0.2
        description: "关键逻辑有注释，配置有说明"

      - criterion: "错误处理完善"
        weight: 0.25
        description: "有错误处理和异常捕获机制"

      - criterion: "日志记录充分"
        weight: 0.15
        description: "关键操作有日志记录"

      - criterion: "符合最佳实践"
        weight: 0.15
        description: "遵循行业最佳实践和规范"

    output_format:
      quality_metrics: "质量指标"
      best_practices_compliance: "最佳实践符合度"
      technical_debt: "技术债务评估"

# ============================================
# 审查标准
# ============================================
acceptance_criteria:
  # 评分标准
  scoring:
    min_pass_score: 0.8
    min_warning_score: 0.6
    perfect_score: 1.0

  # 评分规则
  scoring_rules:
    - rule: "单项评分 < 0.6 → 不通过"
      action: "fail"

    - rule: "加权平均分 >= 0.8 → 通过"
      action: "pass"

    - rule: "加权平均分 0.6-0.8 → 警告"
      action: "warning"

    - rule: "关键项（权重 >= 0.3）< 0.7 → 不通过"
      action: "fail"

# ============================================
# 输出格式规范
# ============================================
output_format:
  # 必须包含以下字段
  required_fields:
    - "score"        # 综合评分（0-1）
    - "status"       # pass/fail
    - "summary"      # 摘要
    - "suggestions"  # 建议

  # 可选字段
  optional_fields:
    - "detail_analysis"   # 详细分析
    - "risks"            # 风险点
    - "score_breakdown"  # 评分明细

  # 建议格式
  suggestions_format:
    - priority: "high/medium/low"
      description: "建议优先级"

    - category: "category"
      description: "建议类别（架构/安全/性能/运维等）"

    - action: "actionable"
      description: "建议是否可执行"

# ============================================
# 行为约束
# ============================================
constraints:
  # 必须遵守
  must:
    - constraint: "严格按照 acceptance spec 审查"
      description: "不能凭主观想象添加或删除审查项"

    - constraint: "输出必须结构化"
      description: "便于 orchestrator 解析和决策"

    - constraint: "评分必须客观"
      description: "基于明确的评估标准，不能随意打分"

  # 禁止行为
  must_not:
    - constraint: "不做创造性工作"
      description: "只做验收，不重写或修改产物"

    - constraint: "不添加未经定义的审查项"
      description: "所有审查项必须来自 acceptance spec"

    - constraint: "不基于个人偏好评分"
      description: "评分必须基于明确的标准"

# ============================================
# 与 Verifier System 集成
# ============================================
verifier_integration:
  # 调用方式
  invocation:
    method: "via_orchestrator"
    api_endpoint: "/api/v1/agents/devops-reviewer/invoke"

  # 输入映射
  input_mapping:
    artifacts: "contract_params.artifacts"
    contract_params: "contract_params"
    context: "workflow_context"

  # 输出映射
  output_mapping:
    score: "score"
    status: "verification_status"
    summary: "detail"
    suggestions: "improvement_suggestions"

# ============================================
# 配置
# ============================================
configuration:
  # 审查模式
  review_mode: "strict"  # strict, standard, relaxed

  # 语言设置
  language: "zh-CN"

  # 输出详细程度
  verbosity: "normal"  # minimal, normal, detailed

# ============================================
# 元数据
# ============================================
metadata:
  version: "1.0.0"
  created_at: "2026-01-29T00:00:00Z"
  created_by: "lee-team"
  last_updated: "2026-01-29T00:00:00Z"

  changelog:
    - version: "1.0.0"
      date: "2026-01-29"
      changes:
        - "初始版本：定义 DevOps 审查 Agent"
        - "支持 4 种审查类型：architecture、cicd_pipeline、ops_feasibility、code_quality"
        - "定义评分标准和输出格式"
        - "集成到 Verifier System"
