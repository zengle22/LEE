# DevOps Deploy Skill v1.0

kind: skill
version: 1.0

id: skill.devops.deploy
name: Deploy
description: >
  执行部署脚本，使用 Docker Compose 拉取镜像并启动服务。
owner: devops-team
tags: [devops, deploy]

interface:
  inputs:
    type: object
    required: [env, version]
    properties:
      env:
        type: string
        description: "目标环境 (staging/production)"
      version:
        type: string
        description: "待部署版本号"
      compose_file:
        type: string
        description: "Docker Compose 文件路径"
        default: "docker-compose.yml"
  outputs:
    type: object
    properties:
      ok:
        type: boolean
      log:
        type: string

runtime:
  type: shell
  script: "scripts/deploy.sh"
  args_template: "--env {{ inputs.env }} --version {{ inputs.version }}"
  exit_codes:
    0: "部署成功"
    1: "部署失败"
    2: "参数错误"
