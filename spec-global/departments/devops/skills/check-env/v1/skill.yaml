# DevOps Check Env Skill v1.0

kind: skill
version: 1.0

id: skill.devops.check_env
name: Check Environment
description: >
  检查目标环境状态：Docker、端口、配置文件。
owner: devops-team
tags: [devops, deploy]

interface:
  inputs:
    type: object
    required: [env]
    properties:
      env:
        type: string
        description: "目标环境"
      require_docker:
        type: boolean
        default: true
      require_port:
        type: integer
        description: "必须可达的端口号"
  outputs:
    type: object
    properties:
      ok:
        type: boolean
      checks:
        type: array

runtime:
  type: shell
  script: "scripts/check-env.sh"
  args_template: "--env {{ inputs.env }} {% if inputs.require_docker %}--require-docker{% endif %}"
  exit_codes:
    0: "环境检查通过"
    1: "环境检查不通过"
    2: "参数错误"
