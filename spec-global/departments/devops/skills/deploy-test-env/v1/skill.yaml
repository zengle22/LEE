# DevOps Deploy Test Env Skill v1.0

kind: skill
version: 1.0

id: skill.devops.deploy_test_env
name: Deploy Test Environment
description: >
  部署测试环境供 QA 回归测试使用。
owner: devops-team
tags: [devops, qa, deploy]

interface:
  inputs:
    type: object
    required: [env, version]
    properties:
      env:
        type: string
      version:
        type: string
  outputs:
    type: object
    properties:
      ok:
        type: boolean
      status:
        type: string

runtime:
  type: shell
  script: "scripts/deploy-test-env.sh"
  args_template: "--env {{ inputs.env }} --version {{ inputs.version }}"
  exit_codes:
    0: "测试环境部署成功"
    1: "测试环境部署失败"
    2: "参数错误"
