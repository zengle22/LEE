# Environment Config Template
# 环境配置模板

kind: template
id: template.devops.env_config
name: 环境配置模板
version: "1.0.0"
department: devops

description: >
  这是环境配置的模板文件，用于生成各环境的实际配置。

  使用方法：
  1. 复制此模板为 env-config.{env}.yaml
  2. 替换所有占位符为实际值
  3. 确保 YAML 语法正确

# ============================================
# 模板定义
# ============================================
template:
  # 环境标识
  env: "<env>"

  # 应用配置
  app:
    name: "<app_name>"
    version: "<version>"
    port: ${API_PORT}
    replicas: ${REPLICAS}
    environment: ${ENV}

  # 数据库配置
  database:
    host: ${DB_HOST}
    port: ${DB_PORT}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    name: ${DB_NAME}
    ssl_mode: ${DB_SSL_MODE}
    pool_size: ${DB_POOL_SIZE}

  # Redis 配置
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    db: ${REDIS_DB}
    pool_size: ${REDIS_POOL_SIZE}

  # 外部 API 配置
  external_apis:
    - name: "example_api"
      base_url: ${EXAMPLE_API_BASE_URL}
      api_key: ${EXAMPLE_API_KEY}
      timeout: ${EXAMPLE_API_TIMEOUT}

  # 存储配置
  storage:
    type: ${STORAGE_TYPE}
    bucket: ${STORAGE_BUCKET}
    region: ${STORAGE_REGION}
    access_key: ${STORAGE_ACCESS_KEY}
    secret_key: ${STORAGE_SECRET_KEY}

  # 监控配置
  monitoring:
    enabled: ${MONITORING_ENABLED}
    endpoint: ${MONITORING_ENDPOINT}
    api_key: ${MONITORING_API_KEY}

  # 日志配置
  logging:
    level: ${LOG_LEVEL}
    output: ${LOG_OUTPUT}
    endpoint: ${LOG_ENDPOINT}

  # 安全配置
  security:
    cors_enabled: ${CORS_ENABLED}
    cors_origins: ${CORS_ORIGINS}
    rate_limit_enabled: ${RATE_LIMIT_ENABLED}
    rate_limit: ${RATE_LIMIT}

# ============================================
# 环境特定默认值
# ============================================
environment_defaults:
  dev:
    API_PORT: "3000"
    REPLICAS: "1"
    ENV: "development"
    DB_HOST: "localhost"
    DB_PORT: "5433"
    DB_USER: "dev_user"
    DB_NAME: "app_dev"
    DB_SSL_MODE: "disable"
    DB_POOL_SIZE: "5"
    REDIS_HOST: "localhost"
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    REDIS_POOL_SIZE: "5"
    LOG_LEVEL: "debug"
    LOG_OUTPUT: "console"
    CORS_ENABLED: "true"
    CORS_ORIGINS: "*"
    RATE_LIMIT_ENABLED: "false"
    MONITORING_ENABLED: "false"

  test:
    API_PORT: "4000"
    REPLICAS: "1"
    ENV: "test"
    DB_HOST: "localhost"
    DB_PORT: "5434"
    DB_USER: "test_user"
    DB_NAME: "app_test"
    DB_SSL_MODE: "disable"
    DB_POOL_SIZE: "5"
    REDIS_HOST: "localhost"
    REDIS_PORT: "6380"
    REDIS_DB: "1"
    REDIS_POOL_SIZE: "5"
    LOG_LEVEL: "info"
    LOG_OUTPUT: "console"
    CORS_ENABLED: "true"
    CORS_ORIGINS: "*"
    RATE_LIMIT_ENABLED: "false"
    MONITORING_ENABLED: "false"

  staging:
    API_PORT: "80"
    REPLICAS: "2"
    ENV: "staging"
    DB_HOST: "${STAGING_DB_HOST}"
    DB_PORT: "5432"
    DB_USER: "${STAGING_DB_USER}"
    DB_NAME: "app_staging"
    DB_SSL_MODE: "require"
    DB_POOL_SIZE: "10"
    REDIS_HOST: "${STAGING_REDIS_HOST}"
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    REDIS_POOL_SIZE: "10"
    LOG_LEVEL: "info"
    LOG_OUTPUT: "file"
    LOG_ENDPOINT: "${STAGING_LOG_ENDPOINT}"
    CORS_ENABLED: "true"
    CORS_ORIGINS: "${STAGING_CORS_ORIGINS}"
    RATE_LIMIT_ENABLED: "true"
    RATE_LIMIT: "100"
    MONITORING_ENABLED: "true"
    MONITORING_ENDPOINT: "${STAGING_MONITORING_ENDPOINT}"

  prod:
    API_PORT: "443"
    REPLICAS: "3"
    ENV: "production"
    DB_HOST: "${PROD_DB_HOST}"
    DB_PORT: "5432"
    DB_USER: "${PROD_DB_USER}"
    DB_NAME: "app_prod"
    DB_SSL_MODE: "require"
    DB_POOL_SIZE: "20"
    REDIS_HOST: "${PROD_REDIS_HOST}"
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    REDIS_POOL_SIZE: "20"
    LOG_LEVEL: "warn"
    LOG_OUTPUT: "file"
    LOG_ENDPOINT: "${PROD_LOG_ENDPOINT}"
    CORS_ENABLED: "true"
    CORS_ORIGINS: "${PROD_CORS_ORIGINS}"
    RATE_LIMIT_ENABLED: "true"
    RATE_LIMIT: "1000"
    MONITORING_ENABLED: "true"
    MONITORING_ENDPOINT: "${PROD_MONITORING_ENDPOINT}"

# ============================================
# 占位符说明
# ============================================
placeholder_guide:
  - pattern: "${VARIABLE_NAME}"
    description: "所有大写的变量名都是占位符，需要人类填写实际值"

  sensitive_fields:
    - DB_PASSWORD
    - REDIS_PASSWORD
    - EXAMPLE_API_KEY
    - STORAGE_ACCESS_KEY
    - STORAGE_SECRET_KEY
    - MONITORING_API_KEY
    - STAGING_DB_HOST
    - STAGING_DB_USER
    - STAGING_REDIS_HOST
    - STAGING_LOG_ENDPOINT
    - STAGING_MONITORING_ENDPOINT
    - STAGING_CORS_ORIGINS
    - PROD_DB_HOST
    - PROD_DB_USER
    - PROD_REDIS_HOST
    - PROD_LOG_ENDPOINT
    - PROD_MONITORING_ENDPOINT
    - PROD_CORS_ORIGINS

# ============================================
# 安全注意事项
# ============================================
security_notes:
  - "不要在配置文件中硬编码任何密钥或凭证"
  - "使用环境变量或密钥管理系统注入敏感信息"
  - "生产环境配置必须经过审批才能生效"
  - "配置文件应该纳入版本控制（去除敏感信息）"
  - "使用 .gitignore 排除包含真实凭证的文件"

# ============================================
# 版本历史
# ============================================
changelog:
  - version: "1.0.0"
    date: "2026-01-29"
    changes:
      - "初始版本：定义环境配置模板"
