# RELEASE Generate Gate v1.0
# RELEASE 生成验证门禁（自动检查）
#
# 定位：ADR-027 渐进式工作流的核心 Gate 之一
# 验证 FEAT2RELEASE L3 成功生成 RELEASE

kind: gate
version: 1.0

# ============================================
# 宪法引用
# ============================================
constitution:
  ref: ../../../README.md
  version: "1.0"
  mandatory: true

# ============================================
# ADR 引用
# ============================================
governing_adrs:
  - ADR-027: 渐进式工作流落地设计

id: gate.product.release_generate_gate
name: RELEASE Generate Gate
description: >
  RELEASE 生成验证门禁（自动检查）。
  验证 FEAT2RELEASE L3 成功生成 RELEASE 对象。

owner: product-ai
tags: [gate, product, release, generate, adr-027]

# ============================================
# 门禁类型
# ============================================
type: automated
priority: blocker

# ============================================
# 触发条件
# ============================================
trigger:
  event: "feat2release_complete"
  source: "workflow.product.task.feat_to_release"

# ============================================
# 输入证据
# ============================================
input_evidence:
  - "spec/releases/release-{release_id}.yaml"
  - ".workflow/{release_id}/release_output.yaml"

# ============================================
# 检查项
# ============================================
checks:
  - id: release_generated
    name: "RELEASE 已生成"
    description: "RELEASE 对象必须已生成"
    type: file_exists
    rule: "spec/releases/release-{release_id}.yaml exists"
    severity: blocker
    required: true
    input_field: "release_yaml_path"

  - id: feat_bundle_valid
    name: "FEAT Bundle 有效"
    description: "FEAT Bundle 必须有效且非空"
    type: validation_check
    rule: "release.feat_refs is non-empty list of valid FEAT IDs"
    severity: blocker
    required: true
    input_field: "release.feat_refs"

  - id: release_metadata_complete
    name: "RELEASE 元数据完整"
    description: "RELEASE 元数据（type, window, version）完整"
    type: field_check
    rule: "release.release_type AND release.release_window AND release.version defined"
    severity: major
    required: true
    input_field: "release"

# ============================================
# 通过条件
# ============================================
pass_criteria:
  all_required: true
  max_blocker: 0
  max_major: 0
  description: "所有 blocker 和 major 检查必须通过"

# ============================================
# 失败处理
# ============================================
on_fail:
  action: "block_and_return"
  message: "RELEASE 生成验证未通过，请检查 FEAT2RELEASE 执行结果"
  return_to: "workflow.product.task.feat_to_release"

# ============================================
# 元数据
# ============================================
metadata:
  created_by: "product-ai"
  created_at: "2026-03-17"
  version: "1.0"
  changelog:
    - version: "1.0"
      date: "2026-03-17"
      changes:
        - "新建 RELEASE 生成验证门禁 (ADR-027)"
