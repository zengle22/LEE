# RELEASE Validate Gate v1.0
# RELEASE 验证门禁（自动检查）
#
# 定位：ADR-027 渐进式工作流的核心 Gate 之一
# 验证 RELEASE 对象生成的完整性

kind: gate
version: 1.0

# ============================================
# 宪法引用
# ============================================
constitution:
  ref: ../../../README.md
  version: "1.0"
  mandatory: true

# ============================================
# ADR 引用
# ============================================
governing_adrs:
  - ADR-027: 渐进式工作流落地设计

id: gate.product.release_validate_gate
name: RELEASE Validate Gate
description: >
  RELEASE 验证门禁（自动检查）。
  验证 FEAT2RELEASE L3 生成的 RELEASE 对象完整性。

owner: product-ai
tags: [gate, product, release, validate, adr-027]

# ============================================
# 门禁类型
# ============================================
type: automated
priority: blocker

# ============================================
# 触发条件
# ============================================
trigger:
  event: "release_init_complete"
  source: "workflow.product.task.feat_to_release"

# ============================================
# 输入证据
# ============================================
input_evidence:
  - "spec/releases/release-{release_id}.yaml"
  - ".workflow/{release_id}/release_output.yaml"

# ============================================
# 检查项
# ============================================
checks:
  - id: feat_bundle_not_empty
    name: "FEAT Bundle 非空"
    description: "FEAT Bundle 不能为空，必须至少包含一个 FEAT"
    type: metric_check
    rule: "release.feat_refs.length > 0"
    severity: blocker
    required: true
    input_field: "release.feat_refs"

  - id: all_feats_frozen
    name: "所有 FEAT 已冻结"
    description: "所有 FEAT 必须是 frozen 状态"
    type: field_check
    rule: "all feat_refs reference frozen FEAT objects"
    severity: blocker
    required: true
    input_field: "release.feat_refs"

  - id: dependency_graph_valid
    name: "依赖关系图有效"
    description: "FEAT 依赖关系图有效，无循环依赖"
    type: validation_check
    rule: "dependency_graph has no cycles"
    severity: major
    required: true
    input_field: "dependency_graph"

  - id: release_metadata_complete
    name: "RELEASE 元数据完整"
    description: "RELEASE 元数据（type, window, version）完整"
    type: field_check
    rule: "release.release_type AND release.release_window AND release.version defined"
    severity: major
    required: true
    input_field: "release"

# ============================================
# 通过条件
# ============================================
pass_criteria:
  all_required: true
  max_blocker: 0
  max_major: 0
  description: "所有 blocker 和 major 检查必须通过"

# ============================================
# 失败处理
# ============================================
on_fail:
  action: "block_and_return"
  message: "RELEASE 验证未通过，请检查 FEAT Bundle 和依赖关系"
  return_to: "workflow.product.task.feat_to_release"

# ============================================
# 元数据
# ============================================
metadata:
  created_by: "product-ai"
  created_at: "2026-03-17"
  version: "1.0"
  changelog:
    - version: "1.0"
      date: "2026-03-17"
      changes:
        - "新建 RELEASE 验证门禁 (ADR-027)"
