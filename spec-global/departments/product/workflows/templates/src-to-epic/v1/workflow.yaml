# Product SRC to EPIC Template v1.0
# 产品部门 L3 模板 - 从冻结 SRC 生成 EPIC

kind: l3_workflow_template
version: "1.0"
id: workflow.product.task.src_to_epic
name: Product SRC to EPIC
description: >
  将冻结后的 SRC 收敛为产品建设层的 EPIC。
  适用于多个 FEAT 共享同一业务目标、边界和优先级的场景。
  EPIC 的正式身份必须在对应 SRC 作用域内完成准备和定版。
  该文件是 checked-in workflow template，运行时实例由 Python runtime 动态生成。
owner: product-ai
tags: [product, workflow, l3, ssot, epic]

roles:
  agents:
    - agent.product.requirement_alignment
    - agent.product.epic_designer
    - agent.product.epic_reviewer
    - agent.governance.approval_reviewer
    - agent.governance.acceptance_checker
    - agent.review.acceptance_reviewer
    - agent.governance.defect_fixer
    - agent.qa.output_validator
  skills: []
  gates:
    - gate.product.epic_acceptance_approval
    - gate.product.epic_freeze

overview:
  input_types:
    - type: src
      description: canonical SRC 主对象
      ssot_type: SRC
    - type: source_freeze
      description: 已冻结的 SRC 或其冻结视图
      ssot_type: SRC

  output:
    type: epic_freeze
    ssot_type: EPIC
    description: 冻结后的 EPIC 主对象或其冻结视图
    preferred_ref: epic_freeze_ref

stages:
  - id: src_to_epic_flow
    name: "SRC to EPIC Flow"
    kind: stage
    description: "从冻结 SRC 设计并冻结 EPIC"
    depends_on: []
    steps:
      - id: problem_alignment
        name: 问题空间对齐
        kind: agent
        agent_id: agent.product.requirement_alignment
        mandatory: true
        depends_on: []
        description: >
          将冻结后的 SRC 翻译为问题空间，明确边界、非目标和关键约束。
        inputs:
          - source: external
            type: [src, source_freeze]
            required: true
        outputs:
          - symbol: problem_definition
            contract: departments/product/contracts/problem-definition/v1/schema.json
            freeze: false
        config:
          strict_output_validation: true
      - id: epic_design
        name: EPIC 设计
        kind: agent
        agent_id: agent.product.epic_designer
        mandatory: true
        depends_on: [problem_alignment]
        description: >
          基于问题空间构建 EPIC。
          EPIC 必须覆盖多个可独立验收 FEAT，而不是单一功能点。
        inputs:
          - source: problem_definition
            required: true
        outputs:
          - symbol: epic_candidate
            contract: departments/product/contracts/epic-contract/v1/schema.json
            freeze: false
            ssot:
              identity_kind: ssot
              ssot_type: EPIC
              source_refs: [external]
        config:
          strict_output_validation: true
      - id: epic_identity_prepare
        name: EPIC 身份准备
        kind: agent
        agent_id: agent.governance.approval_reviewer
        mandatory: true
        depends_on: [epic_design]
        description: >
          在非 main 分支上为 EPIC candidate 建立 provisional identity，
          并绑定 source_freeze 提供的 src_root_id，形成稳定的评审输入。
        inputs:
          - source: epic_candidate
            required: true
          - source: external
            type: [source_freeze]
            required: true
        outputs:
          - symbol: epic_scoped_candidate
            contract: departments/product/contracts/epic-contract/v1/schema.json
            freeze: false
            ssot:
              identity_kind: ssot
              ssot_type: EPIC
              source_refs: [external]
      - id: epic_review
        name: EPIC 对齐评审
        kind: agent
        agent_id: agent.product.epic_reviewer
        mandatory: true
        depends_on: [epic_identity_prepare]
        description: >
          校验 EPIC 是否满足 SSOT 规则、价值边界和拆分合理性。
        inputs:
          - source: epic_scoped_candidate
            required: true
        outputs:
          - symbol: epic_review_report
            contract: departments/product/contracts/product-review-contract/v1/schema.json
            freeze: false
        config:
          strict_output_validation: true
          claude_code:
            read_only: true

      # ========== ADR-025 验收卡点开始 ==========
      - id: epic_acceptance_auto_check
        name: EPIC 验收 - 自动检查
        kind: agent
        agent_id: agent.governance.acceptance_checker
        mandatory: true
        depends_on: [epic_review]
        description: >
          根据 ADR-025 执行 EPIC 自动验收检查。
          包括 Schema 验证、Contract 验证、完整性检查、依赖解析。
          输出 auto_check_result，作为 Review Gate 的输入。
        inputs:
          - source: epic_scoped_candidate
            required: true
          - source: epic_review_report
            required: true
        outputs:
          - symbol: epic_auto_check_result
            contract: departments/product/contracts/acceptance-check-result-contract/v1/schema.json
            freeze: false
        config:
          acceptance:
            version: "1.0"
            check_type: auto
            dimensions:
              - schema_validation
              - contract_validation
              - completeness_check
              - dependency_resolution

      - id: epic_acceptance_review
        name: EPIC 验收 - 人工评审
        kind: agent
        agent_id: agent.review.acceptance_reviewer
        mandatory: true
        depends_on: [epic_acceptance_auto_check]
        description: >
          根据 ADR-025 执行 EPIC 人工验收评审。
          包括六大维度：功能逻辑闭环、用户故事体验、功能完整性、逻辑漏洞、行业差距、改进空间。
          输出 acceptance_report 和 defect_list。
        inputs:
          - source: epic_scoped_candidate
            required: true
          - source: epic_auto_check_result
            required: true
        outputs:
          - symbol: epic_acceptance_report
            contract: departments/product/contracts/acceptance-report-contract/v1/schema.json
            freeze: false
          - symbol: epic_defect_list
            contract: departments/product/contracts/defect-list-contract/v1/schema.json
            freeze: false
        config:
          acceptance:
            version: "1.0"
            check_type: review
            dimensions:
              - functional_closure
              - user_story_experience
              - feature_completeness
              - logic_vulnerability
              - industry_gap
              - improvement_opportunities
            gate_type: review
            meeting_format: sync_60min
            reviewers:
              - role: product_owner
              - role: tech_lead

      # ========== ADR-025 Fix Loop 开始 ==========
      - id: epic_defect_fix_loop
        name: EPIC 验收 - 缺陷修复 Loop
        kind: agent
        agent_id: agent.governance.defect_fixer
        mandatory: true
        depends_on: [epic_acceptance_review]
        description: >
          根据 ADR-025 执行缺陷修复循环。
          检查 P0/P1 缺陷，如果存在则修复或标记为延期。
          输出 defect_fix_report 和 updated_defect_list。

          Fix Loop 规则：
          - P0 缺陷：必须修复，不允许绕过
          - P1 缺陷：原则必须修复，特殊情况需 PO+Tech Lead 决策可延期
          - P2/P3 缺陷：记录为技术债务，纳入 backlog，不影响 Approval Gate

          循环退出条件：
          - P0 缺陷数量 = 0
          - P1 缺陷数量 = 0 或所有 P1 缺陷都有延期审批
        inputs:
          - source: epic_acceptance_report
            required: true
          - source: epic_defect_list
            required: true
          - source: epic_scoped_candidate
            required: true
        outputs:
          - symbol: epic_defect_fix_report
            contract: departments/product/contracts/defect-fix-report-contract/v1/schema.json
            freeze: false
          - symbol: epic_updated_defect_list
            contract: departments/product/contracts/defect-list-contract/v1/schema.json
            freeze: false
        config:
          acceptance:
            version: "1.0"
            fix_policy:
              p0_policy: must_fix
              p1_policy: fix_or_defer_with_approval
              p2_policy: defer_to_backlog
              p3_policy: defer_to_backlog
            exit_conditions:
              - p0_count_equals_zero
              - p1_count_equals_zero_or_all_deferred_with_approval
            max_iterations: 3

      - id: epic_acceptance_approval_gate
        name: EPIC 验收 - 审批 Gate
        kind: gate
        mandatory: true
        depends_on: [epic_defect_fix_loop]
        description: >
          根据 ADR-025 执行 EPIC 验收审批。
          验证 P0/P1 缺陷已修复，批准验收报告。
          只有通过审批后，才能进入 EPIC 身份定版步骤。
        inputs:
          - source: epic_scoped_candidate
            required: true
          - source: epic_acceptance_report
            required: true
          - source: epic_defect_list
            required: true
        outputs:
          - symbol: epic_acceptance_approval
            contract: departments/product/contracts/gate-result-contract/v1/schema.json
            freeze: false
        config:
          strict_output_validation: true
        gate_rules:
          reviewers:
            - role: product_owner
          approval_criteria:
            - label: "P0/P1 缺陷清零"
              criteria: "所有 P0/P1 缺陷已修复或延期有理据"
              required: true
            - label: "验收报告完整"
              criteria: "六大维度评审完成，报告结构完整"
              required: true
            - label: "行业差距分析"
              criteria: "至少 3 个对标对象，差距程度量化"
              required: true
          config:
            gate:
              type: human_approval
              gate_id: gate.product.epic_acceptance_approval

      # ========== ADR-025 验收卡点结束 ==========
      - id: epic_identity_formalize
        name: EPIC 身份定版
        kind: agent
        agent_id: agent.governance.approval_reviewer
        mandatory: true
        depends_on: [epic_acceptance_approval_gate, epic_defect_fix_loop]
        description: >
          在 EPIC freeze 前，将 provisional EPIC 定版为 SRC scoped 正式身份，
          并完成同批次内的引用重写。
        inputs:
          - source: epic_scoped_candidate
            required: true
          - source: epic_review_report
            required: true
          - source: epic_acceptance_approval
            required: true
          - source: epic_defect_fix_report
            required: true
        outputs:
          - symbol: epic_formalized_candidate
            contract: departments/product/contracts/epic-contract/v1/schema.json
            freeze: false
            ssot:
              identity_kind: ssot
              ssot_type: EPIC
              source_refs: [external]
      - id: epic_freeze
        name: EPIC 冻结
        kind: gate
        mandatory: true
        depends_on: [epic_identity_formalize, epic_acceptance_approval_gate]
        description: >
          由产品负责人冻结 EPIC，确认业务目标、范围边界与拆分原则。
          冻结前必须通过 ADR-025 验收卡点（epic_acceptance_approval_gate）。
        inputs:
          - source: epic_formalized_candidate
            required: true
          - source: epic_review_report
            required: true
          - source: epic_acceptance_report
            required: true
          - source: epic_acceptance_approval
            required: true
          - source: epic_defect_fix_report
            required: true
          - source: epic_updated_defect_list
            required: true
        outputs:
          - path: spec/requirements/epics/{epic_id}.yaml
            required: true
            freeze: true
            contract: departments/product/contracts/epic-contract/v1/schema.json
            ssot:
              identity_kind: ssot
              ssot_type: EPIC
              derived_from: epic_candidate
        gate_rules:
          reviewers:
            - role: product_owner
          approval_criteria:
            - label: "EPIC 合法性"
              criteria: "EPIC 至少覆盖多个可独立验收 FEAT"
              required: true
            - label: "价值边界清晰"
              criteria: "目标、非目标、成功指标和约束完整"
              required: true
            - label: "可向下拆解"
              criteria: "下游 FEAT 可按验收边界继续拆解"
              required: true
            - label: "验收通过"
              criteria: "ADR-025 验收卡点通过 (epic_acceptance_approval = approve)"
              required: true
        config:
          gate:
            type: human_approval
            gate_id: gate.product.epic_freeze

      - id: output_validation
        name: 输出完整性校验
        kind: agent
        agent_id: agent.governance.output_validator
        mandatory: true
        depends_on: [epic_freeze]
        description: >
          对落盘的 EPIC 文件进行全面校验，确保 SSOT 字段完整有效。
          校验失败则拒绝放行，触发重跑（最多 3 次），3 次失败则整体流程失败。
        inputs:
          - source: epic_freeze
            required: true
        outputs:
          - symbol: output_validation_result
            contract: departments/product/contracts/gate-result-contract/v1/schema.json
            freeze: false
        config:
          validation:
            kind: ssot
            ssot_type: EPIC
            max_retries: 3
    step_order:
      - problem_alignment
      - epic_design
      - epic_identity_prepare
      - epic_review
      - epic_acceptance_auto_check
      - epic_acceptance_review
      - epic_defect_fix_loop
      - epic_acceptance_approval_gate
      - epic_identity_formalize
      - epic_freeze
      - output_validation

stage_order:
  - src_to_epic_flow

constraints:
  frozen_src_only: |
    src_to_epic 只接受已冻结 SRC 或其 canonical ref。
    不得在本流程中直接接收 raw requirement。

  src_scoped_epic_rule: |
    EPIC 必须绑定 source_freeze 提供的 src_root_id。
    freeze 前必须完成 EPIC 的 SRC 作用域 identity formalize。

  epic_rule_binding: |
    若范围只包含单一可交付功能，不得创建 EPIC，
    应直接走单 FEAT 特例流程。

  # ========== ADR-025 验收卡点约束 ==========
  adr025_acceptance_required: |
    根据 ADR-025，EPIC 冻结前必须通过验收卡点：
    - epic_acceptance_auto_check: 自动检查（Schema/Contract/Completeness/Dependency）
    - epic_acceptance_review: 人工评审（六大维度）
    - epic_acceptance_approval_gate: 审批 Gate（P0/P1 清零）
    任何一步失败都不得进入 epic_freeze 步骤。

  adr025_p0_p1_defect_policy: |
    P0/P1 缺陷处理政策：
    - P0 缺陷：必须修复，不允许绕过
    - P1 缺陷：原则必须修复，特殊情况需 PO + Tech Lead 共同决策可延期
    - P2/P3 缺陷：记录为技术债务，纳入 backlog
    epic_freeze 前必须确认所有 P0/P1 缺陷已修复或有明确的延期理据。

  adr025_acceptance_report_required: |
    验收报告是 epic_freeze 的必要输入：
    - epic_acceptance_report: 包含六大维度评审结果和缺陷列表
    - 验收报告必须存储在 .artifacts/active/product/epic/{epic_id}/acceptance-report-v{version}.yaml
    - 验收报告必须被 gate record 引用

instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
  context_fields:
    - source_freeze
    - source_freeze_ref
    - src_root_id
    - epic_freeze_ref
  output_fields:
    - epic_freeze

state_machine:
  states:
    - INIT: "初始化"
    - PROBLEM_ALIGNMENT: "问题空间对齐"
    - EPIC_DESIGN: "EPIC 设计"
    - EPIC_IDENTITY_PREPARE: "EPIC 身份准备"
    - EPIC_REVIEW: "EPIC 评审"
    - EPIC_ACCEPTANCE_AUTO_CHECK: "EPIC 验收 - 自动检查"
    - EPIC_ACCEPTANCE_REVIEW: "EPIC 验收 - 人工评审"
    - EPIC_DEFECT_FIX_LOOP: "EPIC 验收 - 缺陷修复循环"
    - EPIC_ACCEPTANCE_APPROVAL: "EPIC 验收 - 审批"
    - EPIC_IDENTITY_FORMALIZE: "EPIC 身份定版"
    - EPIC_FREEZE: "EPIC 冻结"
    - OUTPUT_VALIDATION: "输出完整性校验"
    - COMPLETED: "完成"
    - FAILED: "失败"
  transitions:
    INIT:
      - to: PROBLEM_ALIGNMENT
        trigger: workflow_started
    PROBLEM_ALIGNMENT:
      - to: EPIC_DESIGN
        trigger: problem_alignment_completed
      - to: FAILED
        trigger: problem_alignment_failed
    EPIC_DESIGN:
      - to: EPIC_IDENTITY_PREPARE
        trigger: epic_design_completed
      - to: FAILED
        trigger: epic_design_failed
    EPIC_IDENTITY_PREPARE:
      - to: EPIC_REVIEW
        trigger: epic_identity_prepare_completed
      - to: FAILED
        trigger: epic_identity_prepare_failed
    EPIC_REVIEW:
      - to: EPIC_ACCEPTANCE_AUTO_CHECK
        trigger: epic_review_completed
      - to: FAILED
        trigger: epic_review_failed
    EPIC_ACCEPTANCE_AUTO_CHECK:
      - to: EPIC_ACCEPTANCE_REVIEW
        trigger: epic_acceptance_auto_check_completed
      - to: FAILED
        trigger: epic_acceptance_auto_check_failed
    EPIC_ACCEPTANCE_REVIEW:
      - to: EPIC_DEFECT_FIX_LOOP
        trigger: epic_acceptance_review_completed
      - to: FAILED
        trigger: epic_acceptance_review_failed
    EPIC_DEFECT_FIX_LOOP:
      - to: EPIC_ACCEPTANCE_APPROVAL
        trigger: epic_defect_fix_loop_completed
      - to: FAILED
        trigger: epic_defect_fix_loop_failed
    EPIC_ACCEPTANCE_APPROVAL:
      - to: EPIC_IDENTITY_FORMALIZE
        trigger: epic_acceptance_approval_completed
      - to: FAILED
        trigger: epic_acceptance_approval_failed
    EPIC_IDENTITY_FORMALIZE:
      - to: EPIC_FREEZE
        trigger: epic_identity_formalize_completed
      - to: FAILED
        trigger: epic_identity_formalize_failed
    EPIC_FREEZE:
      - to: OUTPUT_VALIDATION
        trigger: epic_freeze_completed
      - to: FAILED
        trigger: epic_freeze_failed
    OUTPUT_VALIDATION:
      - to: COMPLETED
        trigger: output_validation_completed
      - to: FAILED
        trigger: output_validation_failed
