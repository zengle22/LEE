# Product SRC to EPIC Template v1.0
# 产品部门 L3 模板 - 从冻结 SRC 生成 EPIC

kind: l3_workflow_template
version: "1.0"
id: workflow.product.task.src_to_epic
name: Product SRC to EPIC
description: >
  将冻结后的 SRC 收敛为产品建设层的 EPIC。
  适用于多个 FEAT 共享同一业务目标、边界和优先级的场景。
  EPIC 的正式身份必须在对应 SRC 作用域内完成准备和定版。
  该文件是 checked-in workflow template，运行时实例由 Python runtime 动态生成。
owner: product-ai
tags: [product, workflow, l3, ssot, epic]

roles:
  agents:
    - agent.product.requirement_alignment
    - agent.product.epic_designer
    - agent.product.epic_reviewer
    - agent.governance.approval_reviewer
  skills: []
  gates:
    - gate.product.epic_freeze

overview:
  input_types:
    - type: src
      description: canonical SRC 主对象
      ssot_type: SRC
    - type: source_freeze
      description: 已冻结的 SRC 或其冻结视图
      ssot_type: SRC

  output:
    type: epic_freeze
    ssot_type: EPIC
    description: 冻结后的 EPIC 主对象或其冻结视图
    preferred_ref: epic_freeze_ref

stages:
  - id: src_to_epic_flow
    name: "SRC to EPIC Flow"
    kind: stage
    description: "从冻结 SRC 设计并冻结 EPIC"
    depends_on: []
    steps:
      - id: problem_alignment
        name: 问题空间对齐
        kind: agent
        agent_id: agent.product.requirement_alignment
        mandatory: true
        depends_on: []
        description: >
          将冻结后的 SRC 翻译为问题空间，明确边界、非目标和关键约束。
        inputs:
          - source: external
            type: [src, source_freeze]
            required: true
        outputs:
          - symbol: problem_definition
            contract: departments/product/contracts/problem-definition/v1/schema.json
            freeze: false
        config:
          strict_output_validation: true
      - id: epic_design
        name: EPIC 设计
        kind: agent
        agent_id: agent.product.epic_designer
        mandatory: true
        depends_on: [problem_alignment]
        description: >
          基于问题空间构建 EPIC。
          EPIC 必须覆盖多个可独立验收 FEAT，而不是单一功能点。
        inputs:
          - source: problem_definition
            required: true
        outputs:
          - symbol: epic_candidate
            contract: departments/product/contracts/epic-contract/v1/schema.json
            freeze: false
            ssot:
              identity_kind: ssot
              ssot_type: EPIC
              source_refs: [external]
        config:
          strict_output_validation: true
      - id: epic_identity_prepare
        name: EPIC 身份准备
        kind: agent
        agent_id: agent.governance.approval_reviewer
        mandatory: true
        depends_on: [epic_design]
        description: >
          在非 main 分支上为 EPIC candidate 建立 provisional identity，
          并绑定 source_freeze 提供的 src_root_id，形成稳定的评审输入。
        inputs:
          - source: epic_candidate
            required: true
          - source: external
            type: [source_freeze]
            required: true
        outputs:
          - symbol: epic_scoped_candidate
            contract: departments/product/contracts/epic-contract/v1/schema.json
            freeze: false
            ssot:
              identity_kind: ssot
              ssot_type: EPIC
              source_refs: [external]
      - id: epic_review
        name: EPIC 对齐评审
        kind: agent
        agent_id: agent.product.epic_reviewer
        mandatory: true
        depends_on: [epic_identity_prepare]
        description: >
          校验 EPIC 是否满足 SSOT 规则、价值边界和拆分合理性。
        inputs:
          - source: epic_scoped_candidate
            required: true
        outputs:
          - symbol: epic_review_report
            contract: departments/product/contracts/product-review-contract/v1/schema.json
            freeze: false
        config:
          strict_output_validation: true
          claude_code:
            read_only: true
      - id: epic_identity_formalize
        name: EPIC 身份定版
        kind: agent
        agent_id: agent.governance.approval_reviewer
        mandatory: true
        depends_on: [epic_review]
        description: >
          在 EPIC freeze 前，将 provisional EPIC 定版为 SRC scoped 正式身份，
          并完成同批次内的引用重写。
        inputs:
          - source: epic_scoped_candidate
            required: true
          - source: epic_review_report
            required: true
        outputs:
          - symbol: epic_formalized_candidate
            contract: departments/product/contracts/epic-contract/v1/schema.json
            freeze: false
            ssot:
              identity_kind: ssot
              ssot_type: EPIC
              source_refs: [external]
      - id: epic_freeze
        name: EPIC 冻结
        kind: gate
        mandatory: true
        depends_on: [epic_identity_formalize]
        description: >
          由产品负责人冻结 EPIC，确认业务目标、范围边界与拆分原则。
        inputs:
          - source: epic_formalized_candidate
            required: true
          - source: epic_review_report
            required: true
        outputs:
          - path: output/design-frozen/{project}-epic-freeze.yaml
            required: true
            freeze: true
            ssot:
              identity_kind: ssot
              ssot_type: EPIC
              derived_from: epic_candidate
        gate_rules:
          reviewers:
            - role: product_owner
          approval_criteria:
            - label: "EPIC 合法性"
              criteria: "EPIC 至少覆盖多个可独立验收 FEAT"
              required: true
            - label: "价值边界清晰"
              criteria: "目标、非目标、成功指标和约束完整"
              required: true
            - label: "可向下拆解"
              criteria: "下游 FEAT 可按验收边界继续拆解"
              required: true
        config:
          gate:
            type: human_approval
            gate_id: gate.product.epic_freeze
    step_order:
      - problem_alignment
      - epic_design
      - epic_identity_prepare
      - epic_review
      - epic_identity_formalize
      - epic_freeze

stage_order:
  - src_to_epic_flow

constraints:
  frozen_src_only: |
    src_to_epic 只接受已冻结 SRC 或其 canonical ref。
    不得在本流程中直接接收 raw requirement。

  src_scoped_epic_rule: |
    EPIC 必须绑定 source_freeze 提供的 src_root_id。
    freeze 前必须完成 EPIC 的 SRC 作用域 identity formalize。

  epic_rule_binding: |
    若范围只包含单一可交付功能，不得创建 EPIC，
    应直接走单 FEAT 特例流程。

instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
  context_fields:
    - source_freeze
    - source_freeze_ref
    - src_root_id
    - epic_freeze_ref
  output_fields:
    - epic_freeze

state_machine:
  states:
    - INIT: "初始化"
    - PROBLEM_ALIGNMENT: "问题空间对齐"
    - EPIC_DESIGN: "EPIC 设计"
    - EPIC_IDENTITY_PREPARE: "EPIC 身份准备"
    - EPIC_REVIEW: "EPIC 评审"
    - EPIC_IDENTITY_FORMALIZE: "EPIC 身份定版"
    - EPIC_FREEZE: "EPIC 冻结"
    - COMPLETED: "完成"
    - FAILED: "失败"
  transitions:
    INIT:
      - to: PROBLEM_ALIGNMENT
        trigger: workflow_started
    PROBLEM_ALIGNMENT:
      - to: EPIC_DESIGN
        trigger: problem_alignment_completed
      - to: FAILED
        trigger: problem_alignment_failed
    EPIC_DESIGN:
      - to: EPIC_IDENTITY_PREPARE
        trigger: epic_design_completed
      - to: FAILED
        trigger: epic_design_failed
    EPIC_IDENTITY_PREPARE:
      - to: EPIC_REVIEW
        trigger: epic_identity_prepare_completed
      - to: FAILED
        trigger: epic_identity_prepare_failed
    EPIC_REVIEW:
      - to: EPIC_IDENTITY_FORMALIZE
        trigger: epic_review_completed
      - to: FAILED
        trigger: epic_review_failed
    EPIC_IDENTITY_FORMALIZE:
      - to: EPIC_FREEZE
        trigger: epic_identity_formalize_completed
      - to: FAILED
        trigger: epic_identity_formalize_failed
    EPIC_FREEZE:
      - to: COMPLETED
        trigger: epic_freeze_completed
      - to: FAILED
        trigger: epic_freeze_failed
