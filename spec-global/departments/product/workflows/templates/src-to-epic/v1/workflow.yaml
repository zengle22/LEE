# Product SRC to EPIC Template v1.0
# 产品部门 L3 模板 - 从市场机会/原始需求生成 EPIC

kind: l3_workflow_template
version: "1.0"
id: workflow.product.task.src_to_epic
name: Product SRC to EPIC
description: >
  将任意原始输入先收敛并冻结为 SRC，
  再将冻结后的 SRC 收敛为产品建设层的 EPIC。
  适用于多个 FEAT 共享同一业务目标、边界和优先级的场景。
  该文件是 checked-in workflow template，运行时实例由 Python runtime 动态生成。
owner: product-ai
tags: [product, workflow, l3, ssot, epic]

roles:
  agents:
    - agent.analysis.product_goal
    - agent.product.requirement_alignment
    - agent.product.epic_designer
    - agent.review.requirement_reviewer
    - agent.governance.approval_reviewer
  skills: []
  gates:
    - gate.product.src_freeze
    - gate.product.epic_freeze

overview:
  input_types:
    - type: raw_requirement
      description: 原始需求描述
    - type: business_opportunity
      description: 商业机会或其冻结视图
      ssot_type: SRC

  output:
    type: epic_freeze
    ssot_type: EPIC
    description: 冻结后的 EPIC 主对象或其冻结视图

stages:
  - id: src_to_epic_flow
    name: "SRC to EPIC Flow"
    kind: stage
    description: "从原始输入收敛 SRC，再设计并冻结 EPIC"
    depends_on: []
    steps:
      - id: raw_input_intake
        name: 原始输入接入
        kind: agent
        agent_id: agent.analysis.product_goal
        mandatory: true
        depends_on: []
        description: >
          接收一句话、文章、客户反馈、会议结论或商业机会输入，
          保存原始内容和来源引用，形成待归一化输入对象。
        inputs:
          - source: external
            type: [raw_requirement, business_opportunity]
            required: true
        outputs:
          - symbol: raw_source_input
            contract: departments/product/contracts/raw-source-input-contract/v1/schema.json
            freeze: false
      - id: source_normalization
        name: 来源归一化
        kind: agent
        agent_id: agent.analysis.product_goal
        mandatory: true
        depends_on: [raw_input_intake]
        description: >
          将原始输入归一化为可审阅的 SRC candidate，
          提炼问题陈述、目标用户、触发场景、业务动因和关键约束。
        inputs:
          - source: raw_source_input
            required: true
        outputs:
          - symbol: normalized_src
            contract: departments/product/contracts/source-freeze-contract/v1/schema.json
            freeze: false
            ssot:
              identity_kind: ssot
              ssot_type: SRC
      - id: source_review
        name: SRC 对齐评审
        kind: agent
        agent_id: agent.review.requirement_reviewer
        mandatory: true
        depends_on: [source_normalization]
        description: >
          校验 SRC candidate 是否已具备足够稳定的问题定义和来源可追溯性，
          可作为后续 EPIC 的正式输入。
        inputs:
          - source: normalized_src
            required: true
        outputs:
          - symbol: source_review_report
            contract: departments/product/contracts/product-review-contract/v1/schema.json
            freeze: false
      - id: source_freeze
        name: SRC 冻结
        kind: gate
        mandatory: true
        depends_on: [source_review]
        description: >
          由产品负责人冻结正式 SRC。
          冻结后，后续 EPIC 设计只能引用该 SRC 版本，不允许直接回到原始输入。
        inputs:
          - source: normalized_src
            required: true
          - source: source_review_report
            required: true
        outputs:
          - path: output/design-frozen/{project}-src-freeze.yaml
            required: true
            freeze: true
            contract: departments/product/contracts/source-freeze-contract/v1/schema.json
            ssot:
              identity_kind: ssot
              ssot_type: SRC
              derived_from: normalized_src
        gate_rules:
          reviewers:
            - role: product_owner
          approval_criteria:
            - label: "来源可追溯"
              criteria: "原始输入来源和引用关系明确"
              required: true
            - label: "问题定义稳定"
              criteria: "问题陈述、目标用户、业务动因和关键约束完整"
              required: true
            - label: "适合进入 EPIC"
              criteria: "信息足以支撑后续 EPIC 设计"
              required: true
        config:
          gate:
            type: human_approval
            gate_id: gate.product.src_freeze
      - id: problem_alignment
        name: 问题空间对齐
        kind: agent
        agent_id: agent.product.requirement_alignment
        mandatory: true
        depends_on: [source_freeze]
        description: >
          将冻结后的 SRC 翻译为问题空间，明确边界、非目标和关键约束。
        inputs:
          - source: source_freeze
            required: true
        outputs:
          - symbol: problem_definition
            contract: departments/product/contracts/problem-definition/v1/schema.json
            freeze: false
      - id: epic_design
        name: EPIC 设计
        kind: agent
        agent_id: agent.product.epic_designer
        mandatory: true
        depends_on: [problem_alignment]
        description: >
          基于问题空间构建 EPIC。
          EPIC 必须覆盖多个可独立验收 FEAT，而不是单一功能点。
        inputs:
          - source: problem_definition
            required: true
        outputs:
          - symbol: epic_candidate
            contract: departments/product/contracts/epic-contract/v1/schema.json
            freeze: false
            ssot:
              identity_kind: ssot
              ssot_type: EPIC
              source_refs: [source_freeze]
      - id: epic_review
        name: EPIC 对齐评审
        kind: agent
        agent_id: agent.review.requirement_reviewer
        mandatory: true
        depends_on: [epic_design]
        description: >
          校验 EPIC 是否满足 SSOT 规则、价值边界和拆分合理性。
        inputs:
          - source: epic_candidate
            required: true
        outputs:
          - symbol: epic_review_report
            contract: departments/product/contracts/product-review-contract/v1/schema.json
            freeze: false
      - id: epic_freeze
        name: EPIC 冻结
        kind: gate
        mandatory: true
        depends_on: [epic_review]
        description: >
          由产品负责人冻结 EPIC，确认业务目标、范围边界与拆分原则。
        inputs:
          - source: epic_candidate
            required: true
          - source: epic_review_report
            required: true
        outputs:
          - path: output/design-frozen/{project}-epic-freeze.yaml
            required: true
            freeze: true
            ssot:
              identity_kind: ssot
              ssot_type: EPIC
              derived_from: epic_candidate
        gate_rules:
          reviewers:
            - role: product_owner
          approval_criteria:
            - label: "EPIC 合法性"
              criteria: "EPIC 至少覆盖多个可独立验收 FEAT"
              required: true
            - label: "价值边界清晰"
              criteria: "目标、非目标、成功指标和约束完整"
              required: true
            - label: "可向下拆解"
              criteria: "下游 FEAT 可按验收边界继续拆解"
              required: true
        config:
          gate:
            type: human_approval
            gate_id: gate.product.epic_freeze
    step_order:
      - raw_input_intake
      - source_normalization
      - source_review
      - source_freeze
      - problem_alignment
      - epic_design
      - epic_review
      - epic_freeze

stage_order:
  - src_to_epic_flow

constraints:
  src_freeze_first: |
    任意原始输入必须先完成 SRC freeze，
    才能进入 EPIC 设计。

  epic_rule_binding: |
    若范围只包含单一可交付功能，不得创建 EPIC，
    应直接走单 FEAT 特例流程。

instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
  context_fields:
    - raw_requirement
    - business_opportunity
  output_fields:
    - source_freeze
    - epic_freeze

state_machine:
  states:
    - INIT: "初始化"
    - RAW_INPUT_INTAKE: "原始输入接入"
    - SOURCE_NORMALIZATION: "来源归一化"
    - SOURCE_REVIEW: "SRC 评审"
    - SOURCE_FREEZE: "SRC 冻结"
    - PROBLEM_ALIGNMENT: "问题空间对齐"
    - EPIC_DESIGN: "EPIC 设计"
    - EPIC_REVIEW: "EPIC 评审"
    - EPIC_FREEZE: "EPIC 冻结"
    - COMPLETED: "完成"
    - FAILED: "失败"
