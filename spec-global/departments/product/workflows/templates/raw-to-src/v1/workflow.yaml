# Product Raw to SRC Template v1.0
# 产品部门 L3 模板 - 从任意原始输入归一化并冻结为 SRC

kind: l3_workflow_template
version: "1.0"
id: workflow.product.task.raw_to_src
name: Product Raw to SRC
description: >
  将任意原始输入收敛为正式 SRC 并完成冻结。
  该流程只负责源归一化和冻结，不承担 EPIC 语义建模。
  canonical path 上每次运行只允许产出 1 个与原始输入同题的 SRC。
  若输入包含多个独立问题域，流程必须显式返回拆分要求，而不是在 SRC 层自动扇出。
  同时负责建立下游需求链共用的 `src_root_id` 作用域上下文。
  该文件是 checked-in workflow template，运行时实例由 Python runtime 动态生成。
owner: product-ai
tags: [product, workflow, l3, ssot, src]

roles:
  agents:
    - agent.analysis.product_goal
    - agent.review.requirement_reviewer
    - agent.governance.approval_reviewer
  skills: []
  gates:
    - gate.product.src_freeze

overview:
  input_types:
    - type: raw_requirement
      description: 原始需求描述
    - type: business_opportunity
      description: 商业机会对象
    - type: business_opportunity_freeze
      description: 上游策略部门冻结后的商业机会视图

  output:
    type: source_freeze
    ssot_type: SRC
    description: 冻结后的 SRC 主对象或其冻结视图
    preferred_ref: source_freeze_ref

stages:
  - id: raw_to_src_flow
    name: "Raw to SRC Flow"
    kind: stage
    description: "从原始输入收敛、评审并冻结 SRC"
    depends_on: []
    steps:
      - id: raw_input_intake
        name: 原始输入接入
        kind: agent
        agent_id: agent.analysis.product_goal
        mandatory: true
        depends_on: []
        description: >
          接收一句话、文章、客户反馈、会议结论或商业机会输入，
          保存原始内容和来源引用，形成待归一化输入对象。
        inputs:
          - source: external
            type: [raw_requirement, business_opportunity, business_opportunity_freeze]
            required: true
        outputs:
          - symbol: raw_source_input
            contract: departments/product/contracts/raw-source-input-contract/v1/schema.json
            freeze: false
      - id: source_normalization
        name: 来源归一化
        kind: agent
        agent_id: agent.analysis.product_goal
        mandatory: true
        depends_on: [raw_input_intake]
        description: >
          将原始输入归一化为可审阅的 SRC candidate，
          提炼问题陈述、目标用户、触发场景、业务动因和关键约束。
          输出必须保持与原始输入同题，不得把 intake 流程、schema 复用策略
          或工作流方法论本身改写成 SRC 正文主题。
        inputs:
          - source: raw_source_input
            required: true
        outputs:
          - symbol: normalized_src
            contract: departments/product/contracts/source-freeze-contract/v1/schema.json
            freeze: false
            ssot:
              identity_kind: ssot
              ssot_type: SRC
      - id: source_review
        name: SRC 对齐评审
        kind: agent
        agent_id: agent.review.requirement_reviewer
        mandatory: true
        depends_on: [source_normalization]
        description: >
          校验 SRC candidate 是否已具备足够稳定的问题定义和来源可追溯性，
          可作为后续下游流程的正式输入。
        inputs:
          - source: normalized_src
            required: true
        outputs:
          - symbol: source_review_report
            contract: departments/product/contracts/product-review-contract/v1/schema.json
            freeze: false
        config:
          claude_code:
            read_only: true
      - id: source_freeze
        name: SRC 冻结
        kind: gate
        mandatory: true
        depends_on: [source_review]
        description: >
          由产品负责人冻结正式 SRC。
          冻结后，下游流程只能引用该 SRC 版本，不允许直接回到原始输入。
          该步骤同时产出 `src_root_id`，作为后续 EPIC / FEAT / TECH / TASK 的根作用域。
        inputs:
          - source: normalized_src
            required: true
          - source: source_review_report
            required: true
        outputs:
          - path: output/design-frozen/{project}-src-freeze.yaml
            required: true
            freeze: true
            contract: departments/product/contracts/source-freeze-contract/v1/schema.json
            ssot:
              identity_kind: ssot
              ssot_type: SRC
              derived_from: normalized_src
        gate_rules:
          reviewers:
            - role: product_owner
          approval_criteria:
            - label: "来源可追溯"
              criteria: "原始输入来源和引用关系明确"
              required: true
            - label: "问题定义稳定"
              criteria: "问题陈述、目标用户、业务动因和关键约束完整"
              required: true
            - label: "可独立复用"
              criteria: "SRC 已具备独立 replay、单测和复用条件"
              required: true
        config:
          gate:
            type: human_approval
            gate_id: gate.product.src_freeze
    step_order:
      - raw_input_intake
      - source_normalization
      - source_review
      - source_freeze

stage_order:
  - raw_to_src_flow

constraints:
  src_only_boundary: |
    该流程只负责 raw -> SRC。
    不得在本流程中生成 EPIC、FEAT 或 TASK。

  single_src_per_run: |
    canonical raw_to_src path 每次运行只允许产出并冻结 1 个 SRC。
    不得在 source_normalization 或 source_freeze 阶段自动扇出多个 SRC 文件。

  no_auto_split_before_src_freeze: |
    若原始输入包含多个独立问题域，流程必须返回“需要先拆分原始输入”或等价阻塞信号。
    多主题拆分不属于 canonical raw_to_src 冻结路径。

  semantic_fidelity_required: |
    生成的 SRC 必须保持与原始输入同题。
    不得将 intake、schema、复用策略、workflow 方法论或过程说明替代为源问题定义。

  src_root_scope_required: |
    source_freeze 完成后必须产出稳定的 src_root_id。
    下游需求链对象必须通过该作用域建立目录路由和正式身份。

instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
  context_fields:
    - raw_requirement
    - business_opportunity
    - business_opportunity_freeze
    - source_freeze_ref
    - src_root_id
  output_fields:
    - source_freeze
    - src_root_id
