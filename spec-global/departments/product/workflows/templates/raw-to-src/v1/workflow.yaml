# Product Raw to SRC Template v1.0
# 产品部门 L3 模板 - 从任意原始输入归一化并冻结为 SRC

kind: l3_workflow_template
version: "1.0"
id: workflow.product.task.raw_to_src
name: Product Raw to SRC
description: >
  将任意原始输入收敛为正式 SRC 并完成冻结。
  该流程只负责源归一化和冻结，不承担 EPIC 语义建模。
  canonical path 上每次运行只允许产出 1 个与原始输入同题的 SRC。
  若输入包含多个独立问题域，流程必须显式返回拆分要求，而不是在 SRC 层自动扇出。
  同时负责建立下游需求链共用的 `src_root_id` 作用域上下文。
  该文件是 checked-in workflow template，运行时实例由 Python runtime 动态生成。
owner: product-ai
tags: [product, workflow, l3, ssot, src]

roles:
  agents:
    - agent.analysis.product_goal
    - agent.review.requirement_reviewer
    - agent.governance.approval_reviewer
    - agent.governance.acceptance_checker
    - agent.review.acceptance_reviewer
    - agent.governance.defect_fixer
  skills: []
  gates:
    - gate.product.src_acceptance_approval
    - gate.product.src_freeze

overview:
  input_types:
    - type: adr
      description: 需要桥接进入 SRC 的治理 ADR
    - type: raw_requirement
      description: 原始需求描述
    - type: business_opportunity
      description: 商业机会对象
    - type: business_opportunity_freeze
      description: 上游策略部门冻结后的商业机会视图

  output:
    type: source_freeze
    ssot_type: SRC
    description: 冻结后的 SRC 主对象或其冻结视图
    preferred_ref: source_freeze_ref

stages:
  - id: raw_to_src_flow
    name: "Raw to SRC Flow"
    kind: stage
    description: "从原始输入收敛、评审并冻结 SRC"
    depends_on: []
    steps:
      - id: input_validation
        name: 输入合法性校验
        kind: agent
        agent_id: agent.governance.input_validator
        mandatory: true
        depends_on: []
        description: >
          校验输入文件是否已在 SSOT 链上。如果输入文件已经具有 ssot_type 且 status 为
          frozen/active/deprecated，则拒绝执行，避免重复生成 SRC。
          同时校验输入不能是 gate-materialize 等占位对象。
        inputs:
          - source: external
            type: [adr, raw_requirement, business_opportunity, business_opportunity_freeze]
            required: true
        outputs:
          - symbol: input_validation_result
            contract: departments/product/contracts/validation-result-contract/v1/schema.json
            freeze: false
        config:
          validation:
            rules:
              - name: check_not_ssot_object
                description: "输入不能是已存在的 SSOT 对象"
              - name: check_not_gate_materialize
                description: "输入不能是 gate-materialize 占位对象"
          on_failure: fail  # 输入校验失败直接终止，不重试

      - id: raw_input_intake
        name: 原始输入接入
        kind: agent
        agent_id: agent.analysis.product_goal
        mandatory: true
        depends_on: [input_validation]
        description: >
          接收一句话、文章、客户反馈、会议结论、治理 ADR 或商业机会输入，
          保存原始内容和来源引用，形成待归一化输入对象。
        inputs:
          - source: external
            type: [adr, raw_requirement, business_opportunity, business_opportunity_freeze]
            required: true
        outputs:
          - symbol: raw_source_input
            contract: departments/product/contracts/raw-source-input-contract/v1/schema.json
            freeze: false
      - id: source_normalization
        name: 来源归一化
        kind: agent
        agent_id: agent.analysis.product_goal
        mandatory: true
        depends_on: [raw_input_intake]
        description: >
          将原始输入归一化为可审阅的 SRC candidate，
          提炼问题陈述、目标用户、触发场景、业务动因和关键约束。
          若输入是需要桥接进入主链的 ADR，输出必须保持 thin SRC 语义，
          并显式给出 `source_kind = governance_bridge_src` 与最小 `bridge_context`。
          输出必须保持与原始输入同题，不得把 intake 流程、schema 复用策略
          或工作流方法论本身改写成 SRC 正文主题。
        inputs:
          - source: raw_source_input
            required: true
        outputs:
          - symbol: normalized_src
            contract: departments/product/contracts/source-freeze-contract/v1/schema.json
            freeze: false
            ssot:
              identity_kind: ssot
              ssot_type: SRC
      - id: source_review
        name: SRC 对齐评审
        kind: agent
        agent_id: agent.review.requirement_reviewer
        mandatory: true
        depends_on: [source_normalization]
        description: >
          校验 SRC candidate 是否已具备足够稳定的问题定义和来源可追溯性，
          可作为后续下游流程的正式输入。
        inputs:
          - source: normalized_src
            required: true
        outputs:
          - symbol: source_review_report
            contract: departments/product/contracts/product-review-contract/v1/schema.json
            freeze: false
        config:
          claude_code:
            read_only: true

      # ========== ADR-025 验收卡点开始 ==========
      - id: src_acceptance_auto_check
        name: SRC 验收 - 自动检查
        kind: agent
        agent_id: agent.governance.acceptance_checker
        mandatory: true
        depends_on: [source_review]
        description: >
          根据 ADR-025 执行 SRC 自动验收检查。
          包括 Schema 验证、Contract 验证、完整性检查、依赖解析。
          输出 auto_check_result，作为 Review Gate 的输入。
        inputs:
          - source: normalized_src
            required: true
          - source: source_review_report
            required: true
        outputs:
          - symbol: src_auto_check_result
            contract: departments/product/contracts/acceptance-check-result-contract/v1/schema.json
            freeze: false
        config:
          acceptance:
            version: "1.0"
            check_type: auto
            dimensions:
              - schema_validation
              - contract_validation
              - completeness_check
              - dependency_resolution

      - id: src_acceptance_review
        name: SRC 验收 - 人工评审
        kind: agent
        agent_id: agent.review.acceptance_reviewer
        mandatory: true
        depends_on: [src_acceptance_auto_check]
        description: >
          根据 ADR-025 执行 SRC 人工验收评审。
          包括六大维度：功能逻辑闭环、用户故事体验、功能完整性、逻辑漏洞、行业差距、改进空间。
          输出 acceptance_report 和 defect_list。
        inputs:
          - source: normalized_src
            required: true
          - source: src_auto_check_result
            required: true
        outputs:
          - symbol: src_acceptance_report
            contract: departments/product/contracts/acceptance-report-contract/v1/schema.json
            freeze: false
          - symbol: src_defect_list
            contract: departments/product/contracts/defect-list-contract/v1/schema.json
            freeze: false
        config:
          acceptance:
            version: "1.0"
            check_type: review
            dimensions:
              - functional_closure
              - user_story_experience
              - feature_completeness
              - logic_vulnerability
              - industry_gap
              - improvement_opportunities
            gate_type: review
            meeting_format: sync_60min  # SRC 采用同步会议 (60 分钟)
            reviewers:
              - role: product_owner
              - role: tech_lead

      # ========== ADR-025 Fix Loop 开始 ==========
      - id: src_defect_fix_loop
        name: SRC 验收 - 缺陷修复 Loop
        kind: agent
        agent_id: agent.governance.defect_fixer
        mandatory: true
        depends_on: [src_acceptance_review]
        description: >
          根据 ADR-025 执行缺陷修复循环。
          检查 P0/P1 缺陷，如果存在则修复或标记为延期。
          输出 defect_fix_report 和 updated_defect_list。

          Fix Loop 规则：
          - P0 缺陷：必须修复，不允许绕过
          - P1 缺陷：原则必须修复，特殊情况需 PO+Tech Lead 决策可延期
          - P2/P3 缺陷：记录为技术债务，纳入 backlog，不影响 Approval Gate

          循环退出条件：
          - P0 缺陷数量 = 0
          - P1 缺陷数量 = 0 或所有 P1 缺陷都有延期审批
        inputs:
          - source: src_acceptance_report
            required: true
          - source: src_defect_list
            required: true
          - source: normalized_src
            required: true
        outputs:
          - symbol: src_defect_fix_report
            contract: departments/product/contracts/defect-fix-report-contract/v1/schema.json
            freeze: false
          - symbol: src_updated_defect_list
            contract: departments/product/contracts/defect-list-contract/v1/schema.json
            freeze: false
        config:
          acceptance:
            version: "1.0"
            fix_policy:
              p0_policy: must_fix  # P0 必须修复
              p1_policy: fix_or_defer_with_approval  # P1 必须修复或经审批延期
              p2_policy: defer_to_backlog  # P2 纳入 backlog
              p3_policy: defer_to_backlog  # P3 纳入 backlog
            exit_conditions:
              - p0_count_equals_zero
              - p1_count_equals_zero_or_all_deferred_with_approval
            max_iterations: 3  # 最多修复 3 轮
        # ========== ADR-025 Fix Loop 结束 ==========

      - id: src_acceptance_approval_gate
        name: SRC 验收 - 审批 Gate
        kind: gate
        mandatory: true
        depends_on: [src_defect_fix_loop]
        description: >
          根据 ADR-025 执行 SRC 验收审批。
          验证 P0/P1 缺陷已修复，批准验收报告。
          只有通过审批后，才能进入 SRC 冻结步骤。
        inputs:
          - source: normalized_src
            required: true
          - source: src_acceptance_report
            required: true
          - source: src_defect_list
            required: true
        outputs:
          - symbol: src_acceptance_approval
            contract: departments/product/contracts/gate-result-contract/v1/schema.json
            freeze: false
        config:
          gate:
            type: human_approval
            gate_id: gate.product.src_acceptance_approval
        gate_rules:
          reviewers:
            - role: product_owner
          approval_criteria:
            - label: "P0/P1 缺陷清零"
              criteria: "所有 P0/P1 缺陷已修复或延期有理据"
              required: true
            - label: "验收报告完整"
              criteria: "六大维度评审完成，报告结构完整"
              required: true
            - label: "行业差距分析"
              criteria: "至少 3 个对标对象，差距程度量化"
              required: true
        # ========== ADR-025 验收卡点结束 ==========

      - id: source_freeze
        name: SRC 冻结
        kind: gate
        mandatory: true
        depends_on: [src_acceptance_approval_gate, src_defect_fix_loop]
        description: >
          由产品负责人冻结正式 SRC。
          冻结前必须通过 ADR-025 验收卡点（src_acceptance_approval_gate）。
          冻结后，下游流程只能引用该 SRC 版本，不允许直接回到原始输入。
          该步骤同时产出 `src_root_id`，作为后续 EPIC / FEAT / TECH / TASK 的根作用域。
        inputs:
          - source: normalized_src
            required: true
          - source: source_review_report
            required: true
          - source: src_acceptance_approval
            required: true
          - source: src_acceptance_report
            required: true
          - source: src_defect_fix_report
            required: true
          - source: src_updated_defect_list
            required: true
        outputs:
          - path: output/design-frozen/{project}-src-freeze.yaml
            required: true
            freeze: true
            contract: departments/product/contracts/source-freeze-contract/v1/schema.json
            ssot:
              identity_kind: ssot
              ssot_type: SRC
              derived_from: normalized_src
        gate_rules:
          reviewers:
            - role: product_owner
          approval_criteria:
            - label: "来源可追溯"
              criteria: "原始输入来源和引用关系明确"
              required: true
            - label: "问题定义稳定"
              criteria: "问题陈述、目标用户、业务动因和关键约束完整"
              required: true
            - label: "Bridge 语义完整"
              criteria: "若为 ADR 桥接 thin SRC，则已显式记录 governed_by_adrs、change_scope、expected_downstream_objects、acceptance_impact 与 non_goals"
              required: false
            - label: "可独立复用"
              criteria: "SRC 已具备独立 replay、单测和复用条件"
              required: true
            - label: "验收通过"
              criteria: "ADR-025 验收卡点通过 (src_acceptance_approval = approve)"
              required: true
        config:
          gate:
            type: human_approval
            gate_id: gate.product.src_freeze

      - id: output_validation
        name: 输出完整性校验
        kind: agent
        agent_id: agent.governance.output_validator
        mandatory: true
        depends_on: [source_freeze]
        description: >
          对落盘的 SRC 文件进行全面校验，确保 SSOT 字段完整有效。
          校验失败则拒绝放行，触发重跑（最多3次），3次失败则整体流程失败。
        inputs:
          - source: source_freeze
            required: true
        outputs:
          - symbol: output_validation_result
            contract: departments/product/contracts/validation-result-contract/v1/schema.json
            freeze: false
        config:
          validation:
            rules:
              - name: check_ssot_header
                description: "SSOT Header 完整性校验"
              - name: check_workflow_instance_id
                description: "workflow_instance_id 真实性校验"
              - name: check_content_integrity
                description: "内容完整性校验"
              - name: check_source_refs
                description: "来源引用校验"
              - name: check_id_consistency
                description: "ID 一致性校验"
          retry_policy:
            max_attempts: 3
          backoff: exponential  # 指数退避
          on_retry: "重新执行 source_normalization + source_review + source_freeze"
          on_max_retry_exceeded: fail  # 3次失败则整体流程失败
        on_failure: retry  # 校验失败触发重试

    step_order:
      - input_validation
      - raw_input_intake
      - source_normalization
      - source_review
      - src_acceptance_auto_check
      - src_acceptance_review
      - src_defect_fix_loop
      - src_acceptance_approval_gate
      - source_freeze
      - output_validation

stage_order:
  - raw_to_src_flow

constraints:
  src_only_boundary: |
    该流程只负责 raw -> SRC。
    不得在本流程中生成 EPIC、FEAT 或 TASK。

  single_src_per_run: |
    canonical raw_to_src path 每次运行只允许产出并冻结 1 个 SRC。
    不得在 source_normalization 或 source_freeze 阶段自动扇出多个 SRC 文件。

  no_auto_split_before_src_freeze: |
    若原始输入包含多个独立问题域，流程必须返回”需要先拆分原始输入”或等价阻塞信号。
    多主题拆分不属于 canonical raw_to_src 冻结路径。

  semantic_fidelity_required: |
    生成的 SRC 必须保持与原始输入同题。
    不得将 intake、schema、复用策略、workflow 方法论或过程说明替代为源问题定义。

  thin_src_bridge_required: |
    若原始输入是会触发主链变化的 ADR，则输出必须是 governance_bridge_src 语义，
    至少显式表达 governed_by_adrs、change_scope、expected_downstream_objects、
    acceptance_impact 与 non_goals。

  src_root_scope_required: |
    source_freeze 完成后必须产出稳定的 src_root_id。
    下游需求链对象必须通过该作用域建立目录路由和正式身份。

  input_ssot_guard: |
    输入文件必须是原始需求，不能是已在 SSOT 链上的对象。
    如果输入文件具有 ssot_type 字段且 status 为 frozen/active/deprecated，
    必须立即拒绝执行，返回明确的错误信息指引用户使用正确的下游流程。

  # ========== ADR-025 验收卡点约束 ==========
  adr025_acceptance_required: |
    根据 ADR-025，SRC 冻结前必须通过验收卡点：
    - src_acceptance_auto_check: 自动检查（Schema/Contract/Completeness/Dependency）
    - src_acceptance_review: 人工评审（六大维度）
    - src_acceptance_approval_gate: 审批 Gate（P0/P1 清零）
    任何一步失败都不得进入 source_freeze 步骤。

  adr025_p0_p1_defect_policy: |
    P0/P1 缺陷处理政策：
    - P0 缺陷：必须修复，不允许绕过
    - P1 缺陷：原则必须修复，特殊情况需 PO + Tech Lead 共同决策可延期
    - P2/P3 缺陷：记录为技术债务，纳入 backlog
    source_freeze 前必须确认所有 P0/P1 缺陷已修复或有明确的延期理据。

  adr025_acceptance_report_required: |
    验收报告是 source_freeze 的必要输入：
    - src_acceptance_report: 包含六大维度评审结果和缺陷列表
    - 验收报告必须存储在 .artifacts/active/product/src/{src_id}/acceptance-report-v{version}.yaml
    - 验收报告必须被 gate record 引用

  # ========== 结束 ADR-025 验收卡点约束 ==========

  output_validation_required: |
    落盘的 SRC 文件必须通过全面的输出校验，包括：
    - SSOT Header 完整性（id, ssot_type, status, version, title, workflow_instance_id）
    - workflow_instance_id 真实性（非占位符，数据库中存在）
    - 内容完整性（必须包含问题陈述、目标用户、业务动因、关键约束）
    - 来源引用完整性（source_refs 非空）
    - ID 一致性（文件内 id 与文件名一致）
    校验失败触发重试（最多3次），3次失败后整体流程失败。

  retry_policy: |
    output_validation 失败时的重试策略：
    - 最大重试次数：3次
    - 重试范围：从 source_normalization 步骤重新执行
    - 退避策略：指数退避（1min, 2min, 4min）
    - 超过最大重试次数：标记整个 raw_to_src workflow 为失败状态

instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
  context_fields:
    - adr
    - raw_requirement
    - business_opportunity
    - business_opportunity_freeze
    - source_freeze_ref
    - src_root_id
  output_fields:
    - source_freeze
    - src_root_id
