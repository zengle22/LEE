      ssot:
        identity_kind: ssot
        ssot_type: FEAT
        parent: epic-20250310-001
        derived_from: epic-20250310-001#scope
    - feat_id: FEAT-003
      title: AI 销售会话智能 - 内容提取
      goal: 从销售通话和客户沟通记录中自动提取关键业务信息，形成结构化客户画像
      user_value: 从销售通话和客户沟通记录中自动提取关键业务信息（需求、预算、决策人、时间线等），形成结构化客户画像
      inputs:
        - 通话文字稿
        - 邮件内容
        - 客户历史档案
      processing:
        - 实体识别（NER）
        - 信息抽取
        - 关键信息结构化
        - 客户画像构建
      outputs:
        - 结构化客户画像（需求、预算、痛点、决策人等字段）
        - 提取结果编辑界面
        - 客户档案同步
      user_stories:
        - as_a: 销售人员
          i_want: 从通话记录中自动提取客户关键信息
          so_that: 我可以快速建立完整的客户画像，减少手动录入时间
      acceptance_criteria:
        - 系统能从文字记录中提取至少 10 个关键业务实体
        - 提取结果可编辑
        - 编辑后可同步到客户档案
      acceptance_checks:
        - id: AC-001
          scenario: 系统提取关键业务实体
          given: 用户上传通话文字稿
          when: 点击提取按钮
          then: 系统返回至少 10 个关键业务实体
          trace_hints:
            - TECH
            - TASK
            - TESTSET
        - id: AC-002
          scenario: 提取结果可编辑并同步
          given: 提取结果已生成
          when: 用户编辑内容后点击保存
          then: 内容保存成功并同步到客户档案
          trace_hints:
            - UI
            - TECH
            - TESTSET
      dependencies:
        - FEAT-002
      non_goals:
        - 不提供 OCR 文档解析
        - 不包含情感分析
