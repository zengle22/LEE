business_output:
  epic_ref: epic-20250310-001
  feat_specs:
    - feat_id: FEAT-001
      title: 基础用户认证与账户管理
      goal: 为中端市场客户提供安全的账户注册、登录和基础账户管理能力，确保只有授权用户才能访问 AI 销售助手平台
      user_value: 为中端市场客户提供安全的账户注册、登录和基础账户管理能力，确保只有授权用户才能访问 AI 销售助手平台
      inputs:
        - 用户邮箱/手机号
        - 用户密码
        - 账户基本信息（姓名、公司名称）
      processing:
        - 用户身份验证
        - 密码加密存储
        - JWT token 生成
        - 会话管理
        - 账户信息存储
      outputs:
        - JWT access token
        - JWT refresh token
        - 用户 profile 信息
        - 登录状态
      user_stories:
        - as_a: 新客户
          i_want: 快速注册账户并登录系统
          so_that: 我可以立即开始使用 AI 销售助手
        - as_a: 已注册用户
          i_want: 修改个人账户信息
          so_that: 保持我的账户信息最新
      acceptance_criteria:
        - 用户可在 2 分钟内完成注册并登录系统
        - 登录后能查看个人账户信息
        - 用户可编辑个人账户信息
        - JWT token 有效期为 24 小时
      acceptance_checks:
        - id: AC-001
          scenario: 用户成功注册并登录系统
          given: 用户在注册页面输入有效邮箱和密码
          when: 点击注册按钮并完成验证
          then: 系统创建账户并返回 JWT token，用户跳转至首页
          trace_hints:
            - UI
            - TECH
            - TASK
            - TESTSET
        - id: AC-002
          scenario: 用户使用邮箱密码登录
          given: 用户已注册账户
          when: 输入正确邮箱和密码后点击登录
          then: 系统验证通过，返回 JWT token 并跳转至首页
          trace_hints:
            - UI
            - TECH
            - TASK
            - TESTSET
        - id: AC-003
          scenario: 用户查看和编辑账户信息
          given: 用户已登录系统
          when: 点击账户设置页面
          then: 显示当前账户信息，用户可编辑并保存
          trace_hints:
            - UI
            - TECH
            - TESTSET
      dependencies: []
      non_goals:
        - 不提供 SSO 企业联合登录
        - 不提供多租户隔离
        - 不包含权限细粒度管理
      priority: P0
      delivery_slice: mvp
      lifecycle_status: draft
      derived_object_expectations:
        task_required: true
        testset_required: true
        testset_owner: qa
        qa_seed_required: true
      source_refs:
        - epic-20250310-001#scope
      ssot:
        identity_kind: ssot
        ssot_type: FEAT
        parent: epic-20250310-001
        derived_from: epic-20250310-001#scope
    - feat_id: FEAT-002
      title: AI 销售会话智能 - 实时通话辅助
      goal: 销售人员在进行客户电话沟通时，可实时获得 AI 辅助建议、关键信息提取和下一步行动推荐，提升通话效率和专业度
      user_value: 销售人员在进行客户电话沟通时，可实时获得 AI 辅助建议、关键信息提取和下一步行动推荐，提升通话效率和专业度
      inputs:
        - 通话音频流/实时文字输入
        - 客户背景信息
        - 销售话术模板库
      processing:
        - 语音识别（STT）
        - NLP 意图分析
        - 上下文理解
        - 实时建议生成
        - 关键信息提取
      outputs:
        - 实时辅助建议面板
        - 通话摘要（含关键要点）
        - 下一步行动推荐
        - 行动项清单
      user_stories:
        - as_a: 销售人员
          i_want: 在与客户通话时获得实时 AI 建议
          so_that: 我可以更专业地回应客户，提升成交率
      acceptance_criteria:
        - 销售人员在通话中能收到 AI 实时建议
        - 通话结束后自动生成包含关键要点和行动项的摘要
        - 建议响应时间小于 3 秒
      acceptance_checks:
        - id: AC-001
          scenario: 销售人员在通话中获得实时 AI 建议
          given: 销售人员在通话中
          when: 输入客户语音或文字内容
          then: 系统在 3 秒内返回相关建议
          trace_hints:
            - UI
            - TECH
            - TASK
            - TESTSET
        - id: AC-002
          scenario: 通话结束后生成摘要
          given: 通话已结束
          when: 用户点击生成摘要
          then: 系统返回包含关键要点和行动项的摘要
          trace_hints:
            - UI
            - TECH
            - TASK
            - TESTSET
      dependencies:
        - FEAT-001
      non_goals:
        - 不提供通话录音存储
        - 不包含视频会议辅助
        - 不支持多语言实时翻译
      priority: P0
      delivery_slice: mvp
      lifecycle_status: draft
      derived_object_expectations:
        task_required: true
        testset_required: true
        testset_owner: qa
        qa_seed_required: true
      source_refs:
