    - feat_id: FEAT-004
      title: AI 销售线索评分与优先级排序
      goal: 帮助销售团队自动评估和排序潜在客户，根据多维度因素给出优先级建议
      user_value: 帮助销售团队自动评估和排序潜在客户，根据多维度因素给出优先级建议，让销售资源聚焦于最高价值机会
      inputs:
        - 潜在客户基础信息（公司规模、行业、职位等）
        - 行为数据（官网访问、邮件互动）
        - 历史成交数据
      processing:
        - 多维度评分模型计算
        - 优先级算法
        - 线索排序
      outputs:
        - 线索评分（0-100）
        - 优先级标签（高/中/低）
        - 排序后的线索列表
        - 评分解释
      acceptance_criteria:
        - 系统对每条线索给出 0-100 评分
        - 评分解释清晰可解释
        - 高优先级线索自动排在列表前
      acceptance_checks:
        - id: AC-001
          scenario: 系统生成线索评分
          given: 潜在客户基础信息和行为数据
          when: 点击评分按钮
          then: 系统返回 0-100 的评分
          trace_hints:
            - TECH
            - TASK
            - TESTSET
        - id: AC-002
          scenario: 高优先级线索排在前面
          given: 多条已评分的线索
          when: 查看线索列表
          then: 高优先级线索自动排在列表最前
          trace_hints:
            - UI
            - TECH
            - TESTSET
      dependencies:
