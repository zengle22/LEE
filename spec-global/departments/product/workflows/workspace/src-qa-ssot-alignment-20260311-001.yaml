project: qa-ssot-alignment
business_opportunity:
  source_id: SRC-QA-SSOT-001
  title: QA 部门接入升级版 SSOT 的链路重构需求
  problem_statement: >
    QA 当前已具备 Test Set 生产、执行与结果收敛能力，但正式 SSOT 主链仍停留在
    “TESTSET 局部对齐、TESTPLAN/TASK/REPORT 未 release 化”的状态，导致 test set 及其派生产物
    无法稳定进入升级后的 RELEASE -> PLAN -> TASK -> REPORT/EVI 判定链。
  target_user:
    - QA department
    - product department
    - delivery governance maintainers
    - release gate reviewers
  trigger_context: >
    基于 ADR-007 的系统梳理，需要验证 product workflow 是否能把该治理主题稳定收敛为
    SRC -> EPIC -> FEAT -> delivery prep，并为后续 QA TESTSET / TESTPLAN 改造提供正式输入。
  business_motivation: >
    本需求要解决的是 QA workflow 与升级后 SSOT 三轴模型之间的结构错位，
    不是补一篇说明文档。若不完成链路重构，QA 侧所有 test set、test plan、execution report
    仍将停留在局部文件级追溯，不能进入 release 级 go/no-go 判定。
  constraints:
    - TESTSET 必须且只能绑定单一 FEAT
    - TESTPLAN 必须挂在 RELEASE 下，不能继续只是非 SSOT 测试计划文档
    - QA 执行入口必须收敛到 TESTPLAN 下的 TASK
    - TSE、runner output、logs、screenshots 只能作为运行事实和证据，不能替代 REPORT
    - BUG、REPORT、EVI 必须反查到 RELEASE、TESTPLAN、TASK、TESTSET、FEAT
    - Product workflow template 与 runtime instance 边界不能被破坏
    - ADR 作为治理约束输入，不能直接替代业务主链对象
  source_refs:
    - ADR-007
  governing_adrs:
    - ADR-001
    - ADR-003
  decision_refs:
    - ADR-001
    - ADR-003
  decision_constraints:
    - 需求轴、交付轴、证据轴必须显式分层
    - 正式交付只能通过 RELEASE -> PLAN -> TASK 进入执行
    - TESTSET 由 FEAT 派生，QA 不得从 EPIC 直接生成测试真源
  architecture_constraints:
    - QA 主链目标为 FEAT -> TESTSET -> TC、RELEASE -> TESTPLAN -> TASK、TASK/TC/TSE -> BUG/REPORT/EVI
    - TESTPLAN/TASK/REPORT 需要完成 release 化，不能停留在 test_run 本地对象层
  process_constraints:
    - 本轮先验证 product workflow 稳定性，再进入 QA contract/workflow 改造
    - delivery prep 输出必须能作为 QA 派生 TESTSET 与 TESTPLAN 的 seed
  freeze_meta:
    status: draft
  ssot:
    identity_kind: ssot
    ssot_type: SRC
    derived_from: ADR-007
