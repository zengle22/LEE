business_opportunity:
  source_id: SRC-001
  title: CLI 命令分层与 SSOT 物化边界治理需求
  problem_statement: >
    LEE 当前同时暴露 workflow 主入口和 ssot create 直写入口，导致正式 SSOT 对象可绕过
    review、gate、freeze 与 source chain 约束直接落盘，命令面与治理面错位。
  target_user:
    - LEE CLI 普通使用者
    - 产品与治理链路维护者
    - Spec/SSOT 维护者
  trigger_context: >
    在推进 CLI 分层、gate 三分类与 freeze ref 语义时，formal SSOT 的生成边界仍未被
    workflow 默认接管，需要将低层物化命令从主入口中剥离。
  business_motivation: >
    本需求要解决的不是单纯的命令体验问题，而是 formal object 可追溯性与治理一致性问题。
    如果不治理，registry 与 spec 中的对象会持续出现“已创建但未经过正式流程”的状态。
  constraints:
    - 不删除 ssot create，但需降级为 internal/admin/maintenance 命令
    - 面向用户的正式创建入口必须走 workflow 或高层 alias
    - ADR 不直接替代 SRC，治理型需求仍先补薄 SRC
    - formal SSOT ID 分配应与 freeze/approval 边界对齐
    - 不能破坏 workflow template 与 runtime instance 的边界
  source_refs:
    - SRC-001
    - ADR-006
  freeze_meta:
    status: draft
  ssot:
    identity_kind: ssot
    ssot_type: SRC
    derived_from: SRC-001
