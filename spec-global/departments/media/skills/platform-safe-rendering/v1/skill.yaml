# Platform Safe Rendering Skill Specification v1.0
# 平台安全渲染技能规范

kind: skill
version: 1.0

# ============================================
# 基础标识
# ============================================
id: skill.media.platform_safe_rendering
name: Platform Safe Rendering
description: >
  确保渲染的 HTML/CSS 符合目标平台的安全规范。
  包括标签白名单、样式长度限制、禁用危险元素等。
owner: media-ai
tags: [media, platform, safety, rendering]

# ============================================
# 接口定义
# ============================================
interface:
  inputs:
    type: object
    required: [html_content, platform]
    properties:
      html_content:
        type: string
        description: 待检查的 HTML 内容
      platform:
        type: string
        enum: [wechat, xhs, notion, feishu, generic]

  outputs:
    type: object
    required: [is_safe, violations, sanitized_content]
    properties:
      is_safe:
        type: boolean
        description: 是否符合平台规范
      violations:
        type: array
        description: 违规项列表
        items:
          type: object
          properties:
            type:
              type: string
            description:
              type: string
            location:
              type: string
      sanitized_content:
        type: string
        description: 清理后的内容

# ============================================
# 平台安全规则
# ============================================
platform_rules:
  wechat:
    # 公众号编辑器不支持的标签（会破坏排版）
    allowed_tags:
      - span       # 内联容器（关键！用于强调色）
      - p          # 段落
      - br         # 换行
      - h1         # 一级标题
      - h2         # 二级标题
      - h3         # 三级标题
      - strong     # 加粗
      - b          # 加粗
      - em         # 斜体
      - i          # 斜体
      - blockquote # 引用块
      - pre        # 代码块容器
      - code       # 行内代码
      - ul         # 无序列表
      - ol         # 有序列表
      - li         # 列表项

    forbidden_tags:
      - div        # ❌ 公众号编辑器不支持，会破坏布局
      - section    # ❌ 公众号编辑器不支持
      - article    # ❌ 公众号编辑器不支持
      - script     # ❌ 安全风险
      - iframe     # ❌ 安全风险
      - form       # ❌ 安全风险
      - input      # ❌ 安全风险
      - button     # ❌ 安全风险
      - style      # ❌ 公众号会移除外部样式
      - link       # ❌ 公众号会移除外部链接
      - object     # ❌ 安全风险
      - embed      # ❌ 安全风险
      - hr         # ⚠️  兼容性问题

    allowed_styles:
      - color
      - background-color
      - border
      - border-left
      - border-right
      - border-top
      - border-bottom
      - padding
      - margin
      - margin-top
      - margin-bottom
      - margin-left
      - margin-right
      - font-weight
      - font-size
      - font-style
      - text-align
      - line-height
      - border-radius

    max_inline_style_length: 1000
    class_names_allowed: false
    external_resources_allowed: false

  xhs:
    allowed_tags:
      - div
      - span
      - p
      - h1
      - h2
      - h3
      - strong
      - em
      - blockquote

    forbidden_tags:
      - script
      - iframe
      - form
      - style
      - link
      - pre
      - code

    max_inline_style_length: 500
    class_names_allowed: false

  notion:
    allowed_tags: []
    html_support: false
    format: pure_markdown

  feishu:
    allowed_tags:
      - div
      - span
      - p
      - h1
      - h2
      - h3
      - strong
      - em
      - blockquote
      - hr

    forbidden_tags:
      - script
      - iframe
      - form
      - input
      - button
      - style

    class_names_allowed: true
    max_inline_style_length: 1000

# ============================================
# 运行时配置
# ============================================
runtime:
  type: script
  timeout_ms: 10000

# ============================================
# 约束声明
# ============================================
constraints:
  deterministic: true
  side_effects: none

# ============================================
# 测试钩子
# ============================================
tests:
  smoke:
    - name: detect_script_tag
      input:
        html_content: "<script>alert('xss')</script>"
        platform: wechat
      assert:
        - path: "$.is_safe"
          op: "=="
          value: false
        - path: "$.violations[0].type"
          op: "=="
          value: "forbidden_tag"

    - name: allow_safe_content
      input:
        html_content: "<p style=\"color:red\">Safe</p>"
        platform: wechat
      assert:
        - path: "$.is_safe"
          op: "=="
          value: true
