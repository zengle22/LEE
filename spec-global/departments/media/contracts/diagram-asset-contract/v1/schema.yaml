# Diagram Asset Contract v1.0
# 图表媒体资产契约 - 定义生成的图表资产

kind: contract
version: 1.0

id: contract.media.diagram_asset
name: Diagram Asset Contract
description: >
  定义生成的图表媒体资产。
  这是「媒体资产池」中的条目，不是正文的一部分。
  人类需要在公众号后台手动上传并插入。

input_schema:
  type: object
  required:
    - diagram_plan
    - mermaid_source
  properties:
    diagram_plan:
      type: object
      $ref: "../diagram-plan-contract/v1/schema.yaml#/output_schema/properties/diagrams/items"
    
    mermaid_source:
      type: string
      description: 生成的 Mermaid 源码

output_schema:
  type: object
  required:
    - assets
  properties:
    assets:
      type: array
      description: 生成的媒体资产列表
      items:
        type: object
        required:
          - id
          - type
          - files
          - metadata
          - insertion_guide
        properties:
          id:
            type: string
            description: 资产唯一标识
            example: "diagram_001"
          
          type:
            type: string
            enum: [diagram_image, mermaid_source]
            description: 资产类型
          
          files:
            type: object
            description: 生成的文件
            properties:
              png:
                type: object
                properties:
                  path:
                    type: string
                    description: PNG 文件相对路径
                    example: "images/diagram_001.png"
                  width:
                    type: integer
                    description: 图片宽度（像素）
                  height:
                    type: integer
                    description: 图片高度（像素）
              
              mmd:
                type: object
                properties:
                  path:
                    type: string
                    description: Mermaid 源码文件路径
                    example: "images/diagram_001.mmd"
          
          metadata:
            type: object
            description: 资产元数据
            properties:
              caption:
                type: string
                description: 图表标题
              source_mermaid:
                type: string
                description: 原始 Mermaid 源码（用于溯源）
              rendered_at:
                type: string
                format: date-time
              theme:
                type: string
                default: "neutral"
          
          insertion_guide:
            type: object
            description: 插入指南（供人类参考）
            properties:
              suggested_position:
                type: object
                description: 建议插入位置
                properties:
                  after_paragraph:
                    type: integer
                  context_preview:
                    type: string
                    description: 位置上下文预览（前50字）
              
              placeholder_text:
                type: string
                description: 文章中的占位提示文本
                example: "【结构图：治理闭环】"
              
              instructions:
                type: string
                description: 给编辑的操作说明
                example: >
                  1. 打开 images/diagram_001.png
                  2. 上传到公众号素材库
                  3. 在占位符处插入图片

# 输出文件组织
file_organization:
  base_directory: "output"
  subdirectories:
    images: "存放生成的 PNG 和 MMD 文件"
  
  naming_convention: |
    {diagram_id}.{ext}
    例如：diagram_001.png, diagram_001.mmd

# 使用提示
usage_notes: |
  本契约定义的是「媒体资产」，不是「正文内容」。
  
  关键区分：
  - ❌ 资产不会自动变成公众号正文的一部分
  - ✅ 资产需要人类在发布前手动上传和插入
  
  工作流程：
  1. AI 生成图表资产 → 保存到 images/ 目录
  2. Skill 在文章中插入占位提示
  3. Human Gate 确认图表必要性
  4. 发布前：人类上传图片到公众号后台，替换占位提示
  
  这是「编辑部资产池」模式的核心：
  图片和正文解耦，人类保留最终发布控制权。
