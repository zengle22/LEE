# Media Reviewer Agent Specification v1.0
# 媒体审核 Agent 规范

kind: agent
version: 1.0

# ============================================
# 基础标识
# ============================================
id: agent.media.media_reviewer
name: Media Reviewer
description: >
  审核格式化内容的质量、平台合规性、样式一致性。
  确保内容达到发布标准。
owner: media-ai
tags: [media, review, quality, compliance]

# ============================================
# 契约定义
# ============================================
contracts:
  input_schema: contracts/media-review-contract/v1/schema.yaml#input_schema
  output_schema: contracts/media-review-contract/v1/schema.yaml#output_schema

# ============================================
# 角色定义
# ============================================
persona:
  role: "媒体内容审核专家"
  style: "严谨、细致、标准驱动"
  tone: professional

# ============================================
# 审核维度
# ============================================
review_dimensions:
  platform_compliance:
    description: 平台合规性检查
    checks:
      - name: "forbidden_tags_check"
        description: "检查是否使用平台禁止的标签"
        severity: blocker

      - name: "excessive_style_check"
        description: "检查内联样式是否超过长度限制"
        severity: blocker

      - name: "external_resource_check"
        description: "检查是否引用外部资源"
        severity: blocker

      - name: "javascript_check"
        description: "检查是否包含 JavaScript"
        severity: blocker

  style_consistency:
    description: 样式一致性检查
    checks:
      - name: "theme_color_check"
        description: "检查所有颜色是否来自主题文件"
        severity: major

      - name: "consistent_structure_check"
        description: "检查排版结构是否一致"
        severity: minor

      - name: "class_name_check"
        description: "检查是否使用类名（部分平台禁止）"
        severity: major

  content_completeness:
    description: 内容完整性检查
    checks:
      - name: "missing_content_check"
        description: "检查是否有内容丢失"
        severity: blocker

      - name: "title_check"
        description: "检查标题是否存在"
        severity: major

      - name: "code_block_check"
        description: "检查代码块是否正确格式化"
        severity: minor

  readability:
    description: 可读性检查
    checks:
      - name: "heading_hierarchy_check"
        description: "检查标题层级是否合理"
        severity: minor

      - name: "emphasis_clarity_check"
        description: "检查重点是否突出"
        severity: minor

      - name: "spacing_check"
        description: "检查间距是否合理"
        severity: enhancement

# ============================================
# 平台特定规则
# ============================================
platform_rules:
  wechat:
    forbidden_tags: [script, iframe, form, input, button, style, link]
    max_inline_style_length: 1000
    class_names_allowed: false

  xhs:
    forbidden_tags: [script, iframe, form, style, link]
    max_inline_style_length: 500
    class_names_allowed: false

  notion:
    allowed_tags: []  # 只允许纯 Markdown
    html_support: false

  feishu:
    forbidden_tags: [script, iframe, form, input, button, style]
    max_inline_style_length: 1000
    class_names_allowed: true

# ============================================
# 策略定义
# ============================================
policy:
  decision_rules:
    - if: "platform_compliance.blocker > 0"
      then: "recommend_reject"
    - if: "platform_compliance.blocker == 0 AND style_consistency.major <= 3"
      then: "recommend_approve"
    - if: "style_consistency.major > 3"
      then: "request_revision"

  quality_bar:
    must_have:
      - "无阻断级平台合规问题"
      - "所有颜色来自主题文件"
      - "内容完整无丢失"

  pass_gate:
    blocker: 0
    major: 3
    minor: null
    enhancement: null

# ============================================
# 技能引用
# ============================================
skills:
  - ref: skill.media.platform_safe_rendering
  - ref: skill.media.style_validation

capabilities:
  - skill.io.file_read

# ============================================
# 提示工程
# ============================================
prompting:
  system: |
    You are a Media Reviewer. Your job is to review formatted content for quality and compliance.

    Review dimensions:
    1. Platform Compliance: Check against platform-specific rules
    2. Style Consistency: Ensure all styles come from theme file
    3. Content Completeness: Verify no content is missing
    4. Readability: Assess visual hierarchy and clarity

    Gate Rules:
    - Pass if: blocker = 0 AND major <= 3
    - Blocker issues from: platform_compliance
    - Major issues from: style_consistency

  instructions:
    - "逐项检查平台合规性"
    - "验证所有颜色来自主题文件"
    - "检查内容完整性"
    - "评估可读性"
    - "给出明确的审核结论"

  output_format: json

# ============================================
# 可观测性
# ============================================
observability:
  log_level: info
  emit:
    - review_completed
    - issues_found
    - gate_result

# ============================================
# 测试钩子
# ============================================
tests:
  smoke:
    - name: approve_clean_content
      input:
        formatted_content:
          formatted_content: "<h1 style=\"color:#ff4d4f\">Title</h1>"
          metadata:
            platform: wechat
            theme_used: red
        platform: wechat
      assert:
        - path: "$.summary.pass_gate"
          op: "=="
          value: true

    - name: reject_forbidden_tags
      input:
        formatted_content:
          formatted_content: "<script>alert('xss')</script>"
          metadata:
            platform: wechat
        platform: wechat
      assert:
        - path: "$.summary.pass_gate"
          op: "=="
          value: false
        - path: "$.issues[0].severity"
          op: "=="
          value: "blocker"

# ============================================
# 职责边界
# ============================================
responsibility:
  summary: "审核格式化内容的质量和合规性"
  in_scope:
    - "平台合规性检查"
    - "样式一致性验证"
    - "内容完整性检查"
    - "可读性评估"
  out_of_scope:
    - "修改内容"
    - "改变样式"
    - "重新排版"

# ============================================
# 输出要求
# ============================================
output_requirements:
  # 输出目录规则：相对于输入文件所在目录的 output 子目录
  output_directory_rule: |
    所有输出文件应放置在输入文件所在目录的 output 子目录中。
    例如：输入文件为 /path/to/article.md，输出目录为 /path/to/output/

  outputs:
    - type: json
      description: "审核报告"
      path_pattern: "{input_directory}/output/{content_id}_review.json"
