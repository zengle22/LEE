# Diagram Insertion Pipeline Workflow v1.0
# 文章结构图插入流水线 - 为成稿在需要的地方配上流程图/结构图

kind: workflow
version: 1.0

# ============================================
# 基础标识
# ============================================
id: workflow.media.diagram_insertion_pipeline
name: Diagram Insertion Pipeline
description: >
  为成稿文章在需要的地方配上结构图（流程图）。
  
  核心流程：
  1. 分析哪里需要图（Structure Analysis Agent）
  2. 规划用什么图（Diagram Planning Agent）
  3. 生成 Mermaid（Diagram Generation Skill）
  4. 渲染为 PNG（Diagram Render MCP）
  5. 插入占位提示（Diagram Insertion Skill）
  6. 人工审核（Human Gate）
  
  关键原则：
  - 图片作为"媒体资产"，不作为正文一部分
  - 人类在公众号后台手动上传并插入
  - AI 决定"是否需要"和"结构"，程序决定"渲染"

owner: media-ai
tags: [media, workflow, diagram, illustration, structure]

# ============================================
# 角色地图（Role Map）
# ============================================
# 参见 core/constitution.yaml → execution_taxonomy
roles:
  agents:
    - agent.media.diagram_analyzer         # LLM：文章结构分析
    - agent.media.diagram_planner          # LLM：图表结构规划
  skills:
    - skill.media.diagram_generation       # 程序：Mermaid 代码生成
    - skill.media.diagram_insertion        # 程序：占位提示插入
  mcps:
    - mcp.media.diagram_renderer           # MCP：图表渲染
  gates:
    - gate.media.diagram_review            # 人类：图表审核

# ============================================
# 流水线概览
# ============================================
overview:
  input:
    article_md: string
    
  output:
    article_with_placeholders: string
    diagram_assets: array
    
  stages:
    - id: structure_analysis
      name: "结构分析"
      agent: agent.media.diagram_analyzer
      freeze: false
      
    - id: diagram_planning
      name: "图表规划"
      agent: agent.media.diagram_planner
      freeze: false
      
    - id: diagram_generation
      name: "图表生成"
      skill: skill.media.diagram_generation
      freeze: false
      
    - id: diagram_rendering
      name: "图表渲染"
      mcp: mcp.media.diagram_renderer
      freeze: false
      
    - id: diagram_insertion
      name: "占位插入"
      skill: skill.media.diagram_insertion
      freeze: false
      
    - id: human_review
      name: "人工审核"
      gate: human
      freeze: true
      
    - id: final_output
      name: "最终输出"
      freeze: true

# ============================================
# 详细步骤定义
# ============================================
steps:
  # Stage 1: 结构分析
  - id: analyze_structure
    stage: structure_analysis
    agent: agent.media.diagram_analyzer
    
    metadata:
      name: "文章结构分析"
      stage_id: "1.1"
      description: >
        分析文章内容，识别"哪里需要结构图"。
        这是认知判断层，只输出"是否需要"和"为什么"。
    
    input:
      - source: external
        name: article_md
        contract: contracts/diagram-opportunity-contract/v1/schema.yaml#input_schema
        required: true
    
    output:
      contract: contracts/diagram-opportunity-contract/v1/schema.yaml#output_schema
      freeze: false
    
    non_goals:
      - 决定用什么颜色
      - 决定节点布局
      - 生成实际的图
    
    thinking_boundary: |
      ✅ 可以思考：这段文字的结构是什么？读者会困惑吗？
      ❌ 禁止思考：用什么颜色、怎么排版好看
    
    quality_criteria:
      - 每个机会点都有具体的理由
      - location 精确到段落或标题
      - confidence 基于内容特征判断

  # Stage 2: 图表规划
  - id: plan_diagrams
    stage: diagram_planning
    agent: agent.media.diagram_planner
    
    metadata:
      name: "图表结构规划"
      stage_id: "2.1"
      description: >
        根据机会点，规划图表的 Structure DSL。
        只输出结构（节点、关系），不包含视觉描述。
    
    input:
      - source: analyze_structure
        name: diagram_opportunities
        required: true
      - source: external
        name: article_context
        required: false
    
    output:
      contract: contracts/diagram-plan-contract/v1/schema.yaml#output_schema
      freeze: false
    
    non_goals:
      - 添加颜色、样式
      - 决定字体大小
      - 设计视觉效果
    
    thinking_boundary: |
      ✅ 可以思考：关键元素有哪些？它们的关系是什么？
      ❌ 禁止思考：颜色搭配、节点位置、视觉美化
    
    constraints:
      - 节点数 <= 12
      - 禁止任何视觉属性
      - 所有边引用必须有效

  # Stage 3: 图表生成（Skill）
  - id: generate_mermaid
    stage: diagram_generation
    skill: skill.media.diagram_generation
    
    metadata:
      name: "Mermaid 代码生成"
      stage_id: "3.1"
      description: >
        将 Structure DSL 转换为 Mermaid 语法。
        纯确定性转换，不调用 LLM。
    
    input:
      - source: plan_diagrams
        name: diagrams
        required: true
    
    output:
      type: object
      properties:
        mermaid_sources:
          type: array
          items:
            type: object
            properties:
              diagram_id:
                type: string
              mermaid_source:
                type: string
              diagram_plan:
                type: object
    
    constraints:
      - 不添加任何样式
      - 输出必须是有效 Mermaid 语法
      - 相同输入必须产生相同输出

  # Stage 4: 图表渲染（MCP）
  - id: render_diagrams
    stage: diagram_rendering
    mcp: mcp.media.diagram_renderer
    
    metadata:
      name: "图表渲染"
      stage_id: "4.1"
      description: >
        将 Mermaid 渲染为 PNG 图片。
        这是"去 AI 化"的关键步骤：程序决定渲染，AI 不碰像素。
    
    input:
      - source: generate_mermaid
        name: mermaid_sources
        required: true
    
    output:
      contract: contracts/diagram-asset-contract/v1/schema.yaml#output_schema
      freeze: false
    
    parallel: true
    max_concurrent: 5
    
    options:
      width: 800
      theme: neutral
      background: white
      scale: 2
    
    file_organization:
      base_dir: "diagrams"
      naming: "{diagram_id}.png"
      also_save_mermaid: true
      sub_dirs:
        by_article: false
        by_date: false

  # Stage 5: 占位插入
  - id: insert_placeholders
    stage: diagram_insertion
    skill: skill.media.diagram_insertion
    
    metadata:
      name: "占位提示插入"
      stage_id: "5.1"
      description: >
        在文章中插入占位提示，而非实际图片。
        图片作为"媒体资产"，人类在公众号后台手动处理。
    
    input:
      - source: external
        name: article_md
        required: true
      - source: render_diagrams
        name: diagram_assets
        required: true
    
    output:
      type: object
      properties:
        article_with_placeholders:
          type: string
        insertion_report:
          type: object
    
    template: standard
    
    constraints:
      - 禁止插入 Markdown 图片语法
      - 占位提示必须清晰可识别
      - 保持文章原有结构

  # Stage 6: 人工审核（Gate）
  - id: human_review
    stage: human_review
    gate: human
    
    metadata:
      name: "人工审核"
      stage_id: "6.1"
      description: >
        总编审核：
        1. 这些图真的有必要吗？
        2. 结构有没有误导？
        3. 会不会抢了文字的风头？
    
    input:
      - source: insert_placeholders
        name: article_with_placeholders
        required: true
      - source: render_diagrams
        name: diagram_assets
        required: true
    
    output:
      type: object
      properties:
        decision:
          type: string
          enum: [approve, request_changes, reject]
        feedback:
          type: string
        approved_assets:
          type: array
    
    human_role:
      type: review
      checklist:
        - "每张图都有其存在的必要性"
        - "图的结构准确反映文章逻辑"
        - "图的位置不会打断阅读流"
        - "没有过度插图"
      
      actions:
        - approve:
            description: "确认图表，准备发布"
            next: final_output
        - request_changes:
            description: "返回修改（指定要调整的地方）"
            next: plan_diagrams
        - reject:
            description: "终止流程，不使用图表"
            next: null

  # Stage 7: 最终输出
  - id: final_output
    stage: final_output
    
    metadata:
      name: "最终输出"
      stage_id: "7.1"
      description: "输出带占位提示的文章和媒体资产"
    
    input:
      - source: insert_placeholders
        name: article_with_placeholders
        required: true
      - source: render_diagrams
        name: diagram_assets
        required: true
    
    output:
      type: object
      properties:
        article:
          type: string
          description: 带占位提示的文章
        assets:
          type: array
          description: 图表资产列表
        instructions:
          type: string
          description: 发布前操作指南
    
    freeze: true

# ============================================
# 流水线约束
# ============================================
constraints:
  serial_execution: |
    除渲染阶段外，所有步骤必须串行执行。
    渲染阶段可以并行处理多个图表。
  
  no_visual_ai: |
    AI Agent 永远不碰像素级决策：
    - 不决定颜色
    - 不决定字体
    - 不决定布局
    
    这些由预定义 theme 和 MCP 工具处理。
  
  asset_separation: |
    图片是"媒体资产"，不是正文的一部分。
    占位提示在发布前需要人工替换。
  
  human_gate_required: |
    必须有一个人工审核点，确认图表必要性。
  
  output_organization: |
    输出目录结构：
    ```
    output/
    └── article_with_diagrams.md
    
    diagrams/
    ├── diagram_001.png
    ├── diagram_001.mmd
    ├── diagram_002.png
    └── diagram_002.mmd
    ```

# ============================================
# 完成条件
# ============================================
completion:
  required_outputs:
    - article_with_placeholders
    - diagram_assets
    - human_approval
  
  handoff_options:
    - to: workflow.media.content_layout_pipeline
      description: "继续进入内容排版流水线"
      condition: "文章需要排版美化"
    
    - to: human
      description: "人工发布到公众号"
      condition: "文章已完成，准备发布"
      instructions: |
        1. 打开 diagrams/ 目录下的 PNG 文件
        2. 上传到公众号素材库
        3. 在文章中替换占位提示为图片
        4. 发布

# ============================================
# 使用指南
# ============================================
usage_guide: |
  ## 何时使用此流水线
  
  当你有一篇已经成稿的文章，需要：
  - 在抽象概念密集处添加结构图
  - 用流程图辅助说明复杂流程
  - 用架构图展示系统关系
  
  ## 如何触发
  
  ```yaml
  workflow: workflow.media.diagram_insertion_pipeline
  input:
    article_md: "path/to/article.md"
  ```
  
  ## 完整发布流程
  
  1. **运行流水线** → 生成带占位提示的文章和图片
  2. **人工审核** → 确认图表必要性
  3. **内容排版**（可选）→ 进入 content-layout-pipeline
  4. **公众号发布** → 上传图片，替换占位提示
  
  ## 重要提醒
  
  - 不是每篇文章都需要图
  - 此流水线不会自动插图到公众号
  - 人类保留最终发布控制权
