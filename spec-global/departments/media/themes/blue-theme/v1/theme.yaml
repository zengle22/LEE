# Blue Theme Configuration v1.0
# 蓝色专业主题 - 适合技术文档、专业内容

kind: theme
version: 1.0

id: theme.media.blue
name: Blue Theme
name_zh: 蓝色专业主题
description: >
  使用蓝色系作为强调色，适合技术文档、专业内容。
  给人以专业、可靠的感觉。
owner: media-ai
tags: [blue, professional, technical]

platform_compatibility:
  wechat: {supported: true, notes: "完全支持"}
  xhs: {supported: true, notes: "完全支持"}
  notion: {supported: false}
  feishu: {supported: true}
  generic: {supported: true}

colors:
  primary: "#1890ff"
  primary_light: "#40a9ff"
  primary_dark: "#0050b3"

  background: "#e6f7ff"
  background_elevated: "#ffffff"
  background_overlay: "rgba(0, 0, 0, 0.45)"

  text: "#262626"
  text_secondary: "#595959"
  text_disabled: "#bfbfbf"
  text_inverse: "#ffffff"

  border: "#1890ff"
  border_light: "#91d5ff"
  border_dark: "#003a8c"

  success: "#52c41a"
  warning: "#faad14"
  error: "#ff4d4f"
  info: "#1890ff"

  emphasis_high: "#096dd9"
  emphasis_critical_bg: "#e6f7ff"
  emphasis_critical_text: "#003a8c"

  code_background: "#f6f8fa"
  code_border: "#d1d5db"
  code_text: "#24292e"

  quote_background: "#f0f5ff"
  quote_border: "#adc6ff"
  quote_text: "#595959"

styles:
  heading:
    h1:
      color: "{{colors.primary}}"
      font_size: 24px
      font_weight: bold
      border_bottom: "3px solid {{colors.border}}"
      padding_bottom: 12px
      margin_bottom: 16px

    h2:
      color: "{{colors.primary_dark}}"
      font_size: 20px
      font_weight: bold
      border_left: "4px solid {{colors.border}}"
      padding_left: 12px
      margin_top: 20px
      margin_bottom: 12px

    h3:
      color: "{{colors.primary}}"
      font_size: 18px
      font_weight: 600
      margin_top: 16px
      margin_bottom: 8px

  highlight_section:
    background: "{{colors.background}}"
    border_left: "4px solid {{colors.border}}"
    padding: "12px 16px"
    margin: "16px 0"
    border_radius: 4px

    title:
      color: "{{colors.primary_dark}}"
      font_weight: bold
      font_size: 16px
      margin_bottom: 8px

    bullet:
      prefix: "●"
      color: "{{colors.emphasis_high}}"
      font_size: 14px

    text:
      color: "{{colors.text}}"

  code_block:
    background: "{{colors.code_background}}"
    border: "1px solid {{colors.code_border}}"
    border_radius: 4px
    padding: 12px
    font_family: "Monaco, Menlo, Consolas, monospace"
    font_size: 14px

  quote_block:
    background: "{{colors.quote_background}}"
    border_left: "4px solid {{colors.quote_border}}"
    padding: "12px 16px"
    margin: "16px 0"
    color: "{{colors.quote_text}}"

usage_recommendations:
  best_for:
    - "技术文档"
    - "专业内容"
    - "API 文档"
    - "开发者指南"
