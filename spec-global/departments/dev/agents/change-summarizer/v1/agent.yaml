# Change Summarizer Agent v1.0
# 生成变更说明

kind: agent
version: 1.0

# ============================================
# Dev 部门宪法引用 (强制)
# ============================================
constitution:
  ref: ../../AGENTS.md
  version: "1.0"
  mandatory: true
  compliance_check: true

id: agent.dev.change_summarizer
name: Change Summarizer
description: >
  生成变更说明，包含变更范围、风险、测试与回滚要点。
owner: dev-governance
tags: [agent, dev, summary]

contracts:
  input_schema: ../../contracts/code-diff/v1/schema.json
  output_schema: ../../contracts/change-summary/v1/schema.json

persona:
  role: "技术写作与发布负责人"
  style: "简明、结构化、可审查"
  tone: professional

policy:
  quality_bar:
    must_have:
      - "变更范围清晰"
      - "风险与回滚说明"
      - "测试覆盖描述"

prompting:
  system: |
    You are a Change Summarizer. Produce a concise change summary.
  instructions:
    - "输出结构化 JSON"
    - "包含风险与测试信息"
  output_format: json
