# Smoke Gate v1.0
# 冒烟测试门禁

kind: gate
version: 1.0

# ============================================
# Dev 部门宪法引用 (强制)
# ============================================
constitution:
  ref: ../../AGENTS.md
  version: "1.0"
  mandatory: true

id: gate.dev.smoke_gate
name: Smoke Gate
description: >
  冒烟测试门禁。单测、集成测试、主流程 smoke 全部通过才允许 merge。
  冒烟失败优先级最高，不允许绕过。
owner: dev-governance
tags: [gate, dev, smoke, testing, quality, merge]

# ============================================
# 门禁类型
# ============================================
type: automated
priority: blocker

# ============================================
# 触发条件
# ============================================
trigger:
  event: "smoke_test_complete"
  source: "agent.dev.smoke_tester"

# ============================================
# 检查项
# ============================================
checks:
  - id: unit_test_pass
    name: "单元测试通过"
    description: "单元测试通过率必须 100%"
    type: metric_check
    rule: "unit_test_result.pass_rate == 100"
    severity: blocker
    required: true

  - id: integration_test_pass
    name: "集成测试通过"
    description: "集成测试必须全部通过"
    type: metric_check
    rule: "integration_test_result.pass_rate == 100"
    severity: blocker
    required: true

  - id: smoke_test_pass
    name: "主流程 Smoke 通过"
    description: "主流程冒烟测试必须全部通过"
    type: metric_check
    rule: "smoke_result.flows_failed == 0"
    severity: blocker
    required: true

  - id: coverage_threshold
    name: "覆盖率达标"
    description: "单元测试覆盖率不低于 80%"
    type: metric_check
    rule: "unit_test_result.coverage >= 80"
    severity: major
    required: true

# ============================================
# 通过条件
# ============================================
pass_criteria:
  all_required: true
  max_blocker: 0
  max_major: 0
  description: "所有测试必须通过，冒烟失败不允许 merge"

# ============================================
# 失败处理
# ============================================
on_fail:
  action: "block_merge"
  priority: highest
  message: "冒烟门禁未通过，不允许 merge。冒烟失败优先级最高。"
  escalation:
    - role: tech_lead
      description: "通知技术负责人"

# ============================================
# 元数据
# ============================================
metadata:
  created_by: "dev-workflow-architect"
  created_at: "2026-02-11"
  version: "1.0"
  changelog:
    - version: "1.0"
      date: "2026-02-11"
      changes:
        - "新建冒烟测试门禁"
