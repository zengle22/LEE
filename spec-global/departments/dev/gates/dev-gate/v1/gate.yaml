# Dev Gate Specification v1.0
# 开发门禁规范 - 代码合并前的质量检查

kind: gate
version: 1.0

# ============================================
# Dev 部门宪法引用 (强制)
# ============================================
constitution:
  ref: ../../AGENTS.md
  version: "1.0"
  mandatory: true

# ============================================
# 基础标识
# ============================================
id: gate.dev.dev_gate
name: Dev Gate
description: >
  代码合并前的开发质量门禁。
  确保代码实现符合契约、测试通过、可访问性合规。
owner: dev-governance
tags: [gate, dev, testing, quality]

# ============================================
# 触发条件
# ============================================
trigger:
  when:
    - pull_request_created
    - pull_request_updated
  context:
    requires:
      - ui_map_file: "spec/ui/ui.map.yaml"
      - changed_files: "$PR.files"

# ============================================
# 检查规则
# ============================================
checks:
  # ---------- 构建检查 ----------
  - id: build_success
    name: 构建成功
    description: 项目必须能成功构建
    severity: blocker
    command: npm run build
    timeout: 300s
    message: "项目构建失败"
    fix: "修复构建错误"

  # ---------- 单元测试 ----------
  - id: unit_tests
    name: 单元测试通过
    description: 所有单元测试必须通过
    severity: blocker
    command: npm run test:unit
    timeout: 180s
    message: "单元测试失败"
    fix: "修复失败的测试用例"

  # ---------- 测试覆盖率 ----------
  - id: test_coverage
    name: 测试覆盖率
    description: 覆盖率必须达到阈值
    severity: major
    rule: |
      coverage.statements >= ui_map.quality.testCoverage.unit
    threshold:
      statements: 80
      branches: 70
      functions: 80
      lines: 80
    message: "测试覆盖率不足"
    fix: "增加测试用例提高覆盖率"

  # ---------- Storybook 构建 ----------
  - id: storybook_build
    name: Storybook 可构建
    description: 组件 Storybook 必须能成功构建
    severity: major
    command: npm run build-storybook
    timeout: 300s
    message: "Storybook 构建失败"
    fix: "修复组件或 stories 文件"

  # ---------- 组件状态覆盖 ----------
  - id: component_states
    name: 组件状态实现
    description: 契约中定义的组件状态必须有对应实现
    severity: major
    rule: |
      changed_components.every(comp => {
        const contract = load_contract(comp.contract);
        return contract.states.every(state =>
          storybook_has_story(comp.id, state)
        );
      })
    message: "组件状态未在 Storybook 中实现"
    fix: "为组件添加所有状态的 stories"

  # ---------- 可访问性测试 ----------
  - id: a11y_tests
    name: 可访问性测试
    description: axe-core 可访问性测试必须通过
    severity: major
    when: ui_map.quality.requireA11y == true
    command: npm run test:a11y
    threshold:
      critical: 0
      serious: 3
    message: "可访问性测试失败"
    fix: "修复可访问性问题"

  # ---------- TypeScript 类型检查 ----------
  - id: type_check
    name: 类型检查
    description: TypeScript 类型检查必须通过
    severity: blocker
    command: npx tsc --noEmit
    message: "TypeScript 类型错误"
    fix: "修复类型错误"

  # ---------- Lint 检查 ----------
  - id: lint_check
    name: 代码规范检查
    description: ESLint 检查必须通过
    severity: major
    command: npm run lint
    message: "代码规范问题"
    fix: "运行 npm run lint:fix 修复"

  # ---------- Token 使用检查 ----------
  - id: token_usage
    name: 设计 Token 使用
    description: 不允许使用裸的颜色/尺寸值
    severity: minor
    when: ui_map.quality.requireTokens == true
    command: npm run lint:tokens
    message: "发现未使用 token 的样式值"
    fix: "使用 token 变量替代硬编码值"

  # ---------- Bundle 大小检查 ----------
  - id: bundle_size
    name: Bundle 大小
    description: 打包大小不能超过阈值
    severity: minor
    command: npm run analyze:bundle
    threshold:
      main: 200KB
      vendor: 500KB
    message: "Bundle 大小超过阈值"
    fix: "优化代码分割或移除无用依赖"

# ============================================
# 通过条件
# ============================================
pass_criteria:
  blocker: 0        # 不允许有 blocker
  major: 3          # 最多 3 个 major（需要记录）
  minor: null       # minor 仅警告

# ============================================
# 输出产物
# ============================================
outputs:
  - type: report
    format: json
    path: "output/gate-reports/dev-gate-{pr_number}.json"
  - type: pr_comment
    format: markdown
    template: "templates/dev-gate-comment.md"

# ============================================
# 后续动作
# ============================================
actions:
  on_pass:
    - log: "Dev Gate 通过"
    - label:
        pr: $PR.number
        add: ["gate-passed", "ready-for-review"]
    - notify:
        channel: code-review
        message: "PR #{pr_number} 通过 Dev Gate，可以 Code Review"

  on_fail:
    - log: "Dev Gate 未通过"
    - label:
        pr: $PR.number
        add: ["gate-failed"]
        remove: ["ready-for-review"]
    - request_changes:
        pr: $PR.number
        message: |
          Dev Gate 检查未通过，请修复以下问题：
          {failed_checks_summary}
