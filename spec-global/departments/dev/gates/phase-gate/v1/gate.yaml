# Phase Gate Specification v1.0
# Phase 内质量门禁 - 确保 Phase 产出质量

kind: gate
version: 1.0

# ============================================
# Dev 部门宪法引用 (强制)
# ============================================
constitution:
  ref: ../../AGENTS.md
  version: "1.0"
  mandatory: true

# ============================================
# 基础标识
# ============================================
id: gate.dev.phase_gate
name: Phase Gate
description: >
  Phase 完成前的质量门禁，确保所有交付物符合标准。
  是 Phase 内 OpenSpec 子流程的最后一道关卡。
owner: dev-governance
tags: [gate, dev, phase, quality]

# ============================================
# 触发条件
# ============================================
trigger:
  when:
    - phase_completion_requested
    - manual_gate_check
  context:
    requires:
      - phase_contract: "{phase_dir}/phase.yaml"
      - implementation: "{phase_dir}/openspec/02-implementation/"
      - test_report: "{phase_dir}/openspec/03-unit-tests/coverage-report.json"
      - review_report: "{phase_dir}/openspec/04-review/review-report.md"

# ============================================
# 检查规则
# ============================================
checks:
  # ---------- 需求校准检查 ----------
  - id: requirement_calibration
    name: 需求校准完成
    description: 所有需求必须经过校准
    severity: blocker
    rule: |
      exists("{phase_dir}/openspec/00-requirements/calibrated-requirements.md")
    message: "需求校准未完成"
    fix: "运行 Requirement Calibrator Agent"

  # ---------- 测试契约检查 ----------
  - id: test_contract_complete
    name: 测试契约完整
    description: 测试契约必须存在且完整
    severity: blocker
    rule: |
      exists("{phase_dir}/openspec/01-test-contracts/test-contract.yaml")
    message: "测试契约不存在"
    fix: "运行 Test Contract Generator Agent"

  - id: test_scenarios_minimum
    name: 测试场景数量
    description: 每个需求至少 3 个场景
    severity: major
    rule: |
      test_contract.scenarios_per_requirement >= 3
    message: "测试场景不足"
    fix: "补充测试场景"

  # ---------- OpenSpec 检查 ----------
  - id: openspec_proposal_valid
    name: OpenSpec 提案有效
    description: 提案必须通过 openspec validate
    severity: blocker
    command: "openspec validate {change-id} --strict"
    message: "OpenSpec 提案验证失败"
    fix: "修复提案格式问题"

  - id: openspec_tasks_complete
    name: 任务全部完成
    description: tasks.md 中所有任务必须标记为完成
    severity: blocker
    rule: |
      tasks_md.all_tasks_completed
    message: "存在未完成的任务"
    fix: "完成所有待办任务"

  # ---------- 代码检查 ----------
  - id: build_success
    name: 构建成功
    description: 代码必须能成功构建
    severity: blocker
    command: npm run build
    timeout: 300s
    message: "构建失败"
    fix: "修复构建错误"

  - id: lint_pass
    name: Lint 检查通过
    description: 代码规范检查必须通过
    severity: major
    command: npm run lint
    message: "Lint 检查失败"
    fix: "运行 npm run lint:fix"

  - id: type_check
    name: 类型检查通过
    description: TypeScript 类型检查必须通过
    severity: blocker
    command: npx tsc --noEmit
    message: "类型检查失败"
    fix: "修复类型错误"

  # ---------- 测试检查 ----------
  - id: unit_tests_pass
    name: 单元测试通过
    description: 所有单元测试必须通过
    severity: blocker
    command: npm run test:unit
    message: "单元测试失败"
    fix: "修复失败的测试"

  - id: test_coverage_threshold
    name: 测试覆盖率达标
    description: 覆盖率必须达到 Phase 定义的阈值
    severity: major
    rule: |
      coverage_report.statements >= phase_contract.quality_gates.unit_test.coverage_threshold
    threshold:
      default: 80
    message: "测试覆盖率不足"
    fix: "增加测试用例"

  - id: no_skipped_tests
    name: 无跳过的测试
    description: 不允许存在被跳过的测试
    severity: minor
    rule: |
      test_report.skipped == 0
    message: "存在被跳过的测试"
    fix: "移除或启用被跳过的测试"

  # ---------- Code Review 检查 ----------
  - id: review_approved
    name: Code Review 通过
    description: Code Review 必须被批准
    severity: blocker
    rule: |
      review_report.verdict == "approved"
    message: "Code Review 未通过"
    fix: "解决 Review 问题后重新提交"

  - id: no_blocker_issues
    name: 无 Blocker 问题
    description: 不允许存在 Blocker 级别问题
    severity: blocker
    rule: |
      review_report.blocker_count == 0
    message: "存在 Blocker 级别问题"
    fix: "修复所有 Blocker 问题"

  # ---------- 复盘检查 ----------
  - id: retrospective_complete
    name: 复盘完成
    description: Phase 复盘必须完成
    severity: major
    rule: |
      exists("{phase_dir}/openspec/05-retrospective/retrospective.md")
    message: "复盘未完成"
    fix: "运行 Phase Retrospector Agent"

# ============================================
# 通过条件
# ============================================
pass_criteria:
  blocker: 0        # 不允许任何 blocker
  major: 2          # 最多 2 个 major（需记录）
  minor: null       # minor 仅警告

# ============================================
# 输出产物
# ============================================
outputs:
  - type: report
    format: json
    path: "{phase_dir}/output/phase-gate-report.json"
  - type: markdown
    format: markdown
    path: "{phase_dir}/output/phase-gate-report.md"

# ============================================
# 后续动作
# ============================================
actions:
  on_pass:
    - log: "Phase Gate 通过"
    - update_phase_status:
        file: "{phase_dir}/phase.yaml"
        status: "completed"
    - notify:
        message: "Phase {phase_id} 通过门禁，准备进入集成"

  on_fail:
    - log: "Phase Gate 未通过"
    - update_phase_status:
        file: "{phase_dir}/phase.yaml"
        status: "blocked"
    - create_issues:
        for_each: failed_checks
        template: |
          Title: [Phase Gate] {check_name} 失败
          Body: {check_message}
          Fix: {check_fix}
