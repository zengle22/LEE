  last_updated: "2026-02-11"

  changelog:
    - version: "2.1"
      date: "2026-02-11"
      changes:
        - "Phase 1 重构为 L3 子流程调用 (feature-contract-l3)"
        - "新增 contract L3 子流程引用"

    - version: "2.0"
      date: "2026-02-11"
      changes:
        - "新建 Feature 开发 L2 主工作流"
        - "Phase 1: 协议设计与冻结 (Contract-Agent)"
        - "Phase 2: 前后端并行开发 (强制 contract 约束)"
