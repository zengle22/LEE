# Feature Development L3 Workflow v1.0
# 开发特性工作流（L3）

kind: workflow
version: "1.0"

id: workflow.dev.feature
name: Development Feature Workflow (L3)
description: >
  从 Feature Spec 到代码实现的最小闭环开发流程：
  解析需求 → 生成代码 → 静态检查 → 单测 → 自审 → 变更说明 → Dev Gate。
owner: development
tags: [workflow, dev, feature, l3]

# ============================================
# 契约定义
# ============================================
contracts:
  inputs:
    - feature_spec:
        path: ../../contracts/feature-spec/v1/schema.json
        description: Feature Spec 输入
  outputs:
    - code_diff:
        path: ../../contracts/code-diff/v1/schema.json
        description: 代码变更 diff
    - change_summary:
        path: ../../contracts/change-summary/v1/schema.json
        description: 变更说明

# ============================================
# 工作流阶段
# ============================================
stages:
  - id: s1_prepare
    name: "准备阶段"
    steps:
      - id: s1_1_pull_branch
        name: "拉取分支"
        type: skill
        run: skill.git.checkout
        inputs:
          - branch: "{{params.branch}}"
        outputs:
          - path: "output/git-status.txt"

      - id: s1_2_parse_spec
        name: "解析 Feature Spec"
        type: agent
        run: agent.dev.feature_spec_parser
        dependencies:
          requires: [s1_1_pull_branch]
        inputs:
          - spec: "{{params.spec}}"
        outputs:
          - path: "output/parsed-spec.json"
            contract: ../../contracts/feature-spec/v1/schema.json

  - id: s2_coding
    name: "编码阶段"
    steps:
      - id: s2_1_generate_code
        name: "生成代码"
        type: agent
        run: agent.dev.feature_coder
        dependencies:
          requires: [s1_2_parse_spec]
        inputs:
          - parsed_spec: "output/parsed-spec.json"
        outputs:
          - path: "output/code-diff.patch"
            contract: ../../contracts/code-diff/v1/schema.json

      - id: s2_2_static_check
        name: "静态检查"
        type: skill
        run: skill.lint.ruff
        dependencies:
          requires: [s2_1_generate_code]
        inputs:
          - command: "ruff check ."
        outputs:
          - path: "output/lint-report.txt"
        verifiers:
          - type: lint
            config:
              command: "ruff check ."
              fail_on_error: true

      - id: s2_3_unit_test
        name: "单元测试"
        type: skill
        run: skill.test.pytest
        dependencies:
          requires: [s2_2_static_check]
        inputs:
          - command: "pytest -q"
        outputs:
          - path: "output/test-report.json"
          - path: "output/coverage.json"
        verifiers:
          - type: coverage
            config:
              min_coverage: 80
              report_path: "output/coverage.json"
              fail_on_error: true

  - id: s3_review
    name: "审查阶段"
    steps:
      - id: s3_1_self_review
        name: "AI 自审"
        type: agent
        run: agent.dev.code_self_reviewer
        dependencies:
          requires: [s2_3_unit_test]
        outputs:
          - path: "output/review-report.md"

      - id: s3_2_generate_summary
        name: "生成变更说明"
        type: agent
        run: agent.dev.change_summarizer
        dependencies:
          requires: [s3_1_self_review]
        outputs:
          - path: "output/change-summary.json"
            contract: ../../contracts/change-summary/v1/schema.json

  - id: s4_gate
    name: "审批阶段"
    steps:
      - id: s4_1_dev_gate
        name: "Dev Lead 审批"
        type: human_gate
        dependencies:
          requires: [s3_2_generate_summary]
        gate:
          ref: ../../gates/dev-feature-gate/v1/gate.yaml

