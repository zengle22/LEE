# Bug Fix Workflow v2.0
# 开发 Bug 修复工作流 (含 Bug-Triage-Agent 分流)
#
# v2.0 升级: 新增 Bug 分流阶段 (Stage 0)，区分实现 Bug 和协议 Bug
# 参见：rnd_l2_l3_spec.md

kind: workflow
version: "2.1"

# ============================================
# Dev 部门宪法引用 (强制)
# ============================================
constitution:
  ref: ../AGENTS.md
  version: "1.0"
  mandatory: true

# ============================================
# 基础标识
# ============================================
id: workflow.dev.bug_fix
name: Development Bug Fix Workflow (v2)
description: >
  面向 Bug.contract 的研发修复流程（含分流）。
  关键原则：
  - 先分流：判断是否涉及 contract 修改
  - 实现 Bug：走常规修复流程
  - 协议 Bug：回 Contract-Agent 升版本
  - 先复现、后定位、再修复
  - 高风险必须人类门禁
  - 验证失败持续迭代，超过阈值强制回滚或人类介入
owner: development
tags: [workflow, dev, bugfix, quality, triage, contract]

# ============================================
# 角色地图（Role Map）
# ============================================
roles:
  agents:
    - agent.dev.bug_triage                  # LLM：Bug 分流（v2 新增）
    - agent.dev.contract_designer           # LLM：协议修复（v2 新增）
    - agent.dev.bug_reproducer              # LLM：复现 Bug
    - agent.dev.bug_root_cause_analyst      # LLM：根因定位
    - agent.dev.bug_fix_planner             # LLM：制定修复方案
    - agent.dev.tech_architect              # LLM：架构师评审
    - agent.dev.bug_fix_implementer         # LLM：修复代码
    - agent.dev.bug_fix_verifier            # LLM：本地验证
    - agent.dev.code_reviewer               # LLM：代码审核
    - agent.dev.bug_technical_debt_recorder # LLM：记录技术债务
    - agent.dev.unit_test_runner            # LLM：运行单元测试
    - agent.dev.unit_test_writer            # LLM：增加单元测试
    - agent.dev.git_committer               # LLM：提交 Git
    - agent.dev.bug_knowledge_curator       # LLM：知识沉淀
    - agent.dev.smoke_tester                # LLM：冒烟测试（v2 新增）
  skills: []
  gates:
    - gate.dev.bugfix_plan_gate             # 自动：修复方案门禁
    - gate.dev.risk_human_gate              # 人类：高风险门禁
    - gate.dev.test_human_gate              # 人类：测试人类门禁
    - gate.dev.smoke_gate                   # 自动：冒烟门禁（v2 新增）
    - gate.dev.bug_test_env_human_gate      # 人类：测试环境/外部因素门禁（v2.1 新增）

# ============================================
# 触发条件
# ============================================
triggers:
  - event: "bug-contract"
    source: "workflow.qa.testing_pipeline"
    conditions:
      - "bugs/*.contract.yaml exists"

  - event: "manual_bug_fix"
    source: "human_developer"
    conditions:
      - "bugs/*.contract.yaml exists"

# ============================================
# 入口门禁
# ============================================
entry_gate:
  name: "Bug Fix Entry Gate"
  required_inputs:
    - file: "bugs/*.contract.yaml"
      schema: "testing/contracts/bug-contract/v1/schema.json"
      description: "Bug 契约文件"

  validation_rules:
    - rule: "bugs_count >= 1"
      message: "必须至少包含 1 个 Bug 契约"

# ============================================
# 防滥用规则
# ============================================
constraints:
  strict_mode: true
  forbidden_actions:
    - action: "add_new_requirement"
      description: "禁止引入新需求"
      penalty: "workflow_abort"
    - action: "unrelated_refactor"
      description: "禁止无关重构"
      penalty: "human_review_required"

# ============================================
# 工作流阶段
# ============================================
stages:
  # ========== Stage 0: Bug 分流（v2 新增）==========
  - id: s0_triage
    name: "Bug 分流"
    description: >
      Bug-Triage-Agent 分析 Bug，判断是否涉及 contract 修改。
      协议 Bug 走协议修复流程，实现 Bug 走常规修复流程。

    steps:
      - id: s0_1_triage_analysis
        name: "Bug 分流分析"
        description: "分析 bug 是否涉及 DTO/字段/类型变更"
        type: agent
        run: agent.dev.bug_triage
        execution:
          model: prompt_switch
          timeout: 30m

        inputs:
          - bug_contract: "bugs/*.contract.yaml"
          - codebase: "$workspace.code"

        outputs:
          - path: "output/bug-triage-result.yaml"
            contract: ../../contracts/bug-triage-output/v1/schema.json

      - id: s0_2_triage_decision
        name: "分流判定"
        type: decision
        dependencies:
          requires: [s0_1_triage_analysis]
        decision_logic: |
          IF triage_result.bug_type == "contract":
            next_stage = s0_contract_fix
          ELSE:
            next_stage = s1_reproduce

  # ========== Stage 0B: 协议 Bug 修复路径（v2 新增）==========
  - id: s0_contract_fix
    name: "协议 Bug 修复"
    description: >
      协议 Bug 路径：修改 contract → 升版本 → 写 changelog
      → 前后端同步更新 → 回到开发流程。

    steps:
      - id: s0b_1_fix_contract
        name: "修复协议"
        description: "Contract-Agent 修改 contract，升级版本，写 changelog"
        type: agent
        run: agent.dev.contract_designer
        execution:
          model: prompt_switch
          timeout: 60m

        dependencies:
          requires: [s0_2_triage_decision]
        condition: "triage_result.bug_type == 'contract'"

        inputs:
          - bug_contract: "bugs/*.contract.yaml"
          - triage_result: "output/bug-triage-result.yaml"
          - existing_contract: "contracts/*.yaml"

        outputs:
          - path: "output/updated-api-contract.yaml"
            contract: ../../contracts/api-contract/v1/schema.json

      - id: s0b_2_sync_update
        name: "前后端同步更新"
        description: "协议修改后，前后端必须同步更新"
        type: decision
        dependencies:
          requires: [s0b_1_fix_contract]
        decision_logic: |
          # 协议 Bug 修复后，回到 Feature 开发流程 Phase 2
          action = "trigger_feature_workflow_phase2"
          message = "协议已修复并升版本，触发前后端同步更新"
          workflow_ref = "workflow.dev.feature"
          start_phase = "p2_parallel_development"

  # ========== Stage 1~7: 实现 Bug 修复流程（与 v1 一致）==========

  # ========== Stage 1: 复现 ==========
  - id: s1_reproduce
    name: "Bug 复现"
    description: "在本地环境复现 Bug，记录证据"

    steps:
      - id: s1_1_reproduce_bug
        name: "本地复现"
        description: "按 bug-contract 复现，最多尝试 10 次"
        run: agent.dev.bug_reproducer
        execution:
          model: prompt_switch
          timeout: 40m

        inputs:
          - bug_contract: "bugs/*.contract.yaml"
          - environment: "local"

        outputs:
          - path: "output/bug-fix-status.yaml"
            contract: ../../contracts/bug-fix-status-contract/v1/schema.json
          - path: "output/repro-result.yaml"

        retry_policy:
          max_attempts: 10
          on_exhausted:
            action: "mark_cannot_reproduce"
            message: "连续 10 次无法复现，标记为不可复现"

  # ========== Stage 2: 原因分析 ==========
  - id: s2_analysis
    name: "原因分析"
    description: "调查日志与代码，定位根因"

    steps:
      - id: s2_1_root_cause
        name: "根因定位"
        run: agent.dev.bug_root_cause_analyst
        execution:
          model: prompt_switch
          timeout: 60m

        dependencies:
          requires: [s1_1_reproduce_bug]

        inputs:
          - bug_contract: "bugs/*.contract.yaml"
          - repro_result: "output/repro-result.yaml"
          - logs: "$workspace.logs"
          - codebase: "$workspace.code"

        outputs:
          - path: "output/bug-root-cause.yaml"
            contract: ../../contracts/bug-root-cause-contract/v1/schema.json

  # ========== Stage 3: 修复方案 ==========
  - id: s3_fix_plan
    name: "修复方案"
    description: "制定修复方案并评审"

    steps:
      - id: s3_1_fix_plan
        name: "制定修复方案"
        run: agent.dev.bug_fix_planner
        execution:
          model: prompt_switch
          timeout: 45m

        dependencies:
          requires: [s2_1_root_cause]

        inputs:
          - root_cause: "output/bug-root-cause.yaml"

        outputs:
          - path: "output/bug-fix-plan.yaml"
            contract: ../../contracts/bug-fix-plan-contract/v1/schema.json

      - id: s3_2_arch_review
        name: "架构师评审"
        description: "架构师评审修复方案，关注风险"
        run: agent.dev.tech_architect
        execution:
          model: prompt_switch
          timeout: 30m

        dependencies:
          requires: [s3_1_fix_plan]

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"

        outputs:
          - path: "output/bug-fix-arch-review.yaml"

      - id: s3_3_fix_plan_gate
        name: "修复方案门禁"
        type: gate_decision

        dependencies:
          requires: [s3_2_arch_review]

        gate:
          ref: gate.dev.bugfix_plan_gate
          checks:
            - "plan_complete"
            - "rollback_plan"
            - "test_plan"
            - "risk_assessed"

        on_fail:
          action: "request_human_gate"
          message: "修复方案门禁未通过，触发人类门禁"

      - id: s3_4_risk_human_gate
        name: "风险人类门禁"
        kind: human_gate
        description: "高风险修复方案需人类评审"
        condition: "fix_plan.risk_assessment.level == 'HIGH'"
        depends_on:
          - s3_3_fix_plan_gate

        gate_rules:
          reviewers:
            - role: tech_lead
              description: "技术负责人"
            - role: architect
              description: "架构师"
          approval_criteria:
            - label: "风险可接受"
              criteria: "风险已评估且有缓解措施"
              required: true
            - label: "回滚可行"
              criteria: "回滚方案可执行"
              required: true

  # ========== Stage 4: 修复与验证 ==========
  - id: s4_fix_and_verify
    name: "修复与验证"
    description: "按方案修复并本地验证"

    steps:
      - id: s4_0_repro_check
        name: "复现状态检查"
        type: decision
        dependencies:
          requires: [s3_3_fix_plan_gate]
        decision_logic: |
          IF root_cause.analysis_state == "cannot_reproduce":
            next_stage = s7_finalize
          ELSE:
            next_step = s4_1_fix_code

      - id: s4_1_fix_code
        name: "修复代码"
        run: agent.dev.bug_fix_implementer
        execution:
          model: prompt_switch
          timeout: 90m

        dependencies:
          requires: [s4_0_repro_check]

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"
          - bug_contract: "bugs/*.contract.yaml"

        outputs:
          - path: "output/fix-commit-summary.yaml"

      - id: s4_2_verify_local
        name: "本地验证"
        run: agent.dev.bug_fix_verifier
        execution:
          model: prompt_switch
          timeout: 45m

        dependencies:
          requires: [s4_1_fix_code]

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"
          - repro_result: "output/repro-result.yaml"

        outputs:
          - path: "output/bug-fix-status.yaml"
            contract: ../../contracts/bug-fix-status-contract/v1/schema.json
          - path: "output/verification-result.yaml"

      # v2.1 新增：运行 Bug 触发的完整测试用例
      - id: s4_2b_run_bug_tests
        name: "运行 Bug 触发测试"
        description: >-
          在本地开发环境运行 bug-contract 中记录的完整测试用例，
          确保修复后所有相关测试通过。
        run: agent.dev.unit_test_runner
        execution:
          model: prompt_switch
          timeout: 30m

        dependencies:
          requires: [s4_2_verify_local]

        inputs:
          - bug_contract: "bugs/*.contract.yaml"
          - fix_plan: "output/bug-fix-plan.yaml"
          - code_changes: "output/fix-commit-summary.yaml"
          - verification_result: "output/verification-result.yaml"

        outputs:
          - path: "output/bug-triggered-test-result.yaml"
            contract: ../../contracts/unit-test-result-contract/v1/schema.json

      # v2.1 新增：Bug 测试结果判定
      - id: s4_2c_bug_test_decision
        name: "Bug 测试结果判定"
        type: decision
        description: >-
          判定 bug 触发测试的执行结果：
          通过 → 继续验证流程；
          失败 → 重试修复；
          环境/外部因素 → 触发人类门禁。
        dependencies:
          requires: [s4_2b_run_bug_tests]
        decision_logic: |
          IF bug_test_result.status == "pass":
            next_step = s4_3_verify_decision
          ELIF bug_test_result.status IN ["env_failure", "external_blocked"]:
            next_step = s4_2d_env_human_gate
          ELIF fix_attempts < 10:
            next_step = s4_1_fix_code
          ELSE:
            rollback_to = s3_fix_plan

      # v2.1 新增：环境/外部因素人类门禁
      - id: s4_2d_env_human_gate
        name: "测试环境人类门禁"
        kind: human_gate
        description: >-
          当 bug 触发的测试因环境无法搭建或外部因素（如第三方服务不可用、
          硬件依赖等）无法执行时，触发人类门禁由人类介入处理。
        condition: "bug_test_result.status IN ['env_failure', 'external_blocked']"
        depends_on:
          - s4_2c_bug_test_decision

        gate_rules:
          reviewers:
            - role: tech_lead
              description: "技术负责人"
            - role: qa_lead
              description: "测试负责人"
          approval_criteria:
            - label: "环境问题已确认"
              criteria: "确认环境问题真实存在且非代码缺陷"
              required: true
            - label: "替代验证方案"
              criteria: "已提供替代验证方式或人工验证结果"
              required: true

      - id: s4_3_verify_decision
        name: "验证结果判定"
        type: decision
        dependencies:
          requires:
            any_of: [s4_2c_bug_test_decision, s4_2d_env_human_gate]
        decision_logic: |
          IF verification.status == "pass":
            next_stage = s5_code_review
          ELIF fix_attempts < 10:
            next_step = s4_1_fix_code
          ELSE:
            rollback_to = s3_fix_plan

  # ========== Stage 5: 代码审核与技术债 ==========
  - id: s5_code_review
    name: "代码审核"
    description: "代码审核与问题修复（v2: 增加 contract 合规检查）"

    steps:
      - id: s5_1_code_review
        name: "代码审核"
        run: agent.dev.code_reviewer
        execution:
          model: prompt_switch
          timeout: 40m

        dependencies:
          requires: [s4_2_verify_local]

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"
          - code_changes: "output/fix-commit-summary.yaml"

        outputs:
          - path: "output/code-review-report.yaml"

        # v2 新增：Code Review 重点
        review_focus:
          - "是否违反 contract"
          - "是否扩大修改范围"
          - "是否隐式修改字段"
          - "是否破坏兼容性"

      - id: s5_2_fix_review_issues
        name: "修复高优先级问题"
        run: agent.dev.bug_fix_implementer
        execution:
          model: prompt_switch
          timeout: 60m

        dependencies:
          requires: [s5_1_code_review]

        inputs:
          - review_report: "output/code-review-report.yaml"

        outputs:
          - path: "output/review-fix-summary.yaml"

      - id: s5_3_review_verify
        name: "复核验证"
        run: agent.dev.bug_fix_verifier
        execution:
          model: prompt_switch
          timeout: 45m

        dependencies:
          requires: [s5_2_fix_review_issues]

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"
          - review_fix_summary: "output/review-fix-summary.yaml"

        outputs:
          - path: "output/bug-fix-status.yaml"
            contract: ../../contracts/bug-fix-status-contract/v1/schema.json
          - path: "output/review-verify-result.yaml"

      - id: s5_4_debt_record
        name: "记录技术债务"
        run: agent.dev.bug_technical_debt_recorder
        execution:
          model: prompt_switch
          timeout: 20m

        dependencies:
          requires: [s5_1_code_review]

        inputs:
          - review_report: "output/code-review-report.yaml"
          - bug_status: "output/bug-fix-status.yaml"

        outputs:
          - path: "output/technical-debt.yaml"
            contract: ../../contracts/technical-debt-contract/v1/schema.json

  # ========== Stage 6: 单元测试 + 冒烟（v2 增加冒烟）==========
  - id: s6_testing
    name: "测试与冒烟"
    description: "运行单元测试、集成测试、主流程冒烟。覆盖率≥80%且通过率100%"

    steps:
      - id: s6_1_run_unit_tests
        name: "运行单元测试"
        description: "执行现有单元测试，收集覆盖率报告"
        run: agent.dev.unit_test_runner
        execution:
          model: prompt_switch
          timeout: 30m

        dependencies:
          requires: [s5_3_review_verify]

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"
          - code_changes: "output/fix-commit-summary.yaml"

        outputs:
          - path: "output/unit-test-result.yaml"
            contract: ../../contracts/unit-test-result-contract/v1/schema.json

      - id: s6_2_coverage_check
        name: "覆盖率检查"
        type: decision
        dependencies:
          requires: [s6_1_run_unit_tests]
        decision_logic: |
          IF test_result.pass_rate == 100% AND test_result.coverage >= 80%:
            next_step = s6_5_smoke_test
          ELIF test_result.pass_rate < 100%:
            next_step = s6_4_fix_failing_tests
          ELSE:
            next_step = s6_3_add_unit_tests

      - id: s6_3_add_unit_tests
        name: "增加单元测试"
        description: "按需增加单元测试用例以提高覆盖率至80%"
        run: agent.dev.unit_test_writer
        execution:
          model: prompt_switch
          timeout: 60m

        dependencies:
          requires: [s6_2_coverage_check]

        condition: "test_result.coverage < 80%"

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"
          - code_changes: "output/fix-commit-summary.yaml"
          - test_result: "output/unit-test-result.yaml"
          - target_coverage: 80

        outputs:
          - path: "output/added-tests-summary.yaml"

      - id: s6_4_fix_failing_tests
        name: "修复失败测试"
        description: "修复未通过的单元测试"
        run: agent.dev.bug_fix_implementer
        execution:
          model: prompt_switch
          timeout: 45m

        dependencies:
          requires: [s6_2_coverage_check]

        condition: "test_result.pass_rate < 100%"

        inputs:
          - test_result: "output/unit-test-result.yaml"
          - code_changes: "output/fix-commit-summary.yaml"

        outputs:
          - path: "output/test-fix-summary.yaml"

      # v2 新增：冒烟测试
      - id: s6_5_smoke_test
        name: "冒烟测试"
        description: "执行主流程 smoke 测试"
        run: agent.dev.smoke_tester
        execution:
          model: prompt_switch
          timeout: 60m

        dependencies:
          requires:
            any_of: [s6_2_coverage_check, s6_3_add_unit_tests, s6_4_fix_failing_tests]

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"
          - code_changes: "output/fix-commit-summary.yaml"
          - unit_test_result: "output/unit-test-result.yaml"

        outputs:
          - path: "output/smoke-test-result.yaml"
            contract: ../../contracts/smoke-test-result/v1/schema.json

      # v2 新增：冒烟门禁
      - id: s6_6_smoke_gate
        name: "冒烟门禁"
        type: gate_decision
        description: "冒烟测试门禁，失败不允许 merge"

        dependencies:
          requires: [s6_5_smoke_test]

        gate:
          ref: gate.dev.smoke_gate
          checks:
            - "unit_test_pass"
            - "integration_test_pass"
            - "smoke_test_pass"
            - "coverage_threshold"

        on_pass:
          action: "proceed_to_finalize"
          message: "冒烟测试通过"

        on_fail:
          action: "block_merge"
          priority: highest
          message: "冒烟失败，不允许 merge"

      - id: s6_7_test_human_gate
        name: "测试人类门禁"
        kind: human_gate
        description: "测试多次未达标，需人类介入"
        condition: "test_attempts >= 5"
        depends_on:
          - s6_6_smoke_gate

        gate_rules:
          reviewers:
            - role: tech_lead
              description: "技术负责人"
            - role: qa_lead
              description: "测试负责人"
          approval_criteria:
            - label: "测试充分"
              criteria: "测试覆盖关键修复代码"
              required: true
            - label: "例外可接受"
              criteria: "覆盖率不足有合理原因"
              required: false

  # ========== Stage 7: 收尾与沉淀 ==========
  - id: s7_finalize
    name: "提交与沉淀"
    description: "提交代码并沉淀知识"

    steps:
      - id: s7_0_non_repro_close
        name: "不可复现收尾"
        description: "无法复现时收尾，输出最终状态"
        run: agent.dev.bug_fix_verifier
        execution:
          model: prompt_switch
          timeout: 10m

        dependencies:
          requires: [s4_0_repro_check]

        condition: "root_cause.analysis_state == 'cannot_reproduce'"

        inputs:
          - bug_status: "output/bug-fix-status.yaml"
          - root_cause: "output/bug-root-cause.yaml"

        outputs:
          - path: "output/bug-fix-status.yaml"
            contract: ../../contracts/bug-fix-status-contract/v1/schema.json

      - id: s7_1_git_commit
        name: "提交 Git"
        description: "提交修复代码和新增单元测试到 Git 仓库"
        run: agent.dev.git_committer
        execution:
          model: prompt_switch
          timeout: 20m

        dependencies:
          requires:
            any_of: [s6_6_smoke_gate, s6_7_test_human_gate]

        inputs:
          - fix_summary: "output/fix-commit-summary.yaml"
          - review_fix_summary: "output/review-fix-summary.yaml"
          - test_result: "output/unit-test-result.yaml"
          - smoke_result: "output/smoke-test-result.yaml"
          - added_tests: "output/added-tests-summary.yaml"

        outputs:
          - path: "output/git-commit.yaml"

        validation:
          pre_commit_checks:
            - "unit_test_pass_rate == 100%"
            - "unit_test_coverage >= 80%"
            - "smoke_test_verdict == 'PASS'"

      - id: s7_2_knowledge_capture
        name: "知识沉淀"
        run: agent.dev.bug_knowledge_curator
        execution:
          model: prompt_switch
          timeout: 20m

        dependencies:
          requires: [s7_1_git_commit]

        inputs:
          - bug_status: "output/bug-fix-status.yaml"
          - root_cause: "output/bug-root-cause.yaml"
          - triage_result: "output/bug-triage-result.yaml"

        outputs:
          - path: "output/knowledge-capture.yaml"
            contract: ../../contracts/knowledge-capture-contract/v1/schema.json

        # v2 新增：经验沉淀要点
        capture_focus:
          - "bug 根因"
          - "是否需补测试"
          - "是否需补 smoke case"

      - id: s7_3_fix_experience
        name: "修复经验输出"
        run: agent.dev.bug_knowledge_curator
        execution:
          model: prompt_switch
          timeout: 10m

        dependencies:
          requires: [s7_2_knowledge_capture]

        inputs:
          - knowledge: "output/knowledge-capture.yaml"

        outputs:
          - path: "output/fix-experience.md"

# ============================================
# 循环控制
# ============================================
loop_control:
  reproduction:
    max_attempts: 10
    on_exhausted:
      action: "mark_cannot_reproduce"
      next_stage: s7_finalize

  fix_verification:
    max_attempts: 10
    on_exhausted:
      action: "rollback_to_fix_plan"
      next_stage: s3_fix_plan

  plan_rollback:
    max_rollbacks: 3
    on_exhausted:
      action: "trigger_human_gate"
      human_gate: s3_4_risk_human_gate

  # v2.1 新增：Bug 触发测试循环控制
  bug_test_verification:
    max_attempts: 10
    on_exhausted:
      action: "trigger_human_gate"
      human_gate: s4_2d_env_human_gate
      message: "Bug 触发测试多次未通过，触发人类门禁"

  unit_test:
    max_attempts: 5
    coverage_threshold: 80
    pass_rate_threshold: 100
    on_exhausted:
      action: "trigger_human_gate"
      human_gate: s6_7_test_human_gate

# ============================================
# 退出条件
# ============================================
exit_conditions:
  success:
    - condition: "bug_fix_status.status == 'fixed' AND smoke_gate.status == 'passed'"
      description: "Bug 修复并通过冒烟测试"
    - condition: "triage_result.bug_type == 'contract' AND contract_updated"
      description: "协议 Bug 已修复并升版本"

  failure:
    - condition: "bug_fix_status.status == 'cannot_reproduce'"
      description: "Bug 无法复现"
    - condition: "plan_rollback_count >= 3"
      description: "修复方案回滚超过 3 次"
      action: "require_human_review"

# ============================================
# 产物契约
# ============================================
outputs_contract:
  required:
    - file: "output/bug-triage-result.yaml"
      schema: "development/contracts/bug-triage-output/v1/schema.json"
    - file: "output/bug-fix-status.yaml"
      schema: "development/contracts/bug-fix-status-contract/v1/schema.json"
    - file: "output/bug-root-cause.yaml"
      schema: "development/contracts/bug-root-cause-contract/v1/schema.json"
    - file: "output/bug-fix-plan.yaml"
      schema: "development/contracts/bug-fix-plan-contract/v1/schema.json"
    - file: "output/unit-test-result.yaml"
      schema: "development/contracts/unit-test-result-contract/v1/schema.json"
    - file: "output/smoke-test-result.yaml"
      schema: "development/contracts/smoke-test-result/v1/schema.json"
    - file: "output/git-commit.yaml"
      schema: "development/contracts/git-commit-contract/v1/schema.json"

  optional:
    - file: "output/technical-debt.yaml"
      schema: "development/contracts/technical-debt-contract/v1/schema.json"
    - file: "output/knowledge-capture.yaml"
      schema: "development/contracts/knowledge-capture-contract/v1/schema.json"
    - file: "output/fix-experience.md"
      description: "修复经验总结"
    - file: "output/updated-api-contract.yaml"
      schema: "development/contracts/api-contract/v1/schema.json"
      description: "协议 Bug 修复后的更新协议"

