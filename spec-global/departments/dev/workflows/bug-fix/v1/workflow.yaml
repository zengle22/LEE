# Bug Fix Workflow v1.0
# 开发 Bug 修复工作流

kind: workflow
version: 1.0

# ============================================
# 基础标识
# ============================================
id: workflow.dev.bug_fix
name: Development Bug Fix Workflow
description: >
  面向 Bug.contract 的研发修复流程。
  关键原则：
  - 先复现、后定位、再修复
  - 高风险必须人类门禁
  - 验证失败持续迭代，超过阈值强制回滚或人类介入
owner: development
tags: [workflow, dev, bugfix, quality]

# ============================================
# 触发条件
# ============================================
triggers:
  - event: "bug-contract"
    source: "workflow.qa.testing_pipeline"
    conditions:
      - "bugs/*.contract.yaml exists"

  - event: "manual_bug_fix"
    source: "human_developer"
    conditions:
      - "bugs/*.contract.yaml exists"

# ============================================
# 入口门禁
# ============================================
entry_gate:
  name: "Bug Fix Entry Gate"
  required_inputs:
    - file: "bugs/*.contract.yaml"
      schema: "testing/contracts/bug-contract/v1/schema.json"
      description: "Bug 契约文件"

  validation_rules:
    - rule: "bugs_count >= 1"
      message: "必须至少包含 1 个 Bug 契约"

# ============================================
# 防滥用规则
# ============================================
constraints:
  strict_mode: true
  forbidden_actions:
    - action: "add_new_requirement"
      description: "禁止引入新需求"
      penalty: "workflow_abort"
    - action: "unrelated_refactor"
      description: "禁止无关重构"
      penalty: "human_review_required"

# ============================================
# 工作流阶段
# ============================================
stages:
  # ========== Stage 1: 复现 ==========
  - id: s1_reproduce
    name: "Bug 复现"
    description: "在本地环境复现 Bug，记录证据"

    steps:
      - id: s1_1_reproduce_bug
        name: "本地复现"
        description: "按 bug-contract 复现，最多尝试 10 次"
        run: agent.dev.bug_reproducer
        execution:
          model: prompt_switch
          timeout: 40m

        inputs:
          - bug_contract: "bugs/*.contract.yaml"
          - environment: "local"

        outputs:
          - path: "output/bug-fix-status.yaml"
            contract: ../../contracts/bug-fix-status-contract/v1/schema.json
          - path: "output/repro-result.yaml"

        retry_policy:
          max_attempts: 10
          on_exhausted:
            action: "mark_cannot_reproduce"
            message: "连续 10 次无法复现，标记为不可复现"

  # ========== Stage 2: 原因分析 ==========
  - id: s2_analysis
    name: "原因分析"
    description: "调查日志与代码，定位根因"

    steps:
      - id: s2_1_root_cause
        name: "根因定位"
        run: agent.dev.bug_root_cause_analyst
        execution:
          model: prompt_switch
          timeout: 60m

        dependencies:
          requires: [s1_1_reproduce_bug]

        inputs:
          - bug_contract: "bugs/*.contract.yaml"
          - repro_result: "output/repro-result.yaml"
          - logs: "$workspace.logs"
          - codebase: "$workspace.code"

        outputs:
          - path: "output/bug-root-cause.yaml"
            contract: ../../contracts/bug-root-cause-contract/v1/schema.json

  # ========== Stage 3: 修复方案 ==========
  - id: s3_fix_plan
    name: "修复方案"
    description: "制定修复方案并评审"

    steps:
      - id: s3_1_fix_plan
        name: "制定修复方案"
        run: agent.dev.bug_fix_planner
        execution:
          model: prompt_switch
          timeout: 45m

        dependencies:
          requires: [s2_1_root_cause]

        inputs:
          - root_cause: "output/bug-root-cause.yaml"

        outputs:
          - path: "output/bug-fix-plan.yaml"
            contract: ../../contracts/bug-fix-plan-contract/v1/schema.json

      - id: s3_2_arch_review
        name: "架构师评审"
        description: "架构师评审修复方案，关注风险"
        run: agent.dev.tech_architect
        execution:
          model: prompt_switch
          timeout: 30m

        dependencies:
          requires: [s3_1_fix_plan]

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"

        outputs:
          - path: "output/bug-fix-arch-review.yaml"

      - id: s3_3_fix_plan_gate
        name: "修复方案门禁"
        type: gate_decision

        dependencies:
          requires: [s3_2_arch_review]

        gate:
          ref: gate.dev.bugfix_plan_gate
          checks:
            - "plan_complete"
            - "rollback_plan"
            - "test_plan"
            - "risk_assessed"

        on_fail:
          action: "request_human_gate"
          message: "修复方案门禁未通过，触发人类门禁"

      - id: s3_4_risk_human_gate
        name: "风险人类门禁"
        kind: human_gate
        description: "高风险修复方案需人类评审"
        condition: "fix_plan.risk_assessment.level == 'HIGH'"
        depends_on:
          - s3_3_fix_plan_gate

        gate_rules:
          reviewers:
            - role: tech_lead
              description: "技术负责人"
            - role: architect
              description: "架构师"
          approval_criteria:
            - label: "风险可接受"
              criteria: "风险已评估且有缓解措施"
              required: true
            - label: "回滚可行"
              criteria: "回滚方案可执行"
              required: true

  # ========== Stage 4: 修复与验证 ==========
  - id: s4_fix_and_verify
    name: "修复与验证"
    description: "按方案修复并本地验证"

    steps:
      - id: s4_0_repro_check
        name: "复现状态检查"
        type: decision
        dependencies:
          requires: [s3_3_fix_plan_gate]
        decision_logic: |
          IF root_cause.analysis_state == "cannot_reproduce":
            next_stage = s6_finalize
          ELSE:
            next_step = s4_1_fix_code

      - id: s4_1_fix_code
        name: "修复代码"
        run: agent.dev.bug_fix_implementer
        execution:
          model: prompt_switch
          timeout: 90m

        dependencies:
          requires: [s4_0_repro_check]

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"
          - bug_contract: "bugs/*.contract.yaml"

        outputs:
          - path: "output/fix-commit-summary.yaml"

      - id: s4_2_verify_local
        name: "本地验证"
        run: agent.dev.bug_fix_verifier
        execution:
          model: prompt_switch
          timeout: 45m

        dependencies:
          requires: [s4_1_fix_code]

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"
          - repro_result: "output/repro-result.yaml"

        outputs:
          - path: "output/bug-fix-status.yaml"
            contract: ../../contracts/bug-fix-status-contract/v1/schema.json
          - path: "output/verification-result.yaml"

      - id: s4_3_verify_decision
        name: "验证结果判定"
        type: decision
        dependencies:
          requires: [s4_2_verify_local]
        decision_logic: |
          IF verification.status == "pass":
            next_stage = s5_code_review
          ELIF fix_attempts < 10:
            next_step = s4_1_fix_code
          ELSE:
            rollback_to = s3_fix_plan

  # ========== Stage 5: 代码审核与技术债 ==========
  - id: s5_code_review
    name: "代码审核"
    description: "代码审核与问题修复"

    steps:
      - id: s5_1_code_review
        name: "代码审核"
        run: agent.dev.code_reviewer
        execution:
          model: prompt_switch
          timeout: 40m

        dependencies:
          requires: [s4_2_verify_local]

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"
          - code_changes: "output/fix-commit-summary.yaml"

        outputs:
          - path: "output/code-review-report.yaml"

      - id: s5_2_fix_review_issues
        name: "修复高优先级问题"
        run: agent.dev.bug_fix_implementer
        execution:
          model: prompt_switch
          timeout: 60m

        dependencies:
          requires: [s5_1_code_review]

        inputs:
          - review_report: "output/code-review-report.yaml"

        outputs:
          - path: "output/review-fix-summary.yaml"

      - id: s5_3_review_verify
        name: "复核验证"
        run: agent.dev.bug_fix_verifier
        execution:
          model: prompt_switch
          timeout: 45m

        dependencies:
          requires: [s5_2_fix_review_issues]

        inputs:
          - fix_plan: "output/bug-fix-plan.yaml"
          - review_fix_summary: "output/review-fix-summary.yaml"

        outputs:
          - path: "output/bug-fix-status.yaml"
            contract: ../../contracts/bug-fix-status-contract/v1/schema.json
          - path: "output/review-verify-result.yaml"

      - id: s5_4_debt_record
        name: "记录技术债务"
        run: agent.dev.bug_technical_debt_recorder
        execution:
          model: prompt_switch
          timeout: 20m

        dependencies:
          requires: [s5_1_code_review]

        inputs:
          - review_report: "output/code-review-report.yaml"
          - bug_status: "output/bug-fix-status.yaml"

        outputs:
          - path: "output/technical-debt.yaml"
            contract: ../../contracts/technical-debt-contract/v1/schema.json

  # ========== Stage 6: 收尾与沉淀 ==========
  - id: s6_finalize
    name: "提交与沉淀"
    description: "提交代码并沉淀知识"

    steps:
      - id: s6_0_non_repro_close
        name: "不可复现收尾"
        description: "无法复现时收尾，输出最终状态"
        run: agent.dev.bug_fix_verifier
        execution:
          model: prompt_switch
          timeout: 10m

        dependencies:
          requires: [s4_0_repro_check]

        condition: "root_cause.analysis_state == 'cannot_reproduce'"

        inputs:
          - bug_status: "output/bug-fix-status.yaml"
          - root_cause: "output/bug-root-cause.yaml"

        outputs:
          - path: "output/bug-fix-status.yaml"
            contract: ../../contracts/bug-fix-status-contract/v1/schema.json

      - id: s6_1_git_commit
        name: "提交 Git"
        run: agent.dev.bug_fix_implementer
        execution:
          model: prompt_switch
          timeout: 20m

        dependencies:
          requires: [s5_3_review_verify]

        inputs:
          - fix_summary: "output/fix-commit-summary.yaml"
          - review_fix_summary: "output/review-fix-summary.yaml"

        outputs:
          - path: "output/git-commit.yaml"

      - id: s6_2_knowledge_capture
        name: "知识沉淀"
        run: agent.dev.bug_knowledge_curator
        execution:
          model: prompt_switch
          timeout: 20m

        dependencies:
          requires: [s6_1_git_commit]

        inputs:
          - bug_status: "output/bug-fix-status.yaml"
          - root_cause: "output/bug-root-cause.yaml"

        outputs:
          - path: "output/knowledge-capture.yaml"
            contract: ../../contracts/knowledge-capture-contract/v1/schema.json

      - id: s6_3_fix_experience
        name: "修复经验输出"
        run: agent.dev.bug_knowledge_curator
        execution:
          model: prompt_switch
          timeout: 10m

        dependencies:
          requires: [s6_2_knowledge_capture]

        inputs:
          - knowledge: "output/knowledge-capture.yaml"

        outputs:
          - path: "output/fix-experience.md"

# ============================================
# 循环控制
# ============================================
loop_control:
  reproduction:
    max_attempts: 10
    on_exhausted:
      action: "mark_cannot_reproduce"
      next_stage: s6_finalize

  fix_verification:
    max_attempts: 10
    on_exhausted:
      action: "rollback_to_fix_plan"
      next_stage: s3_fix_plan

  plan_rollback:
    max_rollbacks: 3
    on_exhausted:
      action: "trigger_human_gate"
      human_gate: s3_4_risk_human_gate

# ============================================
# 退出条件
# ============================================
exit_conditions:
  success:
    - condition: "bug_fix_status.status == 'fixed'"
      description: "Bug 修复并验证通过"

  failure:
    - condition: "bug_fix_status.status == 'cannot_reproduce'"
      description: "Bug 无法复现"
    - condition: "plan_rollback_count >= 3"
      description: "修复方案回滚超过 3 次"
      action: "require_human_review"

# ============================================
# 产物契约
# ============================================
outputs_contract:
  required:
    - file: "output/bug-fix-status.yaml"
      schema: "development/contracts/bug-fix-status-contract/v1/schema.json"
    - file: "output/bug-root-cause.yaml"
      schema: "development/contracts/bug-root-cause-contract/v1/schema.json"
    - file: "output/bug-fix-plan.yaml"
      schema: "development/contracts/bug-fix-plan-contract/v1/schema.json"

  optional:
    - file: "output/technical-debt.yaml"
      schema: "development/contracts/technical-debt-contract/v1/schema.json"
    - file: "output/knowledge-capture.yaml"
      schema: "development/contracts/knowledge-capture-contract/v1/schema.json"
    - file: "output/fix-experience.md"
      description: "修复经验总结"

# ============================================
# Agent 资源池
# ============================================
agent_resources:
  - id: agent.dev.bug_reproducer
    spec: ../../agents/bug-reproducer/v1/agent.yaml
  - id: agent.dev.bug_root_cause_analyst
    spec: ../../agents/bug-root-cause-analyst/v1/agent.yaml
  - id: agent.dev.bug_fix_planner
    spec: ../../agents/bug-fix-planner/v1/agent.yaml
  - id: agent.dev.bug_fix_implementer
    spec: ../../agents/bug-fix-implementer/v1/agent.yaml
  - id: agent.dev.bug_fix_verifier
    spec: ../../agents/bug-fix-verifier/v1/agent.yaml
  - id: agent.dev.bug_technical_debt_recorder
    spec: ../../agents/bug-technical-debt-recorder/v1/agent.yaml
  - id: agent.dev.bug_knowledge_curator
    spec: ../../agents/bug-knowledge-curator/v1/agent.yaml
  - id: agent.dev.tech_architect
    spec: ../../agents/tech-architect/v1/agent.yaml
  - id: agent.dev.code_reviewer
    spec: ../../agents/code-reviewer/v1/agent.yaml

# ============================================
# 门禁资源池
# ============================================
gate_resources:
  - id: gate.dev.bugfix_plan_gate
    spec: ../../gates/bugfix-plan-gate/v1/gate.yaml

# ============================================
# 元数据
# ============================================
metadata:
  created_by: "dev-workflow-architect"
  created_at: "2026-02-06"
  version: "1.0"
  last_updated: "2026-02-06"

  changelog:
    - version: "1.0"
      date: "2026-02-06"
      changes:
        - "新增 Bug 修复工作流"
        - "包含复现、定位、修复、验证、评审与知识沉淀"
