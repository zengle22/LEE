# Feature Contract Design L3 Workflow v1.0
# 特性协议设计与冻结子流程（L3）
#
# L2 调用方: workflow.dev.feature (Phase 1)
# 职责: 协议设计 → 自检 → 冻结门禁

kind: workflow
version: "1.0"

id: workflow.dev.feature_contract_l3
name: Feature Contract Design Workflow (L3)
description: >
  聚焦 API 协议设计与冻结的子流程：
  需求分析 → 协议设计 → DTO 定义 → 版本管理 → 自检 → 冻结门禁。
  确保协议完整、字段清晰、版本正确后冻结，不可私改。
owner: development
tags: [workflow, dev, feature, contract, l3, contract-first]

# ============================================
# 角色地图
# ============================================
roles:
  agents:
    - agent.dev.contract_designer        # 协议设计
    - agent.dev.code_self_reviewer       # 自检
  skills: []
  gates:
    - gate.dev.contract_freeze_gate      # 协议冻结门禁

# ============================================
# 契约定义
# ============================================
contracts:
  inputs:
    - feature_spec:
        path: ../../contracts/feature-spec/v1/schema.json
        description: Feature Spec 输入
    - existing_contracts:
        description: 已有 API 协议（可选，用于增量设计）
        required: false
  outputs:
    - api_contract:
        path: ../../contracts/api-contract/v1/schema.json
        description: 冻结后的 API 协议
    - contract_selfcheck:
        path: ../../contracts/selfcheck/v1/schema.json
        description: 协议自检报告

# ============================================
# 工作流阶段
# ============================================
stages:
  # ========== Stage 1: 需求分析 & 协议设计 ==========
  - id: s1_design
    name: "协议设计"
    description: "分析 Feature Spec，设计 API 端点与 DTO 结构"

    steps:
      - id: s1_1_analyze_spec
        name: "需求分析"
        description: >
          分析 Feature Spec，提取 API 需求：
          - 识别需要的 API 端点
          - 确定请求/响应 DTO
          - 识别依赖的已有 contract
        type: agent
        run: agent.dev.contract_designer
        execution:
          model: prompt_switch
          timeout: 30m

        inputs:
          - feature_spec: "$inputs.feature_spec"
          - existing_contracts: "$inputs.existing_contracts"
          - task: "analyze"

        outputs:
          - path: "output/contract-analysis.yaml"
            description: "API 需求分析结果"

      - id: s1_2_design_contract
        name: "设计 API 协议"
        description: >
          根据分析结果，设计完整的 API 协议：
          - 定义 API 端点（Method + Path + 描述）
          - 定义请求/响应 DTO（字段、类型、必填性）
          - 定义错误码
          - 写入版本号与 changelog
        type: agent
        run: agent.dev.contract_designer
        execution:
          model: prompt_switch
          timeout: 60m

        dependencies:
          requires: [s1_1_analyze_spec]

        inputs:
          - feature_spec: "$inputs.feature_spec"
          - contract_analysis: "output/contract-analysis.yaml"
          - existing_contracts: "$inputs.existing_contracts"
          - task: "design"

        outputs:
          - path: "output/api-contract.yaml"
            contract: ../../contracts/api-contract/v1/schema.json

        quality_rules:
          - "每个端点必须有 Method + Path + 描述"
          - "每个 DTO 字段必须有 name + type + required"
          - "不允许模糊类型 (any, object 等)"
          - "字段命名必须 snake_case"
          - "版本号必须符合 SemVer"
          - "必须包含 changelog 条目"

  # ========== Stage 2: 自检 ==========
  - id: s2_selfcheck
    name: "协议自检"
    description: "对设计的协议进行自检，确保完整性和规范性"

    steps:
      - id: s2_1_selfcheck
        name: "协议自检"
        description: >
          自检内容：
          - DTO 字段完整性（无遗漏、无模糊类型）
          - 命名规范（snake_case）
          - 版本号正确性
          - Changelog 条目
          - 与已有 contract 的兼容性
        type: agent
        run: agent.dev.code_self_reviewer
        execution:
          model: prompt_switch
          timeout: 20m

        dependencies:
          requires: [s1_2_design_contract]

        inputs:
          - api_contract: "output/api-contract.yaml"
          - feature_spec: "$inputs.feature_spec"

        outputs:
          - path: "output/contract-selfcheck.json"
            contract: ../../contracts/selfcheck/v1/schema.json

        checklist:
          - "[ ] 所有端点都有请求和响应 DTO"
          - "[ ] 所有字段类型明确（无 any/object）"
          - "[ ] 字段命名 snake_case"
          - "[ ] 版本号 SemVer 格式"
          - "[ ] Changelog 有当前版本条目"
          - "[ ] 必填字段标注 required"
          - "[ ] 错误码有明确描述"

      - id: s2_2_selfcheck_decision
        name: "自检结果判定"
        type: decision
        dependencies:
          requires: [s2_1_selfcheck]
        decision_logic: |
          IF selfcheck.status == "pass":
            next_stage = s3_freeze
          ELIF selfcheck_attempts < 3:
            rollback_to = s1_2_design_contract
            message = "自检未通过，重新修正协议"
          ELSE:
            action = "trigger_human_gate"
            message = "自检 3 次未通过，需人类介入"

  # ========== Stage 3: 冻结门禁 ==========
  - id: s3_freeze
    name: "协议冻结"
    description: "通过冻结门禁后，协议不可修改"

    steps:
      - id: s3_1_freeze_gate
        name: "协议冻结门禁"
        type: gate_decision
        description: "验证协议完整性，通过后正式冻结"

        dependencies:
          requires: [s2_2_selfcheck_decision]

        gate:
          ref: gate.dev.contract_freeze_gate
          checks:
            - "contract_file_exists"
            - "version_updated"
            - "changelog_updated"
            - "field_naming_convention"
            - "type_clarity"
            - "no_ambiguous_fields"

        on_pass:
          action: "freeze_contract"
          message: "协议冻结成功，后续阶段不得私自修改"
          post_actions:
            - "标记 contract 为 frozen 状态"
            - "记录冻结时间戳"
            - "生成 contract hash 供后续校验"

        on_fail:
          action: "return_to_designer"
          message: "冻结门禁未通过，请修正后重试"
          retry_limit: 5
          rollback_to: s1_2_design_contract

# ============================================
# 循环控制
# ============================================
loop_control:
  selfcheck:
    max_attempts: 3
    on_exhausted:
      action: "trigger_human_gate"
      message: "协议自检 3 次未通过，需人类介入"

  freeze_gate:
    max_attempts: 5
    on_exhausted:
      action: "trigger_human_gate"
      message: "协议冻结 5 次未通过，需人类介入"

# ============================================
# 退出条件
# ============================================
exit_conditions:
  success:
    - condition: "freeze_gate.status == 'passed'"
      description: "协议冻结成功"

  failure:
    - condition: "freeze_attempts >= 5"
      description: "协议反复无法通过冻结"
      action: "require_human_review"

# ============================================
# 产物契约
# ============================================
outputs_contract:
  required:
    - file: "output/api-contract.yaml"
      schema: "development/contracts/api-contract/v1/schema.json"
    - file: "output/contract-selfcheck.json"
      schema: "development/contracts/selfcheck/v1/schema.json"

  optional:
    - file: "output/contract-analysis.yaml"
      description: "协议需求分析结果"

# ============================================
# Agent 资源池
# ============================================
agent_resources:
  - id: agent.dev.contract_designer
    spec: ../../agents/contract-designer/v1/agent.yaml
  - id: agent.dev.code_self_reviewer
    spec: ../../agents/code-self-reviewer/v1/agent.yaml

# ============================================
# 门禁资源池
# ============================================
gate_resources:
  - id: gate.dev.contract_freeze_gate
    spec: ../../gates/contract-freeze-gate/v1/gate.yaml

# ============================================
# 元数据
# ============================================
metadata:
  created_by: "dev-workflow-architect"
  created_at: "2026-02-11"
  version: "1.0"
  last_updated: "2026-02-11"

  changelog:
    - version: "1.0"
      date: "2026-02-11"
      changes:
        - "新建协议设计与冻结 L3 子流程"
        - "Stage 1: 需求分析 + 协议设计"
        - "Stage 2: 协议自检 (字段完整性、命名规范、版本号)"
        - "Stage 3: 冻结门禁 (通过后不可私改)"
