# Migrated by lint_l3_templates.py on 2026-03-15T00:01:44.041082
kind: l3_workflow_template
version: '2.0'
id: template.dev.feature_be_l3
name: Feature Backend Development L3 Template
description: 'Canonical L3 backend workflow for implementing backend behavior under TECH and

  frozen contract constraints with an explicit UTDD loop.

  '
owner: development
tags:
- template
- dev
- feature
- backend
- l3
- canonical
- adr-008
- utdd
contracts:
  shared_input_schema: ../../../../../spec/contracts/shared-input-schema/v1/schema.json
  stage_definition: ../../stages/l3-backend-development.yaml
instance_schema:
  required_fields:
  - id
  - template_id
  - parent_phase_id
  - formal_ssot_id
  - source_refs
  - governing_adrs
  - tech_spec_ref
  - contract_freeze_ref
  - repo_backend
  optional_fields:
  - acceptance_brief_ref
  - repo_context
  - decision_constraints
  output_fields:
  - unit_test_ref
  - be_artifact_ref
  - refactor_report_ref
  - contract_verification_ref
  - coverage_report_ref
  - coverage_gate_result
  - be_handoff_package_ref
  - deliverables_production_report_ref
  - deliverables_production_result
  - deliverables_check_report_ref
  - deliverables_gate_result
stages:
- id: execution
  name: Execution Pipeline
  kind: stage
  description: Auto-migrated from root-level steps
  steps:
  - id: write_ut
    name: Write or Update Unit Tests
    kind: agent
    description: Encode expected backend behavior as unit tests before implementation changes.
    agent_id: agent.dev.go_backend_engineer
    mandatory: true
    depends_on: []
    outputs:
    - unit_test_ref
    - test_scope_ref
  - id: implement_backend
    name: Implement Backend Logic
    kind: agent
    description: Implement backend code until the frozen contract and UT expectations are satisfied.
    agent_id: agent.dev.go_backend_engineer
    mandatory: true
    depends_on:
    - write_ut
    outputs:
    - be_artifact_ref
    - implementation_notes
  - id: refactor_backend
    name: Refactor Backend
    kind: agent
    description: Refactor implementation while preserving passing tests and contract alignment.
    agent_id: agent.dev.go_backend_engineer
    mandatory: true
    depends_on:
    - implement_backend
    outputs:
    - refactor_report_ref
    - contract_verification_ref
  - id: coverage_gate
    name: Coverage Gate
    kind: agent
    description: Check that backend unit-test coverage meets the required threshold.
    agent_id: agent.dev.code_self_reviewer
    config:
      coverage_threshold: 80
      coverage_retry_target: write_ut
    mandatory: true
    depends_on:
    - refactor_backend
    outputs:
    - coverage_report_ref
    - coverage_gate_result
  - id: publish_backend
    name: Publish Backend Handoff
    kind: agent
    description: Publish backend handoff artifacts for frontend and integration phases.
    agent_id: agent.dev.code_self_reviewer
    mandatory: true
    depends_on:
    - coverage_gate
    outputs:
    - be_handoff_package_ref
    - handoff_notes
  - id: deliverables_production
    name: Deliverables Production
    kind: agent
    description: Produce missing deliverables defined in FEAT specification.
    agent_id: agent.dev.deliverables_producer
    config:
      search_dirs:
      - src
      - spec
      - docs
      - examples
      - output
    mandatory: true
    depends_on:
    - publish_backend
    outputs:
    - deliverables_production_report_ref
    - deliverables_production_result
    - produced_count
    - failed_count
  - id: deliverables_check
    name: Deliverables Completeness Check
    kind: agent
    description: Validate that all deliverables defined in FEAT specification are produced.
    agent_id: agent.dev.deliverables_reviewer
    config:
      search_dirs:
      - src
      - spec
      - docs
      - examples
      - output
      fail_on_missing: false
    mandatory: true
    depends_on:
    - deliverables_production
    outputs:
    - deliverables_check_report_ref
    - deliverables_gate_result
  - id: deliverables_gate
    name: Deliverables Completeness Gate
    kind: gate
    description: Human gate to review deliverables completeness before handoff.
    gate_type: human
    mandatory: true
    depends_on:
    - deliverables_check
    condition:
      deliverables_gate_result: pass
