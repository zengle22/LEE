# Migrated by lint_l3_templates.py on 2026-03-05T16:41:22.388874
kind: l3_workflow_template
version: '1.0'
id: template.dev.feature_be_l3
name: Feature Backend Development L3 Template
description: 'L3 template for backend implementation following frozen contract.


  This template defines the workflow for implementing backend code

  that strictly adheres to the frozen API contract.


  Key Design:

  - Stage 1: Implement DTO structs from contract

  - Stage 2: Implement API handlers

  - Stage 3: Self-check against contract

  - Stage 4: Code diff output

  '
owner: development
tags:
- template
- dev
- feature
- backend
- l3
- contract-first
stages:
- id: dto_implementation
  name: DTO Implementation
  kind: stage
  description: Implement DTO structs from frozen contract
  agent_id: agent.dev.go_backend_engineer
  mandatory: true
  depends_on: []
  outputs:
  - dto_files
  - model_files
- id: handler_implementation
  name: API Handler Implementation
  kind: stage
  description: Implement API handlers and business logic
  agent_id: agent.dev.go_backend_engineer
  mandatory: true
  depends_on:
  - dto_implementation
  outputs:
  - handler_files
  - service_files
- id: selfcheck
  name: Contract Self-Check
  kind: stage
  description: Verify response matches contract schema
  agent_id: agent.dev.code_self_reviewer
  mandatory: true
  depends_on:
  - handler_implementation
  outputs:
  - selfcheck_result
  - contract_violations
- id: code_output
  name: Code Diff Output
  kind: stage
  description: Generate code diff for review
  skill_id: skill.git.diff
  mandatory: true
  depends_on:
  - selfcheck
  outputs:
  - code_diff_path
contract_binding:
  description: Backend must follow frozen contract
  response_structure:
    rule: Response must match contract schema exactly
    violation_action: flag_contract_violation
  no_extra_fields:
    rule: No extra fields beyond contract definition
    violation_action: flag_contract_violation
  type_consistency:
    rule: Field types must match contract
    violation_action: flag_contract_violation
instance_schema:
  required_fields:
  - id
  - template_id
  - name
  - status
  - phase_id
  context_fields:
  - api_contract
  - feature_spec
  - repo_backend
  - feature_point_id
  output_fields:
  - code_diff_path
  - selfcheck_status
  - contract_violations
