# Feature Backend Development L3 Template
# 后端实现子流程（L3）
#
# L2 调用方: template.dev.feature (Phase 2: backend_dev)
# 职责: 基于 frozen contract 实现后端代码

kind: l3_workflow_template
version: "1.0"
id: template.dev.feature_be_l3
name: Feature Backend Development L3 Template
description: |
  L3 template for backend implementation following frozen contract.

  This template defines the workflow for implementing backend code
  that strictly adheres to the frozen API contract.

  Key Design:
  - Stage 1: Implement DTO structs from contract
  - Stage 2: Implement API handlers
  - Stage 3: Self-check against contract
  - Stage 4: Code diff output

owner: development
tags: [template, dev, feature, backend, l3, contract-first]

# L3 process stages
stages:
  - id: dto_implementation
    name: "DTO Implementation"
    kind: agent
    description: "Implement DTO structs from frozen contract"
    agent_id: agent.dev.go_backend_engineer
    mandatory: true
    depends_on: []
    outputs:
      - dto_files
      - model_files

  - id: handler_implementation
    name: "API Handler Implementation"
    kind: agent
    description: "Implement API handlers and business logic"
    agent_id: agent.dev.go_backend_engineer
    mandatory: true
    depends_on: [dto_implementation]
    outputs:
      - handler_files
      - service_files

  - id: selfcheck
    name: "Contract Self-Check"
    kind: agent
    description: "Verify response matches contract schema"
    agent_id: agent.dev.code_self_reviewer
    mandatory: true
    depends_on: [handler_implementation]
    outputs:
      - selfcheck_result
      - contract_violations  # Empty if compliant

  - id: code_output
    name: "Code Diff Output"
    kind: skill
    description: "Generate code diff for review"
    skill_id: skill.git.diff
    mandatory: true
    depends_on: [selfcheck]
    outputs:
      - code_diff_path

# Contract binding constraints
contract_binding:
  description: "Backend must follow frozen contract"

  response_structure:
    rule: "Response must match contract schema exactly"
    violation_action: "flag_contract_violation"

  no_extra_fields:
    rule: "No extra fields beyond contract definition"
    violation_action: "flag_contract_violation"

  type_consistency:
    rule: "Field types must match contract"
    violation_action: "flag_contract_violation"

# Instance schema
instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
    - phase_id  # Parent L2 phase: backend_dev
  context_fields:
    - api_contract  # Frozen contract from Phase 1
    - feature_spec
    - repo_backend
    - feature_point_id
  output_fields:
    - code_diff_path
    - selfcheck_status
    - contract_violations
