kind: l3_workflow_template
version: "1.0"
id: template.dev.bugfix_triage_l3
name: Bugfix Triage L3 Template
description: |
  Canonical L3 workflow for validating bug input and deciding single-bug or
  batch routing before root-cause analysis begins.
owner: development
tags: [template, dev, bugfix, triage, l3, canonical]

steps:
  - id: validate_bug_input
    name: Validate Bug Input
    kind: agent
    description: Validate bug SSOT, severity, and reproduction evidence.
    agent_id: agent.dev.bug_triage
    mandatory: true
    depends_on: []
    outputs:
      - input_validation_ref
      - triage_notes

  - id: classify_bug_path
    name: Classify Bug Path
    kind: agent
    description: Determine whether the issue is implementation or contract related.
    agent_id: agent.dev.bug_triage
    mandatory: true
    depends_on: [validate_bug_input]
    outputs:
      - triage_decision_ref
      - suggested_flow

  - id: review_batch_eligibility
    name: Review Batch Eligibility
    kind: stage
    description: Validate five-same rule for batch mode.
    gate_id: gate.dev.bugfix_plan_gate
    mandatory: true
    depends_on: [classify_bug_path]
    outputs:
      - granularity_decision_ref
      - batch_approval_record

  - id: publish_triage
    name: Publish Triage Package
    kind: agent
    description: Publish triage package for the next bugfix phase.
    agent_id: agent.dev.code_self_reviewer
    mandatory: true
    depends_on: [review_batch_eligibility]
    outputs:
      - triage_package_ref

instance_schema:
  required_fields:
    - id
    - template_id
    - parent_phase_id
  output_fields:
    - triage_decision_ref
    - granularity_decision_ref
    - batch_approval_record
    - triage_package_ref
