# Feature Development L2 Template
# 特性开发主工作流（L2 编排）
#
# 核心流程：协议冻结 → 前后端并行 → 连调验证 → 冒烟守门

kind: l2_workflow_template
version: "2.1"
id: template.dev.feature
name: Feature Development L2 Template
description: |
  L2 template for Feature development with 4 phases.

  This template defines the structure for dev department-level feature workflows.
  Phase 1 spawns L3 for contract design, Phase 2 spawns L3s for FE/BE parallel development,
  Phase 3 spawns L3 for integration testing, Phase 4 handles smoke test gates.

  Workflow Flow:
  - Phase 1: Contract Design (L3) - Design and freeze API contract
  - Phase 2: Parallel Development (L3s) - FE and BE development in parallel
  - Phase 3: Integration (L3) - Integration testing and verification
  - Phase 4: Smoke Test (Direct) - Smoke test gate and code review

owner: development
tags: [template, dev, feature, l2, contract-first]

# ============================================
# Phase definitions - structural elements that cannot be omitted
# ============================================
phases:
  - id: contract_design
    name: "Contract Design"
    description: "Design and freeze API contract with L3 sub-workflow"
    default_complexity: L  # Spawns L3
    depends_on: []
    spawns_l3: true
    l3_template_id: template.dev.feature_contract_l3

  - id: frontend_dev
    name: "Frontend Development"
    description: "Frontend implementation following frozen contract"
    default_complexity: L  # Spawns L3
    depends_on: [contract_design]
    spawns_l3: true
    l3_template_id: template.dev.feature_fe_l3

  - id: backend_dev
    name: "Backend Development"
    description: "Backend implementation following frozen contract"
    default_complexity: L  # Spawns L3
    depends_on: [contract_design]
    spawns_l3: true
    l3_template_id: template.dev.feature_be_l3

  - id: integration
    name: "Integration Testing"
    description: "Integration testing and verification"
    default_complexity: L  # Spawns L3
    depends_on: [frontend_dev, backend_dev]
    spawns_l3: true
    l3_template_id: template.dev.feature_integration_l3

  - id: smoke_test
    name: "Smoke Test"
    description: "Smoke test gate - blocks merge on failure"
    default_complexity: S  # Direct execution
    depends_on: [integration]

# Execution strategy by complexity
execution_strategies:
  S:
    description: "Direct execution - run phase steps inline in L2"
    spawns_l3: false
  L:
    description: "Spawn L3 - create L3 instance(s) for feature point execution"
    spawns_l3: true

# Contract-first constraints
contract_first_policy:
  description: "Contract must be frozen before any implementation"
  rules:
    - rule: "contract_freeze_required"
      description: "Phase 1 (contract_design) must pass before Phase 2/3"
      violation_action: "block_parallel_development"
    - rule: "contract_binding"
      description: "FE/BE must follow frozen contract strictly"
      violation_action: "rollback_to_contract_design"
    - rule: "structural_rollback"
      description: "Integration issues due to contract structure → rollback to Phase 1"
      max_rollback: 2
      violation_action: "trigger_human_gate"

# L2 to L3 data contract (for Phase 1: Contract Design)
l3_input_schema:
  description: "Input data passed to Contract Design L3 instance"
  required_fields:
    - feature_spec
    - project
    - module
    - feature_point_id
  optional_fields:
    - existing_contracts
    - contract_version
    - governing_adrs
    - decision_refs
    - decision_constraints
    - architecture_constraints
    - process_constraints

# L3 to L2 data contract
l3_output_schema:
  description: "Output data returned from L3 instances"
  required_fields:
    - phase_id
    - status  # completed, failed, blocked
    - artifacts
  optional_fields:
    - contract_violation
    - rollback_request

# Instance schema (for validation)
instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
    - context
    - phases
  context_fields:
    - project
    - module
    - feature_point_id
    - feature_spec_path
    - repo_frontend
    - repo_backend
    - governing_adrs
    - decision_refs
    - decision_constraints
    - architecture_constraints
    - process_constraints
  phase_fields:
    - id
    - complexity
    - status
    - l3_instance_ids
    - depends_on

# Anti-Rollback Constitution
constitution:
  id: contract_first_constitution_v1
  name: "Contract-First Development Constitution"
  version: "1.0"
  description: |
    In dev L2/L3 workflows:
    - Contract must be frozen before implementation
    - No private changes to frozen contract
    - Structural issues trigger rollback to contract design
    - Smoke test failure blocks merge

  principles:
    - id: contract_freeze_first
      name: "Contract Freeze First"
      rule: "Phase 1 must complete successfully before Phase 2/3"

    - id: contract_binding_strict
      name: "Contract Binding Strict"
      rule: "FE/BE implementation must match frozen contract exactly"

    - id: no_private_contract_changes
      name: "No Private Contract Changes"
      rule: "Contract changes require explicit rollback to Phase 1"

    - id: smoke_gate_blocking
      name: "Smoke Gate Blocking"
      rule: "Smoke test failure blocks merge with highest priority"

adr_context_policy:
  description: "ADR is governance context, not business source"
  rules:
    - rule: "governance_context_input"
      description: "When provided, governing_adrs / decision_constraints / architecture_constraints / process_constraints must be propagated to L3s and treated as hard execution constraints"
    - rule: "decision_refs_trace"
      description: "Dev outputs should retain decision_refs or governing_adrs in trace so contract / TECH / TASK implementation decisions remain auditable"
    - rule: "adr_not_business_parent"
      description: "ADR may constrain implementation, but must not replace feature_spec or act as the business source object"
