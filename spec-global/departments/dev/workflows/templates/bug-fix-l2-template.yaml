# Bug Fix L2 Template
# Bug 修复主工作流（L2 编排）
#
# 核心流程：根因分析 → 修复实现 → 验证测试 → 合并审核

kind: l2_workflow_template
version: "1.0"
id: template.dev.bug_fix
name: Bug Fix L2 Template
description: |
  L2 template for Bug fix workflow.

  This template defines the structure for dev department-level bug fix workflows.

  Workflow Flow:
  - Phase 1: Root Cause Analysis (Direct)
  - Phase 2: Fix Implementation (L3)
  - Phase 3: Verification (L3)
  - Phase 4: Merge Review (Direct)

owner: development
tags: [template, dev, bug-fix, l2]

# ============================================
# Phase definitions
# ============================================
phases:
  - id: root_cause_analysis
    name: "Root Cause Analysis"
    description: "Analyze bug and identify root cause"
    default_complexity: S  # Direct execution
    depends_on: []

  - id: fix_implementation
    name: "Fix Implementation"
    description: "Implement bug fix"
    default_complexity: L  # Spawns L3
    depends_on: [root_cause_analysis]
    spawns_l3: true
    l3_template_id: template.dev.bug_fix_impl_l3

  - id: verification
    name: "Verification"
    description: "Verify fix and prevent regression"
    default_complexity: L  # Spawns L3
    depends_on: [fix_implementation]
    spawns_l3: true
    l3_template_id: template.dev.bug_fix_verify_l3

  - id: merge_review
    name: "Merge Review"
    description: "Code review and merge decision"
    default_complexity: S  # Direct execution
    depends_on: [verification]

# Execution strategy by complexity
execution_strategies:
  S:
    description: "Direct execution - run phase steps inline in L2"
    spawns_l3: false
  L:
    description: "Spawn L3 - create L3 instance(s) for bug fix work"
    spawns_l3: true

# L2 to L3 data contract
l3_input_schema:
  description: "Input data passed to Bug Fix L3 instances"
  required_fields:
    - bug_id
    - bug_description
    - root_cause
    - project
    - repo
  optional_fields:
    - reproduction_steps
    - related_tests

# L3 to L2 data contract
l3_output_schema:
  description: "Output data returned from Bug Fix L3 instances"
  required_fields:
    - phase_id
    - status
    - artifacts
  optional_fields:
    - fix_verification_failed

# Instance schema
instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
    - context
  context_fields:
    - bug_id
    - bug_description
    - project
    - repo
    - severity
