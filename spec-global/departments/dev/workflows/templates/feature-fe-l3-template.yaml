# Feature Frontend Development L3 Template
# 前端实现子流程（L3）
#
# L2 调用方: template.dev.feature (Phase 2: frontend_dev)
# 职责: 基于 frozen contract 实现前端代码

kind: l3_workflow_template
version: "1.0"
id: template.dev.feature_fe_l3
name: Feature Frontend Development L3 Template
description: |
  L3 template for frontend implementation following frozen contract.

  This template defines the workflow for implementing frontend code
  that strictly adheres to the frozen API contract.

  Key Design:
  - Stage 1: Generate types from contract
  - Stage 2: Implement UI components
  - Stage 3: Self-check against contract
  - Stage 4: Code diff output

owner: development
tags: [template, dev, feature, frontend, l3, contract-first]

# L3 process stages
stages:
  - id: type_generation
    name: "Type Generation"
    kind: agent
    description: "Generate TypeScript types from frozen contract"
    agent_id: agent.dev.uniapp_frontend_engineer
    mandatory: true
    depends_on: []
    outputs:
      - types_file
      - api_client_stub

  - id: implementation
    name: "UI Implementation"
    kind: agent
    description: "Implement UI components and logic"
    agent_id: agent.dev.uniapp_frontend_engineer
    mandatory: true
    depends_on: [type_generation]
    outputs:
      - component_files
      - view_files

  - id: selfcheck
    name: "Contract Self-Check"
    kind: agent
    description: "Verify implementation matches contract"
    agent_id: agent.dev.code_self_reviewer
    mandatory: true
    depends_on: [implementation]
    outputs:
      - selfcheck_result
      - contract_violations  # Empty if compliant

  - id: code_output
    name: "Code Diff Output"
    kind: skill
    description: "Generate code diff for review"
    skill_id: skill.git.diff
    mandatory: true
    depends_on: [selfcheck]
    outputs:
      - code_diff_path

# Contract binding constraints
contract_binding:
  description: "Frontend must follow frozen contract"

  type_generation:
    rule: "Types must be generated from contract, not hand-written"
    violation_action: "fail_selfcheck"

  field_usage:
    rule: "Only use fields defined in contract"
    violation_action: "flag_contract_violation"

  endpoint_calls:
    rule: "API calls must match contract endpoints"
    violation_action: "flag_contract_violation"

# Instance schema
instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
    - phase_id  # Parent L2 phase: frontend_dev
  context_fields:
    - api_contract  # Frozen contract from Phase 1
    - feature_spec
    - repo_frontend
    - feature_point_id
  output_fields:
    - code_diff_path
    - selfcheck_status
    - contract_violations
