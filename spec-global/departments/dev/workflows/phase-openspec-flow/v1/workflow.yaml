  │   │   │   ├── tasks.md
  │   │   │   └── design.md
  │   │   └── archive/
  │   │
  │   ├── 04-implementation/        # [p5] 实现引用
  │   │   ├── ai-contracts/         # AI 工程契约 (如适用)
  │   │   ├── migrations/           # 数据库迁移 (如适用)
  │   │   └── README.md             # 指向 src/
