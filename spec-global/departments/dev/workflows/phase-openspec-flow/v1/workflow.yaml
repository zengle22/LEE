# ============================================
# 测试钩子 (v1.5 更新: 13 步骤，强化防跳过/防绕过)
# ============================================
tests:
  smoke:
    - name: single_phase_flow
      input:
        phase_id: "auth"
        phase_contract:
          inputs:
            requirement_source: "requirements/auth.md"
      assert:
        - path: "$.steps.length"
          op: "=="
          value: 13  # v1.5: 完整 13 步 (p1-p13)
        - path: "$.steps[10].id"
          op: "=="
          value: "p11_phase_acceptance"
        - path: "$.steps[10].mandatory"
          op: "=="
          value: true
        - path: "$.steps[10].skip_allowed"
          op: "=="
          value: false
        - path: "$.enforcement.skip_prevention.enabled"
          op: "=="
          value: true
        - path: "$.enforcement.bypass_prevention.enabled"
          op: "=="
          value: true

  replay:
    fixtures:
      - tests/fixtures/phase_openspec_flow_auth.json
