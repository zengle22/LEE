  │   ├── events.jsonl
  │   ├── approvals/
  │   └── tokens/
  │
  ├── openspec/                     # OpenSpec 工作空间
  │   ├── 00-config/                # [可选] 配置
  │   │   └── project.yaml
  │   │
  │   ├── 01-requirements/          # [p2] 需求校准
  │   │   ├── calibrated-requirements.md
  │   │   ├── tech-constraints.md
