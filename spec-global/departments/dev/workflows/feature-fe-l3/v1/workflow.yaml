# Feature FE Development L3 Workflow v1.1
# 特性前端开发子流程（L3）— TDD 模式
#
# TDD 流程：分支准备 → 需求分析 → 编写单测 → 测试评审 → 实现 → 静态检查 → 运行单测 → 自检

kind: workflow
version: "1.1"

# ============================================
# Dev 部门宪法引用 (强制)
# ============================================
constitution:
  ref: ../AGENTS.md
  version: "1.0"
  mandatory: true

id: workflow.dev.feature_fe_l3
name: Feature Frontend Development Workflow (L3) — TDD
description: >
  聚焦前端实现的 TDD 子流程：
  分支准备 → 需求分析 → 编写单元测试 → 测试脚本评审 → 前端实现 → 静态检查 → 运行单测 → 自检。
  测试先行，确保功能点在编码前已有完整测试覆盖。
owner: development
tags: [workflow, dev, feature, frontend, l3, tdd]

roles:
  agents:
    - agent.dev.uniapp_frontend_engineer
    - agent.dev.code_self_reviewer
  skills:
    - skill.git.checkout
    - skill.lint.ruff
    - skill.test.vitest
  gates: []

contracts:
  inputs:
    - feature_spec:
        path: ../../contracts/feature-spec/v1/schema.json
        description: Feature Spec 输入
  outputs:
    - fe_code_diff:
        path: ../../contracts/code-diff/v1/schema.json
        description: 前端代码差异
    - fe_selfcheck:
        path: ../../contracts/selfcheck/v1/schema.json
        description: 前端自检报告

# ============================================
# 工作流阶段
# ============================================
stages:
  # ========== Stage 1: 准备阶段 ==========
  - id: s1_prepare
    name: "准备阶段"
    steps:
      - id: s1_1_checkout
        name: "切换分支"
        type: skill
        run: skill.git.checkout
        inputs:
          - branch: "{{params.branch}}"
        outputs:
          - path: "output/fe-git-status.txt"

  # ========== Stage 2: 需求分析 ==========
  - id: s2_analyze
    name: "需求分析"
    description: "分析 Feature Spec，提取功能点列表与测试覆盖点"
    steps:
      - id: s2_1_analyze
        name: "需求分析与功能点提取"
        description: >
          分析 Feature Spec，产出结构化功能点列表：
          - 识别前端需要实现的功能点
          - 明确每个功能点的输入/输出/边界条件
          - 输出测试覆盖矩阵（功能点 → 测试用例映射）
        type: agent
        run: agent.dev.uniapp_frontend_engineer
        dependencies:
          requires: [s1_1_checkout]
        inputs:
          - feature_spec: "$inputs.feature_spec"
          - task: "analyze"
        outputs:
          - path: "output/fe-requirement-analysis.yaml"
            description: "功能点列表与测试覆盖矩阵"

  # ========== Stage 3: 编写单元测试（测试先行） ==========
  - id: s3_write_tests
    name: "编写单元测试"
    description: "根据功能点列表编写单元测试，此时不编写实现代码"
    steps:
      - id: s3_1_write_tests
        name: "编写测试用例"
        description: >
          根据需求分析产出的功能点列表，编写完整的单元测试：
          - 每个功能点至少一个测试用例
          - 覆盖正常路径、异常路径、边界条件
          - 测试应基于接口定义，不依赖内部实现
          - 此阶段只写测试代码，不写业务实现
        type: agent
        run: agent.dev.uniapp_frontend_engineer
        dependencies:
          requires: [s2_1_analyze]
        inputs:
          - feature_spec: "$inputs.feature_spec"
          - requirement_analysis: "output/fe-requirement-analysis.yaml"
          - task: "write_tests"
        outputs:
          - path: "output/fe-test-code-diff.patch"
            description: "单元测试代码差异"

  # ========== Stage 4: 测试脚本评审 ==========
  - id: s4_test_review
    name: "测试脚本评审"
    description: "评审测试用例的质量、覆盖率和准确性"
    steps:
      - id: s4_1_test_review
        name: "测试脚本评审"
        description: >
          评审编写的单元测试脚本：
          - 功能点覆盖率是否完整（对照功能点列表）
          - 正常/异常/边界用例是否充分
          - 测试命名是否清晰、可读
          - 断言是否准确、有意义
          - 测试之间是否独立、无耦合
        type: agent
        run: agent.dev.code_self_reviewer
        dependencies:
          requires: [s3_1_write_tests]
        inputs:
          - feature_spec: "$inputs.feature_spec"
          - requirement_analysis: "output/fe-requirement-analysis.yaml"
          - test_code_diff: "output/fe-test-code-diff.patch"
        outputs:
          - path: "output/fe-test-review.json"
            description: "测试脚本评审报告"

        checklist:
          - "[ ] 每个功能点至少有一个测试用例"
          - "[ ] 正常路径、异常路径、边界条件均有覆盖"
          - "[ ] 测试命名清晰（Test_功能_场景_期望结果）"
          - "[ ] 断言准确且有意义"
          - "[ ] 测试用例之间无依赖和耦合"
          - "[ ] 不依赖具体内部实现细节"

      - id: s4_2_review_decision
        name: "评审结果判定"
        type: decision
        dependencies:
          requires: [s4_1_test_review]
        decision_logic: |
          IF test_review.status == "pass":
            next_stage = s5_implement
          ELIF review_attempts < 3:
            rollback_to = s3_1_write_tests
            message = "测试评审未通过，回退修正测试用例"
          ELSE:
            action = "trigger_human_gate"
            message = "测试评审 3 次未通过，需人类介入"

  # ========== Stage 5: 实现阶段 ==========
  - id: s5_implement
    name: "实现阶段"
    description: "编写实现代码使测试通过，然后执行静态检查、运行单测、自检"
    steps:
      - id: s5_1_impl
        name: "前端实现"
        description: >
          根据已有的测试用例编写实现代码，使所有测试通过：
          - 参照测试用例理解接口契约
          - 编写最小化实现代码使测试通过
          - 实现完成后所有测试应为绿色
        type: agent
        run: agent.dev.uniapp_frontend_engineer
        dependencies:
          requires: [s4_2_review_decision]
        inputs:
          - feature_spec: "$inputs.feature_spec"
          - frontend_task_spec: "$inputs.frontend_task_spec"
          - requirement_analysis: "output/fe-requirement-analysis.yaml"
          - test_code_diff: "output/fe-test-code-diff.patch"
        outputs:
          - path: "output/fe-code-diff.patch"
            contract: ../../contracts/code-diff/v1/schema.json

      - id: s5_2_lint
        name: "前端静态检查"
        type: skill
        run: skill.lint.ruff
        dependencies:
          requires: [s5_1_impl]
        inputs:
          - command: "ruff check ."
        outputs:
          - path: "output/fe-lint-report.txt"

      - id: s5_3_unit_test
        name: "运行单元测试"
        description: "运行所有单元测试，确认实现使全部测试通过"
        type: skill
        run: skill.test.vitest
        dependencies:
          requires: [s5_2_lint]
        inputs:
          - command: "npx vitest run"
        outputs:
          - path: "output/fe-test-report.json"
          - path: "output/fe-coverage.json"

      - id: s5_4_selfcheck
        name: "前端自检"
        type: agent
        run: agent.dev.code_self_reviewer
        dependencies:
          requires: [s5_3_unit_test]
        inputs:
          - feature_spec: "$inputs.feature_spec"
          - test_report: "output/fe-test-report.json"
        outputs:
          - path: "output/fe-selfcheck.json"
            contract: ../../contracts/selfcheck/v1/schema.json

# ============================================
# 循环控制
# ============================================
loop_control:
  test_review:
    max_attempts: 3
    on_exhausted:
      action: "trigger_human_gate"
      message: "测试评审 3 次未通过，需人类介入"

# ============================================
# 元数据
# ============================================
metadata:
  created_by: "dev-workflow-architect"
  created_at: "2026-02-11"
  version: "1.1"
  last_updated: "2026-02-12"

  changelog:
    - version: "1.1"
      date: "2026-02-12"
      changes:
        - "改造为 TDD 流程"
        - "新增 Stage 2: 需求分析与功能点提取"
        - "新增 Stage 3: 编写单元测试（测试先行）"
        - "新增 Stage 4: 测试脚本评审（含回退逻辑）"
        - "原实现/lint/单测运行/自检移至 Stage 5"
    - version: "1.0"
      date: "2026-02-11"
      changes:
        - "初始版本：分支准备 → 实现 → lint → 单测 → 自检"
