# File Read Skill v1.0

kind: skill
version: 1.0

id: skill.file.read
name: File Read
description: >
  读取文件内容，支持文本和 JSON 文件。
owner: dev-team
tags: [io, dev]

interface:
  inputs:
    type: object
    required: [path]
    properties:
      path:
        type: string
        description: "文件路径"
      encoding:
        type: string
        description: "文件编码"
        default: "utf-8"
  outputs:
    type: object
    properties:
      content:
        type: string
        description: "文件内容"
      size:
        type: integer
        description: "文件大小（字节）"
      exists:
        type: boolean

runtime:
  type: cli
  command: "cat"
  args_template: "{{ inputs.path }}"
  exit_codes:
    0: "读取成功"
    1: "文件不存在或无权限"

constraints:
  - must_pass: "exit_code == 0"
    on_fail: "文件读取失败，检查路径和权限"
