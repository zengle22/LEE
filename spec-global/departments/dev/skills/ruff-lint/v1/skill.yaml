# Ruff Lint Skill v1.0

kind: skill
version: 1.0

id: skill.lint.ruff
name: Ruff Lint
description: >
  运行 ruff 静态检查和格式化校验。
owner: dev-team
tags: [lint, dev]

interface:
  inputs:
    type: object
    required: [target]
    properties:
      target:
        type: string
        description: "检查目录或文件路径"
        default: "src/"
      fix:
        type: boolean
        description: "是否自动修复"
        default: false
      format_check:
        type: boolean
        description: "是否同时检查格式"
        default: true
      output_format:
        type: string
        description: "输出格式"
        default: "json"
        enum: [text, json, grouped, github]
  outputs:
    type: object
    properties:
      exit_code:
        type: integer
      stdout:
        type: string
      violations_count:
        type: integer

runtime:
  type: cli
  command: "ruff"
  args_template: >
    check {{ inputs.target }}
    --output-format={{ inputs.output_format }}
    {% if inputs.fix %}--fix{% endif %}
  exit_codes:
    0: "无违规"
    1: "存在违规"
    2: "命令错误"

constraints:
  - must_pass: "exit_code == 0"
    on_fail: "lint 不通过，需先修复再提交"
