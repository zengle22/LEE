# Pytest Runner Skill v1.0

kind: skill
version: 1.0

id: skill.test.pytest
name: Pytest Runner
description: >
  运行 pytest 单元测试，产出结构化测试报告。
owner: dev-team
tags: [test, dev]

interface:
  inputs:
    type: object
    required: [target]
    properties:
      target:
        type: string
        description: "测试目录或文件路径"
        default: "tests/"
      args:
        type: string
        description: "额外 pytest 参数，如 '-x -v --tb=short'"
        default: ""
      report_json:
        type: string
        description: "JSON 报告输出路径"
        default: "test-report.json"
  outputs:
    type: object
    properties:
      exit_code:
        type: integer
        description: "0=全部通过, 1=有失败, 2=中断/错误"
      stdout:
        type: string
      report_json:
        type: string
        description: "JSON 报告文件路径"

runtime:
  type: cli
  command: "pytest"
  args_template: >
    {{ inputs.target }}
    {{ inputs.args }}
    --json-report
    --json-report-file={{ inputs.report_json }}
  exit_codes:
    0: "所有测试通过"
    1: "存在测试失败"
    2: "中断或收集错误"
    5: "未找到测试用例"

constraints:
  - must_pass: "exit_code == 0"
    on_fail: "标记 task FAILED，附上 report_json"
