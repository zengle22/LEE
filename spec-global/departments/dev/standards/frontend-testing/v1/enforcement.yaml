# Frontend Testing Standard Enforcement
# 前端测试规范强制执行配置

kind: standard-enforcement
version: "1.0"

standard:
  id: STD-DEV-FE-TEST-001
  name: "Frontend Testing Data-Testid Specification"
  path: ./testid-spec.md
  
enforcement:
  level: mandatory
  scope: ["all-frontend-projects", "uni-app", "vue"]
  effective_date: "2026-02-06"
  
rules:
  - id: RULE-001
    name: "必须使用 tid() 辅助函数"
    description: "禁止硬编码 data-testid，必须使用 testHelper.js 提供的 tid() 函数"
    severity: error
    auto_check: true
    check_command: "node scripts/verify-testids.js"
    
  - id: RULE-002
    name: "testid 命名规范"
    description: "必须符合 {scope}-{type}-{identifier} 格式"
    severity: error
    pattern: "^(page|comp|global)-(btn|input|card|list|item|modal|nav|text|slider|selector|icon|image)-[a-z0-9-]+$"
    auto_check: true
    
  - id: RULE-003
    name: "禁止 template 中使用注释条件编译"
    description: "template 中禁止使用 <!-- #ifdef --> 形式的条件编译"
    severity: error
    forbidden_pattern: "<!--\\s*#ifdef"
    auto_check: true
    
  - id: RULE-004
    name: "P0 元素 100% 覆盖"
    description: "主要交互元素必须有 testid"
    severity: warning
    auto_check: false
    manual_check: code_review
    
  - id: RULE-005
    name: "生产环境无 testid"
    description: "生产构建产物中不能包含 data-testid 属性"
    severity: critical
    auto_check: true
    ci_check: true
    check_command: |
      npm run build
      ! grep -r "data-testid" dist/

ci_integration:
  required_checks:
    - name: "testid-naming-check"
      command: "node scripts/verify-testids.js"
      fail_on_error: true
      
    - name: "testid-production-check"
      command: |
        npm run build
        if grep -r "data-testid" dist/; then exit 1; fi
      fail_on_error: true

code_review:
  required_checklist:
    - "所有 P0 元素都有 testid"
    - "testid 命名符合 {scope}-{type}-{identifier} 规范"
    - "使用 tid() 辅助函数，无硬编码"
    - "无 <!-- #ifdef --> 注释形式在 template 中"
    - "列表项 testid 包含索引"

violation_handling:
  critical:
    action: block_merge
    notification: ["tech-lead", "frontend-lead"]
    
  error:
    action: block_merge
    notification: ["pr-author"]
    
  warning:
    action: comment_only
    notification: ["pr-author"]

agents:
  required_acknowledgement:
    - agent: agent.dev.frontend_architect
      responsibility: "确保所有前端架构设计符合本规范"
      
    - agent: agent.dev.uniapp_frontend_engineer
      responsibility: "确保所有实现代码符合本规范"
      
    - agent: agent.dev.code_reviewer
      responsibility: "Code Review 时强制检查本规范"

exemptions:
  process: "需 Tech Architect 书面批准"
  max_duration: "30 days"
  requires_documentation: true
