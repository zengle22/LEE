# Error Codes Specification v1.0
# 错误码规范
#
# 本文件定义统一的错误码枚举，确保：
# 1. error.code 稳定、可枚举
# 2. 可用于 Gate/告警/回归聚类
# 3. 机器可判定

version: "1.0"
owner: dev-governance

# ============================================
# 错误码命名规则
# ============================================
naming_rules:
  format: "[CATEGORY]_[SUBCATEGORY]_[DESCRIPTION]"
  case: UPPER_SNAKE_CASE
  examples:
    - "AUTH_TOKEN_EXPIRED"
    - "VALIDATION_REQUIRED_FIELD_MISSING"
    - "DB_CONNECTION_TIMEOUT"

# ============================================
# 错误类型分类
# ============================================
error_types:
  BusinessError:
    description: "业务逻辑错误"
    http_status: 400-499
    retryable: false

  ValidationError:
    description: "输入验证错误"
    http_status: 400
    retryable: false

  AuthenticationError:
    description: "身份认证错误"
    http_status: 401
    retryable: false

  AuthorizationError:
    description: "权限授权错误"
    http_status: 403
    retryable: false

  NotFoundError:
    description: "资源不存在"
    http_status: 404
    retryable: false

  ConflictError:
    description: "资源冲突"
    http_status: 409
    retryable: false

  RateLimitError:
    description: "限流错误"
    http_status: 429
    retryable: true

  InternalError:
    description: "内部服务错误"
    http_status: 500
    retryable: true

  ExternalServiceError:
    description: "外部服务错误"
    http_status: 502
    retryable: true

  DatabaseError:
    description: "数据库错误"
    http_status: 500
    retryable: varies

  CacheError:
    description: "缓存错误"
    http_status: 500
    retryable: true

  NetworkError:
    description: "网络错误"
    http_status: 502
    retryable: true

# ============================================
# 认证 (AUTH) 错误码
# ============================================
auth:
  AUTH_TOKEN_EXPIRED:
    type: AuthenticationError
    message: "Token has expired"
    retryable: false
    action: "Refresh token or re-login"

  AUTH_TOKEN_INVALID:
    type: AuthenticationError
    message: "Token is invalid"
    retryable: false
    action: "Re-login required"

  AUTH_TOKEN_MISSING:
    type: AuthenticationError
    message: "Token is missing"
    retryable: false
    action: "Provide authentication token"

  AUTH_CREDENTIALS_INVALID:
    type: AuthenticationError
    message: "Invalid credentials"
    retryable: false
    action: "Check username/password"

  AUTH_REFRESH_TOKEN_EXPIRED:
    type: AuthenticationError
    message: "Refresh token has expired"
    retryable: false
    action: "Re-login required"

  AUTH_SESSION_EXPIRED:
    type: AuthenticationError
    message: "Session has expired"
    retryable: false
    action: "Re-login required"

  AUTH_MFA_REQUIRED:
    type: AuthenticationError
    message: "Multi-factor authentication required"
    retryable: false
    action: "Complete MFA verification"

# ============================================
# 授权 (AUTHZ) 错误码
# ============================================
authorization:
  AUTHZ_PERMISSION_DENIED:
    type: AuthorizationError
    message: "Permission denied"
    retryable: false
    action: "Request appropriate permissions"

  AUTHZ_ROLE_INSUFFICIENT:
    type: AuthorizationError
    message: "Insufficient role privileges"
    retryable: false
    action: "Contact administrator for role upgrade"

  AUTHZ_RESOURCE_ACCESS_DENIED:
    type: AuthorizationError
    message: "Access to resource denied"
    retryable: false
    action: "Request resource access"

  AUTHZ_IP_BLOCKED:
    type: AuthorizationError
    message: "IP address is blocked"
    retryable: false
    action: "Contact support"

# ============================================
# 验证 (VALIDATION) 错误码
# ============================================
validation:
  VALIDATION_REQUIRED_FIELD_MISSING:
    type: ValidationError
    message: "Required field is missing"
    retryable: false
    action: "Provide required field"

  VALIDATION_FIELD_FORMAT_INVALID:
    type: ValidationError
    message: "Field format is invalid"
    retryable: false
    action: "Check field format requirements"

  VALIDATION_FIELD_VALUE_OUT_OF_RANGE:
    type: ValidationError
    message: "Field value is out of range"
    retryable: false
    action: "Provide value within valid range"

  VALIDATION_FIELD_LENGTH_EXCEEDED:
    type: ValidationError
    message: "Field length exceeds maximum"
    retryable: false
    action: "Reduce field length"

  VALIDATION_REQUEST_BODY_INVALID:
    type: ValidationError
    message: "Request body is invalid"
    retryable: false
    action: "Check request body format"

  VALIDATION_QUERY_PARAM_INVALID:
    type: ValidationError
    message: "Query parameter is invalid"
    retryable: false
    action: "Check query parameter format"

# ============================================
# 资源 (RESOURCE) 错误码
# ============================================
resource:
  RESOURCE_NOT_FOUND:
    type: NotFoundError
    message: "Resource not found"
    retryable: false
    action: "Check resource ID"

  RESOURCE_ALREADY_EXISTS:
    type: ConflictError
    message: "Resource already exists"
    retryable: false
    action: "Use different identifier"

  RESOURCE_STATE_CONFLICT:
    type: ConflictError
    message: "Resource state conflict"
    retryable: false
    action: "Check resource current state"

  RESOURCE_LOCKED:
    type: ConflictError
    message: "Resource is locked"
    retryable: true
    action: "Wait for lock release"

  RESOURCE_VERSION_CONFLICT:
    type: ConflictError
    message: "Resource version conflict (optimistic lock)"
    retryable: true
    action: "Refresh and retry"

# ============================================
# 业务 (BUSINESS) 错误码
# ============================================
business:
  BUSINESS_INVENTORY_INSUFFICIENT:
    type: BusinessError
    message: "Insufficient inventory"
    retryable: false
    action: "Check available inventory"

  BUSINESS_BALANCE_INSUFFICIENT:
    type: BusinessError
    message: "Insufficient balance"
    retryable: false
    action: "Top up balance"

  BUSINESS_QUOTA_EXCEEDED:
    type: BusinessError
    message: "Quota exceeded"
    retryable: false
    action: "Wait for quota reset or upgrade plan"

  BUSINESS_OPERATION_NOT_ALLOWED:
    type: BusinessError
    message: "Operation not allowed in current state"
    retryable: false
    action: "Check business rules"

  BUSINESS_DEPENDENCY_FAILED:
    type: BusinessError
    message: "Business dependency check failed"
    retryable: false
    action: "Resolve dependency first"

# ============================================
# 数据库 (DB) 错误码
# ============================================
database:
  DB_CONNECTION_FAILED:
    type: DatabaseError
    message: "Database connection failed"
    retryable: true
    action: "Check database availability"

  DB_CONNECTION_TIMEOUT:
    type: DatabaseError
    message: "Database connection timeout"
    retryable: true
    action: "Retry or increase timeout"

  DB_QUERY_TIMEOUT:
    type: DatabaseError
    message: "Database query timeout"
    retryable: true
    action: "Optimize query or increase timeout"

  DB_CONSTRAINT_VIOLATION:
    type: DatabaseError
    message: "Database constraint violation"
    retryable: false
    action: "Check data constraints"

  DB_UNIQUE_VIOLATION:
    type: DatabaseError
    message: "Unique constraint violation"
    retryable: false
    action: "Use different value"

  DB_FOREIGN_KEY_VIOLATION:
    type: DatabaseError
    message: "Foreign key constraint violation"
    retryable: false
    action: "Check referenced record exists"

  DB_DEADLOCK_DETECTED:
    type: DatabaseError
    message: "Database deadlock detected"
    retryable: true
    action: "Retry transaction"

  DB_TRANSACTION_FAILED:
    type: DatabaseError
    message: "Database transaction failed"
    retryable: true
    action: "Retry transaction"

# ============================================
# 缓存 (CACHE) 错误码
# ============================================
cache:
  CACHE_CONNECTION_FAILED:
    type: CacheError
    message: "Cache connection failed"
    retryable: true
    action: "Check cache service"

  CACHE_KEY_NOT_FOUND:
    type: CacheError
    message: "Cache key not found"
    retryable: false
    action: "Key may have expired"

  CACHE_OPERATION_TIMEOUT:
    type: CacheError
    message: "Cache operation timeout"
    retryable: true
    action: "Retry operation"

# ============================================
# 外部服务 (EXTERNAL) 错误码
# ============================================
external:
  EXTERNAL_SERVICE_UNAVAILABLE:
    type: ExternalServiceError
    message: "External service is unavailable"
    retryable: true
    action: "Retry later"

  EXTERNAL_SERVICE_TIMEOUT:
    type: ExternalServiceError
    message: "External service timeout"
    retryable: true
    action: "Retry or increase timeout"

  EXTERNAL_SERVICE_ERROR:
    type: ExternalServiceError
    message: "External service returned error"
    retryable: varies
    action: "Check external service logs"

  EXTERNAL_PAYMENT_FAILED:
    type: ExternalServiceError
    message: "Payment processing failed"
    retryable: varies
    action: "Check payment provider status"

  EXTERNAL_SMS_FAILED:
    type: ExternalServiceError
    message: "SMS sending failed"
    retryable: true
    action: "Retry SMS"

# ============================================
# 限流 (RATE_LIMIT) 错误码
# ============================================
rate_limit:
  RATE_LIMIT_EXCEEDED:
    type: RateLimitError
    message: "Rate limit exceeded"
    retryable: true
    action: "Wait before retrying"

  RATE_LIMIT_USER_EXCEEDED:
    type: RateLimitError
    message: "User rate limit exceeded"
    retryable: true
    action: "Slow down requests"

  RATE_LIMIT_IP_EXCEEDED:
    type: RateLimitError
    message: "IP rate limit exceeded"
    retryable: true
    action: "Wait for rate limit reset"

# ============================================
# 内部 (INTERNAL) 错误码
# ============================================
internal:
  INTERNAL_SERVER_ERROR:
    type: InternalError
    message: "Internal server error"
    retryable: true
    action: "Contact support if persists"

  INTERNAL_SERVICE_UNAVAILABLE:
    type: InternalError
    message: "Internal service unavailable"
    retryable: true
    action: "Retry later"

  INTERNAL_CONFIGURATION_ERROR:
    type: InternalError
    message: "Configuration error"
    retryable: false
    action: "Check service configuration"

  INTERNAL_UNHANDLED_ERROR:
    type: InternalError
    message: "Unhandled error"
    retryable: false
    action: "Report bug"

# ============================================
# 网络 (NETWORK) 错误码
# ============================================
network:
  NETWORK_CONNECTION_FAILED:
    type: NetworkError
    message: "Network connection failed"
    retryable: true
    action: "Check network connectivity"

  NETWORK_DNS_RESOLUTION_FAILED:
    type: NetworkError
    message: "DNS resolution failed"
    retryable: true
    action: "Check DNS configuration"

  NETWORK_TLS_HANDSHAKE_FAILED:
    type: NetworkError
    message: "TLS handshake failed"
    retryable: true
    action: "Check TLS configuration"

# ============================================
# 前端 (FRONTEND) 错误码
# ============================================
frontend:
  FRONTEND_CHUNK_LOAD_FAILED:
    type: NetworkError
    message: "Failed to load JavaScript chunk"
    retryable: true
    action: "Clear cache and refresh"

  FRONTEND_RESOURCE_LOAD_FAILED:
    type: NetworkError
    message: "Failed to load resource"
    retryable: true
    action: "Check network and retry"

  FRONTEND_RENDER_ERROR:
    type: InternalError
    message: "UI render error"
    retryable: false
    action: "Report bug with steps to reproduce"

  FRONTEND_STATE_CORRUPTION:
    type: InternalError
    message: "Application state corrupted"
    retryable: false
    action: "Clear storage and refresh"

# ============================================
# 使用说明
# ============================================
usage:
  in_code:
    go: |
      return NewBusinessError("BUSINESS_INVENTORY_INSUFFICIENT", "Not enough stock for SKU: %s", sku)

    typescript: |
      throw new AppError('VALIDATION_REQUIRED_FIELD_MISSING', { field: 'email' })

    python: |
      raise AppError("DB_CONNECTION_TIMEOUT", message="Database connection timed out")

  in_log:
    example: |
      {
        "error": {
          "code": "AUTH_TOKEN_EXPIRED",
          "type": "AuthenticationError",
          "message": "Token has expired",
          "retryable": false
        }
      }

  mapping_to_http:
    AuthenticationError: 401
    AuthorizationError: 403
    ValidationError: 400
    NotFoundError: 404
    ConflictError: 409
    RateLimitError: 429
    BusinessError: 422
    InternalError: 500
    ExternalServiceError: 502
    DatabaseError: 500
    CacheError: 500
    NetworkError: 502
