# Submodule Committer Skill Specification v1.0
# 子模块提交技能规范

kind: skill
version: 1.0

# ============================================
# 基础标识
# ============================================
id: skill.office.submodule_committer
name: Submodule Committer
name_zh: 子模块提交
description: >
  提交所有 submodule 的更改，然后更新主仓库的 submodule 引用。
  用于 workspace-cleanup 工作流支持多仓库提交。
owner: office-ai
tags: [submodule, git, commit, multi-repo]

# ============================================
# 接口定义
# ============================================
interface:
  inputs:
    type: object
    required: [workspace_path]
    properties:
      workspace_path:
        type: string
        description: 工作区路径（主仓库根目录）
      commit_message:
        type: string
        description: 提交信息（可选）
        default: "chore(submodule): update submodule changes"

  outputs:
    type: object
    required: [success, commits]
    properties:
      success:
        type: boolean
        description: 是否成功
      commits:
        type: array
        description: 提交的哈希值列表
      total:
        type: integer
        description: 总提交数

# ============================================
# 执行逻辑
# ============================================
execution:
  steps:
    - name: "提交所有 submodule 并更新主仓库"
      command: "python E:/ai/LEE/src/lee/orchestrator/scripts/submodule_committer.py"

# ============================================
# 运行时配置
# ============================================
runtime:
  type: script
  timeout_ms: 300000  # 5 minutes

# ============================================
# 约束声明
# ============================================
constraints:
  deterministic: false
  side_effects: creates_git_commits
  requires_confirmation: false
