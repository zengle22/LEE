# Release Gate Check Skill Specification v1.0
# Release Gate 检查技能规范

kind: skill
version: 1.0

# ============================================
# 基础标识
# ============================================
id: skill.gate.release_gate
name: Release Gate Check
description: >
  执行 Release Gate 检查，验证发布到生产环境前的质量标准。
owner: release-ai
tags: [gate, release, check]

# ============================================
# 接口定义
# ============================================
interface:
  inputs:
    type: object
    required: [staging_url]
    properties:
      staging_url:
        type: string
        description: "Staging 环境 URL"
      ui_map_path:
        type: string
        description: "ui.map.yaml 文件路径"
      version:
        type: string
        description: "发布版本号"
      verbose:
        type: boolean
        description: "是否输出详细信息"
        default: false

  outputs:
    type: object
    required: [result, checks, summary, manual_checklist]
    properties:
      result:
        type: string
        description: "自动检查结果"
        enum: [pass, fail]
      checks:
        type: array
        description: "各检查项结果"
        items:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            severity:
              type: string
              enum: [blocker, major, minor]
            status:
              type: string
              enum: [pass, fail, skip]
            message:
              type: string
            duration_ms:
              type: integer
            details:
              type: object
      summary:
        type: object
        description: "统计信息"
        properties:
          blocker:
            type: integer
          major:
            type: integer
          minor:
            type: integer
          total_checks:
            type: integer
          passed_checks:
            type: integer
          total_duration_ms:
            type: integer
      manual_checklist:
        type: array
        description: "人工确认项"
        items:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            assignee:
              type: string
            status:
              type: string
              enum: [pending, confirmed, rejected]
            confirmed_by:
              type: string
            confirmed_at:
              type: string

# ============================================
# 运行时配置
# ============================================
runtime:
  type: shell
  tool: npx release-gate check
  timeout_ms: 600000
  retries: 0

# ============================================
# 约束声明
# ============================================
constraints:
  deterministic: false  # E2E 测试结果可能因环境而异
  side_effects: reads
  pii: forbidden

# ============================================
# 测试钩子
# ============================================
tests:
  smoke:
    - name: release_gate_e2e_check
      input:
        staging_url: "https://staging.example.com"
      assert:
        - path: "$.checks[?(@.id=='e2e_tests')]"
          op: "!="
          value: null
    - name: release_gate_manual_checklist
      input:
        staging_url: "https://staging.example.com"
      assert:
        - path: "$.manual_checklist.length"
          op: ">="
          value: 3
