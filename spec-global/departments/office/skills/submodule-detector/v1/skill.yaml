# Submodule Detector Skill Specification v1.0
# 子模块检测技能规范

kind: skill
version: 1.0

# ============================================
# 基础标识
# ============================================
id: skill.office.submodule_detector
name: Submodule Detector
name_zh: 子模块检测
description: >
  检测当前工作区是主仓库还是 submodule，并返回目标仓库列表。
  用于 workspace-cleanup 工作处理。
owner: office-ai
流支持多仓库tags: [submodule, detection, git, multi-repo]

# ============================================
# 接口定义
# ============================================
interface:
  inputs:
    type: object
    required: [workspace_path]
    properties:
      workspace_path:
        type: string
        description: 工作区路径

  outputs:
    type: object
    required: [execution_mode, target_repos]
    properties:
      execution_mode:
        type: string
        enum: [main, submodule]
        description: 执行模式：main=主仓库，submodule=子模块
      root_path:
        type: string
        description: 主仓库根目录
      current_path:
        type: string
        description: 当前工作目录
      submodules:
        type: array
        description: 所有子模块列表
      target_repos:
        type: array
        description: 目标仓库列表（用于提交和推送）

# ============================================
# 执行逻辑
# ============================================
execution:
  steps:
    - name: "检测执行环境并写入文件"
      command: "python -c \"import sys; sys.path.insert(0, 'E:/ai/LEE/src'); from lee.orchestrator.submodule_manager import SubmoduleManager; import json, os; os.makedirs('.workflow/workspace-cleanup', exist_ok=True); result = SubmoduleManager.detect_execution_mode('.'); json.dump(result, open('.workflow/workspace-cleanup/submodule-detection.yaml', 'w'), indent=2); print(json.dumps(result, indent=2))\""

# ============================================
# 运行时配置
# ============================================
runtime:
  type: script
  timeout_ms: 30000

# ============================================
# 约束声明
# ============================================
constraints:
  deterministic: true
  side_effects: creates_files
