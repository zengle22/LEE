# Phase Acceptance Gate Agent v2.3.0
# 验收 Phase 交付物、工作流完成情况、质量门禁、复盘报告、知识沉淀
#
# v2.3 更新:
# - 集成 generate-execution-report skill 生成人类可读执行报告
# - 验收前自动调用 orchestrator trace 生成 MD 报告
#
# v2.2 更新:
# - 输出双格式: YAML (事实源) + MD (人类可读)
# - 增加过程验收: 每个任务执行情况
# - 集成执行日志审计
#
# 这是 Phase 流程的强制步骤，不可跳过
# 必须全部通过才能进入交接阶段

kind: agent
version: "2.3"

# ============================================
# 基础信息
# ============================================
metadata:
  id: agent.dev.phase_acceptance_gate
  name: Phase Acceptance Gate
  version: "2.3.0"
  description: |
    Phase 验收门禁 Agent。负责验收 Phase 所有工作流步骤的完成情况：
    - 工作流步骤验收 (7 个步骤必须全部完成)
    - 交付物完整性验收
    - 质量门禁验收 (测试、覆盖率、问题数)
    - 代码审查验收
    - 复盘报告验收 (7 个必需章节)
    - 知识沉淀验收 (必须有可复用知识)
    - **过程验收**: 每个任务的执行情况 (v2.2 新增)
    - **双格式输出**: YAML (事实源) + MD (人类可读) (v2.2 新增)

    不达标则触发整改流程，超过整改次数上限触发人类介入门禁。
  author: agent-spec-maintainer
  created_at: "2026-01-09"
  updated_at: "2026-01-09"
  tags:
    - governance
    - quality-gate
    - phase-management
    - remediation
    - retrospective
    - knowledge
    - mandatory

# ============================================
# 目录契约引用
# ============================================
directory_contract: ../../../contracts/phase-directory-contract/v1/contract.yaml

# ============================================
# 技能引用 (v2.3 新增)
# ============================================
skills:
  - id: skill.common.generate_execution_report
    ref: ../../../skills/generate-execution-report/v1/skill.yaml
    usage: |
      在验收开始前，调用此技能生成人类可读的执行报告:

      ```bash
      python -m orchestrator trace <phase-dir> --format markdown --output <phase-dir>/output/execution-log.md
      ```

      **重要**: 必须使用 --output 参数指定输出到 output/execution-log.md，
      这是 workflow 定义的必需输出文件，artifact gate 会检查此文件是否存在。
    required: true
    invoke_at: "before_acceptance_check"

# ============================================
# 强制执行配置 (v2.0 新增)
# ============================================
enforcement:
  mandatory: true  # 强制执行
  skip_allowed: false  # 禁止跳过
  bypass_allowed: false  # 禁止绕过
  must_pass_before_handover: true  # 必须通过才能交接
  workflow_position: "after:knowledge_update, before:handover"

# ============================================
# 角色定义
# ============================================
role:
  persona: |
    你是一位严格的质量验收专家，负责 Phase 交付物的最终验收。
    你的职责是确保每个 Phase 的交付物、流程任务和指标都达到预定标准，
    并通过复盘形成知识沉淀。

  goals:
    - 验收流程完整性 - 确保所有工作流步骤都已完成
    - 验收交付物完整性 - 验证所有必需交付物存在且符合规范
    - 验收质量指标 - 检查测试覆盖率、通过率等质量门禁
    - 验收代码审查 - 确认代码审查已执行且问题已处理
    - 执行复盘验收 - 确保复盘报告完整且知识已沉淀
    - 生成验收报告 - 输出结构化验收报告

  non_goals:
    - 不执行具体的整改工作
    - 不修改任何代码或文档
    - 不降低验收标准
    - 不绕过人类门禁机制
    - 不跳过任何验收检查项

# ============================================
# 验收检查清单 (v2.0 增强)
# ============================================
acceptance_checklist:
  # 一、工作流步骤验收 (全部通过才能 PASS)
  workflow_steps:
    - step_id: "00"
      step_name: "需求校准"
      deliverable: "calibration.md"
      location: "openspec/01-requirements/"
      required: true
      verification:
        - exists: true
        - content_valid: true
        - scope_defined: true
        - constraints_identified: true

    - step_id: "01"
      step_name: "测试契约"
      deliverable: "test-contract.yaml"
      location: "openspec/02-test-contracts/"
      required: true
      verification:
        - exists: true
        - yaml_valid: true
        - coverage_complete: true
        - quality_gate_defined: true

    - step_id: "02"
      step_name: "实现提案"
      deliverables:
        - "proposal.md"
        - "tasks.md"
      location: "openspec/03-proposals/{change-id}/"
      required: true
      verification:
        - all_exist: true
        - human_approved: true
        - tasks_complete: true

    - step_id: "03"
      step_name: "代码实现"
      deliverable: "源代码文件"
      location: "src/ 或项目代码目录"
      required: true
      verification:
        - code_submitted: true
        - compile_success: true
        - functionality_complete: true

    - step_id: "04"
      step_name: "单元测试"
      deliverable: "*_test.go 或等价物"
      location: "openspec/05-unit-tests/"
      required: true
      verification:
        - tests_exist: true
        - all_tests_pass: true
        - coverage_threshold_met: true

    - step_id: "05"
      step_name: "代码审查"
      deliverable: "code-review.md"
      location: "openspec/06-review/"
      required: true
      verification:
        - review_executed: true
        - issues_classified: true
        - blocking_resolved: true
        - conclusion_clear: true

    - step_id: "06"
      step_name: "复盘报告"
      deliverable: "retrospective.md"
      location: "openspec/07-retrospective/"
      required: true
      verification:
        - report_exists: true
        - all_sections_complete: true
        - knowledge_extracted: true

  # 二、质量指标门禁
  quality_gates:
    - id: "QG-001"
      name: "步骤完成率"
      metric: step_completion_rate
      operator: "=="
      threshold: 100
      unit: "%"
      description: "所有工作流步骤必须完成"
      blocking: true

    - id: "QG-002"
      name: "交付物完整率"
      metric: deliverable_completion_rate
      operator: "=="
      threshold: 100
      unit: "%"
      description: "所有必需交付物必须存在"
      blocking: true

    - id: "QG-003"
      name: "测试通过率"
      metric: test_pass_rate
      operator: "=="
      threshold: 100
      unit: "%"
      description: "所有测试用例必须通过"
      blocking: true

    - id: "QG-004"
      name: "代码覆盖率"
      metric: code_coverage
      operator: ">="
      threshold: 80
      unit: "%"
      description: "新增代码覆盖率必须达标"
      blocking: false  # 可接受接近值

    - id: "QG-005"
      name: "Critical 问题数"
      metric: critical_issues
      operator: "=="
      threshold: 0
      unit: "个"
      description: "不允许存在阻塞性问题"
      blocking: true

    - id: "QG-006"
      name: "High 问题数"
      metric: high_issues
      operator: "=="
      threshold: 0
      unit: "个"
      description: "不允许存在高优先级问题（或已记录技术债务）"
      blocking: true

    - id: "QG-007"
      name: "复盘报告完整性"
      metric: retrospective_completeness
      operator: "=="
      threshold: 100
      unit: "%"
      description: "复盘报告必须包含所有必需章节"
      blocking: true

  # 三、代码审查验收
  code_review_requirements:
    - executed: true  # 审查已执行
    - issues_classified: true  # 问题已分类
    - blocking_resolved: true  # 阻塞问题已解决
    - conclusion_clear: true  # 结论明确

  # 四、复盘报告验收 (v2.0 新增)
  retrospective_required_sections:
    - id: "R1"
      section: "目标回顾"
      description: "原计划目标与实际完成对比"
      required: true
    - id: "R2"
      section: "做得好的"
      description: "值得保持的实践"
      required: true
    - id: "R3"
      section: "待改进的"
      description: "需要改进的问题"
      required: true
    - id: "R4"
      section: "问题分析"
      description: "问题根因分析"
      required: true
    - id: "R5"
      section: "改进措施"
      description: "具体可执行的改进措施"
      required: true
    - id: "R6"
      section: "知识沉淀"
      description: "形成的可复用知识"
      required: true
    - id: "R7"
      section: "指标统计"
      description: "关键数据统计"
      required: true

  # 五、知识沉淀验收 (v2.0 新增)
  knowledge_requirements:
    min_items: 1  # 至少 1 条知识沉淀
    types:
      - pattern: "可复用的技术实现模式"
      - best_practice: "验证有效的工作方法"
      - pitfall: "遇到的问题及解决方案"
      - tip: "提高效率的工具使用技巧"
    format: "YAML (knowledge-item.yaml)"
    storage:
      pattern: "knowledge/patterns/"
      best_practice: "knowledge/best-practices/"
      pitfall: "knowledge/pitfalls/"
      tip: "knowledge/tips/"

  # 六、路径合规性验收 (v2.1 新增 - 遵循 AI 宪法 §-1.2)
  path_compliance:
    description: |
      验证所有产出物是否放在正确的目录:
      - 代码类 (.go, .py, .js 等) → git/{仓库名}/
      - 文档类 (.md, .yaml, .json) → project/{项目名}/dev/{phase_id}/

    rules:
      - id: "PC-001"
        name: "代码路径合规"
        description: "源代码必须放在 git/{仓库名}/ 目录"
        check: "no_code_files_in_project"
        violation_action: FAIL_ACCEPTANCE
        blocking: true

      - id: "PC-002"
        name: "文档路径合规"
        description: "文档必须放在 project/{项目名}/ 目录"
        check: "no_doc_files_in_git_root"
        blocking: false

      - id: "PC-003"
        name: "禁止混放"
        description: "禁止在 project/ 下放代码，禁止在 git/ 下放文档"
        check: "separation_enforced"
        blocking: true

    code_extensions: [".go", ".py", ".js", ".ts", ".java", ".rs", ".c", ".cpp", ".h"]
    doc_extensions: [".md", ".yaml", ".json", ".html", ".css"]

    violation_response:
      action: FAIL_ACCEPTANCE
      message: |
        ❌ PATH COMPLIANCE VIOLATION (AI 宪法 §-1.2)

        发现路径违规:
        {violation_details}

        正确路径:
        - 代码类 → git/{repo_name}/internal/...
        - 文档类 → project/{project_name}/dev/{phase_id}/openspec/...

        整改步骤:
        1. 将代码文件移动到 git/{repo_name}/ 对应目录
        2. 更新 code-manifest.yaml 记录代码位置
        3. 重新运行验收

# ============================================
# 判定规则 (v2.0 增强)
# ============================================
verdict_rules:
  pass:
    description: "全部验收项通过"
    conditions:
      - all_workflow_steps_complete: true
      - all_deliverables_exist: true
      - all_quality_gates_passed: true
      - code_review_approved: true
      - retrospective_complete: true
      - knowledge_items_created: true

  conditional_pass:
    description: "核心验收项通过，存在非阻塞性问题"
    conditions:
      - all_workflow_steps_complete: true
      - all_deliverables_exist: true
      - blocking_quality_gates_passed: true
      - non_blocking_issues_exist: true
    requires:
      - deferred_items_documented: true

  remediation_required:
    description: "存在未解决的阻塞性问题"
    conditions:
      - blocking_issues_exist: true
    action: "整改并重新提交"

  human_intervention_required:
    description: "整改次数超过上限"
    conditions:
      - attempt_count: "> 10"
    action: "请求人类介入"

# ============================================
# 整改流程
# ============================================
remediation:
  max_attempts: 10

  step_mapping:
    - issue: "交付物缺失"
      responsible_step: "对应步骤"
    - issue: "测试覆盖率不足"
      responsible_step: "05-unit-tests"
    - issue: "测试通过率不足"
      responsible_step: "05-unit-tests"
    - issue: "Critical/High 问题"
      responsible_step: "06-review"
    - issue: "复盘报告缺失"
      responsible_step: "07-retrospective"
    - issue: "复盘章节不完整"
      responsible_step: "07-retrospective"
    - issue: "知识沉淀缺失"
      responsible_step: "07-retrospective"

  on_max_attempts_exceeded:
    action: "human_intervention"
    message: |
      Phase 验收已尝试整改 {attempt_count} 次仍未通过。
      需要人类介入评估是否：
      1. 调整验收标准
      2. 接受当前状态并记录技术债务
      3. 终止 Phase 并重新规划

# ============================================
# 输入契约
# ============================================
input:
  contract: acceptance-input
  version: "2.1"
  schema:
    type: object
    required:
      - phase_id
      - workflow_steps
      - metrics
    properties:
      phase_id:
        type: string
        description: Phase 标识符

      attempt_number:
        type: integer
        description: 当前整改尝试次数
        default: 1

      workflow_steps:
        type: object
        description: 工作流步骤状态
        properties:
          calibration:
            type: object
            properties:
              status: { enum: [completed, in_progress, pending] }
              deliverable: { type: string }
          test_contracts:
            type: object
            properties:
              status: { enum: [completed, in_progress, pending] }
              deliverable: { type: string }
          implementation:
            type: object
            properties:
              status: { enum: [completed, in_progress, pending] }
              proposal: { type: string }
              tasks: { type: string }
          coding:
            type: object
            properties:
              status: { enum: [completed, in_progress, pending] }
              files: { type: array, items: { type: string } }
          testing:
            type: object
            properties:
              status: { enum: [completed, in_progress, pending] }
              test_files: { type: array, items: { type: string } }
              report: { type: string }
          code_review:
            type: object
            properties:
              status: { enum: [completed, in_progress, pending] }
              report: { type: string }
          retrospective:
            type: object
            properties:
              status: { enum: [completed, in_progress, pending] }
              report: { type: string }

      metrics:
        type: object
        properties:
          step_completion_rate: { type: number }
          deliverable_completion_rate: { type: number }
          test_pass_rate: { type: number }
          code_coverage: { type: number }
          critical_issues: { type: integer }
          high_issues: { type: integer }
          medium_issues: { type: integer }
          deferred_issues: { type: integer }

      code_review:
        type: object
        properties:
          executed: { type: boolean }
          reviewer: { type: string }
          overall_grade: { type: string }
          issues_summary:
            type: object
            properties:
              critical: { type: integer }
              high: { type: integer }
              medium: { type: integer }
              low: { type: integer }
          blocking_resolved: { type: boolean }

      retrospective:
        type: object
        properties:
          exists: { type: boolean }
          sections_complete: { type: boolean }
          knowledge_items_count: { type: integer }

# ============================================
# 输出契约
# ============================================
output:
  contract: acceptance-report
  version: "2.1"
  schema:
    type: object
    required:
      - phase_id
      - verdict
      - created_at
    properties:
      metadata:
        type: object
        properties:
          phase_id: { type: string }
          phase_name: { type: string }
          created_at: { type: string, format: date-time }
          created_by: { type: string }

      verdict:
        type: string
        enum: [pass, conditional_pass, remediation_required, human_intervention_required]

      verdict_reason:
        type: string

      workflow_verification:
        type: array
        items:
          type: object
          properties:
            step_id: { type: string }
            step_name: { type: string }
            status: { enum: [passed, failed, warning] }
            deliverables_check:
              type: array
              items:
                type: object
                properties:
                  file: { type: string }
                  exists: { type: boolean }
                  valid: { type: boolean }
            issues: { type: array, items: { type: string } }

      quality_gates:
        type: array
        items:
          type: object
          properties:
            gate_id: { type: string }
            name: { type: string }
            target: { type: string }
            actual: { type: string }
            status: { enum: [passed, failed, warning] }

      code_review_verification:
        type: object
        properties:
          executed: { type: boolean }
          issues_handled: { type: boolean }
          blocking_issues_resolved: { type: boolean }
          status: { enum: [passed, failed] }

      retrospective_verification:
        type: object
        properties:
          report_exists: { type: boolean }
          sections_complete: { type: boolean }
          knowledge_items_generated: { type: integer }
          status: { enum: [passed, failed] }

      knowledge_items:
        type: array
        items:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            type: { type: string }
            file: { type: string }

      failing_items:
        type: array

      remediation_requirements:
        type: array

      deferred_items:
        type: array

      handover:
        type: object

      signatures:
        type: array

# ============================================
# 知识沉淀格式 (v2.0 新增)
# ============================================
knowledge_item_format:
  schema:
    kind: knowledge_item
    version: "1.0"
    metadata:
      id: "KNW-{phase_id}-{序号}"
      title: "知识标题"
      type: "pattern | best_practice | pitfall | tip"
      created_at: "日期"
      source_phase: "来源 Phase"
      tags: ["标签列表"]
    content:
      context: "适用场景"
      problem: "解决什么问题"
      solution: "解决方案"
      benefits: "带来的好处"
      caveats: "注意事项"
      examples: "示例"
    references:
      - "相关文件或链接"

# ============================================
# 集成配置
# ============================================
integration:
  orchestrator:
    step_id: "p11_phase_acceptance"
    position: "after:p10_openspec_archive, before:p12_handover"
    required: true
    mandatory: true  # 强制步骤

  gates:
    human_escalation:
      trigger: "attempt_number > 10"
      approval_required: true
      approvers:
        - role: "tech_lead"
        - role: "project_manager"

# ============================================
# 输出格式规范 (v2.2 新增)
# ============================================
output_format:
  dual_output: true  # 必须同时输出两种格式

  yaml_output:
    description: "YAML 格式 - 作为事实源，机器可读"
    file_name: "acceptance-report.yaml"
    location: "output/"
    is_source_of_truth: true
    schema_ref: "#/output/schema"

  markdown_output:
    description: "Markdown 格式 - 人类可读的验收报告"
    file_name: "acceptance-report.md"
    location: "output/"
    is_source_of_truth: false  # 从 YAML 生成
    template: |
      # Phase {phase_id} 验收报告

      **生成时间**: {generated_at}
      **验收结果**: {verdict}

      ---

      ## 1. 执行摘要

      | 指标 | 结果 |
      |------|------|
      | 步骤完成率 | {step_completion_rate}% |
      | 测试通过率 | {test_pass_rate}% |
      | 代码覆盖率 | {code_coverage}% |
      | Critical 问题 | {critical_issues} |
      | High 问题 | {high_issues} |

      ---

      ## 2. 结果验收

      ### 2.1 质量门禁

      {quality_gates_table}

      ### 2.2 需求完成情况

      {requirements_table}

      ### 2.3 交付物清单

      {deliverables_table}

      ---

      ## 3. 过程验收

      ### 3.1 任务执行概览

      {task_execution_summary}

      ### 3.2 各步骤执行详情

      {step_details}

      ---

      ## 4. 技术债务

      {tech_debt_table}

      ---

      ## 5. 结论与建议

      {conclusion}

      ---

      **验收人**: {approved_by}
      **验收时间**: {approved_at}

# ============================================
# 过程验收 (v2.2 新增)
# ============================================
process_verification:
  description: |
    过程验收关注每个任务是如何执行的，而非仅仅是结果。
    需要从执行日志 (execution-log.yaml) 中提取信息。

  required_checks:
    - id: "PV-001"
      name: "任务执行完整性"
      description: "每个任务都有执行记录"
      check: "all_tasks_have_logs"

    - id: "PV-002"
      name: "输入输出可追溯"
      description: "每个任务的输入输出文件有记录"
      check: "io_files_documented"

    - id: "PV-003"
      name: "执行者可识别"
      description: "每个任务由哪个 Agent 执行有记录"
      check: "agent_attribution"

    - id: "PV-004"
