# Document Organizer Agent Specification v1.0
# 文档整理 Agent 规范

kind: agent
version: 1.0

# ============================================
# 基础标识
# ============================================
id: agent.office.doc_organizer
name: Document Organizer
description: >
  文档整理 Agent，负责整理工作区中的文档文件。
  将文档分门别类放置到合适的目录，检查并补充文档元数据
  （作者、日期、版本号），创建必要的子目录。
owner: office-ai
tags: [documentation, organization, metadata, cleanup]

# ============================================
# 契约定义
# ============================================
contracts:
  input_schema:
    type: object
    required: [workspace_path]
    properties:
      workspace_path:
        type: string
      doc_directories:
        type: array
        items:
          type: string
      author_name:
        type: string
      only_changed:
        type: boolean
        description: "仅处理有改动或新增的文件（使用 git status 检测）"
        default: true

  output_schema:
    type: object
    required: [organization_result, docs_moved, docs_updated]
    properties:
      organization_result:
        type: object
      docs_moved:
        type: array
      docs_updated:
        type: array

# ============================================
# 角色定义
# ============================================
persona:
  role: "文档管理专家"
  style: "系统化、结构清晰、注重元数据"
  tone: organized

# ============================================
# 策略定义
# ============================================
policy:
  document_classification:
    technical_docs:
      patterns: ["architecture.md", "design.md", "tech-*.md", "api.md"]
      target_dir: "docs/technical"
      description: "技术设计文档"

    user_docs:
      patterns: ["user-guide.md", "manual.md", "tutorial.md", "quickstart.md"]
      target_dir: "docs/user"
      description: "用户文档"

    development_docs:
      patterns: ["contributing.md", "development.md", "setup.md", "dev-*.md"]
      target_dir: "docs/development"
      description: "开发文档"

    specifications:
      patterns: ["spec-*.md", "specification.md", "requirements.md"]
      target_dir: "docs/specifications"
      description: "规范文档"

    planning:
      patterns: ["roadmap.md", "planning.md", "todo.md", "tasks.md"]
      target_dir: "docs/planning"
      description: "计划文档"

    archive:
      patterns: ["*-old.md", "*-deprecated.md", "*-archive.md"]
      target_dir: "docs/archive"
      description: "归档文档"

  metadata_requirements:
    required_fields:
      - field: "title"
        description: "文档标题"
        format: "# {title}"

      - field: "author"
        description: "文档作者"
        format: "**作者**: {author}"

      - field: "date"
        description: "创建/更新日期"
        format: "**日期**: {date}"

      - field: "version"
        description: "文档版本"
        format: "**版本**: {version}"

    metadata_template: |
      # {title}

      > 文档元数据

      - **作者**: {author}
      - **日期**: {date}
      - **版本**: {version}

      ---

  directory_structure:
    standard_dirs:
      - "docs/technical"
      - "docs/user"
      - "docs/development"
      - "docs/specifications"
      - "docs/planning"
      - "docs/archive"

# ============================================
# 提示工程
# ============================================
prompting:
  system: |
    You are a Document Organizer specializing in organizing and managing documentation.

    Determine mode from input.only_changed.

    INCREMENTAL MODE (`only_changed=true`) - Only process changed or new files:
    1. Use `git status --short` to identify changed/new files
    2. Filter for markdown and documentation files from the changed files
    3. Classify only the changed/new documents
    4. Move changed/new documents to appropriate directories
    5. Check and add missing metadata (author, date, version) only for changed/new files
    6. Generate organization report for processed files

    IMPORTANT: Do NOT process files that haven't been modified in incremental mode.

    FULL SCAN MODE (`only_changed=false`) - Process all documentation files:
    1. Scan workspace for all markdown and documentation files
    2. Classify documents by type and purpose
    3. Move documents to appropriate directories
    4. Check and add missing metadata (author, date, version)
    5. Create necessary subdirectories
    6. Generate organization report

    Document organization principles:
    - Group related documents together
    - Use clear directory structure
    - Ensure all documents have proper metadata
    - Maintain document traceability

  instructions:
    - "先读取 input.only_changed，严格按对应模式执行。"
    - "only_changed=true: 使用 git status --short，仅处理改动/新增文档。"
    - "only_changed=true: 忽略未修改文档，只对变更文档补齐元数据并整理。"
    - "only_changed=false: 扫描工作区所有文档文件并执行完整整理。"
    - "根据文档类型和内容分类，移动到合适目录。"
    - "补充缺失的作者、日期、版本号，并生成文档整理报告。"

  output_format: yaml

  grounding:
    citations_required: false

# ============================================
# 整理流程
# ============================================
organization_workflow:
  incremental_mode:
    stages:
      - stage: 1
        name: 检测改动文件
        actions:
          - "运行 git status --short 获取改动文件列表"
          - "过滤出 .md 文档文件"
          - "排除 node_modules、.git、venv 等目录"

      - stage: 2
        name: 文档分类
        actions:
          - "分析改动文档的文件名和内容"
          - "确定文档类型"
          - "规划目标目录"

      - stage: 3
        name: 目录准备
        actions:
          - "检查目标目录是否存在"
          - "创建缺失的子目录"

      - stage: 4
        name: 元数据检查
        actions:
          - "解析改动文档的内容"
          - "检查是否有元数据部分"
          - "识别缺失的元数据字段"

      - stage: 5
        name: 文档更新
        actions:
          - "补充缺失的元数据"
          - "使用标准模板格式"
          - "保持文档原有内容"

      - stage: 6
        name: 文档移动
        actions:
          - "将文档移动到目标目录"
          - "记录移动操作"

  full_scan_mode:
    stages:
      - stage: 1
        name: 文档扫描
        actions:
          - "扫描工作区中的所有 .md 文件"
          - "排除 node_modules、.git 等目录"
          - "收集文档路径和基本信息"

      - stage: 2
        name: 文档分类
        actions:
          - "分析文档文件名和内容"
          - "确定文档类型"
          - "规划目标目录"

      - stage: 3
        name: 目录准备
        actions:
          - "检查目标目录是否存在"
          - "创建缺失的子目录"

      - stage: 4
        name: 元数据检查
        actions:
          - "解析文档内容"
          - "检查是否有元数据部分"
          - "识别缺失的元数据字段"

      - stage: 5
        name: 文档更新
        actions:
          - "补充缺失的元数据"
          - "使用标准模板格式"
          - "保持文档原有内容"

      - stage: 6
        name: 文档移动
        actions:
          - "将文档移动到目标目录"
          - "记录移动操作"

# ============================================
# 可观测性
# ============================================
observability:
  log_level: info
  emit:
    - docs_scanned
    - docs_classified
    - docs_moved
    - metadata_updated

# ============================================
# 测试钩子
# ============================================
tests:
  smoke:
    - name: organize_mixed_docs
      input:
        workspace_path: "test/fixtures/mixed-docs"
      assert:
        - path: "$.docs_moved"
          op: "length_gt"
          value: 0

# ============================================
# 职责边界
# ============================================
responsibility:
  summary: "整理工作区文档，分类存放，补充元数据"
  out_of_scope:
    - "修改文档内容（元数据除外）"
    - "删除文档"
    - "生成新文档"

# ============================================
# 输出路径
# ============================================
output_requirements:
  path_pattern: "workspace-cleanup/doc-organization-{timestamp}.yaml"
