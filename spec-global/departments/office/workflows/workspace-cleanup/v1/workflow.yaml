# Workspace Cleanup Workflow v1.0
# 工作区整理工作流

kind: workflow
version: 1.0

# ============================================
# 基础标识
# ============================================
id: workflow.office.workspace_cleanup
name: Workspace Cleanup
description: >
  工作区整理工作流，全面整理和清理工作区：
  - 文件价值判断，更新 .gitignore
  - 文档整理，分门别类存放，补充元数据
  - 代码和文档审查，生成技术债文档
  - 分批原子化提交
  - 推送到远程仓库

owner: office-ai
tags: [workflow, cleanup, organization, workspace, office]

# ============================================
# 角色地图（Role Map）
# ============================================
roles:
  agents:
    - agent.office.file_value_analyzer      # LLM：文件价值分析
    - agent.office.doc_organizer            # LLM：文档整理
    - agent.office.code_doc_reviewer        # LLM：代码文档审查
    - agent.office.git_atomic_committer     # LLM：原子化提交
  skills:
    - skill.office.gitignore_updater        # 程序：更新 .gitignore
    - skill.office.git_push                 # 程序：推送到远程
  gates:
    - gate.office.commit_approval           # 人类：批准提交

# ============================================
# 参数定义
# ============================================
params:
  workspace_path:
    type: string
    required: false
    description: "工作区路径（默认为当前目录）"
    default: "."

  author_name:
    type: string
    required: false
    description: "文档作者名称（用于补充元数据）"
    default: "LEE Team"

  exclude_patterns:
    type: array
    required: false
    description: "排除的文件模式"
    default: ["node_modules", ".git", "venv", "__pycache__", "dist", "build"]

  remote:
    type: string
    required: false
    description: "远程仓库名称"
    default: "origin"

  branch:
    type: string
    required: false
    description: "分支名称（默认为当前分支）"

  skip_push:
    type: boolean
    required: false
    description: "是否跳过推送到远程"
    default: false

# ============================================
# 契约定义
# ============================================
contracts:
  inputs:
    - workspace_path:
        path: "{{ params.workspace_path }}"
        description: "要整理的工作区路径"

  outputs:
    - cleanup_summary:
        path: "workspace-cleanup/cleanup-summary-{{ timestamp }}.yaml"
        schema: ../../contracts/workspace-cleanup-contract/v1/schema.yaml
        description: "整理汇总报告"

    - tech_debt_report:
        path: "tech-debt/tech-debt-{{ date }}.yaml"
        schema: ../../contracts/tech-debt-contract/v1/schema.yaml
        description: "技术债文档"

    - tech_debt_markdown:
        path: "tech-debt/tech-debt-{{ date }}.md"
        description: "技术债 Markdown 报告"

# ============================================
# 状态机定义
# ============================================
state_machine:
  states:
    - INIT: "初始化"
    - FILE_ANALYSIS: "文件价值分析"
    - GITIGNORE_UPDATE: "更新 .gitignore"
    - DOC_ORGANIZATION: "文档整理"
    - CODE_REVIEW: "代码文档审查"
    - ATOMIC_COMMIT: "原子化提交"
    - PUSH_REMOTE: "推送远程"
    - COMPLETED: "完成"
    - FAILED: "失败"

  transitions:
    INIT:
      - to: FILE_ANALYSIS
        trigger: "workflow_started"

    FILE_ANALYSIS:
      - to: GITIGNORE_UPDATE
        trigger: "analysis_completed"
      - to: FAILED
        trigger: "analysis_failed"

    GITIGNORE_UPDATE:
      - to: DOC_ORGANIZATION
        trigger: "gitignore_updated"
      - to: DOC_ORGANIZATION
        trigger: "no_updates_needed"

    DOC_ORGANIZATION:
      - to: CODE_REVIEW
        trigger: "docs_organized"
      - to: FAILED
        trigger: "organization_failed"

    CODE_REVIEW:
      - to: ATOMIC_COMMIT
        trigger: "review_completed"
      - to: FAILED
        trigger: "review_failed"

    ATOMIC_COMMIT:
      - to: PUSH_REMOTE
        trigger: "commits_approved"
        condition: "params.skip_push == false"
      - to: COMPLETED
        trigger: "commits_approved"
        condition: "params.skip_push == true"
      - to: ATOMIC_COMMIT
        trigger: "commits_rejected"

    PUSH_REMOTE:
      - to: COMPLETED
        trigger: "push_completed"
      - to: FAILED
        trigger: "push_failed"

# ============================================
# 阶段定义
# ============================================
stages:
  # ========== Stage 1: 文件价值分析 ==========
  - id: s1_file_analysis
    name: "文件价值分析"
    description: "分析工作区文件，识别应该 gitignore 的文件"
    state: FILE_ANALYSIS

    steps:
      - id: s1_1_analyze_files
        name: "分析文件价值"
        run: agent.office.file_value_analyzer
        inputs:
          - workspace_path: "{{ params.workspace_path }}"
          - exclude_patterns: "{{ params.exclude_patterns }}"
        outputs:
          - path: "workspace-cleanup/file-analysis.yaml"
            description: "文件价值分析结果"

  # ========== Stage 2: 更新 .gitignore ==========
  - id: s2_gitignore_update
    name: "更新 .gitignore"
    description: "根据分析结果更新 .gitignore 文件"
    state: GITIGNORE_UPDATE

    steps:
      - id: s2_1_update_gitignore
        name: "更新 .gitignore"
        run: skill.office.gitignore_updater
        inputs:
          - workspace_path: "{{ params.workspace_path }}"
          - patterns_to_add: "$outputs.s1_1_analyze_files.gitignore_recommendations"
        outputs:
          - path: ".gitignore"
            description: "更新后的 .gitignore"
          - path: "workspace-cleanup/gitignore-update.yaml"
            description: "更新记录"

  # ========== Stage 3: 文档整理 ==========
  - id: s3_doc_organization
    name: "文档整理"
    description: "整理工作区文档，分门别类，补充元数据"
    state: DOC_ORGANIZATION

    steps:
      - id: s3_1_organize_docs
        name: "整理文档"
        run: agent.office.doc_organizer
        inputs:
          - workspace_path: "{{ params.workspace_path }}"
          - author_name: "{{ params.author_name }}"
          - only_changed: true
        outputs:
          - path: "workspace-cleanup/doc-organization.yaml"
            description: "文档整理结果"

  # ========== Stage 4: 代码文档审查 ==========
  - id: s4_code_review
    name: "代码文档审查"
    description: "审查代码和文档，生成技术债文档"
    state: CODE_REVIEW

    steps:
      - id: s4_1_review_code_docs
        name: "审查代码和文档"
        run: agent.office.code_doc_reviewer
        inputs:
          - workspace_path: "{{ params.workspace_path }}"
          - exclude_patterns: "{{ params.exclude_patterns }}"
        outputs:
          - path: "tech-debt/tech-debt-{{ date }}.yaml"
            schema: ../../contracts/tech-debt-contract/v1/schema.yaml
            description: "技术债 YAML 文档"
          - path: "tech-debt/tech-debt-{{ date }}.md"
            description: "技术债 Markdown 报告"

  # ========== Stage 5: 原子化提交 ==========
  - id: s5_atomic_commit
    name: "原子化提交"
    description: "将所有更改分批进行原子化提交"
    state: ATOMIC_COMMIT

    steps:
      - id: s5_1_plan_commits
        name: "规划提交"
        run: agent.office.git_atomic_committer
        inputs:
          - workspace_path: "{{ params.workspace_path }}"
          - mode: "plan"
        outputs:
          - path: "workspace-cleanup/commit-plan.yaml"
            description: "提交规划"

      - id: s5_2_review_commits
        name: "人工审核提交规划"
        gate:
          type: human_review
          prompt: "请审核提交规划，确认提交分组和提交信息"
          artifacts:
            - "workspace-cleanup/commit-plan.yaml"
          on_approve:
            trigger: commits_approved
          on_reject:
            trigger: commits_rejected
            action: retry_step
            retry_step: s5_1_plan_commits

      - id: s5_3_execute_commits
        name: "执行提交"
        run: agent.office.git_atomic_committer
        condition: "gate.s5_2_review_commits.approved"
        on_failure:
          retry: 2
          retry_delay_seconds: 2
          fallback: human_review
        success_criteria:
          require_commands:
            - "git commit"
          require_new_commit: true
        inputs:
          - workspace_path: "{{ params.workspace_path }}"
          - mode: "execute"
          - commit_plan: "workspace-cleanup/commit-plan.yaml"
        outputs:
          - path: "workspace-cleanup/commit-history.yaml"
            description: "提交历史记录"

  # ========== Stage 6: 推送远程 ==========
  - id: s6_push_remote
    name: "推送远程"
    description: "将提交推送到远程仓库"
    state: PUSH_REMOTE
    condition: "params.skip_push == false"

    steps:
      - id: s6_1_push_commits
        name: "推送提交"
        run: skill.office.git_push
        inputs:
          - workspace_path: "{{ params.workspace_path }}"
          - remote: "{{ params.remote }}"
          - branch: "{{ params.branch }}"
        outputs:
          - path: "workspace-cleanup/push-result.yaml"
            description: "推送结果"

# ============================================
# 门禁配置
# ============================================
gates:
  commit_review:
    type: human
    timeout: 24h
    required_approvers:
      - role: developer

# ============================================
# 产出目录结构
# ============================================
output_structure: |
  workspace-cleanup/
  ├── cleanup-summary-{timestamp}.yaml      # 整理汇总报告
  ├── file-analysis.yaml                    # 文件价值分析
  ├── gitignore-update.yaml                 # gitignore 更新记录
  ├── doc-organization.yaml                 # 文档整理结果
  ├── commit-plan.yaml                      # 提交规划
  ├── commit-history.yaml                   # 提交历史
  └── push-result.yaml                      # 推送结果

  tech-debt/
  ├── tech-debt-{date}.yaml                 # 技术债 YAML
  └── tech-debt-{date}.md                   # 技术债 Markdown 报告

# ============================================
# 使用示例
# ============================================
examples:
  - name: basic_cleanup
    description: "基本工作区整理"
    params:
      workspace_path: "/Users/zengle/git/ai/lee"
      author_name: "LEE Team"

  - name: cleanup_without_push
    description: "整理但不推送"
    params:
      workspace_path: "/Users/zengle/git/ai/lee"
      skip_push: true

# ============================================
# 注意事项
# ============================================
notes: |
  1. 运行前请确保工作区没有未保存的重要更改
  2. 建议先在测试分支上运行
  3. 技术债文档仅记录问题，不会修复代码
  4. 所有更改都会通过 Git 提交，可以随时回滚
  5. 推送前会要求人工确认
