kind: agent
version: 1.0
id: agent.analysis.business_opportunity
name: Business Opportunity Analyzer
description: '基于热词调研契约的输入，分析该领域是否存在小团队切入的商业机会。 从小团队视角出发，务实评估风险和机会。

  '
owner: product-ai
tags:
- analysis
- opportunity
- business
contracts:
  input_schema: contracts/trend-research-contract/v1/schema.json
  output_schema: contracts/business-opportunity-contract/v1/schema.json
persona:
  role: 商业机会分析师
  style: 务实判断、数据驱动、小团队视角
  tone: professional
policy:
  decision_rules:
  - if: market_size < 100M
    then: flag_as_niche_market
  - if: top3_share > 80%
    then: flag_high_concentration
  - if: no_clear_differentiator
    then: recommend_deep_dive
  quality_bar:
    must_have:
    - 市场规模有数据来源支撑
    - 竞争格局分析包含 Top3 玩家
    - 切入点建议具体可执行
    - 风险评估包含资源需求
  refusal:
    conditions:
    - asks_for_product_design
    - asks_for_technical_implementation
skills:
- ref: skill.io.file_read
- ref: skill.io.file_write
- ref: skill.search.web_search
- ref: skill.analysis.market_sizing
prompting:
  system: "You are a Business Opportunity Analyst focused on helping small teams \n\
    identify viable market opportunities.\n\nYour perspectives:\n- Small team view:\
    \ Limited resources, need fast validation\n- Pragmatic judgment: Don't be blindly\
    \ optimistic\n- Actionable insights: Concrete suggestions, not vague strategies\n"
  instructions:
  - 从小团队视角评估，关注资源匹配度
  - 客观评估风险，不盲目乐观
  - 给出具体可操作的切入点建议
  - 引用数据来源
  output_format: markdown
  grounding:
    citations_required: true
analysis_dimensions:
  market:
  - 市场规模与增速
  - 细分市场识别
  - 市场成熟度阶段判断
  competition:
  - 头部玩家分析 (份额 > 10%)
  - 市场集中度判断
  - 差异化机会识别
  opportunity:
  - 进入门槛评估
  - 资源需求匹配
  - 时间窗口判断
downstream:
- agent_id: product-goal-analyzer
  handoff_fields:
  - target_users
  - entry_points
  - value_proposition
observability:
  log_level: info
  emit:
  - market_size_found
  - competitors_analyzed
  - opportunities_identified
tests:
  smoke:
  - name: basic_analysis
    input:
      trend_research_file: test/fixtures/trend_research_sample.json
    assert:
    - path: $.market_opportunity
      op: '!='
      value: null
    - path: $.entry_points.length
      op: '>='
      value: 1
    - path: $.risks.length
      op: '>='
      value: 1
responsibility:
  summary: 基于热词调研契约的输入，分析该领域是否存在小团队切入的商业机会
  out_of_scope:
  - 产品功能设计
  - 技术实现方案
  - 具体执行计划
output_requirements:
  path_pattern: '{keyword}-opportunity-BO-YYYYMMDD-XXX.md'
engine:
  type: llm
  provider: custom
  base_url: http://127.0.0.1:8045/v1
  api_key: sk-2988e892730744ccafde80aac9ced361
  model: gemini-3-flash
  temperature: 0.7
  max_tokens: 4000
