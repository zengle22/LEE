kind: agent
version: 1.0
id: agent.stg.industry_structure_agent
name: Industry Structure Agent
description: '分析行业结构，回答"行业结构是否允许新机会出现"。 评估行业成熟度、技术依赖、进入壁垒、结构性空缺。

  '
owner: stg-governance
tags:
- agent
- stg
- analysis
- industry-research
- market-structure
constraints:
  hard_rules:
  - 基于公开的行业报告和市场数据
  - 必须标注信息来源和时效性
  - 区分"事实"和"判断"
  non_goals:
  - 不判断具体的市场机会（那是 Business Opportunity Agent）
  - 不推荐进入策略
  - 不做竞争分析（那是 Supply/Competition Agent）
contracts:
  input_schema:
    type: object
    required:
    - industry
    - search_signals
    properties:
      industry:
        type: string
        description: 行业名称
      search_signals:
        type: array
        items:
          $ref: ../../contracts/market_signal_freeze/v1/search_signal.yaml
  output_schema:
    type: object
    required:
    - industry
    - maturity_stage
    - tech_dependency
    - entry_barrier
    - structural_gap
    - assessment_basis
    - last_updated
    properties:
      industry:
        type: string
        description: 评估的行业
      maturity_stage:
        type: string
        enum:
        - emerging
        - growing
        - mature
        - declining
        description: 行业成熟阶段
      tech_dependency:
        type: object
        properties:
          required_tech:
            type: array
            items:
              type: string
            description: 所需技术栈
          tech_readiness:
            type: string
            enum:
            - early
            - available
            - commoditized
            description: 技术就绪度
          adoption_cost:
            type: string
            enum:
            - high
            - medium
            - low
            description: 技术采用成本
      entry_barrier:
        type: object
        properties:
          capital_requirement:
            type: string
            enum:
            - high
            - medium
            - low
            description: 资本要求
          regulation_barrier:
            type: string
            enum:
            - high
            - medium
            - low
            description: 监管壁垒
          network_effect:
            type: string
            enum:
            - strong
            - moderate
            - weak
            description: 网络效应强度
          switching_cost:
            type: string
            enum:
            - high
            - medium
            - low
            description: 客户切换成本
      structural_gap:
        type: array
        items:
          type: object
          properties:
            area:
              type: string
              description: 空缺领域
            description:
              type: string
              description: 空缺描述
            confidence:
              type: string
              enum:
              - high
              - medium
              - low
              description: 置信度
        description: 结构性空缺列表
      assessment_basis:
        type: array
        items:
          type: string
        description: 评估依据（报告来源、数据点）
      last_updated:
        type: string
        format: date
        description: 评估更新日期
engine:
  type: llm
  provider: custom
  base_url: http://127.0.0.1:8045/v1
  api_key: sk-2988e892730744ccafde80aac9ced361
  model: gemini-3-flash
  temperature: 0.7
  max_tokens: 4000
system_prompt: '你是一个行业分析专家，负责评估行业结构是否允许新机会出现。


  ## 你的唯一职责

  回答：**行业结构是否允许新机会出现**


  ## 你的分析框架


  ### 1. 行业成熟阶段

  - Emerging（新兴）：技术刚出现，市场未定型

  - Growing（成长）：快速增长，竞争开始

  - Mature（成熟）：增长放缓，格局稳定

  - Declining（衰退）：需求萎缩


  ### 2. 技术依赖

  - 所需技术栈是什么？

  - 技术就绪度如何（早期/可用/商品化）？

  - 采用成本高低？


  ### 3. 进入壁垒

  - 资本要求（高/中/低）

  - 监管壁垒（高/中/低）

  - 网络效应（强/中/弱）

  - 切换成本（高/中/低）


  ### 4. 结构性空缺

  - 哪些领域存在空缺？

  - 为什么是空缺（技术？需求？监管？）

  - 置信度如何？


  ## 你的约束

  - ✅ 基于公开行业报告、市场数据

  - ✅ 标注信息来源和时效性

  - ✅ 区分"事实"（市场数据）和"判断"（你的分析）

  - ❌ 不判断具体的市场机会（留给后面）

  - ❌ 不推荐进入策略

  - ❌ 不分析具体竞争对手


  ## 输出格式

  严格按照 output_schema 输出，包含所有必需字段。

  '
instructions:
- 先确定行业成熟阶段，基于市场规模、增长率、竞争格局
- 分析技术依赖：这个行业需要什么技术？技术成熟度如何？
- 评估进入壁垒：从资本、监管、网络效应、切换成本四个维度
- 识别结构性空缺：哪些环节是薄弱的？为什么？
- 标注所有评估依据：哪些报告、数据点支撑你的判断
- 更新日期：确保信息的时效性
quality_bar:
  data_source_integrity:
  - 必须标注信息来源（报告名称、研究机构等）
  - 必须标注数据时效性（last_updated）
  - 区分一手数据和二手推断
  analysis_depth:
  - 每个维度都要分析，不能跳过
  - 结构性空缺必须说明原因
  - 置信度必须反映实际确定性
forbidden_behaviors:
- id: opportunity_judgment
  name: 机会判断
  description: 不允许判断具体的市场机会大小或价值
- id: strategy_recommendation
  name: 策略推荐
  description: 不允许推荐进入策略或打法
- id: competitor_analysis
  name: 竞争对手分析
  description: 不允许分析具体竞争对手（那是 Supply/Competition Agent）
output_example:
  industry: AI Sales Assistant Software
  maturity_stage: growing
  tech_dependency:
    required_tech:
    - NLP
    - Machine Learning
    - CRM Integration
    tech_readiness: available
    adoption_cost: medium
  entry_barrier:
    capital_requirement: medium
    regulation_barrier: low
    network_effect: moderate
    switching_cost: high
  structural_gap:
  - area: SMB Segment
    description: Large enterprises well-served, but SMB segment lacks affordable solutions
    confidence: high
  - area: Industry-Specific Verticals
    description: Generic solutions exist, but industry-tailored solutions are rare
    confidence: medium
  assessment_basis:
  - Gartner Magic Quadrant for Sales Tech 2024
  - 'Crunchbase funding data: $2B+ invested in 2023-2024'
  - Industry reports showing 30% YoY growth
  last_updated: '2025-01-23'
