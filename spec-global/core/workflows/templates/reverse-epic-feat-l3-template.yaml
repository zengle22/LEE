kind: l3_workflow_template
version: "1.0"
id: template.core.reverse_epic_feat
name: Reverse Epic Feat L3 Template
description: |
  L3 template for reverse-engineering an existing repository into SSOT-aligned
  SRC, EPIC, FEAT, and downstream seed/view artifacts.

  Boundary:
  - This file defines a workflow template, not a runtime workflow instance.
  - Runtime workflow instances must be dynamically generated by the orchestrator or CLI.
  - This workflow materializes only SRC, EPIC, and FEAT as formal SSOT outputs.
  - UI, TECH, TASK, TESTSET, TC, BUG, REPORT, EVI, and trace outputs must stay as seeds, views, or handoff artifacts.
  - Evidence output must include evidence_layers and primary_refs.
  - primary_refs must preserve ranked implementation/API-first evidence order.
  - When onboarding-style page clusters are ambiguous, page-content matching and local rerank may be used.

owner: governance-ai
tags:
  - template
  - reverse-ssot
  - epic
  - feat
  - product
  - l3

input_contract:
  description: Reverse SSOT chain generation request
  required_fields:
    - name: request_id
      type: string
      description: Unique request identifier
    - name: repo_root
      type: string
      description: Repository root to analyze
    - name: objective
      type: enum
      values: [reverse_epic_feat]
      description: Fixed objective for this workflow
  optional_fields:
    - name: include_paths
      type: array
      description: Optional include path filters
    - name: exclude_paths
      type: array
      description: Optional exclude path filters
    - name: existing_prd_paths
      type: array
      description: Existing PRD or spec fragments to use as weak evidence
    - name: runtime_evidence_paths
      type: array
      description: Logs, traces, screenshots, or test evidence
    - name: strict_evidence
      type: boolean
      default: true
      description: Require code refs for every FEAT
    - name: max_capabilities
      type: integer
      default: 12
      description: Upper bound for capability extraction
    - name: max_features_per_capability
      type: integer
      default: 8
      description: Upper bound for features per capability
    - name: publish_mode
      type: enum
      values: [draft, publish, freeze]
      default: draft
      description: Publication mode for generated SRC, EPIC, and FEAT outputs
    - name: human_gate_required
      type: boolean
      default: true
      description: Whether review failure should pause for human approval
    - name: reverse_scope
      type: enum
      values: [legacy_epic_feat, src_epic_feat, full_ssot_docs]
      default: full_ssot_docs
      description: Reverse scope mode for compatibility or full-chain output
    - name: materialize_formal_objects
      type: array
      description: Formal SSOT object types this workflow may materialize
    - name: emit_delivery_prep_seeds
      type: boolean
      default: true
      description: Emit reverse delivery prep seeds for UI/TECH/TASK downstream workflows
    - name: emit_qa_handoff_seeds
      type: boolean
      default: true
      description: Emit reverse QA handoff seeds for TESTSET-oriented downstream workflows
    - name: emit_evidence_views
      type: boolean
      default: true
      description: Emit evidence and trace views for QA and audit use
    - name: framework_root
      type: string
      default: .
      description: Relative path from project root to the LEE framework checkout

output_contract:
  description: Final workflow outputs
  artifacts:
    - name: reverse_source_pack
      path: "{{ artifacts_dir }}/active/reverse-source-pack.json"
      description: Reverse-generated source pack and chain entry analysis
    - name: system_map
      path: "{{ docs_dir }}/guides/system-map.md"
      description: Reverse-generated system map
    - name: capability_map
      path: "{{ docs_dir }}/guides/capability-map.md"
      description: Reverse-generated capability map
    - name: feature_registry
      path: "{{ specs_dir }}/requirements/feature-registry.md"
      description: Reverse-generated feature registry
    - name: reverse_ssot_bundle
      path: "{{ artifacts_dir }}/active/reverse-epic-feat-ssot-output.json"
      description: SSOT agent output bundle containing formal SRC/EPIC/FEAT plus downstream seed/view artifacts
    - name: reverse_delivery_prep_seed
      path: "{{ artifacts_dir }}/active/reverse-delivery-prep-seed.json"
      description: Reverse-generated delivery prep seed bundle for UI/TECH/TASK workflows
    - name: reverse_qa_handoff_seed
      path: "{{ artifacts_dir }}/active/reverse-qa-handoff-seed.json"
      description: Reverse-generated QA handoff seed bundle for TESTSET workflows
    - name: reverse_evidence_view
      path: "{{ artifacts_dir }}/active/reverse-evidence-view.json"
      description: Reverse-generated evidence and trace view bundle
    - name: reverse_chain_manifest
      path: "{{ artifacts_dir }}/active/reverse-ssot-chain-manifest.json"
      description: Reverse-generated manifest that labels formal outputs vs seed/view outputs
    - name: review_report
      path: "{{ artifacts_dir }}/active/reverse-ssot-chain-review.json"
      description: Full reverse-chain review report
    - name: completion_summary
      path: "{{ docs_dir }}/reports/reverse-ssot-chain-completion.md"
      description: Final completion summary
  status_field:
    name: reverse_ssot_status
    type: enum
    values: [draft_generated, review_warning, blocked, published, frozen]
    description: Final workflow result

stages:
  - id: evidence_scan
    name: "Repo Evidence Scan"
    kind: stage
    description: "Collect structured evidence from repository and runtime artifacts"
    depends_on: []
    steps:
      - id: repo_evidence_scan
        name: "Repo Evidence Scan"
        kind: skill
        mandatory: true
        depends_on: []
        config:
          execution:
            command: >-
              python {{ params.framework_root | default('.') }}/scripts/reverse_epic_feat.py scan
              --repo-root "{{ params.repo_root }}"
              --specs-dir "{{ specs_dir }}"
              --docs-dir "{{ docs_dir }}"
              --artifacts-dir "{{ artifacts_dir }}"
              --include-paths "{{ params.include_paths | default([]) }}"
              --exclude-paths "{{ params.exclude_paths | default([]) }}"
        outputs:
          - path: "{{ docs_dir }}/reports/repo-summary.json"
            type: file
            format: json
            description: "Structured repository summary"
            required: true
          - path: "{{ docs_dir }}/reports/evidence-index.json"
            type: file
            format: json
            description: "Structured evidence index"
            required: true
    step_order:
      - repo_evidence_scan

  - id: system_understanding
    name: "System Understanding"
    kind: stage
    description: "Build system map and capability map from evidence"
    depends_on: [repo_evidence_scan]
    steps:
      - id: system_map_build
        name: "System Map Build"
        kind: skill
        mandatory: true
        depends_on: []
        config:
          execution:
            command: >-
              python {{ params.framework_root | default('.') }}/scripts/reverse_epic_feat.py system-map
              --repo-root "{{ params.repo_root }}"
              --specs-dir "{{ specs_dir }}"
              --docs-dir "{{ docs_dir }}"
              --artifacts-dir "{{ artifacts_dir }}"
        outputs:
          - path: "{{ docs_dir }}/guides/system-map.md"
            type: file
            format: markdown
            description: "System map document"
            required: true
          - path: "{{ docs_dir }}/reports/system-map.json"
            type: file
            format: json
            description: "Machine-readable system map"
            required: true
      - id: capability_extract
        name: "Capability Extract"
        kind: skill
        mandatory: true
        depends_on: [system_map_build]
        config:
          execution:
            command: >-
              python {{ params.framework_root | default('.') }}/scripts/reverse_epic_feat.py capability-map
              --repo-root "{{ params.repo_root }}"
              --specs-dir "{{ specs_dir }}"
              --docs-dir "{{ docs_dir }}"
              --artifacts-dir "{{ artifacts_dir }}"
              --max-capabilities "{{ params.max_capabilities | default(12) }}"
              --max-features-per-capability "{{ params.max_features_per_capability | default(8) }}"
        outputs:
          - path: "{{ docs_dir }}/guides/capability-map.md"
            type: file
            format: markdown
            description: "Capability map document"
            required: true
          - path: "{{ docs_dir }}/reports/capability-map.json"
            type: file
            format: json
            description: "Machine-readable capability map"
            required: true
    step_order:
      - system_map_build
      - capability_extract

  - id: feature_modeling
    name: "Feature Modeling"
    kind: stage
    description: "Split capabilities into independently acceptable FEAT candidates"
    depends_on: [capability_extract]
    steps:
      - id: feature_registry_build
        name: "Feature Registry Build"
        kind: skill
        mandatory: true
        depends_on: []
        config:
          execution:
            command: >-
              python {{ params.framework_root | default('.') }}/scripts/reverse_epic_feat.py feature-registry
              --repo-root "{{ params.repo_root }}"
              --specs-dir "{{ specs_dir }}"
              --docs-dir "{{ docs_dir }}"
              --artifacts-dir "{{ artifacts_dir }}"
              --request-id "{{ params.request_id }}"
              --max-capabilities "{{ params.max_capabilities | default(12) }}"
              --max-features-per-capability "{{ params.max_features_per_capability | default(8) }}"
        outputs:
          - path: "{{ specs_dir }}/requirements/feature-registry.md"
            type: file
            format: markdown
            description: "Feature registry document"
            required: true
          - path: "{{ docs_dir }}/reports/feature-registry.json"
            type: file
            format: json
            description: "Machine-readable feature registry"
            required: true
    step_order:
      - feature_registry_build

  - id: epic_feat_materialization
    name: "EPIC FEAT Materialization"
    kind: stage
    description: "Materialize formal SRC/EPIC/FEAT outputs and downstream seed/view bundles"
    depends_on: [feature_registry_build]
    steps:
      - id: epic_feat_ssot_materialize
        name: "Reverse SSOT Materialize"
        kind: skill
        mandatory: true
        depends_on: []
        config:
          execution:
            command: >-
              python {{ params.framework_root | default('.') }}/scripts/reverse_epic_feat.py materialize
              --repo-root "{{ params.repo_root }}"
              --specs-dir "{{ specs_dir }}"
              --docs-dir "{{ docs_dir }}"
              --artifacts-dir "{{ artifacts_dir }}"
              --request-id "{{ params.request_id }}"
              --max-capabilities "{{ params.max_capabilities | default(12) }}"
              --max-features-per-capability "{{ params.max_features_per_capability | default(8) }}"
              --strict-evidence "{{ params.strict_evidence | default(true) }}"
        outputs:
          - path: "{{ specs_dir }}/requirements/"
            type: file_set
            format: markdown
            description: "EPIC and FEAT markdown outputs"
            required: true
          - path: "{{ artifacts_dir }}/active/reverse-epic-feat-ssot-output.json"
            type: file
            format: json
            description: "SSOT output bundle with formal src/epic/feat and non-formal seed/view artifacts"
            required: true
    step_order:
      - epic_feat_ssot_materialize

  - id: review
    name: "SSOT Consistency Review"
    kind: stage
    description: "Review formal object boundaries, seed/view outputs, evidence grounding, and chain completeness"
    depends_on: [epic_feat_ssot_materialize]
    steps:
      - id: ssot_consistency_review
        name: "SSOT Consistency Review"
        kind: skill
        mandatory: true
        depends_on: []
        config:
          execution:
            command: >-
              python {{ params.framework_root | default('.') }}/scripts/reverse_epic_feat.py review
              --repo-root "{{ params.repo_root }}"
              --specs-dir "{{ specs_dir }}"
              --docs-dir "{{ docs_dir }}"
              --artifacts-dir "{{ artifacts_dir }}"
              --request-id "{{ params.request_id }}"
              {% if params.strict_evidence | default(true) %}--strict-evidence{% endif %}
        outputs:
          - path: "{{ artifacts_dir }}/active/reverse-ssot-chain-review.json"
            type: file
            format: json
            description: "Structured review report"
            required: true
    step_order:
      - ssot_consistency_review

  - id: freeze_or_publish
    name: "Freeze Or Publish"
    kind: stage
    description: "Draft, publish, or freeze formal SRC/EPIC/FEAT outputs after full-chain review"
    depends_on: [ssot_consistency_review]
    steps:
      - id: reverse_ssot_review_gate
        name: "Reverse SSOT Review Gate"
        kind: gate
        mandatory: true
        depends_on: []
        config:
          gate:
            type: auto_check
            check: "{{ 'blocker_count == 0 and major_count == 0' if params.publish_mode == 'freeze' else 'blocker_count == 0' }}"
            on_fail:
              action: "{{ 'human_gate' if params.human_gate_required | default(true) else 'fail_step' }}"
            approval_criteria:
              - "No evidence-free FEAT remains"
              - "No major template-instance boundary confusion remains"
              - "EPIC and FEAT parent relationships are coherent"
      - id: final_output
        name: "Final Output"
        kind: skill
        mandatory: true
        depends_on: [reverse_ssot_review_gate]
        config:
          execution:
            command: >-
              python {{ params.framework_root | default('.') }}/scripts/reverse_epic_feat.py complete
              --repo-root "{{ params.repo_root }}"
              --specs-dir "{{ specs_dir }}"
              --docs-dir "{{ docs_dir }}"
              --artifacts-dir "{{ artifacts_dir }}"
              --request-id "{{ params.request_id }}"
              --publish-mode "{{ params.publish_mode | default('draft') }}"
        outputs:
          - path: "{{ docs_dir }}/reports/reverse-ssot-chain-completion.md"
            type: file
            format: markdown
            description: "Completion summary"
            required: true
          - path: "{{ docs_dir }}/reports/reverse-epic-feat-output.json"
            type: file
            format: json
            description: "Machine-readable workflow output summary"
            required: true
    step_order:
      - reverse_ssot_review_gate
      - final_output

stage_order:
  - evidence_scan
  - system_understanding
  - feature_modeling
  - epic_feat_materialization
  - review
  - freeze_or_publish

instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
  context_fields:
    - request_id
    - repo_root
    - objective
    - strict_evidence
    - publish_mode
    - include_paths
    - exclude_paths
  output_fields:
    - reverse_ssot_status
    - blocker_count
    - major_count
