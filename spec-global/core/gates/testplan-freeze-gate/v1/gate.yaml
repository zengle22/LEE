# TESTPLAN Freeze Gate v1.0
# TESTPLAN 冻结门禁（人类审批）
#
# 定位：ADR-027 渐进式工作流的核心 Gate 之一
# 人类审批冻结 TESTPLAN

kind: gate
version: 1.0

# ============================================
# 宪法引用
# ============================================
constitution:
  ref: ../../../departments/qa/AGENTS.md
  version: "1.0"
  mandatory: true

# ============================================
# ADR 引用
# ============================================
governing_adrs:
  - ADR-027: 渐进式工作流落地设计

id: gate.qa.testplan_freeze_gate
name: TESTPLAN Freeze Gate
description: >
  TESTPLAN 冻结门禁（人类审批）。
  锁定 TESTPLAN 的 test_set_refs，禁止增删，标记为 frozen 状态。

owner: qa-governance
tags: [gate, qa, testplan, freeze, human-approval, adr-027]

# ============================================
# 门禁类型
# ============================================
type: human_approval
priority: blocker

# ============================================
# 触发条件
# ============================================
trigger:
  event: "test_set_validate_passed"
  source: "gate.qa.test_set_validate_gate"

# ============================================
# 输入证据
# ============================================
input_evidence:
  - "spec/testplans/testplan-{release_id}.yaml"
  - "spec/testplans/{release_id}/test_strategy.yaml"
  - "spec/testplans/{release_id}/test_set_validation_result.json"

# ============================================
# 审批人
# ============================================
approvers:
  - role: qa_lead
    description: "QA 负责人，确认测试策略和覆盖度"
  - role: release_manager
    description: "发布经理，确认发布计划和时间表"

# ============================================
# 审批标准
# ============================================
approval_criteria:
  - id: test_set_coverage_validated
    description: "Test Set 覆盖度验证通过"
    check: "gate.qa.test_set_validate_gate passed"
    required: true

  - id: traceability_complete
    description: "追溯性完整 (每个 TC 都 trace_to FEAT AC)"
    check: "all test cases trace back to FEAT Acceptance Criteria"
    required: true

  - id: risk_areas_identified
    description: "风险区域已识别并有缓解措施"
    check: "risk areas are identified with mitigation strategies"
    required: true

  - id: test_environment_ready
    description: "测试环境准备就绪"
    check: "test environment is ready for execution"
    required: false

# ============================================
# 通过条件
# ============================================
pass_criteria:
  all_required: true
  min_approvals: 2  # Both qa_lead and release_manager must approve
  description: "所有审批人必须批准"

# ============================================
# 失败处理
# ============================================
on_fail:
  action: "block_and_return"
  message: "TESTPLAN 冻结审批未通过，请修正后重新提交审批"
  return_to: "template.core.release2testplan"

# ============================================
# 效果
# ============================================
on_pass:
  action: "freeze_testplan"
  effects:
    - "Set TESTPLAN.status = 'frozen'"
    - "Lock test_set_refs (no additions or deletions)"
    - "Record frozen_at timestamp"
    - "Record frozen_by = 'gate.qa.testplan_freeze_gate'"

# ============================================
# 元数据
# ============================================
metadata:
  created_by: "qa-governance"
  created_at: "2026-03-17"
  version: "1.0"
  changelog:
    - version: "1.0"
      date: "2026-03-17"
      changes:
        - "新建 TESTPLAN 冻结门禁 (ADR-027)"
