# TEST SET Validate Gate v1.0
# Test Set 覆盖度验证门禁（自动检查）
#
# 定位：ADR-027 渐进式工作流的核心 Gate 之一
# 验证 TESTPLAN 的 Test Set 覆盖度

kind: gate
version: 1.0

# ============================================
# 宪法引用
# ============================================
constitution:
  ref: ../../../departments/qa/AGENTS.md
  version: "1.0"
  mandatory: true

# ============================================
# ADR 引用
# ============================================
governing_adrs:
  - ADR-027: 渐进式工作流落地设计

id: gate.qa.test_set_validate_gate
name: TEST SET Validate Gate
description: >
  Test Set 覆盖度验证门禁（自动检查）。
  验证 TESTPLAN 的 Test Set 覆盖度，确保所有 FEAT 都有测试覆盖。

owner: qa-governance
tags: [gate, qa, testset, validate, testplan, adr-027]

# ============================================
# 门禁类型
# ============================================
type: automated
priority: blocker

# ============================================
# 触发条件
# ============================================
trigger:
  event: "test_set_production_complete"
  source: "template.core.release2testplan"

# ============================================
# 输入证据
# ============================================
input_evidence:
  - "spec/testplans/testplan-{release_id}.yaml"
  - "spec/testplans/{release_id}/test_strategy.yaml"
  - "qa_specs_dir/test-sets/ts-*.yaml"

# ============================================
# 检查项
# ============================================
checks:
  - id: all_feats_covered
    name: "所有 FEAT 都有 Test Set 覆盖"
    description: "每个 FEAT 必须至少有一个 Test Set 对应"
    type: coverage_check
    rule: "for each feat_ref, exists at least one test_set with matching feat_ref"
    severity: blocker
    required: true
    input_field: "test_set_assets"

  - id: traceability_complete
    name: "追溯性完整"
    description: "每个测试用例必须追溯至 FEAT Acceptance Criteria"
    type: traceability_check
    rule: "all test_cases have non-empty trace_to field referencing FEAT.AC"
    severity: blocker
    required: true
    input_field: "test_set_assets.test_cases.trace_to"

  - id: priority_distribution_reasonable
    name: "优先级分布合理"
    description: "优先级分布合理 (P0 占比 20-40%)"
    type: metric_check
    rule: "P0_count / total_count >= 0.2 AND P0_count / total_count <= 0.4"
    severity: warning
    required: false
    input_field: "test_set_assets.test_cases.priority"

  - id: test_types_complete
    name: "测试类型覆盖完整"
    description: "测试类型覆盖完整 (smoke/regression)"
    type: coverage_check
    rule: "exists smoke tests AND exists regression tests"
    severity: blocker
    required: true
    input_field: "test_set_assets.test_cases.type"

  - id: test_steps_clear
    name: "测试步骤清晰"
    description: "所有测试用例必须有清晰的步骤和预期结果"
    type: field_check
    rule: "all test_cases have non-empty steps and expected fields"
    severity: major
    required: true
    input_field: "test_set_assets.test_cases"

# ============================================
# 通过条件
# ============================================
pass_criteria:
  all_required: true
  max_blocker: 0
  max_major: 0
  description: "所有 blocker 和 major 检查必须通过"

# ============================================
# 失败处理
# ============================================
on_fail:
  action: "block_and_return"
  message: "Test Set 覆盖度验证未通过，请补充缺失的测试用例或追溯性"
  return_to: "template.core.release2testplan"

# ============================================
# 元数据
# ============================================
metadata:
  created_by: "qa-governance"
  created_at: "2026-03-17"
  version: "1.0"
  changelog:
    - version: "1.0"
      date: "2026-03-17"
      changes:
        - "新建 Test Set 覆盖度验证门禁 (ADR-027)"
