# OUTPUT Contract Gate v1.0
# 输出 Contract 验证门禁（自动检查）
#
# 定位：ADR-027 渐进式工作流的核心 Gate 之一
# 验证 FEAT2PLAN L2 输出 Contract 完整性

kind: gate
version: 1.0

# ============================================
# 宪法引用
# ============================================
constitution:
  ref: ../../AGENTS.md
  version: "1.0"
  mandatory: true

# ============================================
# ADR 引用
# ============================================
governing_adrs:
  - ADR-027: 渐进式工作流落地设计

id: gate.core.output_contract_gate
name: OUTPUT Contract Gate
description: >
  输出 Contract 验证门禁（自动检查）。
  验证 FEAT2PLAN L2 输出 Contract 完整性，确保 DEVPLAN 和 TESTPLAN 都已冻结。

owner: dev-governance
tags: [gate, core, output, contract, adr-027]

# ============================================
# 门禁类型
# ============================================
type: automated
priority: blocker

# ============================================
# 触发条件
# ============================================
trigger:
  event: "derive_plans_complete"
  source: "workflow.core.feat2plan"

# ============================================
# 输入证据
# ============================================
input_evidence:
  - "spec/devplans/devplan-{release_id}.yaml"
  - "spec/testplans/testplan-{release_id}.yaml"
  - ".workflow/{release_id}/release_output.yaml"

# ============================================
# 检查项
# ============================================
checks:
  - id: devplan_frozen
    name: "DEVPLAN 已冻结"
    description: "DEVPLAN 必须是 frozen 状态"
    type: field_check
    rule: "DEVPLAN.status == 'frozen'"
    severity: blocker
    required: true
    input_field: "devplan.status"

  - id: testplan_frozen
    name: "TESTPLAN 已冻结"
    description: "TESTPLAN 必须是 frozen 状态"
    type: field_check
    rule: "TESTPLAN.status == 'frozen'"
    severity: blocker
    required: true
    input_field: "testplan.status"

  - id: traceability_complete
    name: "追溯性完整"
    description: "追溯性完整 (DEVPLAN 和 TESTPLAN 都能追溯到 FEAT)"
    type: traceability_check
    rule: "DEVPLAN.task_refs trace to FEAT refs AND TESTPLAN.test_set_refs trace to FEAT refs"
    severity: blocker
    required: true
    input_field: "devplan, testplan"

  - id: release_binding_complete
    name: "RELEASE 绑定完整"
    description: "DEVPLAN 和 TESTPLAN 都绑定到同一个 RELEASE"
    type: field_check
    rule: "DEVPLAN.release_ref == TESTPLAN.release_ref"
    severity: major
    required: true
    input_field: "devplan.release_ref, testplan.release_ref"

  - id: downstream_ready
    name: "下游执行就绪"
    description: "下游 Dev/QA 执行工作流可以启动"
    type: validation_check
    rule: "all required inputs for downstream workflows are present"
    severity: major
    required: false
    input_field: "downstream_inputs"

# ============================================
# 通过条件
# ============================================
pass_criteria:
  all_required: true
  max_blocker: 0
  max_major: 0
  description: "所有 blocker 和 major 检查必须通过"

# ============================================
# 失败处理
# ============================================
on_fail:
  action: "block_and_return"
  message: "输出 Contract 验证未通过，请检查 DEVPLAN 和 TESTPLAN 状态"
  return_to: "workflow.core.feat2plan"

# ============================================
# 通过效果
# ============================================
on_pass:
  action: "release_outputs"
  effects:
    - "Mark FEAT2PLAN workflow as complete"
    - "Enable downstream workflow spawning"
    - "Generate output_contract.json"

# ============================================
# 元数据
# ============================================
metadata:
  created_by: "dev-governance"
  created_at: "2026-03-17"
  version: "1.0"
  changelog:
    - version: "1.0"
      date: "2026-03-17"
      changes:
        - "新建输出 Contract 验证门禁 (ADR-027)"
