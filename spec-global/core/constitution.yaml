# LEE Framework Constitution
# 框架宪法 - 核心原则、角色和治理规则

schema_version: 1.1.0
version: 1.1.0
last_updated: 2026-02-11

# ============================================
# 目标与非目标
# ============================================
constitution:
  goals:
    - 提升工程与训练决策质量
    - 降低重复劳动
    - 实现可复现的 AI 工作流
    - 建立清晰的规范和协议

  non_goals:
    - 直接执行任何未经过人类确认的高风险操作
    - 替代人类决策者的核心判断
    - 隐藏系统决策过程

# ============================================
# 核心原则
# ============================================
principles:
  - safety_first: "安全优先 - 所有操作必须考虑安全边界"
  - explainability: "可解释优先 - 系统行为必须可追溯和解释"
  - reproducibility: "可复现优先 - 相同输入应产生相同输出"
  - honesty: "不确定时坦白不确定 - 不产生幻觉或假信息"
  - yaml_truth: "YAML 为单一事实源，MD 仅作补充，冲突时以 YAML 为准"

# ============================================
# 执行体分类法（Execution Taxonomy）
# ============================================
# 这是 LEE 框架中最重要的语义边界之一：
# 明确区分"谁在思考"和"谁在执行"。
#
# 在 workflow 的 run: / agent: / skill: 字段中：
# - agent.*  表示：调用 LLM / AI Agent 角色
# - skill.*  表示：调用传统程序 / CLI / 确定性工具
# - gate.*   表示：人类决策点
#
# 违反此命名约定的 workflow 应被视为不合规。
execution_taxonomy:
  version: "1.0"
  description: |
    LEE 框架将所有执行体分为三大类，其中 Skill 进一步细分为三子类：
    1. Agent (agent.*) - LLM 驱动的 AI 角色，具有推理和决策能力
    2. Skill (skill.*) - 分为三类：
       a. Tool Skill  — 有 spec + runtime（CLI/MCP），agent.yaml 中声明于 tools:
       b. Spec Skill  — 有 spec 无 runtime（纯规则），agent.yaml 中声明于 specs:
       c. Capability   — 无 spec（prompt 知识），agent.yaml 中声明于 capabilities:
    3. Gate (gate.*)   - 人类决策点，需要人工审批或确认

    这一分类是刚性约束，由 scripts/spec_validate.py 自动校验。

  categories:
    agent:
      prefix: "agent.*"
      naming: "agent.{department}.{role_name}"
      description: |
        LLM 驱动的 AI 角色。具有：
        - 推理和分析能力
        - 自然语言输入/输出
        - 上下文理解
        - 不确定性（需要验证产出）
      executor: LLMExecutor
      examples:
        - "agent.dev.tech_lead"
        - "agent.qa.case_generator"
        - "agent.devops.architect"
      workflow_field: "run: agent.* 或 agent: agent.*"
      step_type: "kind: agent 或 type: agent"

    # ── Skill 三分法（Three-Category Skill Taxonomy）──
    # Agent 可引用三类 skill，分别对应 agent.yaml 中的
    # tools: / specs: / capabilities: 三个字段。
    # 本分类法是刚性约束，spec_validate.py 自动校验。

    tool_skill:
      prefix: "skill.*"
      naming: "skill.{category}.{tool_name}"
      agent_field: "tools:"
      description: |
        工具型 Skill — 有对应 skill.yaml 且声明了 runtime: 块。
        由 Orchestrator 通过 CLI / MCP / Shell 调用执行。
        特征：
        - 确定性执行（相同输入 → 相同输出）
        - 有 runtime: 配置（command, args_template, exit_codes）
        - 可审计的命令行日志
        - 无推理能力
      executor: ShellExecutor
      validation:
        - "必须存在 skill.yaml spec 文件"
        - "spec 文件必须包含 runtime: 块"
      sub_categories:
        runner:
          naming: "skill.runner.{runner_name}"
          description: "统一执行器（如 test_runner, deploy_runner）"
          examples:
            - "skill.runner.test_e2e"
        env:
          naming: "skill.env.{check_name}"
          description: "环境检查工具"
          examples:
            - "skill.env.check_tools"
        file:
          naming: "skill.file.{operation}"
          description: "文件操作工具"
          examples:
            - "skill.file.read"
        lint:
          naming: "skill.lint.{linter}"
          description: "静态检查工具"
          examples:
            - "skill.lint.ruff"
        test:
          naming: "skill.test.{framework}"
          description: "测试框架执行器"
          examples:
            - "skill.test.pytest"
        git:
          naming: "skill.git.{operation}"
          description: "Git 操作工具"
          examples:
            - "skill.git.checkout"
        media:
          naming: "skill.media.{tool_name}"
          description: "媒体处理工具"
          examples:
            - "skill.media.diagram_generation"
            - "skill.media.md_to_wechat_richtext"
        devops:
          naming: "skill.devops.{operation}"
          description: "DevOps 操作工具"
          examples:
            - "skill.devops.deploy"
            - "skill.devops.health_check"
      workflow_field: "run: skill.* 或 skill: skill.*"
      step_type: "kind: skill 或 type: skill"

    spec_skill:
      prefix: "skill.*"
      naming: "skill.{category}.{spec_name}"
      agent_field: "specs:"
      description: |
        规范型 Skill — 有对应 skill.yaml 但无 runtime: 块。
        定义了规则、约束、模板或验证标准，Agent 在 prompt 内遵循执行。
        特征：
        - 有 spec 文件定义 input/output schema 和 constraints
        - 无 runtime: 配置（不直接执行命令）
        - Agent 按规则内嵌执行，不调用外部工具
        - 产出可通过 spec 中定义的 constraints 验证
      executor: 无（Agent 内执行）
      validation:
        - "必须存在 skill.yaml spec 文件"
        - "spec 文件不需要 runtime: 块"
      examples:
        - "skill.media.content_proofreading"    # 内容校对规则
        - "skill.media.style_validation"        # 风格校验规则
        - "skill.media.readable_color_layout"   # 排版规则
        - "skill.media.platform_safe_rendering" # 平台安全渲染规则
        - "skill.ui.markdown_to_contract"       # MD→UI 合同转换规则

    capability:
      prefix: "skill.*"
      naming: "skill.{domain}.{knowledge_area}"
      agent_field: "capabilities:"
      description: |
        知识型能力声明 — 无 spec 文件，纯 prompt 领域知识。
        描述 Agent 具备的领域知识或方法论能力。
        特征：
        - 无 spec 文件（不需要外部定义）
        - 无 runtime: 配置
        - 完全在 Agent LLM 内部执行
        - 框架不做存在性校验
      executor: 无（LLM 内在知识）
      validation:
        - "不做 spec 文件存在性校验"
        - "不做 runtime: 校验"
      examples:
        - "skill.go.idiomatic_code"             # Go 语言编码知识
        - "skill.go.concurrency_patterns"       # Go 并发模式
        - "skill.vue3.composition_api"          # Vue3 Composition API
        - "skill.qa.case_generation"            # 测试用例生成方法
        - "skill.dev.architecture_design"       # 架构设计方法论
        - "skill.review.code_quality_check"     # 代码质量评审知识

    gate:
      prefix: "gate.*"
      naming: "gate.{department}.{gate_name}"
      description: |
        人类决策点。具有：
        - 阻塞式审批（blocking）
        - 明确的审批角色和标准
        - 超时升级机制
        - 审计跟踪
      examples:
        - "gate.dev.h1_plan_review"
        - "gate.qa.result_judgment_review"
        - "gate.devops.deploy_gate"
      step_type: "kind: human_gate 或 type: human_gate"

  # 强制规则
  enforcement:
    - rule: "所有 workflow 的 run: 字段必须使用 agent.* 或 skill.* 前缀"
      severity: error
      description: "裸名称（如 run: test_runner）是不合规的"

    - rule: "所有 workflow 应在顶部声明 roles: 节，列出参与的 agent 和 skill"
      severity: warning
      description: "roles 节是工作流的角色清单，便于调试和治理"

    - rule: "agent.* 的 executor 必须是 LLMExecutor"
      severity: error
      description: "Agent 必须由 LLM 驱动"

    - rule: "skill.* 的 executor 必须是 ShellExecutor 或等效的非 LLM 执行器"
      severity: error
      description: "Skill 是传统程序，不应由 LLM 驱动"

  # Workflow 中的角色地图（推荐格式）
  workflow_roles_template: |
    # 在每个 workflow 顶部声明角色地图：
    roles:
      agents:
        - agent.qa.case_generator       # LLM：生成测试用例
        - agent.qa.result_judge         # LLM：判定结果
      tool_skills:
        - skill.file.read               # 工具型：读取文件
        - skill.runner.test_e2e         # 工具型：统一测试执行器
        - skill.env.check_tools         # 工具型：环境检查
      spec_skills:
        - skill.media.style_validation  # 规范型：风格校验规则
      gates:
        - gate.qa.result_judgment_review # 人类：结果判定评审

# ============================================
# 系统角色
# ============================================
roles:
  - name: architect
    scope: [system_design, workflow_design]
    input_required: [requirements, constraints]
    output: [architecture_doc, task_breakdown]

  - name: code_writer
    scope: [implementation, refactor]
    input_required: [architecture_doc, task_detail]
    output: [source_code, unit_tests]

  - name: product_manager
    scope: [requirement_analysis, feature_planning]
    input_required: [user_feedback, business_goals]
    output: [prd, feature_spec]

  - name: qa_engineer
    scope: [testing, quality_assurance]
    input_required: [implementation, acceptance_criteria]
    output: [test_report, bug_report]

# ============================================
# 工作流模板
# ============================================
workflows:
  software_dev:
    name: "标准软件开发流程"
    stages:
      - order: 1
        role: product_manager
        name: requirement_analysis
        description: "需求分析和产品定义"

      - order: 2
        role: architect
        name: design_solution
        description: "技术方案设计"

      - order: 3
        role: code_writer
        name: implement
        description: "代码实现"

      - order: 4
        role: qa_engineer
        name: test_and_verify
        description: "测试和验证"

      - order: 5
        role: architect
        name: review_and_signoff
        description: "审查和验收"

# ============================================
# 质量标准
# ============================================
quality:
  code:
    must:
      - compile_without_error
      - pass_unit_tests
      - follow_lint_rules
      - have_documentation

    should:
      - follow_design_patterns
      - handle_errors_gracefully
      - be_maintainable

  doc:
    must:
      - have_structure
      - state_assumptions
      - provide_examples

    should:
      - be_up_to_date
      - be_clear_and_concise

  workflow:
    must:
      - be_reproducible
      - have_clear_inputs_outputs
      - handle_failures_gracefully

# ============================================
# 治理规则
# ============================================
governance:
  # 需要日志的操作
  log_required_for:
    - high_risk_operations
    - state_changes
    - external_api_calls
    - human_interventions

  # 升级规则
  escalation_rules:
    - condition: "quality_score < 3 for 2 consecutive runs"
      action: "escalate_to_human"
      severity: "high"

    - condition: "unexpected_error_occurred"
      action: "pause_and_notify"
      severity: "medium"

    - condition: "human_approval_required"
      action: "wait_for_human_input"
      severity: "low"

  # 决策权限
  decision_authority:
    low_risk:
      - "系统可以自动决策"
      - "例如：代码格式化、文档生成"

    medium_risk:
      - "系统建议，人类确认"
      - "例如：重构建议、测试生成"

    high_risk:
      - "必须由人类决策"
      - "例如：架构变更、删除数据"

# ============================================
# 部门组织
# ============================================
organization:
  departments:
    dev:
      name: "开发部门"
      responsibilities:
        - "技术架构设计"
        - "代码实现"
        - "技术文档"

    prd:
      name: "产品部门"
      responsibilities:
        - "需求分析"
        - "PRD 编写"
        - "产品规划"

    qa:
      name: "质量保证部门"
      responsibilities:
        - "测试计划"
        - "质量验证"
        - "缺陷追踪"

    ui:
      name: "UI/UX 设计部门"
      responsibilities:
        - "用户界面设计"
        - "交互设计"
        - "设计系统维护"

    stg:
      name: "策略部门"
      responsibilities:
        - "市场分析"
        - "商业洞察"
        - "竞品分析"

    office:
      name: "办公室"
      responsibilities:
        - "审批流程"
        - "项目管理"
        - "协调沟通"

    ops:
      name: "运营部门"
      responsibilities:
        - "系统运维"
        - "部署管理"
        - "监控告警"

# ============================================
# 跨部门协作
# ============================================
cross_department:
  interfaces:
    - name: "prd_to_dev"
      from: "prd"
      to: "dev"
      protocol: "frozen_prd_contract"

    - name: "dev_to_qa"
      from: "dev"
      to: "qa"
      protocol: "test_round_contract"

    - name: "ui_to_dev"
      from: "ui"
      to: "dev"
      protocol: "ui_contract"

  workflows:
    - name: "product_pipeline"
      description: "从需求到发布的完整流程"
      participants: [prd, dev, qa, ui]

    - name: "ui_design_pipeline"
      description: "UI 设计流程"
      participants: [prd, ui, dev]

# ============================================
# 版本控制
# ============================================
version_control:
  spec_format: "yaml"
  versioning_scheme: "semantic"
  backward_compatibility:
    - "Minor 版本更新保持向后兼容"
    - "Major 版本更新可能包含破坏性变更"
    - "所有变更必须在 CHANGELOG 中记录"
