# Test Set: 每日训练计划
# 已通过 test-set-production 工作流生成

test_set_id: "TS-DAILY-PLAN"
module: "每日训练计划"
description: "测试每日训练计划生成、配速计算和降级处理功能"
owner: "qa-team"

strategy:
  focus:
    - "计划生成逻辑"
    - "配速/心率区间计算"
    - "降级场景"
  risk_areas:
    - "边界值：新手 vs 精英跑者配速差异大"
    - "异常：无历史数据时的兜底处理"
    - "性能：大量历史数据时的计算性能"
  test_types:
    - api
    - e2e
  priority: P0

test_focus:
  positive:
    - "正常生成7日计划"
    - "根据疲劳度调整强度"
    - "显示配速区间和心率区间"
    - "不同训练类型正确展示"
  negative:
    - "无跑步历史时的降级"
    - "配速超出合理范围的处理"
    - "API 返回异常数据时的处理"
  boundary:
    - "最小周跑量（10km）"
    - "最大周跑量（200km）"
    - "连续休息天数上限（3天）"
    - "配速边界（3:00/km - 10:00/km）"
  exception:
    - "网络超时"
    - "API 500 错误"
    - "数据库连接失败"

execution:
  estimated_duration: "30min"
  requires_env:
    - api
    - database
  requires_data:
    - "测试用户账号"
    - "历史跑步记录（多种场景）"
  automation_ready: true

traceability:
  requirement_ids:
    - "REQ-DAILY-PLAN-001"
    - "REQ-DAILY-PLAN-002"
  feature_ids:
    - "daily-plan"
    - "pace-calculation"
    - "degradation"

status: active
version: "1.0"
created_at: "2026-02-09T10:00:00Z"
