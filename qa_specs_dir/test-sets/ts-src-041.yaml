  - FEAT-SRC-041-001 → FEAT-SRC-041-003 (双轴语义是正式动作约束的基础)
  - FEAT-SRC-041-001 → FEAT-SRC-041-004 (双轴语义是最小摘要的基础)
  - FEAT-SRC-041-001 → FEAT-SRC-041-005 (双轴语义是统一结果的基础)
  - FEAT-SRC-041-002 → FEAT-SRC-041-003 (上下文强制化是正式动作约束的基础)
  - FEAT-SRC-041-002 → FEAT-SRC-041-004 (上下文强制化是最小摘要的基础)
  - FEAT-SRC-041-002 → FEAT-SRC-041-005 (上下文强制化是统一结果的基础)

notes: |
  本 Test Set 验证 EPIC-SRC-041-016 中的所有 5 个 FEAT：
  1. FEAT-SRC-041-001: Gate purpose 与 decision_mode 目标语义冻结
  2. FEAT-SRC-041-002: human_gate_context 人工决策前置上下文强制化
  3. FEAT-SRC-041-003: 正式边界动作的 approval plus human_required 约束
  4. FEAT-SRC-041-004: 待审批 gate 的最小可判断摘要统一
  5. FEAT-SRC-041-005: 人工 gate 决策结果的统一 gate_result 输出
  
  关键测试场景：
  - Gate 双轴语义定义与验证
  - 历史分类到双轴模型的映射
  - human_gate_context 完整性与强制校验
  - 正式边界动作的 approval + human_required 约束
  - 待审批 gate 最小可判断摘要展示
  - list/show/decide 链路语义一致性
  - Gate 决策结果统一输出与字段验证
  
  测试执行顺序建议：
  Phase 1: TF-001, TF-002, TF-003 (双轴语义基础)
  Phase 2: TF-004, TF-005, TF-006 (上下文强制化)
  Phase 3: TF-007, TF-008 (正式动作约束)
  Phase 4: TF-009, TF-010 (最小摘要统一)
  Phase 5: TF-011, TF-012 (统一结果输出)
