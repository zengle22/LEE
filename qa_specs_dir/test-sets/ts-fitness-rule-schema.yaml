---
# Test Set: fitness-rule-schema
# Test Set 设计资产 - 验证 FEAT-SRC-059-001

feat_ref: FEAT-SRC-059-001
id: ts-fitness-rule-schema
module: fitness-rule-schema
ssot_type: TESTSET
status: draft
version: "1.0"

# 模块信息
module_info:
  name: fitness-rule-schema
  description: Fitness Rule Schema 定义 - 定义 fitness_rule.yaml 的 JSON schema 及验证工具
  interfaces:
    - Schema 验证工具接口 (validate_fitness_rule.py)
    - YAML/JSON 双格式支持
    - 结构化错误输出接口

# 测试策略
strategy:
  focus:
    - Schema 验证工具正确性
    - YAML/JSON 双格式支持
    - 结构化错误信息输出
    - 必需字段约束验证
  test_types:
    - unit
    - integration
    - contract
  priority: P0

# 可追溯性
traceability:
  feature_ids:
    - FEAT-SRC-059-001
  acceptance_criteria_refs:
    - AC-001: Schema 验证工具验证合法的 fitness rule 文件
    - AC-002: Schema 验证工具检测非法 fitness rule 文件
    - AC-003: schema 支持 YAML 和 JSON 双格式

# 执行配置
execution:
  mode: sequential
  fail_fast: true
  timeout_seconds: 60

# 验证规则
validation_rules:
  - rule: "schema_validation_coverage"
    check: "ALL fitness_rule 文件 MUST pass schema validation OR fail with structured error"
  - rule: "trace_to_feat"
    check: "ALL test_cases HAVE trace_to STARTING_WITH 'FEAT-SRC-059-001'"
  - rule: "dual_format_support"
    check: "test_cases MUST cover BOTH YAML and JSON input formats"
  - rule: "exit_code_semantic"
    check: "IF validation_passed=true THEN exit_code=0 ELSE exit_code!=0"

# 测试用例
test_cases:
  # ========== AC-001: 验证合法的 fitness rule 文件 ==========
  - case_id: TC-FRS-001
    title: Schema 验证工具验证合法的 YAML fitness rule 文件
    description: 验证符合 schema 的 YAML 格式 fitness_rule.yaml 文件能通过验证
    priority: P0
    type: unit
    feature_id: FEAT-SRC-059-001
    acceptance_criteria_id: AC-001
    trace_to:
      - FEAT-SRC-059-001.AC-001
    steps:
      - step_number: 1
        action: 创建符合 schema 的 fitness_rule.yaml 文件（包含 rule_id, rule_type, scan_command, pass_criteria, description）
        expected_result: 文件创建成功，内容符合 JSON Schema Draft 2020-12
      - step_number: 2
        action: 执行 validate_fitness_rule.py 验证该文件
        expected_result: 验证通过，不输出错误信息
      - step_number: 3
        action: 检查返回的退出码
        expected_result: 返回零退出码 (exit_code=0)
    expected_result: YAML 格式的合法 fitness rule 文件验证通过

  - case_id: TC-FRS-002
    title: Schema 验证工具验证合法的 JSON fitness rule 文件
    description: 验证符合 schema 的 JSON 格式 fitness_rule.json 文件能通过验证
    priority: P0
    type: unit
    feature_id: FEAT-SRC-059-001
    acceptance_criteria_id: AC-003
    trace_to:
      - FEAT-SRC-059-001.AC-003
    steps:
      - step_number: 1
        action: 创建符合 schema 的 fitness_rule.json 文件
        expected_result: 文件创建成功
      - step_number: 2
        action: 执行 validate_fitness_rule.py 验证该文件
        expected_result: 验证通过
      - step_number: 3
        action: 检查返回的退出码
        expected_result: 返回零退出码
    expected_result: JSON 格式的合法 fitness rule 文件验证通过

  # ========== AC-002: 检测非法 fitness rule 文件 ==========
  - case_id: TC-FRS-003
    title: Schema 验证工具检测缺少必需字段的文件
    description: 验证缺少必需字段的文件会被检测并输出结构化错误
    priority: P0
    type: unit
    feature_id: FEAT-SRC-059-001
    acceptance_criteria_id: AC-002
    trace_to:
      - FEAT-SRC-059-001.AC-002
    steps:
      - step_number: 1
        action: 创建缺少 rule_type 字段的 fitness_rule.yaml 文件
        expected_result: 文件创建成功
      - step_number: 2
        action: 执行 validate_fitness_rule.py 验证该文件
        expected_result: 验证失败，输出结构化错误信息
      - step_number: 3
        action: 检查错误信息内容
        expected_result: 错误信息包含字段路径 "$.rule_type"
      - step_number: 4
        action: 检查返回的退出码
        expected_result: 返回非零退出码 (exit_code!=0)
    expected_result: 缺少必需字段的 fitness rule 文件被正确检测

  - case_id: TC-FRS-004
    title: Schema 验证工具检测无效 rule_type 的文件
    description: 验证 rule_type 不是 hard_gate 或 quality_signal 时验证失败
    priority: P0
    type: unit
    feature_id: FEAT-SRC-059-001
    acceptance_criteria_id: AC-002
    trace_to:
      - FEAT-SRC-059-001.AC-002
    steps:
      - step_number: 1
        action: 创建 rule_type="invalid_type" 的 fitness_rule.yaml 文件
        expected_result: 文件创建成功
      - step_number: 2
        action: 执行 validate_fitness_rule.py 验证该文件
        expected_result: 验证失败，输出枚举值错误信息
      - step_number: 3
        action: 检查错误信息内容
        expected_result: 错误信息提示 rule_type 必须是 hard_gate 或 quality_signal
      - step_number: 4
        action: 检查返回的退出码
        expected_result: 返回非零退出码
    expected_result: 无效 rule_type 被正确检测

  - case_id: TC-FRS-005
    title: 结构化错误信息包含行号
    description: 验证验证失败时输出的错误信息包含准确的行号
    priority: P0
    type: unit
    feature_id: FEAT-SRC-059-001
    acceptance_criteria_id: AC-002
    trace_to:
      - FEAT-SRC-059-001.AC-002
    steps:
      - step_number: 1
        action: 创建包含错误的 fitness_rule.yaml 文件（在第 5 行缺少必需字段）
        expected_result: 文件创建成功，已知错误位置在第 5 行
      - step_number: 2
        action: 执行 validate_fitness_rule.py 验证该文件
        expected_result: 验证失败，输出结构化错误信息
      - step_number: 3
        action: 检查错误信息中的行号
        expected_result: 错误信息包含行号 5
    expected_result: 结构化错误信息准确包含行号

