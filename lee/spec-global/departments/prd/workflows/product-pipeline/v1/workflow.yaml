# Product Pipeline Workflow v1.0
# 产品部门流水线 - 从商业机会冻结到需求冻结
#
# 输入: business/v1/business-opportunity-freeze
# 输出: requirement-freeze → dev-freeze-orchestrator
#
# 人类冻结点:
# 1. product-value-freeze (产品价值冻结)
# 2. requirement-freeze (需求冻结)

kind: workflow
version: 1.0

# ============================================
# 基础标识
# ============================================
id: workflow.product.pipeline
name: Product Pipeline
description: >
  产品部门的完整工作流程。
  将商业机会转化为可研发的冻结需求。
  包含4个Agent串行交互，2次人类冻结确认。
owner: product-ai
tags: [product, workflow, pipeline]

# ============================================
# 角色地图（Role Map）
# ============================================
# 参见 core/constitution.yaml → execution_taxonomy
roles:
  agents:
    - agent.analysis.product_goal          # LLM：产品价值分析
    - agent.product.requirement_alignment  # LLM：问题空间翻译
    - agent.product.requirement_decomposer # LLM：需求单元拆解
    - agent.review.requirement_reviewer    # LLM：需求价值对齐评审
    - agent.governance.approval_reviewer   # LLM：冻结审批
  skills: []
  gates:
    - gate.prd.value_freeze                # 人类：产品价值冻结
    - gate.prd.requirement_freeze          # 人类：需求冻结

# ============================================
# 流水线概览
# ============================================
overview:
  input: contracts/business-opportunity-freeze/v1/schema.json
  output: contracts/requirement-freeze/v1/schema.json
  handoff_to: agent.dev.freeze_orchestrator
  
  stages:
    - id: value_definition
      name: "价值定义"
      agent: agent.analysis.product_goal
      freeze: true  # 人类冻结点1
    
    - id: problem_translation
      name: "问题翻译"
      agent: agent.product.requirement_alignment
      freeze: false
    
    - id: requirement_decomposition
      name: "需求拆解"
      agent: agent.product.requirement_decomposer
      freeze: false
    
    - id: requirement_review
      name: "需求评审"
      agent: agent.review.requirement_reviewer
      freeze: true  # 人类冻结点2

# ============================================
# 详细步骤定义
# ============================================
steps:
  # Stage 1: 价值定义
  - id: product_value
    stage: value_definition
    agent: agent.analysis.product_goal
    
    metadata:
      name: "产品价值分析"
      stage_id: "1.1"
      description: >
        接收商业机会冻结文档，分析产品核心目标和业务价值，
        生成产品价值提案供人类确认。
    
    input:
      - source: external
        contract: contracts/business-opportunity-freeze/v1/schema.json
        required: true
    
    output:
      contract: contracts/product-value-proposal/v1/schema.json
      freeze: false
    
    non_goals:
      - 功能设计
      - 技术方案
      - 优先级排序
    
    thinking_boundary: |
      ✅ 可以思考：产品解决什么问题、目标用户、价值主张、成功指标
      ❌ 禁止思考：用什么技术、界面设计、具体功能

  # Stage 1-Freeze: 产品价值冻结
  - id: product_value_freeze
    stage: value_definition
    agent: agent.governance.approval_reviewer
    
    metadata:
      name: "产品价值冻结"
      stage_id: "1.1-freeze"
      description: "人类确认产品价值主张"
    
    input:
      - source: product_value
        required: true
    
    output:
      contract: contracts/product-value-freeze/v1/schema.json
      freeze: true
    
    human_role:
      type: decision
      actions:
        - approve: "确认价值主张，进入问题翻译"
        - request_revision: "返回重新分析"
        - reject: "终止流程"

  # Stage 2: 问题翻译
  - id: problem_translation
    stage: problem_translation
    agent: agent.product.requirement_alignment
    
    metadata:
      name: "问题空间翻译"
      stage_id: "2.1"
      description: >
        将冻结的价值目标翻译成问题空间。
        识别核心问题、描绘用户旅程、明确非目标。
    
    input:
      - source: product_value_freeze
        required: true
    
    output:
      contract: contracts/problem-definition/v1/schema.json
      freeze: false
    
    non_goals:
      - 解决方案设计
      - 功能定义
    
    thinking_boundary: |
      ✅ 可以思考：用户面临什么问题、问题根因、Before/After旅程
      ❌ 禁止思考：如何解决问题、需要什么功能

  # Stage 3: 需求拆解
  - id: requirement_decomposition
    stage: requirement_decomposition
    agent: agent.product.requirement_decomposer
    
    metadata:
      name: "需求单元拆解"
      stage_id: "3.1"
      description: >
        将问题空间拆解为可讨论的需求单元。
        输出结构化需求清单供人类讨论。
    
    input:
      - source: problem_translation
        required: true
    
    output:
      contract: contracts/requirement-breakdown/v1/schema.json
      freeze: false
    
    non_goals:
      - 优先级判定
      - 可行性评估
    
    thinking_boundary: |
      ✅ 可以思考：需求如何结构化、需求单元边界、讨论点
      ❌ 禁止思考：哪个需求更重要、这个需求能不能实现

  # Stage 4: 需求评审
  - id: requirement_review
    stage: requirement_review
    agent: agent.review.requirement_reviewer
    
    metadata:
      name: "需求价值对齐评审"
      stage_id: "4.1"
      description: >
        验证需求单元与价值冻结的对齐度。
        总结讨论点供人类确认。
    
    input:
      - source: product_value_freeze
        required: true
      - source: requirement_decomposition
        required: true
    
    output:
      contract: contracts/requirement-review/v1/schema.json
      freeze: false
    
    non_goals:
      - 添加新需求
      - 重新设计价值目标

  # Stage 4-Freeze: 需求冻结
  - id: requirement_freeze
    stage: requirement_review
    agent: agent.governance.approval_reviewer
    
    metadata:
      name: "需求冻结"
      stage_id: "4.1-freeze"
      description: "人类确认需求与价值目标对齐"
    
    input:
      - source: requirement_review
        required: true
    
    output:
      contract: contracts/requirement-freeze/v1/schema.json
      freeze: true
    
    human_role:
      type: validation
      actions:
        - confirm_alignment: "确认需求对齐，提交给研发"
        - flag_misalignment: "返回修正"
    
    handoff_to:
      agent: agent.dev.freeze_orchestrator
      required_files:
        - contracts/product-value-freeze/v1
        - contracts/requirement-freeze/v1

# ============================================
# 流水线约束
# ============================================
constraints:
  serial_execution: |
    所有 Agent 必须串行执行，通过 Contract 传递数据。
    禁止跳过任何步骤。
  
  freeze_immutability: |
    冻结文件一旦生成，下游步骤必须基于冻结版本工作。
    修改上游冻结需要：解冻 → 修改 → 重新冻结 → 重跑下游。
  
  human_freeze_points: |
    两个人类冻结点是硬性要求：
    1. product_value_freeze - 确认做什么产品
    2. requirement_freeze - 确认需要什么功能
    
    Agent 不能替代人类做出冻结决策。

# ============================================
# 完成条件
# ============================================
completion:
  required_outputs:
    - contracts/product-value-freeze/v1
    - contracts/requirement-freeze/v1
  
  final_handoff:
    to: agent.dev.freeze_orchestrator
    with:
      - product_value_freeze
      - requirement_freeze
    description: >
      两个冻结文件交给研发冻结编排器，
      进入 PRD编写、技术架构、UI设计 的并行阶段。
