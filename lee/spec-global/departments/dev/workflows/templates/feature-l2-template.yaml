kind: l2_workflow_template
version: "1.0"
id: template.dev.feature_l2
name: Feature Development L2 Template
description: |
  L2 template for feature development with 5 phases and complexity-aware execution.

  This template defines the structure for department-level feature workflows.
  Each phase can have its complexity set to S/M/L to determine execution strategy:
  - S (Simple): Direct execution of phase steps
  - M (Medium): Spawn single L3 task instance
  - L (Large): PMA split into multiple L3 task instances

  P1: Phases support depends_on for parallel execution when possible.

# Phase definitions - structural elements that cannot be omitted
phases:
  - id: plan
    name: "Planning Phase"
    description: "Requirements analysis and technical planning"
    default_complexity: M  # Can be overridden in instance
    depends_on: []  # No dependencies, can start immediately

  - id: api_align
    name: "API Alignment Phase"
    description: "Contract design and API specification"
    default_complexity: M
    depends_on: ["plan"]  # Requires plan to complete

  - id: frontend_dev
    name: "Frontend Development Phase"
    description: "UI implementation and user interaction"
    default_complexity: M
    depends_on: ["api_align"]  # Requires API alignment

  - id: backend_dev
    name: "Backend Development Phase"
    description: "Service implementation and business logic"
    default_complexity: M
    depends_on: ["api_align"]  # Requires API alignment, can run parallel with frontend_dev

  - id: integration
    name: "Integration Phase"
    description: "Frontend-backend integration testing"
    default_complexity: S  # Usually straightforward
    depends_on: ["frontend_dev", "backend_dev"]  # Requires both to complete

# Execution strategy by complexity
execution_strategies:
  S:
    description: "Direct execution - run phase steps inline"
    spawns_l3: false
  M:
    description: "Single task - spawn one L3 instance for entire phase"
    spawns_l3: true
    default_l3_count: 1
  L:
    description: "PMA split - use PM Agent to split phase into multiple L3 instances"
    spawns_l3: true
    uses_pma: true
    default_l3_count: 2-5

# Parallel execution configuration
parallel_execution:
  enabled: true
  allow_frontend_backend_parallel: true  # frontend_dev and backend_dev can run in parallel

# Instance schema (for validation)
instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
    - context
    - phases
  context_fields:
    - project
    - module
    - module_version
    - prd_path
    - repos
  phase_fields:
    - id
    - complexity
    - status
    - l3_instance_ids
    - depends_on  # P1: Phase dependencies
  phase_optional_fields:
    - parallel_allowed  # Allow parallel execution with other phases
