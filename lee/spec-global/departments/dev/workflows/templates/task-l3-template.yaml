kind: l3_workflow_template
version: "1.0"
id: template.dev.task_l3
name: Task Execution L3 Template
description: |
  L3 template for single-point development tasks.

  This template defines the standard 6-step workflow for implementing
  individual feature points. Each step follows the standard OpenSpec flow.

# Standard 6-step L3 process
steps:
  - id: align_requirement
    name: "Align Requirement"
    kind: agent
    description: "Align with PRD and define acceptance criteria"
    mandatory: true
    depends_on: []

  - id: design_tests
    name: "Design Tests"
    kind: agent
    description: "Design test cases and verification approach"
    mandatory: true
    depends_on: [align_requirement]

  - id: implement
    name: "Implement"
    kind: agent
    description: "Implement the feature point"
    mandatory: true
    depends_on: [design_tests]

  - id: run_tests
    name: "Run Tests"
    kind: skill
    description: "Execute tests and verify results"
    mandatory: true
    depends_on: [implement]

  - id: code_review
    name: "Code Review"
    kind: agent
    description: "Review code for quality and compliance"
    mandatory: true
    depends_on: [run_tests]

  - id: retrospective
    name: "Retrospective"
    kind: agent
    description: "Document lessons learned and TODOs"
    mandatory: true
    depends_on: [code_review]

# Default execution order
execution_order:
  - align_requirement
  - design_tests
  - implement
  - run_tests
  - code_review
  - retrospective

# Instance schema
instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
    - point_id
    - parent_l2_id
    - parent_phase_id
    - repo_id
  point_fields:
    - id
    - title
    - desc
    - layer
    - estimated_complexity
    - files_hint
    - depends_on
