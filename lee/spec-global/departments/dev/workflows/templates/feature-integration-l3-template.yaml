# Feature Integration Testing L3 Template
# 连调验证子流程（L3）
#
# L2 调用方: template.dev.feature (Phase 3: integration)
# 职责: 验证前后端数据贯通

kind: l3_workflow_template
version: "1.0"
id: template.dev.feature_integration_l3
name: Feature Integration Testing L3 Template
description: |
  L3 template for integration testing and verification.

  This template defines the workflow for verifying that frontend
  and backend implementations work together correctly.

  Key Design:
  - Stage 1: Plan integration tests
  - Stage 2: Execute integration tests
  - Stage 3: Analyze results and detect structural issues
  - Stage 4: Generate report

owner: development
tags: [template, dev, feature, integration, l3, contract-first]

# L3 process stages
stages:
  - id: test_planning
    name: "Integration Test Planning"
    kind: agent
    description: "Plan integration test scenarios"
    agent_id: agent.dev.integration_planner
    mandatory: true
    depends_on: []
    outputs:
      - test_plan
      - test_scenarios

  - id: test_execution
    name: "Integration Test Execution"
    kind: agent
    description: "Execute integration tests"
    agent_id: agent.dev.bug_fix_verifier
    mandatory: true
    depends_on: [test_planning]
    outputs:
      - test_results
      - failure_logs

  - id: result_analysis
    name: "Result Analysis"
    kind: agent
    description: "Analyze test results and detect structural issues"
    agent_id: agent.dev.bug_fix_verifier
    mandatory: true
    depends_on: [test_execution]
    outputs:
      - analysis_report
      - structural_issues  # List of contract-related issues

  - id: report_generation
    name: "Report Generation"
    kind: skill
    description: "Generate integration test report"
    skill_id: skill.report.generate
    mandatory: true
    depends_on: [result_analysis]
    outputs:
      - report_path

# Structural issue detection
structural_issue_detection:
  description: "Detect issues that require contract rollback"

  rollback_triggers:
    - issue: "api_endpoint_not_found"
      description: "Frontend calls undefined endpoint"
      action: "rollback_to_contract_design"

    - issue: "response_schema_mismatch"
      description: "Response structure doesn't match contract"
      action: "rollback_to_contract_design"

    - issue: "field_type_mismatch"
      description: "Field type incompatible between FE/BE"
      action: "rollback_to_contract_design"

    - issue: "missing_required_field"
      description: "Required field not returned by backend"
      action: "rollback_to_contract_design"

  non_rollback_issues:
    - issue: "implementation_bug"
      description: "Logic bug not related to contract"
      action: "fix_in_implementation"

    - issue: "environment_issue"
      description: "Test environment problem"
      action: "retry_test"

# Instance schema
instance_schema:
  required_fields:
    - id
    - template_id
    - name
    - status
    - phase_id  # Parent L2 phase: integration
  context_fields:
    - api_contract
    - feature_spec
    - fe_artifact  # Code diff from frontend
    - be_artifact  # Code diff from backend
    - feature_point_id
  output_fields:
    - report_path
    - test_status
    - structural_issues
    - rollback_request
