# Feature Development L2 Workflow v3
# 特性开发 L2 工作流 v3 — 支持 L3 子流程派发
#
# v3 新特性:
# - kind: l2_workflow_instance 标识 L2 实例
# - complexity: 每个阶段支持 S/M/L 复杂度配置
# - complexity=M 时支持 spawn L3 子工作流（6 步流程）

kind: l2_workflow_instance
version: "3.0"

# ============================================
# Dev 部门宪法引用 (强制)
# ============================================
constitution:
  ref: ../AGENTS.md
  version: "1.0"
  mandatory: true

id: workflow.dev.feature_l2_v3
name: Feature Development Workflow (L2) — v3 with L3 Spawning
description: >
  L2 特性开发工作流 v3：
  - 支持 complexity=S/M/L 配置
  - complexity=M 时 spawn 单个 L3 子工作流（6 步 TDD 流程）
  - complexity=L 时使用 PMA 拆分后 spawn 多个 L3
  - 支持阶段依赖和并行执行
owner: development
tags: [workflow, dev, feature, l2, l3, v3]

roles:
  agents:
    - agent.dev.uniapp_frontend_engineer
    - agent.dev.go_backend_engineer
    - agent.dev.code_self_reviewer
    - agent.pm.planning  # PMA for L complexity
  skills:
    - skill.git.checkout
    - skill.lint.ruff
    - skill.test.vitest
  gates: []

contracts:
  inputs:
    - frozen_dev_package:
        path: ../../contracts/frozen-dev-package-contract/v1/schema.json
        description: |
          研发冻结包 (Frozen Dev Package) - L2 工作流的标准输入
          包含：
          - prd_ref: 冻结 PRD 参考
          - tech_ref: 冻结技术架构参考
          - ui_ref: 冻结 UI 原型参考
          - scheduling_validation: 5 问调度验证（非目标、简化点、不确定性、UI 优先级、砍序）
        validation:
          enabled: true
          on_failure: block  # 验证失败时阻塞工作流启动
          schema_validation:
            - field: contract_type
              required: true
              allowed_values: ["frozen-dev-package"]
            - field: contract_version
              required: true
              pattern: "^\\d+\\.\\d+$"
            - field: metadata.package_id
              required: true
              pattern: "^FPKG-\\d{8}-\\d{3}$"
            - field: metadata.total_confidence_score
              required: true
              type: number
              range: [0, 100]
            - field: package_content.prd_ref
              required: true
              check: file_exists
            - field: package_content.tech_ref
              required: true
              check: file_exists
            - field: package_content.ui_ref
              required: true
              check: file_exists
            - field: scheduling_validation
              required: true
              fields:
                - q1_non_goals
                - q2_simplification
                - q3_uncertainties
                - q4_ui_priority
                - q5_cut_sequence
  outputs:
    - l2_outputs:
        path: ../../contracts/l2-outputs/v1/schema.json
        description: L2 各阶段输出汇总
        validation:
          enabled: true
          on_failure: warn  # 输出验证失败仅警告，不阻塞
          required_artifacts:
            - output/api-contract.yaml
            - output/fe-l3-output.json
            - output/be-code-diff.patch
            - output/integration-test-report.json
            - output/smoke-test-report.json

# ============================================
# L2 阶段定义 (支持 complexity 配置)
# ============================================
phases:
  # ========== Phase 1: 契约设计 ==========
  - id: p1_contract_design
    name: "契约设计阶段"
    description: "API 契约设计与评审（基于研发冻结包的 tech_ref 和 ui_ref）"
    default_complexity: M
    complexity: M  # 可在实例中覆盖
    depends_on: []
    spawns_l3: false  # S/M 复杂度直接执行，不 spawn L3
    steps:
      - id: p1_1_api_design
        name: "API 契约设计"
        type: agent
        run: agent.dev.go_backend_engineer
        inputs:
          - tech_ref: "$inputs.frozen_dev_package.package_content.tech_ref"
          - ui_ref: "$inputs.frozen_dev_package.package_content.ui_ref"
          - prd_ref: "$inputs.frozen_dev_package.package_content.prd_ref"
        outputs:
          - path: "output/api-contract.yaml"

  # ========== Phase 2: 并行开发 (Frontend + Backend) ==========
  - id: p2_parallel_development
    name: "并行开发阶段"
    description: "前后端并行开发，支持 L3 子流程派发"
    default_complexity: M
    depends_on: ["p1_contract_design"]
    parallel_phases:
      # ----- Frontend Development -----
      - id: p2_1_fe_development
        name: "前端开发"
        description: "前端实现（支持 L3 子流程）"
        default_complexity: M
        complexity: M  # M = spawn 单个 L3
        depends_on: ["p1_contract_design"]
        spawns_l3: true
        l3_template: "template.dev.task_l3_v3"  # 引用 L3 v3 模板
        steps:
          - id: p2_1_fe_spawn_l3
            name: "Spawn Frontend L3 Workflow"
            description: "派发前端 L3 子工作流（6 步流程）"
            type: spawn_l3
            l3_template_ref: "template.dev.task_l3_v3"
            inputs:
              - frozen_dev_package: "$inputs.frozen_dev_package"
              - phase_id: "p2_1_fe_development"
            outputs:
              - path: "output/fe-l3-output.json"

      # ----- Backend Development -----
      - id: p2_2_be_development
        name: "后端开发"
        description: "后端实现"
        default_complexity: M
        complexity: M
        depends_on: ["p1_contract_design"]
        spawns_l3: false  # 后端暂不支持 L3
        steps:
          - id: p2_2_be_impl
            name: "后端实现"
            type: agent
            run: agent.dev.go_backend_engineer
            inputs:
              - tech_ref: "$inputs.frozen_dev_package.package_content.tech_ref"
              - api_contract: "output/api-contract.yaml"
            outputs:
              - path: "output/be-code-diff.patch"

  # ========== Phase 3: 集成测试 ==========
  - id: p3_integration
    name: "集成测试阶段"
    description: "前后端联调与集成测试"
    default_complexity: S
    complexity: S
    depends_on: ["p2_1_fe_development", "p2_2_be_development"]
    spawns_l3: false
    steps:
      - id: p3_1_integration_test
        name: "集成测试"
        type: agent
        run: agent.dev.uniapp_frontend_engineer
        inputs:
          - fe_output: "output/fe-l3-output.json"
          - be_output: "output/be-code-diff.patch"
        outputs:
          - path: "output/integration-test-report.json"

  # ========== Phase 4: 冒烟测试 ==========
  - id: p4_smoke
    name: "冒烟测试阶段"
    description: "端到端冒烟测试"
    default_complexity: S
    complexity: S
    depends_on: ["p3_integration"]
    spawns_l3: false
    steps:
      - id: p4_1_smoke_test
        name: "冒烟测试"
        type: agent
        run: agent.dev.uniapp_frontend_engineer
        inputs:
          - integration_report: "output/integration-test-report.json"
        outputs:
          - path: "output/smoke-test-report.json"

# ============================================
# L3 子流程配置
# ============================================
l3_config:
  # L3 v3 模板引用
  templates:
    frontend:
      template_id: "template.dev.task_l3_v3"
      name: "Frontend Task L3 v3"
      description: "前端任务 L3 v3（6 步 TDD 流程）"
      steps:
        - id: align_requirement
          name: "对齐需求"
          kind: agent
          description: "分析 Feature Spec，明确功能点与验收标准"
          mandatory: true
          depends_on: []
        - id: design_tests
          name: "设计测试"
          kind: agent
          description: "根据功能点设计测试用例（测试先行）"
          mandatory: true
          depends_on: ["align_requirement"]
        - id: implement
          name: "实现"
          kind: agent
          description: "编写实现代码使测试通过"
          mandatory: true
          depends_on: ["design_tests"]
        - id: run_tests
          name: "测试"
          kind: skill
          description: "运行单元测试，确认所有测试通过"
          mandatory: true
          depends_on: ["implement"]
        - id: code_review
          name: "Review"
          kind: agent
          description: "代码自检与评审"
          mandatory: true
          depends_on: ["run_tests"]
        - id: retrospective
          name: "复盘"
          kind: agent
          description: "任务复盘与总结"
          mandatory: false
          depends_on: ["code_review"]

# ============================================
# 执行策略配置
# ============================================
execution_strategies:
  S:
    description: "Simple: 直接执行阶段步骤"
    spawns_l3: false
  M:
    description: "Medium: spawn 单个 L3 子工作流"
    spawns_l3: true
    default_l3_count: 1
  L:
    description: "Large: PMA 拆分后 spawn 多个 L3"
    spawns_l3: true
    uses_pma: true
    default_l3_count: "2-5"

# ============================================
# 并行执行配置
# ============================================
parallel_execution:
  enabled: true
  allow_frontend_backend_parallel: true

# ============================================
# 元数据
# ============================================
metadata:
  created_by: "dev-workflow-architect"
  created_at: "2026-02-24"
  version: "3.0"
  last_updated: "2026-02-24"

  changelog:
    - version: "3.0"
      date: "2026-02-24"
      changes:
        - "新增 kind: l2_workflow_instance 标识"
        - "每个阶段支持 complexity=S/M/L 配置"
        - "complexity=M 时支持 spawn 单个 L3 子工作流"
        - "L3 v3 模板：6 步 TDD 流程（对齐需求→设计测试→实现→测试→review→复盘）"
        - "支持阶段依赖 depends_on 和并行执行"
        - "预留 complexity=L 的 PMA 拆分能力"
    - version: "2.0"
      date: "2026-02-12"
      changes:
        - "L2 v2: 4 阶段流程（契约设计→并行开发→集成测试→冒烟测试）"
