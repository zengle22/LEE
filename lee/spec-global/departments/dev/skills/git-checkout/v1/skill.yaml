# Git Checkout Skill v1.0

kind: skill
version: 1.0

id: skill.git.checkout
name: Git Checkout
description: >
  切换/创建目标分支。
owner: dev-team
tags: [git, dev]

interface:
  inputs:
    type: object
    required: [branch]
    properties:
      branch:
        type: string
        description: "目标分支名称"
      create:
        type: boolean
        description: "是否创建新分支 (-b)"
        default: false
      base:
        type: string
        description: "新分支的基准点 (commit/branch)"
        default: ""
  outputs:
    type: object
    properties:
      exit_code:
        type: integer
      current_branch:
        type: string

runtime:
  type: cli
  command: "git"
  args_template: >
    checkout
    {% if inputs.create %}-b{% endif %}
    {{ inputs.branch }}
    {% if inputs.base %}{{ inputs.base }}{% endif %}
  exit_codes:
    0: "切换成功"
    1: "分支不存在或冲突"

constraints:
  - must_pass: "exit_code == 0"
    on_fail: "分支切换失败，检查分支名和工作区状态"
