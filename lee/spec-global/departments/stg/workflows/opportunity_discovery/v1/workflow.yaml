# Opportunity Discovery Workflow v1.1
# 商业机会发现工作流 - 策略部门主流程

kind: workflow
id: workflow.stg.opportunity_discovery
name: 商业机会发现工作流
version: "1.1"

description: >
  这是一个"可冻结、可复盘"的商业机会发现流水线。
  从市场信号采集到商业机会冻结，完整的 6 层流程。

  核心思想：
  - 分析必须在 freeze 层收敛
  - 机会构建后必须经过 human gate 冻结
  - 输出"商业机会冻结包"作为下游 L2 流程的输入

# ============================================
# 角色地图（Role Map）
# ============================================
# 参见 core/constitution.yaml → execution_taxonomy
roles:
  agents:
    - agent.stg.search_signal_collector       # LLM：搜索信号采集
    - agent.stg.user_signal_analyst           # LLM：用户信号分析
    - agent.stg.industry_structure_analyst    # LLM：行业结构分析
    - agent.stg.supply_competition_analyst    # LLM：供给竞争分析
    - agent.stg.business_opportunity_builder  # LLM：商业机会构建
  skills: []
  gates:
    - gate.stg.market_signal_freeze           # 人类：市场信号冻结
    - gate.stg.business_opportunity_freeze    # 人类：商业机会冻结

# ============================================
# 工作流步骤
# ============================================
steps:
  # ============================================
  # Step 1: 搜索采集（事实采集层）
  # ============================================
  - id: search_signals
    name: 搜索采集
    kind: agent
    agent: agent.stg.search_signal_collector
    description: |
      采集市场搜索信号，获取显性发生的市场数据。

      输出：
      - 关键词列表
      - 搜索趋势
      - 量级范围
      - 地理分布
      - 原始数据链接

      不做：
      - 用户分析
      - 价值判断
      - 趋势预测

    inputs: []
    outputs:
      - path: contracts/search_signals/v1/signals.yaml
        required: true
        description: 搜索信号数据

  # ============================================
  # Step 2: 用户信号分析（分析层）
  # ============================================
  - id: analyze_user_signals
    name: 用户信号分析
    kind: agent
    agent: agent.stg.user_signal_analyst
    depends_on:
      - search_signals
    description: |
      分析搜索关键词，回答"搜这个词的人在试图解决什么问题"。

      输出：
      - 用户类型推断
      - 触发场景
      - 核心痛点
      - 紧迫程度
      - 搜索意图类型

      约束：
      - 只基于关键词+常识+公开资料
      - 禁止发明用户故事
      - 必须标注推断置信度

    inputs:
      - from_step: search_signals
        contract: contracts/search_signals/v1/signals.yaml
    outputs:
      - path: contracts/user_hypothesis/v1/hypothesis.yaml
        required: true
        description: 用户假设分析

  # ============================================
  # Step 3: 行业结构分析（分析层）
  # ============================================
  - id: analyze_industry_structure
    name: 行业结构分析
    kind: agent
    agent: agent.stg.industry_structure_analyst
    depends_on:
      - search_signals
    description: |
      评估行业结构是否允许新机会出现。

      输出：
      - 行业成熟阶段
      - 技术依赖评估
      - 进入壁垒分析
      - 结构性空缺识别

      约束：
      - 基于公开行业报告
      - 不判断具体机会
      - 不推荐进入策略

    inputs:
      - from_step: search_signals
        contract: contracts/search_signals/v1/signals.yaml
    outputs:
      - path: contracts/industry_structure/v1/structure.yaml
        required: true
        description: 行业结构分析

  # ============================================
  # Step 4: 供给竞争分析（分析层）
  # ============================================
  - id: analyze_supply_competition
    name: 供给竞争分析
    kind: agent
    agent: agent.stg.supply_competition_analyst
    depends_on:
      - search_signals
    description: |
      分析已有解决方案，回答"已有方案哪里不够好"。

      输出：
      - 现有解决方案分类
      - 已知局限性
      - 解决方案空缺

      约束：
      - 基于公开产品信息
      - 不推荐具体策略
      - 不判断机会价值

    inputs:
      - from_step: search_signals
        contract: contracts/search_signals/v1/signals.yaml
    outputs:
      - path: contracts/supply_gap/v1/gap.yaml
        required: true
        description: 供给空缺分析

  # ============================================
  # Step 5: 市场信号冻结（冻结层）
  # ============================================
  - id: freeze_market_signals
    name: 市场信号冻结
    kind: human_gate
    description: |
      这是系统稳定性的根！

      冻结分析层的所有结论，确保：
      - 后续 agent 只能引用，不可推翻
      - 版本化所有假设
      - 设置重新打开条件

      需要人工或规则审核：
      - 三个分析层输出是否一致？
      - 置信度是否达标（≥50）？
      - 假设是否可验证？

    depends_on:
      - analyze_user_signals
      - analyze_industry_structure
      - analyze_supply_competition

    inputs:
      - from_step: analyze_user_signals
        contract: contracts/user_hypothesis/v1/hypothesis.yaml
      - from_step: analyze_industry_structure
        contract: contracts/industry_structure/v1/structure.yaml
      - from_step: analyze_supply_competition
        contract: contracts/supply_gap/v1/gap.yaml

    outputs:
      - path: contracts/market_signal_freeze/v1/freeze.yaml
        required: true
        description: 冻结的市场信号

    gate_rules:
      reviewers:
        - role: stg_lead
          description: "策略部门负责人"

      approval_criteria:
        - label: "分析一致性"
          criteria: "三个分析层输出无明显矛盾"
          required: true

        - label: "置信度达标"
          criteria: "综合置信度 ≥ 50"
          required: true

        - label: "可验证性"
          criteria: "核心假设可以通过后续验证"
          required: true

      rejection_criteria:
        - "分析层输出存在重大矛盾"
        - "置信度过低（<30）"
        - "假设过于宽泛，无法验证"

  # ============================================
  # Step 6: 商业机会构建（机会构建层）
  # ============================================
  - id: build_business_opportunity
    name: 商业机会构建
    kind: agent
    agent: agent.stg.business_opportunity_builder
    depends_on:
      - freeze_market_signals
    description: |
      基于冻结的市场信号，构建可验证的商业机会假设。

      这是唯一做"价值判断"的地方，但必须对产品部门负责。

      输出：
      - 一句话机会定义
      - 目标用户和场景
      - Why Now 理由
      - 差异化假设
      - Reasons NOT to Do（必须诚实）
      - 产品验证建议

      约束：
      - 只能引用 freeze 内容
      - 必须包含风险
      - 不设计具体功能

    inputs:
      - from_step: freeze_market_signals
        contract: contracts/market_signal_freeze/v1/freeze.yaml

    outputs:
      - path: contracts/business_opportunity/v1/opportunity.yaml
        required: true
        description: 商业机会假设

  # ============================================
  # Step 7: 商业机会冻结（冻结层）
  # ============================================
  - id: freeze_business_opportunity
    name: 商业机会冻结
    kind: human_gate
    description: |
      这是商业机会的最终冻结点！

      冻结商业机会构建的所有结论，确保：
      - 机会假设完整且可验证
      - 风险已充分识别
      - Reasons NOT to Do 已诚实列出
      - 可以作为下游 L2 流程的可靠输入

      需要人工审核：
      - 机会价值是否足够？
      - 时机是否合适（Why Now）？
      - 风险是否可接受？
      - 验证路径是否清晰？

    depends_on:
      - build_business_opportunity

    inputs:
      - from_step: build_business_opportunity
        contract: contracts/business_opportunity/v1/opportunity.yaml
      - from_step: freeze_market_signals
        contract: contracts/market_signal_freeze/v1/freeze.yaml

    outputs:
      - path: contracts/business_opportunity_freeze/v1/freeze.yaml
        required: true
        description: 商业机会冻结包

    gate_rules:
      reviewers:
        - role: stg_lead
          description: "策略部门负责人"
        - role: product_lead
          description: "产品部门负责人（共同审核）"

      approval_criteria:
        - label: "机会价值"
          criteria: "一句话机会定义清晰、目标用户明确"
          required: true

        - label: "时机合适"
          criteria: "Why Now 理由充分、市场时机成熟"
          required: true

        - label: "风险识别"
          criteria: "Reasons NOT to Do 至少 3 条、风险可接受"
          required: true

        - label: "可验证性"
          criteria: "验证路径清晰、假设可测试"
          required: true

      rejection_criteria:
        - "机会定义模糊、目标用户不明确"
        - "时机不成熟、缺乏 Why Now 理由"
        - "风险未充分识别、 Reasons NOT to Do 不够诚实"
        - "验证路径不清晰、假设不可测试"

# ============================================
# 工作流配置
# ============================================
config:
  max_parallel_steps: 3  # 分析层可以并行
  timeout:
    search_signals: 3600       # 1 hour
    analyze_user_signals: 1800 # 30 min
    analyze_industry_structure: 1800
    analyze_supply_competition: 1800
    freeze_market_signals: 86400  # 24 hours (human review)
    build_business_opportunity: 1800
    freeze_business_opportunity: 86400  # 24 hours (human review with product lead)

# ============================================
# 质量门控
# ============================================
quality_gates:
  - name: "分析层完整性检查"
    at_step: freeze_market_signals
    checks:
      - type: "required_outputs"
        required: [user_hypothesis, industry_structure, supply_gap]

      - type: "consistency_check"
        description: "三个分析层输出必须一致"

  - name: "机会假设完整性"
    at_step: build_business_opportunity
    checks:
      - type: "required_fields"
        required: [one_liner, target_user, why_now, reasons_not_to_do]

      - type: "risk_honesty"
        description: "Reasons NOT to Do 必须至少 3 条"

  - name: "商业机会冻结完整性"
    at_step: freeze_business_opportunity
    checks:
      - type: "required_fields"
        required: [one_liner, target_user, why_now, differentiation, reasons_not_to_do, validation_path]

      - type: "freeze_package_complete"
        description: "商业机会冻结包包含所有必需字段"

# ============================================
# 输出产物清单
# ============================================
artifacts:
  - name: "搜索信号数据"
    path: contracts/search_signals/v1/signals.yaml
    description: "原始市场搜索数据"

  - name: "用户假设"
    path: contracts/user_hypothesis/v1/hypothesis.yaml
    description: "用户类型和意图推断"

  - name: "行业结构分析"
    path: contracts/industry_structure/v1/structure.yaml
    description: "行业成熟度和壁垒分析"

  - name: "供给空缺分析"
    path: contracts/supply_gap/v1/gap.yaml
    description: "现有方案和空缺"

  - name: "市场信号冻结"
    path: contracts/market_signal_freeze/v1/freeze.yaml
    description: "冻结层 - 系统稳定性根"

  - name: "商业机会假设"
    path: contracts/business_opportunity/v1/opportunity.yaml
    description: "可验证的机会假设"

  - name: "商业机会冻结包"
    path: contracts/business_opportunity_freeze/v1/freeze.yaml
    description: "商业机会冻结包 - 下游 L2 流程的输入"

# ============================================
# 重启和恢复策略
# ============================================
recovery:
  # 如果分析层输出矛盾
  analysis_conflict:
    action: "回退到搜索采集，重新定义搜索范围"

  # 如果置信度不达标
  low_confidence:
    action: "扩大搜索范围或延长时间窗口，重新采集"

  # 如果商业机会 Gate 被拒绝
  opportunity_rejection:
    action: "记录拒绝原因，更新市场信号冻结，重新构建机会"

