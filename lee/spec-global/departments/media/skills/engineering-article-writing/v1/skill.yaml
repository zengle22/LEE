# Engineering Article Writing Skill Specification v1.0
# 工程文章写作技能规范

kind: skill
version: 1.0

# ============================================
# 基础标识
# ============================================
id: skill.media.engineering_article_writing
name: Engineering Article Writing
name_zh: 工程文章写作
description: >
  使用结构化 Prompt 模板创作工程类公众号文章。
  当用户要求写工程类技术文章、公众号文章、
  AI 治理文章、Agent 工程文章时调用此技能。
owner: media-ai
tags: [media, writing, article, engineering, content, wechat]

# ============================================
# 接口定义
# ============================================
interface:
  inputs:
    type: object
    required: [topic, core_viewpoint, real_scenario, core_components]
    properties:
      topic:
        type: string
        description: "文章主题/标题"
        example: "为什么 Spec 不能解决治理问题？"

      core_viewpoint:
        type: string
        description: "核心观点（一句话概括）"
        example: "Spec 是边界描述，不是执行约束。"

      real_scenario:
        type: string
        description: "真实场景或案例描述"
        example: "Agent 按 Spec 输出，但运行仍然出错。"

      core_components:
        type: string
        description: "核心结构组件（3-4个，用逗号分隔）"
        example: "输入契约、输出契约、运行验证、证据系统"

      include_mermaid:
        type: boolean
        default: false
        description: "是否在文中插入 Mermaid 流程图"

      max_length:
        type: integer
        default: 2500
        description: "最大字数限制"

  outputs:
    type: object
    required: [article_content, word_count, golden_quotes]
    properties:
      article_content:
        type: string
        description: "生成的公众号文章内容（Markdown 格式）"

      word_count:
        type: integer
        description: "文章实际字数"

      structure_sections:
        type: array
        description: "文章结构章节列表"
        items:
          type: string
        example: ["痛点刺入", "具体场景还原", "结构断层解释", "核心组件拆解", "趋势判断", "写给谁", "收束金句"]

      golden_quotes:
        type: array
        description: "提取的可截图金句列表"
        items:
          type: string

      quality_check:
        type: object
        description: "质量检查结果"
        properties:
          passed:
            type: boolean
          issues:
            type: array
            items:
              type: string

# ============================================
# Prompt 模板
# ============================================
prompt_template: |
  你现在是一个"结构主义 AI 工程作者"。

  请根据以下信息，写一篇适合公众号发布的文章。

  【主题】
  {{topic}}

  【核心观点】
  {{core_viewpoint}}

  【真实场景或案例】
  {{real_scenario}}

  【核心结构组件（3-4个）】
  {{core_components}}

  写作要求：

  一、整体风格

  - 理性、克制、冷静
  - 不浮夸，不鸡汤
  - 不堆术语
  - 不空泛总结
  - 保留工程质感
  - 多使用短段落（每段不超过4行）
  - 多换行
  - 至少包含3个"断句式金句"（两行式）

  二、结构必须严格遵循以下顺序：

  ① 痛点刺入（100-200字）

  用"你有没有遇到过……"开场。
  制造真实共鸣。
  不要讲理论。

  ② 具体场景还原

  用流程、CLI、日志、文件、状态等具体画面展开。
  必须具体。
  不能抽象。

  ③ 结构断层解释

  上升到一层理论。
  用类似句式：
  "问题不在模型能力。问题在结构。"
  解释语义空间 vs 状态空间等概念。

  ④ 核心组件拆解（3-4点）

  每一点结构如下：

  ## 1️⃣ 组件名

  解释其作用
  举一个工程化例子
  给一句可截图金句

  ⑤ 上升到趋势判断

  对模型能力提升、风险放大等趋势做冷静判断。

  ⑥ 写给谁

  分两段：

  写给工程师：
  ……

  写给创业者：
  ……

  ⑦ 收束金句

  最后用两行式金句结束。

  三、排版规则

  - 多空行
  - 小标题清晰
  - 不超过{{max_length}}字
  - 不写"总结如下"之类套话
  - 不用营销语气
  - 不用"震撼""颠覆"等词

  四、风格定位

  这是一个长期写 AI 治理与 Agent 工程的人写的文章。
  读者是工程师和创业者。
  目标是提升结构认知，而不是博眼球。

  {{mermaid_instruction}}

  请开始写作。

  写完后，请：
  1. 列出文章的结构章节
  2. 提取3-5个可截图的金句

# ============================================
# Mermaid 插入指令
# ============================================
mermaid_instructions:
  enabled: |
    在文中合适位置插入一个 Mermaid 流程图，用于展示核心组件之间的关系。
    例如：
    ```mermaid
    graph LR
      A[输入] --> B[验证]
      B --> C[执行]
      C --> D[输出]
      D --> E[证据]
    ```

  disabled: ""

# ============================================
# 质量检查规则
# ============================================
quality_rules:
  must_pass:
    - name: "结构完整性"
      check: "必须包含七步结构：痛点→场景→理论→组件→趋势→读者→收束"
    - name: "段落长度"
      check: "每段不超过4行"
    - name: "金句数量"
      check: "至少3个断句式金句"
    - name: "字数限制"
      check: "不超过指定字数"
    - name: "语气检查"
      check: "不使用营销语气词汇"

  prohibited_words:
    - "震撼"
    - "颠覆"
    - "革命"
    - "史诗级"
    - "最强"
    - "秒杀"
    - "一文读懂"
    - "总结如下"
    - "惊呆"
    - "炸裂"
    - "必看"

# ============================================
# 使用场景
# ============================================
use_cases:
  - scenario: "写 AI 治理类公众号文章"
    example:
      topic: "为什么 Spec 不能解决治理问题？"
      core_viewpoint: "Spec 是边界描述，不是执行约束。"
      real_scenario: "Agent 按 Spec 输出，但运行仍然出错。"
      core_components: "输入契约、输出契约、运行验证、证据系统"

  - scenario: "写 Agent 工程类文章"
    example:
      topic: "Agent 的能力边界在哪里？"
      core_viewpoint: "Agent 的能力边界不在模型大小，而在状态追踪能力。"
      real_scenario: "同一个 Agent 任务，第一次跑失败，第二次用同样输入却成功了。"
      core_components: "状态空间、语义空间、执行轨迹、置信度校准"

  - scenario: "写 DevOps 结构类文章"
    example:
      topic: "为什么你的 CI/CD 流程仍然会出问题？"
      core_viewpoint: "流程自动化的前提是流程本身可验证。"
      real_scenario: "部署脚本跑通了，但线上服务起不来，错误原因是环境变量漏了。"
      core_components: "环境契约、部署原子性、运行时验证、健康检查"

  - scenario: "写系统复盘类文章"
    example:
      topic: "一次线上故障的复盘：问题出在哪里？"
      core_viewpoint: "故障的根本原因往往不是代码 bug，而是状态假设被打破。"
      real_scenario: "凌晨 3 点服务报警，排查发现是缓存过期导致雪崩。"
      core_components: "状态机、熔断机制、限流策略、告警阈值"

# ============================================
# 调用示例
# ============================================
invocation_examples:
  - name: "完整参数调用"
    params:
      topic: "为什么 Spec 不能解决治理问题？"
      core_viewpoint: "Spec 是边界描述，不是执行约束。"
      real_scenario: "Agent 按 Spec 输出，但运行仍然出错。"
      core_components: "输入契约、输出契约、运行验证、证据系统"
      include_mermaid: true

  - name: "不含 Mermaid 调用"
    params:
      topic: "Agent 的能力边界在哪里？"
      core_viewpoint: "Agent 的能力边界不在模型大小，而在状态追踪能力。"
      real_scenario: "同一个 Agent 任务，第一次跑失败，第二次用同样输入却成功了。"
      core_components: "状态空间、语义空间、执行轨迹、置信度校准"
      include_mermaid: false
