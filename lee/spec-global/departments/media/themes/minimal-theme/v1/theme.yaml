# Minimal Theme Configuration v1.0
# 极简主题 - 适合 Notion、纯 Markdown 环境

kind: theme
version: 1.0

id: theme.media.minimal
name: Minimal Theme
name_zh: 极简主题
description: >
  纯 Markdown 格式，不使用任何内联样式。
  适合 Notion、GitHub、纯 Markdown 环境。
owner: media-ai
tags: [minimal, markdown, notion, github]

platform_compatibility:
  wechat: {supported: false, notes: "需要样式，建议使用 red/blue 主题"}
  xhs: {supported: false}
  notion: {supported: true, notes: "最佳选择"}
  feishu: {supported: true}
  generic: {supported: true}
  github: {supported: true, notes: "最佳选择"}

colors:
  # 仅用于文档说明，实际不输出
  primary: "#000000"
  text: "#000000"

styles:
  # 纯 Markdown，不使用样式
  heading:
    h1:
      use_markdown: true
      prefix: "# "

    h2:
      use_markdown: true
      prefix: "## "

    h3:
      use_markdown: true
      prefix: "### "

  highlight_section:
    use_markdown: true
    format: |
      ### {title}

      - {item1}
      - {item2}

  code_block:
    use_markdown: true
    format: "```{language}\n{content}\n```"

  quote_block:
    use_markdown: true
    prefix: "> "

  emphasis_text:
    high:
      use_markdown: true
      format: "**{text}**"

    critical:
      use_markdown: true
      format: "**{text}**"

# Markdown 渲染规则
markdown_rendering:
  # 不使用任何 HTML 标签
  html_tags: forbidden

  # 使用原生 Markdown 语法
  heading: "# "
  bold: "**"
  italic: "*"
  code_inline: "`"
  code_block: "```"
  quote: "> "
  list_bullet: "- "
  list_number: "1. "

  # 引用块使用嵌套列表
  highlight_as_list: true

  # 代码块使用原生语法
  code_with_language: true

usage_recommendations:
  best_for:
    - "Notion"
    - "GitHub README"
    - "纯 Markdown 编辑器"
    - "需要版本控制的内容"

  not_recommended_for:
    - "微信公众号（需要样式）"
    - "小红书（需要视觉冲击）"

  tips:
    - "纯 Markdown 格式，版本友好"
    - "可以在任何 Markdown 编辑器中编辑"
    - "不依赖平台特定的样式支持"
