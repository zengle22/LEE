# WeChat Safe Red Theme v1.0
# 公众号安全 · 红色主题规范
# 目标：醒目、克制、可长期复用
# 原则：不玩花活，不靠 hack，不被公众号吞样式

kind: theme
version: 1.0

# ============================================
# 基础标识
# ============================================
id: theme.media.wechat_red_safe
name: WeChat Safe Red Theme
name_zh: 公众号安全红色主题
description: >
  专为公众号优化的红色主题。
  醒目、克制、可长期复用。
  只用 inline style，只用公众号稳定支持的标签。
owner: media-ai
tags: [wechat, red, safe, inline_only]

# ============================================
# 总体设计原则（不可违反）
# ============================================
design_principles:
  - 只用 inline style
  - 只用公众号稳定支持的标签
  - 红色只承担"结构强调"，不做情绪渲染
  - 任何 Agent 不得新增颜色
  - 样式来自主题，不来自即兴发挥

# ============================================
# 全局颜色 Token（不可扩展）
# ============================================
colors:
  # 红色系
  red_primary: "#ff4d4f"     # 主强调（标题/块边）
  red_dark: "#cf1322"        # 小标题/强调词
  red_bg: "#fff1f0"          # 背景块

  # 文本色（调整为更亮的颜色，确保可读性）
  text_main: "#555555"       # 主要文本（中灰，确保可读）
  text_muted: "#666666"       # 次要文本/引用（中等灰）
  text_deep: "#4a4a4a"        # 重点内容/重要引用（更深，确保对比度）

  # ❗ Verifier：检测是否出现其它 hex 值 → 直接 fail
  strict_color_enforcement: true

# ============================================
# 公众号稳定支持的标签（严格白名单）
# ============================================
html_tags:
  # 标题
  heading: [h1, h2, h3]

  # 文本容器
  text_container: [p, span, strong]

  # 特殊容器
  special_container: [blockquote, pre, code]

  # 列表
  list: [ul, ol, li]

  # 其他
  other: [br]

  # ❌ 禁止的标签
  forbidden:
    - div        # 公众号不稳定
    - section    # 公众号不支持
    - article    # 公众号不支持
    - style      # 会被移除
    - script     # 安全风险
    - link       # 外部资源
    - iframe     # 安全风险
    - table      # 兼容性问题
    - img        # 建议用公众号内置图片功能

# ============================================
# 样式规范（严格按照 v1.0 规范）
# ============================================
styles:
  # H1（文章标题，仅一次）
  heading_h1:
    html: |
      <h1 style="color:{red_primary};font-weight:700;">
    constraints:
      no_background: true
      no_center: true
      max_per_document: 1

  # H2（章节标题）
  heading_h2:
    html: |
      <h2 style="color:{red_dark};font-weight:600;">
    constraints:
      no_background: true
      no_border: false  # 允许边框

  # H3（小节）
  heading_h3:
    html: |
      <h3 style="color:{red_dark};font-weight:600;">
    constraints:
      no_background: true

  # 红色强调块（唯一允许的"块级强调"）
  highlight_block:
    html: |
      <blockquote style="
        background:{red_bg};
        border-left:4px solid {red_primary};
        padding:12px 16px;
        margin:12px 0;
      ">
    must_use: blockquote
    forbidden_features:
      - div              # ❌ 禁止使用 div
      - border_radius    # ❌ 禁止圆角
      - box_shadow      # ❌ 禁止阴影

  # 行内强调（慎用）
  emphasis_inline:
    html: |
      <span style="color:{red_primary};font-weight:600;">
    rules:
      max_per_paragraph: 1    # 一段最多 1 次
      no_full_paragraph_red: true  # 不能整段染红
      no_nesting: true         # 不能嵌套

  # 列表规范
  list:
    html: |
      <ul>
        <li><strong>项目</strong></li>
      </ul>
    rules:
      no_color_on_li: true      # ❌ 不给 li 单独上色
      no_emoji: true            # ❌ 不用 emoji
      use_bold_for_emphasis: true  # ✔ 用粗体承担强调

  # 代码块（完全不染色）
  code_block:
    html: |
      <pre><code>
      代码内容
      </code></pre>
    rules:
      no_highlighting: true     # 不高亮
      no_coloring: true         # 不上色
      no_background: false      # 允许默认背景

  # 引用块（重要结论使用深色确保对比度）
  quote_block:
    html: |
      <blockquote style="color:{text_deep};">
      引用内容
      </blockquote>

# ============================================
# Verifier（验证规则）
# ============================================
verifier:
  # 颜色检查（允许6种颜色，新增深色用于重点内容）
  color_check:
    allowed_colors:
      - "#ff4d4f"  # red_primary
      - "#cf1322"  # red_dark
      - "#fff1f0"  # red_bg
      - "#4a4a4a"  # text_deep（重点内容/重要引用）
      - "#555555"  # text_main（主要文本）
      - "#666666"  # text_muted（次要文本）

    # 检测并禁止暗色
    forbidden_colors:
      - "#262626"  # 太暗，直接拒绝
      - "#333333"  # 太暗，已弃用
      - "#8c8c8c"  # 太暗，直接拒绝
      - "#595959"  # 太暗，直接拒绝

    check_command: |
      grep -oE "#[0-9a-fA-F]{6}" {output_file} | \
      grep -vE "#ff4d4f|#cf1322|#fff1f0|#4a4a4a|#555555|#666666" && exit 1

    fail_message: "发现不允许的颜色值！只允许使用主题定义的6种颜色（#ff4d4f, #cf1322, #fff1f0, #4a4a4a, #555555, #666666）。"

  # 标签检查
  tag_check:
    forbidden_tags: [div, section, article, style, script, link, iframe]

    check_command: |
      grep -E "<(div|section|article|style|script)" {output_file} && exit 1

    fail_message: "发现禁止的标签！公众号不支持的标签会被移除。"

  # 结构检查
  structure_check:
    rules:
      - "H1 标题只能有1个"
      - "行内强调每段最多1次"
      - "代码块不上色"

# ============================================
# MD 写作时的"允许写法"（上游约束）
# ============================================
markdown_allowed_html:
  allowed:
    - |
      <span style="color:{red_primary};font-weight:600;">重点</span>
    - |
      <blockquote style="background:{red_bg};border-left:4px solid {red_primary};padding:12px 16px;">
      内容
      </blockquote>

  forbidden:
    - "<div"
    - "<style>"
    - 自定义颜色
    - 自定义字体

# ============================================
# 使用建议
# ============================================
usage_recommendations:
  best_for:
    - "微信公众号（复制粘贴直接可用）"
    - "需要醒目但不花哨的技术内容"
    - "长期更新的内容系列"

  not_recommended_for:
    - "需要复杂排版的内容"
    - "大量使用代码高亮的技术文章"

  tips:
    - "红色只用于结构强调，不要整段染红"
    - "行内强调每段最多1次"
    - "代码块保持原生样式"
    - "用 blockquote 实现强调块效果"

# ============================================
# 模板示例
# ============================================
templates:
  # H1 标题示例
  h1_example: |
    <h1 style="color:#ff4d4f;font-weight:700;">
    文章标题
    </h1>

  # H2 标题示例
  h2_example: |
    <h2 style="color:#cf1322;font-weight:600;">
    章节标题
    </h2>

  # H3 标题示例
  h3_example: |
    <h3 style="color:#cf1322;font-weight:600;">
    小节标题
    </h3>

  # 红色强调块示例
  highlight_block_example: |
    <blockquote style="
      background:#fff1f0;
      border-left:4px solid #ff4d4f;
      padding:12px 16px;
      margin:12px 0;
    ">
    <strong style="color:#cf1322;">规模惊人：</strong><br>
    ● <span style="color:#555555">108 个专业代理</span><br>
    ● <span style="color:#555555">15 个工作流协调器</span><br>
    </blockquote>

  # 行内强调示例
  emphasis_inline_example: |
    <span style="color:#ff4d4f;font-weight:600;">
    关键结论
    </span>

  # 列表示例
  list_example: |
    <ul>
      <li><strong>108 个专业代理</strong></li>
      <li><strong>15 个工作流协调器</strong></li>
    </ul>

  # 代码块示例
  code_block_example: |
    <pre><code>
    /plugin marketplace add wshobson/agents
    /plugin install python-development
    </code></pre>

  # 引用块示例（使用深色确保对比度）
  quote_block_example: |
    <blockquote style="color:#4a4a4a;">
    如果你不想用隐藏功能，还有一个更成熟的方案。
    </blockquote>

# ============================================
# 工作流集成
# ============================================
workflow_integration:
  renderer: skill.media.readable_color_layout
  verifier: skill.media.content_proofreading

  # 后处理验证命令
  post_verify:
    - name: "检查颜色白名单"
      command: "grep -oE '#[0-9a-fA-F]{6}' {output} | grep -vE '#ff4d4f|#cf1322|#fff1f0|#4a4a4a|#555555|#666666' && echo '❌ 发现不允许的颜色' && exit 1 || echo '✓ 颜色检查通过'"

    - name: "检查禁止标签"
      command: "grep -E '<(div|section|style)' {output} && echo '❌ 发现禁止标签' && exit 1 || echo '✓ 标签检查通过'"

    - name: "检查暗色文字"
      command: "grep -iE '#262626|#333333' {output} && echo '❌ 发现暗色文字，应使用#4a4a4a或#555555' && exit 1 || echo '✓ 暗色检查通过'"
