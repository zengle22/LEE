# Demo: 用户登录流程 - User Flow Contract
# 演示单主路径原则的落地

id: flow.user_login
name: 用户登录
description: 用户通过手机号+验证码登录系统
version: v1
priority: P0

# ============================================
# 入口定义
# ============================================
entry:
  page_ref: page.home
  trigger: click(login_button)

  # 前置条件 - 在入口处解决
  preconditions:
    - id: not_logged_in
      condition: "user.isLoggedIn == false"
      not_met_action: redirect
      guide_to: page.dashboard
      message_key: already_logged_in

  # 入口可见性规则
  visibility_rule:
    condition: "user.isLoggedIn == false"
    hidden_reason: "已登录用户不显示登录入口"

# ============================================
# 主路径定义（核心）
# ============================================
main_path:
  max_steps: 2
  allow_back: true
  force_sequential: true

  steps:
    # 步骤1：输入手机号
    - id: step_1_phone
      page_ref: page.login_phone
      action: "输入手机号并点击获取验证码"
      trigger: click(get_code_button)
      preconditions:
        - id: valid_phone
          condition: "form.phone.isValid"
          not_met_action: disable
          message_key: please_enter_valid_phone
      validation:
        required_fields: [phone]
        rules:
          - field: phone
            type: pattern
            value: "^1[3-9]\\d{9}$"
      on_failure:
        action: show_inline_error
        message_key: phone_send_failed
        recovery_hint_key: check_phone_and_retry

    # 步骤2：输入验证码
    - id: step_2_verify
      page_ref: page.login_verify
      action: "输入验证码并点击登录"
      trigger: click(login_submit_button)
      preconditions:
        - id: code_sent
          condition: "state.codeSent == true"
          not_met_action: redirect
          guide_to: step_1_phone
          message_key: please_get_code_first
      validation:
        required_fields: [code]
        rules:
          - field: code
            type: pattern
            value: "^\\d{6}$"
      on_failure:
        action: show_inline_error
        message_key: code_verify_failed
        recovery_hint_key: check_code_and_retry

  # 完成态定义
  completion:
    state: success
    feedback:
      type: toast
      message_key: login_success
      redirect_to: page.dashboard
    next_action:
      type: redirect
      target: page.dashboard

# ============================================
# 合法退出点
# ============================================
exit_points:
  - id: complete
    type: complete
    from_step: step_2_verify

  - id: cancel
    type: cancel
    confirmation_required: false
    data_preservation: discard

  - id: switch_to_password
    type: cancel
    from_step: step_1_phone
    confirmation_required: false
    data_preservation: discard

# ============================================
# 禁止的路径模式
# ============================================
blocked_patterns:
  - id: no_skip_phone_input
    pattern: "跳过手机号输入直接验证"
    reason: "必须先获取验证码"
    enforcement: block_navigation

  - id: no_mid_flow_browsing
    pattern: "登录过程中浏览其他功能"
    reason: "V1禁止中间态"
    enforcement: hide_entry

  - id: no_parallel_login
    pattern: "同时进行多个登录流程"
    reason: "状态冲突"
    enforcement: block_navigation

# ============================================
# 错误恢复策略
# ============================================
recovery_strategies:
  - error_type: INVALID_PHONE
    recovery_action: show_error
    message_key: invalid_phone_format

  - error_type: CODE_SEND_FAILED
    recovery_action: retry
    max_retries: 3
    message_key: code_send_failed_retry

  - error_type: CODE_EXPIRED
    recovery_action: back_to_step
    target_step: step_1_phone
    message_key: code_expired_resend

  - error_type: CODE_WRONG
    recovery_action: show_error
    message_key: wrong_code_retry

  - error_type: NETWORK_ERROR
    recovery_action: retry
    max_retries: 3
    message_key: network_error_retry

# ============================================
# AI 盲跑验证配置
# ============================================
ai_walkthrough:
  enabled: true
  expected_steps: 2
  hints_allowed: false
  success_criteria:
    - "从首页点击登录按钮进入"
    - "在手机号页面输入手机号并点击获取验证码"
    - "在验证码页面输入验证码并点击登录"
    - "看到登录成功提示并跳转到仪表盘"
  forbidden_actions:
    - "跳过手机号输入步骤"
    - "在登录过程中访问其他页面"
    - "使用浏览器后退跳出流程"
