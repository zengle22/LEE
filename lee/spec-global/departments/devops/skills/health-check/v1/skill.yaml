# DevOps Health Check Skill v1.0

kind: skill
version: 1.0

id: skill.devops.health_check
name: Health Check
description: >
  执行健康检查，带重试逻辑。
owner: devops-team
tags: [devops, deploy]

interface:
  inputs:
    type: object
    required: [env, url]
    properties:
      env:
        type: string
      url:
        type: string
        description: "健康检查端点 URL"
      retries:
        type: integer
        default: 5
      interval:
        type: integer
        default: 3
        description: "重试间隔（秒）"
  outputs:
    type: object
    properties:
      ok:
        type: boolean
      status:
        type: string
        enum: ["healthy", "unhealthy"]
        description: "健康状态，兼容 QA 工作流"
      http_code:
        type: integer
      result_path:
        type: string

runtime:
  type: shell
  script: "scripts/health-check.sh"
  args_template: "--env {{ inputs.env }} --url {{ inputs.url }} --retries {{ inputs.retries }} --interval {{ inputs.interval }}"
  exit_codes:
    0: "健康检查通过"
    1: "健康检查失败"
    2: "参数错误"
