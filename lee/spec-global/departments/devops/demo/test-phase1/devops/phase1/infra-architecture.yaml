# 基础设施架构设计
# Task Manager v1.0.0
# 由 agent.devops.architect 生成

kind: infrastructure_architecture
version: "1.0"
project: task-manager
generated_at: "2026-01-29T10:00:00Z"
generated_by: "agent.devops.architect"

# ============================================
# 架构概览
# ============================================
architecture_overview:
  style: "microservices"
  deployment_model: "container_orchestration"
  infrastructure_as_code: "docker_compose"
  description: |
    基于 Docker Compose 的轻量级容器化部署架构。
    适合中小规模应用，支持快速部署和回滚。

# ============================================
# 服务拓扑
# ============================================
service_topology:
  # 应用服务
  app:
    type: "backend_service"
    technology: "go"
    version: "1.21"
    framework: "gin"
    port: 8000
    replicas: 1
    resources:
      limits:
        memory: "512M"
        cpus: "0.5"
      requests:
        memory: "256M"
        cpus: "0.25"
    health_check:
      enabled: true
      endpoint: "/health"
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - db
      - redis

  # 数据库服务
  db:
    type: "database"
    technology: "postgresql"
    version: "15"
    edition: "alpine"
    port: 5432
    replicas: 1
    resources:
      limits:
        memory: "1G"
        cpus: "0.5"
      requests:
        memory: "512M"
        cpus: "0.25"
    persistence:
      enabled: true
      size: "10G"
      type: "local"
    health_check:
      enabled: true
      command: "pg_isready -U ${DB_USER} -d ${DB_NAME}"
      interval: 10s
      timeout: 5s
      retries: 5
    backup:
      enabled: true
      schedule: "0 2 * * *"
      retention_days: 7

  # 缓存服务
  redis:
    type: "cache"
    technology: "redis"
    version: "7"
    edition: "alpine"
    port: 6379
    replicas: 1
    resources:
      limits:
        memory: "256M"
        cpus: "0.25"
      requests:
        memory: "128M"
        cpus: "0.1"
    persistence:
      enabled: true
      size: "1G"
      type: "local"
    health_check:
      enabled: true
      command: "redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

  # Web 服务器
  nginx:
    type: "web_server"
    technology: "nginx"
    version: "alpine"
    port: 80
    replicas: 1
    resources:
      limits:
        memory: "128M"
        cpus: "0.25"
      requests:
        memory: "64M"
        cpus: "0.1"
    health_check:
      enabled: true
      command: "wget --quiet --tries=1 --spider http://localhost/health"
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - app

# ============================================
# 网络架构
# ============================================
network_architecture:
  network_type: "bridge"
  driver: "bridge"
  subnet: "172.20.0.0/16"
  gateway: "172.20.0.1"
  dns:
    - "8.8.8.8"
    - "8.8.4.4"

  # 服务间通信
  service_mesh: false
  service_discovery: "docker_dns"

  # 外部访问
  ingress:
    type: "nginx_reverse_proxy"
    ssl_termination: true
    https_port: 443
    http_port: 80

# ============================================
# 存储架构
# ============================================
storage_architecture:
  primary_type: "local_volume"
  backup_type: "local_backup"

  volumes:
    db_data:
      driver: "local"
      size: "10G"
      mount_path: "/var/lib/postgresql/data"
      backup_enabled: true

    redis_data:
      driver: "local"
      size: "1G"
      mount_path: "/data"
      backup_enabled: false

  # 备份策略
  backup_strategy:
    db:
      full_backup_schedule: "0 2 * * *"
      incremental_backup: false
      retention_policy: "7days"
      compression: true
      encryption: false

# ============================================
# 安全架构
# ============================================
security_architecture:
  # 环境隔离
  environment_isolation:
    enabled: true
    network_isolation: false
    credential_isolation: true

  # 凭证管理
  credential_management:
    strategy: "human_injected"
    placeholder_pattern: "${VARIABLE_NAME}"
    forbidden_patterns:
      - "hardcoded_password"
      - "plaintext_api_key"

  # 网络安全
  network_security:
    firewall: false
    tls_encryption:
      dev: false
      test: true
      staging: true
      prod: true

  # 访问控制
  access_control:
    authentication: "basic_auth"
    authorization: "role_based"
    api_rate_limiting:
      enabled: false

# ============================================
# 监控架构
# ============================================
monitoring_architecture:
  # 日志收集
  logging:
    level: "info"
    format: "json"
    outputs:
      - "console"
      - "file"
    rotation:
      enabled: true
      max_size: "10M"
      max_files: 10

  # 指标收集
  metrics:
    enabled: true
    type: "prometheus"
    port: 9090
    scrape_interval: 15s

  # 健康检查
  health_checks:
    enabled: true
    endpoints:
      - "/health"
      - "/ready"
      - "/metrics"

  # 告警
  alerting:
    enabled: false
    channels: []

# ============================================
# 部署策略
# ============================================
deployment_strategy:
  # 部署模式
  mode: "rolling"
  max_unavailable: 0
  max_surge: 1

  # 健康检查
  health_check_required: true
  startup_timeout: 120s

  # 回滚策略
  rollback:
    enabled: true
    automatic: false
    timeout: 600s

# ============================================
# 扩展性考虑
# ============================================
scalability_considerations:
  horizontal_scaling:
    enabled: false
    min_replicas: 1
    max_replicas: 3

  vertical_scaling:
    enabled: true
    max_memory: "2G"
    max_cpu: "2.0"

  load_balancing:
    type: "nginx"
    algorithm: "round_robin"

# ============================================
# 灾难恢复
# ============================================
disaster_recovery:
  # RPO/RTO
  rpo: "24h"
  rto: "15m"

  # 备份验证
  backup_validation:
    enabled: true
    frequency: "weekly"

  # 故障切换
  failover:
    automatic: false
    manual_trigger: true

# ============================================
# 成本估算
# ============================================
cost_estimation:
  infrastructure:
    type: "self_hosted"
    currency: "USD"

  resource_costs:
    compute:
      cpu_cores: 1.5
      memory_gb: 2
      estimated_monthly_cost: 50

    storage:
      size_gb: 11
      estimated_monthly_cost: 10

    total_monthly_cost: 60

# ============================================
# 合规性
# ============================================
compliance:
  audit_logging:
    enabled: true
    retention_days: 90

  data_protection:
    encryption_at_rest: false
    encryption_in_transit: true

  regulatory_compliance:
    gdpr: false
    hipaa: false
    pci_dss: false

# ============================================
# 架构决策记录（ADR）
# ============================================
architecture_decisions:
  - decision: "使用 Docker Compose 而非 Kubernetes"
    rationale: |
      - 项目规模较小，Docker Compose 足够
      - 简化部署流程，降低学习曲线
      - 快速迭代，易于调试
    trade_offs:
      - 失去了 Kubernetes 的自动扩展能力
      - 需要手动管理服务健康

  - decision: "使用本地卷而非云存储"
    rationale: |
      - 降低成本
      - 简化配置
      - 足够 dev/test 环境使用
    trade_offs:
      - 需要手动管理备份
      - 缺乏云存储的高可用性

  - decision: "Nginx 作为反向代理"
    rationale: |
      - 成熟的 Web 服务器
      - 支持 SSL/TLS 终止
      - 良好的负载均衡能力
    trade_offs:
      - 增加了一个服务组件
      - 需要额外配置

# ============================================
# 下一阶段建议
# ============================================
next_phase_recommendations:
  # 短期（1-3 个月）
  short_term:
    - "实现自动化部署脚本"
    - "配置 CI/CD Pipeline"
    - "添加监控告警"

  # 中期（3-6 个月）
  medium_term:
    - "迁移到 Kubernetes"
    - "实现自动扩展"
    - "添加分布式追踪"

  # 长期（6-12 个月）
  long_term:
    - "实现多云部署"
    - "添加服务网格"
    - "实现混沌工程"

