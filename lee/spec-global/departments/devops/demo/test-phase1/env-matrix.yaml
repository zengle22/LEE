# 环境配置矩阵
# Task Manager v1.0.0
# 由 agent.devops.architect 生成

kind: environment_matrix
version: "1.0"
project: task-manager
generated_at: "2026-01-29T10:02:00Z"
generated_by: "agent.devops.architect"

# ============================================
# 环境定义
# ============================================
environments:
  # ============================================
  # Dev 环境
  # ============================================
  dev:
    description: "开发环境，用于日常开发和快速验证"
    purpose: "development"
    availability_requirement: "medium"
    auto_deploy: true
    approval_required: false

    # 网络配置
    network:
      subnet: "172.20.0.0/16"

    # 端口配置
    ports:
      app: 8000
      db: 5432
      redis: 6379
      nginx_http: 8080
      nginx_https: 8443

    # 资源配置
    resources:
      app:
        memory: "512M"
        cpu: "0.5"
      db:
        memory: "1G"
        cpu: "0.5"
      redis:
        memory: "256M"
        cpu: "0.25"
      nginx:
        memory: "128M"
        cpu: "0.25"

    # 功能开关
    features:
      debug_mode: true
      hot_reload: true
      auto_migrate: true
      mock_external_services: false

    # 日志配置
    logging:
      level: "debug"
      format: "text"
      output:
        - "console"
        - "file"

    # 安全配置
    security:
      https_enabled: false
      basic_auth_enabled: false
      cors_enabled: true

    # 备份配置
    backup:
      enabled: true
      schedule: "0 2 * * *"
      retention_days: 7

    # 监控配置
    monitoring:
      metrics_enabled: true
      tracing_enabled: false
      profiling_enabled: false

  # ============================================
  # Test 环境
  # ============================================
  test:
    description: "测试环境，用于 QA 测试和集成验证"
    purpose: "testing"
    availability_requirement: "high"
    auto_deploy: false
    approval_required: true

    # 网络配置
    network:
      subnet: "172.21.0.0/16"

    # 端口配置
    ports:
      app: 8000
      db: 5432
      redis: 6379
      nginx_http: 80
      nginx_https: 443

    # 资源配置
    resources:
      app:
        memory: "1G"
        cpu: "1.0"
      db:
        memory: "2G"
        cpu: "1.0"
      redis:
        memory: "512M"
        cpu: "0.5"
      nginx:
        memory: "256M"
        cpu: "0.5"

    # 功能开关
    features:
      debug_mode: false
      hot_reload: false
      auto_migrate: true
      mock_external_services: true

    # 日志配置
    logging:
      level: "info"
      format: "json"
      output:
        - "console"
        - "file"
        - "syslog"

    # 安全配置
    security:
      https_enabled: true
      basic_auth_enabled: true
      cors_enabled: true

    # 备份配置
    backup:
      enabled: true
      schedule: "0 3 * * *"
      retention_days: 14

    # 监控配置
    monitoring:
      metrics_enabled: true
      tracing_enabled: true
      profiling_enabled: false

# ============================================
# 配置变量矩阵
# ============================================
configuration_matrix:
  # 应用配置
  app_config:
    - name: "app_name"
      dev: "task-manager-dev"
      test: "task-manager-test"
      description: "应用名称"

    - name: "app_version"
      dev: "1.0.0"
      test: "1.0.0"
      description: "应用版本"

    - name: "app_env"
      dev: "development"
      test: "test"
      description: "运行环境"

    - name: "app_debug"
      dev: "true"
      test: "false"
      description: "调试模式"

    - name: "log_level"
      dev: "debug"
      test: "info"
      description: "日志级别"

  # 数据库配置
  database_config:
    - name: "db_host"
      dev: "db"
      test: "db"
      description: "数据库主机"

    - name: "db_port"
      dev: 5432
      test: 5432
      description: "数据库端口"

    - name: "db_name"
      dev: "${DB_NAME}"
      test: "${DB_NAME}"
      description: "数据库名称（人类填写）"

    - name: "db_user"
      dev: "${DB_USER}"
      test: "${DB_USER}"
      description: "数据库用户（人类填写）"

    - name: "db_password"
      dev: "${DB_PASSWORD}"
      test: "${DB_PASSWORD}"
      description: "数据库密码（人类填写，敏感）"
      sensitive: true

    - name: "db_ssl_mode"
      dev: "disable"
      test: "require"
      description: "数据库 SSL 模式"

    - name: "db_max_connections"
      dev: 25
      test: 100
      description: "最大连接数"

  # Redis 配置
  redis_config:
    - name: "redis_host"
      dev: "redis"
      test: "redis"
      description: "Redis 主机"

    - name: "redis_port"
      dev: 6379
      test: 6379
      description: "Redis 端口"

    - name: "redis_password"
      dev: "${REDIS_PASSWORD}"
      test: "${REDIS_PASSWORD}"
      description: "Redis 密码（人类填写，敏感）"
      sensitive: true

    - name: "redis_db"
      dev: 0
      test: 1
      description: "Redis 数据库编号"

    - name: "redis_max_connections"
      dev: 50
      test: 200
      description: "最大连接数"

  # 外部服务配置
  external_services:
    - name: "api_key"
      dev: "${API_KEY}"
      test: "${API_KEY}"
      description: "外部 API 密钥（人类填写，敏感）"
      sensitive: true

    - name: "secret_key"
      dev: "${SECRET_KEY}"
      test: "${SECRET_KEY}"
      description: "应用密钥（人类填写，敏感）"
      sensitive: true

    - name: "smtp_host"
      dev: "${SMTP_HOST}"
      test: "${SMTP_HOST}"
      description: "SMTP 主机"

    - name: "smtp_port"
      dev: 587
      test: 587
      description: "SMTP 端口"

    - name: "smtp_user"
      dev: "${SMTP_USER}"
      test: "${SMTP_USER}"
      description: "SMTP 用户"

    - name: "smtp_password"
      dev: "${SMTP_PASSWORD}"
      test: "${SMTP_PASSWORD}"
      description: "SMTP 密码（敏感）"
      sensitive: true

# ============================================
# 凭证管理策略
# ============================================
credential_management:
  strategy: "human_injected"
  placeholder_pattern: "${VARIABLE_NAME}"

  # 敏感字段列表
  sensitive_fields:
    - "db_password"
    - "redis_password"
    - "api_key"
    - "secret_key"
    - "smtp_password"
    - "aws_secret_access_key"

  # 凭证注入流程
  injection_process:
    1. "AI 生成配置模板，使用占位符"
    2. "人类填写真实凭证"
    3. "生成 .env 文件"
    4. "Docker Compose 加载 .env 文件"

  # 凭证验证
  validation:
    required: true
    rules:
      - rule: "不允许硬编码凭证"
        check: "no_hardcoded_secrets"
      - rule: "占位符必须被替换"
        check: "all_placeholders_filled"
      - rule: "敏感字段必须存在"
        check: "sensitive_fields_present"

# ============================================
# 环境差异总结
# ============================================
environment_diffs:
  # 主要差异
  key_differences:
    - aspect: "调试模式"
      dev: "启用"
      test: "禁用"

    - aspect: "HTTPS"
      dev: "禁用"
      test: "启用"

    - aspect: "资源配置"
      dev: "较低"
      test: "中等"

    - aspect: "日志级别"
      dev: "debug"
      test: "info"

    - aspect: "外部服务"
      dev: "真实服务"
      test: "Mock 服务"

    - aspect: "审批要求"
      dev: "无需审批"
      test: "需要 DevOps Lead 审批"

# ============================================
# 配置验证规则
# ============================================
validation_rules:
  # 必填字段
  required_fields:
    dev:
      - "DB_NAME"
      - "DB_USER"
      - "DB_PASSWORD"
      - "REDIS_PASSWORD"
      - "SECRET_KEY"
    test:
      - "DB_NAME"
      - "DB_USER"
      - "DB_PASSWORD"
      - "REDIS_PASSWORD"
      - "API_KEY"
      - "SECRET_KEY"
      - "SMTP_PASSWORD"

  # 配置检查
  configuration_checks:
    - check: "端口可用性"
      command: "netstat -tuln | grep -c ':${PORT}'"

    - check: "磁盘空间"
      command: "df -h | grep -c '$AVAILABLE_SPACE > 10G'"

    - check: "内存可用"
      command: "free -g | grep -c '$AVAILABLE_MEMORY > 4G'"

  # 兼容性检查
  compatibility_checks:
    - check: "Docker 版本"
      minimum_version: "20.10.0"

    - check: "Docker Compose 版本"
      minimum_version: "2.0.0"

# ============================================
# 元数据
# ============================================
metadata:
  document_version: "1.0"
  created_at: "2026-01-29T10:02:00Z"
  created_by: "agent.devops.architect"
  approved: false
  approved_by: []
  review_status: "pending"

  # 配置模板
  config_templates:
    dev: "templates/env-config.dev.template.yaml"
    test: "templates/env-config.test.template.yaml"
