# Running Coach - 基础设施架构设计
# Phase 1 输出 by agent.devops.architect

kind: infrastructure_architecture
version: "1.0.0"
project: running-coach
created_by: agent.devops.architect
created_at: "2026-01-30T10:00:00Z"

# ============================================
# 服务定义
# ============================================
services:
  - name: running-coach-api
    type: application
    description: "AI跑步教练后端 API 服务"
    technology:
      language: go
      framework: gin
      version: "1.21"
    ports:
      - 8080  # HTTP API
      - 9090  # Metrics
    dependencies:
      - postgresql
      - redis
    resources:
      cpu: "1 core"
      memory: "2 GB"
      disk: "20 GB"

  - name: postgresql
    type: database
    description: "主数据库"
    technology:
      type: postgresql
      version: "15"
    ports:
      - 5432
    resources:
      cpu: "2 cores"
      memory: "4 GB"
      disk: "100 GB"
    backup:
      enabled: true
      frequency: daily
      retention: 7

  - name: redis
    type: cache
    description: "缓存和会话存储"
    technology:
      type: redis
      version: "7"
    ports:
      - 6379
    resources:
      cpu: "1 core"
      memory: "2 GB"
      disk: "10 GB"

# ============================================
# 环境拓扑
# ============================================
environments:
  dev:
    description: "开发环境"
    servers:
      api: 1
      db: 1
      cache: 1
    network:
      vpc: dev-vpc
      subnet: dev-subnet-1
      security_group: dev-sg

  test:
    description: "测试环境"
    servers:
      api: 1
      db: 1
      cache: 1
    network:
      vpc: test-vpc
      subnet: test-subnet-1
      security_group: test-sg

  staging:
    description: "预发布环境（未在本 demo 中实现）"
    servers:
      api: 2
      db: 1
      cache: 1

  prod:
    description: "生产环境（未在本 demo 中实现）"
    servers:
      api: 3
      db: 2  # 主从
      cache: 2

# ============================================
# 网络架构
# ============================================
network:
  topology: "single-vpc-multi-subnet"
  description: "每个环境独立子网，通过安全组隔离"

  security_rules:
    - name: "api-ingress"
      from: "internet"
      to: "api"
      ports: [80, 443]
      protocol: tcp

    - name: "api-to-db"
      from: "api"
      to: "db"
      ports: [5432]
      protocol: tcp

    - name: "api-to-cache"
      from: "api"
      to: "cache"
      ports: [6379]
      protocol: tcp

# ============================================
# 资源管理声明（v1.2 新增）
# ============================================
resource_management:
  hardware_managed_by: human
  inventory_binding: true
  iac_tool: ansible

  note: >
    硬件资源（服务器）由人类在云控制台创建，
    部署通过 Ansible inventory 引用服务器，
    禁止 Agent 直接创建或删除云资源。

# ============================================
# 部署策略
# ============================================
deployment:
  strategy: rolling
  docker_compose: true
  health_check:
    enabled: true
    interval: 30s
    timeout: 10s
    retries: 3
