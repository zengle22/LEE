# Running Coach - Dev Environment Inventory
# 开发环境主机清单
#
# 标签规范：
#   env  = dev | test | staging | prod
#   role = api | web | db | cache | mq | job
#   zone = cn-north-1 | cn-south-1 | etc.
#
# 注意：IP 地址由人类在云控制台创建服务器后填写

# ============================================
# API 服务组
# ============================================
[dev-api]
dev-api-1 ansible_host=10.0.1.10 env=dev role=api zone=cn-south-1

# ============================================
# 数据库服务组
# ============================================
[dev-db]
dev-db-1 ansible_host=10.0.1.11 env=dev role=db zone=cn-south-1

# ============================================
# 缓存服务组
# ============================================
[dev-cache]
dev-redis-1 ansible_host=10.0.1.12 env=dev role=cache zone=cn-south-1

# ============================================
# 环境分组（包含所有 dev 组）
# ============================================
[dev:children]
dev-api
dev-db
dev-cache

# ============================================
# 服务角色分组
# ============================================
[api:children]
dev-api

[db:children]
dev-db

[cache:children]
dev-cache
