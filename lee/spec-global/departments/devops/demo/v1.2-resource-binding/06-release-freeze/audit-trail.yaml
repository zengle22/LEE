          - "dev-db-1 (10.0.1.11)"
          - "dev-redis-1 (10.0.1.12)"
      test:
        path: "./00-inventory/test"
        hosts:
          - "test-api-1 (10.0.2.10)"
          - "test-db-1 (10.0.2.11)"
          - "test-redis-1 (10.0.2.12)"
    outputs:
      - deploy-dev.log
      - deploy-test.log
      - inventory-usage.yaml

  - phase: p5_verification
    name: "环境与发布包验收"
    agent: agent.devops.verification
    started_at: "2026-01-30T10:55:00Z"
