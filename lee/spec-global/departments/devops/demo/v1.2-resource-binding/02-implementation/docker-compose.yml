# Running Coach - Docker Compose 配置
# Phase 2 输出 by agent.devops.implementation
#
# 注意：此配置使用占位符，真实值由人类在 Phase 3 注入

version: "3.8"

services:
  # ============================================
  # API 服务
  # ============================================
  app:
    image: ${DOCKER_REGISTRY}/running-coach:${IMAGE_TAG}
    container_name: running-coach-api
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - APP_ENV=${APP_ENV}
      - APP_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL}
      - DEBUG_MODE=${DEBUG_MODE}
      # 数据库配置
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - running-coach-network
    labels:
      - "project=running-coach"
      - "env=${APP_ENV}"
      - "role=api"

  # ============================================
  # PostgreSQL 数据库
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: running-coach-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - running-coach-network
    labels:
      - "project=running-coach"
      - "env=${APP_ENV}"
      - "role=db"

  # ============================================
  # Redis 缓存
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: running-coach-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - running-coach-network
    labels:
      - "project=running-coach"
      - "env=${APP_ENV}"
      - "role=cache"

# ============================================
# 网络配置
# ============================================
networks:
  running-coach-network:
    driver: bridge
    name: running-coach-${APP_ENV}

# ============================================
# 数据卷
# ============================================
volumes:
  db_data:
    name: running-coach-db-${APP_ENV}
  redis_data:
    name: running-coach-redis-${APP_ENV}
