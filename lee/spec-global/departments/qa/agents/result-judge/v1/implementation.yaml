# Result Judge Agent Implementation v1.0
# Implementation using lee.qa.classifier.ErrorClassifier

kind: skill
version: 1.0

id: skill.qa.result_judge_impl
name: Result Judge Implementation
description: >
  Implementation of result judge using the new QA module's
  ErrorClassifier to distinguish code_issue from system_issue.

owner: qa-governance
tags: [qa, result-judge, classifier, error-analysis]

# Input schemas
inputs:
  - name: runner_output
    type: object
    description: "Test runner output with case results"
  - name: evidence_dir
    type: string
    description: "Path to evidence directory"
  - name: expected_results
    type: array
    description: "Expected results from test cases"

# Output schemas
outputs:
  - name: results
    type: array
    description: "Judged results with error classification"
  - name: pass_count
    type: integer
  - name: fail_count
    type: integer
  - name: code_issue_count
    type: integer
    description: "Count of false failures (code issues)"
  - name: system_issue_count
    type: integer
    description: "Count of true failures (system bugs)"

# Implementation
implementation:
  module: "lee.qa.classifier.error_classifier"
  class: "ErrorClassifier"
  method: "classify_batch"

# Error classification
error_classification:
  code_issue:
    description: "Test code problem (false failure)"
    action: "mark_invalid_run"
    retry: true
  system_issue:
    description: "System bug (true failure)"
    action: "mark_fail"
    file_bug: true
  uncertain:
    description: "Cannot determine automatically"
    action: "manual_review"

# Role constraints (anti-mock)
role_constraints:
  role: judge
  allowed:
    - read_evidence
    - classify_errors
    - judge_results
    - write_results
  forbidden:
    - call_test_runner
    - modify_evidence
    - fabricate_evidence

# Quality gates
quality_gates:
  - name: evidence_based
    description: "All judgments based on actual evidence"
  - name: error_classified
    description: "All errors classified by type"
  - name: false_fail_filtered
    description: "Code issues separated from system bugs"

# Integration points
integration:
  agent: "agent.qa.result_judge"
  workflow: "test-set-l3"
  phase: "result_judgment"
