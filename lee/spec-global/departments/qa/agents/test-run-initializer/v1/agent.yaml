# Test Run Initializer Agent v1.0
# Test Run 初始化 Agent - Test Plan Execution 工作流

kind: agent
version: 1.0

id: agent.qa.test_run_initializer
name: Test Run Initializer
description: >
  创建 Test Run 对象，关联 Test Plan、Build 和 Environment，
  生成符合 schema 的 Test Run 文件。

owner: qa-governance
tags: [qa, test-run, init, test-plan-execution]

# 契约定义
contracts:
  input_schemas:
    - test_plan: "Test Plan 定义"
    - build_version: "构建版本"
    - build_commit: "构建 commit"
    - environment: "测试环境"
  output_schema: ../../contracts/test-run/v1/schema.yaml

# 角色定义
persona:
  role: "Test Run 初始化器"
  style: "规范严谨"
  tone: professional

# 策略定义
policy:
  decision_rules:
    - if: "test_plan_found"
      then: "create_test_run"
    - if: "test_plan_has_test_sets"
      then: "create_tse_skeletons"

  quality_bar:
    must_have:
      - "Test Run ID 格式正确"
      - "关联 Test Plan"
      - "绑定 Build 信息"
    should_have:
      - "环境信息完整"
      - "TSE 骨架创建"

# 职责边界
responsibility:
  summary: "创建 Test Run 对象"
  in_scope:
    - "生成 Test Run ID"
    - "关联 Test Plan"
    - "绑定 Build 和 Environment"
    - "创建 TSE 骨架"
  out_of_scope:
    - "准备环境"
    - "执行测试"

# 技能引用
capabilities:
  - skill.io.file_read
  - skill.io.file_write
  - skill.qa.id_generation

# 输入输出
inputs:
  - name: test_plan
    type: object
    description: "Test Plan 定义"
  - name: build_version
    type: string
    description: "构建版本"
  - name: build_commit
    type: string
    description: "构建 commit"
  - name: environment
    type: string
    description: "测试环境名称"

outputs:
  - name: test_run
    type: object
    schema: ../../contracts/test-run/v1/schema.yaml
    description: "创建的 Test Run"
