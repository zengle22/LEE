# Test Case Review Gate v1.0
# 测试用例评审门禁 - 人类评审测试用例设计质量

kind: gate_rules
version: 1.0

# ============================================
# 基础信息
# ============================================
gate_id: gate.qa.test_case_review_gate
name: Test Case Review Gate
description: >
  测试用例设计质量评审门禁，支持：
  - 强制标准（0 容忍）
  - 阈值标准（数据驱动，可豁免）
  - 风险可接受标准（人类签字）
  - 需求追溯完整性验证
  - 测试用例清晰度评估

owner: test-governance
tags: [gate, test-case-review, quality-assurance]

# ============================================
# 强制标准（0 容忍，不可豁免）
# ============================================
mandatory_criteria:
  - criterion_id: M001
    name: "需求追溯覆盖率 100%"
    description: "所有 P0/P1 功能点必须有对应的测试用例"
    rule: "requirement_traceability_coverage == 100"
    scope: "P0 and P1 requirements only"
    severity: blocker
    exemption: false
    rationale: "核心功能必须有测试覆盖，否则无法保证质量基线"
    validation_method: "需求 ID 与测试用例 ID 的双向追溯矩阵"

  - criterion_id: M002
    name: "核心流程覆盖率 100%"
    description: "所有核心业务流程必须有完整的测试用例覆盖"
    rule: "core_flow_coverage == 100"
    severity: blocker
    exemption: false
    rationale: "核心流程代表产品最小可用版本（MVP）"
    core_flow_definition: >
      核心流程包括但不限于：
      - 用户认证和授权
      - 主要业务交易链路
      - 数据读写关键路径
      - 关键集成接口

  - criterion_id: M003
    name: "测试用例清晰度 >= 90%"
    description: "测试用例描述必须清晰、可执行、无歧义"
    rule: "test_case_clarity_score >= 90"
    severity: blocker
    exemption: false
    rationale: "不清晰的用例导致执行偏差和结果误判"
    clarity_dimensions:
      - description: "用例目标明确"
      - steps: "步骤详细且可执行"
      - expected_result: "预期结果明确可验证"
      - preconditions: "前置条件清晰"
      - test_data: "测试数据明确"

  - criterion_id: M004
    name: "用例 ID 唯一性"
    description: "所有测试用例必须有唯一标识符"
    rule: "ALL(test_cases) HAVE unique_id"
    severity: blocker
    exemption: false
    rationale: "唯一 ID 是追溯和统计的基础"

  - criterion_id: M005
    name: "用例优先级完整性"
    description: "所有测试用例必须标注优先级（P0/P1/P2/P3）"
    rule: "ALL(test_cases) HAVE priority IN [P0, P1, P2, P3]"
    severity: blocker
    exemption: false
    rationale: "优先级用于风险分级和测试策略制定"

# ============================================
# 阈值标准（数据驱动，可豁免）
# ============================================
threshold_criteria:
  - criterion_id: T001
    name: "总体覆盖率 >= 90%"
    description: "整体测试用例覆盖率不低于阈值"
    rule: "overall_coverage >= overall_threshold"
    default_threshold: 90
    severity: major
    exemption_condition: "非核心功能且有差距分析"
    coverage_calculation: "(covered_requirements / total_requirements) * 100"

  - criterion_id: T002
    name: "功能点覆盖率 >= 95%"
    description: "功能点级别的测试用例覆盖率"
    rule: "feature_coverage >= feature_threshold"
    default_threshold: 95
    severity: major
    exemption_condition: "边缘功能且风险可控"

  - criterion_id: T003
    name: "UI 页面覆盖率 100%"
    description: "所有 UI 页面必须有对应的测试用例"
    rule: "ui_page_coverage == 100"
    severity: major
    exemption_condition: "静态页面或无交互页面"

  - criterion_id: T004
    name: "自动化率 >= 70%"
    description: "自动化测试用例占总用例的比例"
    rule: "automation_rate >= automation_threshold"
    default_threshold: 70
    severity: minor
    exemption_condition: "复杂 UI 或第三方集成场景"

  - criterion_id: T005
    name: "负面测试覆盖"
    description: "异常流程和边界条件必须有测试用例"
    rule: "negative_test_coverage >= negative_threshold"
    default_threshold: 60
    severity: major
    exemption_condition: "已通过安全测试或混沌工程覆盖"

  - criterion_id: T006
    name: "边界值覆盖"
    description: "关键参数必须有边界值测试用例"
    rule: "boundary_value_coverage >= boundary_threshold"
    default_threshold: 80
    severity: major
    exemption_condition: "非关键参数"

# ============================================
# 风险可接受标准（需人类签字）
# ============================================
risk_acceptance_criteria:
  - criterion_id: R001
    name: "覆盖率 80-90% 可接受"
    description: "覆盖率在 80-90% 之间，有详细差距分析"
    rule: "overall_coverage >= 80 AND overall_coverage < 90"
    severity: major
    required_approvers: [qa_lead]
    required_deliverables:
      - "gap-analysis.md"
      - "risk-assessment.md"
      - "mitigation-plan.md"

  - criterion_id: R002
    name: "未覆盖功能点风险评估"
    description: "所有未覆盖的功能点必须有风险评估和规避方案"
    rule: "ALL(uncovered_features) HAVE risk_assessment AND mitigation_plan"
    severity: major
    required_approvers: [qa_lead, tech_lead]
    risk_assessment_template:
      - feature_id: "功能点 ID"
      - impact: "影响范围和严重程度"
      - probability: "问题发生概率（高/中/低）"
      - detection: "问题检测难度"
      - risk_score: "风险评分 = 影响 × 概率"
      - mitigation: "规避或缓解方案"

  - criterion_id: R003
    name: "测试用例复用性评审"
    description: "测试用例设计必须考虑复用性和可维护性"
    rule: "reusability_score >= 70"
    severity: minor
    required_approvers: [qa_lead]
    evaluation_criteria:
      - "用例模块化程度"
      - "参数化使用情况"
      - "公共步骤抽象"
      - "数据驱动设计"

  - criterion_id: R004
    name: "测试数据准备计划"
    description: "所有测试用例必须有对应的测试数据准备计划"
    rule: "ALL(test_cases) HAVE test_data_plan"
    severity: major
    required_approvers: [qa_lead]
    data_plan_requirements:
      - "测试数据来源（生产数据脱敏/合成数据）"
      - "数据准备脚本或工具"
      - "数据清理和恢复策略"
      - "敏感数据保护措施"

# ============================================
# 测试用例质量验证规则
# ============================================
quality_validation:
  - validation_id: Q001
    name: "用例独立性"
    description: "测试用例之间不能有依赖关系"
    rule: "ALL(test_cases) SATISFY is_independent"
    error_message: "发现相互依赖的测试用例，影响并行执行和故障定位"
    severity: major
    validation_method: "检查用例间是否共享状态或依赖执行顺序"

  - validation_id: Q002
    name: "步骤可执行性"
    description: "测试步骤必须足够详细，可直接执行"
    rule: "ALL(test_cases) SATISFY steps_are_executable"
    error_message: "测试步骤过于笼统，无法直接执行"
    severity: major
    validation_criteria:
      - "每个步骤有明确的操作对象"
      - "步骤包含具体的输入值"
      - "步骤有明确的验证点"

  - validation_id: Q003
    name: "预期结果可验证性"
    description: "预期结果必须明确且可验证"
    rule: "ALL(test_cases) SATISFY expected_results_are_verifiable"
    error_message: "预期结果模糊，无法判断用例通过/失败"
    severity: blocker
    validation_criteria:
      - "有明确的成功/失败标准"
      - "可量化的验证指标"
      - "可观察的系统行为"

  - validation_id: Q004
    name: "用例分类完整性"
    description: "测试用例必须有明确的分类标签"
    rule: "ALL(test_cases) HAVE category_tags"
    error_message: "测试用例缺少分类标签"
    severity: minor
    required_tags:
      - "测试类型：功能/性能/安全/兼容性"
      - "测试层级：单元/集成/系统/E2E"
      - "业务领域标签"

# ============================================
# 需求追溯矩阵验证
# ============================================
traceability_validation:
  required_traceability:
    - trace_type: "forward_trace"
      description: "需求 -> 测试用例"
      rule: "ALL(requirements WHERE priority IN [P0, P1]) HAVE mapped_test_cases"
      coverage_target: 100
      rationale: "确保所有高优先级需求都有测试覆盖"

    - trace_type: "backward_trace"
      description: "测试用例 -> 需求"
      rule: "ALL(test_cases) HAVE mapped_requirements"
      coverage_target: 100
      rationale: "确保每个测试用例都有明确的测试目标"

    - trace_type: "defect_trace"
      description: "缺陷 -> 测试用例 -> 需求"
      rule: "ALL(defects) CAN trace to test_case AND requirement"
      coverage_target: 100
      rationale: "支持缺陷影响分析和回归范围确定"

  traceability_matrix_artifact:
    name: "traceability-matrix.xlsx"
    required_columns:
      - "requirement_id"
      - "requirement_title"
      - "requirement_priority"
      - "test_case_ids"
      - "test_case_count"
      - "coverage_status"
      - "automation_flag"
      - "notes"

# ============================================
# 必需交付物
# ============================================
required_artifacts:
  - artifact: "test-case-specification.yaml"
    description: "测试用例规格说明书"
    validation: schema_valid + reviewed_by_qa
    required_sections:
      - "test_cases: 测试用例列表"
      - "traceability_matrix: 追溯矩阵"
      - "coverage_report: 覆盖率报告"
      - "automation_plan: 自动化计划"

  - artifact: "coverage-report.yaml"
    description: "测试覆盖率报告"
    validation: schema_valid
    required_metrics:
      - overall_coverage: "总体覆盖率"
      - feature_coverage: "功能点覆盖率"
      - core_flow_coverage: "核心流程覆盖率"
      - ui_page_coverage: "UI 页面覆盖率"
      - automation_rate: "自动化率"

  - artifact: "gap-analysis.md"
    description: "覆盖率差距分析"
    validation: reviewed_and_signed
    required_when: "coverage < threshold"
    required_sections:
      - "uncovered_items: 未覆盖项列表"
      - "impact_analysis: 影响分析"
      - - "risk_assessment: 风险评估"
      - "mitigation_plan: 缓解计划"

  - artifact: "test-data-plan.md"
    description: "测试数据准备计划"
    validation: reviewed_by_qa_lead
    required_sections:
      - "data_sources: 数据来源"
      - "data_preparation: 数据准备脚本"
      - "data_cleanup: 数据清理策略"
      - "security_measures: 安全措施"

# ============================================
# 门禁判定逻辑
# ============================================
gate_verdict:
  PASS:
    condition: >
      ALL(mandatory_criteria) == MET
      AND ALL(threshold_criteria) == MET
      AND ALL(quality_validation) == VALID
      AND ALL(traceability_validation.required_traceability) == ACHIEVED
    action: approve_test_cases
    next_state: TEST_CASES_APPROVED

  CONDITIONAL_PASS:
    condition: >
      ALL(mandatory_criteria) == MET
      AND MOST(threshold_criteria) == MET (with documented exemptions)
      AND ALL(risk_acceptance_criteria) == DOCUMENTED_AND_SIGNED
      AND gap_analysis_approved == true
    action: human_approval_required
    required_approvers: [qa_lead]
    next_state: PENDING_APPROVAL

  FAIL:
    condition: >
      ANY(mandatory_criteria) == NOT_MET
      OR (too_many_threshold_violations AND no_valid_exemptions)
      OR traceability_matrix_incomplete
    action: reject_and_feedback
    next_state: NEEDS_REVISION
    feedback_requirements:
      - "具体的未达标项列表"
      - "改进建议和优先级"
      - "重新评审时间表"

  BLOCKED:
    condition: >
      critical_blocker_detected
      OR test_cases_not_ready
      OR requirements_not_finalized
    action: block_and_escalate
    next_state: BLOCKED
    notification_recipients: [qa_lead, tech_lead, pm]

# ============================================
# 阈值配置（可根据项目定制）
# ============================================
thresholds:
  default:
    overall_threshold: 90  # %
    feature_threshold: 95  # %
    automation_threshold: 70  # %
    negative_threshold: 60  # %
    boundary_threshold: 80  # %
    clarity_threshold: 90  # %

  conservative:
    overall_threshold: 95
    feature_threshold: 98
    automation_threshold: 80
    negative_threshold: 70
    boundary_threshold: 90
    clarity_threshold: 95

  agile:
    overall_threshold: 85
    feature_threshold: 90
    automation_threshold: 60
    negative_threshold: 50
    boundary_threshold: 70
    clarity_threshold: 85

# ============================================
# 豁免管理
# ============================================
exemption_policy:
  allowed_exemptions:
    - criterion: T001 (总体覆盖率)
      max_exemptions: 3
      requires_approval: qa_lead + pm
      requires_documentation: true
      condition: "非核心功能且有详细差距分析"

    - criterion: T004 (自动化率)
      max_exemptions: 1
      requires_approval: qa_lead
      condition: "复杂 UI 或第三方集成场景"

    - criterion: T005 (负面测试)
      max_exemptions: 2
      requires_approval: qa_lead
      condition: "已通过其他测试手段覆盖"

  forbidden_exemptions:
    - criterion: M001 (需求追溯覆盖率 100%)
    - criterion: M002 (核心流程覆盖率 100%)
    - criterion: M003 (测试用例清晰度 >= 90%)
    - criterion: M004 (用例 ID 唯一性)
    - criterion: M005 (用例优先级完整性)

# ============================================
# 评审签字要求
# ============================================
signoff_requirements:
  final_signoff:
    required_approvers:
      - role: qa_lead
        responsibility: "测试用例质量保证"
        must_sign: true

    optional_approvers:
      - role: tech_lead
        responsibility: "技术可行性和自动化建议"
        must_sign: false
        condition: "涉及复杂技术场景"

      - role: pm
        responsibility: "需求覆盖完整性确认"
        must_sign: false
        condition: "重大功能或高价值需求"

      - role: security_officer
        responsibility: "安全测试覆盖审查"
        must_sign: false
        condition: "涉及敏感数据或安全功能"

    approval_sla: 48h

    inputs_to_review:
      - "test-case-specification.yaml"
      - "traceability-matrix.xlsx"
      - "coverage-report.yaml"
      - "gap-analysis.md (if applicable)"
      - "risk-assessment.md (if applicable)"

    review_checklist:
      - item: "需求追溯矩阵完整性"
        verified_by: qa_lead
      - item: "测试用例清晰度"
        verified_by: qa_lead
      - item: "核心流程覆盖"
        verified_by: qa_lead
      - item: "自动化可行性"
        verified_by: tech_lead (optional)
      - item: "需求覆盖完整性"
        verified_by: pm (optional)

# ============================================
# 评审反馈机制
# ============================================
feedback_mechanism:
  feedback_categories:
    - category: "critical"
      description: "阻塞通过的严重问题"
      response_time: 24h
      escalation_to: qa_lead

    - category: "major"
      description: "需要修复的重要问题"
      response_time: 48h
      escalation_to: qa_lead

    - category: "minor"
      description: "建议改进项"
      response_time: 72h
      escalation_to: none

  feedback_format:
    - criterion_id: "未达标项 ID"
    - severity: "严重程度"
    - description: "问题描述"
    - suggestion: "改进建议"
    - priority: "修复优先级"
    - due_date: "期望完成日期"

# ============================================
# 持续改进
# ============================================
continuous_improvement:
  metrics:
    - test_case_review_pass_rate
    - average_review_cycles
    - test_case_defect_escape_rate
    - automation_achievement_rate
    - review_turnaround_time

  periodic_review:
    frequency: "monthly"
    participants: [qa_lead, test_engineers, tech_lead]
    agenda:
      - "评审通过率趋势分析"
      - "常见问题总结"
      - "模板和流程优化"
      - "工具和自动化改进"

  lessons_learned:
    collection_method: "post-release retrospective"
    sharing_mechanism: "knowledge base + team meetings"
    improvement_tracking: "action item tracker"

# ============================================
# 可观测性
# ============================================
metrics:
  - test_case_review_completion_rate
  - average_review_time
  - exemption_usage_rate
  - rework_rate_after_feedback
  - automation_progress_tracking

dashboards:
  - test_case_review_progress
  - coverage_trend_analysis
  - quality_score_distribution
  - risk_assessment_summary

# ============================================
# 工具集成
# ============================================
tool_integration:
  supported_formats:
    - "YAML: 规格化结构定义"
    - "Excel: 追溯矩阵和评审清单"
    - "Markdown: 文档和报告"

  version_control:
    required: true
    artifact_tracking: true
    review_history: true

  notification_channels:
    - email: ["qa_lead", "tech_lead", "pm"]
    - slack: "#test-governance"
    - jira: "TEST_PROJECT"

# ============================================
# 元数据
# ============================================
metadata:
  version: 1.0
  created: "2026-02-04"
  author: "QA Governance Team"
  changelog:
    - version: "1.0"
      date: "2026-02-04"
      changes:
        - "初始版本发布"
        - "定义强制、阈值、风险可接受三层标准"
        - "引入需求追溯矩阵验证"
        - "建立人类评审签字机制"
