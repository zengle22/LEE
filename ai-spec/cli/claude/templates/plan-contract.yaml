# ============================================================
# 研发计划 Contract - YAML格式
# 用途: 供AI/系统解析使用，包含人类确认节点
# 版本: 1.0
# ============================================================
#
# Contract 设计原则:
# 1. 关键设计决策需要人类显式确认
# 2. 确认分阶段进行，避免返工
# 3. 每个确认点记录确认人、时间、决策理由
# 4. 未确认的部分标记为 pending_confirmation
#
# ============================================================

# 元数据信息
metadata:
  contract_id: "CONTRACT-{{contract_id}}"
  plan_id: "PLAN-{{plan_id}}"
  prd_id: "{{prd_id}}"
  prd_title: "{{prd_title}}"
  version: "1.0"
  created_at: "{{created_at}}"
  created_by: "plan-architect"

  # Contract 状态机
  # draft -> phase1_confirmed -> phase2_confirmed -> phase3_confirmed -> approved
  contract_status: "draft"

  # 确认阶段定义
  confirmation_phases:
    - phase: 1
      name: "任务拆解确认"
      status: "pending"        # pending | confirmed | rejected | revision_requested
      required: true
    - phase: 2
      name: "依赖关系与排期确认"
      status: "pending"
      required: true
    - phase: 3
      name: "资源分配与风险确认"
      status: "pending"
      required: true

# ============================================================
# 阶段一: 任务拆解 (需人类确认)
# ============================================================
phase1_task_decomposition:

  # 确认状态
  confirmation:
    status: "pending_confirmation"    # pending_confirmation | confirmed | rejected
    confirmed_by: ""
    confirmed_at: ""
    comments: ""
    revision_history: []

  # 需要确认的关键设计决策
  key_decisions:

    # 决策1: 任务粒度
    - decision_id: "DEC-001"
      category: "task_granularity"
      question: "任务拆解粒度是否合适？"
      context: |
        当前拆解策略:
        - 单任务工时控制在 0.5-3 天
        - 任务边界按技术栈划分（前端/后端/数据库）
        - 每个任务有独立的验收标准
      options:
        - id: "A"
          description: "当前粒度合适，保持不变"
          impact: "无需调整"
        - id: "B"
          description: "粒度过粗，需要进一步拆分"
          impact: "任务数量增加，跟踪更精细"
        - id: "C"
          description: "粒度过细，需要合并部分任务"
          impact: "任务数量减少，管理成本降低"
      selected_option: ""
      decision_reason: ""
      decided_by: ""
      decided_at: ""

    # 决策2: 功能模块划分
    - decision_id: "DEC-002"
      category: "module_division"
      question: "功能模块划分是否合理？"
      context: |
        当前模块划分方式:
        {{module_division_summary}}
      options:
        - id: "A"
          description: "模块划分合理，保持不变"
        - id: "B"
          description: "需要调整模块边界"
          requires_input: true
          input_prompt: "请说明需要调整的模块"
      selected_option: ""
      decision_reason: ""
      decided_by: ""
      decided_at: ""

    # 决策3: 任务类型覆盖
    - decision_id: "DEC-003"
      category: "task_coverage"
      question: "是否有遗漏的任务类型？"
      context: |
        当前任务类型分布:
        - 数据库任务: {{database_count}} 个
        - 后端任务: {{backend_count}} 个
        - 前端任务: {{frontend_count}} 个
        - 测试任务: {{test_count}} 个
        - 联调任务: {{integration_count}} 个
        - 文档任务: {{docs_count}} 个
      options:
        - id: "A"
          description: "覆盖完整，无遗漏"
        - id: "B"
          description: "需要补充任务"
          requires_input: true
          input_prompt: "请说明需要补充的任务类型和内容"
      selected_option: ""
      decision_reason: ""
      decided_by: ""
      decided_at: ""

  # 功能模块列表 (待确认)
  features:
    - id: "FEAT-001"
      name: "{{feature_name}}"
      description: "{{feature_description}}"
      priority: "P0"
      source_prd_section: "{{prd_section}}"
      acceptance_criteria:
        - "{{acceptance_1}}"
        - "{{acceptance_2}}"
      # 确认标记
      _confirmation:
        is_confirmed: false
        needs_revision: false
        revision_notes: ""

  # 任务列表 (待确认)
  tasks:
    - id: "TASK-001"
      name: "{{task_name}}"
      type: "database"
      description: "{{task_description}}"
      feature_id: "FEAT-001"
      priority: "P0"
      complexity: "M"
      estimated_hours: {{estimated_hours}}
      acceptance_criteria:
        - "{{criteria_1}}"
        - "{{criteria_2}}"
      # 确认标记
      _confirmation:
        is_confirmed: false
        needs_revision: false
        revision_notes: ""
        complexity_override: null      # 人类可覆盖复杂度评估
        hours_override: null           # 人类可覆盖工时估算

# ============================================================
# 阶段二: 依赖关系与排期 (需人类确认)
# ============================================================
phase2_dependencies_schedule:

  # 确认状态
  confirmation:
    status: "pending_confirmation"
    confirmed_by: ""
    confirmed_at: ""
    comments: ""
    revision_history: []

  # 需要确认的关键设计决策
  key_decisions:

    # 决策4: 依赖关系
    - decision_id: "DEC-004"
      category: "dependencies"
      question: "任务依赖关系是否正确？"
      context: |
        关键依赖链:
        {{critical_dependency_chain}}

        检测到的潜在问题:
        {{dependency_issues}}
      options:
        - id: "A"
          description: "依赖关系正确"
        - id: "B"
          description: "需要调整依赖关系"
          requires_input: true
          input_prompt: "请说明需要调整的依赖"
      selected_option: ""
      decision_reason: ""
      decided_by: ""
      decided_at: ""

    # 决策5: 排期策略
    - decision_id: "DEC-005"
      category: "scheduling_strategy"
      question: "排期策略是否合适？"
      context: |
        当前排期策略:
        - 开始日期: {{start_date}}
        - 预计结束: {{end_date}}
        - 总工期: {{total_workdays}} 工作日
        - 关键路径: {{critical_path_days}} 天

        并行度分析:
        - 最大并行任务数: {{max_parallel}}
        - 平均并行度: {{avg_parallel}}
      options:
        - id: "A"
          description: "排期合理，可以执行"
        - id: "B"
          description: "需要压缩工期"
          requires_input: true
          input_prompt: "目标工期是多少天？"
        - id: "C"
          description: "需要延长工期，降低风险"
          requires_input: true
          input_prompt: "期望延长多少天？"
      selected_option: ""
      decision_reason: ""
      decided_by: ""
      decided_at: ""

    # 决策6: 里程碑设置
    - decision_id: "DEC-006"
      category: "milestones"
      question: "里程碑设置是否合理？"
      context: |
        当前里程碑:
        {{milestones_summary}}
      options:
        - id: "A"
          description: "里程碑设置合理"
        - id: "B"
          description: "需要调整里程碑"
          requires_input: true
          input_prompt: "请说明需要调整的里程碑"
      selected_option: ""
      decision_reason: ""
      decided_by: ""
      decided_at: ""

  # 依赖关系图
  dependencies_graph:
    TASK-001:
      - target: "TASK-002"
        type: "blocks"
        _confirmation:
          is_confirmed: false

  # 里程碑定义
  milestones:
    - id: "M1"
      name: "技术方案评审"
      date: "{{m1_date}}"
      criteria:
        - "技术方案文档完成"
        - "评审会议通过"
      _confirmation:
        is_confirmed: false
        date_override: null

  # 排期结果
  schedule:
    start_date: "{{start_date}}"
    end_date: "{{end_date}}"
    total_workdays: {{total_workdays}}
    critical_path:
      tasks: []
      total_days: {{critical_path_days}}
    _confirmation:
      is_confirmed: false
      date_override:
        start: null
        end: null

# ============================================================
# 阶段三: 资源分配与风险 (需人类确认)
# ============================================================
phase3_resources_risks:

  # 确认状态
  confirmation:
    status: "pending_confirmation"
    confirmed_by: ""
    confirmed_at: ""
    comments: ""
    revision_history: []

  # 需要确认的关键设计决策
  key_decisions:

    # 决策7: 团队配置
    - decision_id: "DEC-007"
      category: "team_config"
      question: "团队配置是否满足需求？"
      context: |
        当前团队配置:
        - 后端: {{backend_count}} 人
        - 前端: {{frontend_count}} 人
        - 测试: {{test_count}} 人

        资源需求分析:
        - 后端需求: {{backend_hours}} 工时
        - 前端需求: {{frontend_hours}} 工时
        - 测试需求: {{test_hours}} 工时

        资源缺口:
        {{resource_gap}}
      options:
        - id: "A"
          description: "当前配置满足需求"
        - id: "B"
          description: "需要增加资源"
          requires_input: true
          input_prompt: "请说明需要增加的资源"
        - id: "C"
          description: "资源有限，需要调整范围或排期"
      selected_option: ""
      decision_reason: ""
      decided_by: ""
      decided_at: ""

    # 决策8: 风险接受度
    - decision_id: "DEC-008"
      category: "risk_acceptance"
      question: "识别出的风险是否可接受？"
      context: |
        高风险项:
        {{high_risks}}

        中风险项:
        {{medium_risks}}
      options:
        - id: "A"
          description: "风险可接受，已有缓解措施"
        - id: "B"
          description: "需要增加缓解措施"
          requires_input: true
          input_prompt: "请补充缓解措施"
        - id: "C"
          description: "风险过高，需要调整计划"
      selected_option: ""
      decision_reason: ""
      decided_by: ""
      decided_at: ""

  # 团队配置
  team:
    backend:
      count: {{backend_count}}
      hours_per_day: 8
      _confirmation:
        is_confirmed: false
        count_override: null
    frontend:
      count: {{frontend_count}}
      hours_per_day: 8
      _confirmation:
        is_confirmed: false
        count_override: null
    test:
      count: {{test_count}}
      hours_per_day: 8
      _confirmation:
        is_confirmed: false
        count_override: null

  # 资源分配
  resource_allocation:
    - week: 1
      backend:
        assigned: 2
        utilization: 0.8
      frontend:
        assigned: 1
        utilization: 0.2
      _confirmation:
        is_confirmed: false
        notes: ""

  # 风险列表
  risks:
    - id: "RISK-001"
      description: "{{risk_description}}"
      category: "technical"
      probability: "medium"
      impact: "high"
      mitigation: "{{mitigation_strategy}}"
      _confirmation:
        is_confirmed: false
        accepted: null           # true: 接受风险, false: 需要额外措施
        additional_mitigation: ""

# ============================================================
# 最终确认与审批
# ============================================================
final_approval:

  # 所有阶段确认后的最终审批
  status: "pending"              # pending | approved | rejected

  # 审批人
  approvers:
    product_manager:
      required: true
      name: ""
      approved: false
      date: ""
      comments: ""
    tech_lead:
      required: true
      name: ""
      approved: false
      date: ""
      comments: ""
    project_manager:
      required: true
      name: ""
      approved: false
      date: ""
      comments: ""

  # 审批条件
  approval_criteria:
    - criterion: "所有阶段确认完成"
      met: false
    - criterion: "无未解决的高风险"
      met: false
    - criterion: "资源已落实"
      met: false

  # 审批后生效
  effective_date: ""

  # Contract 锁定 (审批后不可修改)
  is_locked: false
  locked_at: ""
  locked_by: ""

# ============================================================
# 变更管理
# ============================================================
change_management:

  # 变更请求 (Contract 锁定后的修改需要走变更流程)
  change_requests: []
  # 格式:
  # - change_id: "CHG-001"
  #   requested_by: ""
  #   requested_at: ""
  #   change_type: "scope | schedule | resource"
  #   description: ""
  #   impact_analysis: ""
  #   status: "pending | approved | rejected"
  #   approved_by: ""
  #   approved_at: ""

  # 版本历史
  version_history:
    - version: "1.0"
      date: "{{created_at}}"
      author: "plan-architect"
      changes:
        - "初始版本创建"

# ============================================================
# 统计摘要 (自动计算，无需确认)
# ============================================================
summary:
  total_tasks: {{total_tasks}}
  total_hours: {{total_hours}}
  total_workdays: {{total_workdays}}

  by_type:
    database: {{database_count}}
    backend: {{backend_task_count}}
    frontend: {{frontend_task_count}}
    test: {{test_task_count}}
    integration: {{integration_count}}

  by_priority:
    P0: {{p0_count}}
    P1: {{p1_count}}
    P2: {{p2_count}}

  confirmation_progress:
    phase1: "{{phase1_status}}"
    phase2: "{{phase2_status}}"
    phase3: "{{phase3_status}}"
    overall: "{{overall_progress}}%"
