# ============================================================
# 研发计划 - YAML格式模板
# 用途: 供AI/系统解析使用
# 版本: 1.0
# ============================================================

# 元数据信息
metadata:
  plan_id: "PLAN-{{plan_id}}"           # 计划唯一标识
  prd_id: "{{prd_id}}"                   # 关联的PRD编号
  prd_title: "{{prd_title}}"             # PRD标题
  version: "1.0"                          # 计划版本
  created_at: "{{created_at}}"           # 创建时间 (ISO 8601)
  created_by: "plan-architect"            # 创建者
  last_updated: "{{last_updated}}"       # 最后更新时间
  status: "draft"                         # draft | approved | in_progress | completed

  # 排期信息
  schedule:
    start_date: "{{start_date}}"         # 开始日期 YYYY-MM-DD
    end_date: "{{end_date}}"             # 结束日期 YYYY-MM-DD
    total_workdays: {{total_workdays}}   # 总工作日数
    work_hours_per_day: 8                # 每日工作小时数

# 团队配置
team:
  backend:
    count: {{backend_count}}              # 后端开发人数
    hours_per_day: 8
    skills:
      - "Java/Python/Go"
      - "MySQL/PostgreSQL"
      - "Redis"
  frontend:
    count: {{frontend_count}}             # 前端开发人数
    hours_per_day: 8
    skills:
      - "React/Vue"
      - "TypeScript"
      - "CSS/Tailwind"
  test:
    count: {{test_count}}                 # 测试人数
    hours_per_day: 8
    skills:
      - "功能测试"
      - "接口测试"
      - "自动化测试"
  devops:
    count: {{devops_count}}               # 运维人数 (可为0.5表示兼职)
    hours_per_day: 8

# 功能模块列表
features:
  - id: "FEAT-001"
    name: "{{feature_name}}"
    description: "{{feature_description}}"
    priority: "P0"                        # P0 | P1 | P2
    source_prd_section: "{{prd_section}}" # PRD中的章节引用
    acceptance_criteria:
      - "{{acceptance_1}}"
      - "{{acceptance_2}}"
    tasks:                                # 关联的任务ID列表
      - "TASK-001"
      - "TASK-002"
      - "TASK-003"

# 任务列表
tasks:
  - id: "TASK-001"
    name: "{{task_name}}"
    type: "database"                      # database | backend | frontend | api | test | integration | deploy | docs | review
    description: |
      {{task_description}}
    feature_id: "FEAT-001"                # 关联的功能ID
    priority: "P0"                        # P0 | P1 | P2
    complexity: "M"                       # S | M | L | XL

    # 工时估算
    estimation:
      estimated_hours: {{estimated_hours}}
      buffer_ratio: 0.2                   # 缓冲系数
      total_hours: {{total_hours}}        # 含缓冲的总工时
      confidence: "high"                  # high | medium | low

    # 负责人信息
    assignee:
      role: "backend"                     # backend | frontend | test | devops
      suggested_skills:
        - "MySQL"
        - "表设计"

    # 依赖关系
    dependencies: []                      # 无依赖时为空数组
    # 有依赖时的格式:
    # dependencies:
    #   - task_id: "TASK-000"
    #     type: "blocks"                  # blocks | soft | test | deploy
    #     description: "需要先完成数据库设计"

    # 验收标准
    acceptance_criteria:
      - "{{criteria_1}}"
      - "{{criteria_2}}"

    # 标签
    tags:
      - "核心功能"
      - "数据库"

    # 排期信息
    schedule:
      start_date: "{{task_start_date}}"
      end_date: "{{task_end_date}}"
      workdays: {{task_workdays}}
      is_critical_path: false             # 是否在关键路径上

    # 风险标记
    risks:
      - "{{risk_description}}"

    # 备注
    notes: ""

  # 后端任务示例
  - id: "TASK-002"
    name: "[用户模块] 实现用户注册接口"
    type: "backend"
    description: |
      实现用户注册的后端API，包括:
      - 参数校验
      - 密码加密
      - 用户信息入库
      - 发送验证邮件
    feature_id: "FEAT-001"
    priority: "P0"
    complexity: "M"
    estimation:
      estimated_hours: 8
      buffer_ratio: 0.2
      total_hours: 9.6
      confidence: "high"
    assignee:
      role: "backend"
      suggested_skills:
        - "RESTful API"
        - "安全"
    dependencies:
      - task_id: "TASK-001"
        type: "blocks"
        description: "需要用户表结构完成"
    acceptance_criteria:
      - "接口返回正确的响应格式"
      - "密码使用bcrypt加密存储"
      - "重复邮箱返回明确错误"
      - "单元测试覆盖率>80%"
    tags:
      - "API"
      - "用户模块"
    schedule:
      start_date: "{{date}}"
      end_date: "{{date}}"
      workdays: 1
      is_critical_path: true
    risks: []
    notes: ""

  # 前端任务示例
  - id: "TASK-003"
    name: "[用户模块] 开发注册页面"
    type: "frontend"
    description: |
      实现用户注册前端页面，包括:
      - 表单UI实现
      - 表单校验
      - API调用
      - 错误提示
    feature_id: "FEAT-001"
    priority: "P0"
    complexity: "M"
    estimation:
      estimated_hours: 12
      buffer_ratio: 0.2
      total_hours: 14.4
      confidence: "medium"
    assignee:
      role: "frontend"
      suggested_skills:
        - "React/Vue"
        - "表单处理"
    dependencies:
      - task_id: "TASK-002"
        type: "soft"
        description: "API定义完成后可并行开发，联调需要API完成"
    acceptance_criteria:
      - "页面符合设计稿"
      - "表单校验完整"
      - "错误提示友好"
      - "移动端适配"
    tags:
      - "页面"
      - "用户模块"
    schedule:
      start_date: "{{date}}"
      end_date: "{{date}}"
      workdays: 2
      is_critical_path: true
    risks:
      - "设计稿可能有调整"
    notes: "可与TASK-002并行，使用Mock数据开发"

# 依赖关系图 (邻接表表示)
dependencies_graph:
  TASK-001:
    - target: "TASK-002"
      type: "blocks"
  TASK-002:
    - target: "TASK-003"
      type: "soft"
    - target: "TASK-004"
      type: "blocks"
  TASK-003:
    - target: "TASK-005"
      type: "blocks"

# 里程碑定义
milestones:
  - id: "M1"
    name: "技术方案评审"
    date: "{{m1_date}}"
    description: "完成技术方案设计并通过评审"
    criteria:
      - "技术方案文档完成"
      - "数据库设计完成"
      - "接口定义完成"
      - "评审会议通过"
    tasks:
      - "TASK-001"
    status: "pending"                     # pending | completed | delayed

  - id: "M2"
    name: "核心功能开发完成"
    date: "{{m2_date}}"
    description: "核心功能开发完成，可进行演示"
    criteria:
      - "核心功能可运行"
      - "主流程可演示"
    tasks:
      - "TASK-002"
      - "TASK-003"
    status: "pending"

  - id: "M3"
    name: "功能开发完成"
    date: "{{m3_date}}"
    description: "所有功能开发完成"
    criteria:
      - "所有功能点开发完成"
      - "代码评审完成"
    tasks:
      - "TASK-004"
      - "TASK-005"
    status: "pending"

  - id: "M4"
    name: "测试完成"
    date: "{{m4_date}}"
    description: "测试用例全部通过"
    criteria:
      - "测试用例100%通过"
      - "Bug修复完成"
      - "性能测试通过"
    tasks:
      - "TASK-006"
    status: "pending"

  - id: "M5"
    name: "上线发布"
    date: "{{m5_date}}"
    description: "生产环境部署完成"
    criteria:
      - "生产环境部署成功"
      - "监控告警配置完成"
      - "回滚方案就绪"
    tasks:
      - "TASK-007"
    status: "pending"

# 关键路径
critical_path:
  tasks:
    - "TASK-001"
    - "TASK-002"
    - "TASK-003"
    - "TASK-005"
    - "TASK-006"
  total_days: {{critical_path_days}}
  description: "关键路径上的任务延期将直接影响整体交付时间"

# 统计摘要
summary:
  total_tasks: {{total_tasks}}
  total_hours: {{total_hours}}
  total_workdays: {{total_workdays}}

  by_type:
    database: {{database_count}}
    backend: {{backend_task_count}}
    frontend: {{frontend_task_count}}
    api: {{api_count}}
    test: {{test_task_count}}
    integration: {{integration_count}}
    deploy: {{deploy_count}}
    docs: {{docs_count}}
    review: {{review_count}}

  by_priority:
    P0: {{p0_count}}
    P1: {{p1_count}}
    P2: {{p2_count}}

  by_complexity:
    S: {{s_count}}
    M: {{m_count}}
    L: {{l_count}}
    XL: {{xl_count}}

  by_role:
    backend:
      tasks: {{backend_role_tasks}}
      hours: {{backend_role_hours}}
    frontend:
      tasks: {{frontend_role_tasks}}
      hours: {{frontend_role_hours}}
    test:
      tasks: {{test_role_tasks}}
      hours: {{test_role_hours}}

# 风险列表
risks:
  - id: "RISK-001"
    description: "{{risk_description}}"
    category: "technical"                 # technical | resource | schedule | external
    probability: "medium"                 # high | medium | low
    impact: "high"                        # high | medium | low
    risk_score: 6                         # probability * impact (1-9)
    mitigation: "{{mitigation_strategy}}"
    contingency: "{{contingency_plan}}"
    owner: "{{risk_owner}}"
    related_tasks:
      - "TASK-001"
    status: "open"                        # open | mitigated | closed

# 资源分配（按周）
resource_allocation:
  - week: 1
    start_date: "{{week1_start}}"
    end_date: "{{week1_end}}"
    backend:
      assigned: 2
      tasks: ["TASK-001", "TASK-002"]
      utilization: 0.8                    # 资源利用率
    frontend:
      assigned: 1
      tasks: []
      utilization: 0.2
    test:
      assigned: 0
      tasks: []
      utilization: 0
    notes: "后端先行，完成数据库和核心API"

# 变更历史
changelog:
  - version: "1.0"
    date: "{{created_at}}"
    author: "plan-architect"
    changes:
      - "初始版本创建"

# 审批信息
approval:
  product_manager:
    name: ""
    approved: false
    date: ""
    comments: ""
  tech_lead:
    name: ""
    approved: false
    date: ""
    comments: ""
  project_manager:
    name: ""
    approved: false
    date: ""
    comments: ""
