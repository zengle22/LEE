# Release Gate Specification v1.0
# 发布门禁规范 - 上线前的最终质量检查

kind: gate
version: 1.0

# ============================================
# 基础标识
# ============================================
id: gate.release.release_gate
name: Release Gate
description: >
  发布上线前的最终质量门禁。
  确保功能完整、E2E 测试通过、埋点实现、性能达标。
  与 Development Pipeline 集成，验证所有 Phase 完成状态。
owner: release-governance
tags: [gate, release, e2e, quality, development-pipeline]

# ============================================
# 触发条件
# ============================================
trigger:
  when:
    - release_branch_ready
    - staging_deployed
    - acceptance_review_complete  # 新增: 验收完成触发
  context:
    requires:
      - ui_map_file: "spec/ui/ui.map.yaml"
      - staging_url: "$STAGING_URL"
      - acceptance_report: "output/acceptance-report.md"  # 新增
      - phase_outputs: "04-phases/*/output/"  # 新增

# ============================================
# 检查规则
# ============================================
checks:
  # ---------- Phase 完成检查 (Development Pipeline) ----------
  - id: all_phases_completed
    name: 所有 Phase 完成
    description: 所有规划的 Phase 必须处于 completed 状态
    severity: blocker
    rule: |
      phases.all(p => p.status == "completed")
    message: "存在未完成的 Phase"
    fix: "完成所有待办 Phase"

  - id: all_phase_gates_passed
    name: 所有 Phase Gate 通过
    description: 每个 Phase 的门禁检查必须通过
    severity: blocker
    rule: |
      phases.all(p => p.gate_status == "passed")
    message: "存在未通过门禁的 Phase"
    fix: "修复未通过门禁的 Phase"

  - id: acceptance_approved
    name: 验收通过
    description: 验收审查必须通过
    severity: blocker
    rule: |
      acceptance_report.verdict in ["approve", "conditional_approve"]
    message: "验收审查未通过"
    fix: "解决验收问题后重新提交"

  - id: integration_verified
    name: 集成验证通过
    description: 系统集成必须验证通过
    severity: blocker
    rule: |
      integration_report.status == "success"
    message: "系统集成未通过"
    fix: "修复集成问题"

  # ---------- E2E 测试 ----------
  - id: e2e_tests
    name: E2E 测试通过
    description: 所有端到端测试必须通过
    severity: blocker
    command: npm run test:e2e
    timeout: 600s
    environment: staging
    message: "E2E 测试失败"
    fix: "修复失败的 E2E 测试用例"

  # ---------- P0 页面 E2E 覆盖 ----------
  - id: p0_e2e_coverage
    name: P0 页面 E2E 覆盖
    description: 所有 P0 页面必须有 E2E 测试
    severity: blocker
    rule: |
      ui_map.pages
        .filter(p => p.priority == 'P0')
        .every(p => e2e_spec_exists(p.id))
    message: "P0 页面缺少 E2E 测试"
    fix: "为所有 P0 页面添加 E2E 测试"

  # ---------- 功能完整性 ----------
  - id: feature_completeness
    name: 功能完整性
    description: 所有 P0/P1 功能已实现
    severity: blocker
    rule: |
      ui_map.pages
        .filter(p => p.priority == 'P0' || p.priority == 'P1')
        .every(p => p.status == 'implemented' || p.status == 'tested')
    message: "有未完成的 P0/P1 功能"
    fix: "完成所有 P0/P1 功能的开发"

  # ---------- 埋点验证 ----------
  - id: tracking_implementation
    name: 埋点实现验证
    description: 契约中定义的埋点必须在代码中实现
    severity: major
    when: ui_map.quality.requireTracking == true
    rule: |
      ui_map.pages.every(page => {
        const contract = load_contract(page.contracts.page);
        const events = [...(contract.tracking?.exposure || []),
                        ...(contract.tracking?.actions?.map(a => a.event) || [])];
        return events.every(e => tracking_implemented(e));
      })
    message: "埋点未完全实现"
    fix: "确保所有契约定义的埋点已在代码中实现"

  # ---------- 可访问性全量测试 ----------
  - id: a11y_full_audit
    name: 可访问性全量审计
    description: 所有页面通过可访问性审计
    severity: major
    when: ui_map.quality.requireA11y == true
    command: npm run test:a11y:full
    environment: staging
    threshold:
      critical: 0
      serious: 0
    message: "可访问性审计未通过"
    fix: "修复所有可访问性问题"

  # ---------- 性能测试 ----------
  - id: performance_audit
    name: 性能审计
    description: Lighthouse 性能评分达标
    severity: major
    command: npm run audit:performance
    environment: staging
    threshold:
      performance: 80
      accessibility: 90
      best-practices: 80
      seo: 80
    message: "性能评分未达标"
    fix: "优化页面性能"

  # ---------- 视觉回归测试 ----------
  - id: visual_regression
    name: 视觉回归测试
    description: UI 无意外的视觉变化
    severity: major
    command: npm run test:visual
    environment: staging
    threshold:
      diff_percentage: 0.1
    message: "发现视觉回归"
    fix: "检查并确认视觉变化是否符合预期"

  # ---------- 安全扫描 ----------
  - id: security_scan
    name: 安全扫描
    description: 无已知安全漏洞
    severity: blocker
    command: npm audit --production
    threshold:
      critical: 0
      high: 0
    message: "发现安全漏洞"
    fix: "修复或更新有漏洞的依赖"

  # ---------- 浏览器兼容性 ----------
  - id: browser_compatibility
    name: 浏览器兼容性
    description: 主要浏览器兼容性测试
    severity: major
    command: npm run test:e2e:browsers
    browsers:
      - chrome:latest
      - firefox:latest
      - safari:latest
      - edge:latest
    message: "浏览器兼容性问题"
    fix: "修复兼容性问题"

  # ---------- API 健康检查 ----------
  - id: api_health
    name: API 健康检查
    description: 依赖的 API 服务正常
    severity: blocker
    rule: |
      api_endpoints.every(endpoint =>
        health_check(endpoint).status == 'healthy'
      )
    message: "API 服务异常"
    fix: "确保 API 服务正常运行"

  # ---------- 数据库迁移 ----------
  - id: db_migration
    name: 数据库迁移状态
    description: 数据库迁移已完成
    severity: blocker
    rule: |
      db_migration_status() == 'up_to_date'
    message: "数据库迁移未完成"
    fix: "运行数据库迁移"

# ============================================
# 通过条件
# ============================================
pass_criteria:
  blocker: 0        # 不允许有 blocker
  major: 0          # 不允许有 major
  minor: null       # minor 仅警告

# ============================================
# 人工确认项
# ============================================
manual_checklist:
  - id: product_signoff
    name: 产品验收确认
    description: 产品经理确认功能符合需求
    required: true
    assignee: product-manager

  - id: design_signoff
    name: 设计验收确认
    description: 设计师确认 UI 符合设计稿
    required: true
    assignee: ui-designer

  - id: qa_signoff
    name: QA 验收确认
    description: 测试工程师确认测试通过
    required: true
    assignee: qa-engineer

# ============================================
# 输出产物
# ============================================
outputs:
  - type: report
    format: json
    path: "output/gate-reports/release-gate-{version}.json"
  - type: summary
    format: markdown
    path: "output/gate-reports/release-gate-{version}.md"
  - type: release_notes
    format: markdown
    path: "output/releases/{version}/RELEASE_NOTES.md"

# ============================================
# 后续动作
# ============================================
actions:
  on_pass:
    - log: "Release Gate 通过，准备发布"
    - create_release:
        version: $VERSION
        tag: v$VERSION
        notes: $RELEASE_NOTES
    - notify:
        channel: release
        message: "v{version} 通过 Release Gate，准备发布到生产环境"

  on_fail:
    - log: "Release Gate 未通过，暂停发布"
    - notify:
        channel: release
        message: "v{version} Release Gate 失败，请修复以下问题: {failed_checks_summary}"
    - block_deployment:
        environment: production
