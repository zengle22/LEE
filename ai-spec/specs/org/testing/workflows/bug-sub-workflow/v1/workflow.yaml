# Bug Sub-workflow v1.0
# 单 Bug 完整生命周期管理 - 跨团队协同流转

kind: workflow
version: 1.0

# ============================================
# 基础标识
# ============================================
id: workflow.test.bug_sub
name: Bug Lifecycle Sub-workflow
description: >
  单 Bug 的完整生命周期管理，支持：
  - 独立状态机，不可跳跃状态
  - 跨研发/产品/测试/平台团队流转
  - 人类介入的特殊分支（安全/财务/需求争议）
  - 严格的角色权限边界（防止自证闭环）
  - 并行推进，事件通知主流程

owner: bug-governance
tags: [workflow, bug, lifecycle, cross-team, permission-controlled]

# ============================================
# Bug Contract 核心字段
# ============================================
entity: bug.contract.yaml
schema: ../../contracts/bug-contract/v1/schema.yaml

# ============================================
# 状态机定义（强制，不可跳跃）
# ============================================
state_machine:
  states:
    # 主路径状态
    - NEW: "新建"
    - TRIAGED: "已分流"
    - ROUTED: "已分配"
    - DEBUGGED: "已诊断"
    - FIXING: "修复中"
    - FIXED: "已修复"
    - VERIFYING: "验证中"
    - VERIFIED: "已验证"
    - CLOSED: "已关闭"

    # 阻塞分支状态
    - BLOCKED_HUMAN: "阻塞-需人类介入"
    - BLOCKED_PM: "阻塞-需产品澄清"
    - BLOCKED_ENV: "阻塞-环境/不稳定"
    - BLOCKED_DEPENDENCY: "阻塞-依赖其他 Bug"

  transitions:
    NEW:
      - to: TRIAGED
        trigger: "triage_completed"
        required_fields: [severity, category, evidence, reproduction_steps]

    TRIAGED:
      - to: ROUTED
        trigger: "owner_assigned"
        condition: "category NOT IN [requirement, env, flaky] AND needs_human == false"

      - to: BLOCKED_PM
        trigger: "needs_pm_clarification"
        condition: "category == requirement OR decision.needs_human == true (reason: ambiguity)"

      - to: BLOCKED_HUMAN
        trigger: "needs_human_decision"
        condition: "decision.needs_human == true (reason: security/data_loss/payment/legal/major_scope_change)"

      - to: BLOCKED_ENV
        trigger: "environment_issue_detected"
        condition: "category IN [env, flaky]"

    BLOCKED_PM:
      - to: ROUTED
        trigger: "pm_clarified"
        required_fields: [decision.pm_resolution]
      - to: CLOSED
        trigger: "pm_rejected_as_by_design"
        required_fields: [decision.pm_resolution == by_design]

    BLOCKED_HUMAN:
      - to: ROUTED
        trigger: "human_approved"
        required_fields: [decision.human_approver, decision.human_decision]
      - to: CLOSED
        trigger: "human_rejected"
        required_fields: [decision.resolution == wont_fix OR by_design]

    BLOCKED_ENV:
      - to: ROUTED
        trigger: "env_stabilized"
        required_fields: [infra_fix_details]
      - to: CLOSED
        trigger: "confirmed_not_a_bug"
        required_fields: [decision.resolution == cannot_reproduce]

    BLOCKED_DEPENDENCY:
      - to: ROUTED
        trigger: "dependency_resolved"
        required_fields: [dependency.blocking_bug_closed]

    ROUTED:
      - to: DEBUGGED
        trigger: "debug_analysis_completed"
        condition: "severity IN [P0, P1]"
        required_fields: [analysis.root_cause, analysis.fix_plan]

      - to: FIXING
        trigger: "developer_started_fix"
        condition: "severity IN [P2, P3] OR debug_skipped"

    DEBUGGED:
      - to: FIXING
        trigger: "fix_work_started"

    FIXING:
      - to: FIXED
        trigger: "fix_committed"
        required_fields: [fix.fix_commit, fix.fix_version, fix.change_summary]

    FIXED:
      - to: VERIFYING
        trigger: "qa_started_verification"

    VERIFYING:
      - to: VERIFIED
        trigger: "verification_passed"
        required_fields: [verification.verified_by, verification.verified_in_round]
        condition: "verification.verified_by != routing.owner_agent"  # 防止自证

      - to: FIXING
        trigger: "verification_failed"
        note: "回退重新修复"

      - to: BLOCKED_DEPENDENCY
        trigger: "depends_on_other_bug"

    VERIFIED:
      - to: CLOSED
        trigger: "bug_closed"
        required_fields: [decision.resolution, closed_by, closed_at]

    CLOSED: []  # 终态

# ============================================
# 角色权限边界（硬规则）
# ============================================
role_permissions:
  qa_agent:
    can_write:
      - status: [NEW, TRIAGED, VERIFYING, VERIFIED, CLOSED]
      - evidence.*
      - reproduction_steps
      - verification.*
      - decision.resolution (仅当 status=CLOSED)
    cannot_write:
      - fix.*
      - analysis.root_cause (仅 debug_agent)
      - decision.pm_resolution
      - decision.human_decision

  debug_agent:
    can_write:
      - analysis.root_cause
      - analysis.fix_plan
      - analysis.risk_area
    cannot_write:
      - status
      - fix.*
      - verification.*
      - decision.*

  dev_agent:
    can_write:
      - status: [FIXING, FIXED]
      - fix.*
      - analysis.root_cause (补充)
    cannot_write:
      - verification.*
      - decision.*
      - status: [VERIFIED, CLOSED]

  pm_agent:
    can_write:
      - status: [BLOCKED_PM -> ROUTED, BLOCKED_PM -> CLOSED]
      - decision.pm_resolution
      - decision.business_impact
    cannot_write:
      - fix.*
      - verification.*
      - technical fields

  human_approver:
    can_write:
      - status: [BLOCKED_HUMAN -> ROUTED, BLOCKED_HUMAN -> CLOSED]
      - decision.human_decision
      - decision.human_approver
      - decision.resolution (for wont_fix/by_design)
    cannot_write:
      - fix.*
      - verification.*

  platform_agent:
    can_write:
      - status: [BLOCKED_ENV -> ROUTED, BLOCKED_ENV -> CLOSED]
      - infra_fix_details
    cannot_write:
      - application level fields

# ============================================
# 人类介入判定规则（自动触发）
# ============================================
human_intervention_rules:
  auto_trigger_human_gate:
    - condition: "category == security"
      reason: "安全相关 Bug 必须人类审批"
      examples: ["权限绕过", "敏感信息泄露", "注入风险"]

    - condition: "category == data_loss OR category == payment"
      reason: "数据不可逆风险或财务相关"
      examples: ["数据丢失", "重复扣费", "金额计算错误"]

    - condition: "analysis.risk_area CONTAINS 'irreversible'"
      reason: "不可回滚的变更"

    - condition: "decision.scope_change == major"
      reason: "修复等同改需求，影响验收口径"

    - condition: "decision.pm_resolution == cannot_decide"
      reason: "产品无法裁决的需求歧义"

    - condition: "severity == P0 AND detected_in == production"
      reason: "线上 P0 事故需要人类确认回滚/止血策略"

  human_gate_sla:
    timeout: 4h
    escalation: [qa_lead, tech_lead, product_owner]

# ============================================
# Bug 子流程步骤定义
# ============================================
stages:
  # ========== Stage 1: 创建与分流 ==========
  - id: creation
    name: "Bug 创建"
    description: "测试失败时自动创建 Bug 契约"
    trigger: event.test_failure
    steps:
      - id: create_bug_contract
        name: "创建 Bug 契约"
        run: agent.test.bug_creator
        inputs:
          - test_failure_event: "$EVENT"
        outputs:
          - path: "bugs/$BUG_ID.contract.yaml"
        initial_fields:
          status: NEW
          detected_in:
            round_id: "$EVENT.round_id"
            version: "$EVENT.version"
            env: "$EVENT.env"
          evidence:
            trace_id: "$EVENT.trace_id"
            request_id: "$EVENT.request_id"
            screenshots: "$EVENT.screenshots"
            logs: "$EVENT.logs"

  - id: triage
    name: "Bug 分流"
    description: "补充复现步骤、定级、分配 owner"
    steps:
      - id: enrich_evidence
        name: "补充证据"
        run: agent.test.evidence_collector
        inputs:
          - bug_id: "$BUG_ID"
        outputs:
          - path: "bugs/$BUG_ID.contract.yaml"
        updates:
          evidence:
            reproduction_steps: "..."
            environment_details: "..."

      - id: classify_and_route
        name: "分类与路由"
        run: agent.test.bug_triager
        inputs:
          - bug_id: "$BUG_ID"
        outputs:
          - path: "bugs/$BUG_ID.contract.yaml"
        updates:
          status: TRIAGED
          severity: "P0/P1/P2/P3"
          category: "functional/performance/security/data/requirement/flaky/env"
          routing:
            owner_team: "..."
            owner_agent: "..."

      - id: route_decision
        name: "路由决策"
        type: decision
        decision_logic: |
          IF category == requirement OR decision.needs_human (ambiguity):
            next_state = BLOCKED_PM
            assign_to = pm_agent
          ELIF decision.needs_human (security/data_loss/payment/legal/major_scope_change):
            next_state = BLOCKED_HUMAN
            assign_to = human_gate
          ELIF category IN [env, flaky]:
            next_state = BLOCKED_ENV
            assign_to = platform_agent
          ELSE:
            next_state = ROUTED
            assign_to = routing.owner_agent

  # ========== Stage 2: 诊断（可选但推荐）==========
  - id: debug_analysis
    name: "Bug 诊断"
    description: "P0/P1 自动触发 Debug Agent 分析"
    condition: "severity IN [P0, P1] AND status == ROUTED"
    steps:
      - id: trigger_debug_agent
        name: "触发 Debug Agent"
        run: agent.test.debug_agent
        inputs:
          - bug_id: "$BUG_ID"
          - evidence: "$BUG.evidence"
        outputs:
          - path: "bugs/$BUG_ID.contract.yaml"
        updates:
          status: DEBUGGED
          analysis:
            root_cause: "..."
            fix_plan: "..."
            risk_area: [...]
            confidence: "..."

  # ========== Stage 3: 修复 ==========
  - id: fix
    name: "Bug 修复"
    description: "开发团队修复并提交"
    steps:
      - id: developer_fix
        name: "开发修复"
        run: routing.owner_agent
        inputs:
          - bug_id: "$BUG_ID"
          - analysis: "$BUG.analysis"
        outputs:
          - path: "bugs/$BUG_ID.contract.yaml"
        updates:
          status: FIXING -> FIXED
          fix:
            fix_commit: "..."
            fix_version: "..."
            change_summary: "..."
        notify:
          - event: bug_fixed
            target: test_main_workflow

  # ========== Stage 4: 验证 ==========
  - id: verification
    name: "Bug 验证"
    description: "QA 验证修复效果并回归"
    steps:
      - id: verify_fix
        name: "验证修复"
        run: agent.test.fix_verifier
        inputs:
          - bug_id: "$BUG_ID"
        outputs:
          - path: "bugs/$BUG_ID.contract.yaml"
        updates:
          status: VERIFYING -> VERIFIED
          verification:
            verified_by: "qa_agent"
            verified_in_round: "..."
            regression_case_ids: [...]
        validation:
          - rule: "verification.verified_by != routing.owner_agent"
            error: "不允许自证闭环"

  # ========== Stage 5: 关闭 ==========
  - id: closure
    name: "Bug 关闭"
    description: "QA 关闭 Bug 并记录结论"
    steps:
      - id: close_bug
        name: "关闭 Bug"
        run: agent.test.bug_closer
        inputs:
          - bug_id: "$BUG_ID"
        outputs:
          - path: "bugs/$BUG_ID.contract.yaml"
        updates:
          status: CLOSED
          decision:
            resolution: "fixed/by_design/wont_fix/duplicate/cannot_reproduce"
          closed_by: "..."
          closed_at: "..."
        notify:
          - event: bug_closed
            target: test_main_workflow

# ============================================
# 阻塞分支处理
# ============================================
blocked_branches:
  pm_clarification:
    description: "需求争议/歧义"
    handler: pm_agent
    steps:
      - id: pm_review
        name: "产品审核"
        run: pm_agent
        inputs:
          - bug_id: "$BUG_ID"
        outputs:
          - path: "bugs/$BUG_ID.contract.yaml"
        updates:
          decision:
            pm_resolution: "by_design/change_required/clarified"
            business_impact: "..."
        next_state_decision: |
          IF pm_resolution == by_design:
            status = CLOSED
            resolution = by_design
          ELSE:
            status = ROUTED
            category = functional

  human_decision:
    description: "安全/财务/法律/重大变更"
    handler: human_gate
    required_approvers:
      - role: security_officer (if category=security)
      - role: finance_lead (if category=payment/data_loss)
      - role: legal (if category=legal/compliance)
      - role: product_owner (if scope_change=major)
    steps:
      - id: human_review
        name: "人类审核"
        type: human_decision
        human_gate: bug_critical_review
        inputs_to_review:
          - "bugs/$BUG_ID.contract.yaml"
          - "analysis/debug-report.md"
        review_checklist:
          - "安全风险是否可接受"
          - "数据影响是否可逆"
          - "是否需要法律/合规确认"
          - "修复方案是否合理"
        actions:
          approve:
            label: "批准修复"
            next_state: ROUTED
          approve_with_conditions:
            label: "有条件批准"
            next_state: ROUTED
            requires_comment: true
          reject:
            label: "拒绝/设计如此"
            next_state: CLOSED
            resolution: wont_fix OR by_design

  env_stabilization:
    description: "环境/不稳定问题"
    handler: platform_agent
    steps:
      - id: infra_fix
        name: "基础设施修复"
        run: platform_agent
        inputs:
          - bug_id: "$BUG_ID"
        outputs:
          - path: "bugs/$BUG_ID.contract.yaml"
        updates:
          infra_fix_details: "..."
          status: ROUTED OR CLOSED

# ============================================
# 事件通知（给主流程）
# ============================================
events:
  emit:
    - bug_created:
        when: "status == NEW"
        notify: test_main_workflow
        payload: {bug_id, severity, category}

    - bug_triaged:
        when: "status == TRIAGED"
        notify: test_main_workflow
        payload: {bug_id, severity, routing}

    - bug_blocked_critical:
        when: "status IN [BLOCKED_HUMAN, BLOCKED_PM] AND severity == P0"
        notify: test_main_workflow
        payload: {bug_id, block_reason, escalation_needed}

    - bug_fixed:
        when: "status == FIXED"
        notify: test_main_workflow
        payload: {bug_id, fix_version, needs_verification}

    - bug_verified:
        when: "status == VERIFIED"
        notify: test_main_workflow
        payload: {bug_id, verified_in_round}

    - bug_closed:
        when: "status == CLOSED"
        notify: test_main_workflow
        payload: {bug_id, resolution}

# ============================================
# SLA 与超时处理
# ============================================
sla:
  triage:
    timeout: 2h
    escalation: qa_lead

  debug_p0:
    timeout: 4h
    escalation: tech_lead

  fix_p0:
    timeout: 24h
    escalation: [tech_lead, pm]

  fix_p1:
    timeout: 48h
    escalation: tech_lead

  human_decision:
    timeout: 4h
    escalation: [qa_lead, tech_lead, product_owner]

  verification:
    timeout: 12h
    escalation: qa_lead

# ============================================
# 可观测性
# ============================================
metrics:
  - bug_age_by_severity
  - time_in_each_state
  - triage_time
  - fix_time
  - verification_time
  - human_intervention_rate
  - self_cert_violations (should be 0)

# ============================================
# 元数据
# ============================================
metadata:
  version: 1.0
  created: "2026-01-15"
  depends_on:
    - workflow.test.main_pipeline_v2
  integration_model: event_driven
