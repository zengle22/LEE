# Test Main Pipeline v2.0
# 多轮循环测试主流程 - 支持持续迭代与门禁控制

kind: workflow
version: 2.0

# ============================================
# 基础标识
# ============================================
id: workflow.test.main_pipeline_v2
name: Test Main Pipeline (Multi-Round)
description: >
  多轮循环测试主流程，支持：
  - 多轮迭代直到达到出测标准
  - 每轮产出独立的测试报告和 bug 清单
  - Bug 子流程并行推进（事件驱动）
  - 严格的门禁控制与产物契约化
  - 风险回归而非全量回归（效率优化）

owner: test-governance
tags: [workflow, testing, multi-round, event-driven, gate-controlled]

# ============================================
# 核心概念
# ============================================
concepts:
  test_round:
    description: "测试轮次，每轮包含完整的测试执行和收敛"
    attributes:
      - round_id: "轮次唯一标识"
      - target_version: "测试版本"
      - suites_executed: "执行的测试套件"
      - bugs_found: "发现的 bug 列表"
      - conclusion: "轮次结论（next_round/release/block）"

  bug_lifecycle:
    description: "Bug 从发现到关闭的完整生命周期"
    ref: ../bug-sub-workflow/v1/workflow.yaml

# ============================================
# 契约定义
# ============================================
contracts:
  inputs:
    - release_manifest:
        path: "release-manifest.yaml"
        schema: ../../contracts/release-manifest/v1/schema.json
        description: "研发提测包清单"

  outputs:
    - test_rounds:
        path: "test-rounds/"
        description: "每轮测试产出目录"
        structure: |
          test-rounds/
          ├── round-001/
          │   ├── test-round.yaml
          │   ├── smoke-report.json
          │   ├── e2e-report.json
          │   ├── api-report.json
          │   └── round-summary.md
          └── round-002/
              └── ...

    - bugs:
        path: "bugs/"
        description: "Bug 契约文件目录"
        structure: |
          bugs/
          ├── BUG-2026-0001.contract.yaml
          ├── BUG-2026-0002.contract.yaml
          └── ...

    - final_report:
        path: "test-report-final.yaml"
        schema: ../../contracts/test-report/v2/schema.json
        description: "最终测试报告"

# ============================================
# 主流程状态机
# ============================================
state_machine:
  states:
    - INIT: "初始化"
    - PRECHECK_MANIFEST: "提测包预检"
    - ENV_READY: "环境就绪"
    - SMOKE: "冒烟测试"
    - IN_TEST_EXECUTION: "系统测试执行中"
    - TRIAGE_SYNC: "轮次同步（Bug 分流）"
    - FIX_VERIFY_LOOP: "修复验证循环"
    - ROUND_SIGNOFF: "轮次签字"
    - RELEASE_CANDIDATE: "出测候选"
    - RELEASED: "已交付"
    - BLOCKED: "阻塞（退回研发）"

  transitions:
    INIT:
      - to: PRECHECK_MANIFEST
        trigger: "manifest_submitted"

    PRECHECK_MANIFEST:
      - to: ENV_READY
        trigger: "manifest_gate_pass"
      - to: BLOCKED
        trigger: "manifest_gate_fail"

    ENV_READY:
      - to: SMOKE
        trigger: "env_deployed_and_ready"
      - to: BLOCKED
        trigger: "env_setup_failed"

    SMOKE:
      - to: IN_TEST_EXECUTION
        trigger: "smoke_gate_pass"
      - to: BLOCKED
        trigger: "smoke_gate_fail"
        note: "冒烟失败直接退回研发"

    IN_TEST_EXECUTION:
      - to: TRIAGE_SYNC
        trigger: "test_suites_completed"
      - to: TRIAGE_SYNC
        trigger: "critical_bug_detected"
        note: "P0 Bug 触发提前收敛"

    TRIAGE_SYNC:
      - to: FIX_VERIFY_LOOP
        trigger: "triage_completed"
      - to: ROUND_SIGNOFF
        trigger: "no_bugs_found"

    FIX_VERIFY_LOOP:
      - to: FIX_VERIFY_LOOP
        trigger: "fix_in_progress"
        note: "轮内修复验证循环"
      - to: ROUND_SIGNOFF
        trigger: "round_goal_met"

    ROUND_SIGNOFF:
      - to: RELEASE_CANDIDATE
        trigger: "exit_criteria_met"
      - to: ENV_READY
        trigger: "next_round_required"
        note: "开始新一轮测试"
      - to: BLOCKED
        trigger: "unresolvable_issues"

    RELEASE_CANDIDATE:
      - to: RELEASED
        trigger: "final_signoff_approved"
      - to: ENV_READY
        trigger: "last_minute_issue"

    RELEASED: []
    BLOCKED: []

# ============================================
# 循环控制
# ============================================
loop_control:
  max_rounds: 10
  round_timeout: 72h

  round_start_condition:
    - "release_manifest_updated OR first_round"
    - "env_ready == true"
    - "previous_round_concluded == true"

  round_completion_condition:
    - "all_test_suites_executed"
    - "all_new_bugs_triaged"
    - "round_goal_evaluated"

  next_round_triggers:
    - "open_p0_count > 0"
    - "open_p1_count > p1_threshold"
    - "critical_regression_detected"
    - "human_required_bugs_unresolved"

  exit_loop_triggers:
    - "exit_criteria_met"
    - "max_rounds_exceeded"
    - "stakeholder_abort"

# ============================================
# Bug 子流程集成（事件驱动）
# ============================================
bug_integration:
  model: event_driven

  events:
    test_failure:
      action: create_or_update_bug
      trigger: bug_sub_workflow
      async: true
      note: "测试失败立即触发 Bug 子流程，不阻塞主流程"

    bug_state_change:
      action: notify_main_workflow
      update: bug_inventory
      note: "Bug 状态变化通知主流程更新清单"

  bug_sub_workflow:
    ref: ../bug-sub-workflow/v1/workflow.yaml
    spawn_on: test_failure
    parallel: true
    max_concurrent: 100

  main_workflow_read_points:
    - point: SMOKE
      reads: "bugs WHERE severity=P0 AND category=core_flow"
      action: "IF any THEN block_and_return"

    - point: TRIAGE_SYNC
      reads: "bugs WHERE status=new"
      action: "MUST complete triage before proceed"

    - point: ROUND_SIGNOFF
      reads: "bugs WHERE status IN [new,triaged,fixing,fixed]"
      action: "evaluate_exit_criteria"

# ============================================
# 主流程步骤定义
# ============================================
stages:
  # ========== Round Loop Start ==========
  - id: round_init
    name: "轮次初始化"
    description: "创建新轮次记录，准备测试环境"
    loop_position: round_start
    steps:
      - id: create_round_record
        name: "创建轮次记录"
        run: agent.test.test_coordinator
        inputs:
          - round_number: "$loop.iteration"
          - target_version: "$inputs.release_manifest.version"
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/test-round.yaml"

      - id: prepare_test_data
        name: "准备测试数据"
        run: agent.test.data_preparer
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/test-data-ready.yaml"

  # ========== Stage 1: 提测包预检 ==========
  - id: s1_precheck
    name: "提测包预检"
    description: "验证提测包完整性，确保满足最低测试准入标准"
    steps:
      - id: s1_1_manifest_review
        name: "提测包审核"
        run: agent.test.release_manifest_reviewer
        inputs:
          - release_manifest: "$inputs.release_manifest"
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/manifest-review.yaml"
        gate:
          ref: gate.test.manifest_gate
          on_fail:
            action: block_and_return
            state: BLOCKED

  # ========== Stage 2: 环境准备 ==========
  - id: s2_env_setup
    name: "环境准备"
    description: "部署测试环境，初始化配置和数据"
    steps:
      - id: s2_1_deploy
        name: "部署测试版本"
        run: agent.devops.deployer
        inputs:
          - manifest: "$inputs.release_manifest"
          - env: "test"
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/deploy-status.yaml"

      - id: s2_2_health_check
        name: "环境健康检查"
        run: agent.test.env_checker
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/env-health.yaml"
        gate:
          ref: gate.test.env_ready_gate
          on_fail:
            action: retry_or_block
            max_retry: 3

  # ========== Stage 3: 冒烟测试（准入门禁）==========
  - id: s3_smoke
    name: "冒烟测试"
    description: "快速验证核心功能，作为准入门禁"
    steps:
      - id: s3_1_smoke_execution
        name: "执行冒烟用例"
        run: agent.test.smoke_executor
        inputs:
          - suite: "smoke"
          - round_id: "$ROUND_ID"
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/smoke-report.json"
        gate:
          ref: gate.test.smoke_gate
          criteria:
            pass_rate: 100
            p0_failures: 0
          on_fail:
            action: block_and_return
            state: BLOCKED
            notify: development
            create_bugs: true

  # ========== Stage 4: 系统测试执行 ==========
  - id: s4_system_test
    name: "系统测试执行"
    description: "并行执行 API、E2E、性能等测试套件"
    steps:
      - id: s4_1_api_test
        name: "API 测试"
        run: agent.test.api_executor
        parallel_with: [s4_2_e2e_test]
        inputs:
          - suite: "api"
          - round_id: "$ROUND_ID"
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/api-report.json"
        on_failure:
          emit_event: test_failure
          create_bug: true

      - id: s4_2_e2e_test
        name: "E2E 测试"
        run: agent.test.e2e_executor
        parallel_with: [s4_1_api_test]
        inputs:
          - suite: "e2e"
          - round_id: "$ROUND_ID"
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/e2e-report.json"
        on_failure:
          emit_event: test_failure
          create_bug: true

      - id: s4_3_regression_test
        name: "风险回归测试"
        run: agent.test.regression_executor
        dependencies: [s4_1_api_test, s4_2_e2e_test]
        inputs:
          - suite: "regression"
          - scope: "risk_based"  # 风险回归，而非全量
          - changed_areas: "$inputs.release_manifest.changed_areas"
          - historical_hotspots: "$HISTORICAL_BUGS"
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/regression-report.json"

  # ========== Stage 5: 轮次同步（Triage Sync）==========
  - id: s5_triage_sync
    name: "轮次同步"
    description: "收敛 Bug 分流，确保所有新 Bug 已分配 owner"
    steps:
      - id: s5_1_bug_inventory
        name: "Bug 清单盘点"
        run: agent.test.bug_manager
        inputs:
          - round_id: "$ROUND_ID"
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/bug-inventory.yaml"

      - id: s5_2_triage_all
        name: "分流所有新 Bug"
        run: agent.test.bug_triager
        inputs:
          - bugs: "bugs WHERE status=new AND detected_in_round=$ROUND_ID"
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/triage-summary.yaml"
        gate:
          criteria:
            all_bugs_triaged: true
          on_fail:
            action: wait_or_escalate

      - id: s5_3_trigger_debug
        name: "触发 P0/P1 诊断"
        run: agent.test.debug_dispatcher
        inputs:
          - bugs: "bugs WHERE severity IN [P0,P1] AND status=triaged"
        trigger: bug_sub_workflow.debug_step
        async: true

  # ========== Stage 6: 修复验证循环 ==========
  - id: s6_fix_verify_loop
    name: "修复验证循环"
    description: "轮内修复验证短循环"
    loop:
      condition: "open_p0_count > 0 OR (open_p1_count > 0 AND loop_count < max_fix_cycles)"
      max_cycles: 5
      timeout: 48h
    steps:
      - id: s6_1_wait_for_fixes
        name: "等待修复"
        type: external_wait
        wait_for:
          event: "bug_fixed"
          condition: "ANY bug IN critical_bugs WHERE status=fixed"
          timeout: 24h
        on_timeout:
          action: escalate

      - id: s6_2_verify_fixes
        name: "验证修复"
        run: agent.test.fix_verifier
        inputs:
          - bugs: "bugs WHERE status=fixed AND verified_by IS NULL"
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/fix-verification-$CYCLE.yaml"

      - id: s6_3_regression_rerun
        name: "回归重跑"
        run: agent.test.regression_executor
        inputs:
          - bugs: "bugs WHERE status=fixed"
          - scope: "bug_related_regression"
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/regression-rerun-$CYCLE.json"

  # ========== Stage 7: 轮次签字 ==========
  - id: s7_round_signoff
    name: "轮次签字"
    description: "评估轮次目标，决定下一轮或出测"
    steps:
      - id: s7_1_evaluate_exit_criteria
        name: "评估出测标准"
        run: agent.test.exit_evaluator
        inputs:
          - round_id: "$ROUND_ID"
          - bugs: "bugs"
          - reports: "test-rounds/round-$ROUND_NUM/"
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/exit-evaluation.yaml"
        gate:
          ref: gate.test.exit_gate_v2

      - id: s7_2_round_conclusion
        name: "轮次结论"
        type: decision
        decision_logic: |
          IF exit_criteria_met AND human_bugs_resolved:
            conclusion = RELEASE_CANDIDATE
          ELIF open_p0 > 0 OR open_p1 > threshold:
            conclusion = NEXT_ROUND
          ELSE:
            conclusion = BLOCKED
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/round-conclusion.yaml"

      - id: s7_3_human_signoff
        name: "人类签字"
        type: human_decision
        condition: "conclusion == RELEASE_CANDIDATE"
        human_gate: final_signoff
        required_approvers:
          - role: qa_lead
          - role: pm
          - role: tech_lead
        inputs_to_review:
          - "test-rounds/round-$ROUND_NUM/"
          - "bugs/"
        on_approve:
          action: release
        on_reject:
          action: next_round

  # ========== Round Loop End ==========
  - id: round_complete
    name: "轮次完成"
    description: "归档轮次产物，准备下一轮或出测"
    loop_position: round_end
    steps:
      - id: archive_round
        name: "归档轮次"
        run: agent.test.archiver
        outputs:
          - path: "test-rounds/round-$ROUND_NUM/"
            freeze: true

  # ========== Stage 8: 最终交付 ==========
  - id: s8_release
    name: "最终交付"
    description: "生成最终报告，归档所有产物"
    steps:
      - id: s8_1_generate_final_report
        name: "生成最终报告"
        run: agent.test.report_generator
        inputs:
          - all_rounds: "test-rounds/"
          - all_bugs: "bugs/"
        outputs:
          - path: "test-report-final.yaml"

      - id: s8_2_freeze_artifacts
        name: "冻结测试产物"
        run: agent.test.archiver
        outputs:
          - path: "test-frozen/$VERSION/"
            freeze: true

# ============================================
# 门禁规则（引用）
# ============================================
gates:
  manifest_gate:
    ref: ../../gates/manifest-gate/v1/gate.yaml

  env_ready_gate:
    ref: ../../gates/env-ready-gate/v1/gate.yaml

  smoke_gate:
    ref: ../../gates/smoke-gate/v1/gate.yaml

  exit_gate_v2:
    ref: ../../gates/exit-gate/v2/gate.yaml

# ============================================
# 出测标准（v2 - 更工程化）
# ============================================
exit_criteria:
  mandatory:
    - open_p0_count: 0
    - smoke_pass_rate: 100
    - core_flow_pass_rate: 100
    - human_required_bugs_resolved: true

  thresholds:
    - open_p1_count: "<= 3"
    - open_p2_count: "<= 10"
    - regression_pass_rate: ">= 95"
    - api_contract_violations: 0

  risk_acceptance:
    - known_p2_p3_documented: true
    - workaround_available: true
    - rollback_plan_ready: true

# ============================================
# 风险回归策略（效率优化）
# ============================================
regression_strategy:
  always_run:
    - smoke_suite: "全量"
    - core_flows: "全量"

  risk_based:
    - changed_areas: "基于 release_manifest.changed_areas"
    - bug_related: "本轮修复的 bug 影响范围"
    - historical_hotspots: "历史高发 bug 区域"
    - dependency_chain: "变更依赖链"

  optional:
    - full_regression: "仅在出测前最后一轮执行"

# ============================================
# 错误处理
# ============================================
error_handling:
  critical_bug_detected:
    - condition: "severity == P0 AND category == core_flow"
      action: "trigger_emergency_triage"
      notify: [qa_lead, tech_lead, pm]

  round_timeout:
    - action: "escalate_and_human_decision"
      notify: stakeholders

  max_rounds_exceeded:
    - action: "abort_and_escalate"
      reason: "quality_concern"

# ============================================
# 可观测性
# ============================================
observability:
  metrics:
    - rounds_count
    - bugs_per_round
    - fix_cycle_time
    - round_duration
    - exit_criteria_trend

  dashboards:
    - test_progress
    - bug_burndown
    - quality_trend

# ============================================
# 元数据
# ============================================
metadata:
  version: 2.0
  created: "2026-01-15"
  replaces: workflow.test.testing_pipeline (v1.0)
  breaking_changes:
    - "引入多轮循环机制"
    - "Bug 子流程解耦为独立工作流"
    - "事件驱动模型替代同步阻塞"
    - "风险回归替代全量回归"
