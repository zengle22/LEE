# Smoke Gate Specification v1.0
# 冒烟测试门禁规范

kind: gate
version: 1.0

# ============================================
# 基础标识
# ============================================
id: gate.test.smoke_gate
name: Smoke Gate
description: >
  冒烟测试门禁，验证核心功能是否可用。
  这是进入系统测试的准入门禁，冒烟失败将直接打回研发。
  冒烟测试聚焦核心链路，用例数量控制在 10-30 条。
owner: test-governance
tags: [gate, testing, smoke, core-flow, quality]

# ============================================
# 触发条件
# ============================================
trigger:
  when:
    - submission_gate_passed
    - smoke_test_requested
  context:
    requires:
      - manifest_id: "$MANIFEST_ID"
      - test_environment: "$TEST_ENV_URL"
      - smoke_cases: "test-cases/smoke/*.yaml"

# ============================================
# 前置条件
# ============================================
preconditions:
  - id: env_deployed
    name: 测试环境已部署
    check: |
      health_check("$TEST_ENV_URL/health") == 200
    message: "测试环境未就绪"

  - id: env_version_match
    name: 环境版本匹配
    check: |
      get_deployed_version("$TEST_ENV_URL") == "$VERSION"
    message: "部署版本与提测版本不匹配"

  - id: dependencies_available
    name: 依赖服务可用
    check: |
      check_dependencies("$TEST_ENV_URL/dependencies")
    message: "依赖服务不可用"

# ============================================
# 检查规则
# ============================================
checks:
  # ---------- 执行完整性检查 ----------
  - id: all_smoke_cases_executed
    name: 冒烟用例全部执行
    description: 所有冒烟用例必须执行
    severity: blocker
    rule: |
      smoke_result.summary.total == smoke_cases.total &&
      smoke_result.summary.skipped == 0
    message: "存在未执行的冒烟用例"
    fix: "确保所有冒烟用例都已执行"

  # ---------- P0 用例检查 ----------
  - id: p0_cases_pass
    name: P0 用例全部通过
    description: 所有 P0 优先级的冒烟用例必须通过
    severity: blocker
    rule: |
      smoke_result.cases
        .filter(c => c.priority == "P0")
        .every(c => c.result == "pass")
    message: "存在失败的 P0 冒烟用例"
    fix: "修复 P0 用例中的问题，重新提测"

  # ---------- 核心链路检查 ----------
  - id: system_startup
    name: 系统启动正常
    description: 系统必须能够正常启动
    severity: blocker
    rule: |
      smoke_result.cases
        .filter(c => c.module == "系统启动")
        .every(c => c.result == "pass")
    message: "系统启动失败"
    fix: "修复启动问题"

  - id: user_auth_works
    name: 用户认证可用
    description: 登录功能必须可用
    severity: blocker
    rule: |
      smoke_result.cases
        .filter(c => c.module == "用户认证")
        .every(c => c.result == "pass")
    message: "用户认证功能不可用"
    fix: "修复认证相关问题"

  - id: core_flow_works
    name: 核心业务链路可用
    description: 核心业务流程必须可用
    severity: blocker
    rule: |
      smoke_result.cases
        .filter(c => c.module == "核心业务链路")
        .every(c => c.result == "pass")
    message: "核心业务链路不可用"
    fix: "修复核心链路问题"

  - id: api_available
    name: 关键 API 可用
    description: 关键 API 接口必须可用
    severity: blocker
    rule: |
      smoke_result.cases
        .filter(c => c.module == "API 可用性")
        .every(c => c.result == "pass")
    message: "关键 API 不可用"
    fix: "修复 API 问题"

  # ---------- 总体通过率检查 ----------
  - id: smoke_pass_rate_100
    name: 冒烟通过率 100%
    description: 冒烟测试必须 100% 通过
    severity: blocker
    rule: |
      smoke_result.summary.pass_rate == 100
    message: "冒烟测试未能 100% 通过"
    fix: "修复所有失败的冒烟用例"

  # ---------- 无阻塞问题检查 ----------
  - id: no_blockers
    name: 无阻塞性问题
    description: 不能存在阻塞后续测试的问题
    severity: blocker
    rule: |
      smoke_result.blockers == null || smoke_result.blockers.length == 0
    message: "存在阻塞性问题"
    fix: "解决所有阻塞性问题"

# ============================================
# 通过条件
# ============================================
pass_criteria:
  blocker: 0        # 不允许有任何 blocker
  major: 0          # 冒烟阶段不允许 major
  minor: null       # minor 仅警告

# ============================================
# 输出产物
# ============================================
outputs:
  - type: report
    format: json
    path: "output/gate-reports/smoke-gate-{manifest_id}.json"
  - type: summary
    format: markdown
    path: "output/gate-reports/smoke-gate-{manifest_id}.md"

# ============================================
# 后续动作
# ============================================
actions:
  on_pass:
    - log: "Smoke Gate 通过，进入系统测试"
    - update:
        file: "smoke-test-result.yaml"
        field: "recommendation"
        value: "proceed_to_system_test"
    - notify:
        channel: testing
        message: "版本 {version} 冒烟测试通过，进入系统测试阶段"
    - trigger:
        workflow_step: system_test
        with:
          manifest_id: $manifest_id

  on_fail:
    - log: "Smoke Gate 未通过，打回研发"
    - update:
        file: "smoke-test-result.yaml"
        field: "recommendation"
        value: "reject_and_return"
    - create_bugs:
        for_each: $failed_cases
        template: |
          bug_id: BUG-{year}-{sequence}
          title: "[冒烟失败] {case_name}"
          severity: P0
          type: functional
          status: new
          detected_in:
            version: $version
            test_case_id: $case_id
          repro:
            steps: $case_steps
            expected: $case_expected
            actual: $case_actual
    - notify:
        channel: development
        message: "版本 {version} 冒烟测试失败，打回研发。失败用例: {failed_cases_summary}"
