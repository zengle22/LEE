# Submission Gate Specification v1.0
# 提测包完整性门禁规范

kind: gate
version: 1.0

# ============================================
# 基础标识
# ============================================
id: gate.test.submission_gate
name: Submission Gate
description: >
  提测包完整性门禁，验证研发提交的提测包清单是否完整有效。
  这是测试流程的第一道门禁，不完整的提测包将被直接打回研发。
owner: test-governance
tags: [gate, testing, submission, manifest, quality]

# ============================================
# 触发条件
# ============================================
trigger:
  when:
    - release_manifest_submitted
    - dev_submit_request
  context:
    requires:
      - release_manifest: "release-manifest.yaml"
      - artifact_location: "$ARTIFACT_LOCATION"

# ============================================
# 检查规则
# ============================================
checks:
  # ---------- 必填字段检查 ----------
  - id: manifest_id_valid
    name: 清单 ID 有效
    description: 提测包清单 ID 必须符合格式
    severity: blocker
    rule: |
      manifest_id.matches("^MAN-[0-9]{4}-[0-9]{4}$")
    message: "清单 ID 格式错误"
    fix: "使用格式 MAN-YYYY-NNNN"

  - id: version_valid
    name: 版本号有效
    description: 版本号必须符合 semver 格式
    severity: blocker
    rule: |
      version.matches("^v[0-9]+\\.[0-9]+\\.[0-9]+(-rc[0-9]+)?$")
    message: "版本号格式错误"
    fix: "使用格式 vX.Y.Z 或 vX.Y.Z-rcN"

  - id: commit_info_complete
    name: 提交信息完整
    description: Git commit 信息必须完整
    severity: blocker
    rule: |
      commit.hash != null &&
      commit.hash.length >= 7 &&
      commit.tag != null &&
      commit.branch != null
    message: "Git 提交信息不完整"
    fix: "提供完整的 commit hash、tag 和 branch"

  # ---------- 产物检查 ----------
  - id: artifact_location_exists
    name: 产物位置有效
    description: 产物位置必须填写
    severity: blocker
    rule: |
      artifact.location != null && artifact.location != ""
    message: "未指定产物位置"
    fix: "填写产物的镜像地址或包路径"

  - id: artifact_checksum_exists
    name: 产物校验和有效
    description: 产物必须提供校验和
    severity: blocker
    rule: |
      artifact.checksum != null &&
      artifact.checksum.algorithm in ["sha256", "md5"] &&
      artifact.checksum.value != null
    message: "产物校验和缺失或无效"
    fix: "提供有效的 sha256 或 md5 校验和"

  - id: artifact_accessible
    name: 产物可访问
    description: 产物必须存在且可访问
    severity: blocker
    command: |
      verify_artifact_exists "$ARTIFACT_LOCATION"
    timeout: 60s
    message: "产物不存在或无法访问"
    fix: "确保产物已正确上传到指定位置"

  - id: artifact_checksum_valid
    name: 产物校验和匹配
    description: 产物实际校验和必须与声明匹配
    severity: blocker
    command: |
      verify_artifact_checksum "$ARTIFACT_LOCATION" "$CHECKSUM_ALGORITHM" "$CHECKSUM_VALUE"
    timeout: 120s
    message: "产物校验和不匹配"
    fix: "重新计算并更新校验和，或重新上传产物"

  # ---------- 自测结果检查 ----------
  - id: unit_test_result_exists
    name: 单元测试结果存在
    description: 必须提供单元测试结果
    severity: blocker
    rule: |
      self_test.unit_test != null &&
      self_test.unit_test.passed != null &&
      self_test.unit_test.total != null
    message: "缺少单元测试结果"
    fix: "运行单元测试并提供结果"

  - id: unit_test_pass_rate
    name: 单元测试通过率达标
    description: 单元测试通过率必须 >= 80%
    severity: blocker
    rule: |
      (self_test.unit_test.passed / self_test.unit_test.total) >= 0.8
    message: "单元测试通过率低于 80%"
    fix: "修复失败的单元测试，确保通过率 >= 80%"

  - id: smoke_self_test_pass
    name: 冒烟自测全部通过
    description: 冒烟自测必须全部通过
    severity: blocker
    rule: |
      self_test.smoke_test != null &&
      self_test.smoke_test.passed == self_test.smoke_test.total
    message: "冒烟自测未全部通过"
    fix: "修复冒烟自测中的失败用例"

  # ---------- 变更说明检查 ----------
  - id: changelog_summary_exists
    name: 变更摘要存在
    description: 必须提供变更摘要
    severity: blocker
    rule: |
      changelog.summary != null && changelog.summary != ""
    message: "缺少变更摘要"
    fix: "提供本次变更的摘要说明"

  - id: changelog_changes_exists
    name: 变更列表存在
    description: 必须提供变更列表
    severity: blocker
    rule: |
      changelog.changes != null && changelog.changes.length > 0
    message: "缺少变更列表"
    fix: "列出本次变更的具体内容"

  - id: risk_points_documented
    name: 风险点已记录
    description: 风险点应当记录
    severity: major
    rule: |
      changelog.risk_points != null || changelog.summary.contains("无风险")
    message: "建议记录风险点"
    fix: "记录已知风险点及缓解措施"

  - id: rollback_plan_exists
    name: 回滚方案存在
    description: 应提供回滚方案
    severity: major
    rule: |
      changelog.rollback_plan != null && changelog.rollback_plan != ""
    message: "缺少回滚方案"
    fix: "提供出现问题时的回滚步骤"

# ============================================
# 通过条件
# ============================================
pass_criteria:
  blocker: 0        # 不允许有 blocker
  major: 2          # major 最多 2 个（需要确认）
  minor: null       # minor 仅警告

# ============================================
# 输出产物
# ============================================
outputs:
  - type: report
    format: json
    path: "output/gate-reports/submission-gate-{manifest_id}.json"
  - type: summary
    format: markdown
    path: "output/gate-reports/submission-gate-{manifest_id}.md"

# ============================================
# 后续动作
# ============================================
actions:
  on_pass:
    - log: "Submission Gate 通过，提测包已接收"
    - update:
        file: "release-manifest.yaml"
        field: "review_status"
        value: "accepted"
    - notify:
        channel: testing
        message: "版本 {version} 提测包已接收，准备进入冒烟测试"
    - trigger:
        gate: gate.test.smoke_gate
        with:
          manifest_id: $manifest_id

  on_fail:
    - log: "Submission Gate 未通过，打回研发"
    - update:
        file: "release-manifest.yaml"
        field: "review_status"
        value: "rejected"
    - update:
        file: "release-manifest.yaml"
        field: "rejection_reason"
        value: "$failed_checks_summary"
    - notify:
        channel: development
        message: "版本 {version} 提测包被打回，原因: {failed_checks_summary}"
