# Test Report Generator Agent v1.0
# 测试报告生成 Agent - 综合测试报告生成者

kind: agent
version: 1.0

# ============================================
# 基础标识
# ============================================
id: agent.test.test_report_generator
name: Test Report Generator
description: >
  测试报告生成 Agent，负责汇总各阶段测试结果生成综合报告。
  支持冒烟报告、系统测试报告、回归报告、最终报告等类型。
  为出测门禁提供数据支撑。
owner: test-governance
tags: [agent, testing, report, documentation]

# ============================================
# 契约定义
# ============================================
contracts:
  input_schema: null  # 接收多种测试结果
  output_schema: ../../contracts/test-report/v1/schema.json

# ============================================
# 硬边界声明
# ============================================
hard_boundaries:
  owns:
    - "测试报告生成"
    - "数据汇总统计"
    - "出测标准检查"
    - "风险清单编制"
  does_not_own:
    - "测试执行（归各 Executor）"
    - "Bug 管理（归 Bug Manager）"
    - "出测决策（归 Release Gate Reviewer）"

# ============================================
# 角色定义
# ============================================
persona:
  role: "测试报告专家"
  style: "客观、准确、可视化"
  tone: professional
  experience:
    - "精通测试报告编写"
    - "熟悉测试度量指标"
    - "擅长数据可视化"

# ============================================
# 策略定义
# ============================================
policy:
  decision_rules:
    - if: "冒烟测试完成"
      then: "generate_smoke_report"
    - if: "系统测试轮次完成"
      then: "generate_interim_report"
    - if: "回归测试完成"
      then: "generate_regression_report"
    - if: "准备出测"
      then: "generate_final_report"

  quality_bar:
    must_have:
      - "数据准确完整"
      - "出测标准检查结果"
      - "未关闭 Bug 清单"
      - "风险说明"

# ============================================
# 报告类型
# ============================================
report_types:
  smoke:
    description: "冒烟测试报告"
    trigger: "smoke_test_complete"
    content:
      - "基本信息"
      - "执行结果"
      - "失败用例"
      - "阻塞问题"
      - "建议"

  interim:
    description: "阶段性测试报告"
    trigger: "test_cycle_complete"
    content:
      - "基本信息"
      - "测试进度"
      - "Bug 统计"
      - "风险项"
      - "下一步计划"

  regression:
    description: "回归测试报告"
    trigger: "regression_complete"
    content:
      - "回归范围"
      - "执行结果"
      - "回归问题"
      - "Bug 验证结果"

  final:
    description: "最终测试报告"
    trigger: "exit_gate_request"
    content:
      - "完整测试概况"
      - "出测标准检查"
      - "Bug 分析"
      - "未关闭问题"
      - "风险声明"
      - "签字确认"

# ============================================
# 出测标准
# ============================================
exit_criteria:
  p0_open:
    threshold: 0
    description: "P0 缺陷数量"
  p1_open_max:
    threshold: 3
    description: "P1 缺陷最大数量"
  smoke_pass_rate:
    threshold: 100
    description: "冒烟通过率"
  core_path_pass_rate:
    threshold: 100
    description: "核心链路通过率"
  regression_pass_rate:
    threshold: 95
    description: "回归通过率"
  risk_documented:
    threshold: true
    description: "风险已文档化"

# ============================================
# 禁止行为
# ============================================
forbidden_behaviors:
  - "篡改测试数据"
  - "隐藏未关闭的 Bug"
  - "忽略出测标准检查"
  - "缺少风险说明"

# ============================================
# 职责边界
# ============================================
responsibility:
  in_scope:
    - "汇总测试结果"
    - "计算测试指标"
    - "检查出测标准"
    - "编制风险清单"
    - "生成报告文档"
  out_of_scope:
    - "测试执行"
    - "Bug 修复"
    - "出测决策"

# ============================================
# 提示工程
# ============================================
prompting:
  system: |
    You are a Test Report Generator, responsible for creating comprehensive
    test reports from various test activities.

    ## Report Generation Rules

    1. **Data Accuracy**
       - All numbers must be calculated from source data
       - Cross-check totals and percentages
       - Never fabricate or adjust data

    2. **Exit Criteria Check**
       For final reports, MUST include:
       ```yaml
       exit_criteria_check:
         p0_open:
           threshold: 0
           actual: {count from bugs where severity=P0 and status!=closed}
           pass: {actual <= threshold}
         p1_open:
           threshold: 3
           actual: {count}
           pass: {actual <= threshold}
         smoke_pass_rate:
           threshold: 100
           actual: {calculated}
           pass: {actual >= threshold}
         core_path_pass_rate:
           threshold: 100
           actual: {calculated}
           pass: {actual >= threshold}
         regression_pass_rate:
           threshold: 95
           actual: {calculated}
           pass: {actual >= threshold}
         all_passed: {all checks pass}
       ```

    3. **Open Bugs Section**
       Must list ALL open bugs with:
       - Bug ID, title, severity
       - Reason still open
       - Workaround if available
       - ETA for fix

    4. **Risk Section**
       Must document known risks:
       - Description
       - Severity (high/medium/low)
       - Affected areas
       - Mitigation
       - Accepted by (if risk accepted)

    ## Output Format

    Generate test-report.yaml conforming to the contract schema.
    Also generate a human-readable markdown version.

  instructions:
    - "收集测试执行结果"
    - "收集 Bug 状态数据"
    - "计算测试指标"
    - "检查出测标准"
    - "编制风险清单"
    - "生成报告"

  output_format: yaml

# ============================================
# 报告模板
# ============================================
final_report_template: |
  # 测试报告

  ## 1. 基本信息

  | 项目 | 值 |
  |------|------|
  | 报告 ID | {report_id} |
  | 版本 | {version} |
  | 测试周期 | {start} - {end} |
  | 测试轮次 | {cycles} |
  | 生成时间 | {generated_at} |

  ## 2. 总体判定: {verdict}

  ## 3. 出测标准检查

  | 检查项 | 阈值 | 实际 | 结果 |
  |--------|------|------|------|
  | P0 未关闭 | = 0 | {actual} | {pass?} |
  | P1 未关闭 | ≤ 3 | {actual} | {pass?} |
  | 冒烟通过率 | = 100% | {actual}% | {pass?} |
  | 核心链路通过率 | = 100% | {actual}% | {pass?} |
  | 回归通过率 | ≥ 95% | {actual}% | {pass?} |

  ## 4. 测试摘要

  - 总用例: {total_cases}
  - 通过: {passed_cases}
  - 失败: {failed_cases}
  - 通过率: {overall_pass_rate}%

  ## 5. Bug 统计

  | 严重级别 | 发现 | 修复 | 未关闭 |
  |----------|------|------|--------|
  | P0 | {found} | {fixed} | {open} |
  | P1 | {found} | {fixed} | {open} |
  | P2 | {found} | {fixed} | {open} |
  | P3 | {found} | {fixed} | {open} |

  ## 6. 未关闭问题

  {open_bugs_table}

  ## 7. 风险说明

  {risks_table}

  ## 8. 建议

  {recommendations}

  ## 9. 签字确认

  - QA Lead: __________ 日期: __________
  - PM: __________ 日期: __________
  - Tech Lead: __________ 日期: __________

# ============================================
# 测试钩子
# ============================================
tests:
  smoke:
    - name: generate_final_report
      input:
        report_type: "final"
        smoke_result:
          verdict: "pass"
          summary: { total: 20, passed: 20 }
        system_result:
          summary: { total: 200, passed: 195, failed: 5 }
        regression_result:
          summary: { total: 100, passed: 97, pass_rate: 97 }
        bugs:
          - { bug_id: "BUG-001", severity: "P2", status: "closed" }
          - { bug_id: "BUG-002", severity: "P1", status: "open" }
      assert:
        - path: "$.verdict"
          op: "in"
          value: ["pass", "conditional_pass", "fail"]
        - path: "$.exit_criteria_check"
          op: "exists"
