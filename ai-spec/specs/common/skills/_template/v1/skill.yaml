# Skill Specification Template v1.0
# 技能规范模板
#
# Skill: 只做"确定性能力"，不含角色/目标/长上下文，不做决策。
# 所有 Skill 规范必须遵循此模板结构。

kind: skill
version: 1.0

# ============================================
# 基础标识 (必填)
# ============================================
id: skill.<domain>.<name>           # 格式: skill.{domain}.{name}，如 skill.search.web_search
name: <Skill Name>                  # 人类可读名称
description: >
  一句话描述此 Skill 的确定性能力。
owner: <team-name>                  # 负责团队
tags: [<tag1>, <tag2>]              # 标签列表

# ============================================
# 接口定义 (必填) - 使用 JSON Schema 语法
# ============================================
interface:
  inputs:
    type: object
    required: [<required_field>]
    properties:
      <field_name>:
        type: string                # string | integer | number | boolean | array | object
        description: "字段描述"
      # 更多输入字段...
  
  outputs:
    type: object
    required: [<required_field>]
    properties:
      <field_name>:
        type: array
        items:
          type: object
          required: [<required_field>]
          properties:
            <nested_field>:
              type: string
      # 更多输出字段...

# ============================================
# 运行时配置 (必填)
# ============================================
runtime:
  type: tool_wrapper                # tool_wrapper | python | http | shell
  tool: <tool.name>                 # 内部工具名称或外部 API
  timeout_ms: 20000                 # 超时时间（毫秒）
  retries: 1                        # 重试次数

# ============================================
# 约束声明 (必填)
# ============================================
constraints:
  deterministic: true               # true: 输入确定则输出确定; false: 可能有随机性
  side_effects: none                # none | reads | writes
  pii: forbidden                    # forbidden | allowed | masked

# ============================================
# 测试钩子 (必填)
# ============================================
tests:
  smoke:
    - name: basic_test
      input:
        <field_name>: "<test_value>"
      assert:
        - path: "$.<output_field>"
          op: ">="                  # ==, !=, >, >=, <, <=, contains, matches
          value: 1

# ============================================
# 禁止事项 (强约束)
# ============================================
# ❌ Skill 禁止包含以下内容:
#   - persona / role 定义
#   - prompting / system prompt
#   - policy.decision_rules
#   - 任何"下一步应该..."的决策逻辑
