# Variant System Skill Specification v1.0
# Figma 变体系统技能规范

kind: skill
version: 1.0

# ============================================
# 基础标识
# ============================================
id: skill.design.variant_system
name: Variant System
description: >
  精通 Figma 组件变体系统，创建可扩展的组件库。
  包括属性定义、交互状态和组件组合。
owner: design-ai
tags: [figma, variants, components, properties]

# ============================================
# 接口定义
# ============================================
interface:
  inputs:
    type: object
    required: [component_name, properties]
    properties:
      component_name:
        type: string
        description: "组件名称"
      properties:
        type: array
        description: "变体属性"
        items:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
              enum: [variant, boolean, text, instance_swap]
            values:
              type: array
              items:
                type: string
      interactions:
        type: array
        description: "交互映射"
        items:
          type: object
          properties:
            trigger:
              type: string
            target_variant:
              type: string

  outputs:
    type: object
    required: [component_set, total_variants]
    properties:
      component_set:
        type: object
        description: "组件集配置"
      total_variants:
        type: integer
        description: "变体总数"
      property_controls:
        type: array
        description: "属性控制面板配置"

# ============================================
# 变体系统规范
# ============================================
variant_system:
  # 属性类型
  property_types:
    variant:
      description: "枚举值属性，每个值对应一个设计变体"
      syntax: "Property=Value"
      examples:
        - "State=Default"
        - "State=Hover"
        - "Size=Small"
        - "Size=Medium"
        - "Type=Primary"
        - "Type=Secondary"
      use_cases:
        - "交互状态"
        - "尺寸变化"
        - "样式变体"

    boolean:
      description: "开关属性，显示/隐藏元素"
      syntax: "Property=true/false"
      examples:
        - "Show icon=true"
        - "Has badge=false"
        - "Destructive=true"
      use_cases:
        - "可选元素"
        - "危险操作标记"
        - "高亮状态"

    text:
      description: "可编辑文本"
      syntax: "直接覆盖文本内容"
      examples:
        - "Button → 'Submit'"
        - "Label → '用户名'"
      use_cases:
        - "按钮文案"
        - "标签内容"
        - "占位符"

    instance_swap:
      description: "可替换的嵌套组件"
      syntax: "属性控制嵌套实例"
      examples:
        - "Icon → Icon/Check"
        - "Avatar → Avatar/User1"
      use_cases:
        - "图标替换"
        - "头像替换"
        - "自定义内容"

  # 命名规范
  naming_convention:
    format: "{Property}={Value}"

    property_naming:
      rules:
        - "使用清晰的描述性名称"
        - "首字母大写"
        - "多单词用空格分隔"
      good_examples:
        - "State"
        - "Size"
        - "Type"
        - "Has icon"
        - "Show badge"
      bad_examples:
        - "s" # 太短
        - "buttonState" # 不需要组件名前缀
        - "STATE" # 全大写

    value_naming:
      rules:
        - "使用描述性值名"
        - "保持一致性"
      good_examples:
        - "Default, Hover, Focus, Active, Disabled"
        - "Small, Medium, Large"
        - "Primary, Secondary, Outline, Ghost"
      bad_examples:
        - "1, 2, 3" # 数字不直观
        - "sm, md, lg" # 缩写不清晰

  # 常用变体矩阵
  common_variants:
    button:
      properties:
        - name: State
          values: [Default, Hover, Focus, Active, Disabled, Loading]
        - name: Size
          values: [Small, Medium, Large]
        - name: Type
          values: [Primary, Secondary, Outline, Ghost, Link]
        - name: Destructive
          type: boolean
        - name: Icon only
          type: boolean
        - name: Leading icon
          type: instance_swap
        - name: Trailing icon
          type: instance_swap
      total_variants: "6 × 3 × 5 = 90 基础变体"

    input:
      properties:
        - name: State
          values: [Default, Hover, Focus, Filled, Error, Disabled]
        - name: Size
          values: [Small, Medium, Large]
        - name: Has label
          type: boolean
        - name: Has helper text
          type: boolean
        - name: Leading icon
          type: instance_swap
        - name: Trailing icon
          type: instance_swap

    checkbox:
      properties:
        - name: State
          values: [Unchecked, Checked, Indeterminate]
        - name: Interaction
          values: [Default, Hover, Focus, Disabled]
        - name: Size
          values: [Small, Medium]
        - name: Has label
          type: boolean

    card:
      properties:
        - name: State
          values: [Default, Hover, Selected]
        - name: Has image
          type: boolean
        - name: Has actions
          type: boolean
        - name: Clickable
          type: boolean

  # 交互变体
  interactive_variants:
    description: "使用变体实现交互状态"

    setup:
      steps:
        - "为每个交互状态创建变体"
        - "使用 'Change to' 动作"
        - "设置触发条件"

    triggers:
      while_hovering:
        description: "鼠标悬停时"
        target: "State=Hover"
        note: "不适用于移动端"

      while_pressing:
        description: "按下时"
        target: "State=Active"

      on_click:
        description: "点击时"
        target: "导航或切换状态"

      key_down:
        description: "键盘按下"
        keys: ["Enter", "Space"]
        note: "用于可访问性"

    example_flow:
      button:
        - trigger: "While hovering"
          from: "State=Default"
          to: "State=Hover"
          animation: "Smart animate, 150ms"

        - trigger: "While pressing"
          from: "State=Hover"
          to: "State=Active"
          animation: "Smart animate, 100ms"

        - trigger: "On click"
          action: "Navigate to next frame"

  # 组织结构
  organization:
    component_set:
      description: "将相关变体组合成组件集"
      benefits:
        - "在属性面板统一控制"
        - "自动生成实例交换选项"
        - "便于维护"

    naming_in_layers:
      format: "{ComponentName}/{Property}={Value}, {Property}={Value}"
      example: "Button/State=Default, Size=Medium, Type=Primary"

    component_page_structure:
      layout: |
        🧩 Components
        ├── Atoms
        │   ├── Button
        │   │   └── [Component Set with all variants]
        │   ├── Input
        │   ├── Checkbox
        │   └── ...
        ├── Molecules
        │   ├── Form Field
        │   ├── Search Bar
        │   └── ...
        └── Organisms
            ├── Card
            ├── Modal
            └── ...

  # Slots（2024 新特性）
  slots:
    description: "允许在实例中添加自定义层"
    use_cases:
      - "卡片内容区域"
      - "模态框主体"
      - "可扩展容器"
    configuration:
      - "指定 slot 接受的组件类型"
      - "设置默认内容"
      - "定义最小/最大数量"

# ============================================
# 运行时配置
# ============================================
runtime:
  type: tool_wrapper
  tool: figma.variants.create
  timeout_ms: 20000
  retries: 1

# ============================================
# 约束声明
# ============================================
constraints:
  deterministic: true
  side_effects: writes
  pii: forbidden

# ============================================
# 测试钩子
# ============================================
tests:
  smoke:
    - name: create_button_variants
      input:
        component_name: "Button"
        properties:
          - name: "State"
            type: "variant"
            values: ["Default", "Hover", "Focus", "Active", "Disabled"]
          - name: "Size"
            type: "variant"
            values: ["Small", "Medium", "Large"]
      assert:
        - path: "$.total_variants"
          op: ">="
          value: 15
