# Contract Template Skill Specification v1.0
# 契约模板生成技能规范

kind: skill
version: 1.0

# ============================================
# 基础标识
# ============================================
id: skill.ui.contract_template
name: Contract Template
description: >
  根据契约类型和基本信息，生成符合 schema 的契约模板。
owner: ui-ai
tags: [ui, contract, template]

# ============================================
# 接口定义
# ============================================
interface:
  inputs:
    type: object
    required: [contract_type, id, name]
    properties:
      contract_type:
        type: string
        description: "契约类型"
        enum: [page, component, tokens, ui-map, a11y]
      id:
        type: string
        description: "契约 ID"
      name:
        type: string
        description: "契约名称"
      figma_url:
        type: string
        description: "Figma 链接（可选）"
      priority:
        type: string
        description: "优先级（可选）"
        enum: [P0, P1, P2]
        default: P1

  outputs:
    type: object
    required: [template, schema_ref]
    properties:
      template:
        type: object
        description: "生成的契约模板"
      schema_ref:
        type: string
        description: "对应的 schema 引用"
      validation_result:
        type: object
        description: "模板验证结果"
        properties:
          valid:
            type: boolean
          errors:
            type: array
            items:
              type: string

# ============================================
# 运行时配置
# ============================================
runtime:
  type: tool_wrapper
  tool: template.generator
  timeout_ms: 5000
  retries: 0

# ============================================
# 约束声明
# ============================================
constraints:
  deterministic: true
  side_effects: none
  pii: forbidden

# ============================================
# 测试钩子
# ============================================
tests:
  smoke:
    - name: generate_page_template
      input:
        contract_type: "page"
        id: "page.test.home"
        name: "Test Home Page"
      assert:
        - path: "$.template.kind"
          op: "=="
          value: "page-contract"
        - path: "$.template.states"
          op: ">="
          value: 4
    - name: generate_component_template
      input:
        contract_type: "component"
        id: "component.test.button"
        name: "Test Button"
      assert:
        - path: "$.template.kind"
          op: "=="
          value: "component-contract"
