# UI Prompt Enhancer Skill
# 基于 ui-ux-pro-max-skill 的 UI 生成前约束规范化
#
# 定位：Prompt 放大器 / 约束补全器
# 用途：在生成 UI 前，规范化设计约束

id: skill.design.ui_prompt_enhancer
version: "1.0.0"

metadata:
  name: UI Prompt Enhancer
  name_zh: UI 提示增强器
  description: |
    将模糊的 UI 需求转换为结构化、可验证的设计约束。

    核心价值：
    1. 把"更现代"变成具体的样式参数
    2. 把"更专业"变成可测试的约束
    3. 避免"自嗨式专业"，确保产物可验证

# 触发条件
triggers:
  - "生成 UI 之前"
  - "UI 设计约束"
  - "设计规范化"

# 输入输出
input:
  - name: raw_requirement
    type: string
    description: 原始 UI 需求描述
    required: true
  - name: product_type
    type: string
    description: 产品类型 (SaaS/e-commerce/fitness/healthcare...)
    required: true
  - name: target_platform
    type: string
    description: 目标平台 (mobile/web/miniprogram)
    required: true
  - name: existing_design_system
    type: object
    description: 已有的设计系统 (可选)
    required: false

output:
  type: object
  schema: ui-prompt-constraint@v1
  description: 结构化的 UI 约束文档

# 工作流程
workflow:
  steps:
    - id: search_product_style
      name: 搜索产品类型推荐样式
      command: |
        python .claude/skills/ui-ux-pro-max/scripts/search.py "{product_type}" --domain product -n 3
        python .claude/skills/ui-ux-pro-max/scripts/search.py "{product_type}" --domain color -n 3

    - id: search_typography
      name: 搜索字体搭配
      command: |
        python .claude/skills/ui-ux-pro-max/scripts/search.py "{style_keywords}" --domain typography -n 3

    - id: search_style
      name: 搜索 UI 样式
      command: |
        python .claude/skills/ui-ux-pro-max/scripts/search.py "{style_keywords}" --domain style -n 3

    - id: search_ux_guidelines
      name: 搜索 UX 准则
      command: |
        python .claude/skills/ui-ux-pro-max/scripts/search.py "accessibility" --domain ux
        python .claude/skills/ui-ux-pro-max/scripts/search.py "animation" --domain ux

    - id: search_stack
      name: 搜索技术栈最佳实践
      command: |
        python .claude/skills/ui-ux-pro-max/scripts/search.py "layout responsive" --stack {stack}

    - id: merge_constraints
      name: 合并生成约束文档
      action: |
        将搜索结果合并为结构化约束

# 输出模板
output_template:
  ui_constraints:
    # 布局约束
    layout:
      type: "{card-based|list-based|grid-based}"
      density: "{compact|comfortable|spacious}"
      responsive_breakpoints:
        - 320px   # mobile
        - 768px   # tablet
        - 1024px  # desktop

    # 样式约束
    style:
      primary: "{style_name}"
      effects:
        - "{effect_1}"
        - "{effect_2}"
      avoid:
        - "{anti_pattern_1}"
        - "{anti_pattern_2}"

    # 颜色约束 (可被项目 Design System 覆盖)
    colors:
      use_design_system: true
      fallback:
        primary: "{hex}"
        secondary: "{hex}"
        cta: "{hex}"
        background: "{hex}"
        text: "{hex}"

    # 字体约束
    typography:
      heading: "{font_family}"
      body: "{font_family}"
      google_fonts_import: "{import_url}"

    # 交互约束
    interaction:
      mobile_first: true
      tap_target_min: "44px"
      transition_duration: "150-300ms"
      hover_feedback: required

    # 可访问性约束
    accessibility:
      contrast: "AA"  # WCAG level
      focus_visible: required
      alt_text: required
      reduced_motion: respect

    # 禁止事项 (硬性约束)
    forbidden:
      - "emoji 作为功能图标"
      - "复杂渐变作为背景"
      - "小于 12px 的文字"
      - "仅用颜色传达信息"
      - "无反馈的点击"

    # 测试检查点 (可验证)
    verification_checklist:
      - id: v1
        check: "所有可点击元素有 cursor-pointer"
        automated: true
      - id: v2
        check: "对比度 >= 4.5:1"
        automated: true
      - id: v3
        check: "触摸目标 >= 44px"
        automated: true
      - id: v4
        check: "无 emoji 作为 UI 图标"
        automated: true
      - id: v5
        check: "Loading/Empty/Error 状态完整"
        automated: false

# 使用示例
examples:
  - name: 跑步 App 图标设计
    input:
      raw_requirement: "设计一个 AI 跑步 App 的图标，要专业、有科技感"
      product_type: "fitness running app"
      target_platform: "miniprogram"
      existing_design_system:
        primary: "#FF6B00"
        secondary: "#1A73E8"
    output:
      ui_constraints:
        style:
          primary: "minimalism"
          effects:
            - "subtle gradient (橙→蓝)"
            - "clean silhouette"
          avoid:
            - "complex gradients"
            - "text in icon"
            - "too many colors (max 3)"
        colors:
          use_design_system: true
        accessibility:
          contrast: "AA"
        forbidden:
          - "emoji"
          - "photorealistic elements"
          - "fine details (<2px at 144px)"
        verification_checklist:
          - check: "图标在 24px 下仍可识别"
          - check: "主色符合设计系统"
          - check: "无渐变失真 (PNG 导出)"

  - name: 健身 App Landing Page
    input:
      raw_requirement: "做一个健身 App 的落地页，要有活力"
      product_type: "fitness gym app"
      target_platform: "web"
    search_commands:
      - "python search.py 'fitness gym app' --domain product"
      - "python search.py 'fitness gym app' --domain color"
      - "python search.py 'energetic minimal' --domain style"
    output:
      ui_constraints:
        layout:
          type: "card-based"
          density: "comfortable"
        style:
          primary: "minimalism"
          effects:
            - "bold typography"
            - "high contrast"
            - "energetic accent colors"
        colors:
          primary: "#DC2626"
          secondary: "#F87171"
          cta: "#16A34A"
          background: "#0F172A"
          text: "#F8FAFC"
        forbidden:
          - "pastel colors"
          - "delicate fonts"
          - "low contrast"

# 与其他 Skill/Agent 的关系
relationships:
  used_by:
    - agent.design.ux_reviewer          # UX 审查时作为约束参考
    - agent.design.ui_design_executor   # UI 实现时作为约束输入
    - agent.dev.uniapp_frontend_engineer # 前端实现时作为样式指南

  depends_on:
    - external: ui-ux-pro-max-skill     # 知识库来源

# 局限性声明 (重要)
limitations:
  - 输出的"专业感"描述仍需人工判断最终效果
  - 颜色搭配建议需结合品牌设计系统
  - 不能保证生成的 UI 一定"好看"，只能保证"符合约束"
  - 字体搭配需考虑中文支持
