# Figma Component Builder Skill Specification v1.0
# Figma 组件构建技能规范

kind: skill
version: 1.0

# ============================================
# 基础标识
# ============================================
id: skill.design.figma_component_builder
name: Figma Component Builder
description: >
  在 Figma 中构建可复用的 UI 组件，使用 Auto Layout、Variants 和 Slots。
  遵循原子设计方法论和 2025 组件最佳实践。
owner: design-ai
tags: [figma, component, auto-layout, variants]

# ============================================
# 接口定义
# ============================================
interface:
  inputs:
    type: object
    required: [component_type, component_name]
    properties:
      component_type:
        type: string
        description: "组件类型"
        enum: [atom, molecule, organism, template]
      component_name:
        type: string
        description: "组件名称"
      states:
        type: array
        description: "组件状态列表"
        items:
          type: string
        default: ["default", "hover", "focus", "active", "disabled"]
      sizes:
        type: array
        description: "组件尺寸"
        items:
          type: string
        default: ["sm", "md", "lg"]
      variants:
        type: array
        description: "其他变体属性"
        items:
          type: object
          properties:
            name:
              type: string
            values:
              type: array
              items:
                type: string

  outputs:
    type: object
    required: [component_id, variants_count, properties]
    properties:
      component_id:
        type: string
        description: "组件 ID"
      variants_count:
        type: integer
        description: "变体数量"
      properties:
        type: array
        description: "组件属性列表"
        items:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
            values:
              type: array
      auto_layout:
        type: object
        description: "Auto Layout 配置"

# ============================================
# 组件构建规范
# ============================================
component_architecture:
  # 原子设计层级
  atomic_design:
    atoms:
      description: "最小 UI 单元"
      examples:
        - Button
        - Input
        - Checkbox
        - Radio
        - Switch
        - Badge
        - Avatar
        - Icon
        - Spinner
        - Skeleton
      requirements:
        - "使用 Auto Layout"
        - "支持所有状态变体"
        - "支持多种尺寸"
        - "使用 Design Token"

    molecules:
      description: "由原子组成的简单组合"
      examples:
        - Form Field (Label + Input + Helper Text)
        - Button Group
        - Input with Icon
        - Avatar with Badge
        - Search Bar
        - Tag Group
        - Breadcrumb
        - Pagination
      requirements:
        - "嵌套使用原子组件"
        - "使用 Slots 支持内容替换"
        - "保持 Auto Layout 嵌套"

    organisms:
      description: "复杂的 UI 区块"
      examples:
        - Header / Navbar
        - Footer
        - Card
        - Modal / Dialog
        - Sidebar
        - Table
        - Form
        - List
      requirements:
        - "组合多个分子组件"
        - "支持响应式布局"
        - "定义内容插槽"

    templates:
      description: "页面级别布局"
      examples:
        - Page Layout
        - Dashboard Layout
        - Auth Layout
        - Settings Layout
      requirements:
        - "定义页面结构"
        - "标注可替换区域"
        - "支持多断点"

  # Auto Layout 规范
  auto_layout:
    principles:
      - "所有组件必须使用 Auto Layout"
      - "嵌套 Auto Layout 实现复杂布局"
      - "使用 Gap 而非 Spacer 元素"
      - "设置合适的 Padding"

    properties:
      direction:
        horizontal: "水平排列"
        vertical: "垂直排列"
        wrap: "自动换行"
      alignment:
        main_axis: ["start", "center", "end", "space-between"]
        cross_axis: ["start", "center", "end", "stretch", "baseline"]
      sizing:
        fixed: "固定尺寸"
        hug: "自适应内容"
        fill: "填充容器"
      spacing:
        gap: "子元素间距"
        padding: "内边距"

    patterns:
      button:
        direction: horizontal
        main_axis: center
        cross_axis: center
        padding: "12px 24px"
        gap: 8px

      card:
        direction: vertical
        main_axis: start
        cross_axis: stretch
        padding: 16px
        gap: 16px

      form_field:
        direction: vertical
        main_axis: start
        cross_axis: stretch
        gap: 4px

      navbar:
        direction: horizontal
        main_axis: space-between
        cross_axis: center
        padding: "12px 24px"

  # 变体系统
  variant_system:
    naming_convention: "{Property}={Value}"

    common_properties:
      state:
        values: [default, hover, focus, active, disabled, loading]
        description: "交互状态"

      size:
        values: [xs, sm, md, lg, xl]
        description: "尺寸变体"

      variant:
        values: [primary, secondary, outline, ghost, link]
        description: "视觉样式变体"

      destructive:
        values: ["true", "false"]
        description: "危险操作标识"

      icon_only:
        values: ["true", "false"]
        description: "仅图标模式"

    interactive_properties:
      on_hover:
        trigger: "While hovering"
        action: "Change to hover variant"

      on_focus:
        trigger: "While pressing"
        action: "Change to focus variant"

      on_press:
        trigger: "While pressing"
        action: "Change to active variant"

# ============================================
# 运行时配置
# ============================================
runtime:
  type: tool_wrapper
  tool: figma.component.create
  timeout_ms: 30000
  retries: 1

# ============================================
# 约束声明
# ============================================
constraints:
  deterministic: true
  side_effects: writes
  pii: forbidden

# ============================================
# 测试钩子
# ============================================
tests:
  smoke:
    - name: create_button_component
      input:
        component_type: "atom"
        component_name: "Button"
        states: ["default", "hover", "focus", "active", "disabled"]
        sizes: ["sm", "md", "lg"]
      assert:
        - path: "$.variants_count"
          op: ">="
          value: 15
        - path: "$.auto_layout"
          op: "!="
          value: null
