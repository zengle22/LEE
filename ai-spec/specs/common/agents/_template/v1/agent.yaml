# Agent Specification Template v1.1
# 智能体规范模板
#
# Agent: 含角色、目标、决策规则、调用 Skills，必须声明输入/输出 Contract。
# 所有 Agent 规范必须遵循此模板结构。
#
# v1.1 更新: 研发类 Agent 必须遵守知识库访问协议

kind: agent
version: 1.1

# ============================================
# 基础标识 (必填)
# ============================================
id: agent.<domain>.<name>           # 格式: agent.{domain}.{name}，如 agent.research.keyword_analysis
name: <Agent Name>                  # 人类可读名称
description: >
  一句话描述此 Agent 的核心职责和目标。
owner: <team-name>                  # 负责团队
tags: [<tag1>, <tag2>]              # 标签列表

# ============================================
# 契约定义 (必填) - Agent 必须有明确的 I/O 契约
# ============================================
contracts:
  input_schema: contracts/<name>/v1/input.schema.json
  output_schema: contracts/<name>/v1/output.schema.json

# ============================================
# 角色定义 (必填)
# ============================================
persona:
  role: "角色名称，如: 搜索与热词分析专家"
  style: "输出风格，如: 结构化、可审计、少形容词、多结论与证据"
  tone: professional                # professional | casual | formal | friendly

# ============================================
# 策略定义 (必填)
# ============================================
policy:
  decision_rules:
    - if: "<condition>"
      then: "<action>"
    # 更多决策规则...
  
  quality_bar:
    must_have:
      - "质量要求1，如: 每个聚类 >= 3 个关键词"
      - "质量要求2，如: 每个结论至少 1 条来源证据"
      - "质量要求3，如: 输出可被下游 agent 直接消费"
  
  refusal:
    conditions:
      - "requests_illegal_or_harmful"
      - "requires_personal_sensitive_data"

# ============================================
# 技能引用 (必填) - Agent 必须声明使用的 Skills
# ============================================
skills:
  - ref: skill.<domain>.<name>
  # 更多 skill 引用...

# ============================================
# 提示工程 (必填)
# ============================================
prompting:
  system: |
    You are <Agent Name>...
    
    Your responsibilities:
    - ...
  
  instructions:
    - "使用证据，引用来源"
    - "优先使用列表而非段落"
  
  output_format: json               # json | markdown | hybrid
  
  grounding:
    citations_required: true        # 是否要求引用来源

# ============================================
# 可观测性 (建议填写)
# ============================================
observability:
  log_level: info                   # debug | info | warn | error
  emit:
    - decision_trace
    - tool_calls
    - citations

# ============================================
# 知识库访问协议 (研发类 Agent 必填) - v1.1 新增
# ============================================
# 研发类 Agent 必须遵守知识库访问协议，避免重复踩坑
knowledge_access:
  # 是否启用知识库访问协议
  enabled: true                       # 研发类 Agent 必须为 true

  # 协议引用
  protocol_ref: protocols/knowledge-access/v1/protocol.yaml

  # 必须阅读的知识类型
  required_reading:
    - pitfalls                        # 踩坑记录，避免重复错误
    - patterns                        # 技术模式，复用方案

  # 建议阅读的知识类型
  recommended_reading:
    - best_practices                  # 最佳实践
    - tips                            # 效率提升技巧

  # 知识匹配标签（用于筛选相关知识）
  focus_tags:
    - "<tag1>"                        # 如: go, backend, testing
    - "<tag2>"

  # 执行前协议
  pre_execution:
    - scan_knowledge_directories      # 扫描知识库目录
    - load_pitfalls                   # 加载踩坑记录
    - load_patterns                   # 加载技术模式
    - generate_knowledge_summary      # 生成知识摘要
    - incorporate_into_decision       # 纳入决策

  # 知识应用规则
  application_rules:
    - rule: "遇到 pitfall 描述的场景"
      action: "必须使用 pitfall 中的解决方案"
    - rule: "存在可复用的 pattern"
      action: "优先使用 pattern 而非重新设计"
    - rule: "参考 best practice"
      action: "优化实现方案"

# ============================================
# 测试钩子 (必填)
# ============================================
tests:
  smoke:
    - name: basic_test
      input:
        <field_name>: "<test_value>"
      assert:
        - path: "$.<output_field>.length"
          op: ">="
          value: 1
        # 更多断言...
