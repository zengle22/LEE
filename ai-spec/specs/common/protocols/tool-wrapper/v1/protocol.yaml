# Tool Wrapper Protocol v1.0
# 工具包装协议 - 强制日志采集层
#
# 核心原则:
# - 所有外部动作必须通过工具层
# - 工具层是日志采集的强制执行点
# - Agent 无法绕过工具层直接执行外部操作
# - 每次工具调用自动产生 span

kind: protocol
version: "1.0"

metadata:
  id: protocol.common.tool_wrapper
  name: Tool Wrapper Protocol
  version: "1.0.0"
  description: |
    定义工具包装层的日志采集规范。

    这是日志稳定性的根基:
    - Agent 的所有外部动作 (文件/网络/数据库/命令) 必须通过工具层
    - 工具层自动为每次调用创建 span
    - 无论 Agent 是否配合，日志都会被采集

  author: agent-spec-maintainer
  created_at: "2026-01-11"
  tags:
    - tool
    - logging
    - infrastructure
    - enforcement

# ============================================
# 工具类型定义
# ============================================
tool_types:
  # 文件系统操作
  filesystem:
    tools:
      - name: file_read
        description: "读取文件"
        log_fields:
          - path
          - size_bytes
          - encoding
          - hash

      - name: file_write
        description: "写入文件"
        log_fields:
          - path
          - size_bytes
          - mode  # create/overwrite/append
          - hash
          - diff_ref  # 如果是修改

      - name: file_delete
        description: "删除文件"
        log_fields:
          - path
          - was_exists

      - name: glob
        description: "文件匹配"
        log_fields:
          - pattern
          - base_path
          - match_count

      - name: directory_list
        description: "列出目录"
        log_fields:
          - path
          - item_count

  # 命令执行
  shell:
    tools:
      - name: bash_execute
        description: "执行 shell 命令"
        log_fields:
          - command  # 脱敏后
          - working_dir
          - exit_code
          - stdout_size
          - stderr_size
          - timeout_ms
        sensitive_patterns:
          - passwords
          - tokens
          - api_keys

  # 代码搜索
  search:
    tools:
      - name: grep
        description: "内容搜索"
        log_fields:
          - pattern
          - path
          - match_count
          - flags

  # 网络请求
  http:
    tools:
      - name: http_request
        description: "HTTP 请求"
        log_fields:
          - method
          - url  # 脱敏 query params
          - status_code
          - request_size
          - response_size
          - latency_ms
        sensitive_fields:
          - authorization
          - cookie
          - x-api-key

      - name: web_fetch
        description: "获取网页内容"
        log_fields:
          - url
          - content_type
          - content_size
          - latency_ms

  # 数据库操作
  database:
    tools:
      - name: db_query
        description: "数据库查询"
        log_fields:
          - query_hash  # 不存原始 SQL
          - table
          - operation  # select/insert/update/delete
          - rows_affected
          - latency_ms

  # LSP 操作
  lsp:
    tools:
      - name: lsp_operation
        description: "语言服务协议操作"
        log_fields:
          - operation  # goToDefinition/findReferences/etc
          - file_path
          - line
          - character
          - result_count

  # 编辑操作
  edit:
    tools:
      - name: file_edit
        description: "文件编辑"
        log_fields:
          - file_path
          - old_string_hash
          - new_string_hash
          - replace_all
          - changes_count

# ============================================
# 包装器接口规范
# ============================================
wrapper_interface:
  description: |
    每个工具必须通过包装器调用，包装器负责:
    1. 调用前: 创建 span, 记录输入
    2. 调用中: 执行实际操作
    3. 调用后: 完成 span, 记录输出/错误

  lifecycle:
    before_call:
      actions:
        - create_span:
            span_type: tool
            name: "tool.{tool_name}"
            auto_fields:
              - span_id
              - parent_span_id  # 从 context 获取
              - run_id
              - started_at
              - tool.tool_name
              - tool.tool_type
              - input.hash
              - input.size_bytes

        - sanitize_input:
            apply_patterns: true
            log_original: false  # 永不记录原始敏感信息

    after_call:
      on_success:
        actions:
          - complete_span:
              status: success
              auto_fields:
                - completed_at
                - duration_ms
                - output.hash
                - output.size_bytes
                - metrics

          - record_artifact:
              if: "tool_type in [file_write, file_edit]"
              artifact_type: "file_{operation}"

      on_failure:
        actions:
          - fail_span:
              status: failed
              auto_fields:
                - completed_at
                - duration_ms
                - error.code
                - error.message

          - record_error:
              include_stack: true
              sanitize: true

    on_timeout:
      actions:
        - timeout_span:
            status: timeout
            auto_fields:
              - completed_at
              - duration_ms

# ============================================
# Context 传递
# ============================================
context_propagation:
  description: |
    每次工具调用需要从 context 获取追踪信息。
    Context 由 Orchestrator 在调用 Agent 时注入。

  required_context:
    - run_id
    - parent_span_id
    - trace_id  # 可选, 用于跨服务追踪

  context_injection:
    method: "thread_local"  # 或 explicit_parameter
    fallback: "create_orphan_span"  # 如果没有 context

# ============================================
# 脱敏规则
# ============================================
sanitization_rules:
  # 全局脱敏模式
  global_patterns:
    - pattern: '(password|passwd|pwd|secret|token|key|credential)[=:][^\s"'']*'
      replace: "$1=[REDACTED]"
      case_insensitive: true

    - pattern: 'Bearer [a-zA-Z0-9._-]+'
      replace: "Bearer [REDACTED]"

    - pattern: 'sk-[a-zA-Z0-9]+'
      replace: "[API_KEY]"

  # 工具特定脱敏
  tool_specific:
    bash_execute:
      - pattern: '--password[= ][^\s]+'
        replace: "--password [REDACTED]"
      - pattern: 'export [A-Z_]*KEY=[^\s]+'
        replace: "export [KEY]=[REDACTED]"

    http_request:
      headers_to_redact:
        - Authorization
        - X-API-Key
        - Cookie
        - Set-Cookie

    db_query:
      # 永不记录原始 SQL, 只记录 hash
      log_query_hash_only: true

# ============================================
# 采样策略
# ============================================
sampling:
  description: |
    对高频操作进行采样，避免日志爆炸。
    关键操作 (写/删除/执行) 始终记录。

  rules:
    # 始终记录 (100%)
    always_log:
      - file_write
      - file_delete
      - file_edit
      - bash_execute
      - http_request  # POST/PUT/DELETE
      - db_query      # INSERT/UPDATE/DELETE

    # 采样记录
    sampled:
      file_read:
        rate: 0.1  # 10%
        always_if: "size_bytes > 100000"  # 大文件始终记录

      glob:
        rate: 0.1
        always_if: "match_count > 100"

      grep:
        rate: 0.1
        always_if: "match_count > 50"

# ============================================
# 产物自动记录
# ============================================
artifact_recording:
  description: |
    文件变更自动记录为 Artifact。
    用于追溯 "谁在什么时候改了什么"。

  triggers:
    file_write:
      artifact_type: file_created
      record: [path, hash, size_bytes]
      compute_diff: false

    file_edit:
      artifact_type: file_modified
      record: [path, hash, size_bytes]
      compute_diff: true
      diff_storage: object_store

    file_delete:
      artifact_type: file_deleted
      record: [path]
      backup: optional  # 可配置是否备份

# ============================================
# 错误处理
# ============================================
error_handling:
  # 工具调用失败时
  on_tool_error:
    - log_error_span: true
    - include_stack: true
    - sanitize_error_message: true
    - retry_count_in_span: true

  # 包装器自身失败时 (不应发生)
  on_wrapper_error:
    - fallback_log: stderr
    - alert: true
    - continue_execution: true  # 不因日志失败阻塞业务

# ============================================
# 实现指南
# ============================================
implementation_guide:
  python: |
    # 示例: 文件写入包装器
    def tool_wrapper(tool_func):
        @functools.wraps(tool_func)
        def wrapper(*args, **kwargs):
            ctx = get_current_context()
            span = create_span(
                span_type="tool",
                name=f"tool.{tool_func.__name__}",
                parent_span_id=ctx.span_id,
                run_id=ctx.run_id
            )
            try:
                span.set_input(hash=hash_args(args, kwargs))
                result = tool_func(*args, **kwargs)
                span.set_output(hash=hash_result(result))
                span.complete(status="success")
                return result
            except Exception as e:
                span.fail(error=sanitize_error(e))
                raise
        return wrapper

  typescript: |
    // 示例: 工具包装器
    function wrapTool<T>(tool: Tool<T>): Tool<T> {
      return async (params: T) => {
        const ctx = getCurrentContext();
        const span = createSpan({
          type: 'tool',
          name: `tool.${tool.name}`,
          parentSpanId: ctx.spanId,
          runId: ctx.runId
        });
        try {
          span.setInput({ hash: hashParams(params) });
          const result = await tool.execute(params);
          span.setOutput({ hash: hashResult(result) });
          span.complete('success');
          return result;
        } catch (error) {
          span.fail(sanitizeError(error));
          throw error;
        }
      };
    }

# ============================================
# 验证清单
# ============================================
validation_checklist:
  - "所有文件操作通过包装器"
  - "所有命令执行通过包装器"
  - "所有 HTTP 请求通过包装器"
  - "敏感信息已脱敏"
  - "每次调用产生 span"
  - "span 有正确的 parent 链"
  - "大内容存对象存储"
  - "错误信息已记录"

# ============================================
# 版本历史
# ============================================
version_history:
  - version: "1.0.0"
    date: "2026-01-11"
    changes:
      - "初始版本"
      - "定义工具类型和日志字段"
      - "定义包装器接口规范"
      - "定义脱敏和采样策略"
      - "提供实现指南"
