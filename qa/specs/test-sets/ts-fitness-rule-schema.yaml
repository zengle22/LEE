# Test Set: Fitness Rule Schema Validation
# Module: fitness-rule-schema
# Derived from: FEAT-SRC-059-001 (frozen)
# Generated by: requirement_analysis step

metadata:
  id: TS-FITNESS-RULE-SCHEMA
  version: "1.0.0"
  module: fitness-rule-schema
  parent_feat: FEAT-SRC-059-001
  status: draft
  created_at: "2026-03-17T23:46:00+08:00"
  priority: P0
  
module_boundary:
  name: "Fitness Rule Schema 模块"
  description: "定义 fitness_rule.yaml 的 JSON Schema 及验证工具，为治理团队和 AI 执行器提供统一的 fitness 规则描述语言"
  
  scope:
    in:
      - fitness_rule.schema.json 定义
      - validate_fitness_rule.py 验证工具
      - YAML/JSON 双格式支持
      - 结构化错误输出（含行号、字段路径）
      - rule_type 枚举值校验（hard_gate, quality_signal）
      - pass_criteria 多类型支持（exit_code, regex_match, json_path, file_exists）
    
    out:
      - 规则执行逻辑实现
      - 与现有 gate 规则文件的迁移
      - Fitness Function Runner 实现
      - Evidence Pack 生成
  
  interfaces:
    input:
      - name: fitness_rule.yaml
        format: [YAML, JSON]
        required_fields: [rule_id, rule_type, scan_command, pass_criteria, description]
      - name: fitness_rule.json
        format: JSON
        schema: "https://json-schema.org/draft/2020-12/schema"
    
    output:
      - name: validation_result
        format: structured_json
        fields: [valid, errors, line_numbers, field_paths]
      - name: exit_code
        type: integer
        success: 0
        failure: non-zero
  
  dependencies:
    - EPIC-SRC-059-001 (parent)
    - ADR-024 (Fitness Function 定义)
    - ADR-015 (Schema 验证规范)
    - ADR-017 (Gate 语义)
    - ADR-020 (Evidence Pack)
  
  constraints:
    - "Fitness Rule 必须支持 YAML 和 JSON 两种输入格式"
    - "验证失败时必须输出结构化错误信息，包含行号和字段路径"
    - "rule_type 必须为 hard_gate 或 quality_signal 枚举值"
    - "Schema 版本必须使用 JSON Schema Draft 2020-12"

testable_features:
  - id: TF-001
    name: "Schema 结构完整性验证"
    description: "验证 fitness_rule.schema.json 定义包含所有必需字段"
    acceptance_criteria_ref: AC-001
    priority: P0
    testable_aspects:
      - rule_id 字段存在且符合 FIT-XXX 格式
      - rule_type 字段存在且为枚举值
      - scan_command 字段存在且结构正确
      - pass_criteria 字段存在且支持多类型
      - description 字段存在
    
  - id: TF-002
    name: "YAML 格式规则文件验证"
    description: "验证工具能够正确验证 YAML 格式的 fitness rule 文件"
    acceptance_criteria_ref: AC-001, AC-002, AC-003
    priority: P0
    testable_aspects:
      - 合法的 YAML 文件验证通过
      - 非法的 YAML 文件验证失败
      - 错误信息包含行号
      - 错误信息包含字段路径
    
  - id: TF-003
    name: "JSON 格式规则文件验证"
    description: "验证工具能够正确验证 JSON 格式的 fitness rule 文件"
    acceptance_criteria_ref: AC-001, AC-002, AC-003
    priority: P0
    testable_aspects:
      - 合法的 JSON 文件验证通过
      - 非法的 JSON 文件验证失败
      - 错误信息包含行号
      - 错误信息包含字段路径
    
  - id: TF-004
    name: "rule_type 枚举值验证"
    description: "验证 rule_type 字段只接受 hard_gate 或 quality_signal"
    acceptance_criteria_ref: AC-002
    priority: P0
    testable_aspects:
      - hard_gate 值被接受
      - quality_signal 值被接受
      - 其他值被拒绝并报告错误
    
  - id: TF-005
    name: "pass_criteria 类型条件验证"
    description: "验证 pass_criteria 根据 kind 值要求不同的必填字段"
    acceptance_criteria_ref: AC-001, AC-002
    priority: P1
    testable_aspects:
      - kind=exit_code 时 exit_code 字段必填
      - kind=regex_match 时 pattern 字段必填
      - kind=json_path 时 json_path 和 expected_value 字段必填
      - kind=file_exists 时 file_path 字段必填
    
  - id: TF-006
    name: "验证结果输出格式"
    description: "验证验证工具输出符合预期的结构化格式"
    acceptance_criteria_ref: AC-001, AC-002
    priority: P0
    testable_aspects:
      - 验证通过时返回零退出码
      - 验证失败时返回非零退出码
      - 错误输出为结构化 JSON
      - 包含行号信息
      - 包含字段路径信息
    
  - id: TF-007
    name: "rule_id 格式验证"
    description: "验证 rule_id 符合 FIT-[A-Z0-9_-]+ 格式规范"
    acceptance_criteria_ref: AC-002
    priority: P1
    testable_aspects:
      - 符合格式的 ID 被接受
      - 不符合格式的 ID 被拒绝
      - 错误信息指明格式要求

  - id: TF-008
    name: "可选字段验证"
    description: "验证可选字段的正确处理"
    acceptance_criteria_ref: AC-001
    priority: P2
    testable_aspects:
      - dimension 字段可选但必须是枚举值
      - severity 字段可选且默认为 blocker
      - evidence_binding 字段可选
      - metadata 字段可选

risk_areas:
  - id: RISK-001
    description: "YAML/JSON 格式边界情况处理"
    mitigation: "测试空文件、嵌套深度过大、特殊字符等边界情况"
  
  - id: RISK-002
    description: "结构化错误信息准确性"
    mitigation: "确保行号和字段路径与实际错误位置一致"
  
  - id: RISK-003
    description: "Schema 条件验证逻辑正确性"
    mitigation: "验证 if/then/else 条件 schema 的正确应用"
