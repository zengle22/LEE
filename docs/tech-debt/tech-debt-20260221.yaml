  - id: TD-001
    category: security
    severity: critical
    title: SQL Injection Risk via String Concatenation
    description: |
      Using f-string concatenation to build SET clauses in SQL UPDATE statements.
      While parameters use placeholders, column names are directly concatenated.
    location:
      file: src/lee/orchestrator/storage/sqlite_store.py
      lines: [344, 348, 470, 474]
    impact: "Potential SQL injection if column names are user-controlled"
    remediation: |
      - Implement column name whitelist validation
      - Or use ORM with proper escaping
      - Add integration tests for SQL injection scenarios
    estimated_effort: "2-4 hours"
    references: []

  - id: TD-002
    category: code_quality
    severity: critical
    title: Bare except Clauses Catch All Exceptions
    description: |
      Multiple files use bare `except:` clauses that catch all exceptions
      including SystemExit and KeyboardInterrupt, masking real errors.
    location:
      - file: src/lee/orchestrator/execution/file_output_handler.py
        lines: [407, 414]
      - file: src/lee/orchestrator/core/project_config.py
        lines: [637]
      - file: src/lee/orchestrator/core/token_manager.py
        lines: [277]
    impact: "Silently fails on critical errors, makes debugging impossible"
    remediation: |
      - Replace `except:` with `except Exception:`
      - Add proper error logging
      - Consider specific exception types
    estimated_effort: "1-2 hours"
    references: []

  - id: TD-003
    category: security
    severity: critical
    title: Command Injection via shell=True
    description: |
      subprocess.Popen uses shell=True by default, allowing command injection
      if command arguments contain user input.
    location:
      file: src/lee/runtime/executor/tools/shell_tools.py
      lines: [34, 64]
    impact: "Arbitrary command execution if input is not sanitized"
    remediation: |
      - Default to shell=False
      - If shell=True is required, use shlex.quote() to escape arguments
      - Pass commands as lists instead of strings
    estimated_effort: "2-3 hours"
    references: []

