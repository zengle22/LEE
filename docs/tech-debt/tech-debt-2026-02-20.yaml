      title: "类型注解缺失严重"
      category: "类型安全"
      severity: "high"
      files:
        - path: "src/lee/cli/main.py"
          lines: [57, 86, 88, 129]
        - path: "src/lee/cli/commands/run.py"
          lines: [37, 61, 625, 631]
      description: |
        关键函数缺乏类型注解，包括：
        - _should_lock() 参数和返回类型未定义
        - _acquire_cli_lock() 返回类型为 Optional[int] 但参数未标注
        - _resolve_project_dir() 缺少参数类型
      impact: |
        - 降低代码可维护性
        - IDE 支持受限
        - 潜在的类型相关运行时错误
      recommended_action: |
        - 为所有公共和私有函数添加完整的类型注解
        - 启用 mypy 严格模式检查
        - 在 CI/CD 中集成类型检查
      estimated_effort: "2-3 天"
      dependencies: []

    - issue_id: "CQ-002"
      title: "代码重复 - 命令重复注册"
      category: "代码重复"
      severity: "high"
      files:
        - path: "src/lee/cli/main.py"
