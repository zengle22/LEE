# STG Opportunity Discovery Workflow
# 商业机会发现工作流配置

kind: workflow
id: workflow.stg.opportunity_discovery
name: 商业机会发现工作流
version: "1.0"

description: >
  完整的 5 层商业机会发现流程：
  1. Search Agent (事实采集)
  2. Analysis Agents (用户/行业/供给)
  3. Market Freeze (冻结)
  4. Business Opportunity (机会构建)
  5. Product Handoff (交付)

steps:
  # Step 1: 搜索采集
  - id: search_signals
    name: 搜索采集市场信号
    kind: agent
    agent: search_agent
    description: |
      采集显性发生的市场搜索信号。
      输出：关键词、趋势、量级、地理分布
    inputs: []
    outputs:
      - path: contracts/search_signals/v1/signals.yaml
        required: true

  # Step 2a: 用户信号分析
  - id: analyze_user_signals
    name: 用户信号分析
    kind: agent
    agent: user_signal_agent
    depends_on:
      - search_signals
    description: |
      分析"谁在搜 & 为什么"
    inputs:
      - from_step: search_signals
    outputs:
      - path: contracts/user_hypothesis/v1/hypothesis.yaml
        required: true

  # Step 2b: 行业结构分析
  - id: analyze_industry_structure
    name: 行业结构分析
    kind: agent
    agent: industry_structure_agent
    depends_on:
      - search_signals
    description: |
      评估"行业处在哪"
    inputs:
      - from_step: search_signals
    outputs:
      - path: contracts/industry_structure/v1/structure.yaml
        required: true

  # Step 2c: 供给竞争分析
  - id: analyze_supply_competition
    name: 供给竞争分析
    kind: agent
    agent: supply_competition_agent
    depends_on:
      - search_signals
    description: |
      分析"方案解决得如何"
    inputs:
      - from_step: search_signals
    outputs:
      - path: contracts/supply_gap/v1/gap.yaml
        required: true

  # Step 3: 市场信号冻结
  - id: freeze_market_signals
    name: 市场信号冻结
    kind: human_gate
    depends_on:
      - analyze_user_signals
      - analyze_industry_structure
      - analyze_supply_competition
    description: |
      冻结分析层的所有结论
      这是系统稳定性的根！
    gate: freeze_approval
    outputs:
      - path: contracts/market_signal_freeze/v1/freeze.yaml
        required: true

  # Step 4: 商业机会构建
  - id: build_business_opportunity
    name: 构建商业机会假设
    kind: agent
    agent: business_opportunity_agent
    depends_on:
      - freeze_market_signals
    description: |
      基于冻结数据，构建可验证的机会假设
    inputs:
      - from_step: freeze_market_signals
    outputs:
      - path: contracts/business_opportunity/v1/opportunity.yaml
        required: true

  # Step 5: 产品部门交付
  - id: product_handoff
    name: 产品部门交付
    kind: skill
    skill: product_handoff_generator
    depends_on:
      - build_business_opportunity
    description: |
      转化为标准产品交付文档
    inputs:
      - from_step: build_business_opportunity
      - from_step: freeze_market_signals
    outputs:
      - path: contracts/product_handoff/v1/handoff.yaml
        required: true

config:
  max_parallel_steps: 3
  timeout:
    search_signals: 3600
    analyze_user_signals: 1800
    analyze_industry_structure: 1800
    analyze_supply_competition: 1800
    freeze_market_signals: 86400
    build_business_opportunity: 1800
    product_handoff: 600
