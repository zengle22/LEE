# CI Skill Spec - 运行单元测试
# 这是一个使用 Shell 执行测试的 Skill 规范

kind: skill
id: ci.run_tests
name: 运行单元测试
version: "1.0.0"

description: |
  使用 pytest 运行单元测试，并生成 JUnit 格式的测试报告。

# Engine 配置
engine:
  type: shell
  command: python tests/run_tests.py
  working_dir: .

# 输入配置
inputs:
  - name: test_files
    description: 测试文件（通常在 tests/ 目录）
    required: false

# 输出配置
outputs:
  - path: reports/unit_test_report.xml
    description: 测试执行报告
    required: true

# 超时配置（秒）
timeout: 300

# 失败处理
on_failure:
  retry: 1
  retry_delay: 5
