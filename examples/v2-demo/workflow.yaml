# Demo Workflow - 简单的开发 + 测试流程
# 这是一个最小化的示例，展示如何定义一个包含 Agent 和 Skill 的工作流

kind: workflow
id: demo_flow
name: Demo 开发 + 测试流程
version: "1.0"

description: |
  一个简单的示例工作流，包含：
  1. 使用 LLM Agent 生成代码
  2. 使用 Shell Skill 运行测试

steps:
  # Step 1: 使用 Agent 生成代码
  - id: generate_code
    name: 生成 Python 函数
    kind: agent
    agent: developer
    description: |
      生成一个简单的 Python 函数，保存到 src/demo.py。
      函数名为 add(a: int, b: int) -> int，返回 a + b。
    inputs: []
    outputs:
      - path: src/demo.py
        required: true
        description: 生成的 Python 函数文件

  # Step 2: 使用 Skill 运行测试
  - id: run_unit_tests
    name: 运行单元测试
    kind: skill
    skill: ci.run_tests
    depends_on:
      - generate_code
    description: |
      运行 pytest，确保测试全部通过，并生成 junit 报告。
    outputs:
      - path: reports/unit_test_report.xml
        required: true
        description: JUnit 格式的测试报告
