# 示例 Workflow：包含 Human Gate
# 展示 PM Agent + Gate Assistant 的完整协作流程

workflow:
  id: demo_with_gate
  name: Demo Workflow with Human Gate
  version: 1.0
  description: |
    一个演示 workflow，展示如何使用 human gate 进行审批。
    包含代码生成、测试运行、人工评审三个步骤。

steps:
  # 步骤 1: 生成代码
  - id: generate_code
    kind: agent
    agent: developer
    name: 生成示例代码
    description: |
      根据需求生成 Python 示例代码
    engine:
      type: llm
      provider: custom
      base_url: http://127.0.0.1:8045/v1
      api_key: sk-2988e892730744ccafde80aac9ced361
      model: gemini-3-flash
    system_prompt: |
      你是一个 Python 开发者，负责生成示例代码。
      请按照要求生成简洁、可运行的代码。
    user_prompt: |
      生成一个简单的 Python 计算器类，支持加减乘除运算。
    outputs:
      - path: demo/src/calculator.py
        description: 计算器类实现

  # 步骤 2: 运行测试
  - id: run_tests
    kind: skill
    name: 运行单元测试
    depends_on:
      - generate_code
    description: |
      运行代码的单元测试
    engine:
      type: shell
      command: |
        cd demo && python -m pytest tests/ -v
      timeout: 30
    outputs:
      - path: demo/reports/test_report.txt
        description: 测试报告

  # 步骤 3: 代码评审 Gate (Human Gate)
  - id: code_review_gate
    kind: human_gate
    depends_on:
      - run_tests
    name: 代码评审 Gate
    description: |
      人工评审代码质量和测试结果
    gate:
      approvers:
        - role: developer
          required: true
        - role: reviewer
          required: true
      options: [approve, reject, revise]
      checklist:
        - item: "代码是否符合 PEP 8 规范？"
          required: true
        - item: "是否包含必要的注释？"
          required: true
        - item: "测试覆盖率是否足够？"
          required: true
        - item: "是否有明显的安全问题？"
          required: true
      # 如果拒绝，可以回退到这个步骤
      on_reject:
        action: rollback
        target_step: generate_code
      # 如果要求修改，继续到这个步骤
      on_revise:
        action: continue
        target_step: generate_code

  # 步骤 4: 部署（通过 gate 后才能执行）
  - id: deploy
    kind: skill
    depends_on:
      - code_review_gate
    name: 部署应用
    description: |
      将代码部署到测试环境
    engine:
      type: shell
      command: |
        cd demo && ./deploy.sh test
      timeout: 60
    outputs:
      - path: demo/deploy/deployment_log.txt
        description: 部署日志

# 工作流级别的配置
config:
  max_parallel_steps: 3
  timeout: 3600
  retry_on_failure:
    max_retries: 2
    retry_delay: 5
