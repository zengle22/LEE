# status: legacy
# format: orchestrator-legacy-template
# NOTE:
#   - New workflows MUST use spec-global format.
#   - This file exists only for backward compatibility and migration.
#   - Use 'lee migrate-workflow <template_id>' to migrate to spec-global.
#
# 模板定义示例
# 展示工作流模板的 YAML 格式

---
# L1: 项目级模板
name: project_main
description: "企业级 AI 聊天机器人"

# 项目级变量
variables:
  project_name: "AI ChatBot"
  tech_stack: ["Python", "FastAPI", "Vue.js"]
  deadline: "2024-06-30"

# 子工作流（部门）
departments:
  - name: "开发"
    template: "dept_development"
    data:
      dept_name: "开发部门"
  - name: "测试"
    template: "dept_testing"
    data:
      dept_name: "测试部门"

# 完成条件
completion_criteria:
  all_departments_completed: true
  acceptance_tests_passed: true

---

# L2: 部门级模板 - 开发
name: dept_development
description: "管理所有开发任务"

variables:
  dept_name: "开发部门"
  lead: "张三"

# 部门任务
tasks:
  - name: "后端 API 开发"
    template: "task_backend_api"
    priority: "P0"
    depends_on: []
    data:
      task_name: "后端 API 开发"
      assignee: "王五"
      estimated_hours: 40

  - name: "前端 UI 开发"
    template: "task_frontend_ui"
    priority: "P1"
    depends_on: ["后端 API 开发"]
    data:
      task_name: "前端 UI 开发"
      assignee: "赵六"
      estimated_hours: 32

completion_criteria:
  all_tasks_completed: true

---

# L2: 部门级模板 - 测试
name: dept_testing
description: "管理所有测试任务"

variables:
  dept_name: "测试部门"
  lead: "李四"

tasks:
  - name: "集成测试"
    template: "task_integration_test"
    priority: "P0"
    depends_on: []
    data:
      task_name: "集成测试"
      assignee: "孙七"
      estimated_hours: 24

completion_criteria:
  all_tasks_completed: true
  acceptance_tests_passed: true

---

# L3: 任务级模板 - 后端 API
name: task_backend_api
description: "开发 FastAPI 后端服务"

executor: llm

steps:
  - name: "设计 API 接口"
    executor: llm
    input:
      prompt: "设计用户认证 API 接口，包括登录、注册、密码重置"
      system_message: "你是一个 API 设计专家"

  - name: "实现 API 代码"
    executor: llm
    input:
      prompt: "基于接口设计，实现 FastAPI 代码"
      system_message: "你是一个 Python 后端专家"
    depends_on: ["设计 API 接口"]

  - name: "单元测试"
    executor: shell
    input:
      command: "pytest tests/test_api.py -v"
    depends_on: ["实现 API 代码"]

completion_criteria:
  code_coverage_above: 80%
  all_tests_passed: true

---

# L3: 任务级模板 - 前端 UI
name: task_frontend_ui
description: "开发 Vue.js 前端界面"

executor: llm

steps:
  - name: "设计页面布局"
    executor: llm
    input:
      prompt: "设计聊天机器人主页面布局"
      system_message: "你是一个 UI/UX 设计专家"

  - name: "实现 Vue 组件"
    executor: llm
    input:
      prompt: "实现 Vue.js 组件代码"
      system_message: "你是一个 Vue.js 前端专家"
    depends_on: ["设计页面布局"]

completion_criteria:
  component_count: 5
  design_approved: true

---

# L3: 任务级模板 - 集成测试
name: task_integration_test
description: "端到端集成测试"

executor: shell

steps:
  - name: "启动后端服务"
    executor: shell
    input:
      command: "python -m uvicorn main:app --port 8000"
      timeout: 5

  - name: "运行集成测试"
    executor: llm
    input:
      prompt: "编写并运行集成测试脚本，测试后端 API"
      system_message: "你是一个测试工程师"
    depends_on: ["启动后端服务"]

  - name: "关闭后端服务"
    executor: shell
    input:
      command: "pkill -f uvicorn"
    depends_on: ["运行集成测试"]

completion_criteria:
  all_tests_passed: true
  test_coverage_above: 70%
