## 4. 合同边界定义

### 4.1 合同内（本 Contract 范围）

- GatePurpose 和 GateDecisionMode 枚举定义
- GateApproval 模型扩展
- API 端点请求/响应 DTO
- 组合验证逻辑
- 历史分类映射

### 4.2 合同外（后续阶段范围）

