## 1. 需求来源分析

### 1.1 技术架构需求 (来自 TECH-FEAT-SRC-041-001)

**AD-001**: 引入 purpose 和 decision_mode 双轴模型
- 影响：GateApproval 数据模型需扩展双轴字段
- 影响：Runner 路由逻辑需支持双轴解析
- 影响：历史配置需提供兼容映射

**AD-002**: approval purpose 只能与 human_required decision_mode 组合
- 影响：需在 Runner 层和 Store 层双重验证组合合法性
- 影响：工作流模板配置需校验

**AD-003**: 历史分类仅作为映射到双轴模型的兼容入口
- 影响：需提供完整的默认值映射表
- 影响：legacy_gate_type 字段标记为废弃中

### 1.2 治理约束 (来自 ADR-017)

- 正式责任确认、freeze、release 必须由人类决策
- approval 默认必须 human_required
- human_gate_context 是所有人工 gate 的强制前置物

### 1.3 功能需求 (来自 FEAT-SRC-041-001)

- 将 gate 的分类从单一 gate_type 轴收敛到二维模型
- purpose 轴定义为 review（质量判断）和 approval（正式责任确认）
- decision_mode 轴定义为 auto、conditional_human、human_required
- 禁止 approval + auto 的非法组合

---

## 2. API 需求提取

### 2.1 新增枚举定义

| 枚举名称 | 用途 | 值域 |
|---------|------|------|
| GatePurpose | 定义 Gate 职责语义 | review, approval |
| GateDecisionMode | 定义 Gate 决策方式 | auto, conditional_human, human_required |

### 2.2 数据模型扩展

| 模型 | 新增字段 | 类型 | 必填 |
|------|---------|------|------|
| GateApproval | purpose | GatePurpose | 是 |
| GateApproval | decision_mode | GateDecisionMode | 是 |
| GateApproval | legacy_gate_type | Optional[str] | 否 |

### 2.3 API 端点需求

| 端点 | Method | 用途 | 新增/修改 |
|------|--------|------|----------|
| /api/v1/gate-approvals | POST | 创建 Gate Approval | 修改（添加双轴字段） |
| /api/v1/gate-approvals/{gate_id} | GET | 获取 Gate Approval | 修改（返回双轴字段） |
| /api/v1/workflows/{workflow_id}/gates | GET | 列出 Gates | 修改（支持双轴过滤） |
| /api/v1/gate-approvals/{gate_id}/decide | POST | 决策 Gate | 不变 |

### 2.4 验证规则需求

| 规则 ID | 规则描述 | 严重性 | 验证时机 |
|--------|---------|--------|---------|
| VR-001 | purpose 必须是 REVIEW 或 APPROVAL | blocker | 创建/更新时 |
| VR-002 | decision_mode 必须是 AUTO/CONDITIONAL_HUMAN/HUMAN_REQUIRED | blocker | 创建/更新时 |
| VR-003 | APPROVAL + AUTO 组合非法 | blocker | 创建/更新时 |
| VR-004 | APPROVAL + CONDITIONAL_HUMAN 组合非法 | blocker | 创建/更新时 |
| VR-005 | 历史配置必须能映射到双轴模型 | major | 迁移时 |

