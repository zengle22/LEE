## 4. Validation Rules

### 4.1 组合验证

```python
def validate_purpose_mode_combination(purpose: GatePurpose, decision_mode: GateDecisionMode) -> bool:
    """验证 purpose 和 decision_mode 的组合合法性"""
    if purpose == GatePurpose.APPROVAL:
        # approval 只能与 human_required 组合
        return decision_mode == GateDecisionMode.HUMAN_REQUIRED
    elif purpose == GatePurpose.REVIEW:
        # review 可以与任意 decision_mode 组合
        return decision_mode in [GateDecisionMode.AUTO, GateDecisionMode.CONDITIONAL_HUMAN, GateDecisionMode.HUMAN_REQUIRED]
    return False
```

**验证时机**:
- 创建 GateApproval 时
- 更新 purpose 或 decision_mode 时
- SQLiteStore 写入前

**错误信息**:
```
Invalid combination: purpose=APPROVAL with decision_mode=AUTO is not allowed.
APPROVAL purpose must be paired with HUMAN_REQUIRED decision_mode only.
```

---

### 4.2 字段验证

| 字段 | 验证规则 | 错误信息 |
|------|---------|---------|
| purpose | 必须是 REVIEW 或 APPROVAL | Invalid purpose value |
| decision_mode | 必须是 AUTO/CONDITIONAL_HUMAN/HUMAN_REQUIRED | Invalid decision_mode value |
| purpose + decision_mode | 必须通过组合验证 | Invalid combination |

