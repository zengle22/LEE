## 3. API Endpoints

### 3.1 创建 Gate Approval

**端点**: `POST /api/v1/gate-approvals`

**请求 DTO**: `CreateGateApprovalRequest`
```yaml
fields:
  - name: workflow_id
    type: string
    required: true
    description: 工作流 ID
  - name: gate_id
    type: string
    required: true
    description: 门禁 ID
  - name: step_id
    type: string
    required: true
    description: 步骤 ID
  - name: purpose
    type: string
    required: true
    enum: [review, approval]
    description: Gate 目的
  - name: decision_mode
    type: string
    required: true
    enum: [auto, conditional_human, human_required]
    description: 决策方式
  - name: legacy_gate_type
    type: string
    required: false
    description: 历史分类（可选，用于兼容映射）
  - name: approval_criteria
    type: array
    required: false
    description: 审批标准列表
  - name: reviewers
    type: array
    required: false
    description: 审批人列表
```

**响应 DTO**: `CreateGateApprovalResponse`
```yaml
fields:
  - name: gate_approval_id
    type: string
    required: true
    description: 创建的 GateApproval ID
  - name: status
    type: string
    required: true
    description: 初始状态（PENDING）
  - name: created_at
    type: string
    format: date-time
    required: true
```

**错误码**:
- `400`: 非法组合（如 APPROVAL + AUTO）
- `409`: 已存在待审批的 Gate

