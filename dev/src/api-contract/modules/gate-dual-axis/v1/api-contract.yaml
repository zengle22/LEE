### 3.4 决策 Gate

**端点**: `POST /api/v1/gate-approvals/{gate_id}/decide`

**路径参数**:
- `gate_id`: string - 门禁 ID

**请求 DTO**: `DecideGateRequest`
```yaml
fields:
  - name: status
    type: string
    required: true
    enum: [approved, rejected, revised, flagged]
    description: 决策结果
  - name: approver
    type: string
    required: true
    description: 审批人 ID
  - name: comments
    type: string
    required: false
    description: 审批意见
  - name: decision_action
    type: string
    required: false
    description: 执行的 action（如 rollback, retry）
  - name: target_step
    type: string
    required: false
    description: 目标步骤 ID
  - name: structured_feedback
    type: object
    required: false
    description: 结构化反馈
```

**响应 DTO**: `DecideGateResponse`
```yaml
fields:
  - name: gate_id
    type: string
    required: true
  - name: new_status
    type: string
    required: true
  - name: decided_at
    type: string
    format: date-time
    required: true
  - name: next_step_id
    type: string
    required: false
    description: 下一步骤 ID（根据决策结果计算）
```

**错误码**:
- `400`: 决策无效（如审批人不在 reviewers 列表中）
- `404`: Gate 不存在
- `409`: Gate 已决策

