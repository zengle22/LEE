### 3.2 Runner 接口 (HumanGateRunner)

**实现文件**: `src/lee/orchestrator/execution/runners/gate_runner.py`

```python
class HumanGateRunner:
    async def execute(self, workflow_id: str, step, ctx: RunnerContext) -> StepResult:
        """
        处理 Human Gate 步骤

        双轴逻辑:
        1. 从 step.config 提取 purpose 和 decision_mode
        2. 验证组合合法性 (APPROVAL + HUMAN_REQUIRED 必须)
        3. 创建 GateApproval 记录 (包含双轴字段)
        4. 暂停工作流等待人工审批
        """

    def _get_purpose_from_config(self, step_config: dict) -> GatePurpose:
        """
        从步骤配置解析 purpose
        默认值：REVIEW
        """

    def _get_decision_mode_from_config(self, step_config: dict) -> GateDecisionMode:
        """
        从步骤配置解析 decision_mode
        默认值：HUMAN_REQUIRED
        """
```

