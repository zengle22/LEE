## 1. Enum Definitions

### 1.1 GatePurpose

枚举 Gate 的目的，用于区分 Gate 的职责语义。

```python
class GatePurpose(str, Enum):
    REVIEW = "review"        # 质量判断，不表达正式责任确认
    APPROVAL = "approval"    # 正式责任确认，必须与 human_required 组合
```

**字段说明**:
- `REVIEW`: 用于质量把关、代码审核、测试验证等非正式确认场景
- `APPROVAL`: 用于 freeze、release、merge、risk acceptance 等正式责任确认场景

**约束规则**:
- `APPROVAL` purpose 只能与 `HUMAN_REQUIRED` decision_mode 组合
- `REVIEW` purpose 可以与任意 decision_mode 组合

### 1.2 GateDecisionMode

枚举 Gate 的决策方式，用于定义 Gate 的触发条件。

```python
class GateDecisionMode(str, Enum):
    AUTO = "auto"                    # 自动通过，无需人工干预
    CONDITIONAL_HUMAN = "conditional_human"  # 条件触发人工审批
    HUMAN_REQUIRED = "human_required"        # 必须人工审批
```

**字段说明**:
- `AUTO`: 满足条件后自动通过，适用于低风险场景
- `CONDITIONAL_HUMAN`: 根据配置条件（如金额阈值、风险等级）决定是否触发人工审批
- `HUMAN_REQUIRED`: 必须由人工明确批准，适用于正式责任确认场景

**约束规则**:
- `APPROVAL + AUTO` 组合非法
- `APPROVAL + CONDITIONAL_HUMAN` 组合非法
- `APPROVAL + HUMAN_REQUIRED` 组合合法（强制）
- `REVIEW + AUTO/CONDITIONAL_HUMAN/HUMAN_REQUIRED` 组合均合法

