## 2. Data Model Extensions

### 2.1 GateApproval 扩展

在现有 `GateApproval` 数据模型基础上新增双轴字段。

**现有字段** (保持不变):
```python
workflow_id: str
gate_id: str
step_id: str
status: GateStatus
approver: Optional[str]
comments: Optional[str]
created_at: datetime
decided_at: Optional[datetime]
approval_criteria: List[Dict[str, Any]]
reviewers: List[Dict[str, str]]
version: int
default_reject_action: Optional[str]
default_reject_target: Optional[str]
default_revise_target: Optional[str]
decision_action: Optional[str]
target_step: Optional[str]
structured_feedback: Optional[Dict[str, Any]]
issues: Optional[List[str]]
invalidated_at: Optional[datetime]
```

**新增字段** (P0):
```python
purpose: GatePurpose                          # 必填：Gate 目的
decision_mode: GateDecisionMode               # 必填：决策方式
legacy_gate_type: Optional[str]               # 可选：历史分类映射（废弃中）
```

**完整模型**:
```python
@dataclass
class GateApproval:
    workflow_id: str
    gate_id: str
    step_id: str
    status: GateStatus = GateStatus.PENDING
    approver: Optional[str] = None
    comments: Optional[str] = None
    created_at: datetime = field(default_factory=datetime.now)
    decided_at: Optional[datetime] = None
    approval_criteria: List[Dict[str, Any]] = field(default_factory=list)
    reviewers: List[Dict[str, str]] = field(default_factory=list)
    version: int = 1

    # === 双轴模型新增字段 ===
    purpose: GatePurpose
    decision_mode: GateDecisionMode
    legacy_gate_type: Optional[str] = None  # 历史分类映射

    # v1.1 原有字段
    default_reject_action: Optional[str] = None
    default_reject_target: Optional[str] = None
    default_revise_target: Optional[str] = None
    decision_action: Optional[str] = None
    target_step: Optional[str] = None
    structured_feedback: Optional[Dict[str, Any]] = None
    issues: Optional[List[str]] = None
    invalidated_at: Optional[datetime] = None
```

