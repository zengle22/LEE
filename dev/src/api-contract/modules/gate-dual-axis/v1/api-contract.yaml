## 5. Legacy Compatibility

### 5.1 历史分类映射表

| 历史 gate_type | purpose | decision_mode | 说明 |
|---------------|---------|---------------|------|
| code_review | REVIEW | HUMAN_REQUIRED | 代码审核 |
| quality_gate | REVIEW | HUMAN_REQUIRED | 质量门禁 |
| security_review | REVIEW | HUMAN_REQUIRED | 安全审查 |
| compliance_check | REVIEW | CONDITIONAL_HUMAN | 合规检查 |
| auto_test | REVIEW | AUTO | 自动化测试 |
| freeze | APPROVAL | HUMAN_REQUIRED | 冻结操作 |
| release | APPROVAL | HUMAN_REQUIRED | 发布操作 |
| merge | APPROVAL | HUMAN_REQUIRED | 合并操作 |
| risk_acceptance | APPROVAL | HUMAN_REQUIRED | 风险接受 |

### 5.2 映射函数

```python
def map_legacy_to_dual_axis(legacy_gate_type: Optional[str]) -> Tuple[GatePurpose, GateDecisionMode]:
    """将历史分类映射到双轴模型"""
    MAPPING = {
        # REVIEW purposes
        "code_review": (GatePurpose.REVIEW, GateDecisionMode.HUMAN_REQUIRED),
        "quality_gate": (GatePurpose.REVIEW, GateDecisionMode.HUMAN_REQUIRED),
        "security_review": (GatePurpose.REVIEW, GateDecisionMode.HUMAN_REQUIRED),
        "compliance_check": (GatePurpose.REVIEW, GateDecisionMode.CONDITIONAL_HUMAN),
        "auto_test": (GatePurpose.REVIEW, GateDecisionMode.AUTO),
        # APPROVAL purposes
        "freeze": (GatePurpose.APPROVAL, GateDecisionMode.HUMAN_REQUIRED),
        "release": (GatePurpose.APPROVAL, GateDecisionMode.HUMAN_REQUIRED),
        "merge": (GatePurpose.APPROVAL, GateDecisionMode.HUMAN_REQUIRED),
        "risk_acceptance": (GatePurpose.APPROVAL, GateDecisionMode.HUMAN_REQUIRED),
    }

    if legacy_gate_type and legacy_gate_type in MAPPING:
        return MAPPING[legacy_gate_type]

    # 默认值：REVIEW + HUMAN_REQUIRED
    return (GatePurpose.REVIEW, GateDecisionMode.HUMAN_REQUIRED)
```

