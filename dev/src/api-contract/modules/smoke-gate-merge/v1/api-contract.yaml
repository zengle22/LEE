## 4. Validation Rules

### 4.1 Gate 状态转换规则

```
NOT_STARTED → RUNNING → {PASSED | FAILED | INVALID}
```

**非法转换**:
- NOT_STARTED → PASSED (跳过执行)
- RUNNING → RUNNING (重复执行需先创建新 context)
- PASSED → RUNNING (已通过不允许重新执行)
- FAILED → PASSED (失败不允许直接改通过)

### 4.2 Merge 允许条件

```python
def is_merge_allowed(state: MergeGateState) -> bool:
    """判定是否允许 merge"""
    if state.gate_status != SmokeGateStatus.PASSED:
        return False
    if state.gate_result != GateResult.ALLOW_MERGE:
        return False
    if len(state.blocker_issues) > 0:
        return False
    return True
```

### 4.3 Blocker 判定规则

```python
def determine_severity(failure: TestExecutionRecord) -> FailureSeverity:
    """根据失败类型判定严重程度"""
    if failure.priority == "P0":
        return FailureSeverity.BLOCKER
    elif failure.priority == "P1":
        return FailureSeverity.BLOCKER
    elif failure.is_flaky:
        return FailureSeverity.FLAKY
    else:
        return FailureSeverity.CRITICAL
```

### 4.4 重试规则

| 条件 | 重试次数 | 最终判定 |
|------|---------|---------|
| 首次失败 | 自动重试 (最多 3 次) | 3 次全败才判失败 |
| 3 次重试全败 | 不再重试 | 判定为 blocker |
| Flaky 测试 | 不阻塞 merge | 生成技术债务工单 |

