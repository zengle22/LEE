## 3. Internal Python Interfaces

本项目为纯 CLI + Spec 项目，无 HTTP API。本章节定义内部 Python 接口契约。

### 3.1 Smoke Gate Manager 接口

**实现文件**: `src/lee/smoke/gate/manager.py`

```python
class SmokeGateManager:
    """
    Smoke Gate 管理器，负责 Gate 生命周期管理
    """

    async def create_gate(self, merge_request_id: str, config: SmokeGateConfig) -> SmokeGateContext:
        """
        创建 Smoke Gate 实例

        前置条件:
        - merge_request_id 有效
        - config 包含必需的 test_set_ref

        后置条件:
        - SmokeGateContext 创建并持久化
        - status = NOT_STARTED
        """

    async def start_execution(self, context: SmokeGateContext) -> SmokeGateContext:
        """
        启动 Smoke 测试执行

        前置条件:
        - context.status == NOT_STARTED

        后置条件:
        - context.status = RUNNING
        - context.started_at 已设置
        """

    async def get_gate_status(self, merge_request_id: str) -> SmokeGateStatus:
        """
        获取指定 MR 的 Gate 状态

        返回：
        - 当前 SmokeGateStatus
        """

    async def get_gate_report(self, smoke_run_id: str) -> Optional[SmokeGateReport]:
        """
        获取指定执行的报告

        返回:
        - SmokeGateReport 如果存在
        - None 如果不存在
        """
```

### 3.2 Smoke Executor 接口

**实现文件**: `src/lee/smoke/executor.py`

```python
class SmokeExecutor:
    """
    Smoke 测试执行器，负责实际执行测试
    """

    async def execute(self, context: SmokeGateContext, test_cases: List[TestCase]) -> SmokeGateReport:
        """
        执行 Smoke 测试

        参数:
        - context: Gate 上下文
        - test_cases: 测试用例列表

        执行流程:
        1. 环境检查
        2. 执行测试（支持并发）
        3. 处理重试
        4. 生成报告

        返回:
        - SmokeGateReport 包含完整执行结果
        """

    async def execute_with_retry(self, test_case: TestCase, max_retries: int = 3) -> TestExecutionRecord:
        """
        执行单个测试用例，支持重试

        重试逻辑:
        - 失败后自动重试，最多 3 次
        - 3 次全部失败才判定为失败
        - Flaky 检测：连续 5 次执行通过率<80%

        返回:
        - TestExecutionRecord 包含执行详情
        """
```

### 3.3 Merge Gate Integrator 接口

**实现文件**: `src/lee/smoke/integration/merge_gate.py`

```python
class MergeGateIntegrator:
    """
    Merge Gate 集成器，负责与 Git 平台集成
    """

    async def check_merge_eligibility(self, merge_request_id: str) -> MergeGateState:
        """
        检查 MR 是否满足 merge 条件

        检查项:
        - Smoke Gate 是否已执行
        - Smoke Gate 是否通过
        - 是否存在 blocker 问题

        返回:
        - MergeGateState 包含可合并性判定
        """

    async def block_merge(self, merge_request_id: str, reason: str) -> None:
        """
        阻塞 merge 请求

        副作用:
        - 在 Git 平台设置 merge 阻塞状态
        - 添加评论说明原因
        """

    async def allow_merge(self, merge_request_id: str) -> None:
        """
        允许 merge 请求

        副作用:
        - 在 Git 平台清除 merge 阻塞状态
        - 更新 Gate 状态可视化
        """

    async def update_gate_status_display(self, merge_request_id: str, status: SmokeGateStatus) -> None:
        """
        更新 Gate 状态可视化显示

        显示位置:
        - MR 页面的状态徽章
        - CI/CD 状态检查列表
        """
```

### 3.4 Git Hook Interface

**实现文件**: `src/lee/smoke/hooks/pre_merge.py`

```python
class PreMergeHook:
    """
    Pre-merge Git Hook，在执行 merge 前拦截检查
    """

    def execute(self, merge_request_id: str) -> bool:
        """
        执行 pre-merge 检查

        流程:
        1. 查询 Smoke Gate 状态
        2. 如果 status != PASSED，返回 False 阻塞 merge
        3. 如果 status == PASSED，返回 True 允许 merge

        返回:
        - True: 允许 merge
        - False: 阻塞 merge
        """

    def get_block_message(self, merge_request_id: str) -> str:
        """
        获取 merge 阻塞原因消息

        返回:
        - 包含 blocker 详情的消息
        """
```

