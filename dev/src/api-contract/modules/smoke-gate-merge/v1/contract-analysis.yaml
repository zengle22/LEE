## 1. Requirement Extraction

### 1.1 API Endpoints Needed

本项目为纯 CLI + Spec 项目，无 HTTP API。提取内部 Python 接口如下：

| 接口 | 方法 | 描述 | 输入 | 输出 |
|------|------|------|------|------|
| SmokeGateManager.create_gate | async | 创建 Gate 实例 | merge_request_id, config | SmokeGateContext |
| SmokeGateManager.start_execution | async | 启动执行 | context | updated context |
| SmokeGateManager.get_gate_status | async | 获取状态 | merge_request_id | SmokeGateStatus |
| SmokeGateManager.get_gate_report | async | 获取报告 | smoke_run_id | SmokeGateReport |
| SmokeExecutor.execute | async | 执行测试 | context, test_cases | SmokeGateReport |
| SmokeExecutor.execute_with_retry | async | 带重试执行 | test_case, max_retries | TestExecutionRecord |
| MergeGateIntegrator.check_merge_eligibility | async | 检查 merge 条件 | merge_request_id | MergeGateState |
| MergeGateIntegrator.block_merge | async | 阻塞 merge | merge_request_id, reason | None |
| MergeGateIntegrator.allow_merge | async | 允许 merge | merge_request_id | None |
| PreMergeHook.execute | sync | pre-merge 检查 | merge_request_id | bool |

### 1.2 DTOs Required

**核心数据模型**:
- `SmokeGateContext`: Gate 执行上下文
- `TestExecutionRecord`: 单个测试执行记录
- `SmokeGateReport`: Gate 执行报告
- `MergeGateState`: Merge Gate 状态机

**枚举类型**:
- `SmokeGateStatus`: Gate 状态枚举
- `GateResult`: 判定结果枚举
- `FailureSeverity`: 失败严重程度枚举
- `SmokeGateEvent`: 事件类型枚举

### 1.3 Dependencies

**内部依赖**:
- Test Set 模块：加载测试用例
- Environment 模块：环境检查
- Orchestrator: 工作流集成

**外部依赖**:
- pytest: 测试框架
- Playwright: E2E 测试
- pytest-xdist: 并发执行
- pytest-html: 报告生成

