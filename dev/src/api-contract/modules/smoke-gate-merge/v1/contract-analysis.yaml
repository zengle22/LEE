## 3. Field Mapping

### 3.1 FEAT Spec → Contract

| FEAT 需求 | Contract 实现 |
|----------|--------------|
| Smoke Gate 作为 blocker 门禁 | `MergeGateIntegrator.block_merge()` |
| 100% merge 请求覆盖 | `PreMergeHook.execute()` |
| 自动拦截 blocker 问题 | `determine_severity()` + `is_merge_allowed()` |
| 门禁状态可视化 | `MergeGateIntegrator.update_gate_status_display()` |

### 3.2 Acceptance Criteria → Validation

| AC | Validation Rule |
|----|----------------|
| AC-001: Smoke Gate 作为 merge 前置条件 | `is_merge_allowed()` 检查 gate_status == PASSED |
| AC-002: 所有 MR 100% 经过检查 | `PreMergeHook.execute()` 在 merge 前强制调用 |
| AC-003: Blocker 问题自动拦截 | `determine_severity()` 判定 P0/P1 为 blocker |
| AC-004: 门禁状态可视化 | `update_gate_status_display()` 更新 MR 页面状态 |

