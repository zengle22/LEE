## 4. Version Strategy

### 4.1 版本规划

- **当前版本**: v1.0.0 (初始版本)
- **未来扩展**:
  - v1.1.0: 支持手动重试
  - v2.0.0: 支持部分 merge（破坏性变更）

### 4.2 兼容性保证

- v1.x.x 保持向后兼容
- 新增字段使用 Optional 类型
- 枚举新增成员不影响现有代码

---

## 5. Implementation Priority

### P0 (必须实现)
1. `SmokeGateStatus`, `GateResult`, `FailureSeverity` 枚举
2. `SmokeGateContext`, `SmokeGateReport` 数据模型
3. `SmokeExecutor.execute()` 核心执行逻辑
4. `PreMergeHook.execute()` merge 拦截逻辑
5. `is_merge_allowed()` 判定逻辑

### P1 (重要)
1. `SmokeGateManager` 生命周期管理
2. `MergeGateIntegrator` Git 平台集成
3. `SmokeStore` 持久化层
4. 重试机制实现

### P2 (可选)
1. 事件系统 (`SmokeGateEvent`)
2. HTML 报告生成
3. 状态可视化显示

---

## 6. Risks and Mitigations

| 风险 | 影响 | 缓解措施 |
|------|------|---------|
| 执行时间超过 30 分钟 | 阻塞开发流程 | 并发执行 + 超时控制 |
| 误报导致 merge 阻塞 | 开发效率下降 | 重试机制 + Flaky 检测 |
| Git 平台 API 限制 | 集成失败 | 本地 Git Hook 作为备选 |
| 并发 merge 请求资源竞争 | 执行队列阻塞 | 执行队列管理 + 资源隔离 |
