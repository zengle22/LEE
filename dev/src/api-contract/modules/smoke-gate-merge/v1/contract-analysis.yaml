## 2. Contract Design Decisions

### 2.1 状态机设计

采用严格的状态转换规则：
```
NOT_STARTED → RUNNING → {PASSED | FAILED | INVALID}
```

**设计理由**:
- 防止跳过执行直接通过
- 防止已通过后重新执行
- 确保状态可追踪

### 2.2 重试机制

- 单次失败自动重试，最多 3 次
- 3 次全败才判定为 blocker
- Flaky 测试不阻塞 merge

**设计理由**:
- 减少偶发失败对开发流程的干扰
- 区分真实问题和偶发问题
- 提升 Gate 可信度

### 2.3 严重程度分级

| 优先级 | 严重程度 | 是否阻塞 |
|--------|---------|---------|
| P0 | Blocker | 是 |
| P1 | Blocker | 是 |
| P2 | Critical | 否（QA 回归用） |
| Flaky | Flaky | 否（生成技术债务） |

