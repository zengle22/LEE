## Root Cause Analysis (已确认)

### 根本原因：Output 声明格式与验证逻辑不匹配

**问题位置**: `src/lee/orchestrator/execution/runners/code_executor_scope.py`

**问题代码**: `collect_declared_output_paths()` 函数 (第 11-23 行)

```python
def collect_declared_output_paths(step) -> List[str]:
    declared_output_files: List[str] = []
    for output in (getattr(step, "outputs", None) or []):
        if isinstance(output, dict):
            output_type = output.get("type")
            output_path = output.get("path", "")
        else:
            output_type = getattr(output, "type", None)
            output_path = getattr(output, "path", "")
        normalized_path = str(output_path or "").strip()
        if output_type in {"file", "dir"} and normalized_path:  # ← 只识别 type 为 file/dir 的输出
            declared_output_files.append(normalized_path)
    return declared_output_files
```

**问题分析**:
1. 工作流模板 (`feature-be-l3-template.yaml`) 声明输出为符号名称：
   ```yaml
   outputs:
   - unit_test_ref      # ← 这是符号名称，不是文件路径
   - test_scope_ref
   ```

2. 验证逻辑 `collect_declared_output_paths()` 只识别带有 `type: file` 或 `type: dir` 以及 `path` 属性的输出：
   - 符号名称输出（如 `unit_test_ref`）没有 `type` 和 `path` 属性
   - 因此被验证逻辑忽略，不加入白名单

3. 当 agent 实际写入文件到项目目录（如 `src/lee/agents/tests/...`）时：
   - 这些路径不在白名单中（因为符号名称被忽略了）
   - 触发 "Unauthorized write" 错误

### 修复方案

**方案 A: 修改验证逻辑** (推荐)
修改 `collect_declared_output_paths()` 以支持符号名称输出，将其映射到实际的文件路径。

**方案 B: 修改工作流模板**
将输出声明改为显式文件路径格式：
```yaml
outputs:
- type: file
  path: src/lee/agents/tests/test_*.py
- type: file
  path: test_scope_ref.yaml
```

**方案 C: 两步验证**
对于符号名称输出，在步骤完成时解析实际写入的文件，然后验证。

