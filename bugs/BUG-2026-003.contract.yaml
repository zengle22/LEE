## Bug Description

### Summary
在执行 `dev.feature_be_l3` 工作流进行 FEAT-SRC-056-002 的后端实施时，工作流在 `write_ut` 步骤失败，报错：
```
"Unauthorized write(s) outside step workspace / declared outputs: ...test_scope_ref, ...unit_test_ref"
```

尽管工作流失败，但生成了有效的测试代码：
- `.workflow/workspace/wf_task_27aaa4c1/write_ut/test_artifact_placement_reviewer.py`

由于工作流失败，不得不手动完成以下操作：
1. 手动复制测试文件到项目位置
2. 手动创建完整的实现代码
3. 手动运行静态检查和单元测试
4. 手动提交代码

### Expected Behavior
工作流应成功完成 TDD 循环：
1. 生成测试代码到正确位置
2. 生成实现代码
3. 运行静态检查 (ruff)
4. 运行单元测试 (pytest)
5. 提交代码

### Actual Behavior
工作流在输出路径验证阶段失败，声称"unauthorized writes"，但实际生成的文件路径是正确的。

