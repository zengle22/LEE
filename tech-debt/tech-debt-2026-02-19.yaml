# P0 - 严重问题 (必须立即修复)
# ============================================
critical_issues:
  - id: "P0-001"
    category: "security"
    severity: "critical"
    title: "Gate API 使用内存存储，进程重启后数据丢失"
    file: "src/lee/orchestrator/execution/gate_api.py"
    line: 70
    description: |
      GateAPI 类使用临时字典 `_gates` 存储门禁状态，注释说明应该存储在数据库但未实现。
      这会导致进程重启后所有待审批的门禁丢失，造成工作流无法恢复。
    impact: |
      - 数据丢失风险高
      - 工作流中断后无法恢复
      - 违反数据持久化原则
    recommendation: |
      实现基于数据库的持久化存储，使用 SQLite 或其他存储引擎保存门禁状态。
    reference: "第 69-70 行注释明确指出问题"
    tags: ["data-loss", "persistence", "gate-system"]

  - id: "P0-002"
    category: "code_quality"
    severity: "critical"
    title: "CLI 主文件存在命令重复注册"
    file: "src/lee/cli/main.py"
    line: 144-174
    description: |
      cli.add_command() 调用存在大量重复，部分命令被注册了两次（如 qa、test_runner、check_env 等）。
      这会导致 CLI 行为不一致和潜在的错误。
    impact: |
      - CLI 命令行为不可预测
      - 可能导致命令冲突
      - 代码维护困难
    recommendation: |
      移除重复的命令注册，确保每个命令只注册一次。
    reference: "第 144-168 行和 169-173 行存在重复"
    tags: ["cli", "duplication", "maintenance"]

  - id: "P0-003"
    category: "architecture"
    severity: "critical"
    title: "MetaGPT Executor Bug 修复功能未实现"
    file: "src/lee/orchestrator/execution/metagpt_executor.py"
    line: 184
    description: |
      bug_autofix 任务类型的实现只是占位符，返回虚假的完成状态。
      这会误导用户认为 Bug 已修复，实际上没有执行任何修复操作。
    impact: |
      - 功能虚假实现
      - 用户体验严重受损
      - 可能导致生产环境问题
    recommendation: |
      要么实现真正的 Bug 修复逻辑，要么明确标记为不支持并返回错误。
    reference: "TODO 注释第 184 行"
    tags: ["incomplete-implementation", "metagpt", "bug-fix"]

  - id: "P0-004"
    category: "security"
    severity: "critical"
    title: "缺少输入验证和消毒"
    file: "src/lee/orchestrator/core/workflow_parser.py"
    line: 105-106
    description: |
      workflow_parser 直接从文件加载 YAML 而没有验证或消毒，可能受到 YAML 注入攻击。
    impact: |
      - 任意代码执行风险
      - 数据注入攻击
      - 系统安全漏洞
    recommendation: |
      使用安全的方式加载 YAML，添加输入验证和大小限制。
    tags: ["security", "yaml-injection", "input-validation"]

  - id: "P0-005"
    category: "testing"
    severity: "critical"
    title: "缺少核心功能的单元测试"
    description: |
      多个核心模块缺少充分的单元测试覆盖，特别是：
      - Gate API 和状态机
      - 事件日志系统
      - 追踪系统
    impact: |
      - 代码质量无保证
      - 重构风险高
      - 潜在回归问题
    recommendation: |
      为核心模块添加完整的单元测试，目标覆盖率 80% 以上。
    tags: ["testing", "coverage", "quality"]

  - id: "P0-006"
    category: "code_quality"
    severity: "critical"
    title: "异常处理不完整"
    file: "src/lee/orchestrator/execution/gate_api.py"
    line: 112-116
    description: |
      多处使用空的 except 块或捕获所有异常而不处理，隐藏了潜在的错误。
    impact: |
      - 错误被静默忽略
      - 调试困难
      - 可能导致数据不一致
    recommendation: |
      改进异常处理，记录所有异常并适当处理，避免空的 except 块。
    tags: ["exception-handling", "debugging", "error-suppression"]

  - id: "P0-007"
    category: "security"
    severity: "critical"
    title: "CLI 锁文件可能遗留"
    file: "src/lee/cli/main.py"
    line: 84-124
    description: |
      CLI 锁机制在异常情况下可能不会正确释放锁文件，导致后续启动失败。
    impact: |
      - 系统无法启动
      - 需要手动清理锁文件
      - 影响用户体验
    recommendation: |
      实现更健壮的锁机制，包括超时、清理和恢复逻辑。
    tags: ["concurrency", "file-locking", "reliability"]

  - id: "P0-008"
    category: "architecture"
    severity: "critical"
    title: "循环依赖检测可能导致误报"
    file: "src/lee/orchestrator/core/workflow_parser.py"
    line: 439-440
    description: |
      循环依赖检测逻辑过于简单，可能在复杂工作流中产生误报。
    impact: |
      - 合法工作流被拒绝
      - 用户体验差
      - 功能受限
    recommendation: |
      实现更精确的循环检测算法，如基于 DFS 的检测。
    tags: ["dependency-analysis", "algorithm", "workflow"]

