name: Tag Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build And Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag ancestry
        run: |
          python scripts/ci/verify_tag_on_main.py --tag-ref "${GITHUB_REF}" --base-ref origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install build twine pyyaml jsonschema

      - name: Run release checks
        shell: pwsh
        run: |
          ./scripts/validate-yaml.ps1 -Dir spec-global
          python scripts/detect-hardcoded-paths.py src
          python scripts/lint_l3_templates.py spec-global/departments
          pytest tests/unit tests/integration tests/orchestrator tests/runtime tests/qa tests/pm_agent -q

      - name: Compute release version
        id: version
        run: |
          python scripts/ci/compute_version.py --mode release --ref-name "${GITHUB_REF_NAME}" --write-pyproject

      - name: Build package
        run: |
          python -m build

      - name: Write build metadata
        run: |
          python scripts/ci/write_build_metadata.py --version "${{ steps.version.outputs.lee_version }}" --release-kind release --output dist/build-metadata.json

      - name: Publish package to PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' && secrets.PACKAGE_REPOSITORY_URL == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish package to custom index
        if: ${{ secrets.PYPI_API_TOKEN != '' && secrets.PACKAGE_REPOSITORY_URL != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository-url: ${{ secrets.PACKAGE_REPOSITORY_URL }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
