name: PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate And Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install build pyyaml jsonschema

      - name: Validate YAML
        shell: pwsh
        run: |
          ./scripts/validate-yaml.ps1 -Dir spec-global

      - name: Check SSOT Governance On Changed Files
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref }}...HEAD")
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed files for SSOT governance check."
            exit 0
          fi
          python scripts/check-ssot-governance.py "${changed_files[@]}"

      - name: Detect hardcoded paths
        run: |
          python scripts/detect-hardcoded-paths.py src

      - name: Lint L3 templates
        run: |
          python scripts/lint_l3_templates.py spec-global/departments

      - name: Run unit tests
        run: |
          python -m pytest tests/unit -q \
            --ignore tests/unit/test_artifacts/test_cleanup.py \
            --ignore tests/unit/test_artifacts/test_install_git_hooks.py

      - name: Run integration tests
        run: |
          python -m pytest tests/integration tests/orchestrator tests/runtime tests/pm_agent -q

      - name: Build smoke test
        run: |
          python -m build

      - name: Upload smoke dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-dist-${{ github.event.pull_request.number }}
          path: dist/*
