name: Main Release

on:
  push:
    branches: [main]

concurrency:
  group: main-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build And Publish Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      lee_version: ${{ steps.version.outputs.lee_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install build twine pyyaml jsonschema

      - name: Validate release inputs
        shell: pwsh
        run: |
          ./scripts/validate-yaml.ps1 -Dir spec-global

      - name: Run release checks
        run: |
          python scripts/detect-hardcoded-paths.py src
          python scripts/lint_l3_templates.py spec-global/departments
          pytest tests/unit tests/integration tests/orchestrator tests/runtime tests/qa tests/pm_agent -q

      - name: Compute release package version
        id: version
        run: |
          python scripts/ci/compute_version.py --mode candidate --sha "${GITHUB_SHA}" --write-pyproject

      - name: Build package
        run: |
          python -m build

      - name: Write build metadata
        run: |
          python scripts/ci/write_build_metadata.py --version "${{ steps.version.outputs.lee_version }}" --release-kind main-release --output dist/build-metadata.json

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lee-dist-${{ steps.version.outputs.lee_version }}
          path: dist/*
