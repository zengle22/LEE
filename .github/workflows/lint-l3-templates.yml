name: Lint L3 Templates

on:
  push:
    branches: [ main, master ]
    paths:
      - 'spec-global/departments/**/workflows/**/*.yaml'
      - 'spec-global/departments/**/workflows/**/*.yml'
      - 'scripts/lint_l3_templates.py'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'spec-global/departments/**/workflows/**/*.yaml'
      - 'spec-global/departments/**/workflows/**/*.yml'

jobs:
  lint-l3-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Lint L3 Templates
        run: |
          python scripts/lint_l3_templates.py spec-global/departments

      - name: Upload validation report (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-errors
          path: lint-errors.txt
