# LLM Executor 统一配置
#
# 配置说明：
# 1. 本文件定义所有 LLM Provider 的配置模板
# 2. 使用环境变量覆盖敏感信息（API Key 等）
# 3. Profile 通过 profile 名称引用，支持按需扩展

schema_version: 1.0.0

# ============================================
# 默认配置
# ============================================
# 当未指定 profile 时使用此配置
# 优先级：最低（作为最后兜底）
default:
  type: llm
  provider: openai
  # 环境变量覆盖优先级: LLM_BASE_URL > default_url
  base_url: ${LLM_BASE_URL:-https://api.openai.com/v1}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL:-gpt-4o}
  temperature: ${LLM_TEMPERATURE:-0.7}
  max_tokens: ${LLM_MAX_TOKENS:-4000}
  timeout: ${LLM_TIMEOUT:-60}
  description: "默认配置，兜底使用"

# ============================================
# 预定义 Provider 配置
# ============================================


# 本地 Ollama (通用 LLM，最低优先级）
# 优先级：最低（最先尝试）
ollama:
  type: llm
  provider: ollama
  base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}
  api_key: ${OLLAMA_API_KEY:-dummy-key}
  model: ${OLLAMA_MODEL:-qwen2.5}
  temperature: 0.7
  max_tokens: 8000
  timeout: 120
  description: "本地 Ollama 服务，使用 Qwen2.5 模型（最低优先级，兜底）"



# DeepSeek 官方
# 优先级：高
# 注意：DeepSeek API max_tokens 限制为 8192
deepseek:
  type: llm
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key: sk-32763972ec7841aab1b45af0ca2c97d3
  model: deepseek-chat
  temperature: 0.6
  max_tokens: 8192
  timeout: 300
  description: "DeepSeek 官方 Coder 模型（高优先级）"


fallback_providers:
  - deepseek         # ⚠️ 兜底（官方 API 价格较高，使用时告警）
  - ollama           # 本地兜底（需启动服务）
# 默认 profile
default_profile: ollama
