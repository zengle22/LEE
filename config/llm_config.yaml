# LLM Executor 配置
# 使用本地 antigravity tool 反代服务

# 默认配置
default:
  type: llm
  provider: custom
  # 默认仍保留为可配置的 OpenAI-compatible endpoint
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}
  temperature: 0.7
  max_tokens: 4000

# 预定义配置
antigravity:
  type: llm
  provider: custom
  base_url: ${ANTIGRAVITY_BASE_URL}
  api_key: ${ANTIGRAVITY_API_KEY}
  model: ${ANTIGRAVITY_MODEL}
  temperature: 0.7
  max_tokens: 8000

zhipu:
  type: llm
  provider: custom
  # 智谱 GLM（coding endpoint）
  base_url: ${ZHIPU_BASE_URL}
  api_key: ${ZHIPU_API_KEY}
  model: ${ZHIPU_MODEL}
  temperature: 0.7
  max_tokens: 8000

# DeepSeek 配置
deepseek:
  type: llm
  provider: custom
  base_url: ${DEEPSEEK_BASE_URL}
  api_key: ${DEEPSEEK_API_KEY}
  model: ${DEEPSEEK_MODEL}
  temperature: 0.3
  max_tokens: 8000

# Agent 示例配置
agent.prd:
  type: llm
  provider: custom
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}
  temperature: 0.7
  max_tokens: 4000

agent.dev:
  type: llm
  provider: custom
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}
  temperature: 0.5
  max_tokens: 8000
