# LEE Workspace Configuration Template
# 版本: 1.0.0
#
# 本文件是 LEE 框架提供的 workspace.yaml 配置模板
# 在使用 LEE 框架的产品项目中，复制此文件到 project/workspace.yaml 并根据实际情况修改
#
# 配置说明：
# 1. spec: 定义规范目录的位置
#    - global_root: LEE 框架自带的全局规范模板（通常指向 ../LEE/spec-global）
#    - project_root: 当前产品专属的规范目录（通常指向 ./spec）
#
# 2. repos: 定义产品代码仓库的映射
#    - 每个仓库有唯一的别名（key）
#    - path: 仓库在文件系统中的相对路径
#    - type: 仓库类型（git/hg/svn等）
#    - url: 可选，远程仓库地址
#
# 3. runtime: 定义运行时目录
#    - root: 运行时根目录（通常指向 ../runtime）
#    - runs_dir: 运行记录目录
#    - logs_dir: 日志目录

# ============================================================
# 规范目录配置
# ============================================================
spec:
  # 全局规范根目录（LEE 框架自带）
  # 相对于 project/ 目录的路径
  global_root: "../LEE/spec-global"

  # 产品专属规范根目录
  project_root: "./spec"

  # 规范继承策略
  inheritance:
    # 如果项目规范和全局规范冲突，优先级设置
    # project: 项目规范优先（默认）
    # global: 全局规范优先
    # merge: 尝试合并（如果可能）
    priority: "project"

# ============================================================
# 代码仓库配置
# ============================================================
repos:
  # 示例：后端仓库
  # backend:
  #   path: "./repos/dev/backend"
  #   type: "git"
  #   url: "https://github.com/your-org/product-backend.git"
  #   description: "后端服务代码"

  # 示例：前端仓库
  # frontend:
  #   path: "./repos/dev/frontend"
  #   type: "git"
  #   url: "https://github.com/your-org/product-frontend.git"
  #   description: "前端应用代码"

  # 示例：测试仓库
  # tests:
  #   path: "./repos/qa/tests"
  #   type: "git"
  #   url: "https://github.com/your-org/product-tests.git"
  #   description: "测试代码和测试用例"

# ============================================================
# 运行时配置
# ============================================================
runtime:
  # 运行时根目录（相对于 project/ 目录）
  root: "../runtime"

  # 运行记录目录
  runs_dir: "runs"

  # 日志目录
  logs_dir: "logs"

  # 临时文件目录
  tmp_dir: "tmp"

  # 运行记录保留策略
  retention:
    # 最大保留运行记录数量
    max_runs: 100

    # 最大保留天数
    max_days: 30

    # 是否压缩旧记录
    compress_old: true

# ============================================================
# 编排器配置
# ============================================================
orchestrator:
  # 状态文件（YAML 格式）
  state_file: "state.yaml"

  # 事件日志（JSONL 格式）
  event_log: "events.jsonl"

  # Token 存储目录
  token_dir: "tokens"

  # 审批产物目录
  approvals_dir: "approvals"

  # 自动重试配置
  retry:
    # 最大重试次数
    max_attempts: 3

    # 重试间隔（秒）
    interval: 10

    # 指数退避
    backoff: true

# ============================================================
# 执行引擎配置
# ============================================================
engines:
  # Python 执行引擎
  python:
    enabled: true

    # Python 解释器路径
    interpreter: "python3"

    # 工作目录
    work_dir: "./workspace"

  # 单 Agent 引擎
  single_agent:
    enabled: true

    # 默认模型
    default_model: "claude-sonnet-4-5"

    # 默认温度
    default_temperature: 0.7

# ============================================================
# 日志配置
# ============================================================
logging:
  # 日志级别：DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

  # 日志格式
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # 日志文件配置
  file:
    # 是否启用文件日志
    enabled: true

    # 日志文件路径
    path: "../runtime/logs/orchestrator.log"

    # 单个日志文件最大大小（MB）
    max_size_mb: 100

    # 保留日志文件数量
    backup_count: 10

  # 控制台日志
  console:
    enabled: true
    level: "INFO"

# ============================================================
# 安全配置
# ============================================================
security:
  # Token 安全配置
  tokens:
    # Token 有效期（秒）
    expiry: 3600

    # Token 签名密钥（生产环境应使用环境变量）
    secret_key: "${LEE_TOKEN_SECRET:-change-this-in-production}"

  # 人工审批安全
  approvals:
    # 是否要求审批人签名
    require_signature: false

    # 最少审批人数
    min_approvers: 1
