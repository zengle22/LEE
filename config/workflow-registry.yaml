version: "1.1"

workflows:
  # ========== Core Governance 工作流 ==========
  core.spec-governance:
    path: spec-global/core/workflows/templates/spec-governance-l3-template.yaml
    kind: l3_workflow_template
    description: "Spec 治理工作流 (L3) - 生成/修改 spec 并强制经过 spec-review"
    load_spec_as_params: true
    required_params:
      - request_id
      - spec_kind
      - action
      - change_request
    optional_params:
      - target_path
      - scope
      - acceptance_brief_id
      - ssot_root_id
      - reviewer_mode
      - strict_review_gate
      - human_gate_reviewers
      - human_gate_required

  core.reverse-epic-feat:
    path: spec-global/core/workflows/templates/reverse-epic-feat-l3-template.yaml
    kind: l3_workflow_template
    description: "反向生成现行 SSOT 链文档工作流 (L3) - 从现有 repo 与证据中提取 SRC/EPIC/FEAT，并输出 delivery/QA seeds 与 evidence views"
    load_spec_as_params: true
    required_params:
      - request_id
      - repo_root
      - objective
    optional_params:
      - include_paths
      - exclude_paths
      - existing_prd_paths
      - runtime_evidence_paths
      - strict_evidence
      - max_capabilities
      - max_features_per_capability
      - publish_mode
      - human_gate_required

  # ========== Dev 工作流 ==========
  dev.feature:
    path: spec-global/departments/dev/workflows/templates/feature-l2-template.yaml
    kind: l2_workflow_template
    description: "特性开发工作流 (L2)"
    required_params:
      - project
      - module
      - feature_point_id
    optional_params:
      - feature_spec
      - repo_frontend
      - repo_backend

  dev.bugfix:
    path: spec-global/departments/dev/workflows/templates/bug-fix-l3-template.yaml
    kind: l3_workflow_template
    description: "Bug 修复工作流 (L3) - 单个 Bug 的完整修复流程"
    required_params:
      - bug_id
      - bug_description
      - project
      - repo
    optional_params:
      - reproduction_steps
      - severity
      - assignee

  devops.deploy:
    path: spec-global/departments/devops/workflows/deploy/v1/workflow.yaml
    description: "部署工作流"
    required_params:
      - env
      - version

  # ========== QA 工作流 ==========
  qa.test-set-production:
    path: spec-global/departments/qa/workflows/templates/test-set-production-l3-template.yaml
    kind: l3_workflow_template
    description: "生产 Test Set 设计资产 (L3) - 优先从 FEAT freeze 与 delivery prep seed 生成 Test Set"
    load_spec_as_params: true
    required_params:
      - module
      - feat_freeze
    optional_params:
      - requirement_doc
      - tech_design
      - delivery_prep_bundle
      - ui_specs

  qa.test-plan-execution:
    path: spec-global/departments/qa/workflows/templates/test-plan-l2-template.yaml
    kind: l2_workflow_template
    description: "执行 Test Plan (L2) - 执行测试批次并汇总结果"
    required_params:
      - test_plan_id
      - build_version
      - build_commit
    optional_params:
      - environment
      - target_test_sets

  qa.test-set-execution:
    path: spec-global/departments/qa/workflows/templates/test-set-execute-l3-template.yaml
    kind: l3_workflow_template
    description: "执行 Test Set (L3) - 单个 Test Set 执行"
    required_params:
      - test_run_id
      - test_set_id
    optional_params:
      - build_version
      - environment

  # ========== Product 工作流 ==========
  product.main:
    path: spec-global/departments/product/workflows/templates/product-main-pipeline/v1/workflow.yaml
    kind: l2_workflow_template
    description: "Product 主编排模板 (L2) - raw input -> SRC -> EPIC -> FEAT -> delivery prep"
    load_spec_as_params: true
    required_params: []
    optional_params:
      - raw_requirement
      - business_opportunity_freeze

  product.raw-to-src:
    path: spec-global/departments/product/workflows/templates/raw-to-src/v1/workflow.yaml
    kind: l3_workflow_template
    description: "Product L3 - raw input to SRC"
    load_spec_as_params: true
    required_params: []
    optional_params:
      - raw_requirement
      - business_opportunity
      - business_opportunity_freeze

  product.src-to-epic:
    path: spec-global/departments/product/workflows/templates/src-to-epic/v1/workflow.yaml
    kind: l3_workflow_template
    description: "Product L3 - frozen SRC to EPIC"
    load_spec_as_params: true
    required_params: []
    optional_params:
      - src
      - source_freeze
      - source_freeze_ref

  product.epic-to-feat:
    path: spec-global/departments/product/workflows/templates/epic-to-feat/v1/workflow.yaml
    kind: l3_workflow_template
    description: "Product L3 - EPIC to FEAT"
    load_spec_as_params: true
    required_params:
      - epic_freeze
    optional_params: []

  product.feat-to-delivery-prep:
    path: spec-global/departments/product/workflows/templates/feat-to-delivery-prep/v1/workflow.yaml
    kind: l3_workflow_template
    description: "Product L3 - FEAT to delivery prep"
    load_spec_as_params: true
    required_params:
      - feat_freeze
    optional_params: []

  product.requirement-chain-validation:
    path: spec-global/departments/product/workflows/templates/requirement-chain-validation/v1/workflow.yaml
    kind: l3_workflow_template
    description: "Product L3 - requirement chain validation before final handoff"
    load_spec_as_params: true
    required_params: []
    optional_params:
      - source_freeze
      - epic_freeze_bundle
      - feat_freeze_bundle
      - delivery_prep_bundle

  # ========== Office 工作流 ==========
  office.workspace-cleanup:
    path: spec-global/departments/office/workflows/workspace-cleanup/v1/workflow.yaml
    description: "工作区整理工作流"
    required_params: []
    optional_params:
      - workspace_path
      - author_name
      - exclude_patterns
      - remote
      - branch
      - skip_push
