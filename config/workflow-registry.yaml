version: "1.1"

workflows:
  # ========== Dev 工作流 ==========
  dev.feature:
    path: spec-global/departments/dev/workflows/templates/feature-l2-template.yaml
    kind: l2_workflow_template
    description: "特性开发工作流 (L2)"
    required_params:
      - project
      - module
      - feature_point_id
    optional_params:
      - feature_spec
      - repo_frontend
      - repo_backend

  dev.bugfix:
    path: spec-global/departments/dev/workflows/templates/bug-fix-l2-template.yaml
    kind: l2_workflow_template
    description: "Bug 修复工作流 (L2)"
    required_params:
      - bug_id
      - project
    optional_params:
      - repo

  qa.regression:
    path: spec-global/departments/qa/workflows/regression/v1/workflow.yaml
    description: "回归测试工作流"
    required_params:
      - spec

  devops.deploy:
    path: spec-global/departments/devops/workflows/deploy/v1/workflow.yaml
    description: "部署工作流"
    required_params:
      - env
      - version

  # ========== QA 工作流 ==========
  qa.test-set-production:
    path: spec-global/departments/qa/workflows/templates/test-set-production-l3-template.yaml
    kind: l3_workflow_template
    description: "生产 Test Set 设计资产 (L3) - 从需求文档生成 Test Set"
    required_params:
      - module
      - requirement_doc
    optional_params:
      - tech_design

  qa.test-plan-execution:
    path: spec-global/departments/qa/workflows/templates/test-plan-l2-template.yaml
    kind: l2_workflow_template
    description: "执行 Test Plan (L2) - 执行测试批次并汇总结果"
    required_params:
      - test_plan_id
      - build_version
      - build_commit
    optional_params:
      - environment
      - target_test_sets

  qa.test-set-execution:
    path: spec-global/departments/qa/workflows/templates/test-set-l3-template.yaml
    kind: l3_workflow_template
    description: "执行 Test Set (L3) - 单个 Test Set 执行"
    required_params:
      - test_run_id
      - test_set_id
    optional_params:
      - build_version
      - environment

  # ========== Office 工作流 ==========
  office.workspace-cleanup:
    path: spec-global/departments/office/workflows/workspace-cleanup/v1/workflow.yaml
    description: "工作区整理工作流"
    required_params: []
    optional_params:
      - workspace_path
      - author_name
      - exclude_patterns
      - remote
      - branch
      - skip_push
