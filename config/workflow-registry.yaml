version: "1.1"

workflows:
  # ========== Core Governance 工作流 ==========
  core.spec-governance:
    path: spec-global/core/workflows/templates/spec-governance-l3-template.yaml
    kind: l3_workflow_template
    description: "Spec 治理工作流 (L3) - 生成/修改 spec 并强制经过 spec-review"
    load_spec_as_params: true
    required_params:
      - request_id
      - spec_kind
      - action
      - change_request
    optional_params:
      - target_path
      - scope
      - acceptance_brief_id
      - ssot_root_id
      - reviewer_mode
      - strict_review_gate
      - human_gate_reviewers
      - human_gate_required

  core.reverse-epic-feat:
    path: spec-global/core/workflows/templates/reverse-epic-feat-l3-template.yaml
    kind: l3_workflow_template
    description: "反向生成现行 SSOT 链文档工作流 (L3) - 从现有 repo 与证据中提取 SRC/EPIC/FEAT，并输出 delivery/QA seeds 与 evidence views"
    load_spec_as_params: true
    required_params:
      - request_id
      - repo_root
    optional_params:
      - include_paths
      - exclude_paths
      - existing_prd_paths
      - runtime_evidence_paths
      - strict_evidence
      - max_capabilities
      - max_features_per_capability
      - publish_mode
      - human_gate_required

  # ========== Dev 工作流 ==========
  dev.feature:
    path: spec-global/departments/dev/workflows/templates/feature-delivery-l2-template.yaml
    canonical_workflow: dev.feature-delivery
    kind: l2_workflow_template
    description: "特性开发工作流兼容入口 (L2) -> canonical dev.feature-delivery"
    required_params:
      - project
      - module
      - feature_point_id
    optional_params:
      - feature_spec
      - repo_frontend
      - repo_backend
      - branch

  dev.feature-delivery:
    path: spec-global/departments/dev/workflows/templates/feature-delivery-l2-template.yaml
    kind: l2_workflow_template
    description: "Dev canonical Feature Delivery 工作流 (L2) - FEAT -> TECH -> CONTRACT -> FE/BE -> INTEGRATION -> EVIDENCE -> SMOKE"
    required_params:
      - formal_ssot_id
      - source_refs
      - governing_adrs
      - repo_context
      - repo_frontend
      - repo_backend
    optional_params:
      - task_refs
      - acceptance_brief_ref
      - decision_refs
      - decision_constraints
      - architecture_constraints
      - process_constraints
      - env_ref

  dev.tech-design-l3:
    path: spec-global/departments/dev/workflows/templates/tech-design-l3-template.yaml
    kind: l3_workflow_template
    description: "Dev canonical Tech Design 工作流 (L3) - FEAT -> TECH"
    load_spec_as_params: true
    required_params:
      - formal_ssot_id
      - source_refs
      - governing_adrs
      - repo_context
    optional_params:
      - acceptance_brief_ref
      - decision_refs
      - decision_constraints
      - architecture_constraints
      - process_constraints
      - env_ref
      - human_gate_required

  dev.tech_design_l3:
    path: spec-global/departments/dev/workflows/templates/tech-design-l3-template.yaml
    canonical_workflow: dev.tech-design-l3
    kind: l3_workflow_template
    description: "Tech Design L3 兼容入口 -> canonical dev.tech-design-l3"
    load_spec_as_params: true
    required_params:
      - formal_ssot_id
      - source_refs
      - governing_adrs
      - repo_context
    optional_params:
      - acceptance_brief_ref
      - decision_refs
      - decision_constraints
      - architecture_constraints
      - process_constraints
      - env_ref
      - human_gate_required

  dev.feature-contract-l3:
    path: spec-global/departments/dev/workflows/templates/feature-contract-l3-template.yaml
    kind: l3_workflow_template
    description: "Dev canonical Feature Contract Design 工作流 (L3) - TECH -> CONTRACT (API/Data/Event) -> FREEZE"
    load_spec_as_params: true
    required_params:
      - formal_ssot_id
      - source_refs
      - governing_adrs
      - tech_spec_ref
    optional_params:
      - existing_contract_refs
      - review_context
      - decision_constraints

  dev.feature_contract_l3:
    path: spec-global/departments/dev/workflows/templates/feature-contract-l3-template.yaml
    canonical_workflow: dev.feature-contract-l3
    kind: l3_workflow_template
    description: "Feature Contract L3 兼容入口 -> canonical dev.feature-contract-l3"
    load_spec_as_params: true
    required_params:
      - formal_ssot_id
      - source_refs
      - governing_adrs
      - tech_spec_ref
    optional_params:
      - existing_contract_refs
      - review_context
      - decision_constraints

  # ========== Dev Backend Implementation 工作流 ==========
  dev.feature-be-l3:
    path: spec-global/departments/dev/workflows/templates/feature-be-l3-template.yaml
    kind: l3_workflow_template
    description: "Dev canonical Feature Backend Development 工作流 (L3) - TECH + CONTRACT -> UT -> IMPLEMENT -> REFACTOR -> COVERAGE"
    load_spec_as_params: true
    required_params:
      - formal_ssot_id
      - source_refs
      - governing_adrs
      - tech_spec_ref
      - contract_freeze_ref
      - repo_backend
    optional_params:
      - acceptance_brief_ref
      - repo_context
      - decision_constraints
      - architecture_constraints

  dev.feature_be_l3:
    path: spec-global/departments/dev/workflows/templates/feature-be-l3-template.yaml
    canonical_workflow: dev.feature-be-l3
    kind: l3_workflow_template
    description: "Feature Backend Development L3 兼容入口 -> canonical dev.feature-be-l3"
    load_spec_as_params: true
    required_params:
      - formal_ssot_id
      - source_refs
      - governing_adrs
      - tech_spec_ref
      - contract_freeze_ref
      - repo_backend
    optional_params:
      - acceptance_brief_ref
      - repo_context
      - decision_constraints
      - architecture_constraints

  dev.bugfix:
    path: spec-global/departments/dev/workflows/templates/bugfix-delivery-l2-template.yaml
    canonical_workflow: dev.bugfix-delivery
    kind: l2_workflow_template
    description: "Bug 修复工作流兼容入口 -> canonical dev.bugfix-delivery"
    required_params:
      - bug_id
      - bug_description
      - project
      - repo
    optional_params:
      - reproduction_steps
      - severity
      - assignee

  dev.bugfix-delivery:
    path: spec-global/departments/dev/workflows/templates/bugfix-delivery-l2-template.yaml
    kind: l2_workflow_template
    description: "Dev canonical Bugfix Delivery 工作流 (L2) - TRIAGE -> RCA -> FIX -> VERIFY -> EVIDENCE -> MERGE"
    required_params:
      - bug_ssot_id
      - severity
      - reproduction_evidence
    optional_params:
      - source_refs
      - repo_context
      - test_case_refs
      - batch_mode
      - batch_context
      - batch_approval_record
      - repo

  devops.deploy:
    path: spec-global/departments/devops/workflows/deploy/v1/workflow.yaml
    description: "部署工作流"
    required_params:
      - env
      - version

  # ========== QA 工作流 ==========
  qa.test-set-production:
    path: spec-global/departments/qa/workflows/templates/test-set-production-l3-template.yaml
    kind: l3_workflow_template
    description: "生产 Test Set 设计资产 (L3) - 优先从 FEAT freeze 与 delivery prep seed 生成 Test Set"
    load_spec_as_params: true
    required_params:
      - module
      - feat_freeze
    optional_params:
      - requirement_doc
      - tech_design
      - delivery_prep_bundle
      - ui_specs

  qa.test-plan-execution:
    path: spec-global/departments/qa/workflows/templates/test-plan-l2-template.yaml
    kind: l2_workflow_template
    description: "执行 Test Plan (L2) - canonical RELEASE -> TESTPLAN -> TASK 入口"
    required_params:
      - test_plan_id
      - build_version
      - build_commit
    optional_params:
      - environment
      - target_test_sets
      - release_ref
      - task_ref
      - base_url

  qa.test-set-execution:
    path: spec-global/departments/qa/workflows/templates/test-set-execute-l3-template.yaml
    kind: l3_workflow_template
    description: "执行 Test Set (L3) - 单个 Test Set 执行"
    required_params:
      - test_run_id
      - test_set_id
    optional_params:
      - build_version
      - environment

  # ========== Product 工作流 ==========
  product.main:
    path: spec-global/departments/product/workflows/templates/product-main-pipeline/v1/workflow.yaml
    kind: l2_workflow_template
    description: "Product 主编排模板 (L2) - raw input -> SRC -> EPIC -> FEAT -> delivery prep"
    load_spec_as_params: true
    required_params: []
    optional_params:
      - adr
      - raw_requirement
      - business_opportunity_freeze

  product.raw-to-src:
    path: spec-global/departments/product/workflows/templates/raw-to-src/v1/workflow.yaml
    kind: l3_workflow_template
    description: "Product L3 - raw input to SRC"
    load_spec_as_params: true
    required_params: []
    optional_params:
      - adr
      - raw_requirement
      - business_opportunity
      - business_opportunity_freeze

  product.src-to-epic:
    path: spec-global/departments/product/workflows/templates/src-to-epic/v1/workflow.yaml
    kind: l3_workflow_template
    description: "Product L3 - frozen SRC to EPIC"
    load_spec_as_params: true
    required_params: []
    optional_params:
      - src
      - source_freeze
      - source_freeze_ref

  product.epic-to-feat:
    path: spec-global/departments/product/workflows/templates/epic-to-feat/v1/workflow.yaml
    kind: l3_workflow_template
    description: "Product L3 - EPIC to FEAT"
    load_spec_as_params: true
    required_params:
      - epic_freeze
    optional_params: []

  product.feat-to-delivery-prep:
    path: spec-global/departments/product/workflows/templates/feat-to-delivery-prep/v1/workflow.yaml
    kind: l3_workflow_template
    description: "Product L3 - FEAT to delivery prep"
    load_spec_as_params: true
    required_params:
      - feat_freeze
    optional_params: []

  product.requirement-chain-validation:
    path: spec-global/departments/product/workflows/templates/requirement-chain-validation/v1/workflow.yaml
    kind: l3_workflow_template
    description: "Product L3 - requirement chain validation before final handoff"
    load_spec_as_params: true
    required_params: []
    optional_params:
      - source_freeze
      - epic_freeze_bundle
      - feat_freeze_bundle
      - delivery_prep_bundle

  product.feat-to-release:
    path: spec-global/departments/product/workflows/templates/feat-to-release/v1/workflow.yaml
    kind: l3_workflow_template
    description: "Product L3 - FEAT bundle to RELEASE draft"
    load_spec_as_params: true
    required_params:
      - feat_bundle_refs
      - feat_bundle_path
      - release_id
    optional_params:
      - release_type
      - release_window_start
      - release_window_end
      - release_version

  product.feat-to-plan:
    path: spec-global/departments/product/workflows/templates/feat-to-plan/v1/workflow.yaml
    kind: l2_workflow_template
    description: "Product L2 - FEAT bundle to RELEASE / DEVPLAN / TESTPLAN bridge"
    load_spec_as_params: true
    required_params:
      - feat_bundle_refs
      - feat_bundle_path
      - release_id
      - task_bundle_paths
      - feat_acceptance_criteria
      - tech_specs_paths
    optional_params:
      - release_type
      - release_window_start
      - release_window_end
      - tech_lead
      - qa_lead
      - release_manager

  dev.release-to-devplan:
    path: spec-global/departments/dev/workflows/templates/release-to-devplan/v1/workflow.yaml
    kind: l3_workflow_template
    description: "Dev L3 - RELEASE draft to DEVPLAN freeze"
    load_spec_as_params: true
    required_params:
      - release_ref
      - release_draft_path
      - task_bundle_paths
      - feat_bundle_refs
    optional_params:
      - tech_lead
      - release_manager

  qa.release-to-testplan:
    path: spec-global/departments/qa/workflows/templates/release-to-testplan/v1/workflow.yaml
    kind: l3_workflow_template
    description: "QA L3 - RELEASE draft to TESTPLAN freeze"
    load_spec_as_params: true
    required_params:
      - release_ref
      - release_draft_path
      - feat_acceptance_criteria
      - tech_specs_paths
    optional_params:
      - qa_lead
      - release_manager
      - test_environment

  # ========== Office 工作流 ==========
  office.workspace-cleanup:
    path: spec-global/departments/office/workflows/workspace-cleanup/v1/workflow.yaml
    description: "工作区整理工作流"
    required_params: []
    optional_params:
      - workspace_path
      - author_name
      - exclude_patterns
      - remote
      - branch
      - skip_push
