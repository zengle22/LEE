version: "1.0"

workflows:
  dev.feature:
    path: spec-global/departments/dev/workflows/feature/v1/workflow.yaml
    description: "开发特性工作流"
    required_params:
      - spec

  dev.bugfix:
    path: spec-global/departments/dev/workflows/bug-fix/v1/workflow.yaml
    description: "Bug 修复工作流"
    required_params:
      - spec

  qa.regression:
    path: spec-global/departments/qa/workflows/regression/v1/workflow.yaml
    description: "回归测试工作流"
    required_params:
      - spec

  devops.deploy:
    path: spec-global/departments/devops/workflows/deploy/v1/workflow.yaml
    description: "部署工作流"
    required_params:
      - env
      - version

  # ========== QA 新工作流 ==========
  qa.test-set-production:
    path: spec-global/departments/qa/workflows/test-set-production/v1/workflow.yaml
    description: "生产 Test Set 设计资产"
    required_params:
      - module
      - requirement_doc
    optional_params:
      - tech_design

  qa.test-plan-execution:
    path: spec-global/departments/qa/workflows/test-plan-execution/v1/workflow.yaml
    description: "执行 Test Plan"
    required_params:
      - test_plan_id
      - build_version
      - build_commit
    optional_params:
      - environment

  # ========== Office 工作流 ==========
  office.workspace-cleanup:
    path: spec-global/departments/office/workflows/workspace-cleanup/v1/workflow.yaml
    description: "工作区整理工作流"
    required_params: []
    optional_params:
      - workspace_path
      - author_name
      - exclude_patterns
      - remote
      - branch
      - skip_push
