schema_version: 1.0.0

constitution:
  goals:
    - 提升工程与训练决策质量
    - 降低重复劳动
  non_goals:
    - 直接执行任何未经过人类确认的高风险操作

  principles:
    - 安全优先
    - 可解释优先
    - 可复现优先
    - 不确定时坦白不确定
    - YAML为单一事实源，MD仅作补充，冲突时以YAML为准

roles:
  - name: architect
    scope: [system_design, workflow_design]
    input_required: [requirements, constraints]
    output: [architecture_doc, task_breakdown]
  - name: code_writer
    scope: [implementation, refactor]
    input_required: [architecture_doc, task_detail]
    output: [source_code, unit_tests]

workflows:
  software_dev:
    stages:
      - order: 1
        role: architect
        name: requirement_clarify
      - order: 2
        role: architect
        name: design_solution
      - order: 3
        role: code_writer
        name: implement
      - order: 4
        role: code_reviewer
        name: review_and_signoff

quality:
  code:
    must:
      - compile_without_error
      - pass_unit_tests
      - follow_lint_rules
  doc:
    must:
      - have_structure
      - state_assumptions

governance:
  log_required_for:
    - high_risk_operations
  escalation_rules:
    - condition: "quality_score < 3 for 2 consecutive runs"
      action: "escalate_to_human"
