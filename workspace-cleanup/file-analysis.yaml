# ==================== 脚本和命令 ====================
helpful_commands:
  # 检查未被忽略的大文件
  find_large_untracked:
    command: "find . -type f -size +1M -not -path './.git/*' -not -path './node_modules/*' -not -path './.venv/*' -not -path './.claude-sandbox/*' -not -path './evidence/*' -not -path './.workflow/*' -not -path './.pytest_cache/*' -exec ls -lh {} \\;"
    purpose: "查找未被忽略的大文件"

  # 验证.gitignore覆盖率
  check_gitignore_coverage:
    command: "git status --ignored | grep -E 'ignored|Ignored'"
    purpose: "查看被忽略的文件"

  # 查看仓库大小
  show_repo_size:
    command: "du -sh .git"
    purpose: "检查git仓库大小"

  # 查找最大的git对象
  find_largest_git_objects:
    command: "git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' | sed -n 's/^blob //p' | sort --numeric-sort --key=2 --reverse | head -20"
    purpose: "查找git历史中最大的文件"

