[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lee-framework"
version = "0.1.0"
description = "通用 AI 工作流编排框架"
readme = "README.md"
requires-python = ">=3.8"
# 注意：MetaGPT 引擎需要 Python 3.9-3.10（faiss-cpu 依赖限制）
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    # Orchestrator v3.0 依赖
    "aiosqlite>=0.19",
    "jinja2>=3.1",
    "click>=8.1",
    "prompt_toolkit>=3.0",  # Chat command REPL
]

[project.optional-dependencies]
# MetaGPT 引擎（可选依赖）
metagpt = [
    "metagpt>=0.8.0,<0.9.0",  # 支持 0.8.x 系列（最新：0.8.2）
]

# 开发依赖
dev = [
    "lee-framework[metagpt]",
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

# 完整依赖（包含所有引擎）
all = [
    "lee-framework[metagpt]",
]

[project.scripts]
lee = "lee.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flowcore*", "lee*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".DS_Store", ".git", ".workflow", "__pycache__", "node_modules", ".venv", "*.egg-info"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = "."

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 暂时关闭，逐步开启
