kind: validation_checklist
version: "1.0"
id: shared_input_validation_checklist
status: frozen

checks:
  - id: formal_ssot_id_present
    field: formal_ssot_id
    rule: required
  - id: formal_ssot_id_format
    field: formal_ssot_id
    rule: canonical_ssot_pattern
  - id: source_refs_present
    field: source_refs
    rule: min_items_1
  - id: source_refs_format
    field: source_refs
    rule: canonical_ref_pattern
  - id: governing_adrs_present
    field: governing_adrs
    rule: min_items_1
  - id: governing_adrs_format
    field: governing_adrs
    rule: adr_pattern
  - id: repo_context_present
    field: repo_context
    rule: required
  - id: repo_context_branch_rule
    field: repo_context.branch
    rule: allowed_execution_branch
