# TASK-SRC-058-005: Smoke Gate 可观测性与验证测试套件
# Parent: FEAT-SRC-058-005
# Workstream: observability-validation
# Responsible Role: qa-validation-engineer

task_id: TASK-SRC-058-005
title: Smoke Gate 可观测性与验证测试套件
objective: 实现完整的可观测性体系和测试验证套件，确保 Dev Smoke Gate 质量

description: |
  建立 Dev Smoke Gate 的可观测性和验证能力：
  1. 执行日志：结构化日志 (info/warn/error)，支持级别过滤和下载
  2. 进度监控：实时上报已执行/总数、当前通过率、预计剩余时间
  3. 证据包：自动打包截图、日志、网络请求记录，目录结构规范
  4. 测试套件：P0/P1 用例覆盖核心流程 (环境检测、执行、重试、Gate 判定)
  5. Flaky 验证：模拟 Flaky 场景验证检测准确率
  6. 超时处理：30 分钟阈值警告，支持继续等待或终止

  测试范围：单元测试 (phases)、集成测试 (5 Phase 流程)、端到端测试 (完整 Merge 流程)

source_feat: FEAT-SRC-058-005
workstream: observability-validation
