  - feat: FEAT-SRC-058-005
    ac: AC-OBS-001
    description: 结构化日志支持 info/warn/error 级别过滤
  - feat: FEAT-SRC-058-005
    ac: AC-OBS-002
    description: 实时进度监控准确显示已执行/总数和通过率
  - feat: FEAT-SRC-058-005
    ac: AC-OBS-003
    description: 证据包目录结构符合规范，包含截图/日志/网络记录
  - feat: FEAT-SRC-058-005
    ac: AC-OBS-004
    description: P0/P1 测试用例覆盖核心流程，单元测试通过率 >= 90%
  - feat: FEAT-SRC-058-005
    ac: AC-OBS-005
    description: Flaky 检测准确率验证通过 (模拟 5 次执行 pass_rate < 80%)

