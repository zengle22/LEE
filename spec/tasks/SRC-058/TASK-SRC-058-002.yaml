task_id: TASK-SRC-058-002
title: Dev Smoke 执行引擎 Runtime 实现
objective: 实现 5 Phase Dev Smoke 执行引擎，包括环境检测、用例生成、并行执行、结果判定和证据打包

description: |
  基于架构规范实现 Dev Smoke L3 执行器的核心 runtime：
  1. Phase 1 - Env Check: OS 检测、路径分隔符、环境变量校验、Docker 配置 (可选)
  2. Phase 2 - Case Gen: 从 FEAT 导入 AC、生成 Test Set 模板、优先级映射 (P0/P1/P2)
  3. Phase 3 - Execution: pytest + pytest-xdist 并行执行 (默认 4 worker)、实时进度上报
  4. Phase 4 - Result Judgment: 通过率计算、Flaky 检测 (5 次执行 pass_rate < 80%)、Gate 判定
  5. Phase 5 - Evidence Pack: 日志打包、截图收集、证据目录结构生成

  技术栈：pytest >= 7.0, pytest-xdist >= 3.0, playwright >= 1.40, psutil >= 5.9

source_feat: FEAT-SRC-058-002
