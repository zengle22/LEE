task_id: TASK-SRC-058-003
title: Test Set 资产管理与 Flaky Registry 实现
objective: 实现单一 Test Set YAML 资产结构和 Flaky Registry 治理能力

description: |
  实现 Dev 和 QA 共享的 Test Set 资产管理系统：
  1. Test Set YAML 结构：包含 FEAT 关联、AC 映射、Priority 字段 (P0/P1/P2)
  2. Flaky Registry: 记录 Flaky Test ID、失败模式、通过率趋势、技术债务状态
  3. 优先级筛选：Dev Smoke 默认执行 P0+P1，QA 回归执行全量
  4. Flaky 标记接口：支持手动/自动标记，关联技术债务工单
  5. Test Set 版本管理：支持从 FEAT 版本派生 Test Set 版本

  数据结构：test_set.yaml (用例列表 + 优先级), flaky_registry.yaml (Flaky 记录 + 债务追踪)

