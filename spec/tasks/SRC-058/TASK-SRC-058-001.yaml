task_id: TASK-SRC-058-001
title: Dev Smoke Gate 架构规范与契约定义
objective: 定义 Dev Smoke Gate 的整体架构、Gate 类型、状态机和契约边界

description: |
  基于 ADR-023 和 TECH-SRC-058-001，完成以下规范定义：
  1. 四层架构边界 (Merge Gate Layer、Smoke Gate Layer、Dev Smoke Execution Layer、Test Asset Layer)
  2. Gate 状态机 (pending/running/passed/failed/flaky)
  3. Auto Gate 判定契约 (pass_rate/coverage/execution_time 阈值)
  4. 5 Phase 执行流程契约 (Env Check → Case Gen → Execution → Result Judgment → Evidence Pack)
  5. Test Set 资产结构 (单一 Test Set + Flaky Registry + Priority 字段)

