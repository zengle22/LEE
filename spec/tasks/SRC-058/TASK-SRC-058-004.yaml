task_id: TASK-SRC-058-004
title: Merge Gate 集成与 Git Hook 实现
objective: 将 Dev Smoke Gate 集成到 Merge 流程，实现 Git Hook 和 PR Status API

description: |
  实现 Merge Gate Layer，将 Dev Smoke 作为 blocker 门禁集成到 merge 流程：
  1. Git Hook: pre-merge hook 自动触发 Dev Smoke 执行
  2. PR Status API: 上报 Gate 状态 (pending/running/passed/failed/flaky) 到 Git 平台
  3. Merge Blocker: Gate failed 时阻塞 merge，Gate flaky 时允许 merge 但生成技术债务
  4. Gate 状态指示器：在 MR 创建页面显示 Smoke Gate 初始状态 (pending)
  5. CLI 手动触发：支持开发者手动执行 `lee dev-smoke --mr <id>`
  6. CI 兜底：本地 Gate 跳过时，CI 流水线强制执行

  技术集成：Git Hooks API, GitHub/GitLab Status API, FastAPI >= 0.100 (Gate API)

source_feat: FEAT-SRC-058-004
