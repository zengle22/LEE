# TASK-FEAT-TEST-001-002: 验证码登录前端页面实现

## 1. 任务描述

实现验证码登录前端页面和交互逻辑。

## 2. 验收标准

- [ ] 手机号输入框格式验证
- [ ] 发送验证码按钮倒计时逻辑
- [ ] 验证码输入框自动聚焦
- [ ] 登录成功后跳转首页
- [ ] 错误提示友好
- [ ] 响应式布局

## 3. 技术实现要点

### 3.1 组件结构

```tsx
<VerificationCodeLogin>
  <PhoneInput />
  <SendCodeButton countdown={60} />
  <CodeInput length={6} />
  <LoginButton />
</VerificationCodeLogin>
```

### 3.2 状态管理

```tsx
const [phone, setPhone] = useState('');
const [code, setCode] = useState('');
const [countdown, setCountdown] = useState(0);
const [loading, setLoading] = useState(false);
```

