- [ ] 通过端到端测试

## 3. 技术实现要点

### 3.1 统一入口命令

```python
@cli.command("execute")
@click.option("--plan", required=True)
def execute(plan: str):
    """统一执行入口"""
    plan_obj = registry.get(plan)
    if plan_obj.ssot_type == "devplan":
        execute_devplan(plan_obj)
    elif plan_obj.ssot_type == "testplan":
        execute_testplan(plan_obj)
```

