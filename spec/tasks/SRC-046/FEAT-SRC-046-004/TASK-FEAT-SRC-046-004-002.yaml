编写 bugfix 证据归属与执行承诺区分指南，明确两类文档的位置和用途。

## 2. 验收标准

- [ ] 证据归属位置明确
- [ ] 执行承诺位置明确
- [ ] 两者区分清晰
- [ ] 获得 tech_lead 批准

## 3. 技术实现要点

### 3.1 证据归属

```yaml
