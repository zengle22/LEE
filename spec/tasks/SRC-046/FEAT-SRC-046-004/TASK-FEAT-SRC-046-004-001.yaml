定义缺陷回流路径规格，确保 bugfix 可追溯至对应交付版本并重新进入交付轴闭环。

## 2. 验收标准

- [ ] 缺陷回流路径清晰可执行
- [ ] bugfix 与交付版本关联规则明确
- [ ] 与现有 bug 管理流程兼容
- [ ] 获得 qa_lead 批准

## 3. 技术实现要点

### 3.1 回流路径定义

```yaml
bugfix_route:
  discovery: QA 测试发现 bug
  triage: bug-triage 评估严重性
  assignment: 分配至对应研发
  fix: 研发修复并提交
  verification: QA 验证修复
  closure: 关闭并记录
  delivery: 纳入下一版本交付
```

