### 3.2 派生逻辑

```python
def derive_plans(self, release_id: str) -> DerivePlansResult:
    # 1. 获取 RELEASE 对象
    release = self.registry.get(release_id)

    # 2. 遍历 FEAT@version
    for feat_ref in release.derived_from_ids:
        # 3. 创建 DEVPLAN slice
        devplan_slices.append(create_slice(feat_ref))

        # 4. 创建 TESTPLAN slice
        testplan_slices.append(create_test_slice(feat_ref))

    # 5. 生成对象并返回
    return DerivePlansResult(devplan, testplan)
```

