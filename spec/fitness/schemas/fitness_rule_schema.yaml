# Fitness Rule Schema
# ADR-024 定义的 Fitness Rule 标准结构
#
# 每条规则必须包含以下 8 个核心字段:
# - rule_id: 稳定唯一标识
# - dimension: 所属维度 (5 个 P0 dimension 之一)
# - rule_class: 规则类型 (hard_gate | quality_signal)
# - severity: 严重程度 (blocker | critical | warning | info)
# - description: 规则描述
# - execution_method: 执行方法定义
# - evidence_binding: 证据绑定
# - success_criteria: 成功标准

rule_schema:
  type: object
  required:
    - rule_id
    - dimension
    - rule_class
    - severity
    - description
    - execution_method
    - evidence_binding
    - success_criteria

  properties:
    rule_id:
      type: string
      pattern: "^FCR-[0-9]{3}$"
      description: "Fitness Check Rule ID - 稳定唯一标识"
      example: "FCR-001"

    dimension:
      type: string
      enum:
        - contract_consistency
        - testability
        - integration_closure
        - evidence_completeness
        - path_governance
      description: "所属 P0 Dimension"

    rule_class:
      type: string
      enum:
        - hard_gate
        - quality_signal
      description: |
        规则类型:
        - hard_gate: 任一失败都阻断当前完成主张
        - quality_signal: 进入评分、警告或趋势观察，不单独定义完成

    severity:
      type: string
      enum:
        - blocker
        - critical
        - warning
        - info
      description: |
        严重程度:
        - blocker: 最高优先级，必须修复
        - critical: 高优先级，应修复
        - warning: 中优先级，建议修复
        - info: 低优先级，信息提示

    description:
      type: string
      minLength: 10
      description: "规则描述 - 清晰说明检查内容"
      example: "Contract parity check - API 实现与冻结合同一致"

    execution_method:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - contract_diff
            - coverage_check
            - test_execution_check
            - integration_contract_verify
            - evidence_pack_audit
            - canonical_path_verify
            - forbidden_path_verify
          description: "执行方法类型"
        config:
          type: object
          description: "执行方法配置参数"
          additionalProperties: true

    evidence_binding:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: "证据绑定类型"
          example: "git_diff_against_frozen_contract"
        config:
          type: object
          description: "证据绑定配置参数"
          additionalProperties: true

    success_criteria:
      type: array
      items:
        type: string
        minLength: 10
      description: "成功标准列表 - 每条为可验证的陈述"
      minItems: 1
      example:
        - "所有 API 端点与冻结合同一致"
        - "请求/响应字段无遗漏无多余"
        - "数据类型和约束匹配合同定义"

    failure_message:
      type: string
      description: "失败时的错误消息模板"

    rollback_target:
      type: string
      description: "失败时的回滚目标步骤"
      example: "contract_design"
