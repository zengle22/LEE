---
rule_id: FCR-003
dimension: integration_closure
rule_class: hard_gate
severity: critical
description: "Integration test execution - 集成测试已执行且通过"

execution_method:
  type: test_execution_check
  config:
    test_type: "integration"
    test_pattern: "tests/**/test_integration_*.py"
    required_tags: ["integration", "api"]
    timeout_seconds: 600
    fail_fast: false

evidence_binding:
  type: test_results
  config:
    junit_xml_path: ".workflow/fitness/integration_test_results.xml"
    test_output_path: ".workflow/fitness/integration_test_output.txt"
    required_pass_rate: 100

success_criteria:
  - "所有标记为 integration 的测试用例已执行"
  - "集成测试通过率 100%"
  - "API 契约测试全部通过"
  - "跨模块调用测试全部通过"
  - "无跳过 (skipped) 的关键测试用例"

failure_message: |
  集成测试未全部通过。

  执行统计:
  - 总用例数：{{ total_tests }}
  - 通过：{{ passed_tests }}
  - 失败：{{ failed_tests }}
  - 跳过：{{ skipped_tests }}

  失败用例:
  {{ failed_test_details }}

  请修复集成问题后重新执行。

rollback_target: integration
---

# FCR-003 执行说明
#
# 1. 扫描并识别集成测试用例
# 2. 执行集成测试套件
# 3. 解析 JUnit XML 结果
# 4. 统计通过率和失败详情
# 5. 通过率未达 100% 则失败
#
# 适用嵌入点:
# - Dev L2 (Smoke 前置): 验证集成测试完成
# - QA L2 (Test Report 前): 验证测试执行完整性
