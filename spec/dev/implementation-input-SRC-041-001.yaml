# SRC-041 Gate Dual-Axis Model Implementation Input
# 用于实现 Gate 双轴模型的工作流输入规格

# ========== 必填字段 (Required Fields) ==========

# 正式 SSOT ID (指向冻结的 FEAT)
formal_ssot_id: FEAT-SRC-041-001

# 源引用 (追溯链)
source_refs:
  - SRC-041                      # 原始需求
  - EPIC-SRC-041-016             # EPIC
  - FEAT-SRC-041-001             # 特性规格 (冻结)
  - TECH-FEAT-SRC-041-001        # 技术架构 (冻结)
  - CONTRACT-GATE-DUAL-AXIS-20260316-001  # 协议设计 (冻结)

# 管理的 ADRs
governing_adrs:
  - ADR-001   # SSOT 交付链硬治理
  - ADR-008   # Dev 部门 SSOT 对齐与工作流重构
  - ADR-017   # Gate 治理规范化

# 技术规格引用
tech_spec_ref: spec/tech/SRC-041/TECH-FEAT-SRC-041-001__gate-dual-axis-tech-design.md

# 协议冻结引用
contract_freeze_ref: dev/src/api-contract/modules/gate-dual-axis/v1/api-contract.yaml

# 后端仓库路径 (LEE 项目本身)
repo_backend: .

# ========== 可选字段 (Optional Fields) ==========

# 验收简报引用 (可选)
# acceptance_brief_ref: spec/acceptance/ACCEPTANCE-SRC-041-001.md

# 仓库上下文 (可选)
repo_context:
  repo_id: LEE
  type: workflow_orchestration
  stack: python

# 决策约束 (可选)
decision_constraints:
  - "必须保持向后兼容，现有 Gate 审批记录不能破坏"
  - "枚举值使用 snake_case 命名"
  - "所有新增字段必须有类型注解"
  - "Store 层和 Runner 层双重验证组合规则"

# 架构约束 (可选)
architecture_constraints:
  - "枚举定义在 models.py 中"
  - "数据模型扩展在 GateApproval dataclass 中"
  - "验证逻辑在 store.py 和 gate_runner.py 中实现"

# ========== 实现范围 (Implementation Scope) ==========

implementation_scope:
  # 需要修改的文件列表
  target_files:
    - src/lee/orchestrator/storage/models.py       # 添加枚举和双轴字段
    - src/lee/orchestrator/storage/store.py        # 添加验证逻辑
    - src/lee/orchestrator/execution/runners/gate_runner.py  # 双轴逻辑
    - src/lee/cli/commands/gates_cmd.py            # CLI 展示双轴字段

  # 实现内容
  deliverables:
    - "GatePurpose 枚举 (REVIEW, APPROVAL)"
    - "GateDecisionMode 枚举 (AUTO, CONDITIONAL_HUMAN, HUMAN_REQUIRED)"
    - "GateApproval 模型扩展 (purpose, decision_mode, legacy_gate_type)"
    - "validate_purpose_mode_combination 函数"
    - "SQLiteStore 方法增强"
    - "HumanGateRunner 双轴逻辑"
    - "CLI --show-dual-axis 选项"

  # 测试要求
  test_requirements:
    - "枚举值验证测试"
    - "组合验证测试 (APPROVAL+AUTO 非法等)"
    - "Store 层创建/获取/更新测试"
    - "Runner 层解析和验证测试"
    - "CLI 展示测试"
