## 3. 交付轴闭环

### 3.1 闭环验证

```yaml
closure_validation:
  checks:
    - name: bugfix_evidence_complete
      rule: "bugfix 证据完整"
      required: true
    - name: delivery_version_assigned
      rule: "已分配至交付版本"
      required: true
    - name: fix_verified
      rule: "修复已验证"
      required: true
    - name: blocker_cleared
      rule: "blocker 已清零"
      required: true
```

