## 4. 证据归属与执行承诺

### 4.1 证据归属

```yaml
evidence_location:
  bug_report: "tests/bugs/{bug_id}.md"
  test_result: "tests/results/{bug_id}-fix-verification.md"
  screenshots: "docs/evidence/{bug_id}/"
```

### 4.2 执行承诺

```yaml
commitment_location:
  fix_plan: "spec/bugfixes/{bug_id}-fix-plan.md"
  delivery_commitment: "spec/releases/{release_id}/bugfix-commitments.md"
```

