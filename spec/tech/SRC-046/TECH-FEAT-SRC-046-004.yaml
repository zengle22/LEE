# TECH-FEAT-SRC-046-004: 缺陷回流路径与 bugfix 交付轴闭环技术设计

## 1. 架构设计

### 1.1 缺陷回流组件图

```
┌─────────────┐     ┌─────────────┐     ┌─────────────┐
│   Bug       │────▶│   Fix       │────▶│  Verify     │
│  Discovery  │     │  Execution  │     │  & Close    │
└─────────────┘     └─────────────┘     └─────────────┘
                           │
                           ▼
┌─────────────┐     ┌─────────────┐     ┌─────────────┐
│  Delivery   │◀────│   Release   │◀────│   Bugfix    │
│    Axis     │     │  Assignment │     │  Evidence   │
└─────────────┘     └─────────────┘     └─────────────┘
```

### 1.2 技术栈

| 组件 | 技术选型 |
|------|----------|
| Bug 跟踪 | YAML + Git |
| 版本关联 | Python + SQLite |
| 交付验证 | Python + Pydantic |

## 2. 缺陷回流路径

### 2.1 回流状态机

```yaml
bug_lifecycle:
  states:
    - open
    - triaged
    - in_fix
    - fixed
    - verified
    - closed
    - waived
  transitions:
    - from: open
      to: triaged
      actor: triage_lead
    - from: triaged
      to: in_fix
      actor: dev_assignee
    - from: in_fix
      to: fixed
      actor: dev_assignee
    - from: fixed
      to: verified
      actor: qa_verifier
    - from: verified
      to: closed
      actor: qa_lead
```

