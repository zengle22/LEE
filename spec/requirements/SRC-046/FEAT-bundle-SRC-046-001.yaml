# FEAT Bundle for EPIC-SRC-046-001
# 交付轴 workflow 化治理与发布闭环建设

epic_ref: EPIC-SRC-046-001

feat_specs:
  - feat_id: FEAT-SRC-046-001
    title: 交付主链建立与对象绑定一致性治理
    goal: 建立以 RELEASE 为起点的交付主链，确保交付对象绑定一致性和 scope 完整性
    user_value: 确保所有正式发布版本通过统一的交付主链进行交付，交付链上各对象 (RELEASE/DEVPLAN/TESTPLAN/TASK) 的绑定关系可追溯、可验证
    inputs:
      - 已冻结的 FEAT 对象 (FEAT@version)
      - ADR-001 治理基线
      - 现有 RELEASE/DEVPLAN/TESTPLAN/TASK 对象基础
    input_contract:
      required_artifacts:
        - FEAT (frozen)
        - ADR-001 (frozen)
      required_fields:
        - FEAT.id
        - FEAT.version
        - FEAT.acceptance_criteria
      consumption_rules:
        - RELEASE 必须 pin 住已冻结的 FEAT@version
        - derived_from_ids 必须包含 id 和 version 字段
    processing:
      - 创建 RELEASE 对象并初始化 scope
      - Pin 住 FEAT@version 到 derived_from_ids
      - 执行 scope validate 校验
      - 执行 scope freeze 冻结范围
      - 派生 DEVPLAN 和 TESTPLAN 骨架
    outputs:
      - REL-{version} (RELEASE 对象，scope_frozen 状态)
      - DEVPLAN-REL-{version} (开发计划)
      - TESTPLAN-REL-{version} (测试计划)
    acceptance_criteria:
      - 100% 的正式发布版本通过交付主链完成交付
      - 交付对象绑定关系可追溯、可验证
      - RELEASE 为唯一起点，无其他入口
    acceptance_checks:
      - id: AC-001
        scenario: 创建 RELEASE 并绑定 FEAT 版本
        given: 存在已冻结的 FEAT-XXX@vN 对象
        when: 执行 release-cut 命令创建工作流
        then: 生成 REL-{version} 对象，derived_from_ids 正确 pin 住 FEAT@version
        trace_hints: [TASK, TESTSET, TECH]
      - id: AC-002
        scenario: 校验交付对象绑定一致性
        given: RELEASE 已绑定多个 FEAT@version
        when: 执行 release-check 校验
        then: 每个 FEAT 都被 DEVPLAN 和 TESTPLAN 覆盖，无遗漏
        trace_hints: [TASK, TESTSET]
      - id: AC-003
        scenario: 验证 scope 冻结
        given: RELEASE 已完成范围绑定
        when: 执行 scope freeze 操作
        then: RELEASE 状态变为 scope_frozen，scope_frozen_at 字段被填充
        trace_hints: [TASK, TESTSET, TECH]
    dependencies: []
    non_goals:
      - 不涉及技术架构重构
      - 不包含研发排期管理
      - 不重新发明 ADR-001 之外的三轴模型
    priority: P0
    delivery_slice: governance-core
    lifecycle_status: draft
    derived_object_expectations:
      task_required: true
      testset_required: true
      testset_owner: qa
      qa_seed_required: true
    source_refs:
      - EPIC-SRC-046-001#scope
      - ADR-001#15-4-typical-l1-workflow
    ssot:
      identity_kind: ssot
      ssot_type: FEAT
      parent: EPIC-SRC-046-001
      derived_from: EPIC-SRC-046-001

  - feat_id: FEAT-SRC-046-002
    title: 发布关闭标准统一与缺陷回流路径治理
    goal: 统一缺陷回流路径和发布关闭标准，形成可审计的治理闭环
    user_value: 所有发布关闭操作遵循统一治理路径，无例外通道，100% 的 bugfix 可明确归属到对应交付版本并重新进入交付轴闭环
    inputs:
      - 已冻结的 RELEASE 对象 (scope_frozen 状态)
      - 已完成的 TESTPLAN 对象
      - BUG 对象 (found_in_release 指向当前 RELEASE)
    input_contract:
      required_artifacts:
        - RELEASE (scope_frozen)
        - TESTPLAN (completed)
        - BUG (active)
      required_fields:
        - RELEASE.id
        - RELEASE.scope_frozen_at
        - BUG.severity
        - BUG.bug_state
      consumption_rules:
        - blocker bug 必须 closed 或 waived 才能发布
        - waived bug 必须有 waiver_reason 和 waiver_approved_by
    processing:
      - 校验 blocker bug 状态
      - 校验发布报告完整性 (release/test_execution/go_no_go)
      - 执行 release-check 聚合校验
      - 执行 release-close 关闭发布
    outputs:
      - RELEASE 对象 (released 状态)
      - RELEASE_REPORT (发布报告)
      - GO_NO_GO_REPORT (发布判定报告)
    acceptance_criteria:
      - 所有发布关闭操作遵循统一治理路径
      - 无例外通道存在
      - 100% bugfix 可归属到交付版本并进入闭环
    acceptance_checks:
      - id: AC-001
        scenario: 执行 release-check 校验
        given: RELEASE 下存在 blocker bug
        when: 执行 release-check --enforce
        then: 校验失败，报错包含 blocker bug 未关闭信息
        trace_hints: [TASK, TESTSET, TECH]
      - id: AC-002
        scenario: 豁免 blocker bug
        given: 存在 blocker bug 需要豁免
        when: 设置 bug_state=waived 并填写 waiver_reason 和 waiver_approved_by
        then: release-check 可以通过，waiver 信息被记录
        trace_hints: [TASK, TESTSET]
      - id: AC-003
        scenario: 发布报告完整性校验
        given: RELEASE 准备关闭
        when: 执行 release-close
        then: 必须存在 report_kind=release/test_execution/go_no_go 三类报告
        trace_hints: [TASK, TESTSET]
    dependencies:
      - FEAT-SRC-046-001
    non_goals:
      - 不涉及技术架构重构
      - 不将 intake/workflow/schema 处理过程改写为正式业务目标
    priority: P0
    delivery_slice: governance-closeout
    lifecycle_status: draft
    derived_object_expectations:
      task_required: true
      testset_required: true
      testset_owner: qa
      qa_seed_required: true
    source_refs:
      - EPIC-SRC-046-001#scope
      - ADR-001#11-2-release
    ssot:
      identity_kind: ssot
      ssot_type: FEAT
      parent: EPIC-SRC-046-001
      derived_from: EPIC-SRC-046-001

  - feat_id: FEAT-SRC-046-003
    title: QA 执行入口与交付主链绑定收口
    goal: 明确 QA 与研发执行入口对正式交付主链的绑定关系，完成入口治理收口
    user_value: QA 执行入口与正式交付主链建立明确绑定关系，消除对分散命令和兼容入口拼接的依赖
    inputs:
      - 已冻结的 RELEASE 对象
      - 已生成的 TESTPLAN 对象
      - QA 执行入口现状说明
    input_contract:
      required_artifacts:
        - RELEASE (scope_frozen)
        - TESTPLAN (draft|committed)
      required_fields:
        - TESTPLAN.parent_id
        - TESTPLAN.derived_from_ids
      consumption_rules:
        - TESTPLAN 的 parent_id 必须指向 RELEASE
        - TESTPLAN 的 derived_from_ids 必须包含 FEAT 和 TESTSET
    processing:
      - 校验 QA 入口与交付主链的绑定关系
      - 清理独立于交付主链之外的 QA 执行路径
      - 建立 QA 活动追溯机制
    outputs:
      - TESTPLAN 对象 (committed 状态)
      - QA 入口绑定关系说明
    acceptance_criteria:
      - QA 入口收口完成
      - 执行入口与交付主链绑定关系清晰可查
      - 无独立于交付主链之外的 QA 执行路径
    acceptance_checks:
      - id: AC-001
        scenario: 校验 TESTPLAN 绑定关系
        given: 存在 TESTPLAN 对象
        when: 执行 plan-check 校验
        then: TESTPLAN.parent_id 必须指向有效的 RELEASE 对象
        trace_hints: [TASK, TESTSET]
      - id: AC-002
        scenario: 校验 TESTPLAN 覆盖范围
        given: RELEASE 包含多个 FEAT@version
        when: 执行 plan-check --commit
        then: 每个 FEAT 都被 TESTPLAN 的 derived_from_ids 或 slices 覆盖
        trace_hints: [TASK, TESTSET]
    dependencies:
      - FEAT-SRC-046-001
    non_goals:
      - 不涉及技术架构重构
      - 不包含研发排期管理
      - 不涉及入口实现重构
    priority: P1
    delivery_slice: qa-entry-binding
    lifecycle_status: draft
    derived_object_expectations:
      task_required: true
      testset_required: true
      testset_owner: qa
      qa_seed_required: true
    source_refs:
      - EPIC-SRC-046-001#scope
      - ADR-001#15-8-feature-slice-提测规则
    ssot:
      identity_kind: ssot
      ssot_type: FEAT
      parent: EPIC-SRC-046-001
      derived_from: EPIC-SRC-046-001

  - feat_id: FEAT-SRC-046-004
    title: Bugfix 证据归属与执行承诺位置明确化
    goal: 区分 bugfix 的证据归属与执行承诺位置，将 bugfix 重新纳入交付轴治理闭环
    user_value: 100% 的 bugfix 可明确归属到对应交付版本并重新进入交付轴治理闭环
    inputs:
      - BUG 对象 (found_in_release 指向 RELEASE)
      - REPORT 对象 (测试报告)
      - TASK 对象 (修复任务)
    input_contract:
      required_artifacts:
        - BUG (active)
        - REPORT (test_execution)
        - TASK (doing|done)
      required_fields:
        - BUG.found_in_release
        - BUG.severity
        - BUG.source_report_id
        - TASK.implements
      consumption_rules:
        - BUG 必须通过 found_in_release 关联到 RELEASE
        - BUG 必须通过 source_report_id 追溯到测试报告
        - TASK 修复完成后必须更新 BUG 状态
    processing:
      - 明确 bugfix 的证据归属位置 (REPORT/EVI)
      - 明确 bugfix 的执行承诺位置 (TASK)
      - 将 bugfix 重新纳入交付轴闭环
    outputs:
      - BUG 对象 (closed|waived 状态)
      - BUGFIX_REPORT (修复报告)
      - 证据关联关系
    acceptance_criteria:
      - bugfix 的证据归属与执行承诺位置明确区分
      - 所有 bugfix 可明确归属到对应交付版本
      - bugfix 重新进入交付轴闭环
    acceptance_checks:
      - id: AC-001
        scenario: 创建 BUG 对象
        given: 测试执行发现缺陷
        when: 创建 BUG 对象并设置 found_in_release 和 source_report_id
        then: BUG 可追溯到 RELEASE 和测试报告
        trace_hints: [TASK, TESTSET]
      - id: AC-002
        scenario: Bugfix 任务执行
        given: BUG 状态为 open/triaged
        when: 创建 TASK 执行修复并设置 TASK.implements 指向 BUG
        then: TASK 完成后 BUG 状态可更新为 in_fix/in_verify
        trace_hints: [TASK, TECH]
      - id: AC-003
        scenario: Bugfix 闭环校验
        given: BUG 修复完成
        when: 执行 release-check
        then: BUG.bug_state 必须为 closed 或 waived，否则阻断发布
        trace_hints: [TASK, TESTSET]
    dependencies:
      - FEAT-SRC-046-002
    non_goals:
      - 不涉及技术架构重构
      - 不涉及缺陷管理系统改造
      - 不改变 bugfix 本质属性
    priority: P1
    delivery_slice: bugfix-governance
    lifecycle_status: draft
    derived_object_expectations:
      task_required: true
      testset_required: true
      testset_owner: qa
      qa_seed_required: true
    source_refs:
      - EPIC-SRC-046-001#scope
      - ADR-001#11-3-bug
    ssot:
      identity_kind: ssot
      ssot_type: FEAT
      parent: EPIC-SRC-046-001
      derived_from: EPIC-SRC-046-001
