## Integration Scope
验证 Artifact Placement Reviewer Agent 的以下集成场景：

1. **CLI 集成**: `lee audit` 命令能否正常调用
2. **API 集成**: Python 模块能否被其他 workflow 导入调用
3. **Manifest 集成**: 能否正确读取 placement manifest

